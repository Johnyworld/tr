- id: l_watcher_start
  beliefs:
    - fact: 등대지기회는 밤마다 등대를 밝혀 바다의 배를 부른다. 불을 보고 온 배는 일단 받는다.
      source: seen
      accuracy: exact
    - fact: 갈대 습지의 갯벌 길은 썰물 때만 드러난다. 물때표 없이 건너다 갇힌 사람이 있다.
      source: report
      accuracy: exact
    - fact: 검은돛 선단은 겨울마다 섬 하나를 턴다고 한다.
      source: rumor
      accuracy: approximate
    - fact: 옛 통조림 공장에는 아직 뜯지 않은 상자가 있다고 한다.
      source: rumor
      accuracy: approximate
- id: fl_rower_start
  beliefs:
    - fact: 선단의 몫은 공대로 선장이 나눈다. 갑판장 몫이 유난히 크다는 말이 있다.
      source: report
      accuracy: exact
    - fact: 선장은 겨울을 날 항구로 여객선 부두를 노린다.
      source: rumor
      accuracy: exact
    - fact: 등대지기회는 불을 보고 온 배를 받아 주지만, 선단의 배는 쏜다고 한다.
      source: rumor
      accuracy: approximate
    - fact: 소금밭 사람들은 누구에게나 판다. 염전 둑만 건드리지 않으면.
      source: report
      accuracy: exact
