# 연고 틀 (기획서 7.9): 떠돌이로 시작할 때 고르는 가족·오랜 짝 (custom_start.kin)
# 처음부터 서로 이름을 알고 함께 다닌다 (연고). 잠시 떨어져 있을 수 있다 (companion_part)

- id: kin_young
  label: 어린 가족 (동생·자식)
  rank: loner
  age: [8, 14]
  looks:
    - 어른 점퍼를 소매 걷어 입은 아이. 당신의 소매 끝을 자주 붙잡는다
    - 머리를 짧게 자른 마른 아이. 웃을 때 앞니 하나가 비어 있다
  stats: { strength: [-1, -1], vitality: [-1, 0], senses: [0, 1], agility: [0, 1] }
  skills: { stealth: 1, scavenge: 1 }
  traits: [timid, curious, frail, light_eater, eager]
  trait_count: 2
  inventory:
    - { item: dry_ration, chance: 0.3 }
  values: { mercy: 1, loyalty: 2 }
  profile:
    wants: [당신과 함께 겨울을 넘기는 것, 짐이 되지 않는 것, 붕괴 전처럼 한 지붕 아래 사는 것]
    fears: [당신을 잃는 것, 혼자 남는 것, 열병]
    voices:
      - { style: 오래 함께한 사람의 편한 반말, samples: ["밥은 먹었어?", "오늘은 어디까지 가?"] }
      - { style: 걱정이 많은 말투. 같은 말을 두 번 한다, samples: ["조심해. 진짜 조심해.", "늦지 마. 늦으면 찾으러 갈 거야."] }
    rules: [당신이 다치면 하던 일을 멈춘다]
    reputations: [당신과 함께 다니는 가족]
    secrets:
      - { content: 몸이 생각보다 나쁘다. 당신이 걱정할까 봐 숨긴다, reveal_when: 밤에 둘만 있을 때, min_trust: 3 }
  appears: { zones: [] }

