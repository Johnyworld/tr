# 여울섬 군도 임무 (초안)
- id: l_watch_night
  title: 등대 망루 밤 당번
  briefing: 등대 망루에서 밤새 바다를 본다. 불빛이 보이면 배인지 표류물인지 가려서 알린다.
  giver_rank: squad_leader
  deadline_hours: 14
  requirements:
    - activity: guard_duty
      minutes: 300

- id: l_tide_crossing
  title: 썰물 길 건너기
  # 2인 1조 (기획서 7.9)
  buddy: true
  briefing: 썰물 때 갈대 습지 길을 건너 소금밭에 물때표와 편지를 전한다. 물이 들기 전에 돌아온다.
  giver_rank: squad_leader
  deadline_hours: 10
  requirements:
    - check: survival
      min_outcome: partial
    - activity: travel
      minutes: 60

- id: l_cannery_search
  title: 통조림 공장 뒤지기
  buddy: true
  briefing: 옛 통조림 공장 창고를 뒤져 뜯지 않은 상자를 찾는다. 그늘 쪽은 들어가지 않는다.
  giver_rank: squad_leader
  deadline_hours: 10
  requirements:
    - check: scavenge
      min_outcome: partial

- id: l_pier_guard
  title: 부두 지키기
  briefing: 진강호를 도와 여객선 부두를 지킨다. 낯선 배가 보이면 먼저 알린다.
  giver_rank: squad_leader
  deadline_hours: 12
  requirements:
    - activity: guard_duty
      minutes: 240
    - check: sense_danger
      min_outcome: partial

- id: l_rescue_boat
  title: 표류선 끌어오기
  briefing: 망루에서 본 표류선을 부두까지 끌어온다. 안에 누가 있는지는 가 봐야 안다.
  giver_rank: squad_leader
  deadline_hours: 8
  requirements:
    - check: endure
      min_outcome: partial

- id: fl_row_out
  title: 새벽 노 젓기
  briefing: 물때에 맞춰 배를 띄우고 다음 섬까지 노를 젓는다. 늦게 노를 잡으면 몫이 깎인다.
  giver_rank: squad_leader
  deadline_hours: 10
  requirements:
    - activity: work
      minutes: 180
    - check: endure
      min_outcome: partial

- id: fl_marsh_raid
  title: 갈대 습지 털기
  buddy: true
  briefing: 썰물 길로 건너오는 사람들의 짐을 턴다. 소금밭 사람은 건드리지 않는다. 장사 상대다.
  giver_rank: squad_leader
  deadline_hours: 12
  requirements:
    - check: intimidate
      min_outcome: partial

- id: fl_cannery_haul
  title: 통조림 공장 실어 오기
  buddy: true
  briefing: 통조림 공장의 상자를 배에 싣는다. 등대지기회 망꾼이 보면 일이 커진다.
  giver_rank: squad_leader
  deadline_hours: 10
  requirements:
    - check: stealth
      min_outcome: partial
    - activity: work
      minutes: 120

- id: fl_pier_probe
  title: 부두 살피기
  briefing: 작은 배로 안개를 타고 여객선 부두 아래까지 들어가 지키는 사람이 몇인지 센다.
  giver_rank: squad_leader
  deadline_hours: 10
  advances: { clock: fl_pier, delta: 1 }
  requirements:
    - check: stealth
      min_outcome: partial
    - check: sense_danger
      min_outcome: partial

- id: fl_salt_deal
  title: 소금밭 흥정
  briefing: 기름 한 통을 소금밭에 넘기고 젓갈과 마른 생선을 받아 온다. 값을 깎이면 몫에서 뺀다.
  giver_rank: squad_leader
  deadline_hours: 12
  requirements:
    - check: persuade
      min_outcome: partial
