# 등대지기회 (초안)
- id: l_suja
  name: 한수자
  alias: 등대 열쇠를 목에 건 노인
  faction: f_light
  rank: leader
  age: 61
  gender: female
  look: 짧게 친 흰머리, 바람에 튼 붉은 뺨. 목에 등대 출입문 열쇠를 노끈으로 걸었다.
  reputation: 붕괴 전 등대 관리인의 아내. 첫 겨울에 등대를 밝혀 배 열한 척을 불러들였다. 등대지기회의 등대장.
  want: 등대 불이 꺼지지 않고 다음 겨울을 넘기는 것
  fear: 불을 보고 온 배가 적의 배인 날
  values: { discipline: 1, loyalty: 2, mercy: 2, honesty: 2, self_interest: -1 }
  traits: [patient, principled, weary]
  voice:
    style: 느리고 단단한 반말. 젊은 사람을 "애기야"라고 부른다
    samples:
      - "불은 꺼지면 안 돼. 그거 하나만 지키면 돼."
      - "바다에서 부르는 사람은 일단 받는다. 그다음은 그다음이고."
  routine: { dawn: 등대 꼭대기, day: 관리동 회의실, evening: 부엌, night: 등대 꼭대기 }
  rules:
    - 등대 불을 직접 확인하기 전에는 잠들지 않는다
    - 회의에서 마지막에 말한다
  knows:
    - 등대 불을 보고 오는 배가 늘 반가운 배는 아니라는 것
  doesnt_know:
    - 진강호가 선단의 배를 먼저 칠 계획을 따로 짜고 있다는 것
  stats: { strength: -1, agility: -1, vitality: 0, senses: 1, nerve: 2, charm: 1, intellect: 1 }
  skills: { persuade: 2, tactics: 1, survival: 1 }
  start_inventory: [radio, blanket]
  playable: false
  zone: lighthouse

