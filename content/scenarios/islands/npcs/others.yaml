# 검은돛 선단과 소금밭 사람들 (초안)
- id: fl_mujin
  name: 차무진
  alias: 검은 외투의 선장
  faction: f_fleet
  rank: leader
  age: 50
  gender: male
  look: 검게 물들인 군용 외투, 반백의 수염. 왼손 새끼손가락이 없다.
  reputation: 검은돛 선단의 선장. 배 여섯 척을 묶어 바다를 떠돈다. 겨울마다 섬 하나를 턴다는 말이 돈다.
  want: 선단이 겨울을 날 항구 하나
  fear: 배 위에서 반란이 나는 것
  values: { discipline: 3, loyalty: 0, mercy: -2, honesty: 0, self_interest: 2 }
  traits: [calculating, ruthless, patient]
  voice:
    style: 낮고 느린 반말. 묻기 전에 대답을 정해 둔다
