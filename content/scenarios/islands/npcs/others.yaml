      - "바다에는 주인이 없어. 배를 댈 곳에만 주인이 있지."
      - "몫은 공대로. 불만 있으면 헤엄쳐 가."
  routine: { day: 선장실, night: 갑판 }
  rules:
    - 배 위에서 되묻는 자는 다음 섬에 내린다
  knows:
    - 여객선 부두를 차지하면 선단이 겨울을 날 수 있다는 것
  stats: { strength: 1, agility: 0, vitality: 1, senses: 1, nerve: 2, charm: 1, intellect: 1 }
  skills: { tactics: 2, intimidate: 2, shoot: 1 }
  start_inventory: [old_rifle, radio]
  playable: false
  zone: harbor_wreck

