# 검은돛 선단의 노꾼 (시작 역할, 초안)
id: role_fl_rower
label: 검은돛 선단 노꾼
faction: f_fleet
rank: grunt
default_name: 노꾼
opening_scene: 해 뜨기 전, 난파항에 묶인 배들 사이. 갑판장의 고함에 노꾼석으로 뛰어간다. 옆자리의 노꾼이 붕대 감은 손목으로 노를 쥔다. 멀리 등대섬에서 마지막 불빛이 돌고 꺼진다.
scenario:
  title: 검은돛 선단의 노꾼
  pitch: >-
    바다를 떠도는 선단의 가장 아래, 노꾼석에서 시작한다. 몫은 공대로 나누고, 배를 버린 자는 다시 태우지 않는다.
    선장의 명령대로 섬을 털지, 언젠가 섬 하나에 내려 살지는 당신에게 달렸다.
  intro: >-
    늦가을. 당신은 검은돛 선단의 노꾼이다. 갑판장 한상철 밑에서 노를 젓고, 섬에 오르면 짐을 나른다.
    선장 차무진은 겨울을 날 항구 하나를 찾고 있다. 등대지기회가 지키는 여객선 부두가 그 자리라는 말이 돈다.
    선단의 규칙은 군율이다. 배 위에서는 명령을 되묻지 않고, 몫은 선장이 나눈다. 다친 사람은 다음 섬에 내려 둔다.
    이야기는 어느 새벽, 난파항의 노꾼석에서 시작한다.
