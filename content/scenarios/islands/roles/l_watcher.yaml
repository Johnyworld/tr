# 등대지기회의 망꾼 (시작 역할, 초안)
id: role_l_watcher
label: 등대지기회 망꾼
faction: f_light
rank: grunt
default_name: 망꾼
opening_scene: 새벽, 등대 꼭대기 망루. 등대 불이 마지막 바퀴를 돌고 꺼진다. 쌍안경을 넘겨받는 손이 차갑다. 안개 너머 어딘가에서 노 젓는 소리가 났다가 멎는다.
scenario:
  title: 등대지기회의 망꾼
  pitch: >-
    등대섬에서 바다를 지켜보는 망꾼이 된다. 불을 보고 오는 배가 구조를 바라는 사람인지, 섬을 털러 온 선단인지 가장 먼저 알아봐야 한다.
    물때표를 외우고, 갯벌 길을 건너고, 부두를 노리는 검은돛 선단을 견딘다.
  intro: >-
    늦가을. 당신은 등대지기회의 망꾼이다. 조장 오재민 밑에서 등대 망루와 부두를 번갈아 지킨다.
    등대장 한수자는 "불은 꺼지지 않는다"고 말한다. 밤마다 등대를 밝혀 바다의 배를 부르는 것이 이 무리의 원칙이다.
    요즘 검은돛 선단의 배가 여객선 부두 근처에 자주 나타난다. 부두를 지키는 진강호는 먼저 치자고 하고, 창고지기 윤미옥은 겨울을 넘길 숫자를 센다.
    이야기는 어느 새벽, 등대 꼭대기 망루에서 시작한다.
