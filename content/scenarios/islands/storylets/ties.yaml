# 인물 사이의 관계 이야기 (기획서 7.10)
- id: wt_letter_across
  title: 건너편 섬의 사람
  tags: [world]
  when:
    segments: [evening, night]
    day_gte: 3
  cast:
    asker: { faction: own, known: true, trust_gte: 2 }
    kin: { tie: { of: asker, kinds: [sibling, parent, child, spouse, friend], cross: true }, enter: false }
  setup: "{asker:이/가} 물때표 뒷면에 적은 쪽지를 내민다. \"건너편에 {kin:이/가} 있어. 이거 좀 전해 줄 수 있어? 아무한테도 말하지 마.\""
  ai_direction: 쪽지에는 안부뿐이다. 하지만 적대하는 쪽에 가까운 사람이 있다는 것이 알려지면 이 사람은 의심받는다. 전하려면 그쪽 섬에 건너가야 한다.
  choices:
    - id: carry
      label: 받아 든다
      effects:
        - reveal_tie: { who: asker, other: kin }
        - relation: { who: asker, axis: trust, delta: 2 }
        - belief: { fact: "{asker}의 가까운 사람 {kin}이(가) 건너편 무리에 있다. 쪽지를 전해 주기로 했다", source: seen }
    - id: refuse
      label: 그럴 수 없다고 돌려준다
      effects:
        - reveal_tie: { who: asker, other: kin }
        - relation: { who: asker, axis: affection, delta: -1 }
