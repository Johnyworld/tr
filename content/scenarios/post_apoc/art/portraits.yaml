# 주인공 초상화 (12-139). 새 캐릭터를 만들 때 성별 다음에 고르는 얼굴이다. NPC 얼굴은 만들지 않는다.
# 화풍은 미국 애니메이션(D) 하나로 정했다 (실사 회화·현대 애니메이션·레트로 일러스트는 시험 끝에 뺐다).
#
# 게임(core)이 읽는 칸: styles.<id>.label, faces.<id>.style·gender
#   - 화풍은 적힌 순서대로 섹션이 된다 (얼굴이 하나도 없는 화풍은 보이지 않는다)
#   - gender는 scenario.yaml creation.genders의 id. 고른 성별의 얼굴만 보인다
#   - 그림 파일: art/portraits/<id>.png
# 나머지는 그림을 만드는 도구용 (pnpm portraits post_apoc, 로컬 ComfyUI):
#   - common: 모든 화풍에 붙는 구도 규칙 (양쪽 눈이 보이게, 가슴까지)
#   - styles.<id>: 모델과 프롬프트. grade: 기준 그림(art/ 안)의 색감을 옮겨 컬러감을 맞춘다.
#     extend_top: 얼굴 맞추기(framing)가 없을 때, 머리가 위로 잘리는 화풍의 위쪽을 이어 그린다
#   - framing: 그린 뒤 얼굴을 찾아 같은 크기·위치로 자른다. 여백이 조금(4% 이하) 모자라면 자를 자리를 민다
#   - cleanup: 여백이 많이 모자라면 회색 여백을 붙여 Qwen Image 편집으로 장면을 이어 채운다 (액자·비네트도 지운다)
#     ※ Qwen Image 2.1은 Qwen RESEARCH LICENSE(비상업·연구/평가용)다. 배포용 그림에 쓰기 전에 라이선스를 확인한다
#   - faces.<id>.source: 그리지 않고 이 그림(art/ 안)을 원본으로 쓴다. grade: 화풍 대신 이 색 보정. cleanup: true면 늘 정리한다
#     (원본을 덮어쓰지 않고 Qwen이 전체를 다듬는다. 글이면 지시에 덧붙인다). crop_scale: 자르는 영역 배율 (고개를 돌린 얼굴 등)
#   - faces.<id>: seed와 외모 묘사(영어 subject, 애니메이션 모델용 tags)
#   - 설정이 바뀐 얼굴만 portraits.lock.json의 해시로 골라 다시 만든다 (화풍을 바꾸면 그 화풍 전부)
#   - seed를 바꾸면 같은 묘사로 다른 얼굴. 후보를 여럿 보려면 --only <id> --variants 4

output_size: 256

# 얼굴 맞추기: 그린 뒤 얼굴을 찾아(SAM 3) 모든 초상화의 얼굴 크기·위치를 같게 자른다 (가슴까지 보이는 구도)
framing:
  detector: sam3.1_multiplex_fp16.safetensors
  target: face
  # 크기는 얼굴 상자 너비, 위치는 턱 끝으로 맞춘다 (상자 높이는 앞머리에 따라 달라져 쓰지 않는다. 머리카락은 조금 잘려도 된다)
  # 얼굴이 작은 그림은 faces.<id>.zoom으로 더 당겨 자른다 (pnpm portraits post_apoc --zoom <id>:1.1)
  face_width: 0.31
  chin_y: 0.63

cleanup:
  unet: qwen_image_2.1_turbo_int8_convrot.safetensors
  clip: qwen3vl_8b_int8_convrot.safetensors
  vae: qwen_image_2.1_vae_bf16.safetensors
  seed: 7
  instruction: >-
    Fill the flat grey margins around the picture by seamlessly extending the existing scene into them, in exactly the same art style, colours, lighting and level of detail. Remove any picture frame, paper border, vignette, canvas edge or faded unfinished edges so the illustration fills the whole image edge to edge. Keep the person, their face, expression, hair, clothing and line work exactly the same, without any change.

common:
  # 얼굴 맞추기로 자를 여유가 있게 상반신까지 그린다
  prompt: >-
    upper body portrait, head, shoulders and chest visible, face fully visible, both eyes visible and open, looking toward the viewer
  negative: >-
    profile, side view, looking away, eyes closed, one eye hidden, covered eyes, goggles over eyes, sunglasses, headphones, full body, legs, hands, holding object, wide shot, close-up, face only, head out of frame, cropped head, cropped forehead, glowing eyes, cleavage, revealing clothes, nsfw

styles:
  D:
    label: 미국 애니메이션
    # 고르기 화면에서 얼굴마다 번호를 보인다 (번호로 가리키며 다듬는 중)
    numbered: true
    checkpoint: sd_xl_base_1.0.safetensors
    prompt: >-
      portrait of {subject}, post-apocalyptic survivor, ruined city skyline at night behind, 1990s american superhero animated series style, bold thick black outlines, flat cel shading with hard shadows, angular simplified shapes, limited muted color palette, dramatic noir lighting, comic book illustration
    negative: >-
      photo, realistic, 3d render, anime, manga, soft shading, blurry, low quality, deformed, text, watermark, signature, speech bubble, panel border
    width: 1024
    height: 1024
    steps: 28
    cfg: 7
    sampler: dpmpp_2m
    scheduler: karras
    # 흑백·회색조 그림과 컬러 그림이 섞여 있어 모두 차분한 컬러로 맞춘다:
    # colorize: true인 얼굴은 색을 입히고, 모두 palette_D(d_m1)의 색감으로 맞춘다
    grade: { ref: palette_D.png, strength: 0.6 }
    colorize: >-
      Colorize this black-and-white ink comic illustration with flat comic-book colours in a muted, desaturated post-apocalyptic palette: natural warm skin tones, dusty olive, khaki, tan, faded denim blue, rust brown and grey-brown for the clothes, and a hazy dull grey-blue or dusty orange sky behind the ruined city. Keep every ink line, shape, shadow, the face, expression, hair and the composition exactly the same; only add colour.

