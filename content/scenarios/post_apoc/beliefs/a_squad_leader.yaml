  - fact: 분대 몫의 배급은 분대장이 식당에서 한꺼번에 받아 나눠 준다. 누구에게 얼마를 줄지는 분대장이 정한다.
    source: seen
    accuracy: exact
  - fact: 전 분대장 서기철은 지난달 강변 공장 지대에서 물결에 휩쓸려 죽었다.
