# 청솔형제단 신임 분대장이 시작할 때 알고 있는 것 (초안)
# accuracy는 GM에게 보이지 않는다. 캐릭터는 자기 믿음이 틀렸는지 모른다
id: a_squad_leader
beliefs:
  - fact: 우리 청솔형제단은 버들마을과 연합해 붉은연합과 전쟁 중이다. 연합은 수에서 붉은연합에 크게 밀린다.
