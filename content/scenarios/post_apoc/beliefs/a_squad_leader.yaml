    accuracy: exact
  - fact: 서기철이 죽은 날, 그는 정해진 길을 버리고 강변 쪽으로 돌아갔다고 한다. 왜 그랬는지 아는 사람은 없다.
    source: rumor
    accuracy: approximate
  - fact: 분대원들은 고참 임동욱이 분대를 물려받을 줄 알았다. 그는 아직 당신을 분대장으로 부르는 것을 어색해한다.
    source: seen
    accuracy: exact
  - fact: 막내 문하늘은 지난달 정문으로 들어온 피난민이다. 어디서 왔는지는 말하지 않는다.
    source: seen
    accuracy: exact
  - fact: 겨울을 앞두고 이번 주에 배급이 한 번 줄었다. 다음 주에 또 줄인다는 말이 돈다.
    source: rumor
    accuracy: approximate
  - fact: 옛 분대의 강태호는 진급 소식에 고개만 한 번 끄덕였다. 오지호는 축하한다면서도 이제 말을 놓아도 되냐고 물었다.
    source: seen
    accuracy: exact
  - fact: 분대원이 탈영하면 분대장도 책임을 진다. 거점에서는 지난봄 탈영자를 숨겨 준 분대장이 강등된 일이 있다.
    source: report
