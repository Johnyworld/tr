# 붉은연합 위원이 시작할 때 알고 있는 것 (초안)
# 위원이라 조원보다 많이 안다. 그래도 숫자는 말로만. 위원장의 속내, 마경수의 뒷거래, 규율반 명부의 물음표는 모른다. accuracy는 GM에게 보이지 않는다
id: c_officer_start
beliefs:
  - fact: 위원회는 매일 아침 공단 사무동에서 열린다. 위원장 국혜란, 고가도로 너머를 맡은 간부 마경수, 규율반 서기 우상옥, 그리고 할당량 장부를 맡은 내가 앉는다. 선전꾼 편종호는 불릴 때만 들어온다.
    source: seen
    accuracy: exact
  - fact: 위원회의 결정에는 아무도 토를 달지 않는다. 토는 결정이 나기 전, 이 방 안에서만 단다. 방을 나가면 결정은 위원회 전체의 것이다.
    source: seen
    accuracy: exact
  - fact: 할당량을 못 채운 조는 조 전체의 배급이 깎인다. 어느 조를 어느 땅에 보내느냐가 그 조가 다음 날 먹느냐를 정한다. 그 장부가 내 손에 있다.
    source: seen
    accuracy: exact
  - fact: 창고는 아직 넉넉한 편이다. 식량은 겨울을 넘길 만하고, 탄은 다른 무리보다 많다. 모자란 것은 약이다. 하얀매에서 사 오지 않으면 공세 뒤의 부상자를 감당하지 못한다.
    source: report
    accuracy: approximate
  - fact: 마경수는 동쪽 공세를 겨울 전에 끝내자고 한다. 병력은 고가도로 너머에 모이고 있다. 공세가 잘되면 그의 목소리가 위원회에서 가장 커질 것이다.
    source: seen
    accuracy: exact
  - fact: 물류창고 수용소에 청솔형제단 정찰병들이 갇혀 있다. 마경수는 본보기로 쓰자고 하고, 간수 노필수는 죽으면 교환도 못 한다고 중얼거린다. 위원회는 아직 정하지 않았다.
    source: report
    accuracy: approximate
  - fact: 위원장은 버들마을 대표에게 사자를 보냈다. 청솔형제단과의 약조를 깨면 건드리지 않겠다는 제안이다. 사자로 다니는 사람은 편종호다.
    source: report
    accuracy: exact
  - fact: 규율반은 막사마다 밀고자를 둔다. 서기 우상옥의 명부에 오른 이름은 지워지는 일이 드물다. 위원의 이름이 오르지 말라는 법은 없다.
    source: rumor
    accuracy: approximate
  - fact: 나루상단은 탄과 물을 누구에게나 판다. 하얀매는 약을 값으로만 내준다. 둘 다 우리가 이기는 쪽이라고 보면 값을 깎아 줄 것이다.
    source: report
    accuracy: approximate
  - fact: 반년 전 간부였던 성태규는 공세 연습에서 조를 잃고 계급장을 뗐다. 지금은 벌조를 이끈다. 실패한 간부가 어디로 가는지 모두가 그 어깨를 보고 안다.
    source: seen
    accuracy: exact
