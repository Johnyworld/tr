# 하얀매 수습 의무병이 시작할 때 알고 있는 것
# accuracy는 GM에게 보이지 않는다. 캐릭터는 자기 믿음이 틀렸는지 모른다
id: d_medic
beliefs:
  - fact: 하얀매는 어느 무리 편도 들지 않는다. 다친 사람은 소속을 가리지 않고 치료하지만, 약은 값을 받고 내준다.
