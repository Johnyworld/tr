  - fact: 임무와 당번은 수간호사 권정숙을 통해 내려온다. 치료 순서도 그가 정한다.
    source: seen
    accuracy: exact
  - fact: 다른 무리와 약값을 흥정하는 일은 간부 도상필이 맡는다. 약제실 뒷문 열쇠는 그에게만 있다.
    source: report
    accuracy: exact
  - fact: 진료소를 지키는 경비는 여섯 명뿐이다. 어느 무리든 마음먹고 쳐들어오면 막기 어렵다.
    source: report
    accuracy: exact
  - fact: 옛 시립병원 지하 약제실에 아직 손대지 않은 약이 남아 있다고 한다. 수색꾼 남민호가 자주 드나든다.
