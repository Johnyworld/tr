  - fact: 청솔형제단 의무실의 윤채원은 예전에 하얀매의 약을 빼돌려 붉은연합에 팔다가 쫓겨났다는 소문이다.
    source: rumor
    accuracy: "false"
  - fact: 약제실 항생제가 요즘 빨리 줄어든다. 수간호사는 겨울 감기 때문이라고 했다.
    source: report
