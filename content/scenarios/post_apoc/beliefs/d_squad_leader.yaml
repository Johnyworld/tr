# 하얀매 수비대 신임 분대장이 시작할 때 알고 있는 것 (초안). 일부는 틀렸다
# accuracy는 GM에게 보이지 않는다. 캐릭터는 자기 믿음이 틀렸는지 모른다
id: d_squad_leader_start
beliefs:
  - fact: 하얀매는 어느 무리 편도 들지 않는다. 다친 사람은 소속을 가리지 않고 받지만, 약은 값을 받고 내준다.
