    source: report
    accuracy: exact
  - fact: 하얀매에서 총을 드는 사람은 수비대 여섯이 전부다. 분대장과 분대원 넷, 그리고 격리실 철문을 지키는 구만석.
    source: seen
    accuracy: exact
  - fact: 전 분대장 하재문은 지난달 옛 시립병원 수색에서 감염체에게 긁혀 격리실에 들어갔다. 사흘째 밤에 열이 올랐고, 그 뒤로 아무도 그를 보지 못했다.
