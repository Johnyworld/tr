# 나루상단 장부 간부가 시작할 때 알고 있는 것
# 간부라 짐꾼보다 장부를 많이 안다. 그래도 숫자는 말로만. accuracy는 GM에게 보이지 않는다
id: e_officer_start
beliefs:
  - fact: 나루상단은 정수장의 손펌프를 쥐고 모든 무리에 물을 판다. 정수장 안에서는 어느 무리도 총을 꺼내지 않는다는 약속이 있다.
    source: report
    accuracy: exact
  - fact: 상단의 지도부는 사장 탁봉수, 펌프지기 염덕수, 행상대장 주옥희, 그리고 장부를 맡은 나다. 회의라고 해 봐야 매점 계산대에 둘러서서 장부를 펴는 것이다.
    source: seen
    accuracy: exact
  - fact: 장부꾼 문소라가 내 밑에서 빚과 거래를 적는다. 누가 상단에 얼마를 빚졌는지는 그 장부가 제일 정확하다.
    source: seen
    accuracy: exact
  - fact: 붉은연합은 늘 탄약으로 값을 치르고, 넉넉하게 친다. 붉은연합 물류창고 쪽 거래는 사장이 직접 정한다.
    source: seen
    accuracy: exact
  - fact: 청솔형제단은 물값을 두 번 미뤘다. 버들마을도 미룬 적이 있다. 둘 다 붉은연합에 밀리고 있다.
    source: report
    accuracy: approximate
  - fact: 사장은 누구 편이냐고 물으면 손님 편이라고 웃는다. 상단 사람들은 겨울 안에 이기는 쪽에 붙을 거라고들 한다.
    source: rumor
    accuracy: exact
  - fact: 몇 주에 한 번 강 하구에서 바다로 거래선이 뜬다. 통조림과 일손을 싣고 가서 탄약을 싣고 온다. 뱃사공은 변상철, 호위는 감태식이 맡는다.
    source: report
    accuracy: exact
  - fact: 거래선에 타는 일손은 빚을 갚으려고 제 발로 섬에 일하러 가는 사람들이다. 섬은 먹을 것이 넘치니 그편이 낫다고들 한다.
    source: rumor
    accuracy: "false"
  - fact: 전당포 감순덕은 문소라의 장부에서 갚을 길 없는 빚을 싸게 사들인다. 상단으로서는 받지 못할 빚을 값을 받고 털어내는 셈이다.
    source: report
    accuracy: exact
  - fact: 상단 창고의 탄약 상당수는 바다 건너에서 온 것이고, 그 일부는 다시 붉은연합에 팔린다.
    source: seen
    accuracy: approximate
  - fact: 장부에 적힌 빚은 반드시 갚는다. 짐이나 약속에 손을 댄 사람은 쫓겨나고, 다른 무리에도 소문이 난다. 간부라도 다르지 않다.
    source: seen
    accuracy: exact
