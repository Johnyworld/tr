# 떠돌이 엑스트라 틀 (무소속의 긴 이야기, storylets/world_loner_arcs.yaml)
# 이름 있는 NPC는 스키마상 세력이 있어야 해서, 무리에 속하지 않은 떠돌이는 이름 없는 틀로 둔다 (faction 없음 = 떠돌이)
# 한 번 만든 인물(ex_N)은 GM이 다음 장면에 다시 등장시킨다

- id: drifter_leader
  label: 떠돌이 무리의 우두머리
  rank: loner
  age: [32, 55]
  menace: { kind: coerce, chance: 0.2 }
  looks:
    - 손등과 손가락 마디에 하얀 흉터가 겹겹이 난 여자. 말하기 전에 꼭 무리 쪽을 한 번 돌아본다
    - 군용 우의를 망토처럼 두른 남자. 허리띠에 숟가락 일곱 개를 끈으로 묶어 달았다
  stats: { vitality: [0, 1], senses: [0, 1], nerve: [1, 1], charm: [0, 1] }
  skills: { survival: 2, persuade: 1, sense_danger: 1 }
  traits: [protective, weary, cautious, principled, guarded]
  trait_count: 2
  inventory:
    - { item: kitchen_knife }
    - { item: water_bottle }
    - { item: blanket, chance: 0.5 }
  values: { mercy: 1, loyalty: 2 }
  profile:
    wants: [겨울을 날 담 안의 자리, 잃어버린 가족을 찾는 것, 혼자가 아닌 것, 뭍이든 섬이든 정착할 곳]
    fears: [혼자 남는 밤, 무리에 끌려가는 것, 물결, 굶어 죽는 것]
    voices:
      - { style: 경계하는 짧은 반말. 눈은 늘 출구를 본다, samples: ["가까이 오지 마. 거기서 말해.", "공짜는 없어."] }
      - { style: 지치고 조용한 존댓말, samples: ["먹을 거 있으면… 아니에요.", "어디서 왔는지는 묻지 말아 주세요."] }
      - { style: 넉살 좋은 반말. 말이 많다, samples: ["이 동네 길은 내가 다 알아.", "같이 다니면 둘 다 덜 죽어."] }
    rules: [먹을 것을 받으면 반드시 무언가로 갚으려 한다, 무리 이야기를 꺼내면 말을 돌린다]
    reputations: [이 근방을 떠도는 사람, 몇 번 마주친 낯익은 떠돌이, 어느 무리에도 끼지 않으려는 사람]
    secrets:
      - { content: 예전에 어느 무리에서 물건을 훔쳐 쫓겨났다, reveal_when: 그 무리 이야기가 나올 때, min_trust: 3 }
      - { content: 함께 다니던 사람을 물결 속에 두고 혼자 도망쳤다, reveal_when: 밤에 둘만 있을 때, min_trust: 3 }
      - { content: 아이 하나를 몰래 먹여 살리고 있다, reveal_when: 먹을 것을 나눠 받은 뒤, min_trust: 2 }
  ties: { chance: 0.3, kinds: [sibling, parent, child, spouse, friend] }
  appears: { zone_owner: [none] }

