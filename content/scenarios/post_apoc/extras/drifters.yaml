  age: [16, 24]
  looks:
    - 눈이 빠르고 말이 많은 젊은 사내. 남의 배낭 끈을 자꾸 본다
    - 머리를 짧게 민 젊은 여자. 웃을 때 눈은 웃지 않는다
  stats: { agility: [1, 1], senses: [0, 1], nerve: [-1, 0] }
  skills: { stealth: 1, deceive: 1, survival: 1 }
  traits: [eager, calculating, coward, greedy, talkative]
  trait_count: 2
  inventory:
    - { item: crowbar, chance: 0.5 }
