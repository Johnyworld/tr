- id: drifter_elder
  label: 늙은 떠돌이
  rank: loner
  age: [58, 75]
  looks:
    - 간호사 카디건을 몇 겹 껴입은 노인. 목소리가 생각보다 또렷하다
    - 지팡이 대신 우산을 짚은 노인. 주머니마다 종이 쪽지가 들어 있다
  stats: { strength: [-1, -1], vitality: [-1, 0], senses: [0, 1], intellect: [1, 1] }
  skills: { first_aid: 1, history: 2 }
  traits: [patient, motherly, weary, meticulous, talkative]
  trait_count: 2
  inventory:
    - { item: radio, chance: 0.3 }
    - { item: blanket, chance: 0.6 }
    - { item: fever_reducer, chance: 0.2 }
  values: { mercy: 2, honesty: 1 }

