- id: refugee
  label: 떠돌이 피난민
  rank: loner
  age: [15, 65]
  looks:
    - 해진 담요를 망토처럼 두른 피난민. 눈이 퀭하다
    - 아이 신발을 목에 건 피난민. 말이 없다
  stats: { vitality: [-1, 0], senses: [0, 1] }
  skills: { survival: 1, stealth: 1 }
  traits: [timid, guarded, warm, frail, light_eater]
  trait_count: 2
  inventory:
    - { item: water_bottle, chance: 0.6 }
    - { item: blanket, chance: 0.4 }
    - { item: dry_ration, chance: 0.3 }
  values: { mercy: 1 }
  profile:
    wants: [겨울을 날 담 안의 자리, 잃어버린 가족을 찾는 것, 혼자가 아닌 것, 뭍이든 섬이든 정착할 곳]
    fears: [혼자 남는 밤, 무리에 끌려가는 것, 물결, 굶어 죽는 것]
    voices:
      - { style: 경계하는 짧은 반말. 눈은 늘 출구를 본다, samples: ["가까이 오지 마. 거기서 말해.", "공짜는 없어."] }
      - { style: 지치고 조용한 존댓말, samples: ["먹을 거 있으면… 아니에요.", "어디서 왔는지는 묻지 말아 주세요."] }
      - { style: 넉살 좋은 반말. 말이 많다, samples: ["이 동네 길은 내가 다 알아.", "같이 다니면 둘 다 덜 죽어."] }
    rules: [먹을 것을 받으면 반드시 무언가로 갚으려 한다, 무리 이야기를 꺼내면 말을 돌린다]
    reputations: [이 근방을 떠도는 사람, 몇 번 마주친 낯익은 떠돌이, 어느 무리에도 끼지 않으려는 사람]
    secrets:
      - { content: 예전에 어느 무리에서 물건을 훔쳐 쫓겨났다, reveal_when: 그 무리 이야기가 나올 때, min_trust: 3 }
      - { content: 함께 다니던 사람을 물결 속에 두고 혼자 도망쳤다, reveal_when: 밤에 둘만 있을 때, min_trust: 3 }
      - { content: 아이 하나를 몰래 먹여 살리고 있다, reveal_when: 먹을 것을 나눠 받은 뒤, min_trust: 2 }
  ties: { chance: 0.3, kinds: [sibling, parent, child, spouse, friend] }
  appears: { zone_owner: [none, own] }

- id: e_porter
  label: 나루상단 짐꾼
  faction: faction_e
  rank: outsider
  age: [17, 50]
  looks:
    - 큰 배낭을 진 짐꾼. 무릎에 천을 감았다
    - 구멍 난 동전 통행패를 목에 건 짐꾼
  stats: { strength: [1, 2], vitality: [0, 1] }
  skills: { persuade: 1, survival: 1 }
  traits: [genial, talkative, calculating, big_eater, attractive]
  trait_count: 2
  inventory:
    - { item: trade_token }
    - { item: canned_food, chance: 0.5 }
    - { item: cigarettes, chance: 0.5 }
  values: { self_interest: 1, honesty: 1 }
  profile:
    wants: [장부의 빚을 다 갚는 것, 자기 짐마차를 갖는 것, 이기는 쪽에 서는 것]
    fears: [빚이 대물림되는 것, 짐을 잃는 것, 길목의 약탈조]
    voices:
