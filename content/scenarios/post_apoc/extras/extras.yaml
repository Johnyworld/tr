    rules: [무엇이든 값으로 말한다, 짐 끈을 자꾸 다시 묶는다]
    reputations: [장터를 오가는 짐꾼, 빚을 지고 상단에 들어온 사람]
    secrets:
      - { content: 짐에서 조금씩 빼돌려 따로 모아 둔다, reveal_when: 빚 이야기를 하다가, min_trust: 3 }
  ties: { chance: 0.25, kinds: [sibling, friend, rival] }
  appears: { zones: [e_market, water_plant, riverside, old_town] }

