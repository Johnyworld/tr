# 엑스트라 틀 (기획서 7.5, *임시*): 이름 없는 인물이 주인공과 엮이면 GM이 하나를 골라 캐릭터로 만든다
# 소지품·능력·트레잇은 코드가 여기서 굴린다. GM은 물건을 지어내지 않는다
- id: c_sentry_shotgun
  label: 붉은연합 보초 — 엽총
  faction: faction_c
  rank: grunt
  age: [19, 40]
  looks:
    - 왼팔에 붉은 완장을 찬 마른 보초. 엽총을 어깨에 걸쳤다
    - 눈 밑이 검은 보초. 엽총 개머리판을 땅에 짚고 졸음을 참고 있다
  stats: { strength: [0, 1], agility: [0, 1], vitality: [0, 1], senses: [-1, 1], nerve: [-1, 1] }
  skills: { shoot: 1, fight: 0 }
  traits: [coward, dull_senses, cynical, timid, lazy, blunt]
  trait_count: 2
  inventory:
    - { item: shotgun }
    - { item: c_armband }
    - { item: cigarettes, chance: 0.5 }
    - { item: dry_ration, chance: 0.4 }
  values: { discipline: 1, self_interest: 1 }
  profile:
    wants: [할당량을 채우고 배급이 깎이지 않는 것, 규율반의 눈에 띄지 않는 것, 언젠가 감시탑이 아닌 곳에서 자는 것, 조장 자리]
    fears: [광장의 본보기, 공세 맨 앞줄, 탈영병으로 몰리는 것, 굶는 조]
    voices:
      - { style: 짧고 거친 반말. 윗사람 이름이 나오면 목소리를 낮춘다, samples: ["할당량 못 채우면 너도 나도 굶어.", "규율반 귀는 어디에나 있어."] }
      - { style: 지친 존댓말. 말끝을 흐린다, samples: ["저는 시키는 대로만 해요.", "오늘은 아무 일 없었으면 좋겠네요."] }
    rules: [완장을 만지작거리며 말한다, 지도부 이야기가 나오면 주위를 살핀다]
    reputations: [붉은연합에서 몇 해를 버틴 사람, 할당량을 한 번도 못 채운 적 없다는 사람, 징집되어 온 지 얼마 안 된 사람]
    secrets:
      - { content: 탈영할 날을 세고 있다. 담 밑에 마른 빵을 숨겨 두었다, reveal_when: 둘만 있고 규율반이 멀 때, min_trust: 3 }
      - { content: 청솔형제단 쪽에 몰래 소식을 흘린 적이 있다. 돈이 아니라 가족 때문이었다, reveal_when: 목숨을 구해 준 뒤, min_trust: 3 }
  ties: { chance: 0.25, kinds: [sibling, parent, child, friend] }
  appears: { zones: [c_base, c_warehouse] }

