# 무리 사람 틀 (12-116, *임시*): 청솔형제단·하얀매는 틀이 없고 버들마을·나루상단·여울섬은 하나뿐이라,
# 다른 무리의 이름 없는 사람을 마주칠 때 GM이 고를 틀이 거의 없었다. 무리마다 2~3개를 더한다
# 능력·소지품·트레잇은 코드가 굴린다. GM은 물건을 지어내지 않는다

