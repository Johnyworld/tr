# 떠돌이의 소규모 무리 (12-77): 피가 섞이지 않은 동료. 길 위에서 만나 같이 버텨 온 사람
- id: kin_comrade
  label: 길동무 (동료)
  rank: loner
  age: [18, 60]
  looks:
    - 챙 넓은 모자를 눌러쓴 사람. 걸으면서도 늘 길가의 건물 창을 센다
    - 왼손 새끼손가락이 없는 사람. 불 앞에 앉으면 붕괴 전 이야기를 조금씩 한다
