  skills: { survival: 1, scavenge: 1, sense_danger: 1 }
  traits: [genial, cautious, blunt, guarded, protective]
  trait_count: 2
  inventory:
    - { item: water_bottle }
    - { item: kitchen_knife, chance: 0.4 }
  values: { loyalty: 1, self_interest: 1 }
  profile:
    wants: [다 같이 겨울을 넘기는 것, 몫을 공정하게 나누는 것, 언젠가 담 안에 자리를 얻는 것]
    fears: [무리가 흩어지는 것, 감염체의 물결, 굶주림]
    voices:
