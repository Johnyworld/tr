# 발전소 목장의 이름 없는 사람들 (docs/cannibal-plan.md 2, storylets/ranch.yaml). 이야기에서만 들인다. 모두 성인

- id: ranch_penned
  label: 컨테이너에 갇힌 사람
  rank: loner
  age: [35, 66]
  looks:
    - { gender: male, text: "발목에 쇠사슬 자국이 검게 남은 남자. 얼굴은 말랐는데 배만 이상하게 불러 있다" }
    - { gender: female, text: "머리카락이 군데군데 빠진 여자. 손등에 숫자 대신 매듭 자국이 남았다. 먹을 것을 받으면 숨긴다" }
  stats: { vitality: [-1, 0], nerve: [-1, 1], senses: [0, 1] }
  skills: { endure: 2, survival: 1 }
  traits: [weary, guarded, protective, cautious]
  trait_count: 2
  values: { self_interest: 0, mercy: 1 }
  profile:
    wants: [컨테이너 밖에서 해를 보는 것, 먼저 끌려 나간 사람의 이름을 누군가에게 전하는 것, 고향 마을로 돌아가는 것]
    fears: [사슬 푸는 소리, 하루 세 끼를 꼬박 주는 것, 정비동 쪽에서 들리는 크레인 소리]
    voices:
      - { style: 갈라진 목소리의 짧은 존댓말, persona: { talk: -1 }, samples: ["밥을 너무 많이 줘요. 그게 무서워요.", "어제 옆 칸 사람이 나갔어요. 정비동 쪽으로요."] }
      - { style: 빠르게 쏟아내는 반말. 문 쪽을 자꾸 본다, samples: ["돼지 아니야. 여기 돼지 없어. 알지?", "사장 오기 전에 가. 아니면 나 데리고 가."] }
    rules: [사슬 소리가 나면 말을 멈춘다, 받은 먹을 것을 다 먹지 않고 남긴다]
    reputations: [길판수의 트럭에서 내려 발전소로 온 사람, 노역에 못 쓴다고 팔려 온 사람]
    secrets:
      - { content: 같은 칸의 사람들이 살이 오르는 차례대로 정비동으로 끌려 나갔다. 이제 자기 차례가 가깝다, reveal_when: 컨테이너 밖에서 먹을 것을 주거나 꺼내 주겠다고 했을 때, min_trust: 2 }
  ties: { chance: 0.3, kinds: [sibling, child, friend] }
  appears: { zones: [power_plant] }

- id: ranch_hand
  label: 목장 일꾼
  rank: loner
  age: [24, 50]
  looks:
    - { gender: male, text: "고무장화에 군용 점퍼를 걸친 남자. 허리에 사슬 열쇠를 찼다. 손톱 밑이 붉다" }
    - { gender: female, text: "머리를 질끈 묶은 여자. 앞치마 주머니에 소금 자루가 불룩하다. 웃는 얼굴로 사람 몸집을 훑는다" }
  stats: { strength: [0, 1], nerve: [0, 1], charm: [-1, 0] }
  skills: { fight: 1, intimidate: 1, survival: 1 }
  traits: [cold, calculating, greedy, cynical]
  trait_count: 2
  inventory:
    - { item: kitchen_knife, chance: 0.6 }
    - { item: crowbar, chance: 0.3 }
  values: { mercy: -2, self_interest: 2 }
  profile:
    wants: [이번 겨울도 배부르게 나는 것, 목장 몫을 더 받는 것]
    fears: [소두철 사장의 눈 밖에 나는 것, 무리 완장을 찬 사람들이 회처리장에 들어오는 것]
    voices:
      - { style: 시큰둥한 반말, samples: ["돼지우리야. 냄새 맡으러 왔어?", "고기 사러 온 거 아니면 돌아가."] }
    rules: [컨테이너 쪽으로 오는 사람은 끝까지 눈으로 따라간다]
    reputations: [발전소 돼지 목장 일꾼]
  appears: { zones: [power_plant] }

# 전장의 시체 거두는 사람 (docs/cannibal-plan.md 4, storylets/corpse_cart.yaml). 교전 뒤 하루 이틀 안에 수레를 끌고 온다
- id: corpse_carter
  label: 시체 수레꾼
  rank: loner
  age: [28, 60]
  looks:
    - { gender: male, text: "고무장갑을 팔꿈치까지 낀 남자. 수레 손잡이에 삽과 갈고리를 걸었다. 코와 입을 젖은 수건으로 동였다" }
    - { gender: female, text: "앞치마 위에 비옷을 걸친 여자. 시신 앞에서 짧게 손을 모으고 곧바로 발목을 잡는다" }
  stats: { strength: [0, 1], vitality: [0, 1], nerve: [1, 2] }
  skills: { endure: 2, survival: 1, sense_danger: 1 }
  traits: [cold, patient, calculating, weary]
  trait_count: 2
  inventory:
    - { item: crowbar, chance: 0.3 }
  values: { mercy: -1, self_interest: 2 }
  profile:
    wants: [싸움 난 자리에 남보다 먼저 닿는 것, 수레 한 번에 몫을 넉넉히 받는 것]
    fears: [완장 찬 사람들이 수레 덮개를 들추는 것, 목장 사장에게 빈 수레로 돌아가는 것]
    voices:
      - { style: 공손하고 무심한 존댓말, samples: ["묻어 드리는 겁니다. 아무도 안 묻어 주잖아요.", "덮개는 들추지 마세요. 냄새 납니다."] }
      - { style: 지친 반말, persona: { talk: -1 }, samples: ["비켜. 해 뜨기 전에 다 실어야 돼.", "산 사람은 안 실어. 아직은."] }
    rules: [수레 덮개는 남이 들추지 못하게 손으로 누른다, 무리 완장 앞에서는 묻어 주러 왔다고 한다]
    reputations: [싸움 뒤에 와서 시신을 거둬 가는 사람, 공동묘지에 묻어 준다는 사람]
    secrets:
      - { content: 수레는 공동묘지가 아니라 발전소 회처리장 목장으로 간다. 머릿수만큼 고기와 탄약을 받는다, reveal_when: 수레를 따라오거나 덮개 밑을 본 사람이 몰아세웠을 때, min_trust: 5 }
  appears: { zones: [power_plant] }
