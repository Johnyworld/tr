# 세력 초안 (기획서 2.2, 9.1). 숫자는 시작값이고 *임시*다. 이후 값은 세이브의 세력 상태에 있다
# public만 플레이어가 아는 정보다. 자원·사기·클락은 정보 필터를 거쳐 대략만 드러난다
# 자원은 "사람-일" 단위 (식량 1 = 한 사람 하루치)
- id: faction_a
  name: 청솔형제단
  public: 옛 공업고등학교에 자리 잡은 무리. "버리지 않는다"는 원칙을 지키려 한다.
  # 무기고 (기획서 4.8): 작전에 낡은 소총과 소총탄 두 묶음을 빌려준다
  armory: { items: { old_rifle: 1, rifle_rounds: 2 }, ammo_cost: 4 }
  population: 70
  combatants: 25
  resources: { food: 900, water: 500, ammo: 300, medicine: 40, fuel: 150 }
  morale: 1
  cohesion: 2
  aggression: 1
  disposition: { faction_b: 2, faction_c: -3 }
  culture:
    discipline: orderly
    summary: 분대 체계로 움직이는 무리. 명령은 분대장을 거쳐 내려오지만, "버리지 않는다"는 원칙이 명령보다 위에 있다. 회의에서 큰일을 정하고, 지도부도 식당 줄에 선다.
    rules:
      - 거점 안에서는 총을 함부로 쏘지 않는다
      - 배급은 하루 한 번 식당에서, 계급과 상관없이 같은 몫
      - 남의 몫에 손대는 것이 가장 무거운 잘못이다
      - 다친 동료를 두고 오지 않는다
      - 임무는 분대장을 통해 받고 분대장에게 보고한다
    address: 계급에 님을 붙인다 (분대장님, 간부님). 같은 분대끼리는 이름이나 형·누나
    punishment: 배급 줄이기, 보초 더 서기. 무거우면 회의에 올라가고, 원칙을 어긴 사람은 내보낸다
  plans:
    # 반격: 다 차면 맞닿은 붉은연합의 구역 중 잃은 땅·값진 곳을 친다. 전선 임무와 정찰 이야기가 앞당긴다
    - { id: a_counteroffensive, label: 반격 준비, target_rule: frontier, days: 14 }

- id: faction_b
  name: 버들마을
  public: 청솔형제단과 손잡은 작은 무리. 청솔형제단에 기대고 있지만 붉은연합의 회유가 들어온다는 소문이 끊이지 않는다.
  # 무기고: 마을 사냥총 몇 자루뿐이다
  armory: { items: { shotgun: 1, shells: 2 }, ammo_cost: 3 }
  population: 40
  combatants: 14
  resources: { food: 450, water: 350, ammo: 120, medicine: 15, fuel: 60 }
  morale: 0
  cohesion: 0
  aggression: 0
  disposition: { faction_a: 2, faction_c: -2 }
  culture:
    discipline: loose
    summary: 마을 회의로 꾸려 가는 이웃 공동체. 경비조는 군대가 아니라 돌아가며 서는 당번이고, 서로의 사정을 들어 준다. 대신 식구가 많아 말이 많다.
    rules:
      - 정문과 쪽문은 해가 지면 닫는다
      - 우물물은 집집이 순서대로 긷는다
      - 아이들은 옥상에 올라가지 않는다
      - 큰일은 대표가 회의에 부쳐 정한다
    address: 이름이나 아저씨·이모·언니, 대표는 대표님
    punishment: 회의에서 말로 따진다. 당번을 늘리거나 몫을 줄이고, 정말 심하면 단지에서 내보낸다
  plans:
    # 흔들림: 다 차면 청솔형제단과의 연합에서 발을 빼고 붉은연합과 화해한다 (한 번뿐, 기획서 9.4 shift).
    # 붉은연합의 회유·뇌물이 당기고, 연합을 지키는 쪽의 이야기가 늦춘다. 버들마을 사람만 안다
    - id: b_waver
      label: 연합에서 발 빼기
      kind: shift
      days: 30
      shift:
        - { to: faction_a, value: 0 }
        - { to: faction_c, value: 0 }
        - { from: faction_c, to: faction_b, value: 0 }
        - { from: faction_a, to: faction_b, value: -1 }
      news: "{faction}이 청솔형제단과의 약조에서 발을 뺐다. 붉은연합과 따로 말이 오갔다고 한다"

- id: faction_c
  name: 붉은연합
  public: 가장 큰 무리. 이익 앞에서 잔혹하다는 평이 있고, 포로를 거칠게 다룬다는 소문이 돈다.
  # 무기고: 작전에 개조 산탄총과 산탄. 쓴 산탄은 할당량에서 깐다
  armory: { items: { sawn_shotgun: 1, shells: 2 }, ammo_cost: 4 }
  population: 200
  combatants: 80
  resources: { food: 3000, water: 1600, ammo: 1200, medicine: 80, fuel: 500 }
  morale: 0
  cohesion: -1
  aggression: 2
  disposition: { faction_a: -3, faction_b: -3, faction_d: -1 }
  culture:
    discipline: strict
    summary: 숫자와 할당량으로 굴러가는 군대식 조직. 위원회의 결정은 되묻지 않고, 규율반이 막사마다 귀를 둔다. 크지만 서로를 믿지 않는다.
    rules:
      - 조마다 날마다 할당량을 채운다. 못 채우면 조 전체의 배급이 깎인다
      - 아침저녁 점호에 빠지지 않는다
      - 위원회의 결정에 토를 달지 않는다
      - 탈영하다 잡히면 광장에서 본보기로 벌한다
      - 수상한 동료는 규율반에 알린다
    address: 조장님·위원님. 조원끼리는 성이나 조 번호로 부른다
    punishment: 배급 삭감, 광장의 본보기, 수용소 경비나 공세 맨 앞줄로 보내기
  plans:
    # lore/faction_c_inside.md "동쪽 공세". 붉은연합 사람만 안다
    - { id: c_east_offensive, label: 동쪽 공세 준비, target_rule: fixed, target: a_east_post, days: 10 }

- id: faction_d
  name: 하얀매
  public: 의약품과 의술을 가진 작은 무리. 약을 거래 조건으로 쓴다.
  population: 30
  combatants: 6
  resources: { food: 300, water: 300, ammo: 60, medicine: 200, fuel: 40 }
  morale: 0
  cohesion: 2
  aggression: 0
  culture:
    discipline: orderly
    summary: 의술과 장부로 움직이는 작은 전문가 집단. 위계는 총이 아니라 의술의 순서다. 중립을 지키는 대신 규칙에는 예외가 없다.
    rules:
      - 물리거나 긁힌 사람은 누구든 격리실에서 사흘
      - 다친 사람은 소속을 가리지 않고 받되, 약은 값을 받고 내준다
      - 약제실은 열쇠를 가진 사람만 들어간다
      - 진료소 안에서는 누구도 무기를 들지 않는다
    address: 의사는 선생님, 수간호사는 수간호사님, 수습은 이름으로
    punishment: 약제실 출입 금지, 격리실 당직 더 서기. 약을 빼돌리면 내보낸다
  plans:
    # 기울기: 중립이 무너져, 다 차면 그때 가장 큰 무리에 약을 먼저 대기로 한다 (한 번뿐, shift).
    # 독점 제안을 받아들이거나 뒷거래를 감싸면 당기고, 진료소의 규칙을 지키면 늦춘다. 하얀매 사람만 안다
    - id: d_lean
      label: 한쪽에 약을 먼저 대기
      kind: shift
      days: 40
      shift:
        - { to: strongest, value: 2 }
      news: "{faction}이 {to}에 약을 먼저 대기로 했다는 말이 돈다. 다른 무리 사람은 진료소 줄 끝으로 밀린다고 한다"

- id: faction_e
  name: 나루상단
  public: 교역으로 사는 상인 무리. 이기는 쪽에 붙을 거라는 말이 많다.
  population: 50
  combatants: 12
  resources: { food: 700, water: 500, ammo: 200, medicine: 30, fuel: 200 }
  morale: 1
  cohesion: 1
  aggression: 0
  culture:
    discipline: free
    summary: 명령 대신 계약과 장부로 묶인 상인 무리. 일감을 받든 말든 각자 자유고, 위아래보다 셈이 먼저다. 다만 빚과 약속은 끝까지 따라온다.
    rules:
      - 장부에 적힌 빚은 반드시 갚는다
      - 짐을 빼돌린 사람은 그날로 끝이다
      - 정수장 안에서는 누구도 총을 꺼내지 않는다
      - 누구에게나 판다. 값만 맞으면
    address: 이름이나 대장, 우두머리는 사장님
    punishment: 장부에 빚으로 올린다. 짐이나 약속에 손대면 쫓아내고, 다른 무리에도 소문을 낸다
  plans:
    # 편들기: 다 차면 그때 가장 큰 무리 쪽에 붙는다 (한 번뿐, shift). 상단 사람이 어느 편에 짐을 실어 주느냐가 당기고 늦춘다
    - id: e_side
      label: 이기는 쪽에 붙기
      kind: shift
      days: 35
      shift:
        - { to: strongest, value: 2 }
      news: "{faction}이 {to} 쪽에 붙었다는 말이 돈다. 이제 물값이 무리마다 다르다고 한다"


# 여울섬 (기획서 9.12): 바다 건너 닫힌 낙원. 시작할 수 없고(startable: false), 누구와도 맞닿아 있지 않아 교전에 끼지 않는다
# 해금된 시나리오(role_y_islander)로만 이 무리 사람으로 산다. 겉은 낙원, 의회 상층은 인육을 즐긴다 (lore secret:y_feast_seen)
- id: faction_y
  name: 여울섬
  public: 강 하구 바다 건너의 섬. 담 안에 먹을 것과 탄약이 넘친다는 소문의 "파라다이스". 감염체도 바다를 못 건넌다. 바깥 사람은 들이지 않는다.
  startable: false
  # 무기고: 탄약이 넘친다
  armory: { items: { old_rifle: 1, rifle_rounds: 4 }, ammo_cost: 2 }
  population: 140
  combatants: 50
  resources: { food: 3200, water: 2400, ammo: 2600, medicine: 220, fuel: 900 }
  morale: 2
  cohesion: 2
  aggression: 0
  disposition: { faction_a: -1, faction_b: -1, faction_c: -1, faction_d: -1, faction_e: 0 }
  culture:
    discipline: strict
    summary: 섬 의회가 모든 것을 정하는 닫힌 공동체. 겉으로는 다정하고 넉넉하다. 쓸모를 증명한 사람만 남고, 쓸모가 다한 사람은 "뭍으로 내보낸다"고 한다. 의회의 결정은 묻지 않는다.
    rules:
      - 섬에 들어온 사람은 의회의 허락 없이 나가지 않는다
      - 쓸모를 증명한다. 일하지 않는 입은 오래 머물지 못한다
      - 의회의 결정은 묻지 않는다
      - 바깥 사람과 말을 섞지 않는다
      - 겨울 잔치에는 부른 사람만 간다
    address: 이름에 씨를 붙인다. 의회 사람은 어르신
    punishment: 배급을 끊는다. 무거우면 "뭍으로 내보낸다" (돌아온 사람은 없다)
