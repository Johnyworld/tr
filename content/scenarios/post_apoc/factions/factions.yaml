# 세력 초안 (기획서 2.2, 9.1). 숫자는 시작값이고 *임시*다. 이후 값은 세이브의 세력 상태에 있다
# public만 플레이어가 아는 정보다. 자원·사기·클락은 정보 필터를 거쳐 대략만 드러난다
# 자원은 "사람-일" 단위 (식량 1 = 한 사람 하루치)
- id: faction_a
  name: 청솔형제단
  public: 옛 공업고등학교에 자리 잡은 무리. "버리지 않는다"는 원칙을 지키려 한다.
  population: 70
  combatants: 25
  resources: { food: 900, water: 500, ammo: 300, medicine: 40, fuel: 150 }
  morale: 1
  cohesion: 2
  aggression: 1
  disposition: { faction_b: 2, faction_c: -3 }
  plans:
    # 반격: 다 차면 맞닿은 붉은연합의 구역 중 잃은 땅·값진 곳을 친다. 전선 임무와 정찰 이야기가 앞당긴다
    - { id: a_counteroffensive, label: 반격 준비, target_rule: frontier, days: 14 }

- id: faction_b
  name: 버들마을
  public: 청솔형제단과 손잡은 작은 무리. 청솔형제단에 기대고 있지만 붉은연합의 회유가 들어온다는 소문이 끊이지 않는다.
  population: 40
  combatants: 14
  resources: { food: 450, water: 350, ammo: 120, medicine: 15, fuel: 60 }
  morale: 0
  cohesion: 0
  aggression: 0
  disposition: { faction_a: 2, faction_c: -2 }
  plans:
    # 흔들림: 다 차면 청솔형제단과의 연합에서 발을 빼고 붉은연합과 화해한다 (한 번뿐, 기획서 9.4 shift).
    # 붉은연합의 회유·뇌물이 당기고, 연합을 지키는 쪽의 이야기가 늦춘다. 버들마을 사람만 안다
    - id: b_waver
      label: 연합에서 발 빼기
      kind: shift
      days: 30
      shift:
        - { to: faction_a, value: 0 }
        - { to: faction_c, value: 0 }
        - { from: faction_c, to: faction_b, value: 0 }
        - { from: faction_a, to: faction_b, value: -1 }
      news: "{faction}이 청솔형제단과의 약조에서 발을 뺐다. 붉은연합과 따로 말이 오갔다고 한다"

- id: faction_c
  name: 붉은연합
  public: 가장 큰 무리. 이익 앞에서 잔혹하다는 평이 있고, 포로를 거칠게 다룬다는 소문이 돈다.
  population: 200
  combatants: 80
  resources: { food: 3000, water: 1600, ammo: 1200, medicine: 80, fuel: 500 }
  morale: 0
  cohesion: -1
  aggression: 2
  disposition: { faction_a: -3, faction_b: -3, faction_d: -1 }
  plans:
    # lore/faction_c_inside.md "동쪽 공세". 붉은연합 사람만 안다
    - { id: c_east_offensive, label: 동쪽 공세 준비, target_rule: fixed, target: a_east_post, days: 10 }

- id: faction_d
  name: 하얀매
  public: 의약품과 의술을 가진 작은 무리. 약을 거래 조건으로 쓴다.
  population: 30
  combatants: 6
  resources: { food: 300, water: 300, ammo: 60, medicine: 200, fuel: 40 }
  morale: 0
  cohesion: 2
  aggression: 0

- id: faction_e
  name: 나루상단
  public: 교역으로 사는 상인 무리. 이기는 쪽에 붙을 거라는 말이 많다.
  population: 50
  combatants: 12
  resources: { food: 700, water: 500, ammo: 200, medicine: 30, fuel: 200 }
  morale: 1
  cohesion: 1
  aggression: 0
  plans:
    # 편들기: 다 차면 그때 가장 큰 무리 쪽에 붙는다 (한 번뿐, shift). 상단 사람이 어느 편에 짐을 실어 주느냐가 당기고 늦춘다
    - id: e_side
      label: 이기는 쪽에 붙기
      kind: shift
      days: 35
      shift:
        - { to: strongest, value: 2 }
      news: "{faction}이 {to} 쪽에 붙었다는 말이 돈다. 이제 물값이 무리마다 다르다고 한다"

