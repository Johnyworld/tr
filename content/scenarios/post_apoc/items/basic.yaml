# 기본 아이템 (기획서 4.8). 한 파일에 목록으로 여러 개를 둘 수 있다
# weight: kg (없으면 0.5), value: 흥정 값 (통조림 하나 = 3쯤), 무기·방어구·도구·내구도·수리는 선택 (*임시* 수치)
- id: kitchen_knife
  name: 부엌칼
  description: 날이 군데군데 이가 빠진 부엌칼. 무기라기보다는 도구에 가깝다.
  kind: weapon
  weight: 0.3
  value: 2
  weapon: { moves: [fight], max_harm: light, noise: 0, wound: { fight: cut } }
  durability: 6
  breaks_into: scrap_metal
  repair: { move: maintenance, materials: { scrap_metal: 1 } }
- id: water_bottle
  name: 물병
  icon: water
  description: 물을 채운 찌그러진 알루미늄 물병. 마시면 갈증이 가신다 (갈증 2단계).
  kind: misc
  resource: water
  weight: 0.6
  value: 1
  used_into: empty_bottle
- id: radio
  name: 무전기
  icon: tool
  description: 배터리 덮개를 테이프로 감아 둔 휴대용 무전기.
  kind: tool
  weight: 0.6
  value: 8
- id: old_rifle
  name: 낡은 소총
  description: 개머리판에 금이 간 소총. 소총탄이 있어야 쏜다. 총소리가 멀리 간다.
  kind: weapon
  weight: 3.5
  value: 18
  weapon: { moves: [shoot, fight], max_harm: heavy, noise: 2, ammo: rifle_rounds, ammo_moves: [shoot], wound: { shoot: gunshot, fight: blunt }, range: { shoot: { close: -1, near: 0, far: 0 } } }
  durability: 8
  breaks_into: scrap_metal
  repair: { move: maintenance, materials: { scrap_metal: 1, duct_tape: 1 }, tools: [toolkit] }
- id: binoculars
  name: 쌍안경
  icon: tool
  description: 한쪽 렌즈에 실금이 간 쌍안경. 멀리서 살피는 데 좋다.
  kind: tool
  weight: 0.6
  value: 7
  tool: { bonus: { sense_danger: 1 } }
- id: medkit
  name: 구급상자
  description: 붕대와 소독약이 조금 남은 구급상자. 응급처치에 쓴다 (지니면 응급처치 +1, 성공하거나 대가 있는 성공이면 하나 쓴다).
  kind: consumable
  resource: medicine
  weight: 1.0
  value: 9
  tool: { bonus: { first_aid: 1 } }
- id: cigarettes
  name: 담배
  description: 눅눅해진 담배 한 갑. 거점 안에서는 돈처럼 쓰인다. 골초는 하루에 한 갑을 피운다.
  kind: misc
  weight: 0.1
  value: 2
- id: ledger
  name: 배급 장부
  icon: paper
  description: 손때 묻은 두꺼운 장부. 배급 내역이 빽빽하게 적혀 있다.
  kind: misc
  weight: 0.8
  value: 1
- id: explosive
  name: 사제 폭약
  icon: bomb
  description: 비료와 연료로 만든 폭약 한 덩이. 도화선이 짧다.
  kind: material
  weight: 1.5
  value: 10
- id: wire_roll
  name: 철사 뭉치
  description: 녹슨 철사와 빈 깡통 몇 개. 덫을 엮을 수 있다.
  kind: material
  weight: 0.8
  value: 2
- id: antibiotics
  name: 항생제
  description: 유효기간이 지난 항생제 한 줄. 상처가 곪는 것을 막는다. 감염을 낫게 하지는 못하지만, 먹는 동안은 퍼지는 것이 더디다.
  kind: consumable
  resource: medicine
  weight: 0.1
  value: 14
- id: serum
  name: 혈청
  description: 냉장 가방에 든 앰플 하나. 물린 사람을 되돌린다는 유일한 약. 부르는 게 값이고, 진짜인지는 맞아 봐야 안다.
  kind: consumable
  weight: 0.1
  value: 60
- id: c_armband
  name: 붉은연합 완장
  icon: paper
  description: 붉은 천에 검은 줄을 그은 완장. 붉은연합 병사들이 왼팔에 찬다.
  kind: misc
  weight: 0.05
  value: 1
- id: trade_token
  name: 나루상단 통행패
  icon: paper
  description: 구멍 뚫린 동전에 끈을 꿴 것. 나루상단의 장터에서 신원 보증으로 쓴다.
  kind: misc
  weight: 0.05
  value: 3
- id: canned_food
  name: 통조림
  description: 라벨이 떨어져 나간 통조림. 흔들면 무언가 출렁인다.
  kind: food
  weight: 0.4
  value: 3
- id: blanket
  name: 담요
  icon: cloth
  description: 군데군데 해진 군용 담요. 자거나 쉴 때 덮으면 덜 춥다 (체감 +5°).
  kind: tool
  weight: 1.5
  value: 3
  warmth: { degrees: 5, when: resting }
- id: coat
  name: 방한복
  icon: cloth
  description: 솜이 뭉친 두꺼운 방한 외투. 입으면 덜 춥고 (체감 +6°), 두꺼운 솜이 이빨을 조금 막는다.
  kind: armor
  weight: 2.0
  value: 6
  armor: { slot: outer, reduces: 0, blocks_infection: 0.3 }
  # 12-186: +6이면 입기만 해도 겨울이 없어져 +4로 (모닥불·잠자리를 함께 챙겨야 버틴다)
  warmth: { degrees: 4, when: worn }
- id: firewood
  name: 땔감
  icon: fire
  description: 부러진 가구와 마른 나뭇가지 한 아름. 불을 피우면 네 시간쯤 탄다.
  kind: material
  resource: fuel
  weight: 2.0
  value: 1
- id: fever_reducer
  name: 해열제
  description: 유통기한이 지난 해열제 몇 알. 앓는 몸을 조금 낫게 한다 (질병 1단계).
  kind: consumable
  resource: medicine
  weight: 0.1
  value: 5
- id: shotgun
  name: 엽총
  description: 개머리판에 테이프를 감은 낡은 엽총. 산탄이 있어야 쏜다. 가까이서 무섭고, 시끄럽다.
  kind: weapon
  weight: 3.0
  value: 16
  weapon: { moves: [shoot], max_harm: heavy, noise: 2, ammo: shells, wound: { shoot: gunshot }, range: { shoot: { close: 1, near: 0 } } }
  durability: 6
  breaks_into: scrap_metal
  repair: { move: maintenance, materials: { scrap_metal: 1, duct_tape: 1 }, tools: [toolkit] }
- id: crowbar
  name: 쇠지렛대
  icon: club
  description: 끝이 구부러진 쇠지렛대. 문을 따거나 휘두르기 좋다. 지니고 있으면 뒤지기도 수월하다.
  kind: weapon
  weight: 1.5
  value: 4
  weapon: { moves: [fight], max_harm: light, noise: 0, wound: { fight: blunt } }
  tool: { bonus: { scavenge: 1 } }
  durability: 12
- id: dry_ration
  name: 마른 비상식량
  description: 비닐에 싸인 딱딱한 건빵 몇 조각. 먹으면 허기가 조금 가신다.
  kind: food
  weight: 0.3
  value: 2
- id: cucumber
  name: 오이
  description: 껍질이 우둘투둘한 오이 한 개. 물기가 많아 목도 조금 축인다.
  kind: food
  perishable: 0.1
  weight: 0.3
  value: 1
- id: tomato
  name: 토마토
  description: 덜 익어 단단한 토마토 한 알. 며칠 지나면 무른다.
  kind: food
  perishable: 0.15
  weight: 0.2
  value: 1
- id: apple
  name: 사과
  description: 작고 시큼한 사과 한 알. 벌레 먹은 자리를 도려내면 먹을 만하다.
  kind: food
  perishable: 0.05
  weight: 0.2
  value: 1
- id: dried_fish
  name: 말린 생선
  description: 소금에 절여 바싹 말린 생선. 짜고 질기지만 오래 간다.
  kind: food
  weight: 0.3
  value: 3
- id: salted_meat
  name: 소금 절임 고기
  description: 무슨 고기인지 묻지 않는 게 좋은 절임 고기 한 덩이. 짜다.
  kind: food
  weight: 0.4
  value: 3
- id: potato
  name: 감자
  description: 흙이 묻은 감자 몇 알. 싹이 난 데를 도려내야 한다.
  kind: food
  perishable: 0.02
  weight: 0.4
  value: 1
- id: wild_greens
  name: 들풀
  description: 냉이와 씀바귀 같은 들풀 한 줌. 쓰지만 배는 조금 찬다.
  kind: food
  perishable: 0.3
  weight: 0.1
  value: 1
- id: mushroom
  name: 버섯
  description: 축축한 그늘에서 딴 버섯 몇 송이. 먹을 수 있는 것만 골랐기를.
  kind: food
  perishable: 0.25
  weight: 0.1
  value: 1
# 먹고 마시기 (12-131): 사냥·낚시로 얻는 날것, 훈연한 것, 끓이지 않은 물
- id: raw_fish
  name: 날생선
  description: 강에서 막 건진 붕어 한 마리. 비린내가 난다. 하루 이틀이면 상한다.
  kind: food
  weight: 0.4
  value: 2
  perishable: 0.4
- id: raw_meat
  name: 날고기
  description: 막 잡은 짐승의 고기 한 덩이. 피가 덜 빠졌다. 하루 이틀이면 상한다.
  kind: food
  weight: 0.6
  value: 3
  perishable: 0.4
- id: smoked_meat
  name: 훈제 고기
  description: 연기에 그을려 말린 고기. 검고 질기지만 오래 간다.
  kind: food
  weight: 0.4
  value: 4
- id: dirty_water
  name: 끓이지 않은 물병
  icon: water
  description: 강이나 우물에서 그냥 떠 온 물. 끓이지 않고 마시면 탈이 날 수 있다. 불 곁에서 마시면 끓여 마신다.
  kind: misc
  weight: 0.6
  value: 0
  used_into: empty_bottle
  contaminated: 0.15
- id: empty_bottle
  name: 빈 물병
  icon: water
  description: 찌그러진 알루미늄 물병. 비어 있다. 물을 채우면 다시 마실 수 있다.
  kind: misc
  weight: 0.2
  value: 1
# 바깥 세계의 손길 (12-150): 남쪽에서 떨어진 보급 상자에서만 나온다
- id: mil_ration
  name: 군용 전투식량
  description: 국방색 비닐 봉지. 유통기한이 붕괴 뒤의 날짜로 찍혀 있다. 누군가 아직 이걸 만들고 있다.
  kind: food
  weight: 0.5
  value: 6
- id: mil_serum
  name: 찍힌 번호의 혈청
  description: 군용 냉장 팩에 든 앰플 하나. 바닥에 손글씨가 아니라 기계로 찍은 번호가 있다. 물린 사람을 되돌린다.
  icon: medicine
  kind: consumable
  weight: 0.1
  value: 70
# 술·진통제·각성제 (12-157). 효과는 scenario.yaml consumables, 버릇은 body.dependence
- id: soju
  name: 소주
  description: 상표가 반쯤 벗겨진 초록 병 소주. 마시면 얼큰해져 겁이 덜 난다 (술기운 1단계).
  kind: consumable
  weight: 0.4
  value: 3
- id: moonshine
  name: 밀주
  description: 감자와 썩은 과일로 담근 탁한 술. 독하다 (술기운 2단계). 많이 마시면 속이 뒤집힌다.
  kind: consumable
  weight: 0.5
  value: 2
- id: painkiller
  name: 진통제
  description: 알약 몇 개가 남은 진통제 통. 몇 시간 동안 고통을 무디게 한다 (상처는 그대로). 자꾸 먹으면 끊기 어렵다.
  kind: consumable
  resource: medicine
  weight: 0.1
  value: 4
- id: morphine
  name: 모르핀 앰플
  description: 군 의료품 상자에서 나온 모르핀 앰플. 반나절 가까이 고통을 지운다. 몸이 금방 기억한다.
  kind: consumable
  resource: medicine
  weight: 0.1
  value: 10
- id: stimulant
  name: 각성제
  description: 은박지에 싼 흰 알약. 잠과 피로를 잊게 한다 (열 시간쯤). 쉽게 손이 간다.
  kind: consumable
  weight: 0.05
  value: 8
# 유품 (12-158): 쓸모는 없고 마음의 물건이다
- id: faded_photo
  name: 빛바랜 사진
  description: 모서리가 닳은 사진 한 장. 누군가 오래 품고 다녔다. 값은 없다.
  kind: misc
  weight: 0.01
  value: 0
