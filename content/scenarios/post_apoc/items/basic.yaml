# 기본 아이템. 한 파일에 목록으로 여러 개를 둘 수 있다
- id: kitchen_knife
  name: 부엌칼
  description: 날이 군데군데 이가 빠진 부엌칼. 무기라기보다는 도구에 가깝다.
- id: water_bottle
  name: 물병
  description: 찌그러진 알루미늄 물병.
- id: radio
  name: 무전기
  description: 배터리 덮개를 테이프로 감아 둔 휴대용 무전기.
- id: old_rifle
  name: 낡은 소총
  description: 개머리판에 금이 간 소총. 탄약은 따로 배급된다.
- id: binoculars
  name: 쌍안경
  description: 한쪽 렌즈에 실금이 간 쌍안경.
- id: medkit
  name: 구급상자
  description: 붕대와 소독약이 조금 남은 구급상자.
- id: cigarettes
  name: 담배
  description: 눅눅해진 담배 몇 개비. 거점 안에서는 돈처럼 쓰인다.
- id: ledger
  name: 배급 장부
  description: 손때 묻은 두꺼운 장부. 배급 내역이 빽빽하게 적혀 있다.
- id: explosive
  name: 사제 폭약
  description: 비료와 연료로 만든 폭약 한 덩이. 도화선이 짧다.
- id: wire_roll
  name: 철사 뭉치
  description: 녹슨 철사와 빈 깡통 몇 개. 덫을 엮을 수 있다.
- id: antibiotics
  name: 항생제
  description: 유효기간이 지난 항생제 한 줄. 그래도 거점에서는 금보다 귀하다.
- id: c_armband
  name: C 완장
  description: 붉은 천에 검은 줄을 그은 완장. C 병사들이 왼팔에 찬다.
- id: trade_token
  name: E 통행패
  description: 구멍 뚫린 동전에 끈을 꿴 것. E의 장터에서 신원 보증으로 쓴다.
- id: canned_food
  name: 통조림
  description: 라벨이 떨어져 나간 통조림. 흔들면 무언가 출렁인다.
