  kind: consumable
  weight: 0.1
  value: 3

# ── 급조 물건 (기획서 4.8, 급조 스킬로 만든다) ──
- id: fuel_bottle
  name: 기름 한 병
  icon: fire
  description: 차에서 빼낸 휘발유를 담은 유리병. 마개를 단단히 막아 두었다.
  kind: material
  weight: 0.6
  value: 4
- id: molotov
  name: 화염병
  icon: fire
  description: 기름병 입구에 천을 쑤셔 넣은 것. 던지면 한 번에 끝난다. 불빛과 소리가 감염체를 부른다.
  kind: weapon
  weight: 0.6
  value: 6
