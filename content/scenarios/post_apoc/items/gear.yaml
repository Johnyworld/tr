# 무기·탄약·방어구·도구·재료 (기획서 4.8, *임시* 수치)
# 탄약 하나 = 한 번 쏠 때 쓰는 몇 발 묶음. 쏘는 공격 한 번에 하나씩 준다

# ── 탄약 ─────────────────────────────────────────
- id: rifle_rounds
  name: 소총탄 (몇 발)
  description: 고무줄로 묶은 소총탄 몇 발. 한 번 쏘는 데 이만큼 든다. 재생탄이 섞여 있다.
  kind: ammo
  weight: 0.1
  value: 3
- id: pistol_rounds
  name: 권총탄 (몇 발)
  description: 짧고 뭉툭한 권총탄 몇 발. 지구대나 옛 경비실에서 나온다. 소총탄보다 귀하다.
  kind: ammo
  weight: 0.05
  value: 4
- id: shells
  name: 산탄 (몇 발)
  description: 종이 껍데기가 눅눅한 산탄 몇 발.
  kind: ammo
  weight: 0.15
  value: 3
- id: bolts
  name: 석궁 볼트 (몇 대)
  description: 쇠못을 박은 나무 볼트 몇 대. 주워서 다시 쓸 수도 있다.
  kind: ammo
  weight: 0.15
  value: 1
- id: arrows
  name: 화살 (몇 대)
  description: 곧은 나뭇가지에 깃 대신 비닐을 붙이고 못 촉을 단 화살 몇 대. 주워서 다시 쓸 수도 있다.
  kind: ammo
  weight: 0.1
  value: 1
- id: harpoons
  name: 작살 (몇 대)
  description: 끝을 갈아 세운 쇠작살 몇 대. 여울섬 공방에서 만든다.
  kind: ammo
  weight: 0.6
  value: 4

# ── 무기 ─────────────────────────────────────────
# 나이프 (12-94): 깊게 베지는 못하지만 맞붙으면 빠르고(+1), 조용하고, 가볍다. 지니고만 있어도 생존을 돕고 화살·볼트를 깎는다
- id: combat_knife
  name: 전투 나이프
  icon: blade
  description: 손잡이에 끈을 감은 날 넓은 나이프. 붙어서 싸울 때 빠르고, 밖에서 사는 데 쓸 데가 많다.
  kind: weapon
  weight: 0.3
  value: 10
  weapon: { moves: [fight], max_harm: light, noise: 0, wound: { fight: cut }, range: { fight: { close: 1 } } }
  tool: { bonus: { survival: 1 } }
  durability: 10
  breaks_into: scrap_metal
  repair: { move: maintenance, materials: { scrap_metal: 1 } }
- id: machete
  name: 마체테
  description: 칼등이 두꺼운 정글도. 휘두르면 소리 없이 깊게 벤다.
  kind: weapon
  weight: 1.0
  value: 9
  weapon: { moves: [fight], max_harm: heavy, noise: 0, wound: { fight: cut } }
  durability: 8
  breaks_into: scrap_metal
  repair: { move: maintenance, materials: { scrap_metal: 1 } }
- id: baseball_bat
  name: 야구방망이
  icon: club
  description: 못을 몇 개 박아 둔 나무 방망이. 손잡이에 덕트 테이프를 감았다.
  kind: weapon
  weight: 1.0
  value: 3
  weapon: { moves: [fight], max_harm: light, noise: 0, bonus: 1, wound: { fight: blunt } }
  durability: 6
  breaks_into: planks
  repair: { move: improvise, materials: { duct_tape: 1 } }
- id: pipe_spear
  name: 사제 창
  description: 쇠파이프 끝에 부엌칼을 테이프로 감아 붙인 창. 감염체를 거리를 두고 찌른다.
  kind: weapon
  weight: 1.8
  value: 5
  weapon: { moves: [fight], max_harm: heavy, noise: 0, wound: { fight: pierce } }
  durability: 4
  breaks_into: scrap_metal
  repair: { move: improvise, materials: { duct_tape: 1 } }
- id: pistol
  name: 권총
  description: 총열에 녹이 슨 경찰 권총. 작고 가볍지만 쏘면 시끄럽다. 권총탄을 쓴다.
  kind: weapon
  weight: 0.9
  value: 20
  weapon: { moves: [shoot], max_harm: heavy, noise: 2, ammo: pistol_rounds, wound: { shoot: gunshot }, range: { shoot: { close: 0, near: 0, far: -2 } } }
  durability: 6
  breaks_into: scrap_metal
  repair: { move: maintenance, materials: { scrap_metal: 1 }, tools: [toolkit] }
- id: crossbow
  name: 석궁
  icon: bow
  description: 자전거 부품으로 만든 석궁. 장전이 느리지만 소리가 거의 없다.
  kind: weapon
  weight: 3.0
  value: 14
  weapon: { moves: [shoot], max_harm: heavy, noise: 0, ammo: bolts, wound: { shoot: pierce }, range: { shoot: { close: -1, near: 0, far: 0 } } }
  durability: 6
  breaks_into: planks
  repair: { move: improvise, materials: { planks: 1, wire_roll: 1 } }
# 활 (12-93): 소리 없이 쏘고 화살은 깎아 만든다. 맞붙으면 시위를 당길 틈이 없다
- id: wooden_bow
  name: 급조한 나무 활
  icon: bow
  description: 생나무를 휘어 노끈을 건 활. 가볍고 조용하지만 힘이 약해 깊이 박히지 않는다.
  kind: weapon
  weight: 0.5
  value: 4
  weapon: { moves: [shoot], max_harm: light, noise: 0, ammo: arrows, bonus: -1, wound: { shoot: pierce }, range: { shoot: { close: -1, near: 0 } } }
  durability: 4
  breaks_into: planks
  repair: { move: carpentry, materials: { planks: 1 } }
- id: recurve_bow
  name: 양궁 활
  icon: bow
  description: 대학 양궁부 창고에서 나온 리커브 활. 다룰 줄 알면 멀리서도 조용히 꿰뚫는다.
  kind: weapon
  weight: 1.0
  value: 18
  weapon: { moves: [shoot], max_harm: heavy, noise: 0, ammo: arrows, wound: { shoot: pierce }, range: { shoot: { close: -1, near: 0, far: -1 } } }
  durability: 7
  breaks_into: scrap_metal
  repair: { move: maintenance, materials: { wire_roll: 1 } }
- id: sawn_shotgun
  name: 개조 산탄총
  description: 총열을 잘라 낸 붉은연합식 산탄총. 가까이서는 무섭고, 오래 버티지 못한다.
  kind: weapon
  weight: 2.2
  value: 15
  weapon: { moves: [shoot], max_harm: heavy, noise: 2, ammo: shells, wound: { shoot: gunshot }, range: { shoot: { close: 1, near: -1 } } }
  durability: 4
  breaks_into: scrap_metal
  repair: { move: maintenance, materials: { scrap_metal: 1, duct_tape: 1 }, tools: [toolkit] }
- id: harpoon_gun
  name: 작살총
  icon: bow
  description: 여울섬 경비가 메는 고무줄 작살총. 무겁지만 총소리가 나지 않는다.
  kind: weapon
  weight: 4.0
  value: 22
  weapon: { moves: [shoot], max_harm: heavy, noise: 1, ammo: harpoons, wound: { shoot: pierce }, range: { shoot: { close: 0, near: 0 } } }
  durability: 8
  breaks_into: scrap_metal
  repair: { move: maintenance, materials: { scrap_metal: 1, wire_roll: 1 } }

# ── 방어구 ───────────────────────────────────────
- id: moto_helmet
  name: 오토바이 헬멧
  description: 앞 가리개가 깨진 오토바이 헬멧. 머리를 지켜 주지만 옆 소리가 잘 안 들린다.
  kind: armor
  weight: 1.5
  value: 8
  armor: { slot: head, reduces: 1, penalty: { sense_danger: -1 } }
  durability: 3
  breaks_into: scrap_metal
- id: leather_jacket
  name: 두꺼운 가죽 재킷
  description: 팔꿈치까지 잡지를 덧대 꿰맨 가죽 재킷. 이빨이 살까지 잘 들어오지 않는다.
  kind: armor
  weight: 2.5
  value: 9
  armor: { slot: body, reduces: 0, blocks_infection: 0.6 }
  durability: 6
  repair: { move: improvise, materials: { cloth: 1, duct_tape: 1 } }
- id: padded_armor
  name: 덧댄 갑옷
  description: 잡지와 고철 조각을 덕트 테이프로 몸통에 두른 것. 투박하고 시끄럽다.
  kind: armor
  weight: 3.0
  value: 6
  armor: { slot: body, reduces: 1, penalty: { stealth: -1 }, blocks_infection: 0.3 }
  durability: 3
  breaks_into: scrap_metal
  repair: { move: improvise, materials: { cloth: 1, duct_tape: 1 } }
- id: kevlar_vest
  name: 방탄 조끼
  description: 경찰 표식이 지워진 방탄 조끼. 총알도 막지만 무겁고 몸이 굳는다.
  kind: armor
  weight: 4.5
  value: 26
  armor: { slot: body, reduces: 1, penalty: { stealth: -1 }, blocks_infection: 0.4 }
  durability: 5
  breaks_into: cloth
  repair: { move: improvise, materials: { cloth: 2, duct_tape: 1 } }

# ── 도구 ─────────────────────────────────────────
- id: toolkit
  name: 공구 상자
  description: 녹슨 렌치와 드라이버가 든 공구 상자. 총과 기계를 고칠 때 있어야 한다.
  kind: tool
  weight: 3.0
  value: 12
  tool: { bonus: { mechanics: 1 } }
- id: flashlight
  name: 손전등
  icon: light
  description: 손으로 돌려 충전하는 손전등. 어두운 데를 뒤질 때 좋지만 빛은 감염체를 부른다.
  kind: tool
  weight: 0.4
  value: 6
  tool: { bonus: { scavenge: 1 } }
- id: fishing_kit
  name: 낚시 도구
  description: 낚싯줄과 바늘 몇 개, 접는 낚싯대. 물가에서 먹을 것을 구할 때 좋다.
  kind: tool
  weight: 0.5
  value: 4
  tool: { bonus: { survival: 1 } }
- id: carpentry_kit
  name: 목수 연장
  description: 톱과 망치, 끌 몇 자루를 천에 말아 둔 것. 나무를 다룰 때 있어야 한다.
  kind: tool
  weight: 2.5
  value: 8
  tool: { bonus: { carpentry: 1 } }

# 메모 (12-75): 메모장(writing: paper)과 펜·연필(writing: tool)을 함께 지니면 상태 화면에 메모 탭이 열린다
- id: notebook
  name: 메모장
  icon: paper
  description: 손바닥만 한 스프링 수첩. 앞장 몇 장은 뜯겨 나갔다.
  kind: misc
  weight: 0.15
  value: 2
  writing: paper
- id: pen
  name: 펜
  icon: pen
  description: 잉크가 반쯤 남은 볼펜. 추우면 잘 안 나온다.
  kind: misc
  weight: 0.02
  value: 2
  writing: tool
- id: pencil
  name: 연필
  icon: pen
  description: 칼로 깎은 몽당연필. 오래 간다.
  kind: misc
  weight: 0.01
  value: 1
  writing: tool

