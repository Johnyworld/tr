  kind: material
  weight: 0.2
  value: 1
- id: planks
  name: 나무 판자
  description: 못을 뽑아 둔 판자 몇 장.
  kind: material
  weight: 1.5
  value: 1
- id: gunpowder
  name: 화약
  icon: bomb
