- id: arm_guards
  name: 손목 보호대
  description: 잡지와 쇳조각을 덕트 테이프로 팔뚝에 감은 것. 물리는 자리를 막는다.
  kind: armor
  weight: 0.5
  value: 3
  armor: { slot: arms, reduces: 0, blocks_infection: 0.5 }
  durability: 3
  repair: { move: improvise, materials: { duct_tape: 1 } }
- id: tin_alarm
  name: 깡통 경보줄
  description: 빈 깡통을 철사에 꿴 줄. 쉴 곳 둘레에 쳐 두면 무언가 다가올 때 먼저 안다.
  kind: tool
  weight: 0.8
  value: 3
  tool: { bonus: { sense_danger: 1 } }
- id: pack_frame
  name: 배낭 틀
  icon: bag
  description: 판자와 천으로 짠 등짐 틀. 무게를 등에 고루 실어 더 많이 지고 다닌다.
  kind: tool
  weight: 1.5
  value: 5
  carry_bonus: 6

# 이동 수단 (12-137): take_action.ride. 무게는 들고 다니는 짐으로 치지 않는다 (끌고 다닌다)
- id: bicycle
  name: 자전거
  icon: tool
  description: 체인에 녹이 슨 산악자전거. 조용하고 빠르다. 사람과 함께 걸을 때는 끌고 간다.
  kind: tool
  weight: 0
  value: 25
  vehicle: { speed: 0.55, road_risk: 0.7 }
- id: motorbike
  name: 오토바이
  icon: tool
  description: 배달용 소형 오토바이. 한 번 달릴 때마다 기름병 하나를 먹고, 엔진 소리가 구역을 깨운다. 그래도 가장 빠르다.
  kind: tool
  weight: 0
  value: 60
  vehicle: { speed: 0.3, fuel: fuel_bottle, noise: 2, road_risk: 0.5 }

