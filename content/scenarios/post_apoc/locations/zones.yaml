# 전선의 구역 초안 (9단계 전쟁 지도). 지명은 미정이라 특징으로 부른다 (기획서 18장)
# base: 거점 (습격은 받지만 빼앗기지 않는다, MVP). yields: 소유 세력이 하루에 얻는 자원 (*임시*)
# 거점 산출은 텃밭·우물·채집·교역을 뭉뚱그린 값. 무리마다 소모보다 조금 모자라게 둬서 바깥 구역을 두고 다투게 한다
# 인접은 한쪽에만 적어도 양쪽으로 본다
# loot: 수색하면 나올 수 있는 것 (기획서 4.7). modifier는 수색 판정 보정 (털린 곳 -1, 넉넉한 곳 +1, 12-220), weight로 고른다 (*임시*)
- id: a_base
  name: 청솔형제단 거점
  map: { x: 64.7, y: 51.9, label: 청솔형제단 }
  description: 옛 공업고등학교. 운동장 담을 모래주머니와 철판으로 보강했다.
  kind: base
  # 구역 안의 장소 (12-244, 장소 개편 docs/places-v2-zones.md). near: 이웃(한쪽만 적어도 양쪽), road: 구역에 들어오면 도착하는 길(to: 이어지는 구역), gate: 담을 지나 처음 닿는 곳
  places:
    - { id: staff_room, name: "교무실", indoor: true, kinds: [command], description: "칠판에 지도와 근무표가 붙은 옛 교무실. 지도부가 모여 앉는다", aliases: ["교무실", "지도부 회의"] }
    - { id: infirmary, name: "의무실", indoor: true, kinds: [care], description: "보건실 침대 넷과 약장 하나. 소독약 냄새가 밴다", aliases: ["의무실"] }
    - { id: barracks, name: "막사", indoor: true, kinds: [sleep], description: "교실 바닥에 매트와 담요를 깐 숙소. 젖은 양말이 줄에 걸려 있다", aliases: ["막사", "간부 숙소", "침상"] }
    - { id: mess, name: "식당 천막", indoor: true, kinds: [mess], description: "운동장 한쪽, 방수포를 덧댄 큰 천막 아래 솥과 긴 탁자", aliases: ["식당 천막", "배식", "배급 줄", "불 피우기"] }
    - { id: storehouse, name: "보급 창고·무기고", indoor: true, kinds: [store, work], description: "자물쇠 채운 옛 창고. 상자와 자루, 총기 거치대가 줄지어 있다", aliases: ["보급 창고", "창고", "무기고", "발전기실", "공작실", "총기 손질"] }
    - { id: yard_gate, name: "운동장·정문·담장", indoor: false, kinds: [yard, gate], description: "흙바닥 운동장과 철판 덧댄 정문, 담장 위 망루", aliases: ["정문", "운동장", "담장", "망루", "거점 순회", "모닥불", "보초 보조", "분대 훈련", "쪽문"], near: [mess, barracks, storehouse, staff_room, infirmary, stockade], gate: true }
    - { id: stockade, name: "수용소", indoor: true, description: "체육 창고에 철망을 친 우리. 바닥이 차다", aliases: ["수용소"], jail: true }
    - { id: to_post, name: "초소·고가 가는 길", indoor: false, description: "북쪽 동쪽 초소와 끊긴 고가로 이어지는 흙길. 바퀴 자국이 깊다", near: [wall_path], road: true, to: [a_east_post, overpass] }
    - { id: to_old_town, name: "구시가 가는 길", indoor: false, description: "서쪽 구시가로 내려가는 아스팔트 길. 갈라진 틈에 풀이 솟았다", near: [wall_path], road: true, to: [old_town] }
    - { id: to_riverside, name: "강변 가는 길", indoor: false, description: "동쪽 강변 공장 지대로 가는 길. 바람에 기름 냄새가 실려 온다", near: [wall_path], road: true, to: [riverside] }
    - { id: to_south, name: "버들마을·텃밭 가는 길", indoor: false, description: "남쪽 버들마을과 텃밭으로 갈라지는 길. 사람 발자국이 잦다", near: [wall_path], road: true, to: [b_base, south_fields] }
    - { id: wall_path, name: "담 밖 둘레길", indoor: false, kinds: [street], description: "철판 덧댄 담을 따라 도는 좁은 길. 담 위 망루에서 내려다보인다", near: [checkpoint, back_gap] }
    - { id: checkpoint, name: "정문 앞 1번 초소", indoor: false, kinds: [gate], description: "정문 앞 바리케이드와 모래주머니 초소. 드나드는 사람을 여기서 세운다", aliases: ["1번 초소"], near: [yard_gate] }
    - { id: back_gap, name: "뒷담 쪽문", indoor: false, kinds: [gate], description: "막사 뒤편 담에 낸 좁은 쪽문. 밤에는 빗장을 지른다", near: [yard_gate, barracks], gate: true }
  cover: 7
  danger: 0
  owner: faction_a
  adjacent: [a_east_post, old_town, riverside, b_base]
  # 연료 16·물 85 (*임시*, 12-138): 겨울(연료 ×2) 적자를 비축분으로 버티고 평소에 다시 채운다. 연료 12면 첫 겨울 끝에 바닥나 거점 실내에서 얼어 죽었다. 물 75면 여름(×1.15)마다 적자였다
  yields: { food: 58, water: 85, fuel: 16, ammo: 3 }
  loot:
    modifier: -1
    items:
      - { item: water_bottle, weight: 2, qty: [1, 1] }
      - { item: salted_meat, weight: 1, qty: [1, 1] }
      - { item: canned_food, weight: 3, qty: [1, 1] }
      - { item: wire_roll, weight: 2, qty: [1, 1] }
      - { item: cigarettes, weight: 1, qty: [1, 2] }
      - { item: soju, weight: 1, qty: [1, 1] }
      - { item: blanket, weight: 1, qty: [1, 1] }

