    - { id: rail_crossing, name: "철길 건널목", indoor: false, map: { x: 40, y: 18 }, kinds: [street], description: "초소 북쪽, 차단기가 꺾인 철길 건널목. 둑 너머 붉은연합 쪽이 가장 먼저 보이는 자리다", aliases: ["건널목", "차단기"], near: [to_warehouse] }
