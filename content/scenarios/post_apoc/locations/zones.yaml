# 전선의 구역 초안 (9단계 전쟁 지도). 지명은 미정이라 특징으로 부른다 (기획서 18장)
# base: 거점 (습격은 받지만 빼앗기지 않는다, MVP). yields: 소유 세력이 하루에 얻는 자원 (*임시*)
# 거점 산출은 텃밭·우물·채집·교역을 뭉뚱그린 값. 무리마다 소모보다 조금 모자라게 둬서 바깥 구역을 두고 다투게 한다
# 인접은 한쪽에만 적어도 양쪽으로 본다
# loot: 수색하면 나올 수 있는 것 (기획서 4.7). chance는 한 번 굴릴 때 무언가 나올 확률, weight로 고른다 (*임시*)
- id: a_base
  name: 청솔형제단 거점
  description: 옛 공업고등학교. 운동장 담을 모래주머니와 철판으로 보강했다.
  kind: base
  owner: faction_a
  adjacent: [a_east_post, old_town, riverside, b_base]
  yields: { food: 58, water: 75, fuel: 12, ammo: 3 }
  loot:
    chance: 0.3
    items:
      - { item: canned_food, weight: 3, qty: [1, 1] }
      - { item: wire_roll, weight: 2, qty: [1, 1] }
      - { item: cigarettes, weight: 1, qty: [1, 2] }
      - { item: blanket, weight: 1, qty: [1, 1] }

- id: a_east_post
  name: 동쪽 초소
  description: 청솔형제단 거점 동쪽의 초소와 망루. 고가도로 쪽을 내려다본다.
  kind: zone
  owner: faction_a
  adjacent: [c_warehouse]
  loot:
    chance: 0.3
    items:
      - { item: wire_roll, weight: 3, qty: [1, 1] }
      - { item: dry_ration, weight: 2, qty: [1, 1] }
      - { item: binoculars, weight: 1, qty: [1, 1] }
      - { item: casings, weight: 2, qty: [1, 2] }
      - { item: scrap_metal, weight: 1, qty: [1, 1] }

- id: c_warehouse
  name: 고가도로 너머 물류창고
  description: 북쪽 고가도로 너머의 옛 물류창고 단지. 붉은연합이 차지하고 있다.
  kind: zone
  owner: faction_c
  adjacent: [c_base, riverside]
  yields: { food: 30, fuel: 5 }
  loot:
    chance: 0.6
    items:
      - { item: canned_food, weight: 4, qty: [1, 2] }
      - { item: dry_ration, weight: 3, qty: [1, 2] }
      - { item: coat, weight: 1, qty: [1, 1] }
      - { item: crowbar, weight: 1, qty: [1, 1] }
      - { item: c_armband, weight: 1, qty: [1, 1] }
      - { item: rifle_rounds, weight: 2, qty: [1, 2] }
      - { item: shells, weight: 1, qty: [1, 1] }
      - { item: gunpowder, weight: 1, qty: [1, 1] }

- id: c_base
  name: 붉은연합 거점
  description: 도시 동쪽의 옛 공단. 높은 담과 감시탑이 있다.
  kind: base
  owner: faction_c
  adjacent: [old_town]
  yields: { food: 150, water: 185, fuel: 20 }
  loot:
    chance: 0.25
    items:
      - { item: canned_food, weight: 2, qty: [1, 1] }
      - { item: c_armband, weight: 1, qty: [1, 1] }

- id: riverside
  name: 강변 공장 지대
  description: 물과 연료를 얻을 수 있어 무리들이 자주 부딪치는 곳. 밤에는 물결이 잦다.
  kind: zone
  owner: null
  adjacent: [e_market]
  # 섬에서 몰래 나오는 길 (기획서 9.12): 섬의 허락(y_leave_pass)이 없으면 경비를 피해 밤배를 훔쳐 탄다
  crossing:
    from: [yeoul_isle]
    pass_flags: [y_leave_pass]
    attempt: { moves: [stealth, survival], label: "섬 경비를 피해 밤배를 훔쳐 타는 판정" }
  yields: { water: 45, fuel: 10 }
  loot:
    chance: 0.55
    items:
      - { item: wire_roll, weight: 3, qty: [1, 2] }
      - { item: canned_food, weight: 2, qty: [1, 1] }
      - { item: water_bottle, weight: 1, qty: [1, 1] }
      - { item: crowbar, weight: 1, qty: [1, 1] }
      - { item: blanket, weight: 1, qty: [1, 1] }
      - { item: scrap_metal, weight: 3, qty: [1, 2] }
      - { item: planks, weight: 2, qty: [1, 1] }
      - { item: casings, weight: 1, qty: [1, 2] }

- id: old_town
  name: 구시가
  description: 첫 해에 거의 다 털린 옛 시장과 상가. 아직도 남은 것을 찾아 들어가는 사람이 있다.
  kind: zone
  owner: null
  adjacent: [b_base, d_clinic]
  yields: { food: 15, ammo: 3, medicine: 1 }
  loot:
    chance: 0.5
    items:
      - { item: canned_food, weight: 3, qty: [1, 2] }
      - { item: cigarettes, weight: 2, qty: [1, 3] }
      - { item: blanket, weight: 2, qty: [1, 1] }
      - { item: coat, weight: 1, qty: [1, 1] }
      - { item: kitchen_knife, weight: 1, qty: [1, 1] }
      - { item: dry_ration, weight: 1, qty: [1, 1] }
      - { item: radio, weight: 0.5, qty: [1, 1] }
      - { item: duct_tape, weight: 2, qty: [1, 1] }
      - { item: cloth, weight: 2, qty: [1, 2] }
      - { item: baseball_bat, weight: 1, qty: [1, 1] }
      - { item: moto_helmet, weight: 1, qty: [1, 1] }

- id: b_base
  name: 버들마을 거점
  description: 청솔형제단 거점 서쪽의 옛 아파트 단지.
  kind: base
  owner: faction_b
  yields: { food: 36, water: 42, fuel: 6, ammo: 1 }
  loot:
    chance: 0.3
    items:
      - { item: canned_food, weight: 2, qty: [1, 1] }
      - { item: dry_ration, weight: 2, qty: [1, 1] }
      - { item: blanket, weight: 1, qty: [1, 1] }

- id: d_clinic
  name: 하얀매의 진료소
  description: 옛 보건소 건물. 약을 구하려는 사람들이 찾아온다.
  kind: base
  owner: faction_d
  yields: { food: 30, water: 33, fuel: 5, medicine: 4 }
  loot:
    chance: 0.25
    items:
      - { item: fever_reducer, weight: 2, qty: [1, 1] }
      - { item: medkit, weight: 1, qty: [1, 1] }

- id: e_market
  name: 나루상단의 장터
  description: 강 하류의 옛 휴게소. 정해진 날에 상인들이 모인다.
  kind: base
  owner: faction_e
  yields: { food: 50, water: 50, fuel: 10, ammo: 5 }

# ── 12단계 추가: 분쟁 지대 ──
  loot:
    chance: 0.3
    items:
      - { item: cigarettes, weight: 2, qty: [1, 2] }
      - { item: canned_food, weight: 1, qty: [1, 1] }
      - { item: trade_token, weight: 1, qty: [1, 1] }

- id: hospital_ruins
  name: 옛 시립병원
  description: 첫 해에 가장 먼저 무너진 병원. 지하 약제실은 아직 다 털리지 않았다는 말이 있다. 감염체가 많다.
  kind: zone
  owner: null
  adjacent: [old_town, d_clinic]
  yields: { medicine: 2 }
  loot:
    chance: 0.5
    items:
      - { item: fever_reducer, weight: 3, qty: [1, 2] }
      - { item: medkit, weight: 2, qty: [1, 1] }
      - { item: antibiotics, weight: 1, qty: [1, 1] }
      - { item: blanket, weight: 1, qty: [1, 1] }
      - { item: bandage, weight: 2, qty: [1, 2] }
      - { item: cloth, weight: 2, qty: [1, 2] }
      - { item: flashlight, weight: 1, qty: [1, 1] }

- id: water_plant
  name: 정수장
  description: 강 하류의 옛 정수장. 펌프 하나가 아직 손으로 돌아간다. 나루상단의 상인들이 물을 길어 간다.
  kind: zone
  owner: faction_e
  adjacent: [riverside, e_market]
  yields: { water: 30 }
  loot:
    chance: 0.25
    items:
      - { item: water_bottle, weight: 2, qty: [1, 1] }
      - { item: wire_roll, weight: 1, qty: [1, 1] }

- id: south_fields
  name: 남쪽 텃밭
  description: 청솔형제단과 버들마을 거점 사이의 운동장과 공터를 갈아엎은 밭. 무너진 남쪽 담장 너머라 늘 불안하다.
  kind: zone
  owner: faction_a
  adjacent: [a_base, b_base]
  yields: { food: 12 }
  loot:
    chance: 0.35
    items:
      - { item: dry_ration, weight: 1, qty: [1, 1] }
      - { item: wire_roll, weight: 1, qty: [1, 1] }
      - { item: kitchen_knife, weight: 0.5, qty: [1, 1] }
      - { item: planks, weight: 2, qty: [1, 1] }
      - { item: fishing_kit, weight: 1, qty: [1, 1] }


# 여울섬 (기획서 9.12): 강 하구 바다 건너. 어느 구역과도 맞닿아 있지 않고 강변·정수장에서 배로만 건넌다
- id: yeoul_isle
  name: 여울섬
  description: 강 하구에서 배로 반나절 건너는 섬. 돌담과 망루, 텃밭과 양식장, 탄약 공방이 있다. 부두에는 늘 무장한 경비가 선다.
  kind: base
  owner: faction_y
  crossing:
    from: [riverside, water_plant]
    pass_flags: [y_passage, y_leave_pass]
    attempt: { moves: [survival, stealth], label: "배를 구해 밤바다를 건너 섬 경비를 피하는 판정" }
  unlocks: yeoul
  # 외딴곳: 도시 공통 이야기·떠돌이는 오지 않는다
  isolated: true
  yields: { food: 150, water: 150, fuel: 22, ammo: 12, medicine: 2 }
  loot:
    chance: 0.25
    items:
      - { item: canned_food, weight: 2, qty: [1, 2] }
      - { item: medkit, weight: 1, qty: [1, 1] }
      - { item: blanket, weight: 1, qty: [1, 1] }
