  kind: base
  # 구역 안의 장소 (12-244, docs/places-plan.md). aliases: 인물 일과에서 이 장소를 가리키는 말
  places: [{ id: staff_room, name: "교무실", indoor: true, aliases: ["교무실", "지도부 회의"] }, { id: infirmary, name: "의무실", indoor: true, aliases: ["의무실"] }, { id: barracks, name: "막사", indoor: true, aliases: ["막사", "간부 숙소", "침상"] }, { id: mess, name: "식당 천막", indoor: false, aliases: ["식당 천막", "배식", "불 피우기"] }, { id: storehouse, name: "보급 창고·무기고", indoor: true, aliases: ["보급 창고", "창고", "무기고", "발전기실", "공작실", "총기 손질"] }, { id: yard_gate, name: "운동장·정문·담장", indoor: false, aliases: ["정문", "운동장", "담장", "망루", "거점 순회", "모닥불"] }, { id: stockade, name: "수용소", indoor: true, aliases: ["수용소"] }]
  cover: 7
  danger: 0
  owner: faction_a
  adjacent: [a_east_post, old_town, riverside, b_base]
  # 연료 16·물 85 (*임시*, 12-138): 겨울(연료 ×2) 적자를 비축분으로 버티고 평소에 다시 채운다. 연료 12면 첫 겨울 끝에 바닥나 거점 실내에서 얼어 죽었다. 물 75면 여름(×1.15)마다 적자였다
