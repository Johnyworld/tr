    - { id: bunker, name: "초소 안·창고", indoor: true, kinds: [sleep, store], description: "콘크리트 초소 안. 난로 하나와 탄 상자, 좁은 침상", aliases: ["동쪽 초소", "초소", "창고"] }
    - { id: to_base, name: "거점 가는 길", indoor: false, description: "청솔형제단 거점으로 돌아가는 길. 초소에서 끝까지 내려다보인다", near: [trench, watchtower], road: true, to: [a_base] }
    - { id: to_warehouse, name: "물류창고 가는 비탈", indoor: false, description: "고가도로 쪽으로 내려가는 자갈 비탈. 붉은연합 땅이 가깝다", near: [trench], road: true, to: [c_warehouse] }
    - { id: trench, name: "모래주머니 참호", indoor: false, kinds: [watch], description: "초소 앞에 판 얕은 참호. 모래주머니 사이로 총구를 낸다", near: [watchtower, bunker] }
