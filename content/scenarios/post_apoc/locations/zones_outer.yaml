# 바깥 구역 (12-53): 지도를 넓힌다. 다투는 땅(발전소), 깊고 위험한 곳(지하철역, 교도소), 털 것이 남은 곳(마트),
# 사람이 모이는 중립(성당, 캠퍼스), 도시 밖으로 나가는 길목(휴게소)
# danger: 0 안전 ~ 3 아주 위험. 오가는 길에서 일이 생길 확률이 달라진다 (scenario.travel)

- id: subway_hub
  name: 지하철 환승역
  description: 세 노선이 만나던 지하 환승역. 첫 겨울에 피난민이 몰려들었다가 그 안에서 물결이 일었다. 터널로 구시가와 강변, 마트 밑까지 이어지지만 아무도 오래 머물지 않는다.
  kind: zone
  owner: null
  danger: 3
  adjacent: [old_town, riverside, mall_ruins]
  loot:
    chance: 0.6
    items:
      - { item: canned_food, weight: 2, qty: [1, 2] }
      - { item: flashlight, weight: 1, qty: [1, 1] }
      - { item: blanket, weight: 2, qty: [1, 1] }
      - { item: medkit, weight: 1, qty: [1, 1] }
      - { item: cigarettes, weight: 2, qty: [1, 2] }
      - { item: crowbar, weight: 1, qty: [1, 1] }
      - { item: rifle_rounds, weight: 1, qty: [1, 1] }

- id: power_plant
  name: 화력발전소 터
  description: 강 상류의 꺼진 화력발전소. 저탄장에 석탄과 기름이 아직 남아 있다. 굴뚝이 도시 어디서나 보여서, 누가 거기 깃발을 세우는지 다들 안다.
  kind: zone
  owner: null
  danger: 2
  adjacent: [riverside, c_warehouse, rest_stop, prison]
  yields: { fuel: 18 }
  loot:
    chance: 0.4
    items:
      - { item: fuel_bottle, weight: 3, qty: [1, 2] }
      - { item: scrap_metal, weight: 3, qty: [1, 2] }
      - { item: wire_roll, weight: 2, qty: [1, 1] }
      - { item: toolkit, weight: 0.5, qty: [1, 1] }
      - { item: duct_tape, weight: 1, qty: [1, 1] }

- id: prison
  name: 북쪽 교도소
  description: 붉은연합 거점 북쪽의 옛 교도소. 담이 가장 높은 곳이라 첫 해에 여러 무리가 차지하려다 안에서 무너졌다. 무기고가 아직 다 털리지 않았다는 말과, 감방 안에 아직 누가 갇혀 있다는 말이 같이 돈다.
  kind: zone
  owner: null
  danger: 3
  adjacent: [c_base, power_plant]
  loot:
    chance: 0.45
    items:
      - { item: rifle_rounds, weight: 2, qty: [1, 2] }
      - { item: shells, weight: 1, qty: [1, 1] }
      - { item: kevlar_vest, weight: 0.5, qty: [1, 1] }
      - { item: moto_helmet, weight: 1, qty: [1, 1] }
      - { item: pipe_spear, weight: 1, qty: [1, 1] }
      - { item: blanket, weight: 1, qty: [1, 1] }
      - { item: dry_ration, weight: 1, qty: [1, 1] }

- id: mall_ruins
  name: 대형 마트 폐허
  description: 남쪽 대로변의 대형 마트. 첫 주에 다 털렸지만 지붕이 무너진 창고 쪽에는 아직 손이 닿지 않은 선반이 있다. 여러 무리의 수색조가 마주치는 곳이다.
  kind: zone
  owner: null
  danger: 2
  adjacent: [subway_hub, south_fields, b_base]
  yields: { food: 10 }
  loot:
    chance: 0.55
    items:
      - { item: canned_food, weight: 3, qty: [1, 2] }
      - { item: dry_ration, weight: 2, qty: [1, 2] }
      - { item: water_bottle, weight: 2, qty: [1, 1] }
      - { item: blanket, weight: 1, qty: [1, 1] }
      - { item: coat, weight: 1, qty: [1, 1] }
      - { item: duct_tape, weight: 1, qty: [1, 1] }
      - { item: kitchen_knife, weight: 1, qty: [1, 1] }
      - { item: pack_frame, weight: 0.5, qty: [1, 1] }

- id: cathedral
  name: 언덕 위 성당
  description: 구시가 언덕 위의 붉은 벽돌 성당. 어느 무리에도 들지 못한 피난민이 종탑 아래 모여 산다. 늙은 신부가 장례를 치러 주고, 누구에게도 총을 들고 들어오지 말라고 한다.
  kind: zone
  owner: null
  sanctuary: true
  danger: 0
  adjacent: [old_town, b_base, campus]
  loot:
    chance: 0.2
    items:
      - { item: cloth, weight: 2, qty: [1, 2] }
      - { item: blanket, weight: 1, qty: [1, 1] }
      - { item: bandage, weight: 1, qty: [1, 1] }

- id: campus
  name: 가람대학교 캠퍼스
  description: 언덕 너머의 대학 캠퍼스. 도서관에 몇 사람이 틀어박혀 책을 지키며 산다. 약대 실험실과 농대 온실이 있다는 말에 무리마다 사람을 보내 보지만, 학자들은 아무 무리에도 들지 않는다.
  kind: zone
  owner: null
  sanctuary: true
  danger: 1
  adjacent: [cathedral, d_clinic, hospital_ruins]
  yields: { medicine: 1, food: 6 }
  loot:
    chance: 0.35
    items:
      - { item: fever_reducer, weight: 2, qty: [1, 1] }
      - { item: bandage, weight: 2, qty: [1, 1] }
      - { item: ledger, weight: 1, qty: [1, 1] }
      - { item: radio, weight: 0.5, qty: [1, 1] }
      - { item: cloth, weight: 2, qty: [1, 2] }
      - { item: antibiotics, weight: 0.3, qty: [1, 1] }

- id: rest_stop
  name: 고속도로 휴게소
  description: 도시 밖으로 나가는 고속도로의 마지막 휴게소. 나루상단이 주유소 지붕 밑에 짐을 부리는 곳이고, 바깥에서 들어오는 떠돌이와 소문이 가장 먼저 닿는 곳이다.
  kind: zone
  owner: faction_e
  danger: 1
  adjacent: [e_market, power_plant]
  yields: { food: 8, fuel: 4 }
  loot:
    chance: 0.3
    items:
      - { item: fuel_bottle, weight: 2, qty: [1, 1] }
      - { item: canned_food, weight: 1, qty: [1, 1] }
      - { item: cigarettes, weight: 2, qty: [1, 2] }
      - { item: water_bottle, weight: 1, qty: [1, 1] }
