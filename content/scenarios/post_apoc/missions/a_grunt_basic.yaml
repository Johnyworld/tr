# 하급 전투원 기본 임무 (초안). 분대장이 하루 단위로 내려 준다
# requirements: 임무를 받은 뒤 쌓여야 하는 활동·판정. 코드가 이벤트로 집계한다
#   - activity: spend_time 활동과 누적 분
#   - check: 판정 행동과 최소 결과(partial = 대가 있는 성공 이상)
- id: guard_east_post
  title: 동쪽 초소 보초
  briefing: 동쪽 초소에서 보초를 서며 담장 너머를 감시한다. 이상이 있으면 바로 보고한다.
  giver_rank: squad_leader
  deadline_hours: 12
  requirements:
    - activity: guard_duty
      minutes: 240
- id: wall_repair
  title: 담장 보수
  briefing: 무너진 남쪽 담장을 모래주머니와 철판으로 보강한다.
  giver_rank: squad_leader
  deadline_hours: 10
  requirements:
    - activity: work
      minutes: 120
- id: search_nearby_ruins
  title: 인근 폐건물 수색
  briefing: 거점 근처 폐건물에서 쓸 만한 물자를 찾아 온다. 해가 지기 전에 돌아온다.
  giver_rank: squad_leader
  deadline_hours: 10
  requirements:
    - check: scavenge
      min_outcome: partial
- id: scout_north_overpass
  title: 북쪽 고가도로 정찰
  briefing: 북쪽 고가도로 주변의 감염체와 C의 움직임을 살피고 들키지 않게 돌아온다.
  giver_rank: squad_leader
  deadline_hours: 12
  requirements:
    - check: sense_danger
      min_outcome: partial
    - check: stealth
      min_outcome: partial
