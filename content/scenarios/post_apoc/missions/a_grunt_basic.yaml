# 하급 전투원 기본 임무 (초안). 분대장이 하루 단위로 내려 준다
# requirements: 임무를 받은 뒤 쌓여야 하는 활동·판정. 코드가 이벤트로 집계한다
#   - activity: spend_time 활동과 누적 분
#   - check: 판정 행동과 최소 결과(partial = 대가 있는 성공 이상)
- id: guard_east_post
  title: 동쪽 초소 보초
  briefing: 동쪽 초소에서 보초를 서며 담장 너머를 감시한다. 이상이 있으면 바로 보고한다.
  giver_rank: squad_leader
  deadline_hours: 12
  requirements:
    - activity: guard_duty
      minutes: 240
- id: wall_repair
  title: 담장 보수
  briefing: 무너진 남쪽 담장을 모래주머니와 철판으로 보강한다.
  giver_rank: squad_leader
  deadline_hours: 10
  requirements:
    - activity: work
      minutes: 120
- id: search_nearby_ruins
  title: 인근 폐건물 수색
  briefing: 거점 근처 폐건물에서 쓸 만한 물자를 찾아 온다. 해가 지기 전에 돌아온다.
  giver_rank: squad_leader
  deadline_hours: 10
  requirements:
    - check: scavenge
      min_outcome: partial
- id: scout_north_overpass
  title: 북쪽 고가도로 정찰
  briefing: 북쪽 고가도로 주변의 감염체와 C의 움직임을 살피고 들키지 않게 돌아온다.
  giver_rank: squad_leader
  deadline_hours: 12
  requirements:
    - check: sense_danger
      min_outcome: partial
    - check: stealth
      min_outcome: partial
- id: fields_watch
  title: 남쪽 텃밭 지키기
  briefing: 남쪽 텃밭에서 밭일하는 사람들을 지킨다. 담장이 무너진 쪽이라 감염체와 좀도둑을 조심한다.
  giver_rank: squad_leader
  deadline_hours: 10
  requirements:
    - activity: guard_duty
      minutes: 180
- id: market_errand
  title: E 장터 심부름
  briefing: E의 장터에 가서 담배를 소금과 바꿔 오는 흥정을 한다. 강변을 지날 때 조심한다.
  giver_rank: squad_leader
  deadline_hours: 12
  requirements:
    - check: sense_danger
      min_outcome: partial
    - check: persuade
      min_outcome: partial
- id: hospital_supply_run
  title: 옛 시립병원 약 찾기
  briefing: 의무실 약이 바닥났다. 옛 시립병원에 들어가 쓸 만한 약을 찾아 온다. 감염체가 많으니 소리를 내지 않는다.
  giver_rank: squad_leader
  deadline_hours: 14
  requirements:
    - check: stealth
      min_outcome: partial
    - check: scavenge
      min_outcome: partial
- id: front_recon
  title: 전선 정찰
  briefing: C가 차지한 맞닿은 구역에 숨어 들어가 경계와 병력 배치를 살피고 돌아온다. 반격 준비에 쓰인다.
  giver_rank: squad_leader
  deadline_hours: 12
  requirements:
    - check: sense_danger
      min_outcome: partial
    - check: stealth
      min_outcome: partial
  advances: { clock: a_counteroffensive, delta: 2 }
- id: supply_raid
  title: C 보급 털기
  briefing: C가 차지한 구역에 몰래 들어가 쌓아 둔 보급품을 털거나 망가뜨린다. 들키면 끝이다.
  giver_rank: squad_leader
  deadline_hours: 16
  requirements:
    - check: stealth
      min_outcome: partial
    - check: scavenge
      min_outcome: partial
  advances: { clock: a_counteroffensive, delta: 3 }
