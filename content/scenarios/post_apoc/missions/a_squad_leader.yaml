# 신임 분대장(3분대) 임무 (초안). 보급 간부 한도윤이 하루 단위로 내려 준다
# 분대를 이끄는 임무라 지휘(tactics) 판정이 자주 붙는다. 형식은 a_grunt_basic.yaml 머리말 참고
- id: a_sl_storage_guard
  title: 보급 창고 경비 편성
  # 작전: 무기고가 무기·탄약을 빌려준다 (기획서 4.8)
  armed: true
  briefing: 분대를 나눠 보급 창고를 하루 동안 지킨다. 교대표를 짜고, 창고 뒷문까지 빈틈없이 돌린다. 배급이 줄어든 뒤로 창고 근처를 서성이는 사람이 늘었다.
  giver_rank: officer
  deadline_hours: 14
  requirements:
    - activity: guard_duty
      minutes: 300
- id: a_sl_water_escort
  title: 강변 물 운반 호위
  # 작전: 무기고가 무기·탄약을 빌려준다 (기획서 4.8)
  armed: true
  briefing: 물통을 실은 손수레 두 대를 강변 공장 지대까지 호위해 물을 길어 온다. 서기철이 죽은 길이다. 해가 지기 전에 돌아오고, 소리를 내지 않는다.
  giver_rank: officer
  deadline_hours: 12
  requirements:
    - check: tactics
      min_outcome: partial
    - check: sense_danger
      min_outcome: partial
- id: a_sl_old_town_sweep
  title: 구시가 상가 수색 지휘
  # 작전: 무기고가 무기·탄약을 빌려준다 (기획서 4.8)
  armed: true
  briefing: 분대를 이끌고 구시가 상가를 한 블록씩 훑는다. 연료든 통조림이든 겨울에 쓸 것을 찾아 온다. 흩어지지 말고, 둘씩 짝을 지운다.
  giver_rank: officer
  deadline_hours: 12
  requirements:
    - check: tactics
      min_outcome: partial
    - check: scavenge
      min_outcome: partial
- id: a_sl_fields_night
  title: 남쪽 텃밭 야간 경계
  # 작전: 무기고가 무기·탄약을 빌려준다 (기획서 4.8)
  armed: true
  briefing: 밤새 남쪽 텃밭을 지킨다. 마지막 배추를 노리는 좀도둑과 담장 틈으로 들어오는 감염체를 막는다. 불은 피우지 않는다.
  giver_rank: officer
  deadline_hours: 14
  requirements:
    - activity: guard_duty
      minutes: 240
    - check: sense_danger
      min_outcome: partial
- id: a_sl_b_convoy
  title: 버들마을 물자 전달
  # 작전: 무기고가 무기·탄약을 빌려준다 (기획서 4.8)
  armed: true
  briefing: 연합 약속대로 버들마을 거점에 연료 몇 통을 전하고 받았다는 표시를 받아 온다. 저쪽이 더 달라고 하면 정중히 거절한다. 장부에 적힌 것만 준다.
  giver_rank: officer
  deadline_hours: 12
  requirements:
    - activity: travel
      minutes: 60
    - check: persuade
      min_outcome: partial
- id: a_sl_drill
  title: 분대 훈련
  briefing: 운동장 구석에서 분대를 훈련시킨다. 엄폐, 수신호, 후퇴 순서. 탄은 쓰지 않는다. 신입이 대열을 따라오게 만든다.
  giver_rank: officer
  deadline_hours: 10
  requirements:
    - activity: work
      minutes: 120
    - check: tactics
      min_outcome: partial
- id: a_sl_find_straggler
  title: 돌아오지 않은 짐꾼 찾기
  # 작전: 무기고가 무기·탄약을 빌려준다 (기획서 4.8)
  armed: true
  briefing: 어제 구시가로 나간 취사 천막의 짐꾼 하나가 돌아오지 않았다. 흔적을 따라가 데려오거나, 무슨 일이 있었는지 알아 온다.
  giver_rank: officer
  deadline_hours: 16
  requirements:
    - check: survival
      min_outcome: partial
    - check: sense_danger
      min_outcome: partial
- id: a_sl_east_reinforce
  title: 동쪽 초소 증원
  # 작전: 무기고가 무기·탄약을 빌려준다 (기획서 4.8)
  armed: true
  briefing: 동쪽 초소에 사람이 모자란다. 분대를 이끌고 가서 하룻밤 초소를 맡고, 고가도로 너머 움직임을 기록해 넘긴다. 반격 준비에 쓰인다.
  giver_rank: officer
  deadline_hours: 16
  requirements:
    - activity: guard_duty
      minutes: 300
    - check: tactics
      min_outcome: partial
  advances: { clock: a_counteroffensive, delta: 1 }
