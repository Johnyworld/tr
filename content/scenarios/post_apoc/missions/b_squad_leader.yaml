# 버들마을 정찰대 분대장 임무 (초안). 연락 간부 표승민이 하루 단위로 내려 준다
# 정찰대는 단지 밖에 나가는 사람들이다. 형식은 a_grunt_basic.yaml 머리말 참고
- id: b_sl_old_town_sweep
  title: 구시가 상가 훑기
  where: old_town
  # 작전: 무기고가 무기·탄약을 빌려준다 (기획서 4.8)
  armed: true
  briefing: 분대를 이끌고 구시가 상가를 한 줄씩 훑는다. 겨울에 땔 것과 먹을 것을 찾아 온다. 차영만이 들어간 북쪽 골목은 둘 이상이 아니면 들어가지 않는다. 해가 지기 전에 정문으로 돌아온다.
  giver_rank: officer
  supplies: { food: 12 }
  deadline_hours: 12
  requirements:
    - check: tactics
      min_outcome: partial
    - check: scavenge
      min_outcome: partial

- id: b_sl_market_escort
  title: 장터 길 호위
  where: e_market
  # 작전: 무기고가 무기·탄약을 빌려준다 (기획서 4.8)
  armed: true
  briefing: 함영자와 텃밭 일꾼들이 수확을 지고 나루상단 장터에 간다. 오가는 길을 지킨다. 지난봄 이 길에서 사람이 사라졌다. 수로 옆에서는 걸음을 늦추지 않는다.
  giver_rank: officer
  deadline_hours: 12
  requirements:
    - activity: travel
      minutes: 90
    - check: sense_danger
      min_outcome: partial

- id: b_sl_pump_scout
  title: 정수장 펌프 정찰
  where: water_plant
  # 작전: 무기고가 무기·탄약을 빌려준다 (기획서 4.8)
  armed: true
  briefing: 남상구가 말한 펌프 부품이 정수장에 남아 있는지 보고 온다. 나루상단이 지키는 곳이니 싸우지 말고, 들키면 물 사러 온 척한다. 어디에 무엇이 있는지만 적어 온다.
  giver_rank: officer
  deadline_hours: 12
  requirements:
    - check: stealth
      min_outcome: partial
    - check: scavenge
      min_outcome: partial

- id: b_sl_empty_block
  title: 막아 둔 동 훑기
  # 작전: 무기고가 무기·탄약을 빌려준다 (기획서 4.8)
  armed: true
  briefing: 비워 두고 출입구를 막은 동에서 밤마다 무언가 긁는 소리가 난다는 말이 있다. 분대를 둘씩 나눠 계단을 한 층씩 올라가며 훑는다. 아이들이 숨어들 틈이 있으면 막는다.
  giver_rank: officer
  supplies: { food: 8 }
  deadline_hours: 10
  requirements:
    - check: tactics
      min_outcome: partial
    - check: sense_danger
      min_outcome: partial

- id: b_sl_joint_recon
  title: 청솔형제단과 합동 정찰
  where: enemy
  # 작전: 무기고가 무기·탄약을 빌려준다 (기획서 4.8)
  armed: true
  briefing: 약조에 따라 청솔형제단 정찰조와 함께 붉은연합이 차지한 맞닿은 구역을 엿보고 온다. 앞은 청솔이 서고 뒤는 정찰대가 받친다. 본 것은 표승민이 청솔형제단의 반격 준비에 넘긴다.
  giver_rank: officer
  deadline_hours: 14
  requirements:
    - check: stealth
      min_outcome: partial
    - check: tactics
      min_outcome: partial
  advances: { clock: a_counteroffensive, delta: 1 }

- id: b_sl_hospital_fever
  title: 시립병원 해열제 찾기
  where: hospital_ruins
  # 작전: 무기고가 무기·탄약을 빌려준다 (기획서 4.8)
  armed: true
  briefing: 지하 교실 아이 둘이 열이 내리지 않는다. 옛 시립병원 약국 쪽에 해열제가 남았는지 뒤져 온다. 병동 안쪽은 감염체가 모이는 곳이다. 약국 너머로는 들어가지 않는다.
  giver_rank: officer
  supplies: { medicine: 3 }
  deadline_hours: 14
  requirements:
    - check: scavenge
      min_outcome: partial
    - check: sense_danger
      min_outcome: partial

- id: b_sl_drill
  title: 정찰대 훈련
  briefing: 정문 안 마당에서 분대를 훈련시킨다. 수신호, 둘씩 짝 짓기, 감염체를 만났을 때 물러나는 순서. 탄은 쓰지 않는다. 손발이 맞지 않는 사람이 누구인지 본다.
  giver_rank: officer
  deadline_hours: 10
  requirements:
    - activity: work
      minutes: 120
    - check: tactics
      min_outcome: partial
