# 붉은연합 약탈조장 임무 (초안). 간부 마경수가 내려 준다. 조장이 조원과 함께 하는 일
- id: c_sl_overpass_hold
  title: 고가도로 길목 지키기
  briefing: 사조를 데리고 고가도로 아래 길목을 하룻밤 지킨다. 청솔 쪽 정찰이 넘어오면 잡든지 쫓든지 한다. 자리를 비우면 조 전체가 책임진다.
  giver_rank: officer
  deadline_hours: 14
  requirements:
    - activity: guard_duty
      minutes: 300
    - check: sense_danger
      min_outcome: partial

- id: c_sl_east_drill
  title: 동쪽 공세 연습
  briefing: 공세에 앞서 조원들을 데리고 돌격 연습을 한다. 누가 앞에 서고 누가 엄호하는지 조장이 정해서 보고한다.
  giver_rank: officer
  deadline_hours: 12
  advances: { clock: c_east_offensive, delta: 1 }
  requirements:
    - check: tactics
      min_outcome: partial
    - activity: work
      minutes: 120

- id: c_sl_prisoner_transfer
  title: 포로 이송
  briefing: 수용소의 포로 둘을 거점 지하로 옮긴다. 도망치게 두면 조장이 대신 갇힌다. 포로와 말을 섞지 않는다.
  giver_rank: officer
  deadline_hours: 10
  requirements:
    - check: intimidate
      min_outcome: partial
    - activity: travel
      minutes: 60

- id: c_sl_squad_quota
  title: 사조 할당량
  briefing: 조 전체의 오늘 할당량을 채운다. 조장이 직접 털든, 조원을 보내든 저녁 검수에 맞춘다.
  giver_rank: officer
  deadline_hours: 12
  requirements:
    - check: scavenge
      min_outcome: partial

- id: c_sl_runaway_hunt
  title: 달아난 징집병
  briefing: 어젯밤 다른 조의 징집병 하나가 담을 넘었다. 구시가 쪽 흔적을 쫓아 데려온다. 산 채로.
  giver_rank: officer
  deadline_hours: 14
  requirements:
    - check: survival
      min_outcome: partial
    - check: intimidate
      min_outcome: partial

- id: c_sl_ammo_haul
  title: 탄약 상자 운반
  briefing: 거점 창고의 탄약 상자를 물류창고 전진 창고로 옮긴다. 상자 수는 장부와 맞아야 한다.
  giver_rank: officer
  deadline_hours: 10
  requirements:
    - activity: work
      minutes: 180
    - check: endure
      min_outcome: partial
