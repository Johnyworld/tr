# 하얀매 간부 임무 (초안). 대표 서은영이 아침 회의 뒤 직접 맡긴다
# 오늘의 임무 후보는 역할(roles/d_officer.yaml)의 missions 목록에서 코드가 고르고, 상관(commander: d_eunyoung)이 장면에 있어야 내린다.
# giver_rank는 맡기는 사람의 계급(지도부). 하얀매는 무기고가 없어 armed 임무가 없다. 형식은 a_grunt_basic.yaml 머리말 참고

- id: do_stock_audit
  title: 약장 대장 맞추기
  briefing: 문기순 할머니, 연수경과 함께 약장과 창고를 처음부터 세어 장부와 맞춰 주세요. 어디서 비는지 알아야 다음 장날 값을 정합니다. 누구를 의심한다는 말은 아직 하지 마세요.
  giver_rank: leader
  deadline_hours: 12
  requirements:
    - activity: work
      minutes: 120
    - check: scavenge
      min_outcome: partial

- id: do_willow_price
  title: 버들마을 겨울 약값
  briefing: 버들마을에 가서 겨울 동안의 약값을 정해 오세요. 텃밭 수확으로 받되, 우리 몫을 깎아 주지는 마세요. 저쪽이 누구 편에 기우는지도 보고 오시고요.
  giver_rank: leader
  deadline_hours: 16
  requirements:
    - activity: travel
      minutes: 60
    - check: persuade
      min_outcome: partial
  advances: { clock: d_lean, delta: -1 }

- id: do_pine_ward
  title: 청솔형제단 의무실 왕진
  briefing: 청솔형제단 의무실에 다녀오세요. 앓는 사람을 보고, 저쪽이 무엇을 내놓을 수 있는지 들어 오세요. 약은 값이 정해지기 전에는 한 알도 두고 오지 않습니다.
  giver_rank: leader
  deadline_hours: 16
  requirements:
    - activity: travel
      minutes: 60
    - check: first_aid
      min_outcome: partial
    - check: persuade
      min_outcome: partial
  advances: { clock: d_lean, delta: -1 }

- id: do_market_supplies
  title: 장터에서 붕대감 사기
  briefing: 나루상단 장터에서 붕대 천과 소독할 술, 탄을 조금 사 오세요. 물과 식량은 내줘도 되지만 약은 안 됩니다. 우리 약장 사정은 들키지 마세요. 장터 사람들은 그걸로 값을 매깁니다.
  giver_rank: leader
  deadline_hours: 16
  requirements:
    - activity: travel
      minutes: 60
    - check: persuade
      min_outcome: partial
    - check: deceive
      min_outcome: partial

- id: do_triage_rules
  title: 문진 규칙 다시 세우기
  briefing: 수간호사, 접수의 위다현과 앉아 문진 순서 규칙을 다시 적어 주세요. 소속은 묻지 않는다, 값은 순서를 사지 못한다. 그 두 줄이 문 앞에서 실제로 지켜지는지 보고 오세요.
  giver_rank: leader
  deadline_hours: 10
  requirements:
    - activity: talk
      minutes: 60
    - check: first_aid
      min_outcome: partial

- id: do_hospital_plan
  title: 시립병원 수색 계획
  briefing: 남민호에게서 시립병원 지하로 가는 길을 듣고, 몇 명을 언제 들여보낼지 안을 짜 오세요. 사람을 잃으면 약을 얻어도 남는 게 없습니다. 돌아올 길부터 적으세요.
  giver_rank: leader
  deadline_hours: 18
  requirements:
    - activity: talk
      minutes: 60
    - check: tactics
      min_outcome: partial
