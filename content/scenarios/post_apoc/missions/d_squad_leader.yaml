# 하얀매 수비대 분대장 임무 (초안). 대표 서은영이 아침 회의 뒤 내려 준다. 분대장이 수비대원과 함께 하는 일
# requirements 형식은 a_grunt_basic.yaml 머리말 참고

- id: d_sl_gate_watch
  title: 정문 밤 경비
  briefing: 수비대를 나눠 정문과 약제실 창고를 하룻밤 지킨다. 담 밖을 기웃거리는 사람이 있으면 누구인지 보고, 쏘지 말고 쫓는다. 총소리는 감염체도 부른다.
  giver_rank: leader
  deadline_hours: 14
  requirements:
    - activity: guard_duty
      minutes: 300
    - check: sense_danger
      min_outcome: partial

- id: d_sl_pharmacy_alley
  title: 약국 골목 수색
  briefing: 구시가의 옛 약국 골목을 수비대와 함께 훑는다. 붕대, 소독약, 유효기간이 남은 알약이면 무엇이든. 해 지기 전에 돌아오고, 다친 사람 없이 돌아온다.
  giver_rank: leader
  supplies: { medicine: 5 }
  deadline_hours: 10
  requirements:
    - check: scavenge
      min_outcome: partial
    - check: sense_danger
      min_outcome: partial

- id: d_sl_hospital_shaft
  title: 시립병원 엘리베이터 통로
  briefing: 남민호를 앞세워 옛 시립병원 엘리베이터 통로로 지하에 내려간다. 약제실까지 가는 길을 확인하고 밧줄을 새로 건다. 하재문이 긁힌 곳이니 아무도 혼자 두지 않는다.
  giver_rank: leader
  deadline_hours: 14
  requirements:
    - check: stealth
      min_outcome: partial
    - check: endure
      min_outcome: partial

- id: d_sl_house_call_escort
  title: 왕진 호위
  briefing: 버들마을로 왕진 가는 의사를 호위한다. 의사가 환자를 보는 동안 문 앞을 지키고, 오가는 길에 의사가 아무 데서나 멈추지 않게 한다. 의사가 다치면 하얀매가 다친다.
  giver_rank: leader
  deadline_hours: 12
  requirements:
    - activity: travel
      minutes: 120
    - check: sense_danger
      min_outcome: partial

- id: d_sl_market_crate
  title: 장날 약 상자 호위
  briefing: 도상필이 나루상단 장터에서 바꿀 약 상자를 지고 간다. 수비대는 상자를 지키기만 한다. 흥정에는 끼지 않고, 상자 수는 떠날 때와 돌아올 때 센다.
  giver_rank: leader
  deadline_hours: 12
  requirements:
    - activity: travel
      minutes: 90
    - check: persuade
      min_outcome: partial

- id: d_sl_wall_mend
  title: 담장 보강
  briefing: 진료소 뒤편 담의 무너진 자리를 판자와 철조망으로 메우고 깡통 경보를 단다. 여섯이 지키는 담이니, 담이 대신 서 있어야 한다.
  giver_rank: leader
  deadline_hours: 12
  fortifies: 1
  requirements:
    - activity: work
      minutes: 180
    - check: carpentry
      min_outcome: partial
