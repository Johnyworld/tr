# 요리사 직분의 일감 (기획서 12.6). 무리를 가리지 않는다: 어느 무리의 요리사든 상관에게 받는다
# 완수하면 엔진이 직분 평판 +1. requirements 형식은 a_grunt_basic.yaml 머리말 참고

- id: occ_cook_morning_pot
  title: 새벽 솥 당번
  briefing: 해 뜨기 전에 불을 살리고 솥을 건다. 물을 길어 오고, 창고에서 내준 만큼만 넣는다. 첫 줄이 서기 전에 끓어 있어야 한다.
  giver_rank: squad_leader
  deadline_hours: 10
  requirements:
    - activity: work
      minutes: 180

- id: occ_cook_stretch
  title: 모자란 솥 늘리기
  briefing: 창고에서 받은 재료가 오늘 머릿수에 모자란다. 뼈를 다시 고든 풀을 섞든, 모두가 한 그릇씩은 받게 만든다. 양을 속이지는 않는다.
  giver_rank: squad_leader
  deadline_hours: 12
  requirements:
    - check: survival
      min_outcome: partial
    - activity: work
      minutes: 120

- id: occ_cook_forage
  title: 들풀과 버섯 캐기
  briefing: 무너진 담장 너머 빈터에서 먹을 수 있는 풀과 버섯을 캐 온다. 모르는 건 따지 않는다. 해 지기 전에 돌아온다.
  giver_rank: squad_leader
  deadline_hours: 10
  requirements:
    - check: sense_danger
      min_outcome: partial
    - check: survival
      min_outcome: partial

- id: occ_cook_salt_store
  title: 겨울 저장 손질
  briefing: 들어온 고기와 생선을 소금에 절이고 연기에 말린다. 항아리와 걸대를 손보고, 무엇을 얼마나 넣었는지 장부에 적는다.
  giver_rank: squad_leader
  deadline_hours: 14
  requirements:
    - activity: work
      minutes: 180
    - check: survival
      min_outcome: partial
