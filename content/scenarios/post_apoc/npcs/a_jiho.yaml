# 초안
id: a_jiho
name: 오지호
alias: 주근깨 난 앳된 대원
faction: faction_a
rank: grunt
occupation: scavenger
age: 19
gender: male
look: 앳된 얼굴에 주근깨. 몸에 안 맞는 큰 방탄조끼를 입고 다닌다.
reputation: 강태호 분대의 막내. 말이 많고 붙임성이 좋아 거점 소문은 다 안다.
want: 인정받아 정찰조에 들어가는 것
# 부탁 (12-174, *임시*): 물건 부탁. 받으면 약속이 되고, 지키면 보답한다
favors:
  - { id: rounds_for_scouting, ask: "소총탄 좀 구해 줘. 혼자 나갈 때 쓸 거야. 분대장님한텐 비밀이고", item: { id: rifle_rounds, quantity: 1 }, days: 4, reward: { item: { id: cigarettes, quantity: 1 }, affection: 1 } }
fear: 겁쟁이로 보이는 것
values: { discipline: 0, loyalty: 2, mercy: 1, honesty: 1, self_interest: 0 }
traits: [talkative, eager, coward, attractive]
voice:
  style: 들뜬 말투. 손위에게는 어설픈 존댓말, 동갑 이하에게는 반말. 자주 말끝을 흐린다
  samples:
    - "아 진짜요? 그거 저도 데려가 주면 안 돼요?"
    - "근데 그거 아세요? 식당 아줌마가 그러는데..."
routine: { day: 잡일과 보초 보조, night: 막사 }
rules:
  - 칭찬을 받으면 무리해서라도 따라나선다
  - 들은 이야기를 오래 담아 두지 못하고 누군가에게 옮긴다
knows:
  - 식당에서 저녁 배급이 가끔 늦게 나온다는 것
  - 분대장이 밤마다 무전기를 붙잡고 있다는 것
doesnt_know:
  - 실종된 정찰조의 형이 아직 살아 있다
# 정찰조에 붙잡힌 형 (기획서 7.10)
ties:
  - { to: a_jeongbin, kind: sibling, secret: { reveal_when: 정찰조 이야기가 나올 때 둘만 있으면, min_trust: 3 } }
secret:
  content: 실종된 정찰조에 친형이 있었다. 정찰조에 들어가려는 것도 형을 찾기 위해서다
  reveal_when: 신뢰 3 이상
  min_trust: 3
stats: { strength: 0, agility: 1, vitality: 0, senses: 1, nerve: -1, charm: 2, intellect: 0 }
skills: { fight: 0, shoot: 0, persuade: 1, deceive: 1, scavenge: 1 }
start_inventory: [water_bottle]
playable: true
zone: a_base
agenda:
  - id: lone_scouting
    label: 인정받으려고 혼자 정찰을 나간다
    steps: 10
    cue: 지도 한 장을 품에 넣고 다니며 밤마다 북쪽 고가를 바라본다
    news: "{self:이/가} 혼자 정찰을 나갔다가 다쳐서 돌아왔다고 한다"
    fill: { chance: 0.5 }
    end:
      - npc_hurt: { who: self, steps: 2 }
  - id: scout_team
    label: 다친 몸으로 정찰조에 넣어 달라고 버틴다
    steps: 14
    cue: 붕대를 감은 채 정찰조 막사 앞을 서성인다
    news: "{self:이/가} 끝내 정찰조에 들어갔다고 한다"
    fill: { chance: 0.5 }
    end: []
