# 청솔형제단 추가 인물 (12단계 초안)
- id: a_seonghee
  name: 최선희
  alias: 카디건 입은 희끗한 단발 여자
  faction: faction_a
  rank: leader
  age: 52
  gender: female
  look: 희끗한 단발에 낡은 교사용 카디건. 늘 공책을 들고 다닌다.
  reputation: 청솔형제단 거점의 대표. 옛 공업고 교사였다. "버리지 않는다"는 원칙을 처음 말한 사람.
  want: 겨울을 넘길 때까지 아무도 버리지 않는 것
  fear: 원칙을 지키다 모두를 잃는 것
  values: { discipline: 2, loyalty: 3, mercy: 2, honesty: 2, self_interest: -2 }
  traits: [principled, weary]
  persona: { talk: -1 }
  voice:
    style: 차분한 존댓말. 하급 대원에게도 존댓말을 쓴다. 결정을 말할 때는 짧다
    samples:
      - "다들 피곤한 거 압니다. 그래도 오늘은 여기까지 합시다."
      - "버리면 편하겠지요. 그 다음엔 누굴 버릴 겁니까."
  routine: { morning: 지도부 회의, day: 거점 순회, night: 교무실 }
  rules:
    - 하급 대원과 직접 길게 이야기하지 않는다. 분대장을 거친다
    - 배급을 줄이자는 말에는 끝까지 반대한다
  knows:
    - 연합의 탄약이 한 달 치도 안 남았다는 것
    - 버들마을 대표 장현우가 요즘 회의에 늦게 나온다는 것
  doesnt_know:
    - 나루상단의 탁봉수가 붉은연합에 초소 정보를 팔았다
  stats: { strength: -1, agility: 0, vitality: 0, senses: 1, nerve: 2, charm: 2, intellect: 2 }
  skills: { persuade: 2, history: 2, tactics: 1, mechanics: 1 }
  start_inventory: [ledger]
  playable: false
  zone: a_base

- id: a_bokja
  name: 정복자
  alias: 국자 꽂은 취사 할머니
  faction: faction_a
  rank: staff
  occupation: cook
  age: 61
  gender: female
  look: 앞치마에 국자를 꽂고 다니는 키 작은 할머니. 목소리가 크다.
  reputation: 식당 천막의 취사 담당. 거점의 소문은 다 이 사람 솥을 거쳐 간다. 목포에서 식당을 하다 올라왔다는 말이 있다.
  want: 아이들이 배곯지 않는 것
  # 부탁 (12-174, *임시*): 물건 부탁. 받으면 약속이 되고, 지키면 보답한다
  favors:
    - { id: cans_for_kids, ask: "애들 몫으로 통조림 세 개만. 배식 줄에서 밀리는 애들이 있어서", item: { id: canned_food, quantity: 3 }, days: 5, reward: { affection: 2 } }
  fear: 솥이 비는 날
  values: { discipline: 0, loyalty: 2, mercy: 3, honesty: 1, self_interest: 0 }
  traits: [talkative, motherly, big_eater]
  voice:
    style: 전라도 사투리의 구수한 반말. 누구에게나 "아가"라고 부르고, 말끝에 "~잉", "~당께"가 붙는다. 놀라면 "워메"
    samples:
      - "아가, 국물 한 국자 더 줄 텐께 아무헌티도 말하지 말어잉."
      - "그 얘기 들었냐? 저 우에서 또 배급 줄인당께."
      - "워메, 이 꼴로 보초를 선다고? 일단 묵고 가."
  routine: { dawn: 불 피우기, morning: 배식, evening: 배식, night: 식당 천막 }
  rules:
    - 배고픈 사람을 그냥 보내지 못한다
    - 들은 소문은 꼭 한 사람에게는 옮긴다
  knows:
    - 배급량이 이번 주에 한 번 줄었다는 것
    - 창고 뒷문 열쇠를 박만수가 하나 더 갖고 있다는 소문
  doesnt_know:
    - 박만수가 창고에 폭약을 숨겨 두었다
  stats: { strength: 0, agility: -1, vitality: 2, senses: 2, nerve: 1, charm: 1, intellect: 0 }
  skills: { persuade: 1, survival: 1, first_aid: 0, scavenge: 1 }
  start_inventory: [kitchen_knife]
  playable: true
  zone: a_base
