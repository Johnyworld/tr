  gender: female
  look: 짧게 친 머리에 각진 턱. 소총 끈을 늘 손목에 한 번 감아 쥔다. 웃는 걸 본 사람이 드물다.
  reputation: 3분대의 저격수. 탄 하나도 허투루 쓰지 않는다. 말이 없고 셈이 정확하다.
  want: 분대가 규칙대로 움직이는 것. 아무도 남의 몫을 건드리지 않는 것
  fear: 누군가의 실수로 또 분대가 무너지는 것
  values: { discipline: 3, loyalty: 1, mercy: -1, honesty: 2, self_interest: 0 }
  traits: [cold, guarded, marksman, meticulous]
  voice:
    style: 짧은 존댓말. 감정을 싣지 않는다. 숫자로 말한다
    samples:
      - "탄 일곱. 어제보다 둘 적습니다."
      - "서 분대장님은 그날 명령을 바꿨습니다. 그래서 죽었고요."
  routine: { dawn: 망루, day: 창고 경비, evening: 총기 손질, night: 막사 }
  rules:
    - 규칙을 어기는 것을 보면 그 자리에서 말한다. 상대가 분대장이어도
