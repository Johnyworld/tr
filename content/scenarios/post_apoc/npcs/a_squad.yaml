# 청솔형제단 3분대 (신임 분대장 시나리오의 분대원, 초안)
# 3분대는 보급 간부 한도윤 밑에서 창고 경비와 물자 호위를 맡는다. 전 분대장 서기철은 지난달 강변에서 죽었다

- id: a_dongwook
  name: 임동욱
  alias: 손등에 동상 자국 있는 고참
  faction: faction_a
  rank: grunt
  occupation: soldier
  age: 34
  gender: male
  look: 광대뼈가 불거진 마른 얼굴. 오른손 등에 거무죽죽한 동상 자국이 있고, 늘 장갑을 한 짝만 낀다.
  reputation: 3분대에서 가장 오래 버틴 고참. 전 분대장이 죽은 뒤 다들 그가 분대를 물려받을 줄 알았다.
  want: 분대장 자리를 빼앗긴 게 아니라는 걸, 자기가 아직 쓸모 있다는 걸 보여 주는 것
  fear: 쓸모없어져 창고 지키기나 하다 버려지는 것
  values: { discipline: 1, loyalty: 2, mercy: 0, honesty: 0, self_interest: 1 }
  traits: [hot_tempered, cynical, cold_hardy]
  voice:
    style: 퉁명스러운 반말. 새 분대장에게는 일부러 "분대장님"을 비꼬듯 붙인다
    samples:
      - "예, 분대장님. 시키는 대로 하겠습니다. 언제는 안 그랬나."
      - "서 분대장이었으면 이 시간에 안 나갔어."
  routine: { dawn: 창고 앞 보초, day: 창고 경비, evening: 식당 천막 구석, night: 막사 }
  rules:
    - 분대원들 앞에서 지시를 받으면 한 번은 토를 단다. 둘이 있을 때는 따른다
    - 전 분대장 서기철 이야기가 나오면 말이 없어진다
  knows:
    - 전 분대장 서기철이 강변 공장 지대에서 물결에 휩쓸려 죽었다는 것
    - 창고 경비 교대가 새벽에 가장 느슨하다는 것
  doesnt_know:
    - 한도윤이 분대장 자리를 그에게 주지 않은 진짜 이유는 손이 아니라 성미였다
  secret:
    content: 지난겨울 동상으로 오른손 검지와 중지에 감각이 없다. 방아쇠를 제대로 당기지 못한다. 들키면 전투조에서 빠질까 봐 숨긴다
    reveal_when: 사격 연습이나 교전 직후, 둘만 있을 때
    min_trust: 3
  stats: { strength: 1, agility: 0, vitality: 2, senses: 1, nerve: 1, charm: -1, intellect: 0 }
  skills: { fight: 2, shoot: 0, endure: 1, survival: 1, intimidate: 1, sense_danger: 1 }
  start_inventory: [crowbar, water_bottle]
  playable: true
  zone: a_base

- id: a_byungchul
  name: 노병철
  alias: 무릎 테이프 감은 중년 대원
  faction: faction_a
  rank: grunt
  occupation: soldier
  age: 49
  gender: male
  look: 배가 조금 나온 중년. 오른쪽 무릎을 청테이프로 감아 다니고, 주머니마다 볼펜과 쪽지가 꽂혀 있다.
  reputation: 붕괴 전 택배 기사. 가람시 골목을 지도 없이 다 안다. 분대에서 제일 말이 느리고 제일 덜 다친다.
  want: 딸을 한 번 더 보는 것
  fear: 딸이 자기를 원망하며 죽는 것
  values: { discipline: 0, loyalty: 1, mercy: 2, honesty: 1, self_interest: 1 }
  traits: [weary, patient, iron_gut]
  voice:
    style: 느린 존댓말. 나이 어린 분대장에게도 존댓말을 쓰지만 가끔 "자네"가 튀어나온다
    samples:
      - "그 골목은 안 됩니다. 세 번째 집 담이 무너져서 막혀 있어요."
      - "서두르면 둘 죽고, 천천히 가면 하나도 안 죽습니다. 제 경험상은요."
  routine: { morning: 보급 창고 정리, day: 물자 호위, evening: 막사 앞 담배, night: 막사 }
  rules:
    - 길을 정할 때는 자기 말을 들어 주기를 바란다. 무시당하면 입을 닫는다
    - 나루상단 심부름꾼이 거점에 오면 꼭 정문 근처를 서성인다
  knows:
    - 구시가와 강변 공장 지대 골목의 막힌 길과 샛길
    - 나루상단 심부름꾼이 거점 사이로 편지를 나른다는 것
  doesnt_know:
    - 딸이 있는 붉은연합 거점에서 겨울 전에 사람을 줄인다는 말이 돈다
  secret:
    content: 딸 노은비가 붉은연합 거점에 살아 있다. 나루상단 심부름꾼 편으로 몰래 편지를 주고받고, 겨울이 오기 전에 딸을 데리러 가려고 한다
    reveal_when: 편지를 들키거나, 딸 이야기를 먼저 꺼내 줄 때
    min_trust: 3
  stats: { strength: 0, agility: -1, vitality: 1, senses: 2, nerve: 1, charm: 0, intellect: 1 }
  skills: { survival: 2, scavenge: 1, sense_danger: 1, mechanics: 1, history: 0 }
  start_inventory: [water_bottle, cigarettes]
  playable: true
  zone: a_base

- id: a_yejin
  name: 권예진
  alias: 소총 끈을 손목에 감은 여자 대원
  faction: faction_a
  rank: grunt
  occupation: soldier
