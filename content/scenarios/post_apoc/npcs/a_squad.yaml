    samples:
      - "...그거, 제가 하면 안 돼요?"
      - "저 어디서 왔는지는, 꼭 말해야 돼요?"
  routine: { morning: 식당 천막 설거지, day: 창고 경비 보조, evening: 정복자 할머니 곁, night: 막사 구석 침상 }
