    - 전 분대장 서기철이 마지막 날 명령을 바꿔 강변 쪽으로 돌아갔다는 것
  doesnt_know:
    - 한도윤이 숨겨 둔 자루가 겨울용 비상 식량이라는 것
  secret:
    content: 며칠 전 새벽 망루에서 한도윤이 혼자 자루 여러 개를 옛 기계실습실로 옮기는 것을 봤다. 무엇인지는 모르고, 아직 아무에게도 말하지 않았다
    reveal_when: 배급이 줄어 분대가 굶을 때, 분대장이 규칙을 지키는 사람이라고 믿게 됐을 때
    min_trust: 4
  stats: { strength: 0, agility: 2, vitality: 0, senses: 2, nerve: 1, charm: -1, intellect: 0 }
  skills: { shoot: 2, stealth: 1, sense_danger: 1, endure: 0 }
  start_inventory: [old_rifle, binoculars]
  playable: true
  zone: a_base

- id: a_haneul
