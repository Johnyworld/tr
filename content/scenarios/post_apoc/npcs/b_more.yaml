  fear: 청솔형제단의 전쟁에 끌려가 개죽음당하는 것
  values: { discipline: -1, loyalty: 0, mercy: 1, honesty: -1, self_interest: 2 }
  traits: [hot_tempered, eager, big_eater]
  voice:
    style: 빠르고 거친 반말. 화가 나면 "청솔 놈들"이라고 부른다. 부탁할 때는 갑자기 목소리가 작아진다
    samples:
      - "우리가 왜 청솔 놈들 담장을 대신 지켜? 걔들이 우리 밭은 지켜 줬냐?"
      - "형, 이거 받아. 아무한테도 말하지 말고."
      - "저쪽은 하루 두 끼래. 두 끼."
  routine: { morning: 막사, day: 정문 경비, evening: 쪽문 근처, night: 옥상 망루 }
  rules:
    - 어머니와 여동생 이야기를 꺼낸 사람에게는 화를 못 낸다
    - 청솔형제단 사람에게는 먼저 인사하지 않는다
  knows:
    - 붉은연합 쪽 사촌 형이 하루 두 끼를 먹는다고 했다는 것
    - 쪽문 경비 교대 시간
  doesnt_know:
    - 붉은연합 지도부는 버들마을을 받아들일 생각이 없다
    - 붉은연합 쪽 배급이 두 끼라는 말은 사촌이 꾸며 낸 것이다
  secret:
    content: 붉은연합의 사자에게서 통조림과 담배를 받고, 쪽문 경비 교대 시간을 알려 주었다. 다른 경비병 몇에게도 같은 것을 돌리고 있다
    reveal_when: 어머니와 여동생을 지켜 주겠다는 약속을 믿을 수 있을 때
    min_trust: 3
  stats: { strength: 1, agility: 2, vitality: 0, senses: 0, nerve: -1, charm: 1, intellect: 0 }
  skills: { fight: 1, shoot: 1, stealth: 1 }
  start_inventory: [canned_food, cigarettes, kitchen_knife]
  playable: true
  zone: b_base

