  knows:
    - 단지 안 우물 두 곳 중 아랫단 우물의 물이 줄고 있다는 것
    - 씨감자와 배추씨를 관리사무소 지하에 숨겨 두었다는 것
  doesnt_know:
    - 대표 장현우가 붉은연합의 사자를 만났다
  secret:
    content: 지금처럼 퍼 쓰면 아랫단 우물은 한겨울 전에 마른다고 셈해 두었다. 대표에게만 말했고, 대표는 아무에게도 말하지 말라고 했다
    reveal_when: 우물 일을 함께 거들며 믿음을 쌓은 사람이 물이 왜 줄었는지 물을 때
    min_trust: 2
  stats: { strength: -1, agility: -1, vitality: 2, senses: 1, nerve: 1, charm: 0, intellect: 1 }
  skills: { survival: 2, carpentry: 1, first_aid: 0 }
  start_inventory: [water_bottle, ledger]
  playable: false
  zone: b_base

- id: b_jaehyuk
  name: 염재혁
  alias: 목에 붉은 실을 감은 젊은 경비병
  faction: faction_b
  rank: grunt
  occupation: soldier
  age: 20
  gender: male
  look: 키가 크고 말랐다. 목에 붉은 실을 몇 겹 감았다. 손가락이 늘 담뱃진에 누렇다.
  reputation: 버들마을의 젊은 경비병. 청솔형제단 이야기만 나오면 언성이 높아진다. 붉은연합 쪽에 사촌 형이 있다는 말이 있다.
