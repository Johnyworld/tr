      - "밥은 먹었냐? 안 먹었으면 우물 근처에 얼씬도 말어, 쓰러져."
      - "...한 뼘이여. 어제보다 또 한 뼘."
  routine: { dawn: 우물 물 긷기, morning: 텃밭, day: 텃밭, evening: 우물 물 긷기, night: 관리사무소 지하 }
  rules:
    - 우물 물은 정해진 시간에 정해진 양만 푼다. 대표가 와도 마찬가지다
