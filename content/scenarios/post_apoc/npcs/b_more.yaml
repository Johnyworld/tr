# 버들마을 추가 인물 (버들마을 경비병 시나리오). 대표 장현우·경비병 오미나는 others.yaml에 있다

- id: b_dongcheol
  name: 배동철
  alias: 경비실 모자를 쓴 반백의 조장
  faction: faction_b
  rank: squad_leader
  occupation: soldier
  age: 56
  gender: male
  look: 반백의 짧은 머리에 챙이 해진 아파트 경비실 모자. 허리춤에 열쇠 꾸러미가 짤랑거린다.
  reputation: 버들마을 경비조장. 붕괴 전에도 이 단지의 경비원이었다. 집집마다 식구 수와 아이 이름까지 외운다는 말이 있다.
  want: 단지 안의 식구를 한 명도 내보내지 않고 겨울을 넘기는 것
  fear: 어느 편에 붙든 마지막에 단지가 불타는 것
  values: { discipline: 2, loyalty: 2, mercy: 1, honesty: 0, self_interest: 0 }
  traits: [weary, protective, cold_hardy]
  voice:
    style: 느릿한 반말. 경비원 시절 버릇으로 사람을 "몇 동 누구"로 부른다. 대표 이야기가 나오면 말을 돌린다
    samples:
      - "103동 막내야, 쪽문 자물쇠 다시 봐. 손으로 당겨 봐야 알아."
      - "위에서 정할 일이다. 우리는 문만 지키면 돼."
      - "총은 마지막이다. 소리 나면 저것들이 먼저 온다."
  routine: { dawn: 정문 교대, morning: 단지 순찰, day: 경비실, evening: 쪽문 점검, night: 경비실 }
  rules:
    - 단지 식구에게 총을 겨누는 일은 어떤 명령이라도 하지 않는다
    - 근무 중에 조는 것은 한 번은 넘어가고 두 번은 넘어가지 않는다
  knows:
    - 정문과 북쪽 쪽문의 열쇠는 자기와 대표만 가지고 있다
    - 경비병 한 사람에게 돌아가는 탄이 다섯 발이 안 된다는 것
    - 단지 식구들의 식구 수와 아이들 이름
  doesnt_know:
    - 붉은연합 지도부는 버들마을을 받아들일 생각이 없다
  secret:
    content: 지난주 밤, 대표의 명령으로 붉은연합의 사자를 북쪽 쪽문으로 몰래 들여보낸 사람이 자기다. 무슨 이야기가 오갔는지는 듣지 못했다
    reveal_when: 단지 식구를 지키려는 마음을 함께 확인한 사람에게, 경비실에서 둘만 있을 때
    min_trust: 4
  stats: { strength: 1, agility: 0, vitality: 1, senses: 2, nerve: 1, charm: 0, intellect: -1 }
  skills: { sense_danger: 2, shoot: 1, fight: 1, intimidate: 1, carpentry: 1, maintenance: 1 }
  start_inventory: [radio, old_rifle]
  playable: true
  zone: b_base

- id: b_sunrye
