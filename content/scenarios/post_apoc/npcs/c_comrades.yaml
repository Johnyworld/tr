# 붉은 완장 시나리오의 동료 일곱 (role_c_comrades)
# 붕괴 뒤 두 해를 주인공과 함께 버틴 여덟 명 중 일곱. 석 달 전 통째로 붉은연합에 들어 저마다 다른 일을 맡았다
# 한재호(약탈 육조장)가 주인공의 가장 친한 친구. 안다혜·하범수는 같은 약탈 육조

- id: c_cm_jaeho
  name: 한재호
  alias: 완장을 두 번 감아 맨 조장
  faction: faction_c
  rank: squad_leader
  occupation: scavenger
  age: 28
  gender: male
  look: 어깨가 넓고 광대에 흰 흉터가 비스듬히 지나간다. 붉은 완장을 두 번 감아 맨다. 웃을 때는 눈부터 접힌다.
  reputation: 석 달 전 들어온 여덟 명 무리의 맏형 노릇을 하던 사내. 입단 시험에서 감염체를 혼자 넷 쓰러뜨려 바로 약탈 육조장이 됐다. 할당량을 한 번도 빠뜨린 적이 없다.
  want: 동료들을 다시는 굶기지 않는 것. 붉은연합이 세상을 다시 세우는 날 그 앞줄에 서는 것
  fear: 동료 중 누가 약해서 죽는 것
  values: { discipline: 2, loyalty: 3, mercy: -1, honesty: 1, self_interest: -1 }
  traits: [protective, principled]
  voice:
    style: 힘 있는 반말. 동료에게는 장난스럽고, 명령할 때는 짧게 끊는다
    samples:
      - "강한 놈만 살아남아. 그러니까 너도 강해져. 내가 옆에 있을 때."
      - "위원장님 말 들었지? 우리가 세상을 다시 세운다고. 난 그거 믿어."
      - "밥 먹었냐? 안 먹었으면 내 거 먹어."
  routine: { dawn: 조원 점호, morning: 약탈조 출발, day: 구시가·강변 털이, evening: 창고 앞 할당량 검수, night: 물류창고 마당 불가 }
  rules:
    - 조원이 다치면 할당량보다 조원을 먼저 챙긴다
    - 붉은연합을 욕하는 말은 동료에게도 그 자리에서 막는다
    - 약한 소리를 하는 동료를 혼자 두지 않고 끝까지 단련시킨다
  knows:
    - 청솔형제단은 붙잡은 사람을 잡아먹고, 무고한 사람을 죽인다는 것 (위원회 연설에서 들었다)
    - 약탈조라는 이름은 감염체를 털어 세상을 되찾는 조라는 뜻이라는 것
    - 동쪽 공세가 겨울 전에 있다는 것. 육조도 나갈 수 있다는 것
    - 여덟 명이 처음 만난 곳은 구시가 초등학교 체육관이었다는 것
  doesnt_know:
    - 청솔형제단이 사람을 먹는다는 말은 위원회가 퍼뜨린 선전이라는 것
  secret:
    content: 첫 겨울, 여덟 명은 원래 아홉이었다. 감염체 떼에 쫓길 때 발을 다친 윤서를 두고 가자고 정한 사람이 한재호였다. 동료들에게는 윤서가 물려서 어쩔 수 없었다고 말했다. "강한 자만 살아남는다"는 말은 그날부터 했다
    reveal_when: 주인공과 단둘이, 동료 하나가 크게 다치거나 죽을 뻔한 날 밤
    min_trust: 4
  stats: { strength: 2, agility: 1, vitality: 1, senses: 0, nerve: 2, charm: 1, intellect: 0 }
  skills: { fight: 2, tactics: 1, intimidate: 1, endure: 1 }
  start_inventory: [c_armband, sawn_shotgun, shells, shells, padded_armor]
  playable: true
  zone: c_warehouse
  ties:
    - { to: c_cm_beomsu, kind: friend }
    - { to: c_cm_gitaek, kind: friend }

