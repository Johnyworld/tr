# 붉은연합 인물 (붉은연합 신입 약탈조원 시나리오, 12단계 초안)
# 고석진(정찰병)과 마경수(간부)는 others.yaml. 붉은연합 지도부는 여기의 국혜란 한 사람뿐이다

- id: c_cheolgu
  name: 염철구
  alias: 목에 화상 자국 있는 약탈조장
  faction: faction_c
  rank: squad_leader
  occupation: soldier
  age: 44
  gender: male
