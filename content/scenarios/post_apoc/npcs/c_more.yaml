    samples:
      - "할당량은 통조림 서른. 스물아홉이면 빈손이랑 같다."
      - "울지 마. 우는 놈 몫은 웃는 놈이 먹는다."
      - "규율반한테는 내가 말한다. 너는 입 다물고 있어."
