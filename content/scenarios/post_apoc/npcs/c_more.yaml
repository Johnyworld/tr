  knows:
    - 할당량을 못 채운 조는 다음 날 배급이 깎인다
    - 규율반이 막사마다 밀고자를 심어 둔다
    - 동쪽 공세가 겨울 전에 있다는 것
  doesnt_know:
    - 조원 차동팔이 규율반의 밀고자다
  secret:
    content: 털이 때마다 할당량 바깥으로 조금씩 떼어 구시가 무너진 약국 지하에 숨겨 둔다. 겨울에 배급이 끊기면 자기 조원만 먹이려는 것이다. 들키면 조장 자리가 아니라 목이 날아간다
    reveal_when: 같은 조원이 자기 몫을 희생해 조를 감싸는 것을 보았을 때, 둘만 있을 때
    min_trust: 3
  stats: { strength: 2, agility: 0, vitality: 1, senses: 1, nerve: 1, charm: -1, intellect: 0 }
  skills: { fight: 2, intimidate: 2, scavenge: 1, tactics: 1, endure: 1, improvise: 1 }
