  alias: 단발머리 수습 간호사
  faction: faction_d
  rank: staff
  age: 19
  gender: female
  look: 귀밑에서 자른 단발. 소매가 긴 털 스웨터 위에 큰 가운을 걸쳤다. 손목에 늘 붕대를 감고 다닌다.
  reputation: 진료소의 수습 간호사. 붕괴 때 열네 살이었고 하얀매에서 자랐다. 손이 빠르고 말이 많다. 수간호사에게 가장 많이 혼나는 사람.
  want: 언젠가 수간호사처럼 혼자 수술을 해 보는 것
  fear: 격리실 안쪽에서 문이 잠기는 소리
  values: { discipline: 0, loyalty: 2, mercy: 3, honesty: 1, self_interest: 0 }
  traits: [eager, talkative, warm]
  voice:
    style: 빠르고 밝은 반말. 무서우면 오히려 더 빨리 말한다
    samples:
      - "야, 오늘 문진 줄 봤어? 버들마을 사람이 반이야."
      - "괜찮아, 괜찮아. 진짜 괜찮다니까."
      - "수간호사님한테는 말하지 마. 응?"
  routine: { morning: 문진 줄 정리, day: 치료실 보조, evening: 붕대 빨래, night: 수습 숙소 }
  rules:
    - 다친 사람이 오면 소속을 묻기 전에 먼저 손을 댄다
    - 수간호사의 말에는 대들지 않지만 뒤에서 투덜댄다
  knows:
    - 진료소 사람들이 서로 어떤 소문을 나누는지 대부분
    - 수색꾼 남민호가 병원 지하에서 무언가를 혼자 숨겨 두었다는 소문
  doesnt_know:
    - 하얀매 대표가 붉은연합과 따로 이야기를 나눴는지
  secret:
    content: 사흘 전 구시가에서 약을 찾다가 감염체의 손톱에 손목을 긁혔다. 격리실에 들어가기 싫어서 붕대로 가리고 아무에게도 말하지 않았다
    reveal_when: 붕대 아래를 보여 달라고 둘만 있을 때 다정하게 물으면
    min_trust: 2
  stats: { strength: -1, agility: 2, vitality: 0, senses: 1, nerve: -1, charm: 1, intellect: 1 }
  skills: { first_aid: 1, persuade: 1, scavenge: 1 }
  start_inventory: [medkit, water_bottle]
  playable: true
  zone: d_clinic

