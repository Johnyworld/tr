# 나루상단 추가 인물 (짐꾼 시나리오). 우두머리 탁봉수·심부름꾼 하유리는 others.yaml
- id: e_okhee
  name: 주옥희
  alias: 쇠 저울추를 찬 행상대장
  faction: faction_e
  rank: squad_leader
  occupation: trader
  age: 49
  gender: female
  look: 허리춤에 쇠 저울추를 매단 단단한 체구의 여자. 손등이 밧줄 자국으로 거칠다. 짐 무게를 손으로 들어 보고 맞힌다.
  reputation: 나루상단 짐마차를 이끄는 행상대장. 짐 하나 사람 하나 빠뜨리지 않고 돌아온다는 평. 대신 셈이 틀리면 끝까지 따진다.
  want: 짐마차와 짐꾼을 겨울까지 하나도 잃지 않는 것
  fear: 길 위에서 짐꾼을 버리고 와야 하는 날
  values: { discipline: 2, loyalty: 2, mercy: 0, honesty: 1, self_interest: 1 }
  traits: [meticulous, blunt, steel_nerves]
  voice:
    style: 짧고 셈 빠른 반말. 짐꾼은 "짐"이나 이름으로 부르고, 손님에게는 깍듯한 존댓말로 바뀐다
    samples:
      - "물통 여섯, 통조림 한 상자, 사람 넷. 돌아올 때도 넷이다."
      - "값은 내가 부른다. 너는 웃기만 해."
      - "총 꺼내지 마. 정수장 오백 걸음 안은 우리 집 마당이야."
  routine: { dawn: 짐마차 점검, morning: 출발 준비, day: 길 위, evening: 장부 맞추기, night: 짐마차 옆 }
  rules:
    - 짐꾼이 짐을 몰래 빼돌리는 것을 가장 무겁게 본다
    - 다친 짐꾼은 짐을 버리고라도 데려온다
    - 길에서는 해 지기 전에 멈춘다
  knows:
    - 강변 길에서 짐마차가 털린 날은 모두 출발 시간을 바꾸지 않은 날이었다
    - 청솔형제단 거점은 물값을 담배와 고철로 낸다
    - 붉은연합 물류창고 쪽 거래는 탁봉수가 직접 정한다
  doesnt_know:
    - 진하나가 붉은연합 약탈조에 짐마차 출발 시간을 흘리고 있다
  secret:
    content: 한 달 전 붉은연합 물류창고에서 탄약 두 상자를 자기 짐마차로 실어 왔다. 탁봉수가 무엇의 값으로 받았는지 짐작은 하지만 묻지 않았다
    reveal_when: 짐꾼이 탁봉수의 거래를 캐묻고, 상단이 위험해질 수 있다는 걸 이해할 때
    min_trust: 3
  stats: { strength: 1, agility: 0, vitality: 2, senses: 1, nerve: 2, charm: 0, intellect: 1 }
  skills: { persuade: 1, survival: 2, sense_danger: 1, endure: 1, mechanics: 1, fight: 1 }
  start_inventory: [trade_token, ledger, crowbar]
  playable: true
  zone: e_market

