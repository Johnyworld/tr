# 외국인 생존자 (12-140): 붕괴 때 저마다의 까닭으로 이 도시에 있던 사람들. 무리와 장소에 고루 둔다
# - 말투는 한국에서 산 세월만큼의 자연스러운 한국어로 쓴다 (흉내 내는 "외국인 말투"로 연기하지 않는다). 모국어는 혼잣말·노래·기도에 묻어난다
# - 고향 소식을 모른다는 것, 이름을 제대로 불러 주는 사람이 드물다는 것이 저마다의 이야기 씨앗이다

