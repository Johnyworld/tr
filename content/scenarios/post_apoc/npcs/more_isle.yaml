  stats: { strength: -1, agility: -1, vitality: 0, senses: 1, nerve: 1, charm: 1, intellect: 2 }
  skills: { first_aid: 2, history: 1, persuade: 1, deceive: 1 }
  start_inventory: [medkit, fever_reducer, antibiotics]
  playable: true
  healer: true
  zone: yeoul_isle
  ties:
