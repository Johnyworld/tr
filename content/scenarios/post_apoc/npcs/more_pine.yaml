# 청솔형제단 추가 인물 (1분대·창고·의무실·거점 살림)
# 1분대는 남쪽 담장과 남쪽 텃밭을 지킨다. 지난겨울 텃밭 밖 물결 때 분대원 엄태석을 잃었다

