    - 아이들 앞에서는 구호를 읽지 않는다
  knows:
    - 대표 장현우를 버들마을 북쪽 쪽문으로 몰래 만나러 갔던 밤, 쪽문을 연 사람이 경비조장 배동철이라는 것
    - 버들마을 지하 교실에 아이들이 몇이나 있는지
    - 위원장 국혜란이 버들마을 이야기를 할 때 웃지 않는다는 것
  doesnt_know:
    - 위원장이 버들마을에 보낸 제안이 미끼이고, 연합이 깨지면 버들마을도 치려 한다는 것
  secret:
    content: 붕괴 전 가람초등학교 교사였다. 버들마을의 진은지와 같은 학교에서 일했다. 사자로 다녀온 다음 날 지하 교실 문 앞에 해열제를 두고 온 것은 위원회 몫이 아니라 자기 몫이었다
    reveal_when: 버들마을 이야기를 하다 아이들 얘기가 나왔을 때, 위원회 천막 밖에서 둘만 있을 때
    min_trust: 3
  stats: { strength: -1, agility: 0, vitality: 0, senses: 0, nerve: 1, charm: 2, intellect: 2 }
  skills: { persuade: 2, history: 1, deceive: 1 }
  start_inventory: [c_armband, ledger, fever_reducer]
  playable: true
