  gender: male
  look: 광대뼈가 툭 튀어나온 얼굴에 앞니가 셋 없다. 팔에 붉은 완장 대신 흰 천을 감았다. 포로였던 사람만 차는 표시다.
  reputation: 밤나무골 무리가 흡수될 때 포로로 들어와, 지금은 수용소 노역조를 부리는 사람. 포로였던 놈이 포로를 부린다고 양쪽에서 침을 뱉는다.
