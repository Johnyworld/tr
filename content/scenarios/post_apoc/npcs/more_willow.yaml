    - 나루상단 장부꾼 문소라 앞에 마을 이름으로 진 빚이 얼마나 되는지
    - 허진만 분대장이 저울을 볼 때 눈빛이 달라졌다는 것
    - 맹석규 간부가 텃밭 몫 장부를 대충 넘겨 준다는 것
  doesnt_know:
    - 맹석규가 붉은연합 위원장과 옛 동료라는 것
  secret:
    content: 청솔형제단에 넘기는 텃밭 몫을 저울로 조금씩 덜어 왔다. 덜어 낸 것을 장터에 팔아 첫 봄에 씨앗과 소금을 사느라 마을 이름으로 진 빚을 갚는다. 맹석규가 알면서 눈감아 준다
