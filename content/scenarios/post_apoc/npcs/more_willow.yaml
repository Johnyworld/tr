# 버들마을 추가 인물 (우물·텃밭·장터·관리사무소·경비 당번)
# 아랫단 우물이 마르고, 붉은연합의 회유와 청솔형제단과의 약조 사이에서 단지가 흔들린다

- id: pb_sanggu
  name: 남상구
