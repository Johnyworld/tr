    samples:
      - "총각, 이거 들어 봐. 무겁지? 근데 저울은 가볍다잖아. 저울이 틀렸나 봐, 호호."
      - "청솔 사람들도 먹어야지. 근데 우리 애들은 뭐 이슬 먹고 크나?"
