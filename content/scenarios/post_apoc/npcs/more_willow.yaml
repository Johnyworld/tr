    - 열흘에 한 번쯤 "부품을 찾으러" 혼자 단지 밖으로 나간다
  knows:
    - 아랫단 우물을 살리려면 정수장 펌프 기사의 부품과 도움이 있어야 한다는 것
    - 옛 시립병원 근처 길과 그 일대에 감염체가 모이는 때
    - 우물을 더 파다 잘못하면 흙탕물이 올라와 아예 못 쓰게 될 수도 있다는 것 (아무에게도 말하지 않았다)
  doesnt_know:
