  reputation: 붕괴 전 지하수 관정 파던 기사. 단지 우물 두 곳을 처음 판 사람이다. 첫 겨울에 아들과 딸을 다 잃었다고 다들 안다.
  want: 아랫단 우물을 더 깊이 파서 살려 내는 것. 그러려면 정수장 펌프의 부품이 있어야 한다
