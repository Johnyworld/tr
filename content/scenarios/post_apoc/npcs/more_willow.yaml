  gender: female
  look: 볕에 검게 탄 얼굴에 주름이 깊다. 등에 낡은 앉은뱅이저울을 끈으로 매고 다닌다. 웃을 때 눈이 거의 감긴다.
  reputation: 남쪽 텃밭의 일꾼 반장이자 마을 장보기를 도맡는 사람. 텃밭 수확을 달아 청솔형제단 몫을 나누고, 남는 것을 나루상단 장터에 내다 판다. 흥정이 세다는 말과 인심이 좋다는 말을 함께 듣는다.
