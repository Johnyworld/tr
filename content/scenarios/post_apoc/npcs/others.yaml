  stats: { strength: -1, agility: 0, vitality: 0, senses: 1, nerve: 2, charm: 1, intellect: 2 }
  skills: { first_aid: 2, infected_lore: 2, persuade: 1 }
  start_inventory: [medkit, antibiotics]
