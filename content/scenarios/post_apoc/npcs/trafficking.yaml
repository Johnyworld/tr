    samples:
      - "주차장 쪽은 보지 마. 보면 묻게 되고, 물으면 사장이 알아."
      - "그 애 이름은 내가 외워 뒀어. 버들마을 애래. 나한테 자기 이름 꼭 기억해 달랬어."
  routine: { morning: 휴게소 식당 안, day: 휴게소 식당 안, evening: 휴게소 여관, night: 휴게소 여관 }
  rules:
