# ── 거간꾼 ──
- id: rs_pansu
  name: 길판수
  alias: 덮개 트럭을 모는 일손 거간꾼
  faction: null
  rank: loner
  occupation: trader
  age: 53
  gender: male
  look: 기름에 전 작업복 위에 털 깃 달린 외투. 손가락이 굵고 손톱 밑이 까맣다. 트럭 열쇠를 목에 걸고 다닌다.
  mature:
    note: 젊은 여자는 따로 값을 매겨 휴게소 여관과 바깥 술집에 넘긴다
  reputation: 고속도로 쪽에서 일손을 구해 오고 데려가는 거간꾼. 휴게소 화물차 주차장에 트럭을 세워 두고 산다. 어느 무리 완장도 차지 않는다.
  want: 탄약을 넉넉히 쌓아 고속도로 남쪽 길에 제 휴게소를 차리는 것
  fear: 붉은연합이 값을 올리거나, 나루상단이 주차장을 닫는 것
  values: { discipline: 0, loyalty: -1, mercy: -3, honesty: -2, self_interest: 3 }
  traits: [calculating, cold, patient]
  voice:
    style: 느릿한 반말. 사람을 "머릿수"로 센다
    samples:
      - "일손은 일손이지. 어디서 왔는지는 내 알 바 아니고."
      - "머릿수 맞으면 상자 내려. 안 맞으면 다음 달에 봐."
  routine: { dawn: 화물차 주차장, morning: 화물차 주차장, day: 톨게이트, evening: 휴게소 식당 안, night: 화물차 주차장 }
  rules:
    - 머릿수를 두 번 센다. 한 번은 받을 때, 한 번은 출발할 때
    - 짐칸 문은 자기 손으로만 연다
  knows:
    - 붉은연합 물류창고에서 오는 덮개 트럭은 사흘에 한 번 밤에 휴게소 주차장에 선다
    - 값은 탄약 상자로 치르고, 머릿수는 붉은연합 쪽 노역조장 용두만과 맞춘다
  keeps:
    - 붉은연합 간부 마경수의 몫을 따로 적은 거래 쪽지를 트럭 운전석 밑에 둔다
  doesnt_know:
    - 붉은연합 규율반 서기 우상옥이 마경수의 따로 거래를 캐고 있다는 것
  secret:
    content: 붉은연합 수용소의 "밤 노역조"를 탄약을 주고 사들여 고속도로 바깥으로 데려간다. 바깥에 무엇이 있는지 다들 모른다지만, 그는 길을 안다
    reveal_when: 목숨이 걸렸거나, 거래 쪽지를 들킨 뒤
    min_trust: 9
  stats: { strength: 1, agility: 0, vitality: 1, senses: 2, nerve: 2, charm: 0, intellect: 1 }
  skills: { persuade: 1, intimidate: 2, mechanics: 1, sense_danger: 2, shoot: 1, survival: 1 }
