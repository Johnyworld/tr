# 붉은연합 인신매매 줄기의 사람들 (docs/mature-plan.md 5, 이야기 storylets/trafficking.yaml)
# 붉은연합 간부 마경수가 수용소 사람을 "야간 전출"로 빼 노역조장 용두만을 거쳐 거간꾼 길판수에게 넘기고, 탄약을 받는다.
# 규율반 서기 우상옥의 명부에 그 칸이 남는다. 길판수는 고속도로 휴게소 화물차 주차장에서 사람을 받아 바깥으로 데려가고,
# 젊은 여자 일부는 휴게소 여관(반태수)과 바깥 술집에 넘긴다. 이 갈래는 성인 옵션이 켜져 있을 때만 카드의 mature 줄과 믿음·행적의 mature 글로 보인다
# 지킬 선: 모두 성인. 카드의 겉 글(look·reputation·knows·secret)은 늘 보이는 글이라 순화해 적는다

# ── 휴게소 여관 ──
