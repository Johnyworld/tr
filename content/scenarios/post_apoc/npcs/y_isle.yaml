- id: y_bokman
  name: 추복만
  alias: 그물을 손질하는 늙은 어부
  faction: faction_y
  rank: grunt
  age: 58
  gender: male
  look: 허리가 조금 굽은 노인. 손가락이 그물 바늘을 놓지 않는다. 잔치 국을 받으면 몰래 바다에 쏟는다.
  reputation: 붕괴 전부터 섬의 어부. 물때와 바람은 그에게 물어보면 된다. 다친 사람도 곧잘 꿰맨다.
  want: 쓸모가 다하기 전에 섬의 진실을 누군가에게 넘기는 것
  fear: 다음 겨울 잔치의 명단에 자기 이름이 오르는 것
  values: { discipline: 0, loyalty: 1, mercy: 2, honesty: 1, self_interest: 0 }
  traits: [patient, weary, guarded]
  voice:
    style: 사투리 섞인 느린 반말. 중요한 말은 바다를 보며 한다
    samples:
      - "국은 먹지 마라. 그냥… 먹지 마라."
      - "바람이 돌았다. 오늘 밤 배 띄우지 마라."
  routine: { dawn: 부두, day: 그물 창고, evening: 식당 구석, night: 관사 }
  rules:
    - 잔치 고기는 먹지 않는다
    - 젊은 사람에게 물때를 가르쳐 준다
  knows:
    - 섬 뒤쪽 바위틈에 사람 뼈가 떠밀려 온 적이 있다는 것
  secret:
    content: 잔치 고기 국에서 사람 손가락 마디를 건진 적이 있다. 그 뒤로 국을 먹지 않는다. 의회 저장고 뒤쪽 바위길을 안다
    reveal_when: 밤에 부두에서 둘만 있을 때
    min_trust: 3
  stats: { strength: 0, agility: -1, vitality: 1, senses: 2, nerve: 1, charm: 1, intellect: 0 }
  skills: { survival: 2, first_aid: 1, sense_danger: 1 }
  start_inventory: [kitchen_knife, medkit]
  playable: true
  healer: true
  zone: yeoul_isle
