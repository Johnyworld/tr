  reputation: 해안 경비조원. 섬에서 노를 가장 잘 젓는다. 단짝이 지난달 "뭍으로 내보내졌다".
  want: 내보내진 단짝 지원이 뭍에서 잘 사는지 아는 것
  fear: 자기도 쓸모가 다하는 날
  values: { discipline: 0, loyalty: 2, mercy: 1, honesty: 1, self_interest: 0 }
  traits: [eager, curious, talkative]
  voice:
    style: 밝은 반말. 흥분하면 말이 빨라진다
    samples:
      - "지원이 탄 배, 너 봤어? 그날 밤 나 당번이었는데 배가 안 보였어."
