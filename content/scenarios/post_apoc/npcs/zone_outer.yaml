  traits: [curious, cold, meticulous]
  voice:
    style: 빠르고 건조한 존댓말. 확실하지 않은 것은 꼭 "아직은"을 붙인다
    samples:
      - "그건 소문이고요. 제가 본 건 이겁니다. 아직은 세 번밖에 못 봤어요."
      - "장갑 끼세요. 아뇨, 그건 말고 이거요."
  routine: { dawn: 약대 실험실 지하, morning: 약대 실험실, day: 약대 실험실, evening: 도서관 열람실, night: 약대 실험실 지하 }
  rules:
    - 실험실 지하 문 열쇠는 아무에게도 맡기지 않는다
    - 들은 말과 본 것을 섞어 말하지 않는다
  knows:
    - 감염체가 소리 나는 쪽으로 몰린다는 것은 여러 번 봤다
    - 물리거나 깊이 긁힌 사람이 모두 열이 오르지는 않았다. 왜인지는 아직 모른다
    - 하얀매 진료소가 자기 연구 노트를 탐낸다
  doesnt_know:
    - 하얀매가 자기를 데려가면 노트만 남기고 지하의 것은 태울 생각이라는 것
  secret:
    content: 실험실 지하 우리 안에 가둬 둔 감염체는 지도교수였던 사람이다. 물린 교수가 열이 오르기 전에 스스로 우리에 들어가 자물쇠를 채워 달라고 했다. 목에 아직 교수의 출입증이 걸려 있다
    reveal_when: 실험실 지하를 함께 내려간 뒤, 그 감염체 이야기를 물었을 때
