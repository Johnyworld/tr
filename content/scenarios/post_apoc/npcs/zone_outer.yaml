  stats: { strength: -1, agility: 1, vitality: 0, senses: 1, nerve: 2, charm: -1, intellect: 2 }
  skills: { infected_lore: 2, first_aid: 2, sense_danger: 1, stealth: 1 }
  start_inventory: [fever_reducer, cloth, flashlight]
  playable: true
  zone: campus
