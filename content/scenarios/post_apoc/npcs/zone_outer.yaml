    - { to: zo2_librarian, kind: friend }

# ── 고속도로 휴게소 ──
- id: zo2_gyudeok
  name: 채규덕
  alias: 칠판 앞의 목도리 두른 사내
  faction: null
  rank: loner
  occupation: scavenger
  age: 52
  gender: male
  look: 볕에 그을린 넓은 얼굴. 털실 목도리를 코까지 올려 감았다. 손가락이 분필 가루로 하얗다. 휴게소 식당의 메뉴 칠판을 떼어 주유소 기둥에 세워 두었다.
  reputation: 휴게소에 혼자 사는 사내. 고속도로로 나가는 사람과 들어오는 사람의 이름, 바깥 소식을 칠판에 적는다. 나루상단은 짐을 부리러 올 때마다 그 칠판부터 읽는다.
  want: 고속도로로 나간 사람 가운데 누구 하나라도 돌아와서 바깥이 어떤지 제 입으로 말해 주는 것
  fear: 칠판에 적힌 이름이 다 지워질 때까지 아무도 안 돌아오는 것
  values: { discipline: 0, loyalty: 1, mercy: 1, honesty: 2, self_interest: 1 }
  traits: [talkative, genial, curious]
  voice:
    style: 말이 많고 넉살 좋은 반말. 소문을 옮길 때는 꼭 누구한테 들었는지부터 말한다
    samples:
      - "적어 줄까? 이름이랑 어디로 가는지. 안 돌아오면 지워 주고, 돌아오면 술 한 잔 받고."
      - "그건 내가 본 게 아니야. 사흘 전에 들어온 여자가 한 말이야. 그 여자도 남한테 들었대."
  routine: { dawn: 휴게소 지붕, morning: 칠판 앞, day: 주유소 지붕 밑, evening: 휴게소 식당 안, night: 휴게소 지붕 }
  rules:
    - 칠판에는 들은 그대로 적는다. 누구한테 들었는지도
    - 나가는 사람을 말리지 않는다. 다만 이름은 꼭 받는다
  knows:
    - 고속도로로 걸어 들어오는 떠돌이가 가끔 있다. 하는 말이 저마다 다르다
    - 나루상단이 주유소 지붕 밑에 짐을 부리고 바깥 길로 사람을 보내기도 한다
    - 칠판에 적힌 나간 사람 가운데 돌아와서 이름을 지운 사람은 아직 없다
  doesnt_know:
    - 도시 밖이 정말 어떤지 (아무도 모른다)
  secret:
    content: 붕괴 첫해 겨울에 아내와 아들이 고속도로로 남쪽 친척 집을 찾아 나갔다. 자기는 다리를 다쳐 남았다. 칠판 맨 위, 지워지지 않게 긁어 새긴 이름 둘이 그들이다
    reveal_when: 칠판 맨 위의 긁힌 이름 두 줄에 대해 물었을 때
    min_trust: 3
  stats: { strength: 0, agility: 0, vitality: 1, senses: 2, nerve: 0, charm: 2, intellect: 0 }
  skills: { persuade: 2, scavenge: 1, survival: 1, sense_danger: 1 }
  start_inventory: [cigarettes, water_bottle, binoculars]
  playable: true
  zone: rest_stop
