# 청솔형제단의 하급 전투원 (MVP 고정 시작 역할, 기획서 3.4)
id: role_a_grunt
label: 청솔형제단 하급 전투원
faction: faction_a
rank: grunt
default_name: 신병
# 시작 장면. 화면에 먼저 보여 주고 GM 프롬프트에도 넣는다
opening_scene: 새벽, 청솔형제단의 거점. 당신은 막사의 낡은 간이침대에서 눈을 뜬다. 바깥에서 보초 교대를 알리는 낮은 목소리가 들린다.
# 새 게임의 시나리오 고르기에 보이는 것, 캐릭터를 만들기 전에 들려주는 지금 상황
scenario:
  title: 청솔형제단의 하급 전투원
  pitch: >-
    가장 낮은 계급에서 시작한다. 분대장의 명령을 받아 보초를 서고, 무너진 담장을 고치고, 폐허를 뒤진다.
    전쟁은 머리 위에서 정해지고, 당신은 그 아래에서 살아남아야 한다. 공을 쌓으면 위로 올라갈 수도 있다.
  intro: >-
    가을이 깊어 간다. 다가오는 겨울이 모두의 걱정이다. 당신은 청솔형제단의 하급 전투원이다.
    무리는 옛 공업고등학교 운동장을 모래주머니와 철판으로 둘러 거점으로 삼았고, 버들마을과 손잡고 붉은연합과 싸우는 중이다.
    거점 안에서는 총을 함부로 쏘지 않고, 배급은 하루 한 번 식당에서 받고, 남의 몫에 손대는 것이 가장 무거운 잘못이다.
    임무는 분대장 강태호를 통해 내려온다. 남쪽 담장은 자주 무너져 보수가 끊이지 않는다.
    이야기는 어느 새벽, 거점 막사의 간이침대에서 시작한다.
age: 23
# 능력은 정하지 않는다: 시나리오의 능력 배열을 섞어 준다 (능력은 계급·역할과 관계없다, 기획서 4.6)
