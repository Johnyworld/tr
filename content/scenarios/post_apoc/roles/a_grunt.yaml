# 시작 장면. 화면에 먼저 보여 주고 GM 프롬프트에도 넣는다
opening_scene: 새벽, 청솔형제단의 거점. 당신은 막사의 낡은 간이침대에서 눈을 뜬다. 바깥에서 보초 교대를 알리는 낮은 목소리가 들린다.
# 시나리오 목록의 "비극의 고리" (기획서 12.4.1). 튜토리얼이 끝나면 열린다 (가족을 찾았든, 죽었든)
scenario:
  title: 비극의 고리
  order: 1
  unlock: { text: "튜토리얼을 마친다 (가족을 찾거나, 주인공이 죽는다)", when: [{ scenario_ended: role_t_visitor }] }
  pitch: >-
    우리 가족은 힘겹게 생존했고, 얼마 전 식량을 구하려고 가람시를 지나치게 되었다. 붉은 완장을 찬 건달들은 우리가 가진 모든 것을 빼앗았고, 내 눈앞에서 가족을 모두 죽였다.
    마지막으로 내 목을 매달려는 순간 청솔형제단이 나타나 나를 구해 줬다. 몇 달 뒤, 나는 청솔형제단의 수색대원이 되었고 가족의 복수를 시작하려 하고 있다.
  intro: |-
    가을이 깊어 간다. 다가오는 겨울이 모두의 걱정이다. 넉 달 전 강변 길목에서 붉은 완장들에게 가족을 잃었다. 목에 감긴 밧줄이 조여 오던 순간, 총소리와 함께 청솔형제단 순찰조가 들이닥쳤다.

    그 뒤로 당신은 청솔형제단의 수색대원이다. 무리는 옛 공업고등학교 운동장을 모래주머니와 철판으로 둘러 거점으로 삼았고, 버들마을과 손잡고 붉은연합과 싸우는 중이다.

    거점 안에서는 총을 함부로 쏘지 않고, 배급은 하루 한 번 식당에서 받고, 남의 몫에 손대는 것이 가장 무거운 잘못이다.

    임무는 분대장 강태호를 통해 내려온다. 그날 쇠지렛대를 든 사내의 목에 번진 화상 자국을, 당신은 아직 기억한다.

    이야기는 어느 새벽, 거점 막사의 간이침대에서 시작한다.
  gm: >-
    복수의 이야기다. 원수(쇠지렛대를 든 목에 화상 자국 있는 붉은 완장)는 주인공이 죽은 줄 안다. 복수를 서두르게 하지도 말리지도 않는다:
    붉은연합 사람들도 저마다 사정이 있는 사람이라는 것, 복수가 또 다른 복수를 낳는다는 것이 장면 속에서 저절로 드러나게 한다.
    원수의 이름은 주인공이 아직 모를 수 있다. 알게 되는 것은 이야기와 판정의 결과로만.
# 미리 정해진 사연: 가족을 잃은 일과 원수 (세이브의 역사가 된다)
history:
  - { kind: loss, who: 가족 모두, by: c_cheolgu, where: riverside }
  - { kind: enemy, target: c_cheolgu, why: 내 눈앞에서 가족을 죽이고 나를 매달려 했다, knows_you: false }
background:
  - 붕괴 뒤 2년 가까이 가족과 함께 도시 밖을 떠돌며 버텼다. 넉 달 전 식량을 구하려고 가람시 강변을 지나다 붉은 완장들에게 붙잡혔다.
  - 붉은 완장들은 가진 것을 모두 빼앗고 눈앞에서 가족을 죽였다. 목을 매달리던 순간 청솔형제단 순찰조가 나를 구했다.
