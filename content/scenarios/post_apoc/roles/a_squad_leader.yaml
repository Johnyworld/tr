# 청솔형제단의 신임 분대장 (시작 역할, 초안)
# 강태호 분대의 분대원이던 주인공이 막 진급해 3분대를 맡았다. 3분대는 보급 간부 한도윤 밑에서 창고 경비와 물자 호위를 한다
id: role_a_squad_leader
label: 청솔형제단 신임 분대장
faction: faction_a
rank: squad_leader
occupation: scavenger
default_name: 신임
opening_scene: 아침, 청솔형제단 거점의 보급 창고 앞. 모래주머니 위에 네 사람이 앉아 있다가 당신을 보고 느릿느릿 일어선다. 한 사람은 끝까지 앉아 있다. 창고 문에는 아직 전 분대장의 이름이 분필로 적혀 있다.
scenario:
  title: 첫 번째 명령
  order: 8
  unlock: { text: "어느 시나리오에서든 계급이 오른다", when: [{ promoted: true }] }
  pitch: >-
    엿새 전 분대장이 됐다. 다들 고참 임동욱이 분대를 물려받을 줄 알았다. 전 분대장은 지난달 강변에서 돌아오지 못했다.
    이제 나는 명령을 받는 사람이 아니라 내리는 사람이다. 모자란 배급을 나누고, 누구를 위험한 곳에 보낼지 정해야 한다. 분대원 넷의 목숨이 내 판단에 걸려 있다.
  gm: >-
    처음 사람을 맡은 사람의 이야기다. 분대원 넷은 저마다 사정과 비밀이 있고, 분대장을 시험한다. 명령 하나하나가 관계와 목숨으로 돌아오게 한다.
    분대원에게 일을 맡기는 법(분대 명령)은 첫 며칠 안에 장면 밖의 짧은 말로 한 번 알려 준다.
  intro: |-
    가을이 깊어 간다. 당신은 강태호 분대에서 분대원으로 버티다가 엿새 전 분대장으로 진급했다.

    맡은 곳은 3분대다. 보급 간부 한도윤 밑에서 창고를 지키고 물자를 호위하는 분대인데, 전 분대장 서기철이 지난달 강변 공장 지대에서 돌아오지 못했다.

    분대원은 넷. 고참 임동욱, 길을 잘 아는 노병철, 저격수 권예진, 지난달 들어온 피난민 문하늘. 다들 고참 임동욱이 분대를 물려받을 줄 알았다.

    겨울을 앞두고 배급은 줄고 있고, 분대 몫을 어떻게 나눌지는 이제 당신이 정한다.

    이야기는 진급 뒤 처음으로 분대를 모으는 아침, 보급 창고 앞에서 시작한다.
