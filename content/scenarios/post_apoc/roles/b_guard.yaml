# 버들마을의 정찰대원 (12-84, 예전 경비병). 연합에 기댄 작은 마을에서, 문을 지키고 담 밖을 살피며 어느 편에 설지 흔들린다
id: role_b_guard
label: 버들마을 정찰대원
faction: faction_b
rank: grunt
occupation: scavenger
default_name: 정찰대원
age: 21
# 시작 장면. 화면에 먼저 보여 주고 GM 프롬프트에도 넣는다
opening_scene: 새벽, 버들마을 102동 옥상의 망루. 당신은 물탱크에 등을 기대고 담요를 뒤집어쓴 채 졸다가 깬다. 아래 마당에서 두레박 줄이 우물 벽을 긁는 소리가 올라온다.
# 새 게임의 시나리오 고르기에 보이는 것, 캐릭터를 만들기 전에 들려주는 지금 상황
scenario:
  title: 문을 지키는 사람
  order: 4
  unlock: { text: "어느 시나리오에서든 버들마을에 들어간다", when: [{ enter: b_base }] }
  pitch: >-
    마흔 명이 사는 옛 아파트 단지, 버들마을. 나는 정문과 쪽문을 지키는 정찰대원이다. 청솔형제단은 탄을 대 주는 대신 우리 수확과 사람을 가져간다.
    요즘 밤마다 붉은연합 사람이 쪽문 너머로 다른 길을 속삭인다. 누구에게 문을 열지는, 결국 문을 지키는 내 손에 달려 있다.
  gm: >-
    작은 마을이 두 큰 무리 사이에서 흔들리는 이야기다. 청솔형제단과의 약조, 붉은연합의 속삭임, 마을 안의 불만이 모두 쪽문 하나로 모인다.
    어느 편이 옳다고 정해 주지 않는다. 문을 열고 닫는 선택의 결과가 마을 사람들의 얼굴로 돌아오게 한다.
  intro: |-
    가을이 깊어 간다. 당신은 버들마을의 정찰대원이다. 마을은 청솔형제단 거점 남서쪽의 옛 아파트 단지를 담으로 둘러 살고, 식구는 아이들까지 마흔 명 남짓이다.

    탄은 청솔형제단에게서 받아 쓰고, 그 대신 남쪽 텃밭의 수확 일부와 경비 인원을 내준다. 그 약조를 두고 단지 안에서 불평이 늘었다.

    요즘 밤이면 붉은연합의 사람이 쪽문 근처를 다녀간다는 말이 돈다. 임무는 첫째 분대를 맡은 경비조장 배동철을 통해 내려온다.

    이야기는 어느 새벽, 102동 옥상 망루에서 시작한다.
# 능력은 정하지 않는다: 시나리오의 능력 배열을 섞어 준다
# 스킬은 시나리오가 아니라 과거 배경에서 온다 (12-84)
# 다짐 (12-164): 이 시나리오 주인공의 큰 줄기
resolve: { kind: rise, target: "squad_leader", text: 정찰대 분대장이 된다 }
start_skills: {}
start_inventory: [baseball_bat, kitchen_knife, water_bottle, binoculars]
start_location: b_base
