# 하얀매의 수비대원 (12-84, 예전 수습 의무병). 정문과 약을 지키고 바깥에 약을 구하러 나가며, 손이 모자라 진료소 일도 거든다
id: role_d_medic
label: 하얀매 수비대원
faction: faction_d
rank: grunt
occupation: scavenger
default_name: 수비대원
opening_scene: 새벽, 하얀매의 진료소. 소독약 냄새가 밴 수비대 숙소에서 눈을 뜨자 복도 끝에서 수간호사의 목소리가 들린다. "문진 줄 벌써 정문까지 섰다. 손 씻고 나와." 창밖으로 담 너머에 늘어선 사람들의 입김이 보인다.
scenario:
  title: 흰 깃발
  order: 5
  unlock: { text: "어느 시나리오에서든 하얀매의 진료소에 들어간다", when: [{ enter: d_clinic }] }
  pitch: >-
    전쟁 중인 무리들 사이에서 약을 가진 작은 무리, 하얀매. 나는 정문과 약 창고를 지키고, 손이 모자라면 진료소에서 붕대를 감는다.
    날마다 문 앞에는 어느 무리 사람이든 줄을 서고, 약은 모두에게 돌아가지 않는다. 누구를 먼저 살릴지, 물린 사람을 어떻게 할지, 그리고 중립이 언제까지 버틸지.
  gm: >-
    생명의 값을 매기는 이야기다. 약은 늘 모자라고, 중립은 모두가 원하는 것을 가졌기에 위태롭다.
    환자의 소속을 묻지 않는 진료소에 전쟁이 걸어 들어오게 한다. 판정은 냉정하게, 사람들의 고마움과 원망은 따뜻하고 날카롭게.
  intro: |-
    가을이 깊어 간다. 당신은 하얀매의 수비대원이다. 하얀매는 옛 보건소 건물을 진료소로 삼은 서른 명 남짓의 작은 무리로, 약과 의술을 거래 조건으로 써서 전쟁 중인 무리들 사이에서 중립을 지켜 왔다.

    진료소는 소속을 가리지 않고 다친 사람을 받지만, 약은 값을 받고 내준다. 물리거나 긁힌 사람은 누구든 격리실에서 사흘을 보낸다.

    수비대는 대표 서은영 직속으로 정문과 약 창고를 지키고 바깥에 약을 구하러 나가지만, 사람이 모자라 수비대원도 진료소 일을 거든다. 당신은 요즘 수간호사 권정숙 밑에서 진료소 일을 배우고, 일감도 그를 통해 내려온다. 요즘 붉은연합 사람들이 정문을 자주 기웃거리고, 옛 시립병원 지하 약제실에 아직 약이 남았다는 말이 돈다.

    이야기는 어느 아침, 진료소의 수비대 숙소에서 시작한다.
age: 20
