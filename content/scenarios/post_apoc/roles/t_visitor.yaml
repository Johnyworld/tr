# 튜토리얼: 방문자 (기획서 12.4.1). 시나리오 목록의 맨 위, 처음부터 고를 수 있다.
# 무리 없이 혼자 가족을 찾아 가람시에 들어온 사람. 세계를 한꺼번에 배우지 않고, 보고 듣는 만큼 하나씩 알게 된다.
# 가족(코드가 만든다)은 버들마을에 살아 있다. 청솔형제단 사람들은 이름을 모르고, 버들마을 사람들은 안다.
# 흐름 (storylets/tutorial_visitor.yaml): 청솔 정문 → 형제단의 첫날 → 버들마을 사람의 소식(단서) → 버들마을에서 수소문 → 재회
# 클리어: 가족이 주인공 앞에 나타난다 (재회 이야기가 데려온다). 엔딩 뒤 계속하면 주인공이 죽을 때까지 이어진다
id: role_t_visitor
label: 방문자
faction: ""
rank: loner
default_name: 방문자
opening_scene: 해 질 녘, 무너진 고가도로 위. 녹슨 차들 사이로 바람이 분다. 난간 너머 멀리, 운동장을 철판 담으로 두른 학교가 보인다. 담 위 망루에 불빛 하나가 켜진다. 저 안에 사람이 산다.
scenario:
  title: "튜토리얼: 방문자"
  order: 0
  # 주인공이 죽으면 이 판은 끝난다 (다른 사람으로 이어 가면 가족을 찾는 이야기가 어색해진다)
  heirs: false
  pitch: >-
    이 모든 일이 시작되고 나서 2년이 지났다. 인간은 패배했다. 나는 가족을 찾으며 혼자 생존해 나가고 있었다.
    가람시에 생존자들의 도시가 있다는 이야기를 우연히 들었고, 가족을 찾으러 떠난다.
  intro: |-
    이 모든 일이 시작되고 나서 2년이 지났다. 감염은 걷잡을 수 없이 퍼졌다. 전 세계 사람의 99%가 죽거나 감염체가 되었다. 한국도 마찬가지였다. 감염체와의 전쟁으로 대부분의 도시는 파괴되었다. 인간은 패배했다.

    2년 동안 극소수의 생존자들은 각자의 생존을 위해 발버둥 쳤다. 처음에는 서로 도우며 살아갈 길을 찾았지만, 물자가 모자라면서 사람들은 이기적으로 변해 갔다. 감염체로부터, 그리고 다른 사람으로부터 도망쳐야 했다.

    가족을 못 본 지도 2년이 되었다. 나는 도시를 혼자 숨어 다니며 가족을 애타게 찾았지만 찾을 수 없었다.

    "가람시의 청솔공업고등학교에 호의적인 생존자들이 있습니다."

    감염체에게 쫓기던 어느 젊은 남자에게서 들은 말이다. 나는 그를 도와 감염체를 죽였지만, 그는 끝내 살아남지 못했다.

    나는 지금 고가도로 위에서 저 멀리 청솔공업고등학교를 내려다보고 있다. 저들이 정말 호의적인지는 알 수 없다. 하지만 저기 가족이 있을지도 모른다.
  goal:
    text: 가족을 찾는다
    when: [{ reunite: family }]
    ending: >-
      2년 만에 가족과 다시 만나는 장면을 이번 장면의 끝으로 삼는다. 서두르지 말고, 먼저 알아보는 순간(목소리, 걸음걸이, 이름을 부르는 소리)부터 쓴다.
      가족이 그동안 어떻게 살아남았는지는 가족의 입으로 짧게, 주인공이 어떻게 여기까지 왔는지는 주인공이 이번 판에서 실제로 겪은 일로 돌아본다. 감동적으로, 그러나 과장하지 않게.
  gm: >-
    튜토리얼이다. 플레이어는 이 세계를 처음 본다. 세계 설정을 한꺼번에 풀지 않는다: 주인공이 보고 듣는 만큼, 장면마다 하나씩
    (감염체는 소리와 빛을 쫓는다, 무리들이 있다, 배급과 임무, 겨울 걱정, 통조림과 탄약이 돈이다 같은 것).
    처음 몇 장면에서는 게임하는 법도 장면 밖의 짧은 한마디로 한 번씩 알려 준다: 하고 싶은 것을 말하면 판정한다(10 이상 성공, 7~9 대가 있는 성공, 6 이하 실패),
    ?로 시작하면 상태·인물·지도 같은 정보를 본다(시간이 흐르지 않는다), 위험한 일은 정말 위험하다.
    학교(청솔형제단 거점, a_base)로 걸어 내려가면 take_action.move_to: a_base로 옮긴다 (서술만 하고 구역을 안 옮기면 정문 이야기가 열리지 않고 화면·?지도가 고가도로에 머문다). 거점에 닿으면 정문에서 막고 몸을 뒤진 뒤 몇 가지를 묻는다 (이야기가 연다). 형제단에 해가 될 것 같으면 받아 주지 않을 수도 있다.
    받아 주면 교실을 고친 공용 숙소를 내주고 생활 규칙을 알려 준 뒤, 일주일은 적응 삼아 자유롭게 지내라고 한다.
    가족: 주인공은 가족이 어디 있는지 모른다. 가족의 행방은 이야기(소식, 수소문)로만 드러난다. GM이 먼저 말하거나 짐작하게 하지 않고,
    이야기가 데려오기 전에는 가족을 장면에 들이지 않는다 (npc_presence로 부르지 않는다). 가족을 만나는 장면은 이 시나리오의 끝이다.
age: 25
start_skills: {}
start_inventory: [pipe_spear, leather_jacket, blanket, water_bottle, dry_ration, dry_ration]
start_location: overpass
access: []
known_npcs: []
missions: []
# 찾는 가족: 코드가 주인공 나이에 맞춰 두세 사람을 만들어 버들마을에 둔다
family: { zone: b_base, count: [2, 3] }
background:
  - 2년 전 그 여름, 열병이 돈다는 뉴스가 나오고 한 달 만에 가족과 흩어졌다. 그 뒤로 혼자 숨어 다니며 가족을 찾았다.
  - 감염체에게 쫓기던 젊은 남자를 도왔지만 그는 살아남지 못했다. 죽기 전에 청솔공업고등학교의 생존자들 이야기를 했다.
# tutorial_visitor: 이 시나리오의 이야기. world: 도시의 일 (떠돌이의 이야기도 여기서 열린다)
storylet_tags: [tutorial_visitor, world]
