# 포스트아포칼립스 시나리오 팩 (기획서 12.3)
# 게임 시스템이 쓰는 장르 요소의 이름과 목록. 규칙(2d6, 시간, 정보 필터 등)은 core에 있다
id: post_apoc
name: 포스트아포칼립스
# 새 게임의 월드 고르기에 보이는 것
world:
  title: 무너진 도시, 가람
  tagline: 열병이 휩쓸고 간 지 몇 해. 강을 낀 가상의 한국 도시 가람시에서, 살아남은 무리들이 다가오는 겨울을 두고 다툰다.
  description: >-
    감염체는 소리와 빛을 쫓고, 사람들은 담 안에 모여 무리를 이뤘다. 통조림과 탄약이 돈이 된 도시에서 다섯 무리가 물과 연료와 땅을 두고 부딪친다.
    판정은 냉정하고 죽음은 갑작스럽다. 하지만 한 사람이 죽어도 이야기는 끝나지 않는다. 같은 세계에서 다음 사람이 그 뒤를 잇는다.

# 자원 (세력 전쟁·배급에서 쓴다)
resources:
  - { id: food, label: 식량 }
  - { id: water, label: 물 }
  - { id: ammo, label: 탄약 }
  - { id: medicine, label: 의약품 }
  - { id: fuel, label: 연료 }

# 능력 (기획서 4.6): 타고난 것. 계급·역할과 관계없고 바뀌지 않는다
stats:
  - { id: strength, label: 근력, description: "힘, 완력" }
  - { id: agility, label: 민첩, description: "손발의 빠르기, 정확함" }
  - { id: vitality, label: 체력, description: "버티는 몸, 지구력. 병에 덜 걸리고 잘 낫는다" }
  - { id: senses, label: 감각, description: "보고 듣고 알아차림" }
  - { id: nerve, label: 냉정, description: "압박 속의 침착함" }
  - { id: charm, label: 매력, description: "사람을 끄는 힘. 첫인상과 호감에도 작용한다" }
  - { id: intellect, label: 지능, description: "배우고 기억하고 따지는 머리" }

# 스킬 (기획서 4.6): 배우는 것. stats는 쓸 수 있는 능력(GM이 상황에 맞게 하나를 고른다), default는 배우지 않았을 때
# -1 할 줄 모름 / 0 아마추어 / +1 숙련 / +2 마스터
moves:
  - { id: fight, label: 근접전, category: 전투, stats: [strength, agility], description: "칼·몽둥이·맨손" }
  - { id: shoot, label: 사격, category: 전투, stats: [agility, senses], default: -1, description: "총, 활" }
  - { id: stealth, label: 은밀, category: 몸, stats: [agility], description: "들키지 않고 움직이기" }
  - { id: endure, label: 버티기, category: 몸, stats: [vitality, nerve], description: "고통·공포·추위 속에서 행동" }
  - { id: sense_danger, label: 경계, category: 감각, stats: [senses], description: "낌새, 숨은 목격자·함정 알아차리기" }
  - { id: scavenge, label: 수색, category: 감각, stats: [senses, intellect], description: "물자와 단서 찾기" }
  - { id: persuade, label: 교섭, category: 사람, stats: [charm], description: "설득, 흥정" }
  - { id: deceive, label: 거짓말, category: 사람, stats: [charm, nerve], description: "속이기" }
  - { id: intimidate, label: 위협, category: 사람, stats: [strength, nerve], description: "겁주기, 압박" }
  - { id: survival, label: 생존, category: 생존, stats: [vitality, senses], description: "추적, 야외에서 버티기, 불 피우기, 먹을 것·물 구하기" }
  - { id: first_aid, label: 응급처치, category: 생존, stats: [intellect, senses], default: -1, description: "상처 돌보기" }
  - { id: infected_lore, label: 감염체, category: 지식, stats: [intellect], default: -1, description: "감염체의 습성·약점·감염 징후" }
  - { id: history, label: 역사, category: 지식, stats: [intellect], default: -1, description: "붕괴 전후의 일, 지역과 무리들의 내력" }
  - { id: mechanics, label: 차량정비, category: 지식, stats: [intellect, agility], default: -1, description: "차량·발전기·기계 고치기" }
  - { id: carpentry, label: 목공, category: 지식, stats: [strength, intellect], default: -1, description: "바리케이드, 덫, 수리" }
  - { id: tactics, label: 전략, category: 지식, stats: [intellect, nerve], default: -1, description: "전투·전쟁 수행, 지휘" }

# 능력·스킬 범위. 능력 + 스킬은 최대 +4 (2d6에서 +5부터는 실패가 사라진다)
ranges:
  ability: { min: -1, max: 2 }
  skill: { min: -1, max: 2 }
  cap: 4
# 역할에 능력이 없고 플레이어가 고르지도 않았을 때(이어 가는 새 신병 등): 이 배열을 코드가 무작위로 섞어 준다
ability_array: [2, 1, 1, 0, 0, 0, -1]
# 캐릭터 생성 (*임시*): 능력은 모두 0에서 시작해 4포인트를 나눠 쓴다. +1은 1, +2는 3, -1로 낮추면 1을 돌려받는다 (최대 2개)
# 4포인트면 위 배열(+2 +1 +1 0 0 0 -1)과 같은 무게다
creation:
  points: 4
  cost: { "-1": -1, "0": 0, "1": 1, "2": 3 }
  max_low: 2
  genders:
    - { id: male, label: 남성 }
    - { id: female, label: 여성 }
  # 트레잇 고르기: 긍정 비용 합 ≤ 부정 보상 합. 종류별 최대
  traits: { max_positive: 3, max_negative: 3, max_personality: 2 }
  # 대화로 만들 때(MCP) GM이 단계마다 장면처럼 묻도록 주는 힌트
  narration:
    name: "시작 장면 속 누군가가 이름을 묻는다 (명부나 장부를 든 사람, 문을 지키는 사람, 깨진 거울 조각에 비친 얼굴 등 그 시나리오에 맞게)"
    gender: "명부의 다음 칸. 담담하게 묻는다"
    abilities: "이 세상을 몇 해 버텨 온 몸과 머리. 무엇이 남달랐는지 떠올리게 한다"
    ability: "그 능력이 살아남는 데 어떻게 드러났는지 짧은 장면 하나로 비추고 묻는다 (예: 근력이면 모래주머니를 나르던 날)"
    traits: "타고난 기질과 버릇. 무리 사람들이 당신을 뭐라고 수군거리는지로 풀어 간다"
# 역할 권한(roles의 access)의 이름. ration(배급)·mission_board(임무)는 core가 쓰고, 나머지는 GM이 보는 특권
access_labels:
  ration: 배급
  mission_board: 임무 게시판
  treatment_room: 치료실 출입 (치료 도구와 약제실 앞까지)

# 무리의 규율 단계 (기획서 9.9). 무리마다 factions의 culture.discipline으로 고른다 (*임시* 수치)
# abandon/expire_merit: 임무를 버리거나 놓쳤을 때의 공적, counts_disobedience: 불복종으로 치는지,
# max_disobedience: 진급에 허용되는 불복종 수, deed_severity: 불복종 행적의 무게(0이면 남기지 않는다)
discipline:
  strict: { label: 군율, abandon_merit: -3, expire_merit: -3, counts_disobedience: true, max_disobedience: 0, deed_severity: 3, order_word: 명령 }
  orderly: { label: 질서, abandon_merit: -2, expire_merit: -2, counts_disobedience: true, max_disobedience: 1, deed_severity: 2, order_word: 명령 }
  loose: { label: 느슨함, abandon_merit: -1, expire_merit: -1, counts_disobedience: false, max_disobedience: 3, deed_severity: 1, order_word: 당번 }
  free: { label: 자유, abandon_merit: 0, expire_merit: -1, counts_disobedience: false, max_disobedience: 99, deed_severity: 0, order_word: 일감 }

# 판마다 다른 인물 사이의 관계 (기획서 7.10): 세계를 만들 때 이름 있는 인물들을 이만큼 무작위로 잇는다. 무리가 다르면 숨은 관계
dynamic_ties: { count: 5, kinds: [sibling, parent, child, spouse, friend, rival] }

# 지휘 (기획서 9.11): 분대 명령의 일과 지도부 회의의 방침 (*임시* 수치)
# 규칙(따르는지, 결과 판정, 전쟁 틱 반영)은 core에 있다. 여기는 이름과 숫자만
command:
  # 주인공의 전략 스킬이 1 이상이면 분대원의 일 판정에 +1
  lead_skill: tactics
  squad_tasks:
    - id: guard
      label: 창고·초소 보초
      kind: work
      hours: 6
      move: sense_danger
      stat: senses
      rewards: { merit: 1 }
      report:
        success: "{member}: 보초 이상 없음. 밤새 한 번도 졸지 않았다"
        partial: "{member}: 보초는 섰는데, 새벽에 잠깐 깜빡했다고 털어놓는다"
        miss: "{member}: 보초 중에 창고 쪽문이 열려 있었다. 뭐가 없어졌는지는 아직 모른다"
    - id: search
      label: 물자 수색
      kind: work
      hours: 5
      move: scavenge
      stat: senses
      needs_zone: true
      dangerous: true
      rewards: { loot: true }
      report:
        success: "{member}: {zone}에서 쓸 만한 걸 찾아 돌아왔다"
        partial: "{member}: {zone}을(를) 훑었지만 건진 게 많지 않다"
        miss: "{member}: {zone}에서 감염체에 쫓겨 빈손으로 돌아왔다"
    - id: scout
      label: 정찰
      kind: work
      hours: 6
      move: stealth
      stat: agility
      needs_zone: true
      dangerous: true
      rewards: { merit: 1 }
      report:
        success: "{member}: {zone}을(를) 들키지 않고 돌아봤다. 본 것을 차례로 보고한다"
        partial: "{member}: {zone} 가장자리까지만 갔다. 더 들어가면 들킬 것 같았다고 한다"
        miss: "{member}: {zone}에서 들켰다. 총소리를 뒤로 하고 겨우 빠져나왔다"
    - id: escort
      label: 물자 호위
      kind: work
      hours: 8
      move: shoot
      stat: senses
      needs_zone: true
      dangerous: true
      rewards: { resources: { food: 6, water: 6 }, merit: 1 }
      report:
        success: "{member}: {zone}에서 물자를 무사히 들여왔다"
        partial: "{member}: {zone}에서 물자를 들여왔지만 절반은 버리고 왔다"
        miss: "{member}: {zone}에서 습격을 받아 짐을 다 잃었다"
    - id: forage
      label: 먹을 것 구하기
      kind: work
      hours: 6
      move: survival
      stat: senses
      needs_zone: true
      rewards: { resources: { food: 4 } }
      report:
        success: "{member}: {zone}에서 먹을 것을 넉넉히 구해 왔다"
        partial: "{member}: {zone}에서 조금 구해 왔다"
        miss: "{member}: {zone}을(를) 종일 헤맸지만 빈손이다"
    - id: rest
      label: 쉬게 하기
      kind: rest
      hours: 8
      report:
        success: "{member}: 한숨 자고 나니 낫다고 한다"
        partial: "{member}: 쉬었다"
        miss: "{member}: 쉬었다"
    - id: follow
      label: 곁에 두기
      kind: follow
      report:
        success: "{member}: 곁에 있다"
        partial: "{member}: 곁에 있다"
        miss: "{member}: 곁에 있다"
  # 분대원이 곁에 있으면 (follow) 싸움에서 받는 보정
  follow_bonus: { fight: 1, shoot: 1 }
  council_ranks: [officer]
  council_moves: [persuade, tactics]
  policies:
    - id: ration
      label: 배급
      default: normal
      options:
        - id: cut
          label: 줄이기
          summary: 창고가 오래가지만 모두 한 단계 덜 받고, 사기가 가라앉는다
          upkeep: { food: 0.8 }
          ration_shift: 1
          morale: { delta: -1, chance: 0.15 }
          opposed_by: [a_jeonghun]
        - id: normal
          label: 보통
          summary: 창고 사정대로 나눈다
        - id: extra
          label: 늘리기
          summary: 모두 한 단계 더 받고 사기가 오르지만, 창고가 빨리 빈다
          upkeep: { food: 1.25 }
          ration_shift: -1
          morale: { delta: 1, chance: 0.15 }
          opposed_by: [a_doyun]
    - id: stance
      label: 태세
      default: normal
      options:
        - id: defend
          label: 지키기
          summary: 먼저 치러 나가는 일이 줄고, 습격을 받으면 더 많은 사람이 지킨다
          aggression: 0.5
          defense: 1.5
          opposed_by: [a_jeonghun]
        - id: normal
          label: 보통
          summary: 하던 대로
        - id: attack
          label: 밀어붙이기
          summary: 먼저 치러 나가는 일이 늘고, 그만큼 집을 지키는 사람이 준다
          aggression: 1.6
          defense: 0.75
          opposed_by: [a_doyun]

    - id: trade
      label: 교역
      default: none
      options:
        - id: none
          label: 하지 않기
          summary: 창고의 것은 창고에 둔다
        - id: food_for_ammo
          label: 식량을 주고 탄약
          summary: 날마다 나루상단에 식량을 넘기고 탄약을 받는다. 서로 등을 돌리면 끊긴다
          trade: { partner: faction_e, give: { food: 10 }, get: { ammo: 5 } }
          opposed_by: [a_doyun]
        - id: water_for_medicine
          label: 물을 주고 의약품
          summary: 날마다 하얀매 진료소에 물을 넘기고 의약품을 조금 받는다
          trade: { partner: faction_d, give: { water: 8 }, get: { medicine: 2 } }
        - id: fuel_for_food
          label: 연료를 주고 식량
          summary: 날마다 나루상단에 연료를 넘기고 식량을 받는다. 겨울에는 추위가 걱정이다
          trade: { partner: faction_e, give: { fuel: 4 }, get: { food: 8 } }
          opposed_by: [a_jeonghun]

# 자유 시나리오 (기획서 12.5): 플레이어가 쓴 시작을 이 범위 안의 부품으로 옮긴다
custom_start:
  # 세력에 속할 때 고를 수 있는 계급. 지도부(leader)는 무리마다 한 자리뿐이라 뺀다. 참모·간부급은 officer
  ranks: [grunt, staff, squad_leader, officer]
  # 무소속으로 시작할 때의 계급과 장소 (누구의 땅도 아닌 곳)
  free_rank: loner
  free_locations: [old_town, riverside, hospital_ruins]
  # 시작 훈련 (하급 전투원의 근접전 +1, 사격 +1과 같은 무게)
  skill_points: 2
  skill_max: 1
  age: { min: 16, max: 65 }
  # 무소속으로 시작할 때 고를 수 있는 연고 (extras/kin.yaml, 기획서 7.9)
  kin: [kin_young, kin_elder, kin_sibling, kin_partner, stray_dog]
  kits:
    - { id: fighter, label: 싸울 채비, description: 몸으로 부딪치는 사람, items: [crowbar, water_bottle, dry_ration] }
    - { id: scout, label: 정찰 채비, description: 먼저 보고 먼저 피하는 사람, items: [binoculars, kitchen_knife, water_bottle, dry_ration] }
    - { id: medic, label: 의무 채비, description: 다친 사람을 돌보는 사람, items: [medkit, fever_reducer, water_bottle, dry_ration] }
    - { id: trader, label: 거래 채비, description: 말과 물건으로 사는 사람, items: [cigarettes, canned_food, water_bottle] }
    - { id: clerk, label: 장부 채비, description: 숫자와 소식을 다루는 사람, items: [ledger, radio, water_bottle, canned_food] }
    - { id: wanderer, label: 떠돌이 채비, description: 담 밖에서 버텨 온 사람, items: [blanket, kitchen_knife, dry_ration] }

# 이전 세이브의 옛 능력 id
renamed:
  abilities: { persuasion: charm }
# 경험치와 레벨업 (*임시*): 레벨 1에 10, 그다음 15, 20… 레벨업마다 스킬 하나 +1
growth:
  first: 10
  step: 5
  xp: { success: 1, partial: 1, miss: 2, merit: 2 }
  daily_check_cap: 6
# 트레잇 (기획서 4.6, *임시*): 타고난 기질·체질·외모. 플레이어와 NPC가 같이 쓴다
# kind: positive(cost만큼 쓴다) / negative(cost만큼 얻는다) / personality(0, 연기 위주)
# visible: 처음 보는 사람에게도 보이는지. acting: GM 연기 지침
traits:
  # ── 긍정 ──
  - { id: quick_learner, label: 빨리 배움, kind: positive, cost: 2, description: 경험치 1.5배, opposites: [slow_learner], effects: { xp: 1.5 } }
  - { id: fast_healer, label: 빨리 낫는 체질, kind: positive, cost: 2, description: 저절로 낫는 데 하루 덜 걸린다, opposites: [slow_healer], effects: { recovery_days: -1 } }
  - { id: iron_gut, label: 튼튼한 위장, kind: positive, cost: 1, description: 병에 덜 걸린다 (질병 확률 절반), opposites: [frail], effects: { disease: 0.5 } }
  - { id: cold_hardy, label: 추위에 강함, kind: positive, cost: 1, description: 추운 날 덜 춥다, opposites: [cold_sensitive], effects: { cold: -1 } }
  - { id: light_eater, label: 소식가, kind: positive, cost: 1, description: 배급이 모자랄 때 덜 배고프다, opposites: [big_eater], effects: { hunger: -1 } }
  - { id: eagle_eye, label: 매의 눈, kind: positive, cost: 1, description: 경계 +1, opposites: [dull_senses], effects: { skills: { sense_danger: 1 } } }
  - { id: marksman, label: 사격 감각, kind: positive, cost: 1, description: 사격 +1, effects: { skills: { shoot: 1 } } }
  - { id: shadow, label: 그림자, kind: positive, cost: 1, description: 하는 일이 잘 들키지 않는다, opposites: [conspicuous], effects: { noticed: 0.7 } }
  - { id: silver_tongue, label: 말재간, kind: positive, cost: 1, description: 거짓말 +1, opposites: [bad_liar], effects: { skills: { deceive: 1 } } }
  - { id: steel_nerves, label: 강심장, kind: positive, cost: 2, description: 버티기 +1, acting: 위험 앞에서도 목소리가 흔들리지 않는다, opposites: [coward], effects: { skills: { endure: 1 } } }
  - { id: beautiful, label: 아름다운 외모, kind: positive, cost: 2, visible: true, description: "첫인상이 좋다 (외모 +2). 이성에게 끌리는 사람은 더 끌리고, 같은 성별은 질투할 수 있다", opposites: [attractive, ugly], effects: { looks: 2 } }
  - { id: attractive, label: 호감형 외모, kind: positive, cost: 1, visible: true, description: 첫인상이 좋다 (외모 +1), opposites: [beautiful, ugly], effects: { looks: 1 } }
  # ── 부정 ──
  - { id: slow_learner, label: 느린 학습, kind: negative, cost: 2, description: 경험치 0.75배, opposites: [quick_learner], effects: { xp: 0.75 } }
  - { id: slow_healer, label: 더디게 낫는 체질, kind: negative, cost: 1, description: 저절로 낫는 데 하루 더 걸린다, opposites: [fast_healer], effects: { recovery_days: 1 } }
  - { id: frail, label: 허약 체질, kind: negative, cost: 2, description: "병에 잘 걸린다 (질병 2배, 감염 1.3배)", opposites: [iron_gut], effects: { disease: 2, infection: 1.3 } }
  - { id: cold_sensitive, label: 추위를 탐, kind: negative, cost: 1, description: 추운 날 더 춥다, opposites: [cold_hardy], effects: { cold: 1 } }
  - { id: big_eater, label: 대식가, kind: negative, cost: 1, description: 정량이 아니면 더 배고프다, opposites: [light_eater], effects: { hunger: 1 } }
  - { id: dull_senses, label: 둔한 감각, kind: negative, cost: 1, description: 경계 -1, opposites: [eagle_eye], effects: { skills: { sense_danger: -1 } } }
  - { id: conspicuous, label: 눈에 띄는 사람, kind: negative, cost: 1, visible: true, description: 하는 일이 잘 들킨다, opposites: [shadow], effects: { noticed: 1.3 } }
  - { id: bad_liar, label: 서툰 거짓말, kind: negative, cost: 1, description: 거짓말 -1, acting: 거짓말을 하면 눈을 피하고 말이 꼬인다, opposites: [silver_tongue], effects: { skills: { deceive: -1 } } }
  - { id: coward, label: 겁쟁이, kind: negative, cost: 2, description: 버티기 -1, acting: 위험 앞에서 망설이고 먼저 몸을 뺀다, opposites: [steel_nerves], effects: { skills: { endure: -1 } } }
  - { id: ugly, label: 험악한 인상, kind: negative, cost: 1, visible: true, description: 첫인상이 나쁘다 (외모 -1), acting: 사람들이 첫눈에 경계한다, opposites: [beautiful, attractive], effects: { looks: -1 } }
  # ── 성격 (0) ──
  - { id: warm, label: 다정함, kind: personality, visible: true, description: 남을 살뜰히 챙긴다, acting: 말끝이 부드럽고 먼저 안부를 묻는다 }
  - { id: guarded, label: 경계심, kind: personality, visible: true, description: 쉽게 마음을 열지 않는다, acting: 대답을 아끼고 상대를 살핀다 }
  - { id: principled, label: 원칙주의, kind: personality, visible: true, description: 정한 원칙을 굽히지 않는다, acting: 규칙과 약속을 앞세워 말한다 }
  - { id: cynical, label: 냉소적, kind: personality, visible: true, description: 무엇이든 비꼬아 본다, acting: 희망적인 말에 코웃음 친다 }
  - { id: hot_tempered, label: 다혈질, kind: personality, visible: true, description: 화가 빨리 난다, acting: 쉽게 언성을 높이고 금방 식는다 }
  - { id: calculating, label: 계산적, kind: personality, visible: false, description: 손익부터 따진다, acting: 대가와 이득을 먼저 묻는다 }
  - { id: cautious, label: 신중함, kind: personality, visible: true, description: 서두르지 않는다, acting: 한 번 더 확인하고 움직인다 }
  - { id: blunt, label: 무뚝뚝, kind: personality, visible: true, description: 말이 짧고 퉁명스럽다, acting: 필요한 말만 짧게 한다 }
  - { id: greedy, label: 탐욕, kind: personality, visible: false, description: 가진 것을 더 가지려 한다, acting: 값을 깎고 더 얻을 것을 노린다 }
  - { id: curious, label: 호기심, kind: personality, visible: true, description: 모르는 것을 못 참는다, acting: 질문이 많다 }
  - { id: patient, label: 인내심, kind: personality, visible: false, description: 오래 기다릴 줄 안다, acting: 서두르지 않고 상대가 지치기를 기다린다 }
  - { id: ruthless, label: 잔혹함, kind: personality, visible: false, description: 남의 고통에 무감하다, acting: 협박을 담담하게 한다 }
  - { id: lazy, label: 게으름, kind: personality, visible: true, description: 할 수 있으면 빠진다, acting: 일을 미루고 핑계를 댄다 }
  - { id: protective, label: 보호 본능, kind: personality, visible: true, description: 약한 사람을 지키려 한다, acting: 다친 사람 앞에서 먼저 나선다 }
  - { id: cold, label: 냉정함, kind: personality, visible: true, description: 감정을 드러내지 않는다, acting: 표정 없이 사실만 말한다 }
  - { id: meticulous, label: 꼼꼼함, kind: personality, visible: true, description: 세세한 것까지 따진다, acting: 숫자와 기록을 들먹인다 }
  - { id: formal, label: 격식, kind: personality, visible: true, description: 예의와 절차를 따진다, acting: 존대와 직함을 깍듯이 쓴다 }
  - { id: genial, label: 넉살, kind: personality, visible: true, description: 누구에게나 웃으며 다가간다, acting: 농담으로 분위기를 푼다 }
  - { id: timid, label: 소심함, kind: personality, visible: true, description: 눈치를 많이 본다, acting: 말을 더듬고 눈을 피한다 }
  - { id: eager, label: 열성적, kind: personality, visible: true, description: 뭐든 해 보겠다고 나선다, acting: 먼저 손을 들고 들떠 있다 }
  - { id: weary, label: 지침, kind: personality, visible: true, description: 오래 버텨 지쳐 있다, acting: 한숨이 잦고 말이 느리다 }
  - { id: motherly, label: 어머니 같음, kind: personality, visible: true, description: 잔소리와 챙김이 함께 온다, acting: 밥은 먹었냐고 묻고 잔소리를 한다 }
  - { id: talkative, label: 수다쟁이, kind: personality, visible: true, description: 들은 이야기를 잘 옮긴다 (소문 2배), acting: 묻지 않은 소식까지 늘어놓는다, effects: { rumor: 2 } }
  - { id: flirt, label: 이성편력, kind: personality, visible: false, description: 이성에게 쉽게 끌리고 이성의 설득·거짓말에 약하다, acting: 이성 앞에서 말이 많아지고 허세를 부린다, effects: { attraction: { moves: [persuade, deceive] } } }

# 상대를 쓰러뜨리기 (기획서 7.5, *임시*): 부상이 중상 이상이면 무력화 (더 맞서지 못하고 뒤질 수 있다)
combat:
  incapacitated_at: serious

# 이름 재료 (기획서 7.5): 엑스트라가 이름을 얻을 때 성 + 이름을 고른다
names:
  surnames: [김, 이, 박, 최, 정, 강, 조, 윤, 장, 임, 한, 오, 서, 신, 권, 황, 안, 송, 유, 홍, 전, 고, 문, 손, 양, 배, 백, 허, 남, 노]
  given:
    male: [민수, 영호, 정훈, 상철, 성민, 지훈, 동욱, 재석, 태준, 현수, 병철, 승우, 기태, 준영, 광수, 대성, 우진, 형준, 진호, 석구, 명수, 철민, 경환, 도현]
    female: [미영, 지은, 수진, 은정, 혜린, 소영, 다은, 정희, 유진, 경숙, 나래, 하늘, 보람, 민지, 선영, 가윤, 예진, 순자, 영미, 지혜, 은비, 소희, 현정, 미숙]

# 매력의 수동 효과: 처음 만난 인물의 호감 + (매력 ÷ 2), 매력 +2면 호감이 오를 때 +1
charm: { ability: charm, first_impression_per: 2, bonus_at: 2 }

# 시스템이 특정 역할로 쓰는 행동 (목격자 살피기, 목격 확률 낮추기)
move_roles:
  notice: sense_danger
  stealth: stealth

# 상태 트랙. 앞에서 뒤로 악화된다. fatal 단계에 이르면 사망 (판정 보정은 임시값)
condition_tracks:
  - id: harm
    label: 부상
    levels:
      - { id: none, label: 무사, penalty: 0 }
      - { id: light, label: 경상, penalty: -1 }
      - { id: serious, label: 중상, penalty: -2 }
      - { id: critical, label: 치명상, penalty: -3 }
      - { id: dead, label: 사망, penalty: 0, fatal: true }
  # 허기 (12-1): 하루마다 배급 수준만큼 바뀐다. 기진에 이르면 굶주림으로 부상
  - id: hunger
    label: 허기
    levels:
      - { id: fed, label: 든든함, penalty: 0 }
      - { id: hungry, label: 허기짐, penalty: 0 }
      - { id: starving, label: 굶주림, penalty: -1 }
      - { id: famished, label: 기진함, penalty: -2 }
  # 감염 (12-1): 감염체에게 다치면 확률로 잠복기. 잠복기는 캐릭터가 모른다(hidden). 하루마다 나빠지고, 악화에 이르면 하루마다 부상
  - id: infection
    label: 감염
    levels:
      - { id: clean, label: 없음, penalty: 0 }
      - { id: incubating, label: 잠복, penalty: 0, hidden: true }
      - { id: fever, label: 발열, penalty: -1 }
      - { id: grave, label: 악화, penalty: -2 }
  # 추위 (12-4): 계절·날씨만큼 추워진다. 연료가 있는 우리 거점에서는 녹는다. 저체온이면 하루마다 부상
  - id: cold
    label: 추위
    levels:
      - { id: warm, label: 따뜻함, penalty: 0 }
      - { id: chilly, label: 쌀쌀함, penalty: 0 }
      - { id: cold, label: 추위, penalty: -1 }
      - { id: hypothermia, label: 저체온, penalty: -2 }
  # 질병 (12-4): 몸이 약해지면 걸린다. 잠복기는 캐릭터가 모른다. 위중하면 하루마다 부상
  - id: disease
    label: 질병
    levels:
      - { id: healthy, label: 없음, penalty: 0 }
      - { id: incubating, label: 잠복, penalty: 0, hidden: true }
      - { id: sick, label: 앓음, penalty: -1 }
      - { id: critical, label: 위중, penalty: -2 }
# apply_harm이 쓰는 트랙
harm_track: harm

# 소속 등급 사다리. level은 지휘 계통상의 높이 (화법 규칙에 쓴다)
# staff(지원 인력)와 leader(지도부)는 기획서 12.3 예시에 더해 쓰는 곳이 있어 둔다
rank_ladder:
  - { id: loner, label: 혼자, level: 0 }
  - { id: outsider, label: 외부 무리 일원, level: 0 }
  - { id: grunt, label: 하급 전투원, level: 1 }
  - { id: staff, label: 지원 인력, level: 1 }
  - { id: squad_leader, label: 분대장, level: 2 }
  - { id: officer, label: 간부, level: 3 }
  - { id: leader, label: 지도부, level: 4 }
# 진급 경로 (MVP: 하급 전투원 → 분대장)
promotion: { from: grunt, to: squad_leader }

speech_rules: speech/post_apoc.yaml
# GM 지침 (두 플레이 모드가 같은 파일을 읽는다, 기획서 11.6)
gm_tone: prompts/post_apoc_tone.md
gm_rules: prompts/gm_rules.md
mcp_guide: prompts/mcp_play.md
# 새 게임을 시작할 때 들려주는 세계와 지금 상황 (시작 캐릭터가 아는 것만)
intro: prompts/intro.md

# 부상 회복 (*임시*). 치료사에게 받거나, 새 부상 없이 며칠 지나면 조금씩 낫는다
recovery:
  natural_days: 2
  # 중상까지는 저절로 낫는다. 치명상은 치료가 필요하다
  natural_max_level: serious
  # 치료사에게 받으면 (하루 한 번) 트랙별로 낫는 단계
  healer: { harm: 1, infection: 1, disease: 1 }

# 쓰면 몸이 나아지는 물건 (take_action.use_item): 아이템 → 트랙 → 나아지는 단계 (*임시*)
consumables:
  medkit: { harm: 1 }
  antibiotics: { harm: 1, infection: 2 }
  canned_food: { hunger: 2 }
  dry_ration: { hunger: 1 }
  blanket: { cold: 2 }
  fever_reducer: { disease: 1 }

# 몸 상태 (12-1, *임시*)
body:
  hunger: { track: hunger, starving_harm: 1 }
  infection:
    track: infection
    # 감염체에게 다쳤을 때 감염될 확률 (선언한 위험 크기별)
    chance: { light: 0.3, heavy: 0.6 }
    worst_harm: 1
  # 추위: 하루마다 계절·날씨의 추위만큼 (방한복은 들고 있으면 1 덜어 준다)
  cold:
    track: cold
    season: { winter: 1 }
    weather: { snow: 1, cold_snap: 2, rain: 1 }
    gear: { coat: 1 }
    # 우리 거점에서 무리의 연료가 하루치 이상 있으면 2단계 녹는다
    shelter: { resource: fuel, min_days: 1, warm: -2 }
    worst_harm: 1
  # 질병: 하루마다 확률. 굶주림·추위·무리의 물 부족마다 더하고, 체력 1당 25% 덜 걸린다
  disease:
    track: disease
    chance: { base: 0.01, starving: 0.05, cold: 0.05, thirst: 0.06 }
    thirst_resource: water
    resist: { ability: vitality, per_point: 0.25 }
    # 배부르고 따뜻하면 하루마다 낫는 확률 (체력 1당 +10%), 아니면 깊어지는 확률
    recover: { chance: 0.35, per_point: 0.1 }
    worsen: 0.3
    worst_harm: 1

# 날씨 (12-3, *임시*). 하루마다 계절별 무게로 고른다. visibility: 숨은 목격자 확률 배수 (작을수록 안 보인다)
weather:
  kinds:
    - { id: clear, label: 맑음, description: 멀리까지 보인다, visibility: 1 }
    - { id: overcast, label: 흐림, description: 하늘이 낮게 깔려 빛이 흐리다, visibility: 0.9 }
    - { id: rain, label: 비, description: 빗소리가 발소리를 덮고 길이 미끄럽다, visibility: 0.6 }
    - { id: fog, label: 안개, description: 몇 걸음 앞도 잘 보이지 않는다. 숨어 움직이기 좋다, visibility: 0.4 }
    - { id: snow, label: 눈, description: 소리는 묻히지만 발자국이 남는다, visibility: 1.1 }
    - { id: cold_snap, label: 한파, description: 바깥에 오래 있으면 손발이 얼어붙는다, visibility: 0.9 }
  by_season:
    winter: { clear: 3, overcast: 3, snow: 3, fog: 1, cold_snap: 2 }
    spring: { clear: 4, overcast: 3, rain: 3, fog: 2 }
    summer: { clear: 4, rain: 4, overcast: 2 }
    autumn: { clear: 5, overcast: 3, rain: 2, fog: 2 }
  default: { clear: 1 }

# 계절 (12-1, *임시*). 1일차는 늦가을. 겨울엔 연료를 많이 쓰고 먹을 것이 덜 난다
seasons:
  start: { season: autumn, day: 14 }
  list:
    - { id: winter, label: 겨울, days: 20, upkeep: { fuel: 2, water: 0.9 }, yields: { food: 0.6, water: 0.8 } }
    - { id: spring, label: 봄, days: 20, yields: { food: 0.9 } }
    - { id: summer, label: 여름, days: 20, upkeep: { water: 1.15 }, yields: { food: 1.1 } }
    - { id: autumn, label: 가을, days: 20, yields: { food: 1.3 } }

# 세력 단위 전쟁 (9단계, 기획서 9장). 규칙은 core, 여기는 수치와 문구 (*임시*)
war:
  # 1인당 하루 소모량
  upkeep: { food: 1, water: 1, fuel: 0.15 }
  # 모자라면 사기가 떨어지고 사람이 죽는 자원
  vital: [food, water]
  # 모자라면 사기만 떨어지는 자원 (겨울 추위)
  hardship: [fuel]
  ammo: ammo
  medicine: medicine
  ammo_per_clash: 15
  medicine_per_casualty: 2
  # 공격 성향 1당 하루에 공격에 나설 확률
  attack_chance_per_aggression: 0.12
  # 배급: 무리의 식량이 며칠 치 남았는지로
  ration:
    resource: food
    levels:
      # hunger: 이 배급을 받는 하루 동안 허기가 움직이는 단계 (음수면 나아진다), hunger_max: 이 배급으로는 여기까지만 배고파진다
      - { min_days: 10, label: 정량, hunger: -2 }
      - { min_days: 4, label: 줄어든 배급, hunger: 1, hunger_max: hungry }
      - { min_days: 1, label: 반쪽 배급, hunger: 1, hunger_max: starving }
      - { min_days: 0, label: 배급 끊김, hunger: 1 }
  # 사기 -3 ~ +3
  morale_labels: [무너지기 직전, 흉흉함, 가라앉음, 그럭저럭, 괜찮음, 들떠 있음, 기세등등]
  # 창고 사정 (며칠 치 남았는지)
  stock_labels:
    - { min_days: 20, label: 넉넉하다는 말 }
    - { min_days: 7, label: 빠듯하다는 말 }
    - { min_days: 1, label: 바닥이 보인다는 말 }
    - { min_days: 0, label: 다 떨어졌다는 말 }
  # 전황 소식. {attacker} {defender} {zone}, 사상자는 {attacker_loss} {defender_loss} (대략적인 말)
  news:
    raid_success: "{attacker:이/가} {zone}에서 {defender}의 물자를 털어 갔다고 한다. {defender} 쪽 사상자 {defender_loss}, {attacker} 쪽 {attacker_loss}"
    raid_failure: "{attacker:이/가} {zone}의 {defender} 물자를 노렸다가 쫓겨났다고 한다. {attacker} 쪽 사상자 {attacker_loss}"
    skirmish_success: "{zone} 근처에서 {attacker:과/와} {defender:이/가} 부딪쳤고, {defender} 쪽이 밀렸다고 한다. {defender} 쪽 사상자 {defender_loss}, {attacker} 쪽 {attacker_loss}"
    skirmish_failure: "{zone} 근처에서 {attacker:과/와} {defender:이/가} 부딪쳤고, {attacker} 쪽이 물러났다고 한다. {attacker} 쪽 사상자 {attacker_loss}, {defender} 쪽 {defender_loss}"
    assault_success: "{attacker:이/가} {zone:을/를} 공격해 {defender}에게서 빼앗았다고 한다. {defender} 쪽 사상자 {defender_loss}, {attacker} 쪽 {attacker_loss}"
    assault_failure: "{attacker:이/가} {zone:을/를} 공격했지만 {defender:이/가} 막아 냈다고 한다. {attacker} 쪽 사상자 {attacker_loss}, {defender} 쪽 {defender_loss}"
    occupy: "{attacker:이/가} 비어 있던 {zone}에 사람을 보내 자리를 잡았다고 한다"

# 전투 장면 (9-1, 기획서 9.5). 플레이어가 있는 교전을 라운드 단위로 푼다 (수치는 *임시*)
# 효과의 결과: momentum 전세(우리 편 기준), alarm 경보, advance 위치 전진, enemy_losses 적 사상자, destroy_objective 목표물 파괴
# min_harm: GM이 선언해야 하는 최소 몸의 위험. none이면 대가는 경보·전세로만 온다 (숨어들기는 들키는 것이 대가)
battle:
  round_minutes: 10
  max_rounds: 8
  momentum_to_win: 5
  max_alarm: 3
  positions:
    - { id: line, label: 전선 }
    - { id: flank, label: 측면 }
    - { id: rear, label: 적 후방 }
  objectives:
    - { id: leader, label: 지휘하는 자 }
    - { id: ammo_pile, label: 탄약 더미 }
    - { id: gun_nest, label: 기관총 자리 }
  preparations:
    - id: wire_trap
      label: 철사 덫
      description: 길목에 철사와 깡통을 엮어 걸려 넘어지게 하고 소리로 알린다
      requires_item: wire_roll
  effects:
    - id: hold
      label: 버티며 싸우기
      description: 전선에서 엄폐하며 맞서 싸운다
      min_harm: light
      positions: [line]
      outcomes:
        success: { momentum: 1, enemy_losses: 1 }
        partial: { momentum: 1 }
        miss: { momentum: -1 }
    - id: sneak
      label: 숨어들기
      description: 적 눈을 피해 측면으로, 다시 적의 뒤로 파고든다
      min_harm: none
      positions: [line, flank]
      max_alarm: 1
      outcomes:
        success: { advance: 1 }
        partial: { advance: 1, alarm: 1 }
        miss: { alarm: 2 }
    - id: silence
      label: 소리 없이 해치우기
      description: 경보가 울리기 전에 보초나 연락병을 먼저 쓰러뜨린다
      min_harm: light
      positions: [flank, rear]
      max_alarm: 2
      outcomes:
        success: { alarm: -1, enemy_losses: 1 }
        partial: { enemy_losses: 1 }
        miss: { alarm: 2 }
    - id: ambush
      label: 기습
      description: 측면이나 뒤에서 덮친다. 적이 아직 모르면 더 크게 흔든다
      min_harm: light
      positions: [flank, rear]
      surprise_bonus: 1
      outcomes:
        success: { momentum: 2, enemy_losses: 2, alarm: 3 }
        partial: { momentum: 1, enemy_losses: 1, alarm: 2 }
        miss: { momentum: -1, alarm: 3 }
    - id: demolish
      label: 폭약
      description: 적 뒤쪽의 목표물(지휘하는 자, 탄약 더미, 기관총 자리)에 폭약을 터뜨린다
      min_harm: heavy
      positions: [rear]
      requires_item: explosive
      consumes_item: true
      targets_objective: true
      outcomes:
        success: { momentum: 2, enemy_losses: 2, destroy_objective: true, alarm: 3 }
        partial: { momentum: 1, destroy_objective: true, alarm: 3 }
        miss: { alarm: 3 }
    - id: spring_trap
      label: 덫 발동
      description: 미리 깔아 둔 덫으로 몰려오는 적을 끊는다
      min_harm: none
      positions: [line]
      requires_preparation: wire_trap
      outcomes:
        success: { momentum: 2, enemy_losses: 2 }
        partial: { momentum: 1, enemy_losses: 1 }
        miss: {}
    - id: withdraw
      label: 물러나기
      description: 싸움에서 빠져 몸을 뺀다. 남은 싸움은 동료들이 치른다
      min_harm: light
      positions: [line, flank, rear]
      withdraw: true
      outcomes:
        success: {}
        partial: { momentum: -1 }
        miss: { momentum: -1 }

# 환경 위협: 빨리감기 중 끼어드는 이상 징후 (임시값). 조우 테이블이 생기면 바꾼다
threats:
  disturbance_chance_per_hour: { dawn: 0.05, morning: 0.03, day: 0.03, evening: 0.05, night: 0.08 }
  disturbance_details:
    - 멀리서 들리는 소리
    - 가까운 곳의 인기척
    - 어둠 속의 움직임
    - 낯선 냄새
    - 거점 쪽의 소란
