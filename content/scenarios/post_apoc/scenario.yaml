# 포스트아포칼립스 시나리오 팩 (기획서 12.3)
# 게임 시스템이 쓰는 장르 요소의 이름과 목록. 규칙(2d6, 시간, 정보 필터 등)은 core에 있다
id: post_apoc
name: 포스트아포칼립스
# 새 게임의 월드 고르기에 보이는 것
world:
  title: 무너진 도시 가람
  tagline: 가상의 한국 도시 가람시를 배경으로 한 포스트 아포칼립스
  description: >-
    열병이 휩쓸고 간 지 약 2년이 지났고, 사람들은 무리를 이뤄 각자의 방식으로 생존해 나가며 한정된 자원을 차지하기 위해 부딪친다.
  # 1일차의 날짜 (늦가을, seasons.start와 맞춘다). 상태 화면 머리에 보인다
  calendar_start: "2032-11-08"

# 자원 (세력 전쟁·배급에서 쓴다)
resources:
  - { id: food, label: 식량 }
  - { id: water, label: 물 }
  - { id: ammo, label: 탄약 }
  - { id: medicine, label: 의약품 }
  - { id: fuel, label: 연료 }

# 능력 (기획서 4.6): 타고난 것. 계급·역할과 관계없고 바뀌지 않는다
stats:
  - { id: strength, label: 근력, description: "힘, 완력" }
  - { id: agility, label: 민첩, description: "손발의 빠르기, 정확함" }
  - { id: vitality, label: 체력, description: "버티는 몸, 지구력. 병에 덜 걸리고 잘 낫는다" }
  - { id: senses, label: 감각, description: "보고 듣고 알아차림" }
  - { id: nerve, label: 냉정, description: "압박 속의 침착함" }
  - { id: charm, label: 매력, description: "사람을 끄는 힘. 첫인상과 호감에도 작용한다" }
  - { id: intellect, label: 지능, description: "배우고 기억하고 따지는 머리" }

# 스킬 (기획서 4.6): 배우는 것. stats는 쓸 수 있는 능력(GM이 상황에 맞게 하나를 고른다), default는 배우지 않았을 때
# -1 할 줄 모름 / 0 아마추어 / +1 숙련 / +2 마스터
moves:
  - { id: fight, label: 근접전, category: 전투, stats: [strength, agility], description: "칼·몽둥이·맨손으로 싸울 때. 높을수록 덜 다치고 더 세게 친다" }
  - { id: shoot, label: 사격, category: 전투, stats: [agility, senses], default: -1, description: "총이나 활을 쏠 때. 탄 한 발을 헛되이 쓰지 않는다" }
  - { id: stealth, label: 은밀, category: 몸, stats: [agility], description: "들키지 않고 움직이고 숨을 때. 몰래 들어가기, 따돌리기" }
  - { id: endure, label: 버티기, category: 몸, stats: [vitality, nerve], description: "고통·공포·추위 속에서 버틸 때. 다친 몸으로 계속 움직이기" }
  - { id: sense_danger, label: 경계, category: 감각, stats: [senses], description: "낌새를 알아챌 때. 매복·함정·숨은 목격자를 먼저 본다" }
  - { id: scavenge, label: 수색, category: 감각, stats: [senses, intellect], description: "폐허를 뒤질 때. 물자와 단서를 더 많이, 더 빨리 찾는다" }
  - { id: persuade, label: 교섭, category: 사람, stats: [charm], description: "말로 설득하고 흥정할 때. 값을 깎고 마음을 돌린다" }
  - { id: deceive, label: 거짓말, category: 사람, stats: [charm, nerve], description: "속일 때. 거짓말, 둘러대기, 신분 숨기기" }
  - { id: intimidate, label: 위협, category: 사람, stats: [strength, nerve], description: "겁주고 압박할 때. 싸우지 않고 물러서게 한다" }
  - { id: survival, label: 생존, category: 생존, stats: [vitality, senses], description: "밖에서 살아남을 때. 추적, 불 피우기, 먹을 것·물 구하기" }
  - { id: first_aid, label: 응급처치, category: 생존, stats: [intellect, senses], default: -1, description: "상처를 돌볼 때. 피를 멈추고 덧나지 않게 한다" }
  - { id: infected_lore, label: 감염체, category: 지식, stats: [intellect], default: -1, description: "감염체를 다룰 때. 습성·약점을 알고 감염 징후를 알아본다" }
  - { id: history, label: 역사, category: 지식, stats: [intellect], default: -1, description: "옛일을 떠올릴 때. 붕괴 전후의 일과 지역·무리의 내력을 안다" }
  - { id: mechanics, label: 차량정비, category: 지식, stats: [intellect, agility], default: -1, description: "기계를 고칠 때. 차량·발전기·펌프를 살린다" }
  - { id: carpentry, label: 목공, category: 지식, stats: [strength, intellect], default: -1, description: "나무로 만들고 막을 때. 바리케이드·담장을 세우고 고친다" }
  - { id: improvise, label: 급조, category: 생존, stats: [intellect, agility], default: -1, description: "아무거나 엮어 만들 때. 급조 무기·방어구·덫" }
  - { id: maintenance, label: 손질, category: 전투, stats: [intellect, senses], default: -1, description: "무기를 손질할 때. 총·칼이 덜 닳고 덜 망가진다" }
  - { id: tactics, label: 전략, category: 지식, stats: [intellect, nerve], default: -1, description: "싸움을 이끌 때. 전투 지휘, 분대 운용, 전쟁 계획" }

# 상대와 상황 (12-104, *임시*). 주사위는 주인공만 굴리고, 상대의 실력·지켜보는 눈·어둠은 코드가 판정 보정으로 바꾼다.
# 상대 점수(맞서는 스킬의 능력 + 스킬): 0~1 보정 없음, 2~3 -1, 4 -2, 음수 +1
opposition:
  # 내 스킬 → 상대가 맞서는 스킬
  moves:
    stealth: sense_danger     # 숨으면 상대가 알아챈다
    fight: fight              # 맞붙으면 상대도 싸운다
    shoot: sense_danger       # 쏘면 상대가 엄폐한다
    sense_danger: stealth     # 매복을 알아채려면 상대가 숨은 솜씨를 넘어야 한다
    deceive: sense_danger     # 속이면 상대가 눈치챈다
    persuade: persuade        # 흥정하면 상대도 셈한다
    intimidate: endure        # 겁주면 상대가 버틴다
  # 장면에 지켜보는 눈(동행 빼고)이 3·6을 넘을 때마다 -1
  crowd: { moves: [stealth, deceive], at: [3, 6] }
  # 밤이나 새벽이면 숨기 +1, 안개·비처럼 잘 안 보이는 날씨(visibility 0.7 아래)도 +1
  dark: { moves: [stealth], segments: [night, dawn], value: 1 }
  visibility: { moves: [stealth], below: 0.7, value: 1 }
  # 다칠 때 상대의 근접전·사격 점수가 3 이상이면 한 단계 더, 0 이하면 한 단계 덜 (적어도 1단계)
  # 상대가 무거운 피해를 낼 무기(엽총·소총·마체테 등, 탄약이 있으면)를 지녔으면 +1. 합쳐서 -1 ~ +1 (12-121)
  harm: { moves: [fight, shoot], strong: 3, weak: 0, armed: 1 }
  # 숨을 때 상대와의 거리 (12-121): 멀면 +1, 맞붙으면 -1
  distance: { moves: [stealth], values: { far: 1, close: -1 } }
  # 말이 통하지 않는 상대 (엑스트라 kind: infected, 12-111): 말로 하는 스킬은 쓸 수 없고,
  # 장면에 덤빌 수 있는 감염체가 둘·넷 이상이면 근접전 -1씩 (수에 밀림)
  mindless:
    refuses: [persuade, deceive, intimidate]
    outnumbered: { moves: [fight], at: [2, 4] }

# 능력·스킬 범위. 능력 + 스킬은 최대 +4 (2d6에서 +5부터는 실패가 사라진다)
ranges:
  ability: { min: -1, max: 2 }
  skill: { min: -1, max: 2 }
  cap: 4
# 역할에 능력이 없고 플레이어가 고르지도 않았을 때(이어 가는 새 신병 등): 이 배열을 코드가 무작위로 섞어 준다
ability_array: [2, 1, 1, 0, 0, 0, -1]
# 캐릭터 생성 (*임시*): 능력은 모두 0에서 시작해 4포인트를 나눠 쓴다. +1은 1, +2는 3, -1로 낮추면 1을 돌려받는다 (최대 2개)
# 4포인트면 위 배열(+2 +1 +1 0 0 0 -1)과 같은 무게다
creation:
  points: 4
  cost: { "-1": -1, "0": 0, "1": 1, "2": 3 }
  max_low: 2
  genders:
    - { id: male, label: 남성 }
    - { id: female, label: 여성 }
  # 나이: 고를 수 있는 범위 (고르지 않으면 시나리오의 나이)
  age: { min: 16, max: 65 }
  # 계급 기본 훈련 (12-87): 그 자리에 꼭 필요한 솜씨. 과거 배경과 따로 더한다 (총을 드는 분대원, 분대에 일을 맡기는 분대장, 회의에 안을 올리는 간부)
  rank_skills: { grunt: { shoot: 1 }, squad_leader: { tactics: 1 }, officer: { persuade: 1 } }
  # 계급의 최소 나이 (12-87). 과거 배경의 min_age(붕괴 전에 그 일을 했을 나이, 붕괴는 두 해 전)와 함께 나이의 아래 끝이 된다
  rank_min_age: { squad_leader: 20, officer: 25 }
  # 시작 스킬 (12-84): 2포인트, 스킬 하나에 +1까지. 과거 배경이 기본 배치를 준다
  skills: { points: 2, max: 1 }
  # 과거 배경 (12-84): 붕괴 전에 무엇을 했는지. 능력 배치(ability_array와 같은 값: +2 하나, +1 둘, -1 하나)와 스킬 기본값, 물건.
  # 플레이어는 같은 포인트 안에서 고칠 수 있다. 무리원·떠돌이 모두 고른다 (떠돌이의 재주를 합쳤다)
  pasts:
    - { id: firefighter, label: 소방관, summary: 불길과 무너지는 건물 속으로 들어가던 사람, stats: { strength: 2, vitality: 1, nerve: 1, intellect: -1 }, skills: { endure: 1, fight: 1 }, items: [crowbar], min_age: 24 }
    - { id: police, label: 경찰, summary: 순찰을 돌고 사건 현장을 보던 사람. 총을 쏴 본 적이 있다, stats: { senses: 2, nerve: 1, agility: 1, charm: -1 }, skills: { shoot: 1, sense_danger: 1 }, items: [flashlight], min_age: 24 }
    - { id: soldier, label: 군인, summary: 붕괴 때 부대에 있었다. 명령과 사격을 몸이 기억한다, stats: { agility: 2, vitality: 1, nerve: 1, charm: -1 }, skills: { shoot: 1, tactics: 1 }, items: [binoculars], min_age: 21 }
    - { id: doctor, label: 의사, summary: 병원에서 일했다. 약이 없어도 무엇이 사람을 죽이는지 안다, stats: { intellect: 2, senses: 1, nerve: 1, strength: -1 }, skills: { first_aid: 1, infected_lore: 1 }, items: [medkit], min_age: 30 }
    - { id: nurse, label: 간호사, summary: 병동을 지켰다. 상처를 꿰매고 밤새 환자 곁에 있던 손, stats: { senses: 2, intellect: 1, vitality: 1, strength: -1 }, skills: { first_aid: 1, endure: 1 }, items: [bandage, cloth], min_age: 24 }
    - { id: thief, label: 도둑, summary: 남의 문을 열고 들키지 않게 나오던 사람, stats: { agility: 2, senses: 1, nerve: 1, vitality: -1 }, skills: { stealth: 1, deceive: 1 }, items: [flashlight], min_age: 16 }
    - { id: gangster, label: 조폭, summary: 주먹과 겁으로 먹고살았다. 사람이 언제 물러서는지 안다, stats: { strength: 2, nerve: 1, vitality: 1, intellect: -1 }, skills: { intimidate: 1, fight: 1 }, items: [arm_guards], min_age: 19 }
    - { id: mechanic, label: 정비사, summary: 차와 기계를 고쳤다. 쇳소리만 들어도 어디가 나갔는지 안다, stats: { intellect: 2, strength: 1, agility: 1, charm: -1 }, skills: { mechanics: 1, maintenance: 1 }, items: [toolkit], min_age: 20 }
    - { id: builder, label: 건설 노동자, summary: 현장에서 벽을 세우고 비계를 탔다, stats: { strength: 2, vitality: 1, intellect: 1, charm: -1 }, skills: { carpentry: 1, endure: 1 }, items: [carpentry_kit], min_age: 20 }
    - { id: cook, label: 요리사, summary: 식당 주방에서 일했다. 모자란 재료로 끼니를 만든다, stats: { vitality: 2, senses: 1, charm: 1, nerve: -1 }, skills: { survival: 1, persuade: 1 }, items: [kitchen_knife, canned_food], min_age: 20 }
    - { id: salesman, label: 영업사원, summary: 말로 물건을 팔았다. 웃는 얼굴 뒤의 셈을 읽는다, stats: { charm: 2, intellect: 1, nerve: 1, strength: -1 }, skills: { persuade: 1, deceive: 1 }, items: [cigarettes, trade_token], min_age: 23 }
    - { id: courier, label: 배달원, summary: 오토바이로 도시 골목을 누볐다. 길과 지름길을 안다, stats: { agility: 2, senses: 1, vitality: 1, intellect: -1 }, skills: { scavenge: 1, sense_danger: 1 }, items: [moto_helmet], min_age: 19 }
    - { id: teacher, label: 교사, summary: 아이들을 가르쳤다. 사람을 모으고 말을 듣게 하는 법을 안다, stats: { intellect: 2, charm: 1, nerve: 1, strength: -1 }, skills: { history: 1, persuade: 1 }, items: [notebook, pencil], min_age: 26 }
    - { id: farmer, label: 농부, summary: 도시 끝에서 밭을 갈았다. 덫을 놓고 날씨를 읽는다, stats: { vitality: 2, strength: 1, senses: 1, charm: -1 }, skills: { survival: 1, endure: 1 }, items: [wire_roll, seed_packet], min_age: 18 }
    - { id: student, label: 학생, summary: 붕괴 때 학교에 있었다. 아무거나 엮어 쓸 것을 만드는 손재주가 있다, stats: { agility: 2, intellect: 1, senses: 1, nerve: -1 }, skills: { improvise: 1, scavenge: 1 }, items: [duct_tape, scrap_metal] }
  # 트레잇 고르기: 긍정 비용 합 ≤ 부정 보상 합. 종류별 최대
  # 성격은 개수 제한 없이 (연기 힌트). 반대되는 것끼리만 막는다
  # 공포증은 하나까지 (드문 공포증을 쌓아 포인트를 버는 것을 막는다, 12-108)
  traits: { max_positive: 3, max_negative: 3, max_phobia: 1 }
  # 대화로 만들 때(MCP) GM이 단계마다 장면처럼 묻도록 주는 힌트
  narration:
    name: "시작 장면 속 누군가가 이름을 묻는다 (명부나 장부를 든 사람, 문을 지키는 사람, 깨진 거울 조각에 비친 얼굴 등 그 시나리오에 맞게)"
    gender: "명부의 다음 칸. 담담하게 묻는다"
    past: "붕괴 전의 삶. 그때 무엇을 하던 사람이었는지 떠올리게 한다"
    abilities: "이 세상을 두 해 버텨 온 몸과 머리. 무엇이 남달랐는지 떠올리게 한다"
    skills: "몸에 익은 일. 과거의 일과 붕괴 뒤에 배운 것"
    traits: "타고난 기질과 버릇. 무리 사람들이 당신을 뭐라고 수군거리는지로 풀어 간다"
# 역할 권한(roles의 access)의 이름. ration(배급)·mission_board(임무)는 core가 쓰고, 나머지는 GM이 보는 특권
access_labels:
  ration: 배급
  mission_board: 임무 게시판
  treatment_room: 치료실 출입 (치료 도구와 약제실 앞까지)

# 무리의 규율 단계 (기획서 9.9). 무리마다 factions의 culture.discipline으로 고른다 (*임시* 수치)
# abandon/expire_merit: 임무를 버리거나 놓쳤을 때의 공적, counts_disobedience: 불복종으로 치는지,
# max_disobedience: 진급에 허용되는 불복종 수, deed_severity: 불복종 행적의 무게(0이면 남기지 않는다)
discipline:
  strict: { label: 군율, abandon_merit: -3, expire_merit: -3, counts_disobedience: true, max_disobedience: 0, deed_severity: 3, order_word: 명령 }
  orderly: { label: 질서, abandon_merit: -2, expire_merit: -2, counts_disobedience: true, max_disobedience: 1, deed_severity: 2, order_word: 명령 }
  loose: { label: 느슨함, abandon_merit: -1, expire_merit: -1, counts_disobedience: false, max_disobedience: 3, deed_severity: 1, order_word: 당번 }
  free: { label: 자유, abandon_merit: 0, expire_merit: -1, counts_disobedience: false, max_disobedience: 99, deed_severity: 0, order_word: 일감 }

# 물건 (기획서 4.8, *임시* 수치): 맨손, 무게, 흥정
gear:
  # 무기 없이: 근접으로 가벼운 피해까지
  unarmed: { moves: [fight], max_harm: light, wound: { fight: blunt } }
  # 전투 중 근접·사격 판정은 공격으로 보고 무기·탄약을 따진다
  attack_moves: [fight, shoot]
  # 거리 (12-93, *임시*): 장면의 인물을 칠 때 GM이 고르는 상대와의 거리
  distances:
    - { id: close, label: "맞붙은 거리 (손이 닿는다)" }
    - { id: near, label: "가까운 거리 (방 하나, 길 건너)" }
    - { id: far, label: "먼 거리 (건물 사이, 백 걸음 넘게)" }
  # 무기에 range가 없으면: 근접은 맞붙어야 하고, 쏘는 것은 가까운 거리까지
  default_range: { fight: { close: 0 }, shoot: { close: 0, near: 0 } }
  # 들 수 있는 무게 = 12kg + 근력 1당 4kg. 넘으면 은밀·근접 -1, 1.5배를 넘으면 옮겨 가지 못한다
  carry: { base: 12, per_strength: 4, encumbered_moves: [stealth, fight], penalty: -1, hard_limit: 1.5 }
  # 값의 70% 이상이면 흥정 판정으로 깎을 수 있다
  haggle_floor: 0.7
  haggle_moves: [persuade, deceive]
  # 손질 0·1·2일 때 물건이 닳는 것을 피할 확률
  maintenance: { move: maintenance, save_chance: [0.15, 0.35, 0.55] }

# 제작 법 (기획서 4.8): 재료 + 도구 + 판정 → 결과. 성공은 다, 대가 있는 성공은 절반, 실패는 재료 절반을 버린다
crafting:
  recipes:
    - { id: reload_rounds, label: 재생 소총탄, move: mechanics, materials: { casings: 2, gunpowder: 1 }, tools: [toolkit], yields: { item: rifle_rounds, qty: 3 } }
    - { id: reload_pistol_rounds, label: 재생 권총탄, move: mechanics, materials: { casings: 2, gunpowder: 1 }, tools: [toolkit], yields: { item: pistol_rounds, qty: 3 } }
    - { id: reload_shells, label: 재생 산탄, move: mechanics, materials: { casings: 2, gunpowder: 1 }, tools: [toolkit], yields: { item: shells, qty: 3 } }
    - { id: whittle_bolts, label: 석궁 볼트 깎기, move: carpentry, materials: { planks: 1, scrap_metal: 1 }, tools: [[kitchen_knife, combat_knife]], yields: { item: bolts, qty: 4 } }
    - { id: wooden_bow, label: 나무 활 만들기, move: carpentry, materials: { planks: 1, cloth: 1 }, tools: [[kitchen_knife, combat_knife]], yields: { item: wooden_bow, qty: 1 } }
    - { id: whittle_arrows, label: 화살 깎기, move: carpentry, materials: { planks: 1, scrap_metal: 1 }, tools: [[kitchen_knife, combat_knife]], yields: { item: arrows, qty: 4 } }
    - { id: pipe_spear, label: 사제 창 만들기, move: improvise, materials: { scrap_metal: 1, kitchen_knife: 1, duct_tape: 1 }, yields: { item: pipe_spear, qty: 1 } }
    - { id: padded_armor, label: 덧댄 갑옷 두르기, move: improvise, materials: { cloth: 3, scrap_metal: 2, duct_tape: 2 }, yields: { item: padded_armor, qty: 1 } }
    - { id: bandages, label: 붕대 만들기, move: first_aid, materials: { cloth: 2 }, yields: { item: bandage, qty: 2 } }
    - { id: wire_trap, label: 철사 덫 감기, move: improvise, materials: { scrap_metal: 2 }, yields: { item: wire_roll, qty: 1 } }
    - { id: nail_bat, label: 못 박은 방망이, move: improvise, materials: { planks: 1, scrap_metal: 1 }, yields: { item: baseball_bat, qty: 1 } }
    - { id: molotov, label: 화염병, move: improvise, materials: { fuel_bottle: 1, cloth: 1 }, yields: { item: molotov, qty: 1 } }
    - { id: arm_guards, label: 손목 보호대, move: improvise, materials: { cloth: 1, scrap_metal: 1, duct_tape: 1 }, yields: { item: arm_guards, qty: 1 } }
    - { id: tin_alarm, label: 깡통 경보줄, move: improvise, materials: { wire_roll: 1, scrap_metal: 1 }, yields: { item: tin_alarm, qty: 1 } }
    - { id: pack_frame, label: 배낭 틀, move: improvise, materials: { planks: 1, cloth: 1, duct_tape: 1 }, yields: { item: pack_frame, qty: 1 } }
    # 땔감 패기 (12-122): 판자를 그대로 태우면 3시간, 패서 땔감 둘로 만들면 8시간 탄다. 목공의 겨울 쓸모
    # 훈연 (12-131): 날것을 땔감 연기에 그을려 오래 가게 한다
    - { id: smoke_fish, label: 생선 훈연, move: survival, materials: { raw_fish: 2, firewood: 1 }, yields: { item: dried_fish, qty: 2 } }
    - { id: smoke_meat, label: 고기 훈연, move: survival, materials: { raw_meat: 2, firewood: 1 }, yields: { item: smoked_meat, qty: 2 } }
    - { id: split_firewood, label: 땔감 패기, move: carpentry, materials: { planks: 1 }, tools: [[carpentry_kit, machete]], yields: { item: firewood, qty: 2 } }

# 판마다 다른 인물 사이의 관계 (기획서 7.10): 세계를 만들 때 이름 있는 인물들을 이만큼 무작위로 잇는다. 무리가 다르면 숨은 관계
dynamic_ties: { count: 5, kinds: [sibling, parent, child, spouse, friend, rival] }

# 지휘 (기획서 9.11): 분대 명령의 일과 지도부 회의의 방침 (*임시* 수치)
# 규칙(따르는지, 결과 판정, 전쟁 틱 반영)은 core에 있다. 여기는 이름과 숫자만
command:
  # 주인공의 전략 스킬이 1 이상이면 분대원의 일 판정에 +1
  lead_skill: tactics
  squad_tasks:
    - id: guard
      label: 창고·초소 보초
      kind: work
      hours: 6
      move: sense_danger
      stat: senses
      rewards: { merit: 1 }
      report:
        success: "{member}: 보초 이상 없음. 밤새 한 번도 졸지 않았다"
        partial: "{member}: 보초는 섰는데, 새벽에 잠깐 깜빡했다고 털어놓는다"
        miss: "{member}: 보초 중에 창고 쪽문이 열려 있었다. 뭐가 없어졌는지는 아직 모른다"
    - id: search
      label: 물자 수색
      kind: work
      hours: 5
      move: scavenge
      stat: senses
      needs_zone: true
      dangerous: true
      rewards: { loot: true }
      report:
        success: "{member}: {zone}에서 쓸 만한 걸 찾아 돌아왔다"
        partial: "{member}: {zone}을(를) 훑었지만 건진 게 많지 않다"
        miss: "{member}: {zone}에서 감염체에 쫓겨 빈손으로 돌아왔다"
    # 외부인 찾기 (12-140, *임시*): 담 밖을 떠도는 사람을 찾아 설득해 데려온다. 무리의 입과 손이 함께 는다
    - id: outsiders
      label: 외부인 찾기
      kind: work
      hours: 8
      move: persuade
      stat: charm
      needs_zone: true
      dangerous: true
      rewards: { population: 2, merit: 1 }
      report:
        success: "{member}: {zone}에서 떠돌던 사람 둘을 데려왔다. 굶주렸지만 일할 수 있다"
        partial: "{member}: {zone}에서 한 사람만 따라왔다. 나머지는 담 안을 믿지 못했다"
        miss: "{member}: {zone}에서 아무도 못 데려왔다. 떠돌이들이 돌을 던지며 쫓아냈다"
    - id: scout
      label: 정찰
      kind: work
      hours: 6
      move: stealth
      stat: agility
      needs_zone: true
      dangerous: true
      rewards: { merit: 1 }
      report:
        success: "{member}: {zone}을(를) 들키지 않고 돌아봤다. 본 것을 차례로 보고한다"
        partial: "{member}: {zone} 가장자리까지만 갔다. 더 들어가면 들킬 것 같았다고 한다"
        miss: "{member}: {zone}에서 들켰다. 총소리를 뒤로 하고 겨우 빠져나왔다"
    - id: escort
      label: 물자 호위
      kind: work
      hours: 8
      move: shoot
      stat: senses
      needs_zone: true
      dangerous: true
      rewards: { resources: { food: 6, water: 6 }, merit: 1 }
      report:
        success: "{member}: {zone}에서 물자를 무사히 들여왔다"
        partial: "{member}: {zone}에서 물자를 들여왔지만 절반은 버리고 왔다"
        miss: "{member}: {zone}에서 습격을 받아 짐을 다 잃었다"
    - id: forage
      label: 먹을 것 구하기
      kind: work
      hours: 6
      move: survival
      stat: senses
      needs_zone: true
      rewards: { resources: { food: 4 } }
      report:
        success: "{member}: {zone}에서 먹을 것을 넉넉히 구해 왔다"
        partial: "{member}: {zone}에서 조금 구해 왔다"
        miss: "{member}: {zone}을(를) 종일 헤맸지만 빈손이다"
    - id: rest
      label: 쉬게 하기
      kind: rest
      hours: 8
      report:
        success: "{member}: 한숨 자고 나니 낫다고 한다"
        partial: "{member}: 쉬었다"
        miss: "{member}: 쉬었다"
    - id: follow
      label: 곁에 두기
      kind: follow
      report:
        success: "{member}: 곁에 있다"
        partial: "{member}: 곁에 있다"
        miss: "{member}: 곁에 있다"
  # 분대원이 곁에 있으면 (follow) 싸움에서 받는 보정
  follow_bonus: { fight: 1, shoot: 1 }
  # 지도부(leader)도 회의에 앉는다 (12-152: 추대된 주인공)
  council_ranks: [officer, leader]
  council_moves: [persuade, tactics]
  policies:
    - id: ration
      label: 배급
      default: normal
      options:
        - id: cut
          label: 줄이기
          summary: 창고가 오래가지만 모두 한 단계 덜 받고, 사기가 가라앉는다
          upkeep: { food: 0.8 }
          ration_shift: 1
          morale: { delta: -1, chance: 0.15 }
          # 반대자는 무리마다 (같은 무리의 회의에 앉은 사람만 센다)
          opposed_by: [a_jeonghun, b_myeongsuk, e_deoksu]
        - id: normal
          label: 보통
          summary: 창고 사정대로 나눈다
        - id: extra
          label: 늘리기
          summary: 모두 한 단계 더 받고 사기가 오르지만, 창고가 빨리 빈다
          upkeep: { food: 1.25 }
          ration_shift: -1
          morale: { delta: 1, chance: 0.15 }
          opposed_by: [a_doyun, pb_seokgyu, d_sangpil]
    - id: stance
      label: 태세
      default: normal
      options:
        - id: defend
          label: 지키기
          summary: 먼저 치러 나가는 일이 줄고, 습격을 받으면 더 많은 사람이 지킨다
          aggression: 0.5
          defense: 1.5
          opposed_by: [a_jeonghun, pb_seokgyu, c_gyeongsu]
        - id: normal
          label: 보통
          summary: 하던 대로
        - id: attack
          label: 밀어붙이기
          summary: 먼저 치러 나가는 일이 늘고, 그만큼 집을 지키는 사람이 준다
          aggression: 1.6
          defense: 0.75
          opposed_by: [a_doyun, b_myeongsuk, d_sangpil, e_deoksu]

    - id: trade
      label: 교역
      default: none
      options:
        - id: none
          label: 하지 않기
          summary: 창고의 것은 창고에 둔다
        - id: food_for_ammo
          label: 식량을 주고 탄약
          summary: 날마다 나루상단(나루상단 자신이면 붉은연합)에 식량을 넘기고 탄약을 받는다. 서로 등을 돌리면 끊긴다
          trade: { partner: faction_e, fallback_partner: faction_c, give: { food: 10 }, get: { ammo: 5 } }
          opposed_by: [a_doyun]
        - id: water_for_medicine
          label: 물을 주고 의약품
          summary: 날마다 하얀매 진료소(하얀매 자신이면 나루상단)에 물을 넘기고 의약품을 조금 받는다
          trade: { partner: faction_d, fallback_partner: faction_e, give: { water: 8 }, get: { medicine: 2 } }
        - id: fuel_for_food
          label: 연료를 주고 식량
          summary: 날마다 나루상단(나루상단 자신이면 버들마을)에 연료를 넘기고 식량을 받는다. 겨울에는 추위가 걱정이다
          trade: { partner: faction_e, fallback_partner: faction_b, give: { fuel: 4 }, get: { food: 8 } }
          opposed_by: [a_jeonghun]
    # 분배 (12-128, *임시*): 무리 창고의 탄약·의약품·연료를 어디에 더 쓰고 어디를 아낄지. 회의에서 정한다 (council_propose)
    - id: ammo
      label: 탄약 분배
      default: normal
      options:
        - id: save
          label: 아끼기
          summary: 교전마다 탄약을 반만 쓰고 그만큼 화력이 떨어진다
          ammo_use: 0.5
          firepower: 0.85
          opposed_by: [a_doyun, pb_seokgyu, c_gyeongsu]
        - id: normal
          label: 보통
          summary: 하던 대로
        - id: front
          label: 전선에 몰기
          summary: 교전마다 탄약을 더 쓰는 대신 화력이 오른다. 창고가 빨리 빈다
          ammo_use: 1.5
          firepower: 1.2
          opposed_by: [a_jeonghun, b_myeongsuk, d_sangpil, e_deoksu]
    - id: medicine
      label: 의약품 분배
      default: normal
      options:
        - id: save
          label: 아끼기
          summary: 의무실이 크게 다친 사람만 돌본다 (하루 돌보는 사람이 반)
          care: 0.5
          opposed_by: [a_jeonghun, d_sangpil]
        - id: normal
          label: 보통
          summary: 하던 대로
        - id: generous
          label: 아낌없이
          summary: 의무실이 하루에 두 배를 돌본다. 의약품이 빨리 빈다
          care: 2
          opposed_by: [a_doyun, e_deoksu, c_gyeongsu]
    - id: fuel
      label: 연료 분배
      default: normal
      options:
        - id: save
          label: 아끼기
          summary: 땔 것을 줄인다. 창고는 오래가지만 거처가 덜 따뜻하다 (불 땐 거처가 6도 낮다)
          upkeep: { fuel: 0.6 }
          heated: -6
          opposed_by: [a_jeonghun, b_myeongsuk]
        - id: normal
          label: 보통
          summary: 하던 대로
        - id: warm
          label: 넉넉히 때기
          summary: 거처가 늘 따뜻하고 사기가 조금 오르지만 연료가 빨리 빈다
          upkeep: { fuel: 1.4 }
          heated: 4
          morale: { delta: 1, chance: 0.1 }
          opposed_by: [a_doyun, pb_seokgyu, e_deoksu]


# 자유 시나리오 (기획서 12.5): 플레이어가 쓴 시작을 이 범위 안의 부품으로 옮긴다
custom_start:
  # 세력에 속할 때 고를 수 있는 계급. 지도부(leader)는 무리마다 한 자리뿐이라 뺀다. 참모·간부급은 officer
  ranks: [grunt, squad_leader, officer]
  # 무소속으로 시작할 때의 계급과 장소 (누구의 땅도 아닌 곳)
  free_rank: loner
  free_locations: [old_town, riverside, hospital_ruins, cathedral, campus, mall_ruins, subway_hub]
  # 시작 훈련 (분대원의 근접전 +1, 사격 +1과 같은 무게)
  skill_points: 2
  skill_max: 1
  age: { min: 16, max: 65 }
  # 배경 부품의 빚 크기 (기획서 12.6)
  debt_sizes: { small: 5, large: 15 }
  # 무소속으로 시작할 때 고를 수 있는 연고 (extras/kin.yaml, 기획서 7.9)
  kin: [kin_young, kin_elder, kin_sibling, kin_partner, kin_comrade, stray_dog]
  kits:
    - { id: fighter, label: 싸울 채비, description: 몸으로 부딪치는 사람, items: [machete, padded_armor, water_bottle, dry_ration] }
    - { id: scout, label: 정찰 채비, description: 먼저 보고 먼저 피하는 사람, items: [binoculars, crossbow, bolts, bolts, combat_knife, water_bottle, dry_ration] }
    - { id: medic, label: 의무 채비, description: 다친 사람을 돌보는 사람, items: [medkit, fever_reducer, bandage, cloth, water_bottle, dry_ration] }
    - { id: trader, label: 거래 채비, description: 말과 물건으로 사는 사람, items: [cigarettes, canned_food, water_bottle] }
    - { id: clerk, label: 장부 채비, description: 숫자와 소식을 다루는 사람, items: [ledger, radio, water_bottle, canned_food] }
    - { id: wanderer, label: 떠돌이 채비, description: 담 밖에서 버텨 온 사람, items: [blanket, pipe_spear, leather_jacket, dry_ration, fishing_kit] }
    - { id: camp, label: 생활 채비, description: 무리 안에서 지내는 사람, items: [kitchen_knife, water_bottle, dry_ration, blanket] }
  # 떠돌이로 시작할 때의 꾸러미 (12-77)
  free_kit: wanderer
  pet: stray_dog
  # 떠돌이의 소규모 무리 (12-77): 처음 start명을 무작위로, max명까지. 관계는 주인공 기준. 부모·자식은 parent_gap살 이상 차이, 배우자는 다른 성별
  group:
    start: 3
    max: 5
    parent_gap: 18
    relations:
      - { id: spouse, label: 배우자, kind: spouse, max: 1, age: [18, 75], labels: { male: 남편, female: 아내 } }
      - { id: parent, label: 부모, kind: parent, max: 2, age: [34, 90], labels: { male: 아버지, female: 어머니 } }
      - { id: child, label: 자식, kind: child, age: [1, 60], labels: { male: 아들, female: 딸 } }
      - { id: sibling, label: 형제자매, kind: sibling, age: [3, 80] }
      - { id: comrade, label: 길동무, kind: other, age: [16, 70] }
    # 형제자매를 부르는 말: 손위는 [그 사람 성별][주인공 성별], 손아래는 [그 사람 성별]
    sibling_labels:
      older: { male: { male: 형, female: 오빠 }, female: { male: 누나, female: 언니 } }
      younger: { male: 남동생, female: 여동생 }
    # 엑스트라 틀: young_below살 아래는 young, elder_from살부터 elder, 배우자는 partner, 길동무는 other, 나머지 adult
    templates: { young: kin_young, elder: kin_elder, adult: kin_sibling, partner: kin_partner, other: kin_comrade }
    young_below: 16
    elder_from: 55
  # 동기 (12-77): 역할을 고른 뒤 고르고, 자세한 이야기를 쓴다. 이야기 중 세계의 사실이 되는 것은 배경 부품으로 남는다

# 이전 세이브의 옛 능력 id
renamed:
  abilities: { persuasion: charm }
# 경험치와 레벨업 (*임시*)
growth:
  # 필요 경험치: 5에서 시작해 레벨마다 ×1.3 (12-109). 레벨업마다 스킬 포인트 1
  first: 5
  step: 0
  ratio: 1.3
  max_level: 20
  # 버팀: 몸·마음이 한 단계 나빠질 때 피할 확률 (*임시*). 레벨 2~5는 4%씩, 6~10은 3%씩, 11~15는 2%씩, 16~20은 1%씩 (레벨 5에 16%, 10에 31%, 15에 41%, 20에 46%)
  resilience:
    - { from: 2, per: 0.04 }
    - { from: 6, per: 0.03 }
    - { from: 11, per: 0.02 }
    - { from: 16, per: 0.01 }
  xp: { success: 1, partial: 1, miss: 2, merit: 2 }
  daily_check_cap: 6
# 트레잇 (기획서 4.6, *임시*): 타고난 기질·체질·외모. 플레이어와 NPC가 같이 쓴다
# kind: positive(cost만큼 쓴다) / negative(cost만큼 얻는다) / personality(0, 연기 위주)
# visible: 처음 보는 사람에게도 보이는지. acting: GM 연기 지침
traits:
  # ── 긍정 ──
  - { id: quick_learner, label: 빨리 배움, kind: positive, cost: 2, description: 경험치 1.5배, opposites: [slow_learner], effects: { xp: 1.5 } }
  - { id: fast_healer, label: 빨리 낫는 체질, kind: positive, cost: 2, description: 저절로 낫는 데 하루 덜 걸린다, opposites: [slow_healer], effects: { recovery_days: -1 } }
  - { id: iron_gut, label: 튼튼한 위장, kind: positive, cost: 1, description: "병에 덜 걸리고, 걸려도 빨리 털고 일어난다 (질병 확률 절반, 낫는 확률 +20%)", opposites: [frail], effects: { disease: 0.5, disease_recover: 0.2 } }
  - { id: cold_hardy, label: 추위에 강함, kind: positive, cost: 1, description: 추운 날 덜 춥다, opposites: [cold_sensitive], effects: { cold: -1 } }
  - { id: light_eater, label: 소식가, kind: positive, cost: 1, description: 배급이 모자랄 때 덜 배고프다, opposites: [big_eater], effects: { hunger: -1 } }
  - { id: eagle_eye, label: 매의 눈, kind: positive, cost: 1, description: 경계 +1, opposites: [dull_senses], effects: { skills: { sense_danger: 1 } } }
  - { id: marksman, label: 사격 감각, kind: positive, cost: 1, description: 사격 +1, effects: { skills: { shoot: 1 } } }
  - { id: shadow, label: 그림자, kind: positive, cost: 1, description: 하는 일이 잘 들키지 않는다, opposites: [conspicuous], effects: { noticed: 0.7 } }
  - { id: silver_tongue, label: 말재간, kind: positive, cost: 1, description: 거짓말 +1, opposites: [bad_liar], effects: { skills: { deceive: 1 } } }
  - { id: steel_nerves, label: 강심장, kind: positive, cost: 2, description: "버티기 +1, 공포가 덜 오른다", acting: 위험 앞에서도 목소리가 흔들리지 않는다, opposites: [coward], effects: { skills: { endure: 1 }, fear: -1 } }
  - { id: beautiful, label: 아름다운 외모, kind: positive, cost: 2, visible: true, description: "첫인상이 좋다 (외모 +2). 이성에게 끌리는 사람은 더 끌리고, 같은 성별은 질투할 수 있다", opposites: [attractive, ugly], effects: { looks: 2 } }
  - { id: attractive, label: 호감형 외모, kind: positive, cost: 1, visible: true, description: 첫인상이 좋다 (외모 +1), opposites: [beautiful, ugly], effects: { looks: 1 } }
  # ── 부정 ──
  - { id: slow_learner, label: 느린 학습, kind: negative, cost: 2, description: 경험치 0.6배, opposites: [quick_learner], effects: { xp: 0.6 } }
  - { id: slow_healer, label: 더디게 낫는 체질, kind: negative, cost: 1, description: 저절로 낫는 데 하루 더 걸린다, opposites: [fast_healer], effects: { recovery_days: 1 } }
  - { id: frail, label: 허약 체질, kind: negative, cost: 2, description: "병에 잘 걸리고 잘 낫지 않는다 (질병 2배, 낫는 확률 -15%)", opposites: [iron_gut], effects: { disease: 2, disease_recover: -0.15 } }
  - { id: cold_sensitive, label: 추위를 탐, kind: negative, cost: 1, description: 추운 날 더 춥다, opposites: [cold_hardy], effects: { cold: 1 } }
  - { id: big_eater, label: 대식가, kind: negative, cost: 1, description: 정량이 아니면 더 배고프다, opposites: [light_eater], effects: { hunger: 1 } }
  - { id: dull_senses, label: 둔한 감각, kind: negative, cost: 1, description: 경계 -1, opposites: [eagle_eye], effects: { skills: { sense_danger: -1 } } }
  - { id: conspicuous, label: 눈에 띄는 사람, kind: negative, cost: 1, visible: true, description: 하는 일이 잘 들킨다, opposites: [shadow], effects: { noticed: 1.3 } }
  - { id: bad_liar, label: 서툰 거짓말, kind: negative, cost: 1, description: 거짓말 -1, acting: 거짓말을 하면 눈을 피하고 말이 꼬인다, opposites: [silver_tongue], effects: { skills: { deceive: -1 } } }
  - { id: coward, label: 겁쟁이, kind: negative, cost: 2, description: "버티기 -1, 공포가 더 오른다", acting: 위험 앞에서 망설이고 먼저 몸을 뺀다, opposites: [steel_nerves], effects: { skills: { endure: -1 }, fear: 1 } }
  # 공포증 (12-103): 그것이 나오는 장면이면 공포가 한 단계 더 오른다 (보통 사람에게 무섭지 않은 장면이어도). 겪을수록 둔감해진다
  - { id: nyctophobia, label: 어둠 공포, kind: negative, cost: 2, description: "어둠이 무섭다 (밤에는 겁이 더 난다)", acting: 불빛 없는 곳에서는 말이 빨라지고 손전등을 놓지 않는다, effects: { phobia: [dark] } }
  - { id: claustrophobia, label: 폐소 공포, kind: negative, cost: 2, description: "좁고 갇힌 곳이 무섭다 (지하·터널에서 겁이 난다)", acting: 지하로 내려가면 숨이 가빠지고 출구 쪽을 자꾸 돌아본다, effects: { phobia: [enclosed] } }
  - { id: aquaphobia, label: 물 공포, kind: negative, cost: 1, description: "깊은 물이 무섭다 (잠긴 곳·물가에서 겁이 난다)", acting: 물이 무릎 위로 오르면 얼굴이 하얗게 질린다, effects: { phobia: [water] } }
  - { id: cynophobia, label: 개 공포, kind: negative, cost: 1, description: "개가 무섭다 (개가 나타나면 겁이 난다)", acting: 개를 보면 몸이 굳고 눈을 떼지 못한다, effects: { phobia: [dog] } }
  # 버릇 (12-129): 하루가 지나면 담배 한 갑을 저절로 피운다. 가진 게 없으면 안절부절 (판정 -1), 담배를 피우면(use_item) 풀린다
  - { id: chain_smoker, label: 골초, kind: negative, cost: 2, description: "하루 한 갑을 피운다. 담배가 떨어지면 안절부절한다 (판정 -1)", acting: 손가락이 쉴 새 없이 주머니를 뒤지고 담배 연기 속에서 말한다, effects: { habit: { items: [cigarettes], track: craving, start: 3 } } }
  # 몸에 남는 상처 (12-156): 고를 수 없다. 크게 다치면 scars 규칙으로 붙는다
  - { id: limp, label: 절뚝임, kind: negative, selectable: false, visible: true, description: "다리를 다친 뒤로 걸음이 처진다 (은밀 -1)", acting: 오래 걸으면 한쪽 다리를 끌고 계단 앞에서 잠깐 멈춘다, effects: { skills: { stealth: -1 } } }
  - { id: stiff_hand, label: 굳은 손, kind: negative, selectable: false, visible: true, description: "손가락이 예전처럼 굽혀지지 않는다 (사격 -1)", acting: 방아쇠에 건 손가락이 한 박자 늦고 단추를 잠그는 데 오래 걸린다, effects: { skills: { shoot: -1 } } }
  - { id: face_scar, label: 얼굴 흉터, kind: negative, selectable: false, visible: true, description: "얼굴을 가로지르는 흉터. 첫인상이 나빠지지만 겁을 주기는 쉽다 (외모 -1, 위협 +1)", acting: 사람들이 흉터에 눈길을 줬다가 황급히 돌린다, effects: { looks: -1, skills: { intimidate: 1 } } }
  - { id: short_breath, label: 짧은 숨, kind: negative, selectable: false, description: "가슴을 다친 뒤로 숨이 금방 찬다 (버티기 -1)", acting: 뛰고 나면 한참 허리를 굽히고 숨을 고른다, effects: { skills: { endure: -1 } } }
  - { id: deaf_ear, label: 먹은 귀, kind: negative, selectable: false, description: "한쪽 귀가 잘 들리지 않는다 (경계 -1)", acting: 말을 걸면 고개를 돌려 성한 귀를 들이댄다, effects: { skills: { sense_danger: -1 } } }
  - { id: aching_wound, label: 쑤시는 옛 상처, kind: negative, selectable: false, description: "궂은 날이면 옛 상처가 쑤신다 (추위 노출 +1)", acting: 날이 흐리면 옛 상처 자리를 문지른다, effects: { cold: 1 } }
  # 술·약 (12-157): 술꾼은 고를 수 있다. 진통제 의존·각성제 중독은 쓰다 보면 붙는다 (body.dependence). 끝 단계를 며칠 버티면 끊는다
  - { id: drinker, label: 술꾼, kind: negative, cost: 1, description: "하루 한 병을 마신다. 술이 떨어지면 안절부절하다 손이 떨린다 (판정 -1, -2). 열흘을 버티면 끊는다", acting: 해가 지면 병을 찾고 술이 들어가면 말이 많아진다, effects: { habit: { items: [soju, moonshine], track: craving_drink, start: 2, quit_days: 10 } } }
  - { id: pill_habit, label: 진통제 의존, kind: negative, selectable: false, description: "하루 한 번 진통제를 먹는다. 떨어지면 안절부절하다 금단이 온다 (판정 -1, -2). 이레를 버티면 끊는다", acting: 아프지 않아도 약통을 흔들어 남은 알을 센다, effects: { habit: { items: [painkiller, morphine], track: craving_pills, quit_days: 7 } } }
  - { id: stim_habit, label: 각성제 중독, kind: negative, selectable: false, description: "하루 한 번 각성제를 한다. 떨어지면 처지다 금단이 온다 (판정 -1, -2). 보름을 버티면 끊는다", acting: 눈 밑이 검고 말이 빨라졌다가 갑자기 멍해진다, effects: { habit: { items: [stimulant], track: craving_stim, quit_days: 14 } } }
  - { id: ugly, label: 험악한 인상, kind: negative, cost: 1, visible: true, description: 첫인상이 나쁘다 (외모 -1), acting: 사람들이 첫눈에 경계한다, opposites: [beautiful, attractive], effects: { looks: -1 } }
  # ── 성격 (0) ──
  - { id: warm, label: 다정함, kind: personality, visible: true, description: 남을 살뜰히 챙긴다, acting: 말끝이 부드럽고 먼저 안부를 묻는다, opposites: [cold], persona: { warmth: 2 } }
  - { id: guarded, label: 경계심, kind: personality, visible: true, description: 쉽게 마음을 열지 않는다, acting: 대답을 아끼고 상대를 살핀다, opposites: [genial], persona: { warmth: -1, talk: -1 } }
  - { id: principled, label: 원칙주의, kind: personality, visible: true, description: 정한 원칙을 굽히지 않는다, acting: 규칙과 약속을 앞세워 말한다, opposites: [calculating], persona: { principle: -2 } }
  - { id: cynical, label: 냉소적, kind: personality, visible: true, description: 무엇이든 비꼬아 본다, acting: 희망적인 말에 코웃음 친다, persona: { warmth: -1 } }
  - { id: hot_tempered, label: 다혈질, kind: personality, visible: true, description: 화가 빨리 난다, acting: 쉽게 언성을 높이고 금방 식는다, opposites: [patient], persona: { temper: 2 } }
  - { id: calculating, label: 계산적, kind: personality, visible: false, description: 손익부터 따진다, acting: 대가와 이득을 먼저 묻는다, opposites: [principled], persona: { principle: 2 } }
  - { id: cautious, label: 신중함, kind: personality, visible: true, description: 서두르지 않는다, acting: 한 번 더 확인하고 움직인다, persona: { impulse: -2 } }
  - { id: blunt, label: 무뚝뚝, kind: personality, visible: true, description: 말이 짧고 퉁명스럽다, acting: 필요한 말만 짧게 한다, opposites: [formal], persona: { talk: -2 } }
  - { id: greedy, label: 탐욕, kind: personality, visible: false, description: 가진 것을 더 가지려 한다, acting: 값을 깎고 더 얻을 것을 노린다, persona: { principle: 1 } }
  - { id: curious, label: 호기심, kind: personality, visible: true, description: 모르는 것을 못 참는다, acting: 질문이 많다, persona: { impulse: 1 } }
  - { id: patient, label: 인내심, kind: personality, visible: false, description: 오래 기다릴 줄 안다, acting: 서두르지 않고 상대가 지치기를 기다린다, opposites: [hot_tempered], persona: { temper: -1, impulse: -1 } }
  - { id: ruthless, label: 잔혹함, kind: personality, visible: false, description: 남의 고통에 무감하다, acting: 협박을 담담하게 한다, opposites: [protective], persona: { warmth: -2 } }
  - { id: lazy, label: 게으름, kind: personality, visible: true, description: 할 수 있으면 빠진다, acting: 일을 미루고 핑계를 댄다, opposites: [meticulous] }
  - { id: protective, label: 보호 본능, kind: personality, visible: true, description: 약한 사람을 지키려 한다, acting: 다친 사람 앞에서 먼저 나선다, opposites: [ruthless], persona: { warmth: 1 } }
  - { id: cold, label: 냉정함, kind: personality, visible: true, description: 감정을 드러내지 않는다, acting: 표정 없이 사실만 말한다, opposites: [warm], persona: { warmth: -2 } }
  - { id: meticulous, label: 꼼꼼함, kind: personality, visible: true, description: 세세한 것까지 따진다, acting: 숫자와 기록을 들먹인다, opposites: [lazy], persona: { impulse: -1 } }
  - { id: formal, label: 격식, kind: personality, visible: true, description: 예의와 절차를 따진다, acting: 존대와 직함을 깍듯이 쓴다, opposites: [blunt], persona: { principle: -1 } }
  - { id: genial, label: 넉살, kind: personality, visible: true, description: 누구에게나 웃으며 다가간다, acting: 농담으로 분위기를 푼다, opposites: [guarded], persona: { talk: 1, warmth: 1 } }
  - { id: timid, label: 소심함, kind: personality, visible: true, description: 눈치를 많이 본다, acting: 말을 더듬고 눈을 피한다, persona: { talk: -1 } }
  - { id: eager, label: 열성적, kind: personality, visible: true, description: 뭐든 해 보겠다고 나선다, acting: 먼저 손을 들고 들떠 있다, opposites: [weary], persona: { impulse: 1 } }
  - { id: weary, label: 지침, kind: personality, visible: true, description: 오래 버텨 지쳐 있다, acting: 한숨이 잦고 말이 느리다, opposites: [eager] }
  - { id: motherly, label: 어머니 같음, kind: personality, visible: true, description: 잔소리와 챙김이 함께 온다, acting: 밥은 먹었냐고 묻고 잔소리를 한다, persona: { warmth: 2, talk: 1 } }
  - { id: talkative, label: 수다쟁이, kind: personality, visible: true, description: 들은 이야기를 잘 옮긴다 (소문 2배), acting: 묻지 않은 소식까지 늘어놓는다, effects: { rumor: 2 }, persona: { talk: 2 } }
  - { id: flirt, label: 이성편력, kind: personality, visible: false, description: 이성에게 쉽게 끌리고 이성의 설득·거짓말에 약하다, acting: 이성 앞에서 말이 많아지고 허세를 부린다, effects: { attraction: { moves: [persuade, deceive] } } }

# 상대를 쓰러뜨리기 (기획서 7.5, *임시*): 부상이 중상 이상이면 무력화 (더 맞서지 못하고 뒤질 수 있다)
combat:
  incapacitated_at: serious

# 출신과 말씨 (12-142, *임시*): 동적으로 생기는 사람(엑스트라)의 출신. weight는 대략의 인구 비율, dialect.chance는 그 출신이 사투리를 쓸 확률 (아니면 표준어).
# GM은 인물 카드의 말씨 줄대로, 예문만큼만 연기한다 (과장하거나 웃음거리로 만들지 않는다)
origins:
  - { id: capital, label: 수도권, weight: 50 }
  - id: gyeongsang
    label: 경상도
    weight: 25
    dialect:
      label: 경상도 사투리
      chance: 0.55
      style: '말이 짧고 억양이 세다. 말끝이 "~나", "~노", "~데이", "마"로 뚝 끊긴다'
      samples:
        - "뭐 하노, 퍼뜩 온나."
        - "됐다 마. 내가 할게."
  - id: jeolla
    label: 전라도
    weight: 10
    dialect:
      label: 전라도 사투리
      chance: 0.5
      style: '구수하고 말이 길다. "~잉", "~당께", "~했는디"가 붙고 놀라면 "워메"'
      samples:
        - "워메, 이것이 뭔 일이당가."
        - "그라믄 쪼까 기다려 보랑께."
  - id: chungcheong
    label: 충청도
    weight: 10
    dialect:
      label: 충청도 사투리
      chance: 0.4
      style: '느긋하고 하고 싶은 말을 돌려 한다. 말끝에 "~유", "~겨"가 붙는다'
      samples:
        - "급할 거 뭐 있대유. 천천히 혀."
        - "그거 안 되는 거 아닌가 싶은디유."
  - id: gangwon
    label: 강원도
    weight: 3
    dialect:
      label: 강원도 사투리
      chance: 0.4
      style: '산골 말씨. "~드래요", "~나?", "마카(모두)"가 섞인다'
      samples:
        - "그 고개는 마카 눈에 묻혔드래요."
        - "밥은 먹었나?"
  - id: jeju
    label: 제주도
    weight: 1
    dialect:
      label: 제주 말
      chance: 0.3
      style: '말끝이 "~수다", "~마씸", "~게"로 끝난다. 뭍 사람은 처음에 잘 못 알아듣는다'
      samples:
        - "어디 감수광?"
        - "혼저 옵서. 밥 먹읍서."
  - id: hamgyeong
    label: 함경도
    weight: 1
    dialect:
      label: 함경도 말씨
      chance: 0.8
      style: '북에서 온 사람의 말씨. 말끝이 "~했음둥", "~하오", "~슴메"로 끝난다'
      samples:
        - "어디서 왔음둥?"
        - "괜찮소. 내 이런 일 처음 아니오."

# 이름 재료 (기획서 7.5): 엑스트라가 이름을 얻을 때 성 + 이름을 고른다
names:
  surnames: [김, 이, 박, 최, 정, 강, 조, 윤, 장, 임, 한, 오, 서, 신, 권, 황, 안, 송, 유, 홍, 전, 고, 문, 손, 양, 배, 백, 허, 남, 노]
  given:
    male: [민수, 영호, 정훈, 상철, 성민, 지훈, 동욱, 재석, 태준, 현수, 병철, 승우, 기태, 준영, 광수, 대성, 우진, 형준, 진호, 석구, 명수, 철민, 경환, 도현]
    female: [미영, 지은, 수진, 은정, 혜린, 소영, 다은, 정희, 유진, 경숙, 나래, 하늘, 보람, 민지, 선영, 가윤, 예진, 순자, 영미, 지혜, 은비, 소희, 현정, 미숙]

# 매력의 수동 효과: 처음 만난 인물의 호감 + (매력 ÷ 2), 매력 +2면 호감이 오를 때 +1
charm: { ability: charm, first_impression_per: 2, bonus_at: 2 }

# 성격 축 (12-99, *임시*): 축마다 -2(low) ~ +2(high). 주인공은 만들 때 정하고, NPC는 성격 트레잇의 persona를 더한다.
# 말투·태도는 GM이 acting대로 연기하고, 결과가 남는 순간(발끈·말 새어 나감·궁합·연애 문턱)은 코드가 정한다
persona:
  axes:
    - { id: temper, low: 온화함, high: 다혈질, low_acting: [언성을 잘 높이지 않는다, 화낼 자리에서도 부드럽게 넘긴다], high_acting: [말끝에 날이 선다, 같은 지시도 거칠게 하고 도발에 쉽게 발끈한다] }
    - { id: talk, low: 과묵함, high: 수다스러움, low_acting: [말을 아낀다, 플레이어가 길게 말해도 짧게 끊어 말한다], high_acting: [말이 많다, 묻지 않은 말까지 술술 늘어놓는다] }
    - { id: impulse, low: 신중함, high: 충동적, low_acting: [한 번 더 확인하고 움직인다, 머뭇거리며 주위부터 살핀다], high_acting: [생각보다 몸이 먼저 나간다, 망설임 없이 거칠게 몸부터 움직인다] }
    - { id: warmth, low: 차가움, high: 다정함, low_acting: [표정이 적고 사무적이다, 남의 사정에 눈길을 주지 않는다], high_acting: [상대를 살뜰히 챙긴다, 다친 사람·아이에게 먼저 손을 내민다] }
    - { id: principle, low: 원칙적, high: 실리적, low_acting: [정한 선을 지키려 한다, 손해를 봐도 원칙을 굽히지 않는다], high_acting: [손익부터 따진다, 무엇이든 값을 매기고 흥정하려 든다] }
    - { id: heart, low: 금사빠, high: 돌부처, romance: true, low_acting: [호감 가는 사람 앞에서 눈길이 간다, 매력적인 사람 앞에서 말이 꼬이고 얼굴이 달아오른다], high_acting: [호감을 보여도 담담하다, 다가오는 마음을 무덤덤하게 받아넘긴다] }
  # 도발당하면 다혈질 1이면 25%, 2면 50%로 발끈한다. 상대의 호감 -1
  blowup: { axis: temper, chance: [0.25, 0.5], delta: { trust: 0, affection: -1, respect: 0 } }
  # 장면의 인물과 이야기하면 수다스러움 1이면 10%, 2면 25%로 아는 사실 하나가 새어 나간다
  leak: { axis: talk, chance: [0.1, 0.25] }
  # 대신 말이 오가면 상대도 털어놓는다: 같은 확률로 그 인물이 아는 사실 하나를 얻어듣는다 (12-107)
  hear: { axis: talk, chance: [0.1, 0.25] }
  # 성격의 득 (12-107): 다혈질이면 위협 판정 +1 (발끈하는 손해와 짝)
  edges:
    - { axis: temper, moves: [intimidate], bonus: 1 }
  # 처음 만날 때 다정함·원칙 축이 같은 쪽이면 호감 +1, 반대쪽이면 -1 (합 -2~2)
  rapport: { axes: [warmth, principle], same: 1, opposite: -1 }
  # 빈 축 채우기: NPC의 성격 트레잇이 정하지 않은 축은 인물 id에서 이 무게로 뽑는다 (판마다 같다, *임시*).
  # 대부분 0이나 1이고 2는 드물다. 금사빠 ↔ 돌부처는 트레잇이 정하지 않아 더 넓게
  fill:
    temper: { "-2": 0.05, "-1": 0.2, "0": 0.5, "1": 0.2, "2": 0.05 }
    talk: { "-2": 0.05, "-1": 0.2, "0": 0.5, "1": 0.2, "2": 0.05 }
    impulse: { "-2": 0.05, "-1": 0.2, "0": 0.5, "1": 0.2, "2": 0.05 }
    warmth: { "-2": 0.05, "-1": 0.2, "0": 0.5, "1": 0.2, "2": 0.05 }
    principle: { "-2": 0.05, "-1": 0.2, "0": 0.5, "1": 0.2, "2": 0.05 }
    heart: { "-2": 0.1, "-1": 0.25, "0": 0.3, "1": 0.25, "2": 0.1 }
  # NPC의 금사빠 ↔ 돌부처 1단계마다 마음이 생기는 호감·고백을 받아들이는 호감이 1 달라진다 (돌부처 쪽이 높다)
  romance: { axis: heart, per_level: 1 }

# 시스템이 특정 역할로 쓰는 행동 (목격자 살피기, 목격 확률 낮추기, 거짓 소문 퍼뜨리기 12-151)
move_roles:
  notice: sense_danger
  stealth: stealth
  deceive: deceive

# 수색을 돕는 지식: 역사 1당 찾을 확률 +25% (옛 지도·건물 용도를 안다, *임시*)
search_lore: { skill: history, per_level: 0.25 }

# 증상 (12-74): 플레이어에게 보이는 몸 상태. 상태 트랙의 단계가 증상을 가리키고, 화면·?상태에는 증상만 보인다 (원인은 숨긴다).
# 같은 group은 크기 차이라 가장 큰 것(아래쪽) 하나만 보인다. 판정 보정: 가장 큰 증상은 그대로, 나머지 합은 반(올림)만 더한다
# (1+1 → -2, 3+2 → -4). tone: 화면 색 (없으면 보정 크기로). 보정은 작아도 마지막 단계급인 증상은 3 (*임시* 수치)
symptoms:
  - { id: chill, label: 추움, group: fever, penalty: -1 }
  - { id: shiver, label: 오한, group: fever, penalty: -2 }
  - { id: high_fever, label: 고열, group: fever, penalty: -3 }
  - { id: pain, label: 고통, group: pain, penalty: -1 }
  - { id: severe_pain, label: 심한 고통, group: pain, penalty: -2 }
  - { id: agony, label: 극심한 고통, group: pain, penalty: -3 }
  - { id: hungry, label: 허기짐, group: hunger, penalty: -1 }
  - { id: starving, label: 굶주림, group: hunger, penalty: -2 }
  - { id: starvation, label: 기아, group: hunger, penalty: -3 }
  - { id: thirsty, label: 목마름, group: thirst }
  - { id: parched, label: 탈수, group: thirst, penalty: -1 }
  - { id: severe_dehydration, label: 심한 탈수, group: thirst, penalty: -2 }
  - { id: impaired, label: 의식장애, group: consciousness, penalty: -1, tone: 3 }
  # 의식불명: 스스로 아무것도 하지 못한다 (판정·이동·대화·이야기 없이 시간만 흐르고, 남이 돌볼 수만 있다)
  - { id: unconscious, label: 의식불명, group: consciousness, tone: 3, incapacitates: true }
  - { id: nausea, label: 메스꺼움, penalty: -1, tone: 3 }
  - { id: distressed, label: 괴로움, group: mind }
  - { id: depressed, label: 우울함, group: mind, penalty: -1 }
  - { id: frantic, label: 미칠 것 같음, group: mind, penalty: -2 }
  - { id: breakdown, label: 멘탈붕괴, group: mind, penalty: -3 }
  # 공포 (12-95, *임시*): 그 자리에서 오르고 몇 시간 안에 빠진다
  # 피로 (12-114)
  # 담배 (12-129): 골초 트레잇이 담배 없이 하루를 넘기면
  - { id: restless, label: 안절부절, group: craving, penalty: -1 }
  # 술·진통제·마약 (12-157): 기운은 다른 증상의 보정을 가린다 (증상은 보인다). 끊으면 금단
  - { id: tipsy, label: 얼큰함, group: drink, masks: [fear] }
  - { id: drunk, label: 취함, group: drink, penalty: -1, masks: [fear] }
  - { id: numbed, label: 진통제 기운, group: numb, masks: [pain] }
  - { id: wired, label: 각성, group: wired, masks: [fatigue] }
  - { id: shakes, label: 손떨림, group: craving, penalty: -2 }
  - { id: withdrawal, label: 금단 증상, group: craving, penalty: -2, tone: 3 }
  - { id: drowsy, label: 졸림, group: fatigue }
  - { id: weary, label: 지침, group: fatigue, penalty: -1 }
  - { id: exhausted, label: 탈진, group: fatigue, penalty: -2 }
  - { id: tense, label: 긴장, group: fear }
  - { id: scared, label: 겁먹음, group: fear, penalty: -1 }
  - { id: panic, label: 공황, group: fear, penalty: -2, tone: 3 }
  # 출혈 (12-91): 판정 보정은 없다. 지금 피가 나는지 알려 준다
  - { id: scratch, label: 긁힘, group: bleeding }
  - { id: bleeding, label: 출혈, group: bleeding, tone: 2 }
  - { id: heavy_bleeding, label: 심한 출혈, group: bleeding, tone: 3 }
  - { id: death, label: 사망, group: death }
  # 변이: 감염으로 죽어 감염체가 된다. 그 자리에 감염체로 남는다 (body.infection.turns_into, 12-117)
  - { id: turned, label: 변이, group: death }

# 상태 트랙. 앞에서 뒤로 악화된다. fatal 단계에 이르면 사망. 단계 이름·판정 보정은 증상에서 나온다 (GM에게는 트랙 이름과 함께 보인다)
condition_tracks:
  - id: harm
    label: 부상
    icon: heart
    levels:
      - { id: none }
      - { id: light, symptoms: [pain] }
      - { id: serious, symptoms: [severe_pain] }
      - { id: critical, symptoms: [agony] }
      - { id: impaired, symptoms: [agony, impaired] }
      - { id: unconscious, symptoms: [unconscious] }
      - { id: dead, symptoms: [death], fatal: true }
  # 허기 (12-1): 하루마다 배급 수준만큼 바뀐다. 끝까지 가면 굶어 죽는다
  - id: hunger
    label: 허기
    icon: hunger
    levels:
      - { id: fed }
      - { id: hungry, symptoms: [hungry] }
      - { id: starving, symptoms: [starving] }
      - { id: famished, symptoms: [starvation] }
      - { id: faint, symptoms: [starvation, impaired] }
      - { id: unconscious, symptoms: [unconscious] }
      - { id: starved, symptoms: [death], fatal: true }
  # 갈증 (12-97, *임시*): 허기보다 빨리 죽는다 (물 없이 나흘째 쓰러지고 닷새째 죽는다)
  - id: thirst
    label: 갈증
    icon: water
    levels:
      - { id: quenched }
      - { id: thirsty, symptoms: [thirsty] }
      - { id: parched, symptoms: [parched] }
      - { id: severe, symptoms: [severe_dehydration, impaired] }
      - { id: unconscious, symptoms: [unconscious] }
      - { id: dead, symptoms: [death], fatal: true }
  # 감염 (12-1): 감염체에게 다치면 확률로 잠복기. 잠복기는 캐릭터가 모른다(hidden). 하루마다 나빠지고, 끝까지 가면 변이한다
  # 물리고 변이까지 여드레 (12-109: 닷새면 혈청을 찾을 틈이 없었다). 같은 증상이 이틀 가는 단계가 있다
  - id: infection
    label: 감염
    icon: virus
    levels:
      - { id: clean }
      - { id: incubating, label: 잠복, hidden: true }
      - { id: incubating_late, label: 잠복, hidden: true }
      - { id: chill, symptoms: [chill] }
      - { id: shiver, symptoms: [shiver] }
      - { id: shiver_deep, label: 깊은 오한, symptoms: [shiver] }
      - { id: fever, symptoms: [high_fever] }
      - { id: fever_deep, label: 깊은 고열, symptoms: [high_fever] }
      - { id: grave, symptoms: [high_fever, nausea] }
      - { id: turned, symptoms: [turned], fatal: true }
  # 추위 (12-4): 계절·날씨만큼 추워진다. 연료가 있는 우리 거점에서는 녹는다. 끝까지 가면 얼어 죽는다
  - id: cold
    label: 추위
    icon: cold
    levels:
      - { id: warm }
      - { id: cold, symptoms: [chill] }
      - { id: shiver, symptoms: [shiver] }
      - { id: hypothermia, symptoms: [shiver, impaired] }
      - { id: unconscious, symptoms: [unconscious] }
      - { id: frozen, symptoms: [death], fatal: true }
  # 질병 (12-4): 몸이 약해지면 걸린다. 잠복기는 캐릭터가 모른다. 고열까지 가고, 배부르고 따뜻하면 낫는다 (죽지 않는다)
  - id: disease
    label: 질병
    icon: fever
    levels:
      - { id: healthy }
      - { id: incubating, label: 잠복, hidden: true }
      - { id: chill, symptoms: [chill] }
      - { id: shiver, symptoms: [shiver] }
      - { id: sick, symptoms: [high_fever] }
  # 출혈 (12-91): 날붙이·찔림·총상·물림으로 다치면 부상 단계만큼 오른다. 보정은 없고, 시간이 흐르면 부상을 키운다. 지혈해야 멎는다
  - id: bleeding
    label: 출혈
    icon: blood
    levels:
      - { id: none }
      - { id: scratch, symptoms: [scratch] }
      - { id: bleeding, symptoms: [bleeding] }
      - { id: heavy, symptoms: [heavy_bleeding] }
  # 마음 (12-48): 크게 다치거나 곁의 사람이 죽는 것을 보면 흔들린다. 무너져도 죽지는 않는다 (판정만 어렵다)
  - id: nerves
    label: 마음
    icon: mind
    levels:
      - { id: steady }
      - { id: shaken, symptoms: [distressed] }
      - { id: low, symptoms: [depressed] }
      - { id: frayed, symptoms: [frantic] }
      - { id: broken, symptoms: [breakdown] }
  # 피로 (12-114, *임시*): 깨어 있은 시간만큼 쌓이고 자면 풀린다. 죽지는 않는다 (판정만 어렵다)
  - id: fatigue
    label: 피로
    icon: moon
    levels:
      - { id: rested }
      - { id: drowsy, symptoms: [drowsy] }
      - { id: weary, symptoms: [weary] }
      - { id: exhausted, symptoms: [exhausted] }
  # 공포 (12-95): 감염체·떼·기습 앞에서 오르고, 위협이 없으면 시간마다 가라앉는다. 판정만 어렵다
  - id: fear
    label: 공포
    icon: mind
    levels:
      - { id: calm }
      - { id: tense, symptoms: [tense] }
      - { id: scared, symptoms: [scared] }
      - { id: panic, symptoms: [panic] }
  # 담배 (12-129): 골초(traits.chain_smoker)만 오른다. 하루가 지나며 한 갑을 피우거나 담배를 피우면(consumables) 풀린다
  - id: craving
    label: 담배
    icon: fire
    quiet: true
    levels:
      - { id: satisfied }
      - { id: restless, symptoms: [restless] }
  # 술·진통제·각성제 기운 (12-157): 쓰면 오르고 body.wear_off 시간마다 한 단계 빠진다
  - id: drink
    label: 술기운
    icon: mind
    quiet: true
    levels:
      - { id: sober }
      - { id: tipsy, symptoms: [tipsy] }
      - { id: drunk, symptoms: [drunk] }
      - { id: wasted, symptoms: [drunk, nausea] }
  - id: numb
    label: 진통
    icon: heart
    quiet: true
    levels:
      - { id: none }
      - { id: numbed, symptoms: [numbed] }
      - { id: deep, symptoms: [numbed] }
  - id: wired
    label: 각성
    icon: moon
    quiet: true
    levels:
      - { id: none }
      - { id: wired, symptoms: [wired] }
      - { id: high, symptoms: [wired] }
  # 버릇의 금단 (12-157): 술꾼·진통제 의존·각성제 중독. 하루치를 못 하면 한 단계씩 오르고, 끝 단계를 버티면 끊는다 (habit.quit_days)
  - id: craving_drink
    label: 술
    icon: fire
    quiet: true
    levels:
      - { id: satisfied }
      - { id: restless, symptoms: [restless] }
      - { id: shakes, symptoms: [shakes] }
  - id: craving_pills
    label: 약
    icon: fire
    quiet: true
    levels:
      - { id: satisfied }
      - { id: restless, symptoms: [restless] }
      - { id: withdrawal, symptoms: [withdrawal, nausea] }
  - id: craving_stim
    label: 각성제
    icon: fire
    quiet: true
    levels:
      - { id: satisfied }
      - { id: restless, symptoms: [restless, drowsy] }
      - { id: withdrawal, symptoms: [withdrawal, weary] }
# apply_harm이 쓰는 트랙
harm_track: harm

# 소속 등급 사다리. level은 지휘 계통상의 높이 (화법 규칙에 쓴다)
# staff(주민: 전투 조직 밖에서 무리의 살림을 맡는 사람)와 leader(지도부)는 기획서 12.3 예시에 더해 쓰는 곳이 있어 둔다
rank_ladder:
  - { id: loner, label: 혼자, level: 0 }
  - { id: outsider, label: 외부 무리 일원, level: 0 }
  - { id: grunt, label: 분대원, level: 1 }
  - { id: staff, label: 주민, level: 1 }
  - { id: squad_leader, label: 분대장, level: 2 }
  - { id: officer, label: 간부, level: 3 }
  - { id: leader, label: 지도부, level: 4 }
# 진급 경로 (MVP: 분대원 → 분대장)
promotion: { from: grunt, to: squad_leader }

# 직분 (기획서 12.6): 무리 안에서 맡은 일. 시나리오(역할)와 인물이 정한다 (새 게임에서 따로 고르지 않는다, 12-80).
# 직분마다 훈련·도구가 더해지고, 일감(missions)과 이야기(태그 occ_<id>)가 붙는다.
# 직분 안의 사다리는 없다. 계급(분대원·분대장·간부)이 곧 사다리다 (12-83)
# - 군: 수색대원(나가는 사람: 폐허·길·전선·습격·호위), 수비대원(지키는 사람: 담·문·창고), 의무병. 큰 전쟁이 나면 모두 나간다
# - 살림: 요리사, 목수, 상인, 종교인, 정비공, 간호사, 의사 (간호사·의사는 붕괴 전에 의술을 배운 사람)
# 떠돌이는 직분이 없다. 스킬은 직분이 아니라 과거 배경(creation.pasts)에서 온다 (12-84)
occupations:
  - id: cook
    label: 요리사
    summary: 무리의 솥을 맡는다. 모자란 재료로 배급을 늘리고, 식당에서 오가는 말을 가장 먼저 듣는다
    skills: { survival: 1 }
    kit: [kitchen_knife, canned_food]
    missions: [occ_cook_morning_pot, occ_cook_stretch, occ_cook_forage, occ_cook_salt_store]
  - id: carpenter
    label: 목수
    summary: 담과 문, 지붕과 침상을 고친다. 무너진 데를 메우는 사람이라 어디든 불려 다닌다
    skills: { carpentry: 1 }
    kit: [carpentry_kit, planks]
    missions: [occ_carpenter_wall_patch, occ_carpenter_roof, occ_carpenter_watchtower, occ_carpenter_timber_run]
  - id: trader
    label: 상인
    summary: 무리의 물건을 바깥과 바꾼다. 값과 소문을 다루고, 무리 밖에도 아는 얼굴이 많다
    skills: { persuade: 1 }
    kit: [trade_token, cigarettes]
    missions: [occ_trader_market_run, occ_trader_price_ears, occ_trader_credit_book, occ_trader_stock_count]
  - id: preacher
    label: 종교인
    summary: 무너진 세상에서 기도와 장례를 맡는다. 사람들의 고해를 듣고, 무리의 사기를 붙든다
    skills: { endure: 1 }
    kit: [blanket]
    missions: [occ_preacher_burial, occ_preacher_sickbed, occ_preacher_evening_word, occ_preacher_quarantine_rite]
  - id: medic
    label: 의무병
    summary: 다친 사람을 꿰매고 열을 내린다. 약이 모자란 날마다 누구를 먼저 볼지 정해야 한다
    skills: { first_aid: 1 }
    kit: [bandage]
    missions: [occ_medic_rounds, occ_medic_boil, occ_medic_pharmacy, occ_medic_field]
  - id: mechanic
    label: 정비공
    summary: 총과 펌프, 발전기와 무전기를 살린다. 쇳소리와 기름 냄새 속에서 산다
    skills: { mechanics: 1 }
    kit: [toolkit, scrap_metal]
    missions: [occ_mechanic_rifle_service, occ_mechanic_generator, occ_mechanic_radio, occ_mechanic_parts_run]
  - id: scavenger
    label: 수색대원
    summary: 담 밖으로 나가는 사람. 폐허를 뒤지고, 길을 살피고, 싸움이 나면 총을 든다. 무리의 시나리오 임무와 이야기를 그대로 받는다
    skills: { shoot: 1, scavenge: 1 }
    kit: [flashlight, crowbar]
    missions: [occ_scavenger_sweep, occ_scavenger_mark_route, occ_scavenger_medicine, occ_scavenger_haul, occ_soldier_cleaning, occ_soldier_drill]
  - id: guard
    label: 수비대원
    skills: { sense_danger: 1 }
    summary: 담과 문, 창고와 우물을 지킨다. 바깥에 나가는 날은 적지만, 거점이 습격당하면 가장 먼저 맞선다
    kit: [binoculars]
    missions: []
  - id: nurse
    label: 간호사
    summary: 붕괴 전에 간호를 배웠다. 상처를 꿰매고 열을 재고, 환자 곁을 지킨다. 귀한 사람이라 바깥 싸움에는 내보내지 않는다
    skills: { first_aid: 1 }
    kit: [fever_reducer]
    storylet_tag: occ_medic
    missions: [occ_medic_rounds, occ_medic_boil, occ_medic_pharmacy]
  - id: doctor
    label: 의사
    summary: 붕괴 전에 의사였다. 약이 없어도 무엇이 사람을 죽이는지 안다. 무리마다 탐내는 사람이라 바깥에는 나가지 않는다
    skills: { first_aid: 2 }
    kit: [fever_reducer, medkit]
    storylet_tag: occ_medic
    missions: [occ_medic_rounds, occ_medic_pharmacy]

speech_rules: speech/post_apoc.yaml
# GM 지침 (두 플레이 모드가 같은 파일을 읽는다, 기획서 11.6)
gm_tone: prompts/post_apoc_tone.md
gm_rules: prompts/gm_rules.md
mcp_guide: prompts/mcp_play.md
# 새 게임을 시작할 때 들려주는 세계와 지금 상황 (시작 캐릭터가 아는 것만)
intro: prompts/intro.md

# 부상 회복 (*임시*). 치료사에게 받거나, 새 부상 없이 며칠 지나면 조금씩 낫는다
recovery:
  natural_days: 2
  # 중상까지는 저절로 낫는다. 치명상은 치료가 필요하다
  natural_max_level: serious
  # 의식불명에 이만큼(시간) 머물면 정신이 든다 (의식장애로 한 단계). 그사이 더 다치면 다시 센다 (*임시*)
  wake_hours: 6
  # 치료사에게 받으면 (하루 한 번) 트랙별로 낫는 단계
  # 감염은 치료사도 떼지 못한다 (혈청뿐, body.infection.cure)
  healer: { harm: 1, disease: 1, bleeding: 3 }
  # 무리의 돌봄 (12-52): 의무병 한 사람이 하루 두 명까지, 무리의 의약품으로 부상 한 단계에 1. 감염은 떼지 못한다
  faction_care: { occupations: [medic, nurse, doctor], resource: medicine, per_medic: 2 }
  # 주인공이 아이템 없이 남을 돌보는 조건: 의무병이거나 응급처치 +1 이상
  first_aid: { occupations: [medic, nurse, doctor], skill: first_aid, min: 1 }
  # 수술 (12-159, *임시*): 치명상 이상을 돌보는 것은 판정이다. 치료사는 2d6 + 지능·응급처치 + 장소(하얀매 진료소 +1, 거점 밖 -1)로 코드가 굴리고,
  # 주인공이 남을 돌보면 응급처치 판정이 있어야 한다. 실패하면 한 단계 나빠지고, 대가 있는 성공은 흔적(scars)을 굴린다
  surgery: { from: critical, move: first_aid, stat: intellect, clinics: [d_clinic], clinic_bonus: 1, field_penalty: -1 }

# 수위 (12-57): 성인 주제(연애·성적 위협) 이야기의 태그와 나이 하한. 세계의 수위가 꺼져 있으면 이 태그 이야기는 열리지 않고,
# 켜져 있어도 주인공과 배역이 모두 이 나이 이상이어야 열린다
content_rating: { tag: mature, adult_age: 18 }

# 연애 (12-58): 둘 다 성인일 때만 (수위와 상관없다. 수위는 잠자리·성적 위협만 가린다). 끌림은 인물마다 (npcs의 attracted_to, 없으면 이 비율로 인물 id에서)
romance:
  orientation: { other: 0.75, both: 0.15, same: 0.07, none: 0.03 }
  interest_affection: 3
  accept: { affection: 4, trust: 2 }
  flirt_moves: [persuade, deceive]
  jealousy_chance: 0.2
  grief_nerves: 2

# 포로 (12-55): 진 전투에서 물러나지 않았으면 부상 단계별 확률로 붙잡힌다 (항복하면 반드시). 갇힌 동안은 태그 captivity 이야기만 열린다
captivity:
  tag: captivity
  # 의식불명은 helpless 규칙(적의 손에 떨어짐)이 먼저 맡는다. 여기 값은 그 규칙이 없을 때
  on_defeat: { light: 0.15, serious: 0.5, critical: 0.8, impaired: 0.9, unconscious: 1 }
  confiscate: [weapon, ammo]
  escape_moves: [stealth, endure]
  # 갇힌 동안 허기는 굶주림까지만 (붙잡은 쪽이 겨우 먹인다)
  hunger_floor: starving
  upkeep: { resource: food, amount: 1 }
  labor: { resource: food, amount: 2 }
  ransom: { resource: ammo, amount: 8 }
  interrogate_moves: [intimidate, persuade]
  recruit_move: persuade
  war_capture_chance: 0.12

# 상처 종류와 출혈 (12-91, *임시*): 몸의 위험을 걸 때 GM이 상처 종류(harm_kind)를 고른다
wounds:
  kinds:
    - { id: cut, label: 베임 (칼·날붙이·유리), bleeds: true }
    - { id: pierce, label: 찔림 (창·꼬챙이·화살), bleeds: true }
    - { id: gunshot, label: 총상, bleeds: true }
    - { id: claw, label: 할큄 (손톱), bleeds: true }
    - { id: bite, label: 물림 (이빨), bleeds: true }
    - { id: blunt, label: 둔기·타박 (몽둥이·주먹·추락), bleeds: false }
    - { id: other, label: 그 밖 (화상·삠·탈진 등), bleeds: false }
  track: bleeding
  # 피가 나는 종류로 다쳐 부상이 이 단계가 되면 출혈이 여기까지 오른다
  from_harm: { light: scratch, serious: bleeding, critical: heavy, impaired: heavy, unconscious: heavy }
  # 이만큼(시간) 피를 흘릴 때마다 부상이 한 단계 나빠진다
  worsen_hours: { bleeding: 6, heavy: 1 }
  # 긁힘은 한 시간이면 저절로 멎는다
  clot_hours: { scratch: 1 }
  # 출혈 이상이면 정신이 들지 않고 저절로 낫지 않는다
  blocks_recovery_from: bleeding
  # 옷을 찢어 누르는 맨손 지혈
  staunch_move: first_aid
  # 감염체에게 다칠 위험인데 종류를 비웠으면 할큄으로 본다. 감염은 피가 나는 상처일 때만 굴린다
  infected_default: claw

# 큰 재난 (12-169, *임시*): 한 해에 두어 번 (앞 재난에서 25일 넘게 지나서), 사흘 전에 전조. 전조 이야기에서 대비하면 피해가 준다 (한 번 25%, 최대 50%).
# 거점을 덮친 큰불·떼·돌림병은 15%로 그 무리가 거점을 잃는다 (대비한 만큼 덜)
disasters:
  per_year: 2
  min_gap_days: 25
  warn_days: 3
  collapse_chance: 0.15
  kinds:
    - id: fire
      label: 큰불
      seasons: [autumn, winter]
      target: base
      omen: 바람이 세고 마른 냄새가 난다. 누군가 아궁이 불씨를 걱정하고, 창고 뒤에 기름통이 쌓여 있다
      aftermath: 그을린 벽, 타다 남은 창고, 연기 냄새가 며칠 간다
      news: "{zone}에 큰불이 났다"
      recover_days: 6
      resources: { fuel: 0.3, food: 0.2 }
      population: 0.03
      morale: 1
      fort: 1
      break_facilities: true
      stall_yields: true
      collapse: true
    - id: flood
      label: 홍수
      seasons: [spring, summer]
      target: water
      omen: 비가 사흘째 그치지 않는다. 강물이 다리 밑까지 차올랐고, 하수구가 거꾸로 넘친다
      aftermath: 진흙에 덮인 바닥, 떠내려간 짐, 썩는 냄새
      news: "{zone:이/가} 물에 잠겼다"
      recover_days: 5
      resources: { food: 0.15, water: 0.1 }
      population: 0.02
      morale: 1
      break_facilities: true
      stall_yields: true
    - id: horde
      label: 감염체 떼의 이동
      target: infested
      omen: 담을 긁는 소리가 잦아졌다. 쥐와 들개가 한쪽으로 도망치고, 밤마다 먼 곳에서 무리 지은 울음이 들린다
      aftermath: 무너진 담 틈, 끌려간 자국, 아직 근처를 떠도는 것들
      news: "감염체 떼가 {zone:을/를} 덮쳤다"
      recover_days: 6
      population: 0.05
      morale: 1
      fort: 1
      infestation: 2
      collapse: true
    - id: cold
      label: 혹한
      seasons: [winter]
      target: all
      omen: 하늘이 낮게 내려앉았다. 새벽 서리가 한낮에도 녹지 않고, 물통에 살얼음이 낀다
      aftermath: 얼어붙은 물, 땔감 다툼, 아침마다 깨어나지 않는 사람
      news: "도시에 혹한이 닥쳤다"
      recover_days: 4
      resources: { fuel: 0.25 }
      morale: 1
      weather: cold_snap
    - id: plague
      label: 돌림병
      seasons: [winter, spring]
      target: faction
      omen: 밤새 기침하는 사람이 늘었다. 피난민 막사에서 열이 오른 아이가 둘 나왔다는 말이 돈다
      aftermath: 격리된 막사, 바닥난 약장, 마스크 대신 천을 감은 얼굴들
      news: "{faction}에 돌림병이 돈다"
      recover_days: 8
      resources: { medicine: 0.3 }
      population: 0.04
      morale: 1
      disease: 0.35
      collapse: true

# 거점 손보기 (12-167, *임시*): 떠돌이의 거처(home)와 우리 무리의 거점(base)에 짓는 시설. 판정·시간·재료는 여기, 결과는 코드.
# 시간으로는 닳지 않고, 그 구역에 습격·공격이 오면 하나가 부서진다. 거점에 지으면 성실함 행적이 남는다
facilities:
  - id: barricade
    label: 바리케이드
    description: 판자와 고철로 틈을 막았다. 습격을 받으면 더 버티고, 밤에 다가오는 것이 줄어든다.
    where: [home, base]
    move: carpentry
    hours: 4
    materials: { planks: 3, scrap_metal: 2 }
    effects: { fort: 1, camp: 0.7 }
  - id: alarm_line
    label: 깡통 경보줄
    description: 드나드는 길목마다 깡통을 매단 줄을 쳤다. 잠들어도 무언가 다가오면 먼저 안다.
    where: [home, base]
    move: improvise
    hours: 1
    materials: { tin_alarm: 1, wire_roll: 1 }
    effects: { watched: true }
  - id: rain_catcher
    label: 빗물받이
    description: 천과 고철로 빗물을 모아 거르는 통을 걸었다. 이곳에서 물을 마시고 채울 수 있다.
    where: [home, base]
    move: improvise
    hours: 3
    materials: { cloth: 2, scrap_metal: 1, duct_tape: 1 }
    effects: { water: true }
  - id: garden
    label: 텃밭
    description: 흙을 고르고 씨를 뿌렸다. 봄부터 가을까지 먹을 것이 자란다.
    where: [home, base]
    move: survival
    hours: 6
    materials: { seed_packet: 1 }
    effects: { garden: { item: potato, qty: 2, days: 4, seasons: [spring, summer, autumn], resource: food, resource_delta: 1 } }
  # 가축 (12-175): 짐승은 재료로 들어간다. 텃밭(garden)과 같은 길로 자라되 계절을 가리지 않는다
  - id: coop
    label: 닭장
    description: 판자와 철사로 닭장을 짜고 닭을 넣었다. 이틀에 한 번 알을 거둔다.
    where: [home, base]
    move: carpentry
    hours: 3
    materials: { planks: 2, wire_roll: 1, hen: 2 }
    effects: { garden: { item: egg, qty: 2, days: 2, resource: food, resource_delta: 1 } }
  - id: goat_pen
    label: 염소 우리
    description: 판자로 우리를 두르고 염소를 매어 두었다. 날마다 젖을 짠다.
    where: [home, base]
    move: carpentry
    hours: 4
    materials: { planks: 3, wire_roll: 1, goat: 1 }
    effects: { garden: { item: goat_milk, qty: 1, days: 1, resource: food, resource_delta: 1 } }
  - id: smokehouse
    label: 훈제 막
    description: 판자로 작은 연기 막을 세웠다. 이곳에서 날을 넘기면 날것이 상하지 않는다.
    where: [home]
    move: carpentry
    hours: 4
    materials: { planks: 2, firewood: 2 }
    effects: { preserve: true }
  - id: stove
    label: 난로
    description: 고철로 연통 달린 난로를 짰다. 이곳 실내에는 꺼지지 않는 불이 있다.
    where: [home]
    move: improvise
    hours: 5
    materials: { scrap_metal: 3, wire_roll: 1 }
    effects: { fire: true }

# 유품과 이어지는 끈 (12-158, *임시*): 죽은 주인공과 관계(앙숙 빼고)가 있거나 호감이 이 이상이면 가까운 사람.
# 가까운 사람이 뒤를 이으면 사물함·거처의 짐을 물려받고, 이야기에서 그를 기억하는 배역(mourner)이 된다
legacy:
  close_affection: 3

# 다짐 (12-164, *임시*): 주인공의 큰 줄기. 시나리오(역할의 resolve, 없으면 배경)가 주거나 이야기가 건넨다. 한 번에 하나.
# 이루면 경험치 12(초반엔 두 레벨쯤, 중반부터는 한 레벨 안쪽)와 마음 한 단계 회복, 꺾이면 마음 한 단계 악화. 갚기는 스스로 내려놓을 수 있다 (내려놓아도 이룬 것으로 친다)
resolve:
  xp: 12
  relief_track: nerves
  from_history: { enemy: revenge, family: find, debt: debt }
  kinds:
    - { id: revenge, label: 갚기, check: gone, let_go: true }
    - { id: find, label: 찾기, check: meet }
    - { id: rescue, label: 구해 내기, check: released }
    - { id: cure, label: 살려 내기, check: cured }
    - { id: protect, label: 지키기, check: alive_days }
    - { id: repay, label: 은혜 갚기, check: promise_kept }
    - { id: rise, label: 자리, check: rank }
    - { id: debt, label: 빚 털기, check: debt_clear }
    - { id: journey, label: 떠나기, check: reach }
    - { id: truth, label: 진실, check: beliefs }
    - { id: atone, label: 속죄, check: trusted }
    - { id: heart, label: 마음, check: relation }
    - { id: quit, label: 버리기, check: trait_gone }
    - { id: endure, label: 버텨 내기, check: season_passed }
    - { id: bury, label: 묻기, check: buried }
    - { id: peace, label: 화해시키기, check: truce }
    - { id: topple, label: 무너뜨리기, check: faction_fallen }
    - { id: reclaim, label: 되찾기, check: zone_owned }
    - { id: recognition, label: 인정받기, check: standing, occupation_only: true }
    - { id: explore, label: 알아내기, check: ruins_found }
    - { id: homecoming, label: 돌아가기, check: reach }

# 몸에 남는 상처 (12-156, *임시*): 부상이 치명상 이상인 상처를 입으면 30%로 흔적 트레잇 하나. 상처 종류에 맞는 것 중에서, 한 사람에 셋까지
scars:
  at: critical
  chance: 0.3
  max: 3
  traits:
    - { trait: limp, wounds: [gunshot, pierce, bite, blunt, cut] }
    - { trait: stiff_hand, wounds: [cut, bite, claw, gunshot] }
    - { trait: face_scar, wounds: [cut, claw, other] }
    - { trait: short_breath, wounds: [gunshot, pierce, blunt] }
    - { trait: deaf_ear, wounds: [blunt, gunshot, other] }
    - { trait: aching_wound }

# 의식불명 중 곁의 사람 (12-90, *임시*): 쓰러질 때마다 한 번, 곁에 누가 있느냐로 코드가 정한다
helpless:
  # 그 사람이 주인공을 보는 믿음+호감이 이 이상이면 돌봐 준다, 이 이하면 적으로 군다
  ally_regard: 4
  hostile_regard: -4
  # 무리의 태도가 이 이하면 그 무리 사람은 적이다
  hostile_disposition: -2
  # 무리 없는 떠돌이를 보면 잡아가는 무리
  prey_on_strangers: [faction_c]
  # 장면에 아무도 없을 때 구역 주인 무리의 사람이 찾아낼 확률
  found_chance: 0.4
  # 아무도 찾지 않았을 때 감염체가 먼저 찾을 확률 (구역 위험 0~3)
  infected_chance: [0, 0.1, 0.25, 0.4]
  # 적이 죽일 확률: 기본 + 자비(mercy) 한 점마다 + 원한이 있으면
  kill: { base: 0.15, per_mercy: -0.05, feud: 0.4 }

# 길 위의 일 (12-53): 구역을 옮길 때 길의 위험(두 구역의 danger 중 높은 쪽 0~3)별로 태그 road인 이야기가 열릴 확률
travel: { tag: road, chance: [0.05, 0.12, 0.25, 0.4] }

# 시세 (12-155, *임시*): 그 땅 주인 무리의 창고가 처음의 25% 이하면 1.5배, 처음과 같으면 그대로, 두 배 이상이면 0.7배.
# 음식은 식량, 탄약은 탄약 (약·물·땔감은 아이템의 resource). 겨울에는 연료 1.4배, 여름에는 물 1.2배
market:
  kinds: { food: food, ammo: ammo }
  scarce: 0.25
  plenty: 2
  high: 1.5
  low: 0.7
  seasons:
    winter: { fuel: 1.4 }
    summer: { water: 1.2 }

# 잠입 장면 (12-154, *임시*): 다른 무리의 땅에서 담 밖 → 담 안 → 깊은 곳. 한 걸음 10분.
# 전진·빠지기는 은밀, 살피기는 경계. 경보 숫자는 보이지 않고 낌새로만. 낮에는 어렵고 밤·비·안개에는 쉽다
infiltration:
  move: stealth
  listen: sense_danger
  depths: [담 밖, 담 안, 깊은 곳]
  step_minutes: 10
  goals:
    - { id: steal, label: 물자 빼내기, move: scavenge, items: { canned_food: 2, rifle_rounds: 1 }, resource: { food: -10, ammo: -5 } }
    - { id: free, label: 갇힌 사람 풀어 주기, move: stealth, release: true }
    - { id: sabotage, label: 망가뜨리기, move: improvise, resource: { ammo: -20, fuel: -10 }, morale: -1 }
    - { id: eavesdrop, label: 엿듣기, move: stealth, overhear: true }

# 부탁 (12-174, *임시*): 하루에 이 확률로 만난 인물 하나가 부탁을 품는다. 부탁 내용은 인물 YAML의 favors
favors: { chance: 0.3, max_open: 2, expire_days: 4 }

# 약속 (12-160, *임시*): 주인공이 한 약속을 코드가 기억한다. 지키면 믿음이 오르고, 털어놓고 접으면 조금, 말없이 어기면 크게 깎인다
promises:
  max_open: 5
  kept: { trust: 1, affection: 1 }
  folded: { trust: -1 }
  broken: { trust: -2, affection: -1 }

# 탐험할 곳 (12-162, *임시*): 구역의 숨은 곳. 그 구역을 뒤지다(수색 성공·대가 있는 성공) 40%로 찾는다. 찾은 것은 그 캐릭터만 안다.
# 칸을 경계 판정으로 내려가고(마지막 칸은 어렵다), 칸마다 한 번 수색 판정으로 뒤진다. 소음이 3이면 깊이+1만큼 감염체가 깨어난다
exploration:
  move: sense_danger
  search_move: scavenge
  step_minutes: 15
  find_chance: 0.4
  wake: [infected_fresh, infected_hungry, infected_crawler]
  ruins:
    - id: subway_tracks
      zone: subway_hub
      label: 무너진 선로 아래 대피 통로
      hint: 승강장 끝 철망 너머로 비상 사다리가 아래로 이어진다
      mood: 물이 발목까지 찬 콘크리트 통로, 녹슨 안내판, 썩은 냄새와 멀리서 똑똑 떨어지는 물
      hazard: 젖은 사다리에서 미끄러졌다
      depths: [비상 사다리 아래, 물 찬 대피 통로, 막힌 열차 칸]
      loot:
        - [{ item: dirty_water, weight: 2, qty: [1, 2] }, { item: flashlight, weight: 1, qty: [1, 1] }, { item: scrap_metal, weight: 2, qty: [1, 2] }]
        - [{ item: canned_food, weight: 2, qty: [1, 2] }, { item: bandage, weight: 1, qty: [1, 2] }, { item: stimulant, weight: 0.5, qty: [1, 1] }]
        - [{ item: pistol_rounds, weight: 2, qty: [2, 4] }, { item: mil_ration, weight: 1, qty: [1, 2] }, { item: pistol, weight: 0.4, qty: [1, 1] }, { item: tunnel_map, weight: 0.5, qty: [1, 1] }]
    - id: hospital_basement
      zone: hospital_ruins
      label: 옛 병원 지하 약제실
      hint: 무너진 응급실 뒤 계단이 지하로 내려간다. 문에 '약제부' 글씨가 반쯤 남았다
      mood: 깨진 형광등, 뒤집힌 침대, 소독약 냄새가 아직 희미하게 남은 복도
      hazard: 무너진 천장 판에 깔렸다
      depths: [지하 계단, 기록실 복도, 약제실 금고]
      loot:
        - [{ item: bandage, weight: 2, qty: [1, 2] }, { item: fever_reducer, weight: 1, qty: [1, 1] }, { item: cloth, weight: 1, qty: [1, 2] }]
        - [{ item: painkiller, weight: 2, qty: [1, 2] }, { item: antibiotics, weight: 1, qty: [1, 1] }, { item: medkit, weight: 1, qty: [1, 1] }]
        - [{ item: morphine, weight: 1.5, qty: [1, 2] }, { item: antibiotics, weight: 2, qty: [1, 2] }, { item: sealed_med_case, weight: 0.5, qty: [1, 1] }]
    - id: mall_stockroom
      zone: mall_ruins
      label: 마트 지하 물류 창고
      hint: 무너진 계산대 뒤 셔터가 허리 높이까지 들려 있다
      mood: 끝없는 선반, 쓰러진 지게차, 어둠 속에서 뭔가 바스락거린다
      hazard: 무너지는 선반에 맞았다
      depths: [셔터 아래, 하역장, 냉동 창고]
      loot:
        - [{ item: canned_food, weight: 2, qty: [1, 2] }, { item: duct_tape, weight: 1, qty: [1, 1] }, { item: blanket, weight: 1, qty: [1, 1] }]
        - [{ item: canned_food, weight: 2, qty: [2, 3] }, { item: soju, weight: 2, qty: [1, 3] }, { item: cigarettes, weight: 2, qty: [1, 3] }]
        - [{ item: canned_food, weight: 2, qty: [3, 5] }, { item: fuel_bottle, weight: 1, qty: [1, 2] }, { item: coat, weight: 1, qty: [1, 1] }]
    - id: plant_control
      zone: power_plant
      label: 발전소 지하 제어실
      hint: 터빈 건물 바닥의 점검구 뚜껑이 열려 있다. 아래에서 기름 냄새가 올라온다
      mood: 기름에 전 계단, 꺼진 계기판 수십 개, 쇠가 식으며 우는 소리
      hazard: 기름 묻은 철계단에서 굴렀다
      depths: [점검구 아래, 배관 통로, 제어실]
      loot:
        - [{ item: scrap_metal, weight: 2, qty: [1, 3] }, { item: wire_roll, weight: 1, qty: [1, 1] }]
        - [{ item: fuel_bottle, weight: 2, qty: [1, 2] }, { item: toolkit, weight: 0.7, qty: [1, 1] }, { item: casings, weight: 1, qty: [2, 4] }]
        - [{ item: fuel_bottle, weight: 2, qty: [2, 3] }, { item: gunpowder, weight: 1, qty: [1, 2] }, { item: explosive, weight: 0.3, qty: [1, 1] }]
    - id: prison_armory
      zone: prison
      label: 교도소 무기고
      hint: 관리동 지하 철문이 비틀려 사람 하나 지나갈 틈이 났다
      mood: 철창이 끝없이 이어진 복도, 벽의 손톱자국, 문이 바람에 혼자 덜컹인다
      hazard: 비틀린 철문 날에 베였다
      depths: [관리동 지하, 보안 복도, 무기고]
      loot:
        - [{ item: cell_key_ring, weight: 1, qty: [1, 1] }, { item: baseball_bat, weight: 1, qty: [1, 1] }, { item: cloth, weight: 1, qty: [1, 2] }]
        - [{ item: arm_guards, weight: 1, qty: [1, 1] }, { item: shells, weight: 2, qty: [2, 4] }, { item: moto_helmet, weight: 1, qty: [1, 1] }]
        - [{ item: shotgun, weight: 1, qty: [1, 1] }, { item: shells, weight: 2, qty: [4, 6] }, { item: kevlar_vest, weight: 0.5, qty: [1, 1] }]
    - id: campus_lab
      zone: campus
      label: 의생명 연구동 지하 실험실
      hint: 연구동 계단에 '관계자 외 출입 금지' 테이프가 끊어져 있다. 계단 아래가 깜깜하다
      mood: 깨진 유리 장, 뒤집힌 쥐 우리, 벽에 붙은 메모들, 비상 발전기가 오래전에 멎었다
      hazard: 깨진 유리 장에 베였다
      depths: [지하 계단, 동물실, 저온 보관실]
      loot:
        - [{ item: notebook, weight: 1, qty: [1, 1] }, { item: pen, weight: 1, qty: [1, 1] }, { item: bandage, weight: 1, qty: [1, 1] }]
        - [{ item: antibiotics, weight: 1, qty: [1, 1] }, { item: fever_reducer, weight: 1, qty: [1, 2] }, { item: stimulant, weight: 0.7, qty: [1, 1] }]
        - [{ item: sealed_med_case, weight: 1, qty: [1, 1] }, { item: serum, weight: 0.2, qty: [1, 1] }, { item: antibiotics, weight: 1.5, qty: [1, 2] }]

# 뇌물과 협박 (12-153, *임시*). 뇌물의 값(물건 값의 합): 계급별 값 × (1 − 0.25 × 욕심), 주인공을 믿으면 ×0.8.
# 정직 2 이상이고 욕심 0 이하인 사람은 값과 상관없이 거절한다. 값의 절반 이상이면 교섭 판정. 협박은 위협 판정
leverage:
  bribe:
    move: persuade
    greed: self_interest
    scruple: honesty
    prices: { loner: 3, outsider: 4, grunt: 4, staff: 4, squad_leader: 8, officer: 15, leader: 30, default: 5 }
    greed_step: 0.25
    trusted: 0.8
    refuse_at: 2
  blackmail: { move: intimidate }

# 야영 (12-148, *임시*): 지켜 주는 지붕이 없는 곳에서 자거나 쉬거나 기다리거나 보초를 서면, 구역의 위험(위험과 감염체 압력 중 높은 쪽)별
# 시간당 확률로 태그 camp 이야기가 열린다. 6시간 자면 위험 0: 6%, 1: 17%, 2: 31%, 3: 47%. 모닥불이 타면 ×1.5, 우리 땅이면 ×0.5
camp: { tag: camp, chance: [0.01, 0.03, 0.06, 0.1], fire: 1.5, own_land: 0.5 }

# 매복 (12-177, *임시*): 은밀 판정(어려움)으로 자리를 잡으면 12시간, 첫 근접전·사격 +2와 50%로 상대 혼란.
# 적의 매복 이야기(ambush: true)가 열리면 다음 판정 -2, 실패하면 혼란(다음 판정 -1). 냄새 맡기를 배운 개가 곁에 있으면 미리 안다
ambush: { move: stealth, hours: 12, attack_moves: [fight, shoot], bonus: 2, partial_bonus: 1, confuse_chance: 0.5, ambushed: -2, confused: -1, forewarn_trick: sniff }

# 무전 송출 (12-173, *임시*): 무전기로 하루 한 번 열린 주파수에 부르면 이 확률로 응답 이야기(storylets/radio_call.yaml)가 열린다
radio_call: { item: radio, tag: radio_call, chance: 0.6 }

# 명성 (12-127, *임시*): 남에게 보인 행적의 크기 합. 한두 번으로는 무명이다
# 알려지면(1단계) 행적이 말이 모이는 곳을 거쳐 다른 무리로 넘어가고, 그 길에서 부풀려진다. 이름나면(2단계) 소문으로 들은 사람도 다시 옮긴다
# 소문으로만 아는 사람의 호감·존중이 3 이상이면 팬, -3 이하면 안티
fame:
  tiers:
    - { min: 0, label: 무명 }
    - { min: 6, label: 아는 사람은 아는 이름 }
    - { min: 15, label: 이름난 사람 }
    - { min: 30, label: 모두가 아는 이름 }
  cross_from: 1
  relay_from: 2
  fan_at: 3
  anti_at: -3

# 외교 (12-126, *임시*): 간부(지도부 회의에 앉는 계급)가 다른 무리의 간부 이상과 한 장면에서 협정을 제안한다 (negotiate)
# 상대의 태도·형편·힘 차이·협상 상대의 신뢰가 판정 난이도가 된다. 대가 있는 성공이면 cost를 상대에게 내준다
# 거절당하면 retry_days 동안 다시 못 꺼내고 상대의 태도 -1. 휴전 중에 그쪽 사람을 치면 두 무리의 태도가 broken이 된다
diplomacy:
  envoy_level: 3
  moves: [persuade, intimidate, deceive]
  retry_days: 3
  broken: -3
  pacts:
    - { id: truce, label: 휴전, kind: truce, days: 7, summary: "이레 동안 서로 치지 않는다", cost: { food: 30 } }
    - { id: prisoner_exchange, label: 포로 교환, kind: exchange, summary: "서로 잡고 있는 상대 무리 사람을 돌려보낸다", cost: { medicine: 5 } }

# 구역의 감염체 압력 (12-112, *임시*): 0~3, 기준값은 구역의 danger
# 전날 그 구역 소음이 noise_at 이상(총 한 발이면 2)이면 +1, 그날 그 구역 교전 사상자가 corpses_at 이상이면 +1 (3이면 전쟁이 60일에 거의 닿지 않아 2로)
# 오르지 않은 날은 settle 확률로 기준값 쪽으로 한 단계. 길 위의 일, 감염체 틀 등장, 쓰러졌을 때 물릴 확률에 쓴다
# 기준값보다 한 단계 높을 때마다 산출 -25% (12-118), 자기 거점이 기준값보다 높으면 하루 30%로 사기 -1 (12-120)
infestation:
  noise_at: 2
  corpses_at: 2
  settle: 0.3
  yields_cut: 0.25
  morale_chance: 0.3
  # 감염체가 몰린 땅을 지키느라 전쟁에 돌리는 몫이 준다 (12-144, *임시*): 넘친 단계 하나당 15%, 기본 몫의 40%까지만. 모든 무리가 자기 땅을 순찰하며 버틴다
  war_share_cut: 0.15
  war_share_floor: 0.4
  # 무리 형편(9.13)에 오르는 말: 그 무리 땅의 압력이 기준값보다 1·2·3 높을 때 (12-120)
  trouble_labels: [땅에 감염체가 몰려들었다, 감염체에 시달린다, 감염체에 둘러싸였다]

# 쓰면 몸이 나아지는 물건 (take_action.use_item): 아이템 → 트랙 → 나아지는 단계 (*임시*)
# 음식이 상하는 빠르기의 계절 배수 (12-131, *임시*): 아이템 perishable × 이 값
spoilage:
  season: { summer: 1.5, winter: 0.4 }

# 먹을 것 구하기 (12-131, *임시*): take_action.forage. 수색처럼 판정 결과만큼 굴리고, 같은 날 같은 곳에서 다시 할수록 절반.
# 낚시는 물이 나는 구역에서, 사냥은 거점이 아닌 구역에서. 개가 동행하면 사냥에서 한 번 더 굴린다
foraging:
  move: survival
  kinds:
    - { id: fish, label: 낚시, water: true, chance: 0.55, items: [{ item: raw_fish, weight: 1, qty: [1, 2] }] }
    - id: hunt
      label: 사냥
      chance: 0.35
      items: [{ item: raw_meat, weight: 3, qty: [1, 1] }, { item: raw_meat, weight: 1, qty: [2, 3] }]
      companions: [stray_dog, road_dog]
  # 덫: 철사 한 뭉치를 놓고 하루가 지날 때마다 40%로 날고기가 걸린다. 거두면 철사가 돌아온다
  trap: { item: wire_roll, chance: 0.4, catch: { item: raw_meat, qty: [1, 1] } }

consumables:
  medkit: { harm: 1, bleeding: 3 }
  bandage: { harm: 1, bleeding: 3 }
  # 항생제는 감염을 떼지 못하고 늦추기만 한다 (body.infection.slow)
  antibiotics: { harm: 1 }
  canned_food: { hunger: 2 }
  dry_ration: { hunger: 1 }
  water_bottle: { thirst: 2 }
  # 골초의 안절부절을 바로 푼다 (12-129)
  cigarettes: { craving: 1 }
  cucumber: { hunger: 1, thirst: 1 }
  tomato: { hunger: 1, thirst: 1 }
  apple: { hunger: 1, thirst: 1 }
  dried_fish: { hunger: 2, thirst: -1 }
  salted_meat: { hunger: 2, thirst: -1 }
  potato: { hunger: 1 }
  # 먹고 마시기 (12-131)
  raw_fish: { hunger: 1 }
  raw_meat: { hunger: 2 }
  smoked_meat: { hunger: 2, thirst: -1 }
  dirty_water: { thirst: 2 }
  wild_greens: { hunger: 1 }
  mushroom: { hunger: 1 }
  fever_reducer: { disease: 1 }
  # 술·진통제·각성제 (12-157): 기운을 올린다 (음수). 진통제는 고통을, 술은 공포를, 각성제는 피로를 가린다
  soju: { drink: -1 }
  moonshine: { drink: -2 }
  painkiller: { numb: -1 }
  morphine: { numb: -2 }
  stimulant: { wired: -2 }

# 몸 상태 (12-1, *임시*)
body:
  # 기운이 한 단계 빠지는 시간 (12-157, *임시*): 술 3시간, 진통제 4시간, 각성제 5시간
  wear_off: { drink: 3, numb: 4, wired: 5 }
  # 쓸 때마다 버릇이 붙을 확률 (12-157, *임시*)
  dependence:
    soju: { trait: drinker, chance: 0.03 }
    moonshine: { trait: drinker, chance: 0.05 }
    painkiller: { trait: pill_habit, chance: 0.05 }
    morphine: { trait: pill_habit, chance: 0.2 }
    stimulant: { trait: stim_habit, chance: 0.15 }
  # 거점에 사는 사람들의 몸 (12-125): 무리의 배급·연료가 그 무리 사람들의 허기·추위가 된다. 굶주림·오한까지만 (죽지 않는다)
  residents: { hunger_max: starving, cold_max: shiver }
  # 피로 (12-114, *임시*): 깨어 있으면 시간당 1씩 쌓이고, 자면 시간당 3씩(6시간 자면 18) 풀리고, 쉬기만 하면 그대로다
  # 몸을 쓰는 일은 더 지친다 (12-119): 이동·수색·작업 1.5, 전투 3 (보초·기다림·대화는 1)
  # 16시간 깨어 있으면 졸림(보정 없음), 24시간이면 지침 -1, 32시간이면 탈진 -2
  # 지침 이상이면 부상이 저절로 낫지 않고 질병도 낫지 않는다 (12-115, 자야 낫는다)
  fatigue: { track: fatigue, grace: 16, per_step: 8, rates: { sleep: -3, rest: 0, travel: 1.5, search: 1.5, work: 1.5, combat: 3 }, blocks_recovery_from: weary }
  # 굶주림은 부상을 주지 않고 허기 트랙 끝에서 죽는다 (12-74)
  hunger: { track: hunger }
  # 갈증 (12-97, *임시*): 하루마다 한 단계 마른다. 물이 넉넉한 곳(물이 나는 구역, 물이 하루치 넘게 남은 우리 거점)에서
  # 직접 마시면(take_action.drink) 3단계 풀리고 빈 물병을 채운다. 밖에 나갈 땐 물병을 챙긴다
  thirst:
    track: thirst
    resource: water
    daily: 1
    drink: 3
    min_days: 1
    refill: { empty_bottle: water_bottle }
    captive_max: thirsty
    suffering_from: parched
    # 끓이지 않은 물 (12-131, *임시*): 바깥의 물을 불 없이 마시면 15%로 병에 걸리고, 채우면 끓이지 않은 물병이 된다
    dirty: { chance: 0.15, refill: { empty_bottle: dirty_water } }
  # 감염 (12-106): 한 번 걸리면 혈청 없이는 낫지 않는다. 하루에 한 단계, 변이까지 여드레 (12-109). 항생제를 계속 먹으면 보름쯤
  infection:
    track: infection
    # 감염체에게 입은 상처 종류별 감염 확률 (*임시*). 둔기·그 밖(살갗이 안 찢김)은 감염되지 않는다
    chance: { claw: 0.2, cut: 0.35, pierce: 0.35, bite: 0.6 }
    # 하나 먹으면 하루 동안 감염이 절반 속도로 퍼진다
    slow: [antibiotics]
    # 감염을 떼는 유일한 약. 잠복에도 듣는다
    cure: [serum, mil_serum]
    # 감염으로 죽으면 그 자리에 막 변한 감염체로 남는다 (12-117). 겉모습과 짐은 그 사람의 것
    turns_into: infected_fresh
  # 추위: 하루마다 계절·날씨의 추위만큼 (방한복은 들고 있으면 1 덜어 준다). 끝까지 가면 얼어 죽는다 (부상 없이)
  cold:
    track: cold
    season: { winter: 1 }
    weather: { snow: 1, cold_snap: 2, rain: 1 }
    gear: { coat: 1 }
    # 우리 거점에서 무리의 연료가 하루치 이상 있으면 불 땐 거처 (기온이 있으면 실내 체감이 heated 아래로 내려가지 않는다)
    # guests (12-121): 다른 무리 거점도 그 무리가 우리를 0 이상으로 보면 불 땐 방에 재워 준다 (적대·떠돌이를 노리는 무리는 아니다)
    shelter: { resource: fuel, min_days: 1, warm: -2, guests: 0 }
    # 기온 (12-98, *임시*). 있으면 위의 하루 단위 추위(season·weather·gear) 대신 시간대마다 기온을 재고 냉기를 쌓는다.
    # 바깥 = 계절 평균 + 시간대 + 날씨 + 그날 ±2. 체감 = 바깥 + 실내(구역 cover) + 모닥불 + 방한복(입으면) + 담요(자거나 쉴 때) ± 체질 3
    # 체감이 8°보다 낮으면 (모자란 도 × 시간)만큼 냉기, 100마다 추위 한 단계. 8° 이상이면 시간당 20, 15° 이상이면 50씩 빠지고 100마다 풀린다
    climate:
      season: { winter: -3, spring: 9, summer: 24, autumn: 8 }
      segments: { dawn: -5, morning: -2, day: 3, evening: 0, night: -4 }
      weather: { fog: -1, rain: -2, snow: -3, cold_snap: -10 }
      jitter: 2
      comfort: 8
      warm: 15
      per_step: 100
      mild_rate: 20
      warm_rate: 50
      indoor_weather: 0.5
      heated: 16
      # 피난처(성당·캠퍼스) 실내의 최저 체감 (12-122): 모여 사는 사람들이 불을 때지만 거점보다는 춥다
      sanctuary: 10
      trait_degrees: 3
      # 모닥불: 연료 → 타는 시간. 곁에 있으면 +10°, 피우면 그 구역 소음 +1 (연기와 불빛)
      fire: { items: { firewood: 4, planks: 3, fuel_bottle: 2 }, warmth: 10, noise: 1 }
      # 젖은 옷 (12-121, *임시*): 비 오는 날 바깥에 있었거나 강·하수구에 빠지면 3시간 동안 체감 -5. 모닥불 곁에서는 한 시간이면 마른다
      wet: { weather: [rain], degrees: 5, hours: 3 }
  # 질병: 하루마다 확률. 굶주림·추위·무리의 물 부족마다 더하고, 체력 1당 25% 덜 걸린다
  disease:
    track: disease
    chance: { base: 0.01, starving: 0.05, cold: 0.05, thirst: 0.06 }
    thirst_resource: water
    resist: { ability: vitality, per_point: 0.25 }
    # 배부르고 따뜻하면 하루마다 낫는 확률 (체력 1당 +10%), 아니면 깊어지는 확률
    recover: { chance: 0.35, per_point: 0.1 }
    worsen: 0.3
  # 마음 (12-48): 크게 다치면 1, 곁의 사람이 죽는 것을 보면 1. 냉정 1당 15% 버틴다.
  # 굶주림·오한 이상이 아니면 하루마다 15% (냉정 1당 +10%), 우리 땅이거나 곁에 사람이 있으면 +20% 가라앉는다 (*임시*)
  nerves:
    track: nerves
    heavy_harm: 1
    witness_death: 1
    resist: { ability: nerve, per_point: 0.15 }
    recover: { chance: 0.15, per_point: 0.1, safe: 0.2 }
    # 끊기지 않고 6시간 넘게 푹 자면 한 번 더: 우리 땅이나 동행 곁이면 50%, 아니면 25% (냉정 1당 +10%, *임시*)
    sleep: { min_hours: 6, safe: 0.5, unsafe: 0.25 }
  # 공포 (12-95, *임시*): 계기의 단계 + 어둠 1 - 동행 1 ± 트레잇 - 둔감해짐. 냉정 1당 15% 한 단계 버틴다.
  # 위협이 없으면 1시간마다 한 단계 가라앉고, 자고 나면 평정. 공황이면 30%로 마음 +1, 마음이 미칠 것 같음 이상이면 한 단계 더
  fear:
    track: fear
    gm: { startle: 1, dread: 2 }
    battle: 1
    witness_death: 1
    dark: { segments: [night], steps: 1 }
    companion: 1
    resist: { ability: nerve, per_point: 0.15 }
    desensitize: [10, 30]
    decay_hours: 1
    panic_nerves: 0.3
    nerves_from: frayed
    # 감염체를 아는 사람은 감염체가 덜 무섭다 (지식 1 이상이면 한 단계 덜)
    lore: [{ skill: infected_lore, tag: infected, min: 1 }]

# 날씨 (12-3, *임시*). 하루마다 계절별 무게로 고른다. visibility: 숨은 목격자 확률 배수 (작을수록 안 보인다)
weather:
  kinds:
    - { id: clear, label: 맑음, description: 멀리까지 보인다, visibility: 1, icon: sun }
    - { id: overcast, label: 흐림, description: 하늘이 낮게 깔려 빛이 흐리다, visibility: 0.9, icon: cloud }
    - { id: rain, label: 비, description: 빗소리가 발소리를 덮고 길이 미끄럽다, visibility: 0.6, icon: rain }
    - { id: fog, label: 안개, description: 몇 걸음 앞도 잘 보이지 않는다. 숨어 움직이기 좋다, visibility: 0.4, icon: fog }
    - { id: snow, label: 눈, description: 소리는 묻히지만 발자국이 남는다, visibility: 1.1, icon: snow }
    - { id: cold_snap, label: 한파, description: 바깥에 오래 있으면 손발이 얼어붙는다, visibility: 0.9, icon: cold }
  by_season:
    winter: { clear: 3, overcast: 3, snow: 3, fog: 1, cold_snap: 2 }
    spring: { clear: 4, overcast: 3, rain: 3, fog: 2 }
    summer: { clear: 4, rain: 4, overcast: 2 }
    autumn: { clear: 5, overcast: 3, rain: 2, fog: 2 }
  default: { clear: 1 }

# 계절 (12-1, *임시*). 1일차는 늦가을. 겨울엔 연료를 많이 쓰고 먹을 것이 덜 난다
seasons:
  start: { season: autumn, day: 14 }
  list:
    - { id: winter, label: 겨울, days: 20, upkeep: { fuel: 2, water: 0.9 }, yields: { food: 0.6, water: 0.8 } }
    - { id: spring, label: 봄, days: 20, yields: { food: 0.9 } }
    - { id: summer, label: 여름, days: 20, upkeep: { water: 1.15 }, yields: { food: 1.1 } }
    - { id: autumn, label: 가을, days: 20, yields: { food: 1.3 } }

# 세력 단위 전쟁 (9단계, 기획서 9장). 규칙은 core, 여기는 수치와 문구 (*임시*)
war:
  # 1인당 하루 소모량
  upkeep: { food: 1, water: 1, fuel: 0.15 }
  # 모자라면 사기가 떨어지고 사람이 죽는 자원
  vital: [food, water]
  # 모자라면 사기만 떨어지는 자원 (겨울 추위)
  hardship: [fuel]
  ammo: ammo
  medicine: medicine
  ammo_per_clash: 15
  medicine_per_casualty: 2
  # 공격 성향 1당 하루에 공격에 나설 확률
  attack_chance_per_aggression: 0.12
  # 배급: 무리의 식량이 며칠 치 남았는지로
  ration:
    resource: food
    levels:
      # hunger: 이 배급을 받는 하루 동안 허기가 움직이는 단계 (음수면 나아진다), hunger_max: 이 배급으로는 여기까지만 배고파진다
      - { min_days: 10, label: 정량, hunger: -2 }
      - { min_days: 4, label: 줄어든 배급, hunger: 1, hunger_max: hungry }
      - { min_days: 1, label: 반쪽 배급, hunger: 1, hunger_max: starving }
      - { min_days: 0, label: 배급 끊김, hunger: 1 }
  # 사기 -3 ~ +3
  morale_labels: [무너지기 직전, 흉흉함, 가라앉음, 그럭저럭, 괜찮음, 들떠 있음, 기세등등]
  # 무리 형편을 대하는 말투 (12-105): 장면의 같은 무리 사람이 어려움을 어떻게 입에 올리는지. 트레잇이 가장 많이 겹치는 것
  talk:
    attitudes:
      - { id: grumble, label: 투덜댄다, hint: "몫이 줄었다, 윗사람들은 뭐 하냐는 불평. 남 탓이 섞인다", traits: [cynical, greedy, lazy, hot_tempered, weary, blunt] }
      - { id: rally, label: 다독인다, hint: "버티면 된다, 서로 나누자는 말. 일부러 밝게 군다", traits: [eager, warm, protective, principled, motherly, genial] }
      - { id: worry, label: 불안해한다, hint: "이러다 어떻게 되냐고 묻고 소문을 확인하려 든다", traits: [timid, cautious, curious, talkative] }
      - { id: reckon, label: 셈한다, hint: "감정 없이 며칠 버틸지, 누가 먼저 빠질지 따진다", traits: [cold, calculating, meticulous, ruthless] }
    default: { label: 조심스럽게 입에 올린다, hint: "지나가듯 한마디 하고 화제를 돌린다" }
    # 다른 무리의 형편은 말이 모이는 곳에서 소문으로 듣는다. 무리마다 하루 35%, 멀쩡한 무리도 10%로 헛소문 (*임시*)
    # exaggerate: 그곳의 말이 한 단계 부풀려질 확률. 상인 장터는 정확하고, 피난민이 모이는 성당은 과장이 심하다
    rumor:
      chance: 0.35
      false_chance: 0.1
      zones:
        e_market: { exaggerate: 0.1 }
        water_plant: { exaggerate: 0.2 }
        rest_stop: { exaggerate: 0.3 }
        old_town: { exaggerate: 0.4 }
        cathedral: { exaggerate: 0.5 }
  # 창고 사정 (며칠 치 남았는지)
  stock_labels:
    - { min_days: 20, label: 넉넉하다는 말 }
    - { min_days: 7, label: 빠듯하다는 말 }
    - { min_days: 1, label: 바닥이 보인다는 말 }
    - { min_days: 0, label: 다 떨어졌다는 말 }
  # 전황 소식. {attacker} {defender} {zone}, 사상자는 {attacker_loss} {defender_loss} (대략적인 말)
  news:
    raid_success: "{attacker:이/가} {zone}에서 {defender}의 물자를 털어 갔다고 한다. {defender} 쪽 사상자 {defender_loss}, {attacker} 쪽 {attacker_loss}"
    raid_failure: "{attacker:이/가} {zone}의 {defender} 물자를 노렸다가 쫓겨났다고 한다. {attacker} 쪽 사상자 {attacker_loss}"
    skirmish_success: "{zone} 근처에서 {attacker:과/와} {defender:이/가} 부딪쳤고, {defender} 쪽이 밀렸다고 한다. {defender} 쪽 사상자 {defender_loss}, {attacker} 쪽 {attacker_loss}"
    skirmish_failure: "{zone} 근처에서 {attacker:과/와} {defender:이/가} 부딪쳤고, {attacker} 쪽이 물러났다고 한다. {attacker} 쪽 사상자 {attacker_loss}, {defender} 쪽 {defender_loss}"
    assault_success: "{attacker:이/가} {zone:을/를} 공격해 {defender}에게서 빼앗았다고 한다. {defender} 쪽 사상자 {defender_loss}, {attacker} 쪽 {attacker_loss}"
    assault_failure: "{attacker:이/가} {zone:을/를} 공격했지만 {defender:이/가} 막아 냈다고 한다. {attacker} 쪽 사상자 {attacker_loss}, {defender} 쪽 {defender_loss}"
    occupy: "{attacker:이/가} 비어 있던 {zone}에 사람을 보내 자리를 잡았다고 한다"

# 전투 장면 (9-1, 기획서 9.5). 플레이어가 있는 교전을 라운드 단위로 푼다 (수치는 *임시*)
# 효과의 결과: momentum 전세(우리 편 기준), alarm 경보, advance 위치 전진, enemy_losses 적 사상자, destroy_objective 목표물 파괴
# min_harm: GM이 선언해야 하는 최소 몸의 위험. none이면 대가는 경보·전세로만 온다 (숨어들기는 들키는 것이 대가)
battle:
  round_minutes: 10
  max_rounds: 8
  momentum_to_win: 5
  max_alarm: 3
  positions:
    - { id: line, label: 전선 }
    - { id: flank, label: 측면 }
    - { id: rear, label: 적 후방 }
  objectives:
    - { id: leader, label: 지휘하는 자 }
    - { id: ammo_pile, label: 탄약 더미 }
    - { id: gun_nest, label: 기관총 자리 }
  preparations:
    - id: wire_trap
      label: 철사 덫
      description: 길목에 철사와 깡통을 엮어 걸려 넘어지게 하고 소리로 알린다
      requires_item: wire_roll
    # 12-176 (*임시*): 쓰고도 남는 엄폐·사격 자리, 전투 한 번을 버티고 부서지는 바리케이드
    - id: sandbags
      label: 모래주머니 엄폐
      description: 천 자루에 흙을 채워 전선에 허리 높이로 쌓는다. 몸을 숨기고 버틸 수 있다
      materials: { cloth: 2 }
    - id: firing_post
      label: 사격 자리
      description: 판자로 받침과 가림막을 대어 길목이 내려다보이는 자리를 만든다
      materials: { planks: 1 }
    - id: road_barricade
      label: 바리케이드
      description: 판자와 고철로 길목을 막는다. 밀고 들어오는 적의 발을 두어 번 묶고, 감염체도 쉽게 넘어오지 못한다. 한 번의 싸움을 버티면 무너진다
      materials: { planks: 3, scrap_metal: 2 }
      holds: 2
      infested_rise: 0.5
  effects:
    - id: hold
      label: 버티며 싸우기
      description: 전선에서 엄폐하며 맞서 싸운다
      min_harm: light
      positions: [line]
      outcomes:
        success: { momentum: 1, enemy_losses: 1 }
        partial: { momentum: 1 }
        miss: { momentum: -1 }
    - id: sneak
      label: 숨어들기
      description: 적 눈을 피해 측면으로, 다시 적의 뒤로 파고든다
      min_harm: none
      positions: [line, flank]
      max_alarm: 1
      outcomes:
        success: { advance: 1 }
        partial: { advance: 1, alarm: 1 }
        miss: { alarm: 2 }
    - id: silence
      label: 소리 없이 해치우기
      description: 경보가 울리기 전에 보초나 연락병을 먼저 쓰러뜨린다
      min_harm: light
      positions: [flank, rear]
      max_alarm: 2
      outcomes:
        success: { alarm: -1, enemy_losses: 1 }
        partial: { enemy_losses: 1 }
        miss: { alarm: 2 }
    - id: ambush
      label: 기습
      description: 측면이나 뒤에서 덮친다. 적이 아직 모르면 더 크게 흔든다
      min_harm: light
      positions: [flank, rear]
      surprise_bonus: 1
      outcomes:
        success: { momentum: 2, enemy_losses: 2, alarm: 3 }
        partial: { momentum: 1, enemy_losses: 1, alarm: 2 }
        miss: { momentum: -1, alarm: 3 }
    - id: demolish
      label: 폭약
      description: 적 뒤쪽의 목표물(지휘하는 자, 탄약 더미, 기관총 자리)에 폭약을 터뜨린다
      min_harm: heavy
      positions: [rear]
      requires_item: explosive
      consumes_item: true
      targets_objective: true
      outcomes:
        success: { momentum: 2, enemy_losses: 2, destroy_objective: true, alarm: 3 }
        partial: { momentum: 1, destroy_objective: true, alarm: 3 }
        miss: { alarm: 3 }
    - id: spring_trap
      label: 덫 발동
      description: 미리 깔아 둔 덫으로 몰려오는 적을 끊는다
      min_harm: none
      positions: [line]
      requires_preparation: wire_trap
      outcomes:
        success: { momentum: 2, enemy_losses: 2 }
        partial: { momentum: 1, enemy_losses: 1 }
        miss: {}
    - id: cover_hold
      label: 엄폐하고 버티기
      description: 쌓아 둔 모래주머니 뒤에서 버틴다. 몸을 드러내지 않아 크게 다치지 않는다
      min_harm: none
      positions: [line]
      requires_preparation: sandbags
      keeps_preparation: true
      outcomes:
        success: { momentum: 1, enemy_losses: 1 }
        partial: { momentum: 1 }
        miss: {}
    - id: aimed_fire
      label: 자리 잡고 쏘기
      description: 미리 만든 사격 자리에서 다가오는 적을 하나씩 노린다
      min_harm: light
      positions: [line]
      requires_preparation: firing_post
      keeps_preparation: true
      outcomes:
        success: { momentum: 2, enemy_losses: 1 }
        partial: { momentum: 1, enemy_losses: 1 }
        miss: { momentum: -1 }
    - id: withdraw
      label: 물러나기
      description: 싸움에서 빠져 몸을 뺀다. 남은 싸움은 동료들이 치른다
      min_harm: light
      positions: [line, flank, rear]
      withdraw: true
      outcomes:
        success: {}
        partial: { momentum: -1 }
        miss: { momentum: -1 }

# 환경 위협: 빨리감기 중 끼어드는 이상 징후 (임시값). 조우 테이블이 생기면 바꾼다
threats:
  disturbance_chance_per_hour: { dawn: 0.05, morning: 0.03, day: 0.03, evening: 0.05, night: 0.08 }
  disturbance_details:
    - 멀리서 들리는 소리
    - 가까운 곳의 인기척
    - 어둠 속의 움직임
    - 낯선 냄새
    - 거점 쪽의 소란
