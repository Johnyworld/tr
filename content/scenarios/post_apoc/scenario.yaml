  - { id: motherly, label: 살뜰히 챙김, kind: personality, visible: true, description: 잔소리와 챙김이 함께 온다, acting: 밥은 먹었냐고 묻고 잔소리를 한다, persona: { warmth: 2, talk: 1 } }
  - { id: talkative, label: 수다쟁이, kind: personality, visible: true, description: 들은 이야기를 잘 옮긴다 (소문 2배), acting: 묻지 않은 소식까지 늘어놓는다, effects: { rumor: 2 }, persona: { talk: 2 } }
  - { id: flirt, label: 이성편력, kind: personality, visible: false, description: 이성에게 쉽게 끌리고 이성의 설득·거짓말에 약하다, acting: 이성 앞에서 말이 많아지고 허세를 부린다, effects: { attraction: { moves: [persuade, deceive] } } }

# 상대를 쓰러뜨리기 (기획서 7.5, *임시*): 부상이 중상 이상이면 무력화 (더 맞서지 못하고 뒤질 수 있다)
combat:
  incapacitated_at: serious

# 출신과 말씨 (12-142, 12-329, *임시*): 동적으로 생기는 사람(엑스트라)의 출신. weight는 대략의 인구 비율, dialect.chance는 그 출신이 사투리를 쓸 확률 (아니면 표준어).
# 사투리는 드물어야 개성이 된다: 엑스트라 열에 하나쯤 (12-329, 전에는 넷에 하나). style은 억양, 예문은 표준어에 말씨를 한 군데만 섞는다.
# GM은 억양을 서술로 한 번 알리고 대사엔 장면에 한두 군데만 섞는다 (gm_rules, 과장하거나 웃음거리로 만들지 않는다)
origins:
  - { id: capital, label: 수도권, weight: 50 }
  - id: gyeongsang
    label: 경상도
    weight: 25
    dialect:
      label: 경상도 사투리
      chance: 0.2
      style: '억양이 세고 말이 짧다. 말끝이 가끔 "~나", "~노"로 뚝 끊긴다'
      samples:
        - "뭐 하노. 빨리 와."
        - "됐다. 내가 할게."
  - id: jeolla
    label: 전라도
    weight: 10
    dialect:
      label: 전라도 사투리
      chance: 0.2
      style: '억양이 구수하고 말이 길다. 놀라면 "워메"가 튀어나온다'
      samples:
        - "워메, 이게 무슨 일이야."
        - "그러면 조금만 기다려 봐잉."
  - id: chungcheong
    label: 충청도
    weight: 10
    dialect:
      label: 충청도 사투리
      chance: 0.15
      style: '억양이 느긋하고 하고 싶은 말을 돌려 한다. 말끝에 가끔 "~유"가 붙는다'
      samples:
        - "급할 거 없어유. 천천히 해."
        - "그건 좀 어렵지 않나 싶은데."
  - id: gangwon
    label: 강원도
    weight: 3
    dialect:
      label: 강원도 사투리
      chance: 0.15
      style: '산골 억양. "마카(모두)" 같은 낱말이 가끔 섞인다'
      samples:
        - "그 고개는 마카 눈에 묻혔어."
        - "밥은 먹었나?"
  - id: jeju
    label: 제주도
    weight: 1
    dialect:
      label: 제주 말
      chance: 0.15
      style: '느린 섬 억양. 말끝이 가끔 "~수다"로 끝난다'
      samples:
        - "바람이 돌았수다. 오늘은 나가지 마."
        - "천천히 와. 밥 먹고 가."
  - id: hamgyeong
    label: 함경도
    weight: 1
    dialect:
      label: 함경도 말씨
      chance: 0.5
      style: '북에서 온 사람의 억양. 말끝이 가끔 "~음둥", "~하오"로 끝난다'
      samples:
        - "어디서 왔음둥?"
        - "괜찮소. 이런 일 처음 아니야."

# 이름 재료 (기획서 7.5): 엑스트라가 이름을 얻을 때 성 + 이름을 고른다
names:
  # 주인공 이름과 겹치는 월드 인물은 이 세계에서만 이 이름으로 바뀐다 (12-260). 월드의 어느 인물·글에도 없는 이름
  stand_ins: { male: [태경, 무진], female: [서윤, 소율] }
  surnames: [김, 이, 박, 최, 정, 강, 조, 윤, 장, 임, 한, 오, 서, 신, 권, 황, 안, 송, 유, 홍, 전, 고, 문, 손, 양, 배, 백, 허, 남, 노]
  given:
    male: [민수, 영호, 정훈, 상철, 성민, 지훈, 동욱, 재석, 태준, 현수, 병철, 승우, 기태, 준영, 광수, 대성, 우진, 형준, 진호, 석구, 명수, 철민, 경환, 도현]
    female: [미영, 지은, 수진, 은정, 혜린, 소영, 다은, 정희, 유진, 경숙, 나래, 하늘, 보람, 민지, 선영, 가윤, 예진, 순자, 영미, 지혜, 은비, 소희, 현정, 미숙]

# 매력의 수동 효과: 처음 만난 인물의 호감 + (매력 ÷ 2), 매력 +2면 호감이 오를 때 +1
charm: { ability: charm, first_impression_per: 2, bonus_at: 2 }

# 성격 축 (12-99, *임시*): 축마다 -2(low) ~ +2(high). 주인공은 만들 때 정하고, NPC는 성격 트레잇의 persona를 더한다.
# 말투·태도는 GM이 acting대로 연기하고, 결과가 남는 순간(발끈·말 새어 나감·궁합·연애 문턱)은 코드가 정한다
persona:
  axes:
    - { id: temper, low: 온화함, high: 다혈질, low_acting: [언성을 잘 높이지 않는다, 화낼 자리에서도 부드럽게 넘긴다], high_acting: [말끝에 날이 선다, 같은 지시도 거칠게 하고 도발에 쉽게 발끈한다] }
    - { id: talk, low: 과묵함, high: 수다스러움, low_acting: [말을 아낀다, 플레이어가 길게 말해도 짧게 끊어 말한다], high_acting: [말이 많다, 묻지 않은 말까지 술술 늘어놓는다] }
    - { id: impulse, low: 신중함, high: 충동적, low_acting: [한 번 더 확인하고 움직인다, 머뭇거리며 주위부터 살핀다], high_acting: [생각보다 몸이 먼저 나간다, 망설임 없이 거칠게 몸부터 움직인다] }
    - { id: warmth, low: 차가움, high: 다정함, low_acting: [표정이 적고 사무적이다, 남의 사정에 눈길을 주지 않는다], high_acting: [상대를 살뜰히 챙긴다, 다친 사람·아이에게 먼저 손을 내민다] }
    - { id: principle, low: 원칙적, high: 실리적, low_acting: [정한 선을 지키려 한다, 손해를 봐도 원칙을 굽히지 않는다], high_acting: [손익부터 따진다, 무엇이든 값을 매기고 흥정하려 든다] }
    - { id: heart, low: 금사빠, high: 돌부처, romance: true, low_acting: [호감 가는 사람 앞에서 눈길이 간다, 매력적인 사람 앞에서 말이 꼬이고 얼굴이 달아오른다], high_acting: [호감을 보여도 담담하다, 다가오는 마음을 무덤덤하게 받아넘긴다] }
  # 도발당하면 다혈질 1이면 25%, 2면 50%로 발끈한다. 상대의 호감 -1
  blowup: { axis: temper, chance: [0.25, 0.5], delta: { trust: 0, affection: -1, respect: 0 } }
  # 장면의 인물과 이야기하면 수다스러움 1이면 10%, 2면 25%로 아는 사실 하나가 새어 나간다
  leak: { axis: talk, chance: [0.1, 0.25] }
  # 대신 말이 오가면 상대도 털어놓는다: 같은 확률로 그 인물이 아는 사실 하나를 얻어듣는다 (12-107)
  hear: { axis: talk, chance: [0.1, 0.25] }
  # 성격의 득 (12-107): 다혈질이면 위협 판정 +1 (발끈하는 손해와 짝)
  edges:
    - { axis: temper, moves: [intimidate], bonus: 1 }
  # 처음 만날 때 다정함·원칙 축이 같은 쪽이면 호감 +1, 반대쪽이면 -1 (합 -2~2)
  rapport: { axes: [warmth, principle], same: 1, opposite: -1 }
  # 빈 축 채우기: NPC의 성격 트레잇이 정하지 않은 축은 인물 id에서 이 무게로 뽑는다 (판마다 같다, *임시*).
  # 대부분 0이나 1이고 2는 드물다. 금사빠 ↔ 돌부처는 트레잇이 정하지 않아 더 넓게
  fill:
    temper: { "-2": 0.05, "-1": 0.2, "0": 0.5, "1": 0.2, "2": 0.05 }
    talk: { "-2": 0.05, "-1": 0.2, "0": 0.5, "1": 0.2, "2": 0.05 }
    impulse: { "-2": 0.05, "-1": 0.2, "0": 0.5, "1": 0.2, "2": 0.05 }
    warmth: { "-2": 0.05, "-1": 0.2, "0": 0.5, "1": 0.2, "2": 0.05 }
    principle: { "-2": 0.05, "-1": 0.2, "0": 0.5, "1": 0.2, "2": 0.05 }
    heart: { "-2": 0.1, "-1": 0.25, "0": 0.3, "1": 0.25, "2": 0.1 }
  # NPC의 금사빠 ↔ 돌부처 1단계마다 마음이 생기는 호감·고백을 받아들이는 호감이 1 달라진다 (돌부처 쪽이 높다)
  romance: { axis: heart, per_level: 1 }

# 시스템이 특정 역할로 쓰는 행동 (목격자 살피기, 목격 확률 낮추기, 거짓 소문 퍼뜨리기 12-151)
move_roles:
  notice: sense_danger
  stealth: stealth
  deceive: deceive

# 수색을 돕는 지식: 역사를 익혔으면 수색 판정 +1 (옛 지도·건물 용도를 안다, 12-220, *임시*)
search_lore: { skill: history, bonus: 1 }

# 말로 캐물어 알아내는 판정 (설계 목록 7-1): 맞으면 상대가 아는 것을 남기는 길을 GM에게 알린다
ask_moves: [persuade, deceive, intimidate, insight]

# 증상 (12-74): 플레이어에게 보이는 몸 상태. 상태 트랙의 단계가 증상을 가리키고, 화면·?상태에는 증상만 보인다 (원인은 숨긴다).
# 같은 group은 크기 차이라 가장 큰 것(아래쪽) 하나만 보인다. 판정 보정: 가장 큰 증상은 그대로, 나머지 합은 반(올림)만 더한다
# (1+1 → -2, 3+2 → -4). tone: 화면 색 (없으면 보정 크기로). 보정은 작아도 마지막 단계급인 증상은 3 (*임시* 수치)
symptoms:
  # 열 묶음은 질병·감염·추위가 같이 쓴다 (원인을 숨긴다, 12-74). 그래서 hint도 원인을 가리지 않는다. 12-193: 질병·감염의 첫 증상은 몸살 기운, 추위의 첫 증상은 추움 (12-194에 나눔)
  - { id: cold_chill, label: 추움, group: fever, penalty: -1, hint: "몸이 식었다. 불 곁이나 따뜻한 데서 쉬면 풀린다" }
  - { id: chill, label: 몸살 기운, group: fever, penalty: -1, hint: "열 기운이 돈다. 앓는 병이면 잘 먹고 따뜻하게 자면 낫고, 해열제가 듣는다. 감염체에게 다친 적이 있다면 혈청만 듣는다" }
  - { id: shiver, label: 오한, group: fever, penalty: -2, hint: "몸이 떨린다. 추위라면 불 곁에서 녹이고, 앓는 병이면 잘 먹고 따뜻하게 자면 낫는다. 감염체에게 다친 적이 있다면 혈청만 듣는다" }
  - { id: high_fever, label: 고열, group: fever, penalty: -3, hint: "열이 높다. 더 깊어지면 몸이 상한다. 감염체에게 다친 적이 있다면 혈청만 듣는다" }
  - { id: pain, label: 경상, group: pain, penalty: -1 }
  - { id: severe_pain, label: 중상, group: pain, penalty: -2 }
  - { id: agony, label: 치명상, group: pain, penalty: -3 }
  - { id: hungry, label: 허기짐, group: hunger, penalty: -1 }
  - { id: starving, label: 굶주림, group: hunger, penalty: -2 }
  - { id: starvation, label: 기아, group: hunger, penalty: -3 }
  - { id: thirsty, label: 목마름, group: thirst }
  - { id: parched, label: 탈수, group: thirst, penalty: -1 }
  - { id: severe_dehydration, label: 심한 탈수, group: thirst, penalty: -2 }
  - { id: impaired, label: 의식장애, group: consciousness, penalty: -1, tone: 3 }
  # 의식불명: 스스로 아무것도 하지 못한다 (판정·이동·대화·이야기 없이 시간만 흐르고, 남이 돌볼 수만 있다)
  - { id: unconscious, label: 의식불명, group: consciousness, tone: 3, incapacitates: true }
  - { id: nausea, label: 메스꺼움, penalty: -1, tone: 3 }
  - { id: distressed, label: 심란함, group: mind }
  - { id: depressed, label: 우울함, group: mind, penalty: -1 }
  - { id: frantic, label: 미칠 것 같음, group: mind, penalty: -2 }
  - { id: breakdown, label: 멘탈붕괴, group: mind, penalty: -3 }
  # 공포 (12-95, *임시*): 그 자리에서 오르고 몇 시간 안에 빠진다
  # 피로 (12-114)
  # 담배 (12-129): 골초 트레잇이 담배 없이 하루를 넘기면
  - { id: restless, label: 안절부절, group: craving, penalty: -1 }
  # 술·진통제·마약 (12-157): 기운은 다른 증상의 보정을 가린다 (증상은 보인다). 끊으면 금단
  - { id: tipsy, label: 얼큰함, group: drink, masks: [fear] }
  - { id: drunk, label: 취함, group: drink, penalty: -1, masks: [fear] }
  - { id: numbed, label: 진통제 기운, group: numb, masks: [pain] }
  - { id: wired, label: 각성, group: wired, masks: [fatigue] }
  - { id: shakes, label: 손떨림, group: craving, penalty: -2 }
  - { id: withdrawal, label: 금단 증상, group: craving, penalty: -2, tone: 3 }
  - { id: drowsy, label: 졸림, group: fatigue }
  - { id: weary, label: 지침, group: fatigue, penalty: -1 }
  - { id: exhausted, label: 탈진, group: fatigue, penalty: -2 }
  - { id: tense, label: 긴장, group: fear }
  - { id: scared, label: 겁먹음, group: fear, penalty: -1 }
  - { id: panic, label: 공황, group: fear, penalty: -2, tone: 3 }
  # 출혈 (12-91): 판정 보정은 없다. 지금 피가 나는지 알려 준다
  - { id: scratch, label: 긁힘, group: bleeding }
  - { id: bleeding, label: 출혈, group: bleeding, tone: 2 }
  - { id: heavy_bleeding, label: 심한 출혈, group: bleeding, tone: 3 }
  - { id: death, label: 사망, group: death }
  # 변이: 감염으로 죽어 감염체가 된다. 그 자리에 감염체로 남는다 (body.infection.turns_into, 12-117)
  - { id: turned, label: 변이, group: death }

# 상태 트랙. 앞에서 뒤로 악화된다. fatal 단계에 이르면 사망. 단계 이름·판정 보정은 증상에서 나온다 (GM에게는 트랙 이름과 함께 보인다)
condition_tracks:
  - id: harm
    label: 부상
    icon: heart
    levels:
      - { id: none }
      - { id: light, symptoms: [pain] }
      - { id: serious, symptoms: [severe_pain] }
      - { id: critical, symptoms: [agony] }
      - { id: impaired, symptoms: [agony, impaired] }
      - { id: unconscious, symptoms: [unconscious] }
      - { id: dead, symptoms: [death], fatal: true }
  # 허기 (12-1): 하루마다 배급 수준만큼 바뀐다. 끝까지 가면 굶어 죽는다
  - id: hunger
    label: 허기
    icon: hunger
    levels:
      - { id: fed }
      - { id: hungry, symptoms: [hungry] }
      - { id: starving, symptoms: [starving] }
      - { id: famished, symptoms: [starvation] }
      - { id: faint, symptoms: [starvation, impaired] }
      - { id: unconscious, symptoms: [unconscious] }
      - { id: starved, symptoms: [death], fatal: true }
  # 갈증 (12-97, *임시*): 허기보다 빨리 죽는다 (물 없이 나흘째 쓰러지고 닷새째 죽는다)
  - id: thirst
    label: 갈증
    icon: water
    levels:
      - { id: quenched }
      - { id: thirsty, symptoms: [thirsty] }
      - { id: parched, symptoms: [parched] }
      - { id: severe, symptoms: [severe_dehydration, impaired] }
      - { id: unconscious, symptoms: [unconscious] }
      - { id: dead, symptoms: [death], fatal: true }
  # 감염 (12-1): 감염체에게 다치면 확률로 잠복기. 잠복기는 캐릭터가 모른다(hidden). 하루마다 나빠지고, 끝까지 가면 변이한다
  # 물리고 변이까지 여드레 (12-109: 닷새면 혈청을 찾을 틈이 없었다). 같은 증상이 이틀 가는 단계가 있다
  - id: infection
    label: 감염
    icon: virus
    levels:
      - { id: clean }
      - { id: incubating, label: 잠복, hidden: true }
      - { id: incubating_late, label: 잠복, hidden: true }
      - { id: chill, symptoms: [chill] }
      - { id: shiver, symptoms: [shiver] }
      - { id: shiver_deep, label: 깊은 오한, symptoms: [shiver] }
      - { id: fever, symptoms: [high_fever] }
      - { id: fever_deep, label: 깊은 고열, symptoms: [high_fever] }
      - { id: grave, symptoms: [high_fever, nausea] }
      - { id: turned, symptoms: [turned], fatal: true }
  # 추위 (12-4): 계절·날씨만큼 추워진다. 연료가 있는 우리 거점에서는 녹는다. 끝까지 가면 얼어 죽는다
  - id: cold
    label: 추위
    icon: cold
    levels:
      - { id: warm }
      - { id: cold, symptoms: [cold_chill] }
      - { id: shiver, symptoms: [shiver] }
      - { id: hypothermia, symptoms: [shiver, impaired] }
      - { id: unconscious, symptoms: [unconscious] }
      - { id: frozen, symptoms: [death], fatal: true }
  # 질병 (12-4): 몸이 약해지면 걸린다. 잠복기는 캐릭터가 모른다. 고열까지 가고, 배부르고 따뜻하면 낫는다 (죽지 않는다)
  - id: disease
    label: 질병
    icon: fever
    levels:
      - { id: healthy }
      - { id: incubating, label: 잠복, hidden: true }
      - { id: chill, symptoms: [chill] }
      - { id: shiver, symptoms: [shiver] }
      - { id: sick, symptoms: [high_fever] }
  # 출혈 (12-91): 날붙이·찔림·총상·물림으로 다치면 부상 단계만큼 오른다. 보정은 없고, 시간이 흐르면 부상을 키운다. 지혈해야 멎는다
  - id: bleeding
    label: 출혈
    icon: blood
    levels:
      - { id: none }
      - { id: scratch, symptoms: [scratch] }
      - { id: bleeding, symptoms: [bleeding] }
      - { id: heavy, symptoms: [heavy_bleeding] }
  # 마음 (12-48): 크게 다치거나 곁의 사람이 죽는 것을 보면 흔들린다. 무너져도 죽지는 않는다 (판정만 어렵다)
  - id: nerves
    label: 마음
    icon: mind
    levels:
      - { id: steady }
      - { id: shaken, symptoms: [distressed] }
      - { id: low, symptoms: [depressed] }
      - { id: frayed, symptoms: [frantic] }
      - { id: broken, symptoms: [breakdown] }
  # 피로 (12-114, *임시*): 깨어 있은 시간만큼 쌓이고 자면 풀린다. 죽지는 않는다 (판정만 어렵다)
  - id: fatigue
    label: 피로
    icon: moon
    levels:
      - { id: rested }
      - { id: drowsy, symptoms: [drowsy] }
      - { id: weary, symptoms: [weary] }
      - { id: exhausted, symptoms: [exhausted] }
  # 공포 (12-95): 감염체·떼·기습 앞에서 오르고, 위협이 없으면 시간마다 가라앉는다. 판정만 어렵다
  - id: fear
    label: 공포
    icon: mind
    levels:
      - { id: calm }
      - { id: tense, symptoms: [tense] }
      - { id: scared, symptoms: [scared] }
      - { id: panic, symptoms: [panic] }
  # 담배 (12-129): 골초(traits.chain_smoker)만 오른다. 하루가 지나며 한 갑을 피우거나 담배를 피우면(consumables) 풀린다
  - id: craving
    label: 담배
    icon: fire
    quiet: true
    levels:
      - { id: satisfied }
      - { id: restless, symptoms: [restless] }
  # 술·진통제·각성제 기운 (12-157): 쓰면 오르고 body.wear_off 시간마다 한 단계 빠진다
  - id: drink
    label: 술기운
    icon: mind
    quiet: true
    levels:
      - { id: sober }
      - { id: tipsy, symptoms: [tipsy] }
      - { id: drunk, symptoms: [drunk] }
      - { id: wasted, symptoms: [drunk, nausea] }
  - id: numb
    label: 진통
    icon: heart
    quiet: true
    levels:
      - { id: none }
      - { id: numbed, symptoms: [numbed] }
      - { id: deep, symptoms: [numbed] }
  - id: wired
    label: 각성
    icon: moon
    quiet: true
    levels:
      - { id: none }
      - { id: wired, symptoms: [wired] }
      - { id: high, symptoms: [wired] }
  # 버릇의 금단 (12-157): 술꾼·진통제 의존·각성제 중독. 하루치를 못 하면 한 단계씩 오르고, 끝 단계를 버티면 끊는다 (habit.quit_days)
  - id: craving_drink
    label: 술
    icon: fire
    quiet: true
    levels:
      - { id: satisfied }
      - { id: restless, symptoms: [restless] }
      - { id: shakes, symptoms: [shakes] }
  - id: craving_pills
    label: 약
    icon: fire
    quiet: true
    levels:
      - { id: satisfied }
      - { id: restless, symptoms: [restless] }
      - { id: withdrawal, symptoms: [withdrawal, nausea] }
  - id: craving_stim
    label: 각성제
    icon: fire
    quiet: true
    levels:
      - { id: satisfied }
      - { id: restless, symptoms: [restless, drowsy] }
      - { id: withdrawal, symptoms: [withdrawal, weary] }
# 인물 카드(alias·look)가 이 낱말로 다쳤거나 앓는다고 쓰면 npcs의 starts에 그 트랙의 시작 상태가 있어야 한다 (content:check, 플레이 테스트 14)
# 붕대·오래된 흉터처럼 다 나은 것은 넣지 않는다
card_body_words:
  harm: "다친|다쳤|부러진|부러졌|절뚝|판자로 묶"
  disease: "열에 들뜬|고열|앓는|앓고"
# apply_harm이 쓰는 트랙
harm_track: harm

# 소속 등급 사다리. level은 지휘 계통상의 높이 (화법 규칙에 쓴다)
# resident(주민: 전투 조직 밖에서 무리의 살림을 맡는 사람. 예전 id staff는 "간부"로 읽혀 배역에 잘못 쓰였다, 12-310)와 leader(지도부)는 기획서 12.3 예시에 더해 쓰는 곳이 있어 둔다
rank_ladder:
  - { id: loner, label: 떠돌이, level: 0 }
  - { id: outsider, label: 외부 무리 일원, level: 0 }
  - { id: grunt, label: 분대원, level: 1 }
  - { id: resident, label: 주민, level: 1 }
  - { id: squad_leader, label: 분대장, level: 2 }
  - { id: officer, label: 간부, level: 3 }
  - { id: leader, label: 지도부, level: 4 }
# 진급 경로 (MVP: 분대원 → 분대장)
promotion: { from: grunt, to: squad_leader }

# 직분 (기획서 12.6): 무리 안에서 맡은 일. 시나리오(역할)와 인물이 정한다 (새 게임에서 따로 고르지 않는다, 12-80).
# 직분마다 훈련·도구가 더해지고, 일감(missions)과 이야기(태그 occ_<id>)가 붙는다.
# 직분 안의 사다리는 없다. 계급(분대원·분대장·간부)이 곧 사다리다 (12-83)
# - 군: 수색대원(나가는 사람: 폐허·길·전선·습격·호위), 수비대원(지키는 사람: 담·문·창고), 의무병. 큰 전쟁이 나면 모두 나간다
# - 살림: 요리사, 목수, 상인, 종교인, 정비공, 간호사, 의사 (간호사·의사는 붕괴 전에 의술을 배운 사람)
# 떠돌이는 직분이 없다. 스킬은 직분이 아니라 과거 배경(creation.pasts)에서 온다 (12-84)
occupations:
  - id: cook
    label: 요리사
    summary: 무리의 솥을 맡는다. 모자란 재료로 배급을 늘리고, 식당에서 오가는 말을 가장 먼저 듣는다
    skills: [survival]
    kit: [kitchen_knife, canned_food]
    missions: [occ_cook_morning_pot, occ_cook_stretch, occ_cook_forage, occ_cook_salt_store]
  - id: carpenter
    label: 목수
    summary: 담과 문, 지붕과 침상을 고친다. 무너진 데를 메우는 사람이라 어디든 불려 다닌다
    skills: [carpentry]
    kit: [carpentry_kit, planks]
    missions: [occ_carpenter_wall_patch, occ_carpenter_roof, occ_carpenter_watchtower, occ_carpenter_timber_run, occ_carpenter_war_repair]
  - id: trader
    label: 상인
    summary: 무리의 물건을 바깥과 바꾼다. 값과 소문을 다루고, 무리 밖에도 아는 얼굴이 많다
    skills: [persuade]
    kit: [trade_token, cigarettes]
    missions: [occ_trader_market_run, occ_trader_price_ears, occ_trader_credit_book, occ_trader_stock_count]
  - id: preacher
    label: 종교인
    summary: 무너진 세상에서 기도와 장례를 맡는다. 사람들의 고해를 듣고, 무리의 사기를 붙든다
    skills: [endure]
    kit: [blanket]
    missions: [occ_preacher_burial, occ_preacher_sickbed, occ_preacher_evening_word, occ_preacher_quarantine_rite]
  - id: medic
    label: 의무병
    summary: 다친 사람을 꿰매고 열을 내린다. 약이 모자란 날마다 누구를 먼저 볼지 정해야 한다
    skills: [first_aid]
    kit: [bandage]
    missions: [occ_medic_rounds, occ_medic_boil, occ_medic_pharmacy, occ_medic_field, occ_medic_war_wounded]
  - id: mechanic
    label: 정비공
    summary: 총과 펌프, 발전기와 무전기를 살린다. 쇳소리와 기름 냄새 속에서 산다
    skills: [mechanics]
    kit: [toolkit, scrap_metal]
    missions: [occ_mechanic_rifle_service, occ_mechanic_generator, occ_mechanic_radio, occ_mechanic_parts_run]
  - id: scavenger
    label: 수색대원
    summary: 담 밖으로 나가는 사람. 폐허를 뒤지고, 길을 살피고, 싸움이 나면 총을 든다. 무리의 시나리오 임무와 이야기를 그대로 받는다
    skills: [shoot, scavenge]
    kit: [flashlight, crowbar]
    missions: [occ_scavenger_sweep, occ_scavenger_mark_route, occ_scavenger_medicine, occ_scavenger_haul, occ_scavenger_war_traces]
  - id: guard
    label: 수비대원
    skills: [sense_danger]
    summary: 담과 문, 창고와 우물을 지킨다. 바깥에 나가는 날은 적지만, 거점이 습격당하면 가장 먼저 맞선다
    kit: [binoculars]
    missions: [occ_guard_gate, occ_guard_perimeter, occ_guard_war_hold]
  - id: nurse
    label: 간호사
    summary: 붕괴 전에 간호를 배웠다. 상처를 꿰매고 열을 재고, 환자 곁을 지킨다. 귀한 사람이라 바깥 싸움에는 내보내지 않는다
    skills: [first_aid]
    kit: [fever_reducer]
    storylet_tag: occ_medic
    missions: [occ_medic_rounds, occ_medic_boil, occ_medic_pharmacy, occ_medic_war_wounded]
  - id: doctor
    label: 의사
    summary: 붕괴 전에 의사였다. 약이 없어도 무엇이 사람을 죽이는지 안다. 무리마다 탐내는 사람이라 바깥에는 나가지 않는다
    skills: [first_aid]
    kit: [fever_reducer, medkit]
    storylet_tag: occ_medic
    missions: [occ_medic_rounds, occ_medic_pharmacy, occ_medic_war_wounded]
  # 성인 직업 (공통 규칙 21, docs/mature-plan.md 1): 사람(NPC)만 맡고 주인공은 고르지 않는다. 성인 옵션이 꺼져 있으면 cover(겉 직업)로 보인다
  - id: sex_worker
    label: 매춘부
    summary: 몸을 팔아 먹고산다. 대개 빚에 묶여 있고, 방값과 옷값을 떼어 가는 사람이 따로 있다. 손님의 입에서 나오는 소식을 가장 먼저 듣는다
    mature: true
    cover: { label: 술집 일꾼, summary: 술상을 차리고 빨래와 설거지를 한다. 손님 입에서 나오는 소식을 가장 먼저 듣는다 }
  - id: pimp
    label: 포주
    summary: 방과 술을 팔고, 그 방에서 일하는 사람들의 몫을 떼어 간다. 빚 장부로 사람을 묶어 둔다
    mature: true
    cover: { label: 여관 주인, summary: 방과 술을 팔아 먹고산다. 오가는 짐꾼과 호위대가 그 집에서 묵는다 }

speech_rules: speech/post_apoc.yaml
# GM 지침 (두 플레이 모드가 같은 파일을 읽는다, 기획서 11.6)
gm_tone: prompts/post_apoc_tone.md
gm_rules: prompts/gm_rules.md
mcp_guide: prompts/mcp_play.md
# 새 게임을 시작할 때 들려주는 세계와 지금 상황 (시작 캐릭터가 아는 것만)
intro: prompts/intro.md

# 부상 회복 (*임시*). 치료사에게 받거나, 새 부상 없이 며칠 지나면 조금씩 낫는다
recovery:
  natural_days: 2
  # 중상까지는 저절로 낫는다. 치명상은 치료가 필요하다 (NPC의 하루 단위 회복)
  # 주인공은 푹 잔 밤에 낫는다 (플레이 테스트 11, A1): 6시간 이상 자면 피가 멎어 있고 자는 사이 새로 다치지 않았을 때 한 단계. 치명상은 이틀에 한 번
  # 치명상·의식장애(impaired)도 이틀에 한 번 (플레이 테스트 11: 약탈조 판이 닷새 동안 의식장애에 묶여 급한 이야기만 열렸다)
  # 경상·중상은 이틀, 치명상·의식장애는 사흘에 한 번 (12-266, 사용자 결정. PT16~18 분대장: 중상이 치료 한 번과 하룻밤 잠으로 다 나았다)
  sleep_heal: { min_hours: 6, max_level: impaired, slow: { light: 2, serious: 2, critical: 3, impaired: 3 } }
  natural_max_level: serious
  # 의식불명에 이만큼(시간) 머물면 정신이 든다 (의식장애로 한 단계). 그사이 더 다치면 다시 센다 (*임시*)
  wake_hours: 6
  # 치료사에게 받으면 (하루 한 번) 트랙별로 낫는 단계
  # 감염은 치료사도 떼지 못한다 (혈청뿐, body.infection.cure)
  healer: { harm: 1, disease: 1, bleeding: 3 }
  # 치료사의 재료와 값 (플레이 테스트 11): 치료마다 치료사 무리의 의약품 1. 다른 무리·무소속은 물건으로 값 3 (치료사의 신뢰 2 이상이면 공짜)
  healer_cost: { resource: medicine, fee: 3, free_trust: 4 }
  # 무리의 돌봄 (12-52): 의무병 한 사람이 하루 두 명까지, 무리의 의약품으로 부상 한 단계에 1. 감염은 떼지 못한다
  faction_care: { occupations: [medic, nurse, doctor], resource: medicine, per_medic: 2 }
  # 주인공이 아이템 없이 남을 돌보는 조건: 의무병이거나 응급처치 +1 이상
  first_aid: { occupations: [medic, nurse, doctor], skill: first_aid, min: 1 }
  # 수술 (12-159, *임시*): 치명상 이상을 돌보는 것은 판정이다. 치료사는 2d6 + 지능·응급처치 + 장소(하얀매 진료소 +1, 거점 밖 -1)로 코드가 굴리고,
  # 주인공이 남을 돌보면 응급처치 판정이 있어야 한다. 실패하면 한 단계 나빠지고, 대가 있는 성공은 흔적(scars)을 굴린다
  # 수술은 스킬 "수술"을 배워야 한다 (플레이 테스트 11, 4.2.1): 전문 기술이라 배운 상태(-1) 이상이면 수술할 수 있다. 치료사도 주인공도 배우지 않았으면 치명상을 손대지 못한다 (피만 멎게 한다)
  surgery: { from: critical, move: surgery, stat: intellect, min_skill: -1, clinics: [d_clinic], clinic_bonus: 1, field_penalty: -1 }

# 수위 (12-57): 성인 주제(연애·성적 위협) 이야기의 태그와 나이 하한. 세계의 수위가 꺼져 있으면 이 태그 이야기는 열리지 않고,
# 켜져 있어도 주인공과 배역이 모두 이 나이 이상이어야 열린다
content_rating: { tag: mature, adult_age: 18 }

# 연애 (12-58): 둘 다 성인일 때만 (수위와 상관없다. 수위는 잠자리·성적 위협만 가린다). 끌림은 인물마다 (npcs의 attracted_to, 없으면 이 비율로 인물 id에서)
romance:
  # 동성 사이는 다루지 않는다 (docs/mature-plan.md 6, romanceAllowed도 다른 성별끼리만)
  orientation: { other: 0.97, both: 0, same: 0, none: 0.03 }
  interest_affection: 6
  # 나이 차가 15살을 넘으면 마음이 생기지 않는다 (12-195)
  age_gap: 15
  accept: { affection: 8, trust: 4 }
  flirt_moves: [persuade, deceive]
  grief_nerves: 2

# 포로 (12-55): 진 전투에서 물러나지 않았으면 빠져나가기를 굴려 실패하면 붙잡힌다 (항복하면 반드시). 갇힌 동안은 태그 captivity 이야기만 열린다
captivity:
  tag: captivity
  # 빠져나가기 (12-220): 운동(달려서)·은밀(숨어서) 중 주인공에게 나은 것. 대가 있는 성공은 무기·탄을 버리고 빠져나간다.
  # 의식불명은 helpless 규칙(적의 손에 떨어짐)이 먼저 맡는다
  flee_moves: [athletics, stealth]
  # 공구·정찰 도구도 빼앗는다 (플레이 테스트 13: 쌍안경으로 감옥 경계 +1, 철사로 빗장을 땄다). 먹을 것·물·완장은 남긴다
  confiscate: [weapon, ammo]
  confiscate_items: [binoculars, toolkit, carpentry_kit, flashlight, radio, wire_roll]
  escape_moves: [stealth, endure]
  # 탈출의 빈틈을 기다리는 시간 (플레이 테스트 12, *임시*). 실패할 때마다 다음 탈출 판정 -1
  escape_hours: [1, 4]
  # 갇힌 동안 허기는 굶주림까지만 (붙잡은 쪽이 겨우 먹인다)
  hunger_floor: starving
  # 우리 무리가 붙잡힌 것을 알면 (곁에서 본 사람·혼자 돌아간 짝) 구하러 오는 이야기(벽 너머의 신호)가 열린다 (12-264). 짐꾼에게 소식을 맡겨도 같은 플래그
  known_flag: cp_word_sent
  upkeep: { resource: food, amount: 1 }
  labor: { resource: food, amount: 2 }
  ransom: { resource: ammo, amount: 8 }
  interrogate_moves: [intimidate, insight]
  recruit_move: persuade
  war_capture_chance: 0.12
  # 무리 사이 싸움에서 붙잡혀 갈 수 있는 계급 (12-243)
  war_capture_ranks: [grunt, squad_leader]

# 상처 종류와 출혈 (12-91, *임시*): 몸의 위험을 걸 때 GM이 상처 종류(harm_kind)를 고른다
wounds:
  # attack: 누가 낸 상처라 상대를 두지 않아도 방어구가 막는다. 나머지(베임·찔림·타박)는 맞서는 상대가 있을 때만 막는다 (덫·유리·추락은 막지 않는다)
  kinds:
    - { id: cut, label: 베임 (칼·날붙이·유리), bleeds: true }
    - { id: pierce, label: 찔림 (창·꼬챙이·화살), bleeds: true }
    - { id: gunshot, label: 총상, bleeds: true, attack: true }
    - { id: claw, label: 할큄 (손톱), bleeds: true, attack: true }
    - { id: bite, label: 물림 (이빨), bleeds: true, attack: true }
    - { id: blunt, label: 둔기·타박 (몽둥이·주먹·추락), bleeds: false }
    - { id: other, label: 그 밖 (화상·삠·탈진 등), bleeds: false }
  track: bleeding
  # 피가 나는 종류로 다쳐 부상이 이 단계가 되면 출혈이 여기까지 오른다
  from_harm: { light: scratch, serious: bleeding, critical: heavy, impaired: heavy, unconscious: heavy }
  # 이만큼(시간) 피를 흘릴 때마다 부상이 한 단계 나빠진다
  worsen_hours: { bleeding: 6, heavy: 1 }
  # 긁힘은 한 시간이면 저절로 멎는다
  clot_hours: { scratch: 1 }
  # 출혈 이상이면 정신이 들지 않고 저절로 낫지 않는다
  blocks_recovery_from: bleeding
  # 옷을 찢어 누르는 맨손 지혈
  staunch_move: first_aid
  # 감염체에게 다칠 위험인데 종류를 비웠으면 할큄으로 본다. 감염은 피가 나는 상처일 때만 굴린다
  infected_default: claw

# 큰 재난 (12-169, *임시*): 한 해에 두어 번 (앞 재난에서 25일 넘게 지나서), 사흘 전에 전조. 전조 이야기에서 대비하면 피해가 준다 (한 번 25%, 최대 50%).
# 거점을 덮친 큰불·떼·돌림병은 15%로 그 무리가 거점을 잃는다 (대비한 만큼 덜)
disasters:
  per_year: 2
  min_gap_days: 25
  warn_days: 3
  collapse_chance: 0.15
  kinds:
    - id: fire
      label: 큰불
      seasons: [autumn, winter]
      target: base
      omen: 바람이 세고 마른 냄새가 난다. 누군가 아궁이 불씨를 걱정하고, 창고 뒤에 기름통이 쌓여 있다
      aftermath: 그을린 벽, 타다 남은 창고, 연기 냄새가 며칠 간다
      news: "{zone}에 큰불이 났다"
      recover_days: 6
      resources: { fuel: 0.3, food: 0.2 }
      population: 0.03
      morale: 1
      fort: 1
      break_facilities: true
      stall_yields: true
      collapse: true
    - id: flood
      label: 홍수
      seasons: [spring, summer]
      target: water
      omen: 비가 사흘째 그치지 않는다. 강물이 다리 밑까지 차올랐고, 하수구가 거꾸로 넘친다
      aftermath: 진흙에 덮인 바닥, 떠내려간 짐, 썩는 냄새
      news: "{zone:이/가} 물에 잠겼다"
      recover_days: 5
      resources: { food: 0.15, water: 0.1 }
      population: 0.02
      morale: 1
      break_facilities: true
      stall_yields: true
    - id: horde
      label: 감염체 떼의 이동
      target: infested
      omen: 담을 긁는 소리가 잦아졌다. 쥐와 들개가 한쪽으로 도망치고, 밤마다 먼 곳에서 무리 지은 울음이 들린다
      aftermath: 무너진 담 틈, 끌려간 자국, 아직 근처를 떠도는 것들
      news: "감염체 떼가 {zone:을/를} 덮쳤다"
      recover_days: 6
      population: 0.05
      morale: 1
      fort: 1
      infestation: 2
      collapse: true
    - id: cold
      label: 혹한
      seasons: [winter]
      target: all
      omen: 하늘이 낮게 내려앉았다. 새벽 서리가 한낮에도 녹지 않고, 물통에 살얼음이 낀다
      aftermath: 얼어붙은 물, 땔감 다툼, 아침마다 깨어나지 않는 사람
      news: "도시에 혹한이 닥쳤다"
      recover_days: 4
      resources: { fuel: 0.25 }
      morale: 1
      weather: cold_snap
    - id: plague
      label: 돌림병
      seasons: [winter, spring]
      target: faction
      omen: 밤새 기침하는 사람이 늘었다. 피난민 막사에서 열이 오른 아이가 둘 나왔다는 말이 돈다
      aftermath: 격리된 막사, 바닥난 약장, 마스크 대신 천을 감은 얼굴들
      news: "{faction}에 돌림병이 돈다"
      recover_days: 8
      resources: { medicine: 0.3 }
      population: 0.04
      morale: 1
      disease: 0.35
      collapse: true

# 거점 손보기 (12-167, *임시*): 떠돌이의 거처(home)와 우리 무리의 거점(base)에 짓는 시설. 판정·시간·재료는 여기, 결과는 코드.
# 시간으로는 닳지 않고, 그 구역에 습격·공격이 오면 하나가 부서진다. 거점에 지으면 성실함 행적이 남는다
facilities:
  - id: barricade
    label: 바리케이드
    description: 판자와 고철로 틈과 길목을 막았다. 습격을 받으면 더 버티고, 밤에 다가오는 것이 줄어든다. 지키는 싸움에서 밀고 오는 적의 발을 두어 번 묶고 무너진다.
    where: [home, base, own]
    move: carpentry
    hours: 4
    materials: { planks: 3, scrap_metal: 2 }
    # holds·infested_rise (12-184): 전투 준비물이던 길목 바리케이드를 합쳤다
    effects: { fort: 1, camp: 0.7, holds: 2, infested_rise: 0.5 }
  - id: alarm_line
    label: 깡통 경보줄
    description: 드나드는 길목마다 깡통을 매단 줄을 쳤다. 잠들어도 무언가 다가오면 먼저 안다.
    where: [home, base]
    move: improvise
    hours: 1
    materials: { tin_alarm: 1, wire_roll: 1 }
    effects: { watched: true }
  - id: rain_catcher
    label: 빗물받이
    description: 천과 고철로 빗물을 모아 거르는 통을 걸었다. 이곳에서 물을 마시고 채울 수 있다.
    where: [home, base]
    move: improvise
    hours: 3
    materials: { cloth: 2, scrap_metal: 1, duct_tape: 1 }
    effects: { water: true }
  - id: garden
    label: 텃밭
    description: 흙을 고르고 씨를 뿌렸다. 봄부터 가을까지 먹을 것이 자란다.
    where: [home, base]
    move: survival
    hours: 6
    materials: { seed_packet: 1 }
    effects: { garden: { item: potato, qty: 2, days: 4, seasons: [spring, summer, autumn], resource: food, resource_delta: 1 } }
  # 가축 (12-175): 짐승은 재료로 들어간다. 텃밭(garden)과 같은 길로 자라되 계절을 가리지 않는다
  - id: coop
    label: 닭장
    description: 판자와 철사로 닭장을 짜고 닭을 넣었다. 이틀에 한 번 알을 거둔다.
    where: [home, base]
    move: carpentry
    hours: 3
    materials: { planks: 2, wire_roll: 1, hen: 2 }
    effects: { garden: { item: egg, qty: 2, days: 2, resource: food, resource_delta: 1 } }
  - id: goat_pen
    label: 염소 우리
    description: 판자로 우리를 두르고 염소를 매어 두었다. 날마다 젖을 짠다.
    where: [home, base]
    move: carpentry
    hours: 4
    materials: { planks: 3, wire_roll: 1, goat: 1 }
    effects: { garden: { item: goat_milk, qty: 1, days: 1, resource: food, resource_delta: 1 } }
  - id: smokehouse
    label: 훈제 막
    description: 판자로 작은 연기 막을 세웠다. 이곳에서 날을 넘기면 날것이 상하지 않는다.
    where: [home]
    move: carpentry
    hours: 4
    materials: { planks: 2, firewood: 2 }
    effects: { preserve: true }
  - id: stove
    label: 난로
    description: 고철로 연통 달린 난로를 짰다. 땔감을 넣으면 모닥불보다 세 배 오래 타고, 실내가 따뜻해진다.
    where: [home]
    move: improvise
    hours: 5
    materials: { scrap_metal: 3, wire_roll: 1 }
    effects: { fire: true }

# 유품과 이어지는 끈 (12-158, *임시*): 죽은 주인공과 관계(앙숙 빼고)가 있거나 호감이 이 이상이면 가까운 사람.
# 가까운 사람이 뒤를 이으면 사물함·거처의 짐을 물려받고, 이야기에서 그를 기억하는 배역(mourner)이 된다
legacy:
  close_affection: 6

# 다짐 (12-164, *임시*): 주인공의 큰 줄기. 시나리오(역할의 resolve, 없으면 배경)가 주거나 이야기가 건넨다. 한 번에 하나.
# 이루면 경험치 12(초반엔 두 레벨쯤, 중반부터는 한 레벨 안쪽)와 마음 한 단계 회복, 꺾이면 마음 한 단계 악화. 갚기는 스스로 내려놓을 수 있다 (내려놓아도 이룬 것으로 친다)
resolve:
  xp: 12
  relief_track: nerves
  from_history: { enemy: revenge, family: find, debt: debt }
  # 이미 있던 사람으로 이어 가면 (플레이 테스트 12): 가까운 사람을 이레 지키거나, 빚이 있으면 빚 털기. 새로 만든 캐릭터는 받지 않는다
  heir: { close: protect, days: 7 }
  kinds:
    - { id: revenge, label: 갚기, check: gone, let_go: true }
    - { id: find, label: 찾기, check: meet }
    - { id: rescue, label: 구해 내기, check: released }
    - { id: cure, label: 살려 내기, check: cured }
    - { id: protect, label: 지키기, check: alive_days }
    - { id: repay, label: 은혜 갚기, check: promise_kept }
    - { id: rise, label: 자리, check: rank }
    - { id: debt, label: 빚 털기, check: debt_clear }
    - { id: journey, label: 떠나기, check: reach, min_stage: 2 }
    - { id: truth, label: 진실, check: beliefs }
    - { id: atone, label: 속죄, check: trusted }
    - { id: heart, label: 마음, check: relation }
    - { id: quit, label: 버리기, check: trait_gone }
    - { id: endure, label: 버텨 내기, check: season_passed }
    - { id: bury, label: 묻기, check: buried }
    - { id: peace, label: 화해시키기, check: truce }
    - { id: topple, label: 무너뜨리기, check: faction_fallen }
    - { id: reclaim, label: 되찾기, check: zone_owned }
    - { id: recognition, label: 인정받기, check: standing, occupation_only: true }
    - { id: explore, label: 알아내기, check: ruins_found }
    - { id: homecoming, label: 돌아가기, check: reach, min_stage: 2 }

# 몸에 남는 상처 (12-156, *임시*): 부상이 치명상 이상인 상처를 입으면 30%로 흔적 트레잇 하나. 상처 종류에 맞는 것 중에서, 한 사람에 셋까지
scars:
  at: critical
  chance: 0.3
  max: 3
  traits:
    - { trait: limp, wounds: [gunshot, pierce, bite, blunt, cut], parts: [다리, 무릎, 발목, 정강이, 허벅지, 종아리] }
    - { trait: stiff_hand, wounds: [cut, bite, claw, gunshot], parts: [손, 손가락, 손목, 팔, 손등] }
    - { trait: face_scar, wounds: [cut, claw, other], parts: [얼굴, 뺨, 이마, 눈가, 턱, 머리] }
    - { trait: short_breath, wounds: [gunshot, pierce, blunt], parts: [가슴, 갈비, 옆구리, 몸통, 등짝] }
    - { trait: deaf_ear, wounds: [blunt, gunshot, other], parts: [귀, 머리, 관자놀이] }
    - { trait: aching_wound }

# 의식불명 중 곁의 사람 (12-90, *임시*): 쓰러질 때마다 한 번, 곁에 누가 있느냐로 코드가 정한다
helpless:
  # 그 사람이 주인공을 보는 믿음+호감이 이 이상이면 돌봐 준다, 이 이하면 적으로 군다
  ally_regard: 4
  hostile_regard: -4
  # 무리의 태도가 이 이하면 그 무리 사람은 적이다
  hostile_disposition: -2
  # 무리 없는 떠돌이를 보면 잡아가는 무리
  prey_on_strangers: [faction_c]
  # 장면에 아무도 없을 때 구역 주인 무리의 사람이 찾아낼 확률
  found_chance: 0.4
  # 아무도 찾지 않았을 때 감염체가 먼저 찾을 확률 (구역 위험 0~3)
  infected_chance: [0, 0.1, 0.25, 0.4]
  # 적이 죽일 확률: 기본 + 자비(mercy) 한 점마다 + 원한이 있으면
  kill: { base: 0.15, per_mercy: -0.05, feud: 0.4 }

# 길 위의 일 (12-53): 구역을 옮길 때 길의 위험(두 구역의 danger 중 높은 쪽 0~3)별로 태그 road인 이야기가 열릴 확률
travel: { tag: road, chance: [0.05, 0.12, 0.25, 0.4] }

# 이야기의 빈도 (12-191, *임시*): 보통 이야기는 6시간에 하나. 12-191에 10시간으로 늘렸지만 실제 플레이는 하루 1.5~1.7개라 (잠자는 동안은 급한 것만) 12-195에 6시간으로 되돌렸다.
# 보통 이야기와 길 위의 일은 앞 이야기와 2시간은 떨어지고, 급한 이야기는 하루 둘까지. 피를 흘리거나 치명상 이상이면 급한 이야기만
# 임무의 판정 조건에서 서로 바꿔 쓸 수 있는 판정 (플레이 테스트 13: 교섭 조건을 매력 낮은 호위대원이 넘기지 못했다)

# 공통 규칙 5 (같은 것은 쉰다, design.md 1.1): 최근에 나온 배역·받은 일감·무리마다의 경보 이야기가 다시 나오기 전에 쉬는 날수
rest: { cast: 2, mission: 3, alarm: 3 }
mission_move_groups:
  - [persuade, intimidate, deceive]
# 임무 브리핑의 낌새 (content:check, 12-237): 짝을 말하면 buddy, 알아 오라면 learns가 있어야 한다 (플레이 테스트 13: "혼자 깊이 들어가지 마라"에 짝이 없었고, 발자국을 쫓아도 알게 된 것이 없었다)
# 이 부상 단계부터는 위험 임무를 내지 않는다 (12-239)
mission_unfit_from: serious
mission_hints:
  buddy: ["혼자 (깊이 )?(들어가지|다니지|나가지) 마", "혼자 두지", "둘이서", "2인 1조"]
  learns: ["어디서 왔는지", "어디로 가는지", "알아 온다", "알아 와", "알아내(?![^.]*아닙)"]

# 장소 종류 (12-300, 공통 규칙 15, docs/map-expansion-plan.md 1단계): 장소마다 kinds 1~2개, 이야기는 when.place_kinds로 "이런 자리"를 적는다.
# road·jail은 장소의 road·jail 표시로 저절로 붙는다. 물가인지는 장소의 wade로
place_kinds:
  - { id: gate, label: 담 문·정문·검문 }
  - { id: road, label: 구역에 드나드는 길 }
  - { id: yard, label: 마당·광장·운동장 }
  - { id: mess, label: 먹는 곳 }
  - { id: sleep, label: 자는 곳 }
  - { id: store, label: 창고·재고 }
  - { id: work, label: 일하는 곳 }
  - { id: care, label: 치료 }
  - { id: command, label: 지휘·회의 }
  - { id: watch, label: 망루·담 위 }
  - { id: jail, label: 가두는 곳 }
  - { id: field, label: 밭·물가 바깥 일터 }
  - { id: ruin, label: 무너진 건물 안 }
  - { id: street, label: 바깥 길·골목·장터 }
  - { id: hall, label: 모이는 실내 }

# 공통 규칙 19 관계 오름 (12-295, rules/regard.ts): 같은 사람·축·까닭으로 window_days 안에 다시 오르면 0, 한 사람·한 축 하루 daily_cap까지.
# heavy: 상한을 넘는 무거운 까닭 (구출·목숨을 구함·위험한 분대 일·비밀을 털어놓음·해낸 의뢰·풀어 줌). 이야기 효과는 상한 없이 같은 까닭 간격만 (까닭은 kind, 없으면 이야기 id)
# daily_only: 같은 까닭 간격 없이 하루 상한만 받는 까닭. 판정이 걸린 임무를 해냄(mission_done)은 다른 날이면 되풀이가 아니라 복무다 (12-298, PT27: 임무로는 상관 신뢰가 3일에 +1이라 진급 신뢰까지 18일)
relation_gain: { window_days: 3, daily_cap: 1, heavy: [rescue, saved_life, squad_risky, secret_shared, request_done, release], daily_only: [mission_done] }

# 공통 규칙 20 무리 사이와 사람 사이 (12-296, rules/crossed.ts): 무리 사이는 지금 태도로 읽고, 개인 관계와 엇갈릴 때만 NPC 쪽에 건다.
# 전쟁 중 + 호감 fond_affection 이상: 먼저 치지 않고, 그 사람이 낸 상처는 harm_stops_before(치명상) 바로 앞에서 멈춘다. 쓰러지면 죽이지 않고 붙잡아 간다
# 전쟁 아님 + 신뢰 grudge_trust 이하: 이야기 배역·임무 짝·분대로 뽑지 않고, 마주쳐도 피한다
crossed: { fond_affection: 4, grudge_trust: -4, harm_stops_before: critical }

# 공통 규칙 22 받아들임 (12-308, 사용자 결정): 무소속이 무리에 들 때는 손님으로 먼저 들이고, 2~5시간 뒤 7~20시 사이에 그 거점에서 대표가 면담해 권한다.
# 사양하면 손님으로 남고 3일 뒤에 다시 권한다 (청솔 정문에서 판정 하나로 곧장 분대원이 됐다)
# 들어갈 자리 (12-309, 사용자 결정): 대표가 붕괴 전 직업을 보고 직분을 권한다 (이야기가 자리를 정해 두었으면 그것). 면담에서 수색대·수비대는 대신 청할 수 있다.
# 수색대원만 분대에 들고, 나머지는 그 무리에서 같은 일을 하는 윗사람(없으면 간부) 밑에서 일한다
admission:
  offer_after_hours: [2, 5]
  offer_hours: [7, 20]
  reoffer_days: 3
  posts:
    by_past: { doctor: doctor, nurse: nurse, firefighter: scavenger, police: scavenger, soldier: scavenger, thief: scavenger, courier: scavenger, student: scavenger, mechanic: mechanic, builder: carpenter, cook: cook, farmer: cook, salesman: trader, gangster: guard, teacher: guard }
    default: guard
    ask: [scavenger, guard]
    squad: [scavenger]
    ranks: { scavenger: grunt, guard: grunt, medic: grunt }
    other_rank: resident
    chief_rank: officer
    # 분대에 들지 않는 자리가 무리 시나리오에서 받는 일감: 요건에 이 활동이 있는 것만 (수비대원은 보초·경비만, 12-312)
    borrows: { guard: [guard_duty] }
    # 상관이 거점 밖에 살면 (거점에 간부가 없는 무리) 아침 7~10시에 하루 한 번 거점에 들러 일감을 준다 (12-311, 사용자 결정)
    visit_hours: [7, 10]

storylet_pacing:
  # 이야기 사이 간격: 앞 이야기마다 4~8시간 사이로 (플레이 테스트 12: 하루 상한이 자정에 풀려 00시대에 몰렸다 → 하루 상한 대신 간격. 12-306: 6~12시간이 거점 이야기 밀도의 천장이라 줄임, PT26~29)
  min_gap_hours: 4
  max_gap_hours: 8
  expire_hours: 3
  # 첫 이야기는 시작 1시간 뒤부터 (12-251, 플레이 테스트 14: 튜토리얼 정문 이야기가 도착 2시간 25분 뒤에 열렸다)
  first_after_hours: 1
  min_any_gap_hours: 2
  urgent_per_day: 2
  urgent_only_when: { bleeding: bleeding, harm: critical }
  # 연습 대련은 경상까지만 (12-251, 플레이 테스트 14: 업혀 돌아온 직후 대련을 청받았다)
  practice_max: { harm: light }
  # 플레이 테스트 11 (D1~D3): 하루 2~5개, 대부분 위협이라 페널티가 겹쳤다. 이동마다 길 위의 일, 감염체 무리가 사흘에 세 번
  per_day: 0
  threat_per_day: 1
  road_per_day: 1
  same_threat_gap_days: 2

# 시세 (12-155, *임시*): 그 땅 주인 무리의 창고가 처음의 25% 이하면 1.5배, 처음과 같으면 그대로, 두 배 이상이면 0.7배.
# 음식은 식량, 탄약은 탄약 (약·물·땔감은 아이템의 resource). 겨울에는 연료 1.4배, 여름에는 물 1.2배
market:
  kinds: { food: food, ammo: ammo }
  scarce: 0.25
  plenty: 2
  high: 1.5
  low: 0.7
  seasons:
    winter: { fuel: 1.4 }
    summer: { water: 1.2 }

# 잠입 장면 (12-154, *임시*): 다른 무리의 땅에서 담 밖 → 담 안 → 깊은 곳. 한 걸음 10분.
# 전진·빠지기는 은밀, 살피기는 경계. 경보 숫자는 보이지 않고 낌새로만. 낮에는 어렵고 밤·비·안개에는 쉽다
infiltration:
  move: stealth
  listen: sense_danger
  depths: [담 밖, 담 안, 깊은 곳]
  step_minutes: 10
  goals:
    - { id: steal, label: 물자 빼내기, move: scavenge, items: { canned_food: 2, rifle_rounds: 1 }, resource: { food: -10, ammo: -5 } }
    - { id: free, label: 갇힌 사람 풀어 주기, move: stealth, release: true }
    - { id: sabotage, label: 망가뜨리기, move: improvise, resource: { ammo: -20, fuel: -10 }, morale: -1 }
    - { id: eavesdrop, label: 엿듣기, move: stealth, overhear: true }


# 약속 (12-160, *임시*): 주인공이 한 약속을 코드가 기억한다. 지키면 믿음이 오르고, 털어놓고 접으면 조금, 말없이 어기면 크게 깎인다
# asks (12-174, 12-181): 인물의 부탁도 약속이다. 하루에 이 확률로 만난 인물 하나가 부탁을 품는다. 부탁 내용은 인물 YAML의 favors
promises:
  max_open: 5
  asks: { chance: 0.3, max_open: 2, expire_days: 7 }
  kept: { trust: 1, affection: 1 }
  folded: { trust: -1 }
  broken: { trust: -2, affection: -1 }

# 의뢰 (12-291, *임시*, docs/requests-plan.md): 장면의 인물에게 일거리를 물으면(request ask) 코드가 그 사람이 줄 만한 의뢰를 하나 만든다.
# 진행 중인 의뢰는 한 번에 하나 (인물이 먼저 꺼낸 부탁 promises.asks를 받은 것도 센다). 임무와는 따로
# reach: 의뢰인 구역에서 길로 몇 구역 안에 목표를 둔다. days + 한 구역 멀 때마다 per_hop_days가 기한
# givers: 위에서부터 처음 맞는 줄 (merchant·healer: 장사꾼·치료사, skills: 이 중 하나가 min_skill 이상, 조건 없으면 누구나)
# fight: 싸움 의뢰는 주인공이 근접전·사격 중 하나로 능력+스킬 min 이상일 때만. fetch.min_share: 수색표에서 그만한 몫 이상인 물건만 (흔할수록 자주)
# reward: 보수 물건 수 = base[종류] + 거리 × per_hop + 목표 구역 위험 × per_danger (사람을 데려오면 brought만큼 더)
requests:
  reach: 3
  days: [2, 3]
  per_hop_days: 1
  kinds:
    fetch: { label: 찾아오기, quantity: [1, 2], min_share: 0.12 }
    find: { label: 사람 찾기, templates: [missing_person] }
    capture: { label: 붙잡아 오기, templates: [outlaw] }
    kill: { label: 처치하기, templates: [infected_hungry, feral_dog, outlaw] }
  fight: { moves: [fight, shoot], min: 1 }
  givers:
    - { healer: true, kinds: [fetch, find], items: [bandage, painkiller, antibiotics, fever_reducer, medkit, morphine, cloth] }
    - { merchant: true, kinds: [fetch, capture] }
    - { skills: [fight, shoot], min_skill: 2, kinds: [capture, kill] }
    - { skills: [scavenge], min_skill: 2, kinds: [fetch, find] }
    - { kinds: [fetch, find, kill] }
  reward:
    pay:
      - { item: canned_food, weight: 3 }
      - { item: dry_ration, weight: 3 }
      - { item: bandage, weight: 2 }
      - { item: cigarettes, weight: 2 }
      - { item: rifle_rounds, weight: 1 }
    base: { fetch: 0, find: 1, capture: 2, kill: 1 }
    per_hop: 1
    per_danger: 1
    brought: 1
    relation: { trust: 1, affection: 1 }
  failed: { trust: -1 }

# 탐험할 곳 (12-162, *임시*): 구역의 숨은 곳. 그 구역을 뒤지다 수색이 성공하면 찾는다 (대가 있는 성공은 낌새만, 12-220). 찾은 것은 그 캐릭터만 안다.
# 칸을 경계 판정으로 내려가고(마지막 칸은 어렵다), 칸마다 한 번 수색 판정으로 뒤진다. 소음이 3이면 깊이+1만큼 감염체가 깨어난다
exploration:
  move: sense_danger
  search_move: scavenge
  step_minutes: 15
  wake: [infected_fresh, infected_hungry, infected_crawler]
  ruins:
    - id: subway_tracks
      zone: subway_hub
      label: 무너진 선로 아래 대피 통로
      hint: 승강장 끝 철망 너머로 비상 사다리가 아래로 이어진다
      mood: 물이 발목까지 찬 콘크리트 통로, 녹슨 안내판, 썩은 냄새와 멀리서 똑똑 떨어지는 물
      hazard: 젖은 사다리에서 미끄러졌다
      depths: [비상 사다리 아래, 물 찬 대피 통로, 막힌 열차 칸]
      loot:
        - [{ item: dirty_water, weight: 2, qty: [1, 2] }, { item: flashlight, weight: 1, qty: [1, 1] }, { item: scrap_metal, weight: 2, qty: [1, 2] }]
        - [{ item: canned_food, weight: 2, qty: [1, 2] }, { item: bandage, weight: 1, qty: [1, 2] }, { item: stimulant, weight: 0.5, qty: [1, 1] }]
        - [{ item: pistol_rounds, weight: 2, qty: [2, 4] }, { item: mil_ration, weight: 1, qty: [1, 2] }, { item: pistol, weight: 0.4, qty: [1, 1] }, { item: tunnel_map, weight: 0.5, qty: [1, 1] }]
    - id: hospital_basement
      zone: hospital_ruins
      label: 옛 병원 지하 약제실
      # 장소(비상계단·엘리베이터 문)와 인물들이 아는 길(계단은 무너졌고 엘리베이터 통로로)에 맞춘다 (PT21·PT22 하얀매)
      hint: 무너진 비상계단 옆, 비틀린 엘리베이터 문 안 통로로 밧줄을 타고 내려간다. 아래 문에 '약제부' 글씨가 반쯤 남았다
      mood: 깨진 형광등, 뒤집힌 침대, 소독약 냄새가 아직 희미하게 남은 복도
      hazard: 무너진 천장 판에 깔렸다
      depths: [엘리베이터 통로 밑, 기록실 복도, 약제실 금고]
      loot:
        - [{ item: bandage, weight: 2, qty: [1, 2] }, { item: fever_reducer, weight: 1, qty: [1, 1] }, { item: cloth, weight: 1, qty: [1, 2] }]
        - [{ item: painkiller, weight: 2, qty: [1, 2] }, { item: antibiotics, weight: 1, qty: [1, 1] }, { item: medkit, weight: 1, qty: [1, 1] }]
        - [{ item: morphine, weight: 1.5, qty: [1, 2] }, { item: antibiotics, weight: 2, qty: [1, 2] }, { item: sealed_med_case, weight: 0.5, qty: [1, 1] }]
    - id: mall_stockroom
      zone: mall_ruins
      label: 마트 지하 물류 창고
      hint: 무너진 계산대 뒤 셔터가 허리 높이까지 들려 있다
      mood: 끝없는 선반, 쓰러진 지게차, 어둠 속에서 뭔가 바스락거린다
      hazard: 무너지는 선반에 맞았다
      depths: [셔터 아래, 하역장, 냉동 창고]
      loot:
        - [{ item: canned_food, weight: 2, qty: [1, 2] }, { item: duct_tape, weight: 1, qty: [1, 1] }, { item: blanket, weight: 1, qty: [1, 1] }]
        - [{ item: canned_food, weight: 2, qty: [2, 3] }, { item: soju, weight: 2, qty: [1, 3] }, { item: cigarettes, weight: 2, qty: [1, 3] }]
        - [{ item: canned_food, weight: 2, qty: [3, 5] }, { item: fuel_bottle, weight: 1, qty: [1, 2] }, { item: coat, weight: 1, qty: [1, 1] }]
    - id: plant_control
      zone: power_plant
      label: 발전소 지하 제어실
      hint: 터빈 건물 바닥의 점검구 뚜껑이 열려 있다. 아래에서 기름 냄새가 올라온다
      mood: 기름에 전 계단, 꺼진 계기판 수십 개, 쇠가 식으며 우는 소리
      hazard: 기름 묻은 철계단에서 굴렀다
      depths: [점검구 아래, 배관 통로, 제어실]
      loot:
        - [{ item: scrap_metal, weight: 2, qty: [1, 3] }, { item: wire_roll, weight: 1, qty: [1, 1] }]
        - [{ item: fuel_bottle, weight: 2, qty: [1, 2] }, { item: toolkit, weight: 0.7, qty: [1, 1] }, { item: casings, weight: 1, qty: [2, 4] }]
        - [{ item: fuel_bottle, weight: 2, qty: [2, 3] }, { item: gunpowder, weight: 1, qty: [1, 2] }, { item: explosive, weight: 0.3, qty: [1, 1] }]
    - id: prison_armory
      zone: prison
      label: 교도소 무기고
      hint: 관리동 지하 철문이 비틀려 사람 하나 지나갈 틈이 났다
      mood: 철창이 끝없이 이어진 복도, 벽의 손톱자국, 문이 바람에 혼자 덜컹인다
      hazard: 비틀린 철문 날에 베였다
      depths: [관리동 지하, 보안 복도, 무기고]
      loot:
        - [{ item: cell_key_ring, weight: 1, qty: [1, 1] }, { item: baseball_bat, weight: 1, qty: [1, 1] }, { item: cloth, weight: 1, qty: [1, 2] }]
        - [{ item: arm_guards, weight: 1, qty: [1, 1] }, { item: shells, weight: 2, qty: [2, 4] }, { item: moto_helmet, weight: 1, qty: [1, 1] }]
        - [{ item: shotgun, weight: 1, qty: [1, 1] }, { item: shells, weight: 2, qty: [4, 6] }, { item: kevlar_vest, weight: 0.5, qty: [1, 1] }]
    - id: campus_lab
      zone: campus
      label: 의생명 연구동 지하 실험실
      hint: 연구동 계단에 '관계자 외 출입 금지' 테이프가 끊어져 있다. 계단 아래가 깜깜하다
      mood: 깨진 유리 장, 뒤집힌 쥐 우리, 벽에 붙은 메모들, 비상 발전기가 오래전에 멎었다
      hazard: 깨진 유리 장에 베였다
      depths: [지하 계단, 동물실, 저온 보관실]
      loot:
        - [{ item: notebook, weight: 1, qty: [1, 1] }, { item: pen, weight: 1, qty: [1, 1] }, { item: bandage, weight: 1, qty: [1, 1] }]
        - [{ item: antibiotics, weight: 1, qty: [1, 1] }, { item: fever_reducer, weight: 1, qty: [1, 2] }, { item: stimulant, weight: 0.7, qty: [1, 1] }]
        - [{ item: sealed_med_case, weight: 1, qty: [1, 1] }, { item: serum, weight: 0.2, qty: [1, 1] }, { item: antibiotics, weight: 1.5, qty: [1, 2] }]

# 뇌물과 협박 (12-153, *임시*). 뇌물의 값(물건 값의 합): 계급별 값 × (1 − 0.25 × 욕심), 주인공을 믿으면 ×0.8.
# 정직 2 이상이고 욕심 0 이하인 사람은 값과 상관없이 거절한다. 값의 절반 이상이면 교섭 판정. 협박은 위협 판정
leverage:
  bribe:
    move: persuade
    greed: self_interest
    scruple: honesty
    prices: { loner: 3, outsider: 4, grunt: 4, resident: 4, squad_leader: 8, officer: 15, leader: 30, default: 5 }
    greed_step: 0.25
    trusted: 0.8
    refuse_at: 2
  blackmail: { move: intimidate }

# 야영 (12-148, *임시*): 지켜 주는 지붕이 없는 곳에서 자거나 쉬거나 기다리거나 보초를 서면, 구역의 위험(위험과 감염체 압력 중 높은 쪽)별
# 시간당 확률로 태그 camp 이야기가 열린다. 6시간 자면 위험 0: 6%, 1: 17%, 2: 31%, 3: 47%. 모닥불이 타면 ×1.5, 우리 땅이면 ×0.5
# deep_sleep (12-188, *임시*): 지침 이상의 피로, 고열, 중상이면 깊이 잠든다. 보초가 있어도 다가오는 것을 늦게 알고, 급한 일에는 늦게 깬다
camp: { tag: camp, chance: [0.01, 0.03, 0.06, 0.1], fire: 1.5, own_land: 0.5, deep_sleep: { fatigue: weary, disease: sick, harm: serious } }

# 매복 (12-177, *임시*): 은밀 판정(어려움)으로 자리를 잡으면 12시간, 첫 근접전·사격 +2와 50%로 상대 혼란.
# 적의 매복 이야기(ambush: true)가 열리면 다음 판정 -2, 실패하면 혼란(다음 판정 -1). 냄새 맡기를 배운 개가 곁에 있으면 미리 안다
ambush: { move: stealth, hours: 12, attack_moves: [fight, shoot], bonus: 2, partial_bonus: 1, ambushed: -2, confused: -1, forewarn_trick: sniff }

# 무전 송출 (12-173, *임시*): 무전기로 하루 한 번 열린 주파수에 부르면 이 확률로 응답 이야기(storylets/radio_call.yaml)가 열린다
radio_call: { item: radio, tag: radio_call, chance: 0.6 }

# 즉흥 이야기 (12-247, *임시*): 반복 이야기(템플릿)가 골리면 그 자리를 GM이 지은 이야기로 바꾼다. 쓰인 이야기와 번갈아: 앞 즉흥 자리 뒤에 쓰인 이야기가 한 편 열린 뒤에만 (12-306).
# 줄거리 몫이 있는 이야기(다짐·플래그·장례·세계를 움직이는 효과)는 바꾸지 않는다: 바뀔 수 있는 것은 채우기용 138개.
# 앞 자리와 20시간 떨어진다. 자동 플레이 80일 안팎: 이야기의 10% 안팎이 즉흥
# GM은 보상 등급(작음·보통)과 종류(물건·관계·공적), 대가 종류만 고른다. 물건은 등급 목록에서 코드가 고른다
improv:
  gap_hours: 20
  # 보상 물건의 갈래: GM이 이야기에 맞는 갈래를 고르고, 물건은 그 갈래의 등급 목록에서 고른다
  item_kinds: { food: 먹을 것, medicine: 약·붕대, ammo: 탄약, material: 재료·연료, trade: 담배 (맞바꿀 것) }
  rewards:
    small:
      relation: 1
      merit: 1
      items:
        food: [{ item: canned_food }, { item: dry_ration }, { item: water_bottle }]
        medicine: [{ item: bandage }]
        ammo: [{ item: pistol_rounds }, { item: rifle_rounds }]
        material: [{ item: cloth }, { item: duct_tape }, { item: scrap_metal }]
        trade: [{ item: cigarettes, quantity: 2 }]
    medium:
      relation: 2
      merit: 2
      items:
        food: [{ item: canned_food, quantity: 2 }, { item: dry_ration, quantity: 2 }]
        medicine: [{ item: antibiotics }, { item: fever_reducer }, { item: medkit }]
        ammo: [{ item: pistol_rounds, quantity: 2 }, { item: rifle_rounds, quantity: 2 }]
        material: [{ item: fuel_bottle }, { item: blanket }]
        trade: [{ item: cigarettes, quantity: 4 }]
  costs:
    relation: -1
    noise: 1
    time: 90
    body: { track: fatigue, delta: 1 }

# 명성 (12-127, *임시*): 남에게 보인 행적의 크기 합. 한두 번으로는 무명이다
# 알려지면(1단계) 행적이 말이 모이는 곳을 거쳐 다른 무리로 넘어간다. 이름나면(2단계) 소문으로 들은 사람도 다시 옮긴다
# 소문으로만 아는 사람의 호감·존중이 3 이상이면 팬, -3 이하면 안티
fame:
  tiers:
    - { min: 0, label: 무명 }
    # 플레이 테스트 11 (C7): 2~3일차에 "아는 사람은 아는 이름", 4~6일차에 "이름난 사람"이 됐다 (6·15·30 → 10·25·45)
    - { min: 10, label: 아는 사람은 아는 이름 }
    - { min: 25, label: 이름난 사람 }
    - { min: 45, label: 모두가 아는 이름 }
  cross_from: 1
  relay_from: 2
  fan_at: 3
  anti_at: -3

# 외교 (12-126, *임시*): 간부(지도부 회의에 앉는 계급)가 다른 무리의 간부 이상과 한 장면에서 협정을 제안한다 (negotiate)
# 상대의 태도·형편·힘 차이·협상 상대의 신뢰가 판정 난이도가 된다. 대가 있는 성공이면 cost를 상대에게 내준다
# 거절당하면 retry_days 동안 다시 못 꺼내고 상대의 태도 -1. 휴전 중에 그쪽 사람을 치면 두 무리의 태도가 broken이 된다
diplomacy:
  envoy_level: 3
  moves: [persuade, intimidate, deceive]
  retry_days: 3
  broken: -3
  pacts:
    - { id: truce, label: 휴전, kind: truce, days: 7, summary: "이레 동안 서로 치지 않는다", cost: { food: 30 } }
    - { id: prisoner_exchange, label: 포로 교환, kind: exchange, summary: "서로 잡고 있는 상대 무리 사람을 돌려보낸다", cost: { medicine: 5 } }

# 구역의 감염체 압력 (12-112, *임시*): 0~3, 기준값은 구역의 danger
# 전날 그 구역 소음이 noise_at 이상(총 한 발이면 2)이면 +1, 그날 그 구역 교전 사상자가 corpses_at 이상이면 +1 (3이면 전쟁이 60일에 거의 닿지 않아 2로)
# 오르지 않은 날은 settle 확률로 기준값 쪽으로 한 단계. 길 위의 일, 감염체 틀 등장, 쓰러졌을 때 물릴 확률에 쓴다
# 기준값보다 한 단계 높을 때마다 산출 -25% (12-118), 자기 거점이 기준값보다 높으면 하루 30%로 사기 -1 (12-120)
infestation:
  noise_at: 2
  # 소리가 noise_at에 닿으면 1~5시간 뒤에 몰려든다 (플레이 테스트 12: 다음 날 자정이라 "몰려들 수 있다" 뒤에 아무것도 오지 않았다). 그때 그 구역에 있으면 마주침을 굴린다
  swarm_hours: [1, 5]
  corpses_at: 2
  settle: 0.3
  yields_cut: 0.25
  morale_chance: 0.3
  # 감염체가 몰린 땅을 지키느라 전쟁에 돌리는 몫이 준다 (12-144, *임시*): 넘친 단계 하나당 15%, 기본 몫의 40%까지만. 모든 무리가 자기 땅을 순찰하며 버틴다
  war_share_cut: 0.15
  war_share_floor: 0.4
  # 무리 형편(9.13)에 오르는 말: 그 무리 땅의 압력이 기준값보다 1·2·3 높을 때 (12-120)
  trouble_labels: [땅에 감염체가 몰려들었다, 감염체에 시달린다, 감염체에 둘러싸였다]
  # 몰려든 구역에 들어서면 (플레이 테스트 11, D5): 기준값보다 높은 단계 하나당 20%로 infested 이야기 하나 (13일 동안 다섯 번 들어가도 마주치지 않았다)
  arrival: { tag: infested, per_level: 0.2 }

# 들킨 침입 (플레이 테스트 11, D6): 적대하는 무리의 땅에서 숨기가 실패하면 alarm 이야기(경보·추격) 하나가 열린다
# 적대하는 땅에서 시간을 들이는 일(수색·기다림·잠 등)은 판정을 함께 건다. 판정이 없으면 숨기 판정을 건다. 실패하면 경보 (플레이 테스트 12: 적 창고를 1시간 반 뒤져도 아무 일이 없었다)
alarm: { tag: alarm, moves: [stealth] }

# 쓰면 몸이 나아지는 물건 (take_action.use_item): 아이템 → 트랙 → 나아지는 단계 (*임시*)
# 음식이 상하는 빠르기의 계절 배수 (12-131, *임시*): 아이템 perishable × 이 값
spoilage:
  season: { summer: 1.5, winter: 0.4 }

# 먹을 것 구하기 (12-131, *임시*): take_action.forage. 수색처럼 판정 결과만큼 얻고 (성공 2, 대가 있는 성공 1), 같은 날 같은 곳에서 다시 할 때마다 판정 -1 (12-220).
# 낚시는 물이 나는 구역에서, 사냥은 거점이 아닌 구역에서. 개가 동행하면 사냥에서 한 번 더 굴린다
foraging:
  move: survival
  kinds:
    - { id: fish, label: 낚시, move: fishing, water: true, modifier: 1, items: [{ item: raw_fish, weight: 1, qty: [1, 2] }] }
    - id: hunt
      label: 사냥
      move: hunt
      items: [{ item: raw_meat, weight: 3, qty: [1, 1] }, { item: raw_meat, weight: 1, qty: [2, 3] }]
      companions: [stray_dog, road_dog]
  # 덫: 철사 한 뭉치를 놓는다. 놓는 판정이 성공이면 다음 날, 대가 있는 성공이면 이틀 뒤에 날고기가 걸린다 (12-220). 거두면 철사가 돌아온다
  trap: { move: hunt, item: wire_roll, catch: { item: raw_meat, qty: [1, 1] } }

consumables:
  # 구급상자·붕대는 응급처치 물건이다 (출혈 효과가 있으면 응급처치 물건으로 본다, 플레이 테스트 11 A9). 효과는 판정이 정한다: 성공 = 피가 멎고 부상 한 단계, 대가 있는 성공 = 피만, 실패 = 아무 일 없음
  medkit: { harm: 1, bleeding: 3 }
  bandage: { bleeding: 3 }
  # 항생제는 감염을 떼지 못하고 늦추기만 한다 (body.infection.slow). 상처는 낫게 하지 않는다 (플레이 테스트 13: 하루 한 번 치료를 넘는 상처약이 됐다)
  canned_food: { hunger: 2 }
  dry_ration: { hunger: 1 }
  # 빠져 있어 먹을 수 없었다 (플레이 테스트 11: 포상으로 받은 전투식량)
  mil_ration: { hunger: 2 }
  egg: { hunger: 1 }
  goat_milk: { hunger: 1, thirst: 1 }
  water_bottle: { thirst: 2 }
  # 골초의 안절부절을 바로 푼다 (12-129)
  cigarettes: { craving: 1 }
  cucumber: { hunger: 1, thirst: 1 }
  tomato: { hunger: 1, thirst: 1 }
  apple: { hunger: 1, thirst: 1 }
  dried_fish: { hunger: 2, thirst: -1 }
  salted_meat: { hunger: 2, thirst: -1 }
  potato: { hunger: 1 }
  # 먹고 마시기 (12-131)
  raw_fish: { hunger: 1 }
  raw_meat: { hunger: 2 }
  smoked_meat: { hunger: 2, thirst: -1 }
  ranch_meat: { hunger: 2, thirst: -1 }
  cheap_smoked_meat: { hunger: 2, thirst: -1 }
  dirty_water: { thirst: 2 }
  wild_greens: { hunger: 1 }
  mushroom: { hunger: 1 }
  fever_reducer: { disease: 1 }
  # 술·진통제·각성제 (12-157): 기운을 올린다 (음수). 진통제는 고통을, 술은 공포를, 각성제는 피로를 가린다
  soju: { drink: -1 }
  moonshine: { drink: -2 }
  painkiller: { numb: -1 }
  morphine: { numb: -2 }
  stimulant: { wired: -2 }

# 몸 상태 (12-1, *임시*)
body:
  # 기운이 한 단계 빠지는 시간 (12-157, *임시*): 술 3시간, 진통제 4시간, 각성제 5시간
  wear_off: { drink: 3, numb: 4, wired: 5 }
  # 쓸 때마다 버릇이 붙을 확률 (12-157, *임시*)
  dependence:
    soju: { trait: drinker, chance: 0.03 }
    moonshine: { trait: drinker, chance: 0.05 }
    painkiller: { trait: pill_habit, chance: 0.05 }
    morphine: { trait: pill_habit, chance: 0.2 }
    stimulant: { trait: stim_habit, chance: 0.15 }
  # 거점에 사는 사람들의 몸 (12-125): 무리의 배급·연료가 그 무리 사람들의 허기·추위가 된다. 굶주림·오한까지만 (죽지 않는다)
  residents: { hunger_max: starving, cold_max: shiver }
  # 피로 (12-114, *임시*): 깨어 있으면 시간당 1씩 쌓이고, 자면 시간당 3씩(6시간 자면 18) 풀리고, 쉬기만 하면 그대로다
  # 몸을 쓰는 일은 더 지친다 (12-119): 이동·수색·작업 1.5, 전투 3 (보초·기다림·대화는 1)
  # 16시간 깨어 있으면 졸림(보정 없음), 24시간이면 지침 -1, 32시간이면 탈진 -2
  # 지침 이상이면 부상이 저절로 낫지 않고 질병도 낫지 않는다 (12-115, 자야 낫는다)
  # 플레이 테스트 11 (E4): 3시간보다 짧은 잠은 피로를 풀지 못하고, 피곤하지 않으면 12시간 자고 깬다
  # 12-255: 피곤하지 않은데 저녁 전에 누우면 낮잠(min_sleep_hours), 중상부터는 피곤과 상관없이 오래 잔다(hurt_sleep_from)
  fatigue: { track: fatigue, grace: 16, per_step: 8, rates: { sleep: -3, rest: 0, travel: 1.5, search: 1.5, work: 1.5, combat: 3 }, blocks_recovery_from: weary, min_sleep_hours: 3, rested_sleep_hours: 12, hurt_sleep_from: serious }
  # 굶주림은 부상을 주지 않고 허기 트랙 끝에서 죽는다 (12-74)
  hunger: { track: hunger }
  # 갈증 (12-97, *임시*): 하루마다 한 단계 마른다. 물이 넉넉한 곳(물이 나는 구역, 물이 하루치 넘게 남은 우리 거점)에서
  # 직접 마시면(take_action.drink) 3단계 풀리고 빈 물병을 채운다. 밖에 나갈 땐 물병을 챙긴다
  thirst:
    track: thirst
    resource: water
    daily: 1
    drink: 3
    min_days: 1
    refill: { empty_bottle: water_bottle }
    captive_max: thirsty
    suffering_from: parched
    # 끓이지 않은 물 (12-131, *임시*): 바깥의 물을 불 없이 마시면 15%로 병에 걸리고, 채우면 끓이지 않은 물병이 된다
    dirty: { chance: 0.15, refill: { empty_bottle: dirty_water } }
  # 감염 (12-106): 한 번 걸리면 혈청 없이는 낫지 않는다. 하루에 한 단계, 변이까지 여드레 (12-109). 항생제를 계속 먹으면 보름쯤
  infection:
    track: infection
    # 감염체에게 입은 상처 종류별 감염 확률 (*임시*). 둔기·그 밖(살갗이 안 찢김)은 감염되지 않는다
    # 플레이 테스트 11: 할큄·베임은 낮추고, 물리면 끝 (막는 것은 방어구뿐). 12-251: 물림 1 → 0.6 (플레이 테스트 14: 첫날 물려 판이 막혔다)
    chance: { claw: 0.1, cut: 0.25, pierce: 0.25, bite: 0.6 }
    # 하나 먹으면 하루 동안 감염이 절반 속도로 퍼진다
    slow: [antibiotics]
    # 감염을 떼는 유일한 약. 잠복에도 듣는다
    cure: [serum, mil_serum]
    # 감염으로 죽으면 그 자리에 막 변한 감염체로 남는다 (12-117). 겉모습과 짐은 그 사람의 것
    turns_into: infected_fresh
  # 추위: 하루마다 계절·날씨의 추위만큼 (방한복은 들고 있으면 1 덜어 준다). 끝까지 가면 얼어 죽는다 (부상 없이)
  cold:
    track: cold
    season: { winter: 1 }
    weather: { snow: 1, cold_snap: 2, rain: 1 }
    gear: { coat: 1 }
    # 우리 거점에서 무리의 연료가 하루치 이상 있으면 불 땐 거처 (기온이 있으면 실내 체감이 heated 아래로 내려가지 않는다)
    # guests (12-121): 다른 무리 거점도 그 무리가 우리를 0 이상으로 보면 불 땐 방에 재워 준다 (적대·떠돌이를 노리는 무리는 아니다)
    shelter: { resource: fuel, min_days: 1, warm: -2, guests: 0 }
    # 기온 (12-98, *임시*). 있으면 위의 하루 단위 추위(season·weather·gear) 대신 시간대마다 기온을 재고 냉기를 쌓는다.
    # 바깥 = 계절 평균 + 시간대 + 날씨 + 그날 ±2. 체감 = 바깥 + 실내(구역 cover) + 모닥불 + 방한복(입으면) + 담요(자거나 쉴 때) ± 체질 3
    # 체감이 8°보다 낮으면 (모자란 도 × 시간)만큼 냉기, 45마다 추위 한 단계 (12-195: 100 → 70, 플레이 테스트 11: 70 → 45). 8° 이상이면 시간당 20, 15° 이상이면 50씩 빠지고 100마다 풀린다
    climate:
      season: { winter: -3, spring: 9, summer: 24, autumn: 8 }
      segments: { dawn: -5, morning: -2, day: 3, evening: 0, night: -4 }
      # 한파 -10 → -7 (플레이 테스트 11, E2: 하루에 14° 떨어졌다)
      weather: { fog: -1, rain: -2, snow: -3, cold_snap: -7 }
      jitter: 2
      # 내일 새벽이 처음 영하면 오늘 보이는 낌새 (12-239)
      frost_omen: "저녁 바람이 매섭게 식는다. 밤사이 물통이 얼겠다 (방한복·담요·땔감을 챙길 때)"
      comfort: 8
      warm: 15
      # 70 → 45 (플레이 테스트 11, E1: 영하 12°에 방한복 없이 2시간이 "이상 없음") → 30 (플레이 테스트 13: 체감 3°·젖은 옷으로 밤새도 "이상 없음")
      per_step: 30
      # 녹는 속도 반으로 (12-255, PT15 섬: 의식장애가 실내 2시간 15분에 이상 없음까지 풀렸다): 20 → 10, 50 → 25
      mild_rate: 10
      warm_rate: 25
      indoor_weather: 0.5
      heated: 16
      # 피난처(성당·캠퍼스) 실내의 최저 체감 (12-122): 모여 사는 사람들이 불을 때지만 거점보다는 춥다
      sanctuary: 10
      trait_degrees: 3
      # 모닥불: 연료 → 타는 시간. 곁에 있으면 +10°, 피우면 그 구역 소음 +1 (연기와 불빛)
      # 땔감 한 단은 하룻밤 (12-186, 4 → 8시간)
      fire: { items: { firewood: 8, planks: 3, fuel_bottle: 2 }, warmth: 10, noise: 1 }
      # 젖은 옷 (12-121, 12-186, *임시*): 비 오는 날 바깥에 있었거나 강·하수구에 빠지면 마를 때까지 체감이 떨어진다.
      # 젖기 전 체감이 8° 밑이면 -10, 15° 밑이면 -6, 그 위면 -3 (12-251, 플레이 테스트 14: 여름비에도 -10이라 섬 사흘 내내 오한).
      # 바깥에서는 마르지 않는다. 불 곁(모닥불·난로)에서 2시간, 지붕 아래에서 4시간, 또는 갈아입을 옷이 있는 곳(우리 거점·내 거처·location.clothes)에서 갈아입으면 마른다
      wet: { weather: [rain], degrees: { cold: 10, cool: 6, mild: 3 }, fire_hours: 2, roof_hours: 4 }
  # 질병: 하루마다 확률. 굶주림·추위·무리의 물 부족마다 더하고, 체력 1당 25% 덜 걸린다
  disease:
    track: disease
    chance: { base: 0.01, starving: 0.05, cold: 0.05, thirst: 0.06 }
    thirst_resource: water
    resist: { ability: vitality, per_point: 0.25 }
    # 배부르고 따뜻하면 하루마다 낫는 확률 (체력 1당 +10%), 아니면 깊어지는 확률
    recover: { chance: 0.35, per_point: 0.1 }
    worsen: 0.3
  # 마음 다잡기 (12-220): 마음·공포가 오를 때 주인공이 버티기(냉정)를 굴린다. 성공 = 오르지 않음, 대가 있는 성공 = 한 단계 덜(적어도 한 단계), 실패 = 그대로.
  # 공포 판정이 실패해 공황에 이르면 마음도 한 단계 오른다
  steady: { move: endure, stat: nerve }
  # 마음 (12-48): 크게 다치면 1, 곁의 사람이 죽는 것을 보면 1. 마음 다잡기로 버틴다.
  # 굶주림·오한 이상이 아니면 하루마다 15% (냉정 1당 +10%), 우리 땅이거나 곁에 사람이 있으면 +20% 가라앉는다 (*임시*)
  nerves:
    track: nerves
    heavy_harm: 1
    witness_death: 1
    recover: { chance: 0.15, per_point: 0.1, safe: 0.2 }
    # 끊기지 않고 6시간 넘게 푹 자면 한 번 더: 우리 땅이나 동행 곁이면 50%, 아니면 25% (냉정 1당 +10%, *임시*).
    # 심란함은 푹 자면 굴리지 않고 풀린다 (12-251, 플레이 테스트 14: 12시간을 자고도 사흘 갔다)
    # 멘탈붕괴는 오래 가지 않는 급한 상태라 푹 자면 한 단계 풀린다 (설계 목록 3-1). 푹 잔 것은 지난 하루 잔 시간의 합 (3-2)
    sleep: { min_hours: 6, safe: 0.5, unsafe: 0.25, sure: [shaken, broken] }
  # 공포 (12-95, *임시*): 계기의 단계 + 어둠 1 - 동행 1 ± 트레잇. 마음 다잡기로 버틴다 (12-220).
  # 위협이 없으면 1시간마다 한 단계 가라앉고, 자고 나면 평정. 다잡지 못하고 공황에 이르면 마음 +1, 마음이 미칠 것 같음 이상이면 한 단계 더
  fear:
    track: fear
    gm: { startle: 1, dread: 2 }
    battle: 1
    witness_death: 1
    dark: { segments: [night], steps: 1 }
    companion: 1
    decay_hours: 1
    # 계기 하나로는 두 단계까지 (플레이 테스트 11, D7: 밤의 철사 이야기 하나로 평온에서 공황)
    max_steps: 2
    nerves_from: frayed

# 날씨 (12-3, *임시*). 하루마다 계절별 무게로 고른다. visibility: 숨은 목격자 확률 배수 (작을수록 안 보인다)
weather:
  kinds:
    - { id: clear, label: 맑음, description: 멀리까지 보인다, visibility: 1, icon: sun }
    - { id: overcast, label: 흐림, description: 하늘이 낮게 깔려 빛이 흐리다, visibility: 0.9, icon: cloud }
    - { id: rain, label: 비, description: 빗소리가 발소리를 덮고 길이 미끄럽다, visibility: 0.6, icon: rain }
    - { id: fog, label: 안개, description: 몇 걸음 앞도 잘 보이지 않는다. 숨어 움직이기 좋다, visibility: 0.4, icon: fog }
    - { id: snow, label: 눈, description: 소리는 묻히지만 발자국이 남는다, visibility: 1.1, icon: snow, omen: "하늘이 낮고 누렇다. 내일은 눈이 올 것 같다" }
    - { id: cold_snap, label: 한파, description: 바깥에 오래 있으면 손발이 얼어붙는다, visibility: 0.9, icon: cold, omen: "바람이 북쪽으로 돌고 하늘이 시리게 맑다. 내일은 몹시 추울 것 같다 (방한복·담요·땔감을 챙길 때)" }
  by_season:
    winter: { clear: 3, overcast: 3, snow: 3, fog: 1, cold_snap: 2 }
    spring: { clear: 4, overcast: 3, rain: 3, fog: 2 }
    summer: { clear: 4, rain: 4, overcast: 2 }
    autumn: { clear: 5, overcast: 3, rain: 2, fog: 2 }
  default: { clear: 1 }

# 계절 (12-1, *임시*). 1일차는 늦가을. 겨울엔 연료를 많이 쓰고 먹을 것이 덜 난다
seasons:
  start: { season: autumn, day: 14 }
  list:
    - { id: winter, label: 겨울, days: 20, upkeep: { fuel: 2, water: 0.9 }, yields: { food: 0.6, water: 0.8 } }
    - { id: spring, label: 봄, days: 20, yields: { food: 0.9 } }
    - { id: summer, label: 여름, days: 20, upkeep: { water: 1.15 }, yields: { food: 1.1 } }
    - { id: autumn, label: 가을, days: 20, yields: { food: 1.3 } }

# 세력 단위 전쟁 (9단계, 기획서 9장). 규칙은 core, 여기는 수치와 문구 (*임시*)
war:
  # 세계가 움직인 느낌 (12-242): 교전의 흔적, 사상자 가운데 이름 있는 대원, 공들인 관계
  felt:
    trace_days: 2
    # 언제인지는 코드가 앞에 붙인다(몇 시간 전·어제·이틀 전). 빈 땅 차지에는 옛 주인이 없다 (PT35 두 판, PT31·33·34)
    traces:
      assault: "총공격의 흔적: 바리케이드가 부서지고 벽에 총알 자국, 바닥에 탄피와 핏자국, 덮지 못한 시체 냄새가 남아 있다"
      raid: "습격의 흔적: 문이 비틀려 열려 있고, 흩어진 짐과 탄피, 끌고 간 자국이 남아 있다"
      skirmish: "총격전의 흔적: 엄폐물 뒤로 탄피가 흩어져 있고, 벽에 새 총알 자국이 있다"
      occupy: "새로 자리를 잡은 흔적: 새 깃발과 표식, 막 들여놓은 짐이 있다"
    named: { chance: 0.2, death: 0.15 }
    invested_from: 4
  # 1인당 하루 소모량
  upkeep: { food: 1, water: 1, fuel: 0.15 }
  # 모자라면 사기가 떨어지고 사람이 죽는 자원
  vital: [food, water]
  # 모자라면 사기만 떨어지는 자원 (겨울 추위)
  hardship: [fuel]
  ammo: ammo
  medicine: medicine
  ammo_per_clash: 15
  medicine_per_casualty: 2
  # 공격 성향 1당 하루에 공격에 나설 확률
  attack_chance_per_aggression: 0.12
  # 움직이는 부대 (docs/war-parties-plan.md, *임시*): 교전·땅 차지·교역이 그 자리에서 끝나지 않고 부대가 걸어가 닿았을 때 일어난다
  # max: 전투원 이 수 이상이면 동시에 낼 수 있는 부대 수. stay: 지나는 구역마다 머무는 시간(시), strike: 목표 바로 앞에서 숨었다가 치는 시각(시)
  parties:
    max: [{ combatants: 40, count: 3 }, { combatants: 15, count: 2 }, { combatants: 0, count: 1 }]
    slow_size: 10
    slow_factor: 1.5
    far_hops: 3
    # PT31: 나흘에 부대 셋~넷이라 적을 만날 일이 없었다 → 싸우지 않는 정찰·순찰을 늘린다 (공격 빈도는 그대로)
    patrol_chance: 0.6
    scout_chance: 0.6
    trade_every_days: 3
    # 사람이 부대를 알아채는 판정 (공통 규칙 23 마주침)
    notice_move: sense_danger
    # 습격·공세 부대를 이끄는 이름 있는 인물의 계급 (정찰·짐 행렬·순찰은 이름 없는 조장)
    leader_ranks: [squad_leader, officer]
    kinds:
      scout: { label: 정찰대, size: [3, 4], depart: [6, 14], stay: [4, 6] }
      raid: { label: 습격대, depart: [14, 20], stay: [0.5, 1], strike: [1, 4] }
      assault: { label: 공세 부대, depart: [4, 6], stay: [0.5, 1], gather_hours: 24 }
      supply: { label: 짐 행렬, size: [3, 5], depart: [7, 10], stay: [1, 2] }
      patrol: { label: 순찰대, size: [3, 5], depart: [7, 15], stay: [3, 6] }
  # 배급: 무리의 식량이 며칠 치 남았는지로
  ration:
    resource: food
    levels:
      # hunger: 이 배급을 받는 하루 동안 허기가 움직이는 단계 (음수면 나아진다), hunger_max: 이 배급으로는 여기까지만 배고파진다
      - { min_days: 10, label: 정량, hunger: -2 }
      - { min_days: 4, label: 줄어든 배급, hunger: 1, hunger_max: hungry }
      - { min_days: 1, label: 반쪽 배급, hunger: 1, hunger_max: starving }
      - { min_days: 0, label: 배급 끊김, hunger: 1 }
  # 사기 -3 ~ +3
  morale_labels: [무너지기 직전, 흉흉함, 가라앉음, 그럭저럭, 괜찮음, 들떠 있음, 기세등등]
  # 무리 형편을 대하는 말투 (12-105): 장면의 같은 무리 사람이 어려움을 어떻게 입에 올리는지. 트레잇이 가장 많이 겹치는 것
  talk:
    attitudes:
      - { id: grumble, label: 투덜댄다, hint: "몫이 줄었다, 윗사람들은 뭐 하냐는 불평. 남 탓이 섞인다", traits: [cynical, greedy, lazy, hot_tempered, weary, blunt] }
      - { id: rally, label: 다독인다, hint: "버티면 된다, 서로 나누자는 말. 일부러 밝게 군다", traits: [eager, warm, protective, principled, motherly, genial] }
      - { id: worry, label: 불안해한다, hint: "이러다 어떻게 되냐고 묻고 소문을 확인하려 든다", traits: [timid, cautious, curious, talkative] }
      - { id: reckon, label: 셈한다, hint: "감정 없이 며칠 버틸지, 누가 먼저 빠질지 따진다", traits: [cold, calculating, meticulous, ruthless] }
    default: { label: 조심스럽게 입에 올린다, hint: "지나가듯 한마디 하고 화제를 돌린다" }
    # 다른 무리의 형편은 말이 모이는 곳에서 소문으로 듣는다. 무리마다 하루 35% (*임시*). 들은 말은 지금 형편 그대로다 (12-185)
    rumor:
      chance: 0.35
      zones: [e_market, water_plant, rest_stop, old_town, cathedral]
  # 창고 사정 (며칠 치 남았는지)
  stock_labels:
    - { min_days: 20, label: 넉넉하다는 말 }
    - { min_days: 7, label: 빠듯하다는 말 }
    - { min_days: 1, label: 바닥이 보인다는 말 }
    - { min_days: 0, label: 다 떨어졌다는 말 }
  # 전황 소식. {attacker} {defender} {zone}, 사상자는 {attacker_loss} {defender_loss} (대략적인 말)
  news:
    raid_success: "{attacker:이/가} {zone}에서 {defender}의 물자를 털어 갔다고 한다. {defender} 쪽 사상자 {defender_loss}, {attacker} 쪽 {attacker_loss}"
    raid_failure: "{attacker:이/가} {zone}의 {defender} 물자를 노렸다가 쫓겨났다고 한다. {attacker} 쪽 사상자 {attacker_loss}"
    skirmish_success: "{zone} 근처에서 {attacker:과/와} {defender:이/가} 부딪쳤고, {defender} 쪽이 밀렸다고 한다. {defender} 쪽 사상자 {defender_loss}, {attacker} 쪽 {attacker_loss}"
    skirmish_failure: "{zone} 근처에서 {attacker:과/와} {defender:이/가} 부딪쳤고, {attacker} 쪽이 물러났다고 한다. {attacker} 쪽 사상자 {attacker_loss}, {defender} 쪽 {defender_loss}"
    assault_success: "{attacker:이/가} {zone:을/를} 공격해 {defender}에게서 빼앗았다고 한다. {defender} 쪽 사상자 {defender_loss}, {attacker} 쪽 {attacker_loss}"
    assault_failure: "{attacker:이/가} {zone:을/를} 공격했지만 {defender:이/가} 막아 냈다고 한다. {attacker} 쪽 사상자 {attacker_loss}, {defender} 쪽 {defender_loss}"
    occupy: "{attacker:이/가} 비어 있던 {zone}에 사람을 보내 자리를 잡았다고 한다"

# 전투 장면 (9-1, 기획서 9.5). 플레이어가 있는 교전을 라운드 단위로 푼다 (수치는 *임시*)
# 효과의 결과: momentum 전세(우리 편 기준), alarm 경보, advance 위치 전진, enemy_losses 적 사상자, destroy_objective 목표물 파괴
# min_harm: GM이 선언해야 하는 최소 몸의 위험. none이면 대가는 경보·전세로만 온다 (숨어들기는 들키는 것이 대가)
battle:
  round_minutes: 10
  max_rounds: 8
  momentum_to_win: 5
  max_alarm: 3
  positions:
    - { id: line, label: 전선 }
    - { id: flank, label: 측면 }
    - { id: rear, label: 적 후방 }
  objectives:
    - { id: leader, label: 지휘하는 자 }
    - { id: ammo_pile, label: 탄약 더미 }
    - { id: gun_nest, label: 기관총 자리 }
  preparations:
    - id: wire_trap
      label: 철사 덫
      description: 길목에 철사와 깡통을 엮어 걸려 넘어지게 하고 소리로 알린다
      requires_item: wire_roll
    # 12-176 (*임시*): 쓰고도 남는 엄폐·사격 자리. 바리케이드는 거점 시설이다 (facilities.barricade, 12-184)
    - id: sandbags
      label: 모래주머니 엄폐
      description: 천 자루에 흙을 채워 전선에 허리 높이로 쌓는다. 몸을 숨기고 버틸 수 있다
      materials: { cloth: 2 }
    - id: firing_post
      label: 사격 자리
      description: 판자로 받침과 가림막을 대어 길목이 내려다보이는 자리를 만든다
      materials: { planks: 1 }
  effects:
    - id: hold
      label: 버티며 싸우기
      description: 전선에서 엄폐하며 맞서 싸운다
      min_harm: light
      positions: [line]
      outcomes:
        success: { momentum: 1, enemy_losses: 1 }
        partial: { momentum: 1 }
        miss: { momentum: -1 }
    - id: sneak
      label: 숨어들기
      description: 적 눈을 피해 측면으로, 다시 적의 뒤로 파고든다
      min_harm: none
      positions: [line, flank]
      max_alarm: 1
      outcomes:
        success: { advance: 1 }
        partial: { advance: 1, alarm: 1 }
        miss: { alarm: 2 }
    - id: silence
      label: 소리 없이 해치우기
      description: 경보가 울리기 전에 보초나 연락병을 먼저 쓰러뜨린다
      min_harm: light
      positions: [flank, rear]
      max_alarm: 2
      outcomes:
        success: { alarm: -1, enemy_losses: 1 }
        partial: { enemy_losses: 1 }
        miss: { alarm: 2 }
    - id: ambush
      label: 기습
      description: 측면이나 뒤에서 덮친다. 적이 아직 모르면 더 크게 흔든다
      min_harm: light
      positions: [flank, rear]
      surprise_bonus: 1
      outcomes:
        success: { momentum: 2, enemy_losses: 2, alarm: 3 }
        partial: { momentum: 1, enemy_losses: 1, alarm: 2 }
        miss: { momentum: -1, alarm: 3 }
    - id: demolish
      label: 폭약
      description: 적 뒤쪽의 목표물(지휘하는 자, 탄약 더미, 기관총 자리)에 폭약을 터뜨린다
      min_harm: heavy
      positions: [rear]
      requires_item: explosive
      consumes_item: true
      targets_objective: true
      outcomes:
        success: { momentum: 2, enemy_losses: 2, destroy_objective: true, alarm: 3 }
        partial: { momentum: 1, destroy_objective: true, alarm: 3 }
        miss: { alarm: 3 }
    - id: spring_trap
      label: 덫 발동
      description: 미리 깔아 둔 덫으로 몰려오는 적을 끊는다
      min_harm: none
      positions: [line]
      requires_preparation: wire_trap
      outcomes:
        success: { momentum: 2, enemy_losses: 2 }
        partial: { momentum: 1, enemy_losses: 1 }
        miss: {}
    - id: cover_hold
      label: 엄폐하고 버티기
      description: 쌓아 둔 모래주머니 뒤에서 버틴다. 몸을 드러내지 않아 크게 다치지 않는다
      min_harm: none
      positions: [line]
      requires_preparation: sandbags
      keeps_preparation: true
      outcomes:
        success: { momentum: 1, enemy_losses: 1 }
        partial: { momentum: 1 }
        miss: {}
    - id: aimed_fire
      label: 자리 잡고 쏘기
      description: 미리 만든 사격 자리에서 다가오는 적을 하나씩 노린다
      min_harm: light
      positions: [line]
      requires_preparation: firing_post
      keeps_preparation: true
      outcomes:
        success: { momentum: 2, enemy_losses: 1 }
        partial: { momentum: 1, enemy_losses: 1 }
        miss: { momentum: -1 }
    - id: withdraw
      label: 물러나기
      description: 싸움에서 빠져 몸을 뺀다. 남은 싸움은 동료들이 치른다
      min_harm: light
      positions: [line, flank, rear]
      withdraw: true
      outcomes:
        success: {}
        partial: { momentum: -1 }
        miss: { momentum: -1 }


# 캐릭터 설정 (RP, design.md 4.6.4, 12-246). 목록 근거: docs/settings-draft.md
settings:
  slots:
    - { id: ideal, label: 이상, max: 1, rolls: true, describe: true, hint: "무엇을 위해 사나" }
    - { id: taboo, label: 금기, max: 2, rolls: true, hint: "무엇을 하지 않나" }
    - { id: flaw, label: 결점, max: 2, rolls: true, hint: "알면서도 못 고치는 것" }
    - { id: habit, label: 버릇, max: 2, rolls: false, hint: "몸에 밴 것" }
    - { id: speech, label: 말투, max: 1, rolls: false, hint: "입에 붙은 말" }
    - { id: secret, label: 비밀, max: 1, rolls: false, hint: "처음엔 아무도 모른다" }
    - { id: keepsake, label: 소중한 것, max: 1, rolls: false, hint: "시작할 때 지니고 있다" }
  items:
    - { id: "ideal_obedience", slot: "ideal", name: "복종", description: "명령 체계가 무너지면 모두 죽는다", acting: "윗사람의 명령을 먼저 따르고, 따지는 것은 그다음", confirm: "복종을 신념으로 가진", opposites: ["ideal_freedom"], needs_faction: true }
    - { id: "ideal_freedom", slot: "ideal", name: "자유", description: "누구의 개도 되지 않는다", acting: "시키는 일보다 스스로 정한 일을 앞세운다", confirm: "자유를 신념으로 가진", opposites: ["ideal_obedience"] }
    - { id: "ideal_protect", slot: "ideal", name: "약자 보호", description: "약한 사람을 지키는 것이 살아남은 이유다", acting: "아이·노인·다친 사람이 있으면 먼저 몸이 간다", confirm: "약한 사람을 지키기로 한", opposites: ["ideal_survival"] }
    - { id: "ideal_survival", slot: "ideal", name: "이기주의", description: "오늘 살아남는 것 말고는 다 사치다", acting: "위험과 몫을 먼저 셈하고, 남을 위한 모험을 꺼린다", confirm: "살아남는 것을 먼저 둔", opposites: ["ideal_protect"] }
    - { id: "ideal_truth", slot: "ideal", name: "진실", description: "거짓 위에 세운 것은 무너진다", acting: "숨긴 것을 캐묻고, 덮자는 말에 불편해한다", confirm: "진실을 신념으로 가진" }
    - { id: "ideal_loyalty", slot: "ideal", name: "의리", description: "같이 버틴 사람을 버리지 않는다", acting: "함께한 사람의 편을 먼저 든다, 무리보다 사람", confirm: "의리를 신념으로 가진" }
    - { id: "ideal_rebuild", slot: "ideal", name: "재건", description: "무너진 도시를 다시 사람 사는 곳으로 만든다", acting: "부서진 것을 고치고, 씨앗과 책과 기술을 아낀다", confirm: "재건을 꿈꾸는" }
    - { id: "ideal_fairness", slot: "ideal", name: "공평", description: "몫은 똑같이 나눠야 한다", acting: "배급·전리품을 셈하고, 한쪽으로 쏠리면 말을 꺼낸다", confirm: "공평을 신념으로 가진" }
    - { id: "ideal_faith", slot: "ideal", name: "신앙", description: "신을 믿는다. 이 모든 일에도 뜻이 있다", acting: "기도하고, 죽은 이를 묻고, 절망하는 사람에게 말을 건넨다", confirm: "신앙을 지키는" }
    - { id: "ideal_family", slot: "ideal", name: "가족", description: "가족이 전부다", acting: "가족 소식과 안전을 무엇보다 먼저 챙긴다", confirm: "가족을 전부로 여기는" }
    - { id: "ideal_revenge", slot: "ideal", name: "복수", description: "빼앗아 간 자에게 반드시 갚아 준다", acting: "원수의 이름에 표정이 굳고, 기회를 노린다", confirm: "복수를 다짐한", opposites: ["ideal_mercy"] }
    - { id: "ideal_mercy", slot: "ideal", name: "자비", description: "죽이지 않을 수 있으면 죽이지 않는다", acting: "항복한 자·적의 부상자에게도 손을 내민다", confirm: "자비를 신념으로 가진", opposites: ["ideal_revenge"] }
    - { id: "ideal_knowledge", slot: "ideal", name: "지식", description: "책과 기록, 옛 기술을 지켜 다음 세대에 남긴다", acting: "글·기록·옛 물건을 모으고, 배울 기회를 놓치지 않는다", confirm: "지식을 지키려는" }
    - { id: "ideal_strength", slot: "ideal", name: "약육강식", description: "강한 자가 정하고 약한 자는 따른다", acting: "약한 모습을 보이지 않고, 힘으로 결론을 내려 한다", confirm: "힘을 믿는", opposites: ["ideal_mercy"] }

    - { id: "taboo_no_child_harm", slot: "taboo", name: "아이를 해치지 않는다", description: "어떤 까닭이 있어도", acting: "아이가 끼면 손이 멈춘다", confirm: "아이만은 해치지 않기로 한" }
    - { id: "taboo_no_unarmed", slot: "taboo", name: "무기 없는 사람은 죽이지 않는다", description: "무기를 놓은 사람은 끝난 사람이다", acting: "항복한 자 앞에서 총구를 내린다", opposites: ["ideal_revenge"], confirm: "맨손인 자는 죽이지 않기로 한" }
    - { id: "taboo_no_theft", slot: "taboo", name: "훔치지 않는다", description: "굶어도 남의 것에는 손대지 않는다", acting: "주인 있는 물건 앞에서 머뭇거린다", clashes_roles: ["role_c_raider", "role_c_comrades"], confirm: "남의 것은 훔치지 않기로 한" }
    - { id: "taboo_no_lie_friend", slot: "taboo", name: "동료에게 거짓말하지 않는다", description: "바깥사람은 몰라도 우리끼리는", acting: "같은 편에게 둘러대지 못한다", confirm: "동료에게는 거짓말하지 않기로 한" }
    - { id: "taboo_no_abandon", slot: "taboo", name: "다친 동료를 두고 가지 않는다", description: "끌고 가다 같이 죽더라도", acting: "쓰러진 사람을 업으려 한다", opposites: ["ideal_survival"], confirm: "다친 동료를 두고 가지 않기로 한" }
    - { id: "taboo_no_infected_meat", slot: "taboo", name: "출처 모를 고기는 먹지 않는다", description: "굶는 게 낫다", acting: "출처 모를 고기를 밀어낸다", confirm: "수상한 고기는 먹지 않기로 한" }
    - { id: "taboo_no_human_flesh", slot: "taboo", name: "사람 고기는 먹지 않는다", description: "굶어 죽더라도 그 선은 넘지 않는다", acting: "고기 출처를 묻고, 대답이 없으면 손대지 않는다", confirm: "사람 고기는 먹지 않기로 한" }
    - { id: "taboo_no_drink", slot: "taboo", name: "술에 손대지 않는다", description: "한 번 무너진 적이 있다", acting: "술잔을 사양하고, 술 냄새에 표정이 굳는다", trait_opposites: ["drinker"], confirm: "술을 끊은" }
    - { id: "taboo_no_betray", slot: "taboo", name: "무리를 배신하지 않는다", description: "붙잡혀도, 매를 맞아도", acting: "심문에 입을 다문다", needs_faction: true, confirm: "무리를 팔지 않기로 한" }
    - { id: "taboo_no_kill_human", slot: "taboo", name: "사람은 죽이지 않는다", description: "감염체는 몰라도 사람은", acting: "사람을 겨눌 때 손이 떨린다", opposites: ["ideal_strength"], clashes_roles: ["role_c_raider", "role_c_comrades", "role_a_squad_leader", "role_b_squad_leader", "role_c_squad_leader", "role_d_squad_leader", "role_e_squad_leader"], confirm: "사람만은 죽이지 않기로 한" }
    - { id: "taboo_no_debt", slot: "taboo", name: "빚지지 않는다", description: "빚은 목줄이다", acting: "공짜 호의도 값을 치르려 한다", confirm: "빚지지 않기로 한" }
    - { id: "taboo_no_grave_rob", slot: "taboo", name: "죽은 이의 것을 뒤지지 않는다", description: "묻어 주는 게 먼저다", acting: "유해의 짐에 손대기 전에 묻어 주자고 한다", confirm: "죽은 이의 것은 뒤지지 않기로 한" }
    - { id: "taboo_no_cage", slot: "taboo", name: "사람을 가두지 않는다", description: "갇혀 본 적이 있다", acting: "포로를 묶는 일·감옥 당번을 꺼린다", clashes_roles: ["role_c_raider", "role_c_comrades"], confirm: "사람을 가두지 않기로 한" }
    - { id: "taboo_no_back", slot: "taboo", name: "뒤에서 공격하지 않는다", description: "싸우려면 마주 보고", acting: "기습·암살을 거절한다", confirm: "등 뒤는 치지 않기로 한" }
