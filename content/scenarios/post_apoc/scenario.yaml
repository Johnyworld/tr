# 포스트아포칼립스 시나리오 팩 (기획서 12.3)
# 게임 시스템이 쓰는 장르 요소의 이름과 목록. 규칙(2d6, 시간, 정보 필터 등)은 core에 있다
id: post_apoc
name: 포스트아포칼립스

# 자원 (세력 전쟁·배급에서 쓴다)
resources:
  - { id: food, label: 식량 }
  - { id: water, label: 물 }
  - { id: ammo, label: 탄약 }
  - { id: medicine, label: 의약품 }
  - { id: fuel, label: 연료 }

# 능력 (기획서 4.6): 타고난 것. 계급·역할과 관계없고 바뀌지 않는다
stats:
  - { id: strength, label: 근력, description: "힘, 완력" }
  - { id: agility, label: 민첩, description: "손발의 빠르기, 정확함" }
  - { id: vitality, label: 체력, description: "버티는 몸, 지구력. 병에 덜 걸리고 잘 낫는다" }
  - { id: senses, label: 감각, description: "보고 듣고 알아차림" }
  - { id: nerve, label: 냉정, description: "압박 속의 침착함" }
  - { id: charm, label: 매력, description: "사람을 끄는 힘. 첫인상과 호감에도 작용한다" }
  - { id: intellect, label: 지능, description: "배우고 기억하고 따지는 머리" }

# 스킬 (기획서 4.6): 배우는 것. stats는 쓸 수 있는 능력(GM이 상황에 맞게 하나를 고른다), default는 배우지 않았을 때
# -1 할 줄 모름 / 0 아마추어 / +1 숙련 / +2 마스터
moves:
  - { id: fight, label: 근접전, category: 전투, stats: [strength, agility], description: "칼·몽둥이·맨손" }
  - { id: shoot, label: 사격, category: 전투, stats: [agility, senses], default: -1, description: "총, 활" }
  - { id: stealth, label: 은밀, category: 몸, stats: [agility], description: "들키지 않고 움직이기" }
  - { id: endure, label: 버티기, category: 몸, stats: [vitality, nerve], description: "고통·공포·추위 속에서 행동" }
  - { id: sense_danger, label: 경계, category: 감각, stats: [senses], description: "낌새, 숨은 목격자·함정 알아차리기" }
  - { id: scavenge, label: 수색, category: 감각, stats: [senses, intellect], description: "물자와 단서 찾기" }
  - { id: persuade, label: 교섭, category: 사람, stats: [charm], description: "설득, 흥정" }
  - { id: deceive, label: 거짓말, category: 사람, stats: [charm, nerve], description: "속이기" }
  - { id: intimidate, label: 위협, category: 사람, stats: [strength, nerve], description: "겁주기, 압박" }
  - { id: survival, label: 생존, category: 생존, stats: [vitality, senses], description: "추적, 야외에서 버티기, 불 피우기, 먹을 것·물 구하기" }
  - { id: first_aid, label: 응급처치, category: 생존, stats: [intellect, senses], default: -1, description: "상처 돌보기" }
  - { id: infected_lore, label: 감염체, category: 지식, stats: [intellect], default: -1, description: "감염체의 습성·약점·감염 징후" }
  - { id: history, label: 역사, category: 지식, stats: [intellect], default: -1, description: "붕괴 전후의 일, 지역과 무리들의 내력" }
  - { id: mechanics, label: 차량정비, category: 지식, stats: [intellect, agility], default: -1, description: "차량·발전기·기계 고치기" }
  - { id: carpentry, label: 목공, category: 지식, stats: [strength, intellect], default: -1, description: "바리케이드, 덫, 수리" }
  - { id: tactics, label: 전략, category: 지식, stats: [intellect, nerve], default: -1, description: "전투·전쟁 수행, 지휘" }

# 능력·스킬 범위. 능력 + 스킬은 최대 +4 (2d6에서 +5부터는 실패가 사라진다)
ranges:
  ability: { min: -1, max: 2 }
  skill: { min: -1, max: 2 }
  cap: 4
# 새 캐릭터의 능력: 이 배열을 코드가 무작위로 섞어 준다 (역할과 무관)
ability_array: [2, 1, 1, 0, 0, 0, -1]
# 이전 세이브의 옛 능력 id
renamed:
  abilities: { persuasion: charm }
# 경험치와 레벨업 (*임시*): 레벨 1에 10, 그다음 15, 20… 레벨업마다 스킬 하나 +1
growth:
  first: 10
  step: 5
  xp: { success: 1, partial: 1, miss: 2, merit: 2 }
  daily_check_cap: 6
# 매력의 수동 효과: 처음 만난 인물의 호감 + (매력 ÷ 2), 매력 +2면 호감이 오를 때 +1
charm: { ability: charm, first_impression_per: 2, bonus_at: 2 }

# 시스템이 특정 역할로 쓰는 행동 (목격자 살피기, 목격 확률 낮추기)
move_roles:
  notice: sense_danger
  stealth: stealth

# 상태 트랙. 앞에서 뒤로 악화된다. fatal 단계에 이르면 사망 (판정 보정은 임시값)
condition_tracks:
  - id: harm
    label: 부상
    levels:
      - { id: none, label: 무사, penalty: 0 }
      - { id: light, label: 경상, penalty: -1 }
      - { id: serious, label: 중상, penalty: -2 }
      - { id: critical, label: 치명상, penalty: -3 }
      - { id: dead, label: 사망, penalty: 0, fatal: true }
  # 허기 (12-1): 하루마다 배급 수준만큼 바뀐다. 기진에 이르면 굶주림으로 부상
  - id: hunger
    label: 허기
    levels:
      - { id: fed, label: 든든함, penalty: 0 }
      - { id: hungry, label: 허기짐, penalty: 0 }
      - { id: starving, label: 굶주림, penalty: -1 }
      - { id: famished, label: 기진함, penalty: -2 }
  # 감염 (12-1): 감염체에게 다치면 확률로 잠복기. 잠복기는 캐릭터가 모른다(hidden). 하루마다 나빠지고, 악화에 이르면 하루마다 부상
  - id: infection
    label: 감염
    levels:
      - { id: clean, label: 없음, penalty: 0 }
      - { id: incubating, label: 잠복, penalty: 0, hidden: true }
      - { id: fever, label: 발열, penalty: -1 }
      - { id: grave, label: 악화, penalty: -2 }
  # 추위 (12-4): 계절·날씨만큼 추워진다. 연료가 있는 우리 거점에서는 녹는다. 저체온이면 하루마다 부상
  - id: cold
    label: 추위
    levels:
      - { id: warm, label: 따뜻함, penalty: 0 }
      - { id: chilly, label: 쌀쌀함, penalty: 0 }
      - { id: cold, label: 추위, penalty: -1 }
      - { id: hypothermia, label: 저체온, penalty: -2 }
  # 질병 (12-4): 몸이 약해지면 걸린다. 잠복기는 캐릭터가 모른다. 위중하면 하루마다 부상
  - id: disease
    label: 질병
    levels:
      - { id: healthy, label: 없음, penalty: 0 }
      - { id: incubating, label: 잠복, penalty: 0, hidden: true }
      - { id: sick, label: 앓음, penalty: -1 }
      - { id: critical, label: 위중, penalty: -2 }
# apply_harm이 쓰는 트랙
harm_track: harm

# 소속 등급 사다리. level은 지휘 계통상의 높이 (화법 규칙에 쓴다)
# staff(지원 인력)와 leader(지도부)는 기획서 12.3 예시에 더해 쓰는 곳이 있어 둔다
rank_ladder:
  - { id: loner, label: 혼자, level: 0 }
  - { id: outsider, label: 외부 무리 일원, level: 0 }
  - { id: grunt, label: 하급 전투원, level: 1 }
  - { id: staff, label: 지원 인력, level: 1 }
  - { id: squad_leader, label: 분대장, level: 2 }
  - { id: officer, label: 간부, level: 3 }
  - { id: leader, label: 지도부, level: 4 }
# 진급 경로 (MVP: 하급 전투원 → 분대장)
promotion: { from: grunt, to: squad_leader }

speech_rules: speech/post_apoc.yaml
# GM 지침 (두 플레이 모드가 같은 파일을 읽는다, 기획서 11.6)
gm_tone: prompts/post_apoc_tone.md
gm_rules: prompts/gm_rules.md
mcp_guide: prompts/mcp_play.md

# 부상 회복 (*임시*). 치료사에게 받거나, 새 부상 없이 며칠 지나면 조금씩 낫는다
recovery:
  natural_days: 2
  # 중상까지는 저절로 낫는다. 치명상은 치료가 필요하다
  natural_max_level: serious
  # 치료사에게 받으면 (하루 한 번) 트랙별로 낫는 단계
  healer: { harm: 1, infection: 1, disease: 1 }

# 쓰면 몸이 나아지는 물건 (take_action.use_item): 아이템 → 트랙 → 나아지는 단계 (*임시*)
consumables:
  medkit: { harm: 1 }
  antibiotics: { harm: 1, infection: 2 }
  canned_food: { hunger: 2 }
  blanket: { cold: 2 }
  fever_reducer: { disease: 1 }

# 몸 상태 (12-1, *임시*)
body:
  hunger: { track: hunger, starving_harm: 1 }
  infection:
    track: infection
    # 감염체에게 다쳤을 때 감염될 확률 (선언한 위험 크기별)
    chance: { light: 0.3, heavy: 0.6 }
    worst_harm: 1
  # 추위: 하루마다 계절·날씨의 추위만큼 (방한복은 들고 있으면 1 덜어 준다)
  cold:
    track: cold
    season: { winter: 1 }
    weather: { snow: 1, cold_snap: 2, rain: 1 }
    gear: { coat: 1 }
    # 우리 거점에서 무리의 연료가 하루치 이상 있으면 2단계 녹는다
    shelter: { resource: fuel, min_days: 1, warm: -2 }
    worst_harm: 1
  # 질병: 하루마다 확률. 굶주림·추위·무리의 물 부족마다 더하고, 체력 1당 25% 덜 걸린다
  disease:
    track: disease
    chance: { base: 0.01, starving: 0.05, cold: 0.05, thirst: 0.06 }
    thirst_resource: water
    resist: { ability: vitality, per_point: 0.25 }
    # 배부르고 따뜻하면 하루마다 낫는 확률 (체력 1당 +10%), 아니면 깊어지는 확률
    recover: { chance: 0.35, per_point: 0.1 }
    worsen: 0.3
    worst_harm: 1

# 날씨 (12-3, *임시*). 하루마다 계절별 무게로 고른다. visibility: 숨은 목격자 확률 배수 (작을수록 안 보인다)
weather:
  kinds:
    - { id: clear, label: 맑음, description: 멀리까지 보인다, visibility: 1 }
    - { id: overcast, label: 흐림, description: 하늘이 낮게 깔려 빛이 흐리다, visibility: 0.9 }
    - { id: rain, label: 비, description: 빗소리가 발소리를 덮고 길이 미끄럽다, visibility: 0.6 }
    - { id: fog, label: 안개, description: 몇 걸음 앞도 잘 보이지 않는다. 숨어 움직이기 좋다, visibility: 0.4 }
    - { id: snow, label: 눈, description: 소리는 묻히지만 발자국이 남는다, visibility: 1.1 }
    - { id: cold_snap, label: 한파, description: 바깥에 오래 있으면 손발이 얼어붙는다, visibility: 0.9 }
  by_season:
    winter: { clear: 3, overcast: 3, snow: 3, fog: 1, cold_snap: 2 }
    spring: { clear: 4, overcast: 3, rain: 3, fog: 2 }
    summer: { clear: 4, rain: 4, overcast: 2 }
    autumn: { clear: 5, overcast: 3, rain: 2, fog: 2 }
  default: { clear: 1 }

# 계절 (12-1, *임시*). 1일차는 늦가을. 겨울엔 연료를 많이 쓰고 먹을 것이 덜 난다
seasons:
  start: { season: autumn, day: 14 }
  list:
    - { id: winter, label: 겨울, days: 20, upkeep: { fuel: 2, water: 0.9 }, yields: { food: 0.6, water: 0.8 } }
    - { id: spring, label: 봄, days: 20, yields: { food: 0.9 } }
    - { id: summer, label: 여름, days: 20, upkeep: { water: 1.15 }, yields: { food: 1.1 } }
    - { id: autumn, label: 가을, days: 20, yields: { food: 1.3 } }

# 세력 단위 전쟁 (9단계, 기획서 9장). 규칙은 core, 여기는 수치와 문구 (*임시*)
war:
  # 1인당 하루 소모량
  upkeep: { food: 1, water: 1, fuel: 0.15 }
  # 모자라면 사기가 떨어지고 사람이 죽는 자원
  vital: [food, water]
  # 모자라면 사기만 떨어지는 자원 (겨울 추위)
  hardship: [fuel]
  ammo: ammo
  medicine: medicine
  ammo_per_clash: 15
  medicine_per_casualty: 2
  # 공격 성향 1당 하루에 공격에 나설 확률
  attack_chance_per_aggression: 0.12
  # 배급: 무리의 식량이 며칠 치 남았는지로
  ration:
    resource: food
    levels:
      # hunger: 이 배급을 받는 하루 동안 허기가 움직이는 단계 (음수면 나아진다), hunger_max: 이 배급으로는 여기까지만 배고파진다
      - { min_days: 10, label: 정량, hunger: -2 }
      - { min_days: 4, label: 줄어든 배급, hunger: 1, hunger_max: hungry }
      - { min_days: 1, label: 반쪽 배급, hunger: 1, hunger_max: starving }
      - { min_days: 0, label: 배급 끊김, hunger: 1 }
  # 사기 -3 ~ +3
  morale_labels: [무너지기 직전, 흉흉함, 가라앉음, 그럭저럭, 괜찮음, 들떠 있음, 기세등등]
  # 창고 사정 (며칠 치 남았는지)
  stock_labels:
    - { min_days: 20, label: 넉넉하다는 말 }
    - { min_days: 7, label: 빠듯하다는 말 }
    - { min_days: 1, label: 바닥이 보인다는 말 }
    - { min_days: 0, label: 다 떨어졌다는 말 }
  # 전황 소식. {attacker} {defender} {zone}, 사상자는 {attacker_loss} {defender_loss} (대략적인 말)
  news:
    raid_success: "{attacker:이/가} {zone}에서 {defender}의 물자를 털어 갔다고 한다. {defender} 쪽 사상자 {defender_loss}, {attacker} 쪽 {attacker_loss}"
    raid_failure: "{attacker:이/가} {zone}의 {defender} 물자를 노렸다가 쫓겨났다고 한다. {attacker} 쪽 사상자 {attacker_loss}"
    skirmish_success: "{zone} 근처에서 {attacker:과/와} {defender:이/가} 부딪쳤고, {defender} 쪽이 밀렸다고 한다. {defender} 쪽 사상자 {defender_loss}, {attacker} 쪽 {attacker_loss}"
    skirmish_failure: "{zone} 근처에서 {attacker:과/와} {defender:이/가} 부딪쳤고, {attacker} 쪽이 물러났다고 한다. {attacker} 쪽 사상자 {attacker_loss}, {defender} 쪽 {defender_loss}"
    assault_success: "{attacker:이/가} {zone:을/를} 공격해 {defender}에게서 빼앗았다고 한다. {defender} 쪽 사상자 {defender_loss}, {attacker} 쪽 {attacker_loss}"
    assault_failure: "{attacker:이/가} {zone:을/를} 공격했지만 {defender:이/가} 막아 냈다고 한다. {attacker} 쪽 사상자 {attacker_loss}, {defender} 쪽 {defender_loss}"
    occupy: "{attacker:이/가} 비어 있던 {zone}에 사람을 보내 자리를 잡았다고 한다"

# 전투 장면 (9-1, 기획서 9.5). 플레이어가 있는 교전을 라운드 단위로 푼다 (수치는 *임시*)
# 효과의 결과: momentum 전세(우리 편 기준), alarm 경보, advance 위치 전진, enemy_losses 적 사상자, destroy_objective 목표물 파괴
# min_harm: GM이 선언해야 하는 최소 몸의 위험. none이면 대가는 경보·전세로만 온다 (숨어들기는 들키는 것이 대가)
battle:
  round_minutes: 10
  max_rounds: 8
  momentum_to_win: 5
  max_alarm: 3
  positions:
    - { id: line, label: 전선 }
    - { id: flank, label: 측면 }
    - { id: rear, label: 적 후방 }
  objectives:
    - { id: leader, label: 지휘하는 자 }
    - { id: ammo_pile, label: 탄약 더미 }
    - { id: gun_nest, label: 기관총 자리 }
  preparations:
    - id: wire_trap
      label: 철사 덫
      description: 길목에 철사와 깡통을 엮어 걸려 넘어지게 하고 소리로 알린다
      requires_item: wire_roll
  effects:
    - id: hold
      label: 버티며 싸우기
      description: 전선에서 엄폐하며 맞서 싸운다
      min_harm: light
      positions: [line]
      outcomes:
        success: { momentum: 1, enemy_losses: 1 }
        partial: { momentum: 1 }
        miss: { momentum: -1 }
    - id: sneak
      label: 숨어들기
      description: 적 눈을 피해 측면으로, 다시 적의 뒤로 파고든다
      min_harm: none
      positions: [line, flank]
      max_alarm: 1
      outcomes:
        success: { advance: 1 }
        partial: { advance: 1, alarm: 1 }
        miss: { alarm: 2 }
    - id: silence
      label: 소리 없이 해치우기
      description: 경보가 울리기 전에 보초나 연락병을 먼저 쓰러뜨린다
      min_harm: light
      positions: [flank, rear]
      max_alarm: 2
      outcomes:
        success: { alarm: -1, enemy_losses: 1 }
        partial: { enemy_losses: 1 }
        miss: { alarm: 2 }
    - id: ambush
      label: 기습
      description: 측면이나 뒤에서 덮친다. 적이 아직 모르면 더 크게 흔든다
      min_harm: light
      positions: [flank, rear]
      surprise_bonus: 1
      outcomes:
        success: { momentum: 2, enemy_losses: 2, alarm: 3 }
        partial: { momentum: 1, enemy_losses: 1, alarm: 2 }
        miss: { momentum: -1, alarm: 3 }
    - id: demolish
      label: 폭약
      description: 적 뒤쪽의 목표물(지휘하는 자, 탄약 더미, 기관총 자리)에 폭약을 터뜨린다
      min_harm: heavy
      positions: [rear]
      requires_item: explosive
      consumes_item: true
      targets_objective: true
      outcomes:
        success: { momentum: 2, enemy_losses: 2, destroy_objective: true, alarm: 3 }
        partial: { momentum: 1, destroy_objective: true, alarm: 3 }
        miss: { alarm: 3 }
    - id: spring_trap
      label: 덫 발동
      description: 미리 깔아 둔 덫으로 몰려오는 적을 끊는다
      min_harm: none
      positions: [line]
      requires_preparation: wire_trap
      outcomes:
        success: { momentum: 2, enemy_losses: 2 }
        partial: { momentum: 1, enemy_losses: 1 }
        miss: {}
    - id: withdraw
      label: 물러나기
      description: 싸움에서 빠져 몸을 뺀다. 남은 싸움은 동료들이 치른다
      min_harm: light
      positions: [line, flank, rear]
      withdraw: true
      outcomes:
        success: {}
        partial: { momentum: -1 }
        miss: { momentum: -1 }

# 환경 위협: 빨리감기 중 끼어드는 이상 징후 (임시값). 조우 테이블이 생기면 바꾼다
threats:
  disturbance_chance_per_hour: { dawn: 0.05, morning: 0.03, day: 0.03, evening: 0.05, night: 0.08 }
  disturbance_details:
    - 멀리서 들리는 소리
    - 가까운 곳의 인기척
    - 어둠 속의 움직임
    - 낯선 냄새
    - 거점 쪽의 소란
