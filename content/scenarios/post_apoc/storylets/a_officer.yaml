# 청솔형제단 참모 스토리렛 (초안). 형식은 a_grunt.yaml 머리말 참고
# 이어지는 이야기 (플래그):
#   한도윤의 자루: a_of_ledger_gap → a_of_night_sacks → a_of_doyun_reckoning
#   버들마을: a_of_b_ammo_ask → a_of_b_red_envoy → (버들마을이 발을 빼면, 태도 조건) a_of_b_left
#   봉재석: a_of_jaeseok_offer → a_of_jaeseok_gone
#   여한결: a_of_hangyeol_sister (하얀매로 보내면 떠난다)
# tags: a_officer = 이 시나리오에 묶인 이야기, council = 간부라면 누구나 겪을 회의·배분 이야기
# 세력 클락: a_counteroffensive(우리 반격), c_east_offensive(붉은연합 동쪽 공세), b_waver(버들마을 이탈, 낮출수록 연합이 버틴다)

# ── 고정: 지도부 회의 ───────────────────────────────

- id: a_of_council_split
  title: 탄 백 발의 행방
  tags: [a_officer]
  when:
    zones: [a_base]
    segments: [morning, day]
    flags_none: [a_of_council_done]
  cast:
    hawk: { ids: [a_jeonghun] }
    ledger: { ids: [a_doyun] }
  setup: '교무실 회의. {hawk:이/가} 칠판의 물류창고를 분필로 두드린다. "탄 백 발만 몰아주면 열흘 안에 칩니다." {ledger:은/는} 장부를 덮지도 않고 말한다. "그 백 발이면 동쪽 초소가 보름을 버팁니다." 최선희가 당신을 본다. 참모 안을 듣겠다는 뜻이다.'
  ai_direction: 첫 회의다. 두 간부는 서로를 싫어하지 않지만 숫자로만 싸운다. 육정훈은 반격이 늦을수록 사람이 준다고 믿고, 한도윤은 탄이 떨어지면 초소가 끝난다고 믿는다. 둘 다 맞다. 최선희는 참모의 말을 들은 뒤 그대로 정한다. 양은 코드가 정했다. 숫자를 새로 지어내지 않는다.
  choices:
    - id: back_offense
      label: 반격 쪽에 탄을 몰아주자고 한다
      effects:
        - set_flag: a_of_council_done
        - set_flag: a_of_backed_hawk
        - clock: { id: a_counteroffensive, delta: 2 }
        - relation: { who: hawk, axis: trust, delta: 2 }
        - relation: { who: ledger, axis: respect, delta: -1 }
        - belief: { fact: "회의에서 반격 쪽에 탄을 몰아주자고 했고 최선희가 받아들였다. 한도윤은 장부에 무언가를 길게 적었다", source: seen }
    - id: back_defense
      label: 동쪽 초소를 먼저 채우자고 한다
      effects:
        - set_flag: a_of_council_done
        - clock: { id: c_east_offensive, delta: -1 }
        - relation: { who: ledger, axis: trust, delta: 1 }
        - relation: { who: hawk, axis: respect, delta: -1 }
        - belief: { fact: "탄은 동쪽 초소로 갔다. 육정훈은 회의가 끝나자마자 말없이 나갔다", source: seen }
    - id: split
      label: 반씩 나누는 안을 숫자로 짜서 내민다
      check: tactics
      outcomes:
        success:
          - set_flag: a_of_council_done
          - clock: { id: a_counteroffensive, delta: 1 }
          - relation: { who: hawk, axis: respect, delta: 1 }
          - relation: { who: ledger, axis: respect, delta: 1 }
          - relation: { who: commander, axis: trust, delta: 1 }
          - belief: { fact: "반씩 나누는 안이 통과됐다. 두 간부 모두 마지못해 고개를 끄덕였다", source: seen }
        partial:
          - set_flag: a_of_council_done
          - belief: { fact: "안은 통과됐지만 육정훈도 한도윤도 자기 몫이 깎였다고 여긴다", source: seen }
        miss:
          - set_flag: a_of_council_done
          - relation: { who: commander, axis: respect, delta: -1 }
          - belief: { fact: "셈이 틀렸다. 한도윤이 그 자리에서 숫자를 바로잡았고, 최선희는 결정을 내일로 미뤘다", source: seen }

- id: a_of_ledger_gap
  title: 맞지 않는 자루
  tags: [a_officer]
  when:
    own_territory: true
    segments: [day, evening]
    day_gte: 2
    flags_none: [a_of_gap_seen]
  cast:
    clerk: { ids: [a_sujin] }
  setup: '교무실 구석에서 {clerk:이/가} 배급 대장 사본을 넘기다 손을 멈춘다. 연필 끝으로 한 줄을 짚었다가, 당신과 눈이 마주치자 얼른 갱지를 덮는다. "아니에요. 제가 잘못 센 거겠죠."'
  ai_direction: 기수진은 대장과 창고의 자루 수가 맞지 않는다는 걸 안다. 밤에 한도윤이 자루를 옮기는 것을 봤지만 그건 아직 말하지 않는다. 몰아붙이면 입을 닫는다. 한도윤의 비밀(비상 식량을 따로 숨긴 것)은 GM도 아직 확정해서 말하지 않는다.
  choices:
    - id: gentle
      label: 덮은 갱지를 같이 보자고 조용히 청한다
      check: persuade
      outcomes:
        success:
          - set_flag: a_of_gap_seen
          - set_flag: a_of_sujin_trusts
          - relation: { who: clerk, axis: trust, delta: 2 }
          - belief: { fact: "기수진이 보여 줬다. 대장보다 창고의 곡식 자루가 열 개 넘게 모자란다. 그녀는 밤에 무언가 봤다는 말을 하다가 삼켰다", source: report }
        partial:
          - set_flag: a_of_gap_seen
          - relation: { who: clerk, axis: trust, delta: 1 }
          - belief: { fact: "기수진은 대장과 창고 숫자가 조금 다르다고만 했다. 누가 셌는지는 말하지 않았다", source: report }
        miss:
          - set_flag: a_of_gap_seen
          - belief: { fact: "기수진은 정말 아무것도 아니라며 갱지를 품에 안고 나갔다", source: seen }
    - id: order
      label: 참모로서 대장 사본을 내놓으라고 한다
      effects:
        - set_flag: a_of_gap_seen
        - relation: { who: clerk, axis: trust, delta: -1 }
        - relation: { who: clerk, axis: respect, delta: 1 }
        - belief: { fact: "대장 사본을 받아 셈해 보니 곡식 자루 수가 창고와 맞지 않는다. 기수진은 끝까지 아무 말도 덧붙이지 않았다", source: seen }
    - id: let_go
      label: 못 본 척 넘어간다
      effects:
        - relation: { who: clerk, axis: affection, delta: 1 }

- id: a_of_night_sacks
  title: 밤의 손수레
  tags: [a_officer]
  when:
    zones: [a_base]
    segments: [night, dawn]
    flags_all: [a_of_gap_seen]
    flags_none: [a_of_saw_sacks]
  cast:
    ledger: { ids: [a_doyun] }
  setup: 잠이 오지 않아 운동장을 도는데, 보급 창고 뒷문 쪽에서 바퀴 구르는 소리가 난다. 손전등 없이, 누군가 손수레에 자루를 싣고 있다. 장부를 옆구리에 낀 실루엣이다.
  ai_direction: '{ledger}는 겨울 막바지에 굶주림이 오면 쓰려고 비상 식량을 지도부 몰래 옛 실습동 지하 보일러실로 옮기는 중이다. 사욕이 아니라 최선희가 배급을 줄이지 않으니 혼자 대비하는 것이다. 들켜도 도망치지 않고 숫자로 설명하려 한다. 지금은 혼자다.'
  choices:
    - id: follow
      label: 소리 없이 손수레를 따라간다
      check: stealth
      outcomes:
        success:
          - set_flag: a_of_saw_sacks
          - set_flag: a_of_knows_cellar
          - belief: { fact: "한도윤이 곡식 자루를 옛 실습동 지하 보일러실로 옮겼다. 그 안에는 자루가 이미 수십 개 쌓여 있었다", source: seen }
        partial:
          - set_flag: a_of_saw_sacks
          - belief: { fact: "한도윤이 자루를 실습동 쪽으로 옮기는 것까지 봤다. 그다음은 놓쳤다", source: seen }
        miss:
          - set_flag: a_of_saw_sacks
          - relation: { who: ledger, axis: trust, delta: -1 }
          - belief: { fact: "따라가다 들켰다. 한도윤은 손수레를 세우고 오래 나를 쳐다보다가 정례 정리라고만 했다", source: seen }
    - id: confront
      label: 그 자리에서 이름을 부른다
      effects:
        - set_flag: a_of_saw_sacks
        - relation: { who: ledger, axis: trust, delta: -1 }
        - relation: { who: ledger, axis: respect, delta: 1 }
        - belief: { fact: "한도윤은 놀라지 않았다. 겨울 끝을 위한 것이라고, 대표께 말할 거면 숫자를 다 들은 뒤에 하라고 했다", source: report }
    - id: back_to_bed
      label: 돌아서서 막사로 간다
      effects:
        - set_flag: a_of_saw_sacks

- id: a_of_doyun_reckoning
  title: 장부 두 권
  tags: [a_officer]
  when:
    own_territory: true
    segments: [morning, day, evening]
    flags_all: [a_of_saw_sacks]
    flags_none: [a_of_sacks_settled]
  cast:
    ledger: { ids: [a_doyun] }
  setup: '{ledger:이/가} 빈 교무실로 당신을 부른다. 장부 두 권을 나란히 펼쳐 둔다. 한 권은 회의에서 보던 것이고, 다른 한 권은 처음 보는 것이다. "보셨으니 숫자도 보셔야지요. 대표께서는 배급을 줄이지 않으십니다. 이대로면 정월에 솥이 빕니다."'
  ai_direction: 한도윤은 협박하지 않는다. 자기 셈이 맞다고 믿고, 참모가 같은 편이 되길 바란다. 숨긴 양은 겨울 막바지 몇 주를 버틸 만큼이다. 회의에 공개하면 무리는 그 식량을 다시 쓰게 되지만 한도윤은 회의 안에서 힘을 잃는다. 덮으면 둘 사이에 비밀이 생긴다.
  choices:
    - id: expose
      label: 최선희에게 두 장부를 그대로 가져간다
      effects:
        - set_flag: a_of_sacks_settled
        - set_flag: a_of_exposed_doyun
        - faction_resource: { faction: own, resource: food, delta: 40 }
        - relation: { who: ledger, axis: trust, delta: -3 }
        - relation: { who: commander, axis: trust, delta: 2 }
        - merit: 1
        - deed: { summary: 보급 간부가 몰래 숨긴 식량을 대표에게 알렸다, tags: [honesty, diligence], severity: 2, privacy: public }
        - belief: { fact: "숨긴 자루는 창고로 돌아갔다. 한도윤은 회의에서 아무 말도 하지 않았고, 최선희는 그를 내치지 않았다", source: seen }
    - id: keep_secret
      label: 덮어 주는 대신 회의에서 내 안을 밀어 달라고 한다
      effects:
        - set_flag: a_of_sacks_settled
        - set_flag: a_of_doyun_pact
        - relation: { who: ledger, axis: trust, delta: 2 }
        - relation: { who: ledger, axis: respect, delta: 1 }
        - deed: { summary: 보급 간부가 숨긴 식량을 알고도 덮어 주고 거래했다, tags: [deceit, selfishness], severity: 2, privacy: private }
        - belief: { fact: "한도윤과 손을 잡았다. 실습동 지하의 자루는 둘만 아는 일이다", source: seen }
    - id: share_out
      label: 절반은 지금 굶는 분대에 풀자고 설득한다
      check: persuade
      outcomes:
        success:
          - set_flag: a_of_sacks_settled
          - faction_resource: { faction: own, resource: food, delta: 20 }
          - faction_morale: { faction: own, delta: 1 }
          - relation: { who: ledger, axis: respect, delta: 2 }
          - deed: { summary: 숨겨 둔 식량 절반을 굶는 분대에 풀게 했다, tags: [mercy], severity: 1, privacy: semi_private }
          - belief: { fact: "한도윤이 절반을 풀기로 했다. 나머지 절반은 여전히 지하에 있고, 그건 이제 내 비밀이기도 하다", source: seen }
        partial:
          - set_flag: a_of_sacks_settled
          - faction_resource: { faction: own, resource: food, delta: 8 }
          - belief: { fact: "한도윤은 몇 자루만 내놓았다. 나머지는 손대지 말라고 못을 박았다", source: report }
        miss:
          - set_flag: a_of_sacks_settled
          - relation: { who: ledger, axis: trust, delta: -2 }
          - belief: { fact: "한도윤은 장부를 덮었다. 이 일은 없던 걸로 하자고 했다", source: report }

# ── 고정: 버들마을 ───────────────────────────────

- id: a_of_b_ammo_ask
  title: 초록 띠의 청
  tags: [a_officer]
  when:
    zones: [a_base]
    segments: [morning, day]
    day_gte: 2
    flags_none: [a_of_b_asked]
  cast:
    liaison: { ids: [b_seungmin] }
  setup: '{liaison:이/가} 교무실 문 앞에서 군용 수첩을 펼친다. "참모님. 약조 밖의 부탁인 줄 압니다. 탄 스무 상자, 아니 열 상자라도. 우리 정문에 붉은연합 사람이 드나듭니다. 경비병 손에 탄이 없으면 대표 말이 맞아집니다."'
  ai_direction: 표승민은 진심으로 연합을 지키려 한다. 장현우 대표가 흔들린다는 것은 직접 말하지 않고 돌려 말한다. 우리 탄도 넉넉하지 않다. 상자 수는 표승민의 말일 뿐이고, 실제로 오가는 양은 코드가 정한 대로다.
  choices:
    - id: give
      label: 우리 몫에서 덜어 탄을 보내자고 최선희에게 올린다
      effects:
        - set_flag: a_of_b_asked
        - set_flag: a_of_b_supplied
        - faction_resource: { faction: own, resource: ammo, delta: -20 }
        - faction_resource: { faction: faction_b, resource: ammo, delta: 20 }
        - faction_relation: { from: faction_b, to: faction_a, delta: 1 }
        - clock: { id: b_waver, delta: -3 }
        - relation: { who: liaison, axis: trust, delta: 2 }
        - deed: { summary: 모자란 탄을 덜어 흔들리는 버들마을에 보냈다, tags: [loyalty], severity: 1, privacy: semi_private }
    - id: bargain
      label: 탄을 주되 텃밭 수확을 더 내라고 흥정한다
      check: persuade
      outcomes:
        success:
          - set_flag: a_of_b_asked
          - set_flag: a_of_b_supplied
          - faction_resource: { faction: own, resource: ammo, delta: -10 }
          - faction_resource: { faction: faction_b, resource: ammo, delta: 10 }
          - faction_resource: { faction: own, resource: food, delta: 15 }
          - clock: { id: b_waver, delta: -1 }
          - relation: { who: liaison, axis: respect, delta: 1 }
          - belief: { fact: "표승민은 텃밭 몫을 더 내기로 했다. 수첩에 적으며 입술을 깨물었다", source: seen }
        partial:
          - set_flag: a_of_b_asked
          - faction_resource: { faction: own, resource: ammo, delta: -10 }
          - faction_resource: { faction: faction_b, resource: ammo, delta: 10 }
          - relation: { who: liaison, axis: affection, delta: -1 }
          - belief: { fact: "탄은 보냈지만 흥정 탓에 표승민이 빈손으로 돌아가는 사람처럼 굴었다", source: seen }
        miss:
          - set_flag: a_of_b_asked
          - faction_relation: { from: faction_b, to: faction_a, delta: -1 }
          - clock: { id: b_waver, delta: 2 }
          - relation: { who: liaison, axis: trust, delta: -1 }
          - belief: { fact: "흥정이 길어지자 표승민이 수첩을 덮었다. 버들마을에 그대로 전하겠다고 했다", source: report }
    - id: refuse
      label: 우리도 남는 탄이 없다고 정중히 거절한다
      effects:
        - set_flag: a_of_b_asked
        - clock: { id: b_waver, delta: 2 }
        - relation: { who: liaison, axis: trust, delta: -1 }
        - belief: { fact: "표승민은 알겠다고만 했다. 돌아서는 그의 어깨에서 초록 띠가 비뚤어져 있었다", source: seen }

- id: a_of_b_red_envoy
  title: 흰 천을 든 일행
  urgent: true
  tags: [a_officer]
  when:
    own_territory: true
    segments: [evening, night]
    day_gte: 3
    flags_all: [a_of_b_asked]
    flags_none: [a_of_envoy_settled]
    dispositions: [{ from: faction_b, to: faction_a, gte: 1 }]
  cast:
    runner: { ids: [a_hangyeol] }
  setup: '{runner:이/가} 숨을 몰아쉬며 교무실 문을 연다. "참모님, 구시가 쪽에서요! 붉은 완장 셋이 흰 천을 막대에 묶어 들고 버들마을 쪽으로 가요. 총은 등에 멨고요." 해가 다 졌다.'
  ai_direction: 붉은연합의 사자다. 버들마을 대표 장현우를 만나 연합을 깨면 건드리지 않겠다는 말을 되풀이하러 간다. 막으면 버들마을은 당분간 결정을 미루지만, 흰 천을 쏜 일은 소문이 된다. 그냥 두면 회유는 한 걸음 더 나아간다. 감염체가 나오는 시간이라 바깥으로 사람을 내는 것도 위험하다.
  choices:
    - id: intercept
      label: 강태호 분대를 보내 길목에서 돌려보내게 한다
      check: tactics
      outcomes:
        success:
          - set_flag: a_of_envoy_settled
          - clock: { id: b_waver, delta: -3 }
          - faction_relation: { from: faction_c, to: faction_a, delta: -1, mutual: false }
          - deed: { summary: 버들마을로 가는 붉은연합 사자를 길목에서 돌려보냈다, tags: [loyalty, bravery], severity: 2, privacy: semi_private }
          - belief: { fact: "강태호 분대가 구시가 길목에서 사자들을 돌려보냈다. 총은 한 발도 쏘지 않았다", source: report }
        partial:
          - set_flag: a_of_envoy_settled
          - clock: { id: b_waver, delta: -1 }
          - faction_resource: { faction: own, resource: ammo, delta: -5 }
          - belief: { fact: "길목에서 총성이 났다. 사자들은 돌아갔지만 물결이 일어 분대가 한참 숨어 있다가 돌아왔다", source: report }
        miss:
          - set_flag: a_of_envoy_settled
          - clock: { id: b_waver, delta: 1 }
          - faction_morale: { faction: own, delta: -1 }
          - belief: { fact: "분대는 길을 잘못 들어 사자들을 놓쳤다. 돌아오는 길에 감염체에 쫓겨 둘이 다쳤다는 보고다", source: report }
    - id: warn_liaison
      label: 표승민에게만 몰래 기별을 보낸다
      effects:
        - set_flag: a_of_envoy_settled
        - clock: { id: b_waver, delta: -1 }
        - relation: { who: runner, axis: trust, delta: 1 }
        - belief: { fact: "한결을 버들마을 표승민에게 보냈다. 저쪽 안에서 막을 수 있는 사람은 그 사람뿐이다", source: seen }
    - id: let_pass
      label: 버들마을이 스스로 답하게 둔다
      effects:
        - set_flag: a_of_envoy_settled
        - clock: { id: b_waver, delta: 2 }
        - belief: { fact: "사자들을 그냥 보냈다. 버들마을 대표가 무엇을 듣고 무엇을 답할지는 이제 저쪽 일이다", source: seen }

- id: a_of_b_left
  title: 초록 띠를 뗀 사람들
  tags: [a_officer, council]
  when:
    factions: [faction_a]
    own_territory: true
    segments: [morning, day, evening]
    flags_none: [a_of_b_left_seen]
    dispositions: [{ from: faction_b, to: faction_a, lte: 0 }]
  cast:
    liaison: { ids: [b_seungmin] }
    stray: { extra: refugee, label: 보따리를 진 버들마을 여자 }
  setup: '정문이 소란하다. 버들마을이 연합에서 발을 뺐다는 소식이 돈 다음 날이다. {liaison:이/가} 완장에서 초록 띠만 남기고 버들마을 표시를 뜯어낸 채 서 있고, 뒤로 {stray} 같은 사람 몇이 보따리를 지고 기다린다. "받아 주시겠습니까. 저는 붉은연합 밑에서는 못 삽니다."'
  ai_direction: 표승민과 몇 사람은 대표 장현우의 결정을 따르지 않고 넘어왔다. 이들을 받으면 입이 늘고, 버들마을과의 사이는 더 틀어지지만 무리 안의 원칙은 지킨다. 돌려보내면 그들은 갈 곳이 없다. 최선희는 받자고 할 것이다. 버리지 않는다는 원칙이 시험받는 장면이다.
  choices:
    - id: take_in
      label: 받아들이자고 한다
      effects:
        - set_flag: a_of_b_left_seen
        - npc_depart: { who: liaison, to_faction: faction_a }
        - faction_resource: { faction: own, resource: food, delta: -20 }
        - faction_relation: { from: faction_b, to: faction_a, delta: -1 }
        - relation: { who: commander, axis: affection, delta: 1 }
        - deed: { summary: 연합을 깨고 넘어온 버들마을 사람들을 받아들였다, tags: [mercy, loyalty], severity: 2, privacy: public }
        - belief: { fact: "표승민과 버들마을 사람 몇이 우리 거점에 들어왔다. 버들마을 정문은 이제 우리 전령을 들이지 않는다", source: seen }
    - id: liaison_only
      label: 표승민만 받고 나머지는 하얀매 쪽으로 길을 일러 준다
      effects:
        - set_flag: a_of_b_left_seen
        - npc_depart: { who: liaison, to_faction: faction_a }
        - npc_depart: { who: stray }
        - relation: { who: liaison, axis: affection, delta: -1 }
        - deed: { summary: 넘어온 버들마을 사람들 가운데 쓸모 있는 한 사람만 받았다, tags: [selfishness], severity: 1, privacy: public }
    - id: send_back
      label: 버들마을과 더 틀어질 수 없다며 돌려보낸다
      effects:
        - set_flag: a_of_b_left_seen
        - faction_relation: { from: faction_b, to: faction_a, delta: 1 }
        - relation: { who: liaison, axis: trust, delta: -3 }
        - relation: { who: commander, axis: respect, delta: -1 }
        - deed: { summary: 연합을 지키다 쫓겨난 버들마을 사람들을 정문에서 돌려보냈다, tags: [cruelty], severity: 2, privacy: public }

# ── 고정: 봉재석 ───────────────────────────────

- id: a_of_jaeseok_offer
  title: 목도리 속의 말
  tags: [a_officer]
  when:
    own_territory: true
    segments: [evening, night]
    day_gte: 3
    flags_none: [a_of_jaeseok_heard]
  cast:
    elder: { ids: [a_jaeseok] }
  setup: '{elder:이/가} 교무실 옆 작은 방으로 당신을 들인다. 난로에 손을 쬐며 낮게 말한다. "참모님, 셈을 할 줄 아는 사람끼리 하는 얘깁니다. 이 겨울, 우리가 이깁니까? 이기지 못한다면, 지는 방법이라도 골라야 하지 않겠습니까."'
  ai_direction: 봉재석은 장터에서 붉은연합 간부 마경수를 따로 만났고, 동쪽 초소를 내주면 거점을 건드리지 않겠다는 말을 들었다. 지금은 참모가 같은 생각인지 떠보는 중이다. 맞장구치면 조금 더 털어놓고, 정색하면 농담이었다며 물러선다. 붉은연합 지도부는 실은 화해할 생각이 없다. 그건 봉재석도 모른다.
  choices:
    - id: listen
      label: 끝까지 들어 보겠다고 한다
      check: deceive
      outcomes:
        success:
          - set_flag: a_of_jaeseok_heard
          - set_flag: a_of_jaeseok_plan
          - relation: { who: elder, axis: trust, delta: 2 }
          - belief: { fact: "봉재석이 털어놓았다. 장터에서 붉은연합 간부를 따로 만났고, 동쪽 초소를 내주면 거점은 건드리지 않겠다는 말을 들었다. 대표에게는 아직 말하지 않았다", source: report }
        partial:
          - set_flag: a_of_jaeseok_heard
          - set_flag: a_of_jaeseok_plan
          - belief: { fact: "봉재석은 붉은연합과 말이 통하는 길이 있다는 데까지만 말했다", source: report }
        miss:
          - set_flag: a_of_jaeseok_heard
          - relation: { who: elder, axis: trust, delta: -1 }
          - belief: { fact: "봉재석은 내 눈빛을 읽고 그냥 늙은이 넋두리라며 웃었다", source: seen }
    - id: rebuke
      label: 그런 말은 회의에서 하라고 잘라 말한다
      effects:
        - set_flag: a_of_jaeseok_heard
        - relation: { who: elder, axis: respect, delta: 1 }
        - relation: { who: elder, axis: trust, delta: -1 }
    - id: report_now
      label: 그 길로 최선희에게 간다
      effects:
        - set_flag: a_of_jaeseok_heard
        - set_flag: a_of_jaeseok_reported
        - relation: { who: elder, axis: trust, delta: -3 }
        - relation: { who: commander, axis: trust, delta: 1 }
        - deed: { summary: 동료 간부의 은밀한 말을 바로 대표에게 옮겼다, tags: [loyalty, betrayal], severity: 1, privacy: semi_private }

- id: a_of_jaeseok_gone
  title: 비어 있는 작은 방
  urgent: true
  tags: [a_officer]
  when:
    own_territory: true
    segments: [night, dawn]
    day_gte: 5
    flags_any: [a_of_jaeseok_plan, a_of_jaeseok_reported]
    flags_none: [a_of_jaeseok_settled]
  cast:
    elder: { ids: [a_jaeseok] }
  setup: 새벽, 교무실 옆 작은 방에 불이 켜져 있다. {elder:이/가} 목도리를 두르고 배낭을 꾸린다. 문 옆에는 취사 천막 사람 둘이 보따리를 들고 서 있다. 당신을 보고도 손을 멈추지 않는다.
  ai_direction: 봉재석은 장터를 거쳐 붉은연합으로 넘어가려 한다. 따르는 두 사람은 배고파서 따라나선 이들이다. 지금 붙잡으면 소란이 나고, 보내면 그가 아는 회의 내용이 붉은연합으로 간다. 그는 참모를 해치지 않는다. 말로 붙잡을 수 있는 마지막 순간이다.
  choices:
    - id: persuade_stay
      label: 이 겨울을 같이 넘기자고 붙잡는다
      check: persuade
      outcomes:
        success:
          - set_flag: a_of_jaeseok_settled
          - relation: { who: elder, axis: trust, delta: 2 }
          - relation: { who: elder, axis: affection, delta: 1 }
          - belief: { fact: "봉재석이 배낭을 내려놓았다. 대신 마경수와 나눈 말을 회의에 직접 털어놓겠다고 했다", source: seen }
        partial:
          - set_flag: a_of_jaeseok_settled
          - npc_depart: { who: elder }
          - belief: { fact: "봉재석은 붉은연합으로는 가지 않겠다고 했다. 대신 도시를 떠났다. 강 하류 어딘가로 간다고 했다", source: seen }
        miss:
          - set_flag: a_of_jaeseok_settled
          - npc_depart: { who: elder, to_faction: faction_c }
          - clock: { id: c_east_offensive, delta: 2 }
          - faction_morale: { faction: own, delta: -1 }
          - belief: { fact: "봉재석은 붉은연합 쪽으로 넘어갔다. 그가 앉던 회의 자리가 비었고, 그가 들은 것은 이제 저쪽에 있다", source: seen }
    - id: raise_alarm
      label: 보초를 불러 붙잡게 한다
      effects:
        - set_flag: a_of_jaeseok_settled
        - relation: { who: elder, axis: trust, delta: -3 }
        - relation: { who: commander, axis: trust, delta: 1 }
        - merit: 1
        - deed: { summary: 넘어가려던 간부를 보초를 불러 붙잡았다, tags: [diligence, loyalty], severity: 2, privacy: public }
        - belief: { fact: "봉재석은 교무실 옆 방에 갇혔다. 따라나섰던 두 사람은 울면서 배고파서 그랬다고 했다", source: seen }
    - id: let_go
      label: 아무 말 없이 길을 비켜 준다
      effects:
        - set_flag: a_of_jaeseok_settled
        - npc_depart: { who: elder, to_faction: faction_c }
        - clock: { id: c_east_offensive, delta: 1 }
        - deed: { summary: 붉은연합으로 넘어가는 간부를 보고도 막지 않았다, tags: [betrayal, enemy_sympathy], severity: 2, privacy: private }

# ── 고정: 전선과 사람 ───────────────────────────────

- id: a_of_east_warning
  title: 초소에서 온 쪽지
  urgent: true
  tags: [a_officer]
  when:
    own_territory: true
    clock_gte: { c_east_offensive: 6 }
    flags_none: [a_of_east_decided]
  cast:
    runner: { ids: [a_hangyeol] }
    hawk: { ids: [a_jeonghun], enter: false }
  setup: '{runner:이/가} 젖은 쪽지를 내민다. 동쪽 초소 분대장의 글씨다. "고가도로 아래 불빛 여럿. 밤마다 늘어남. 탄 부족. 사람 부족." 쪽지 뒷면에 누군가 연필로 덧썼다. "며칠 안 남음."'
  ai_direction: 붉은연합의 동쪽 공세가 가깝다. 정확한 날짜는 아무도 모른다. 초소를 채우면 반격 준비는 늦어지고, 반격 쪽에 두면 초소가 버틸지 모른다. 육정훈은 초소를 버리고 그 탄으로 물류창고를 치자고 할 것이다. 숫자는 지어내지 않는다.
  choices:
    - id: reinforce
      label: 반격 몫의 탄과 사람을 초소로 돌린다
      effects:
        - set_flag: a_of_east_decided
        - faction_resource: { faction: own, resource: ammo, delta: -15 }
        - clock: { id: c_east_offensive, delta: -2 }
        - clock: { id: a_counteroffensive, delta: -2 }
        - relation: { who: hawk, axis: trust, delta: -1 }
        - belief: { fact: "반격 몫을 동쪽 초소로 돌렸다. 육정훈은 반격이 또 미뤄졌다며 탁자를 쳤다", source: seen }
    - id: hold
      label: 초소는 지금 있는 것으로 버티게 하고 반격을 서두른다
      effects:
        - set_flag: a_of_east_decided
        - clock: { id: a_counteroffensive, delta: 2 }
        - relation: { who: hawk, axis: trust, delta: 1 }
        - deed: { summary: 위급한 동쪽 초소에 증원을 보내지 않고 반격을 서둘렀다, tags: [diligence], severity: 1, privacy: semi_private }
        - belief: { fact: "초소에는 지금 있는 것으로 버티라는 답을 보냈다. 쪽지를 전하러 가는 한결의 얼굴이 굳어 있었다", source: seen }
    - id: plan_withdraw
      label: 초소가 밀리면 어디까지 물러설지 퇴각로를 짜 둔다
      check: tactics
      outcomes:
        success:
          - set_flag: a_of_east_decided
          - clock: { id: c_east_offensive, delta: -1 }
          - relation: { who: commander, axis: trust, delta: 1 }
          - belief: { fact: "퇴각 신호와 길을 정해 초소에 보냈다. 밀려도 사람은 돌아올 수 있다", source: seen }
        partial:
          - set_flag: a_of_east_decided
          - belief: { fact: "퇴각로를 짜 보냈지만 길 하나가 무너진 육교를 지난다. 밤이면 쓸 수 없다", source: seen }
        miss:
          - set_flag: a_of_east_decided
          - faction_morale: { faction: own, delta: -1 }
          - belief: { fact: "퇴각로 이야기가 초소에 퍼지자 다들 버려지는 줄 알았다. 초소의 분위기가 무너졌다는 보고다", source: report }

- id: a_of_send_squad
  title: 지도 위의 핀
  tags: [a_officer]
  when:
    zones: [a_base]
    segments: [morning, day]
    day_gte: 3
    flags_none: [a_of_squad_sent]
  cast:
    leader: { ids: [a_taeho] }
  setup: '칠판의 지도에 물류창고까지 가는 길이 세 갈래로 그려져 있다. 어느 길로 정찰을 보낼지는 오늘 당신이 정한다. 교무실 밖 복도에서 {leader:이/가} 분대원들을 세워 두고 기다린다. 귀가 반쯤 없는 쪽 얼굴이 이쪽을 향해 있다.'
  ai_direction: 강태호는 명령이면 어디든 간다. 고가도로 길은 빠르지만 붉은연합 눈에 띄고, 하수로 길은 감염체가 고여 있고, 강변으로 도는 길은 하루가 더 걸린다. 결과는 판정으로만 정한다. 누가 다치거나 죽는 것은 서술로 만들지 않는다.
  choices:
    - id: fast_route
      label: 고가도로 길로 보낸다
      check: tactics
      outcomes:
        success:
          - set_flag: a_of_squad_sent
          - clock: { id: a_counteroffensive, delta: 2 }
          - relation: { who: leader, axis: respect, delta: 1 }
          - merit: 1
          - belief: { fact: "강태호 분대가 물류창고 경비 교대 시간을 알아 왔다. 들키지 않았다", source: report }
        partial:
          - set_flag: a_of_squad_sent
          - clock: { id: a_counteroffensive, delta: 1 }
          - clock: { id: c_east_offensive, delta: 1 }
          - belief: { fact: "강태호 분대는 돌아왔지만 고가도로에서 들켰다. 붉은연합도 우리가 엿본다는 걸 알았다", source: report }
        miss:
          - set_flag: a_of_squad_sent
          - faction_morale: { faction: own, delta: -1 }
          - relation: { who: leader, axis: trust, delta: -1 }
          - belief: { fact: "강태호 분대는 총격을 받고 빈손으로 물러났다. 강태호는 보고 내내 내 눈을 보지 않았다", source: report }
    - id: slow_route
      label: 하루 더 걸려도 강변으로 돌게 한다
      effects:
        - set_flag: a_of_squad_sent
        - clock: { id: a_counteroffensive, delta: 1 }
        - faction_resource: { faction: own, resource: food, delta: -5 }
        - relation: { who: leader, axis: trust, delta: 1 }
        - belief: { fact: "강태호 분대가 강변을 돌아 하루 늦게 돌아왔다. 모두 무사하다. 알아 온 것은 많지 않다", source: report }
    - id: go_along
      label: 지도만 보지 않고 직접 따라나서겠다고 한다
      effects:
        - set_flag: a_of_squad_sent
        - relation: { who: leader, axis: respect, delta: 2 }
        - relation: { who: commander, axis: trust, delta: -1 }
        - deed: { summary: 정찰을 보내는 대신 분대와 함께 직접 나서겠다고 했다, tags: [bravery], severity: 1, privacy: public }
        - belief: { fact: "최선희가 참모는 교무실에 있으라고 했다. 강태호가 처음으로 나를 똑바로 봤다", source: seen }

- id: a_of_hangyeol_sister
  title: 막사 구석의 기침
  tags: [a_officer]
  when:
    own_territory: true
    segments: [evening, night]
    day_gte: 2
    flags_none: [a_of_sister_decided]
  cast:
    runner: { ids: [a_hangyeol] }
  setup: '막사 구석에서 마른기침 소리가 그치지 않는다. {runner:이/가} 담요 두 장을 겹쳐 덮은 여자아이를 끌어안고 있다가 당신을 보고 벌떡 일어선다. "참모님. 하얀매 진료소에 가면 기침약이 있대요. 저 거기 일 다니면 안 돼요? 심부름이든 뭐든 할게요."'
  ai_direction: 여동생의 기침은 오래갈 병일지도 모른다. 의무실 약은 다친 대원 몫이다. 하얀매는 사람을 일꾼으로 받고 약을 내주기도 한다. 한결을 보내면 지도부의 가장 빠른 전령을 잃지만 하얀매와 끈이 생긴다. 한결은 무엇이든 한다고 하지만 떠나기 싫어한다.
  choices:
    - id: send_to_clinic
      label: 둘을 하얀매로 보내고 약값 대신 일하게 하자고 약조한다
      effects:
        - set_flag: a_of_sister_decided
        - npc_depart: { who: runner, to_faction: faction_d }
        - faction_relation: { from: faction_d, to: faction_a, delta: 1 }
        - faction_resource: { faction: own, resource: medicine, delta: 3 }
        - deed: { summary: 아픈 동생을 둔 전령을 하얀매에 일꾼으로 보내고 약을 받았다, tags: [mercy], severity: 1, privacy: semi_private }
        - belief: { fact: "한결은 동생을 업고 하얀매로 떠났다. 내일부터 전령이 없다", source: seen }
    - id: share_medicine
      label: 의무실 약을 조금 덜어 주라고 윤채원에게 말한다
      effects:
        - set_flag: a_of_sister_decided
        - faction_resource: { faction: own, resource: medicine, delta: -2 }
        - relation: { who: runner, axis: trust, delta: 2 }
        - relation: { who: runner, axis: affection, delta: 2 }
        - deed: { summary: 다친 대원 몫의 약을 전령의 아픈 동생에게 돌렸다, tags: [mercy], severity: 1, privacy: semi_private }
    - id: coat
      label: 내 외투를 벗어 아이에게 덮어 준다
      effects:
        - set_flag: a_of_sister_decided
        - take_item: { item: coat, quantity: 1 }
        - relation: { who: runner, axis: affection, delta: 2 }
        - belief: { fact: "아이에게 외투를 덮어 주었다. 오늘 밤은 내가 춥다", source: seen }
    - id: decline
      label: 지금은 누구에게도 특별히 해 줄 수 없다고 말한다
      effects:
        - set_flag: a_of_sister_decided
        - relation: { who: runner, axis: affection, delta: -1 }

# ── 템플릿: 간부의 일 ───────────────────────────

- id: a_of_ration_allocation
  title: 분대별 몫
  tags: [council]
  repeatable: true
  cooldown_days: 3
  when:
    factions: [faction_a]
    own_territory: true
    segments: [morning, day]
  cast:
    boss: { commander: true }
    asker: { faction: own, ranks: [squad_leader], known: true }
  setup: '교무실. {boss:이/가} 배급 대장을 당신 앞으로 민다. {scarce:이/가} 가장 모자라다. 문밖에서 {asker:이/가} 기다린다. "참모님, 우리 분대는 밤 보초가 둘입니다. 같은 몫으로는 못 버팁니다." 어느 분대에 얼마를 돌릴지 안을 올려야 한다.'
  ai_direction: 어떻게 나누든 누군가는 덜 먹는다. 최선희는 배급을 줄이는 안은 싫어하지만 숫자가 맞으면 따른다. 분대장은 자기 분대만 본다. 양은 코드가 정했다.
  choices:
    - id: front_first
      label: 바깥에 나가는 분대에 더 돌린다
      effects:
        - faction_resource: { faction: own, resource: food, delta: -8 }
        - relation: { who: asker, axis: trust, delta: 1 }
        - belief: { fact: "바깥 분대 몫을 늘렸다. 거점 안 사람들 몫이 그만큼 줄었다. 식당 천막에서 수군거림이 들린다", source: seen }
    - id: equal
      label: 계급과 일을 가리지 않고 똑같이 나눈다
      effects:
        - relation: { who: boss, axis: respect, delta: 1 }
        - relation: { who: asker, axis: affection, delta: -1 }
        - deed: { summary: 모자란 배급을 분대 가리지 않고 똑같이 나누자고 했다, tags: [diligence], severity: 1, privacy: public }
    - id: cut_mine
      label: 간부 몫을 깎아 분대에 돌리자고 한다
      check: persuade
      outcomes:
        success:
          - faction_morale: { faction: own, delta: 1 }
          - relation: { who: asker, axis: respect, delta: 1 }
          - body: { track: hunger, delta: 1 }
          - deed: { summary: 간부 몫을 깎아 분대에 돌렸다, tags: [mercy], severity: 1, privacy: public }
        partial:
          - body: { track: hunger, delta: 1 }
          - belief: { fact: "내 몫은 깎였지만 다른 간부들은 따르지 않았다", source: seen }
        miss:
          - belief: { fact: "간부 몫을 깎자는 말에 한도윤이 그러면 회의를 누가 하냐고 되물었다. 안은 묻혔다", source: seen }

- id: a_of_trader_visit
  title: 장터에서 온 짐꾼
  tags: [council]
  repeatable: true
  cooldown_days: 4
  when:
    factions: [faction_a]
    own_territory: true
    segments: [day, evening]
    day_gte: 2
  cast:
    porter: { extra: e_porter, label: 동전패를 목에 건 짐꾼 }
  setup: '정문 앞에 나루상단 짐꾼이 배낭을 내린다. {porter:이/가} 웃으며 말한다. "탁 형님 말씀이, 이번엔 연료를 받고 탄을 내준답니다. 붉은 쪽에서도 같은 걸 묻긴 했는데요. 먼저 오신 분 몫이지요."'
  ai_direction: 나루상단은 양쪽에 판다. 짐꾼은 값을 부풀리고, 붉은연합 이야기는 흥정 수단이다. 사고 나면 나루상단은 우리 쪽을 조금 더 좋게 본다. 거래량은 코드가 정했다.
  choices:
    - id: trade_fuel
      label: 연료를 내주고 탄을 받는다
      effects:
        - faction_resource: { faction: own, resource: fuel, delta: -15 }
        - faction_resource: { faction: own, resource: ammo, delta: 10 }
        - faction_relation: { from: faction_e, to: faction_a, delta: 1, mutual: false }
        - clock: { id: e_side, delta: -1 }
        - belief: { fact: "연료를 주고 탄을 받았다. 이 겨울 밤 난로 몇 번을 탄 몇 상자로 바꾼 셈이다", source: seen }
    - id: haggle
      label: 붉은 쪽 얘기는 허세라며 값을 깎는다
      check: persuade
      outcomes:
        success:
          - faction_resource: { faction: own, resource: fuel, delta: -8 }
          - faction_resource: { faction: own, resource: ammo, delta: 10 }
          - relation: { who: porter, axis: respect, delta: 1 }
        partial:
          - faction_resource: { faction: own, resource: fuel, delta: -12 }
          - faction_resource: { faction: own, resource: ammo, delta: 8 }
        miss:
          - faction_relation: { from: faction_e, to: faction_a, delta: -1, mutual: false }
          - belief: { fact: "짐꾼은 배낭을 다시 메고 그럼 붉은 쪽으로 가겠다며 웃었다", source: seen }
    - id: ask_news
      label: 거래는 미루고 담배 한 개비로 장터 소식을 산다
      effects:
        - take_item: { item: cigarettes, quantity: 1 }
        - belief: { fact: "짐꾼 말로는 붉은연합이 장터에서 탄약을 넉넉히 사들이고, 버들마을 사람이 요즘 장터에 자주 보인다고 한다", source: rumor }
