# 버들마을 정찰대 분대장 스토리렛 (초안). 형식은 a_grunt.yaml 머리말 참고
# 이어지는 이야기 (플래그):
#   첫 집합: b_sl_first_muster
#   차영만: b_sl_yeongman_notebook (구시가에서 전 분대장의 수첩을 찾는다) → b_sl_two_orders (표승민과 대표의 명령이 갈린다)
#   양태준: b_sl_taejun_ditch → b_sl_myeongsuk_stairs (동생의 목도리와 어머니)
#   도해솔: b_sl_haesol_pack → b_sl_haesol_envoy (붉은 완장과 쪽문의 사자)
#   우경태: b_sl_gyeongtae_freeze → b_sl_gyeongtae_confess (동쪽 초소의 밤)
#   구본식: b_sl_bonsik_cellar (철물점 지하)
# tags: b_squad_leader = 둘째 분대에 묶인 이야기

# ── 첫 집합 ───────────────────────────────

- id: b_sl_first_muster
  title: 경비실 앞의 넷
  tags: [b_squad_leader]
  when:
    zones: [b_base]
    segments: [dawn, morning, day]
    flags_none: [b_sl_mustered]
  cast:
    green: { ids: [b_gyeongtae] }
    old: { ids: [b_bonsik] }
  setup: '정문 안쪽 경비실 앞. {green:이/가} 발뒤꿈치를 붙이고 선다. "분대장님, 청솔에서는 첫날 수신호부터 맞춥니다." 그 옆에서 {old:이/가} 접힌 지도를 내민다. 차영만의 글씨가 빼곡하다. "대장, 이거 받아. 차 대장 거야. 북쪽 골목에 동그라미 친 거 봐."'
  ai_direction: 분대원들은 새 분대장이 어느 쪽을 먼저 보는지 잰다. 우경태는 청솔형제단 방식과 연합을, 구본식은 단지 식구의 땔감과 먹을 것을 먼저 본다. 양태준은 말이 없고 도해솔은 정문 밖만 본다. 지도의 북쪽 골목 동그라미는 차영만이 마지막으로 들어간 곳이다.
  choices:
    - id: alliance
      label: 청솔형제단 방식대로 수신호부터 맞춘다
      effects:
        - set_flag: b_sl_mustered
        - relation: { who: green, axis: respect, delta: 2 }
        - relation: { who: old, axis: affection, delta: -1 }
        - relation: { who: commander, axis: respect, delta: 1 }
        - belief: { fact: 첫날 청솔형제단 수신호부터 맞췄다. 우경태가 처음으로 웃었고 구본식은 하품을 했다, source: seen }
    - id: village
      label: 겨울 땔감과 먹을 것부터 챙기자고 한다
      effects:
        - set_flag: b_sl_mustered
        - relation: { who: old, axis: trust, delta: 1 }
        - relation: { who: green, axis: affection, delta: -1 }
        - belief: { fact: 첫날 단지 식구의 겨울부터 챙기겠다고 했다. 우경태는 "연합 일은요" 하고 물었다, source: seen }
    - id: trace
      label: 차영만의 마지막 길부터 다시 걸어 보겠다고 한다
      effects:
        - set_flag: b_sl_mustered
        - set_flag: b_sl_trace_yeongman
        - relation: { who: old, axis: respect, delta: 1 }
        - belief: { fact: 차영만의 마지막 길을 다시 걷겠다고 했다. 도해솔이 처음으로 이쪽을 돌아봤다, source: seen }

# ── 차영만의 수첩, 두 갈래 명령 ───────────────────────────────

- id: b_sl_yeongman_notebook
  title: 계단 밑의 배낭
  tags: [b_squad_leader]
  weight: 2
  when:
    zones: [old_town]
    segments: [morning, day, evening]
    day_gte: 2
    flags_none: [b_sl_notebook_done]
  cast:
    old: { ids: [b_bonsik] }
  setup: "구시가 북쪽 골목, 셔터가 반쯤 내려간 상가 계단 밑. {old:이/가} 손전등을 비추다 멈춘다. 버들마을 정찰대 배낭이다. 어깨끈에 차영만의 이름이 매직으로 적혀 있다. 사람은 없다. 배낭 안에 물에 불은 수첩이 들어 있다."
  ai_direction: 차영만은 쪽문 밖 발자국을 쫓다가 돌아오지 못했다. 수첩 마지막 장들에는 그가 본 것까지만 있다. 쪽문 밖 발자국이 구시가에서 단지 쪽문으로 이어졌다는 것, 자정 무렵 관리사무소 쪽에 불이 켜졌다는 것. 누가 쪽문을 열었는지는 적혀 있지 않다. 차영만이 어떻게 됐는지는 이 장면에서 밝히지 않는다. 수첩을 누구에게 넘기느냐로 단지 안의 줄이 갈린다.
  choices:
    - id: to_seungmin
      label: 연락 간부 표승민에게 넘긴다
      effects:
        - set_flag: b_sl_notebook_done
        - set_flag: b_sl_notebook_seungmin
        - relation: { who: commander, axis: trust, delta: 2 }
        - clock: { id: b_waver, delta: -1 }
        - belief: { fact: "차영만의 수첩을 표승민에게 넘겼다. 수첩에는 쪽문 밖 발자국이 단지 안으로 이어졌고 자정에 관리사무소에 불이 켜졌다고 적혀 있었다. 표승민은 아무 말 없이 수첩을 가슴 주머니에 넣었다", source: seen }
        - deed: { summary: 전 분대장의 수첩을 연락 간부에게 넘겼다, tags: [loyalty, diligence], severity: 1, privacy: semi_private }
    - id: to_hyunwoo
      label: 대표에게 직접 가져간다
      effects:
        - set_flag: b_sl_notebook_done
        - set_flag: b_sl_notebook_hyunwoo
        - relation: { who: commander, axis: trust, delta: -1 }
        - belief: { fact: "차영만의 수첩을 대표 장현우에게 가져갔다. 대표는 마지막 장들을 오래 들여다보더니, 수고했다며 수첩을 서랍에 넣고 잠갔다", source: seen }
    - id: keep
      label: 아무에게도 말하지 않고 품에 넣는다
      effects:
        - set_flag: b_sl_notebook_done
        - set_flag: b_sl_notebook_kept
        - relation: { who: old, axis: trust, delta: 1 }
        - belief: { fact: "차영만의 수첩을 몰래 가지고 있다. 마지막 장에는 쪽문 밖 발자국이 단지 안으로 이어졌고 자정에 관리사무소에 불이 켜졌다고 적혀 있다. 누가 쪽문을 열었는지는 없다", source: seen }

- id: b_sl_two_orders
  title: 두 갈래 명령
  tags: [b_squad_leader]
  when:
    zones: [b_base]
    segments: [evening]
    day_gte: 3
    flags_none: [b_sl_two_orders_done]
  cast:
    boss: { commander: true }
    keeper: { ids: [b_dongcheol] }
  setup: '해 질 녘 정문. {boss:은/는} 오늘 밤 청솔형제단 정찰조와 합동 정찰을 나가기로 약조해 두었다며 군용 수첩을 펼친다. 그때 {keeper:이/가} 열쇠 꾸러미를 짤랑이며 다가와 낮게 말한다. "대표님 말씀이다. 오늘 밤 정찰대는 단지 안에 있으래. 이유는 묻지 말고."'
  ai_direction: 대표 장현우는 오늘 밤 쪽문으로 손님을 들일 생각이다. 정찰대가 밖에 있으면 볼 수 있다. 배동철은 이유를 모른 척하지만 짐작은 한다. 표승민은 연합의 약조를 앞세운다. 어느 쪽을 따르든 다른 쪽이 기억한다. 둘 다 플레이어 앞에서 서로를 탓하지는 않는다.
  choices:
    - id: seungmin
      label: 약조대로 청솔형제단과 정찰을 나간다
      effects:
        - set_flag: b_sl_two_orders_done
        - relation: { who: boss, axis: respect, delta: 2 }
        - relation: { who: keeper, axis: trust, delta: -1 }
        - clock: { id: b_waver, delta: -1 }
        - belief: { fact: "대표의 말을 듣지 않고 표승민의 약조대로 밤 정찰을 나갔다. 돌아와 보니 쪽문 자물쇠에 새 진흙이 묻어 있었다", source: seen }
        - deed: { summary: 대표의 말 대신 연합의 약조를 따라 밤 정찰을 나갔다, tags: [loyalty, disobedience], severity: 1, privacy: semi_private }
    - id: hyunwoo
      label: 대표의 말대로 분대를 단지 안에 둔다
      effects:
        - set_flag: b_sl_two_orders_done
        - relation: { who: keeper, axis: trust, delta: 1 }
        - relation: { who: boss, axis: trust, delta: -2 }
        - clock: { id: b_waver, delta: 1 }
        - belief: { fact: "대표의 말대로 정찰대를 단지 안에 두었다. 표승민은 청솔형제단에 사람이 아파서 못 나간다고 전했다. 그의 수첩에 무언가 적히는 것을 봤다", source: seen }
    - id: ask_why
      label: 배동철에게 대표가 왜 그러는지 캐묻는다
      check: persuade
      outcomes:
        success:
          - set_flag: b_sl_two_orders_done
          - set_flag: b_sl_knows_guest
          - relation: { who: keeper, axis: trust, delta: 1 }
          - belief: { fact: "배동철이 털어놓았다. 오늘 밤 대표가 쪽문으로 손님을 들인다. 정찰대가 밖에서 보면 안 되는 손님이다. 누가 오는지는 배동철도 모른다고 했다", source: report }
        partial:
          - relation: { who: keeper, axis: affection, delta: -1 }
          - belief: { fact: "배동철은 \"단지 일이다\"라고만 했다. 그가 쪽문 쪽을 자꾸 돌아봤다", source: seen }
        miss:
          - set_flag: b_sl_two_orders_done
          - relation: { who: keeper, axis: trust, delta: -1 }
          - relation: { who: boss, axis: trust, delta: -1 }
          - belief: { fact: "캐묻다가 배동철은 입을 닫았고, 표승민은 그 사이 혼자 청솔형제단 정찰조에게 갔다. 둘 다 눈길이 차가워졌다", source: seen }

# ── 양태준: 목도리 ───────────────────────────────

- id: b_sl_taejun_ditch
  title: 수로 옆에 멈춘 사람
  tags: [b_squad_leader]
  when:
    zones: [e_market, south_fields, old_town]
    segments: [morning, day, evening]
    day_gte: 2
    flags_none: [b_sl_ditch_done]
  cast:
    son: { ids: [b_taejun] }
  setup: "마른 수로 옆에 {son:이/가} 멈춰 서 있다. 수로 바닥의 시멘트 틈을 내려다보며 배낭 끈을 두 손으로 쥔다. 다가가는 발소리에도 그는 돌아보지 않는다."
  ai_direction: 지난봄 양태준의 동생 수진이가 이 길에서 사라졌다. 양태준은 수로 옆에서 수진이의 피 묻은 목도리를 주워 배낭 바닥에 넣어 다닌다 (비밀). 재촉하면 아무 일 없다는 듯 다시 걷는다. 기다려 주면 배낭에 손이 가는 것이 보인다. 목도리를 직접 꺼내 보이지는 않는다.
  choices:
    - id: wait
      label: 아무 말 없이 곁에서 기다린다
      check: sense_danger
      outcomes:
        success:
          - set_flag: b_sl_ditch_done
          - set_flag: b_sl_scarf_known
          - relation: { who: son, axis: trust, delta: 2 }
          - belief: { fact: "양태준이 수로 옆에서 배낭 바닥을 더듬었다. 빨간 털실 끝이 비어져 나왔다가 들어갔다. 실 한쪽이 검게 굳어 있었다", source: seen }
        partial:
          - set_flag: b_sl_ditch_done
          - relation: { who: son, axis: trust, delta: 1 }
          - belief: { fact: "양태준은 한참 수로를 보다가 다시 걸었다. 배낭 끈을 쥔 손이 하얬다", source: seen }
        miss:
          - set_flag: b_sl_ditch_done
          - belief: { fact: "기다리는 사이 수로 아래쪽에서 무언가 움직였다. 양태준이 먼저 손짓해 분대를 물렸다", source: seen }
    - id: push
      label: 여기서 서 있으면 다 죽는다고 재촉한다
      effects:
        - set_flag: b_sl_ditch_done
        - relation: { who: son, axis: affection, delta: -1 }
        - belief: { fact: 수로 옆에 멈춘 양태준을 재촉했다. 그는 대답 없이 다시 앞장섰다, source: seen }
    - id: ask
      label: 여기서 무슨 일이 있었냐고 묻는다
      check: persuade
      outcomes:
        success:
          - set_flag: b_sl_ditch_done
          - set_flag: b_sl_scarf_known
          - relation: { who: son, axis: trust, delta: 1 }
          - belief: { fact: "양태준이 말했다. 지난봄 수진이가 사라진 뒤 여기서 그 애 목도리를 주웠다고. 어머니한테는 말하지 않았다고. 그 뒤로 입을 닫았다", source: report }
        partial:
          - set_flag: b_sl_ditch_done
          - belief: { fact: "양태준은 \"동생이 이 길로 갔습니다\"라고만 했다", source: report }
        miss:
          - set_flag: b_sl_ditch_done
          - relation: { who: son, axis: trust, delta: -1 }

- id: b_sl_myeongsuk_stairs
  title: 103동 계단
  tags: [b_squad_leader]
  when:
    zones: [b_base]
    segments: [evening, night]
    flags_all: [b_sl_scarf_known]
    flags_none: [b_sl_stairs_done]
  cast:
    mother: { ids: [b_myeongsuk] }
    son: { ids: [b_taejun], enter: false }
  setup: '103동 계단참. {mother:이/가} 털모자를 벗어 쥐고 기다리고 있다. "분대장님, 우리 태준이 데리고 고가도로 쪽에 나갈 일 있어요? 있으면... 그쪽 길에 젊은 여자애 하나, 한 번만 봐 줘요. 키가 이만하고 웃으면 왼쪽 볼이 들어가요."'
  ai_direction: 양명숙은 딸 수진이가 붉은연합 쪽에 살아 있다고 믿는다. 그 이유(쪽지)는 말하지 않는다. 플레이어는 양태준이 수진이의 피 묻은 목도리를 지니고 다닌다는 것을 안다. 목도리만으로는 수진이가 죽었는지 알 수 없다. 어머니에게 말할지, 아들에게 맡길지, 희망을 들어줄지 정한다. 무엇을 하든 양태준은 곧 알게 된다.
  choices:
    - id: tell
      label: 태준이가 수로 옆에서 목도리를 주웠다고 말해 준다
      effects:
        - set_flag: b_sl_stairs_done
        - set_flag: b_sl_mother_told
        - relation: { who: mother, axis: trust, delta: 1 }
        - relation: { who: son, axis: trust, delta: -3 }
        - npc_relation: { from: mother, to: son, axis: trust, delta: -2 }
        - belief: { fact: "양명숙에게 목도리 이야기를 했다. 그녀는 한참 계단에 앉아 있다가, 그래도 피 묻은 목도리 하나로 죽은 걸 어떻게 아냐며 일어섰다", source: seen }
        - deed: { summary: 분대원이 숨긴 동생의 유품을 그 어머니에게 알렸다, tags: [honesty, betrayal], severity: 1, privacy: semi_private }
    - id: to_son
      label: 그건 태준이에게 직접 들으시라고만 한다
      effects:
        - set_flag: b_sl_stairs_done
        - relation: { who: son, axis: trust, delta: 1 }
        - relation: { who: mother, axis: affection, delta: -1 }
        - belief: { fact: "양명숙에게 아들에게 직접 물어보라고만 했다. 그날 밤 103동에서 오래 말소리가 났다", source: seen }
    - id: promise
      label: 고가도로 쪽에 나가면 한 번 살펴보겠다고 약속한다
      effects:
        - set_flag: b_sl_stairs_done
        - set_flag: b_sl_promised_sujin
        - relation: { who: mother, axis: trust, delta: 2 }
        - belief: { fact: "양명숙에게 고가도로 쪽에 나가면 수진이를 찾아보겠다고 약속했다. 그녀가 처음으로 \"고마워요\"라고 했다", source: seen }
        - deed: { summary: 동대표에게 붉은연합 쪽 길에서 잃은 딸을 찾아보겠다고 약속했다, tags: [mercy], severity: 1, privacy: private }

# ── 도해솔: 붉은 완장 ───────────────────────────────

- id: b_sl_haesol_pack
  title: 배낭 바닥의 붉은 천
  tags: [b_squad_leader]
  when:
    segments: [morning, day, evening]
    day_gte: 2
    flags_none: [b_sl_haesol_seen]
  cast:
    quiet: { ids: [b_haesol] }
  setup: "철망 담을 넘던 {quiet}의 배낭이 걸려 쏟아진다. 마른 빵, 칼, 양말. 그리고 꼬깃꼬깃 접힌 붉은 천 한 조각. {quiet:은/는} 누구보다 빠르게 그것을 움켜쥐고 배낭에 쑤셔 넣는다. 그리고 당신을 본다."
  ai_direction: 도해솔은 붉은연합 약탈조에서 달아난 징집병이다 (비밀). 붉은 천은 그때의 완장이다. 강 건너 마을 이야기는 지어낸 것이다. 지금은 겁에 질려 농담으로 넘기려 한다. 우경태가 이 일을 알면 표승민에게 바로 간다.
  choices:
    - id: ignore
      label: 못 본 척하고 배낭을 주워 준다
      effects:
        - set_flag: b_sl_haesol_seen
        - relation: { who: quiet, axis: trust, delta: 1 }
        - belief: { fact: "도해솔이 배낭 바닥에 붉은 천 조각을 숨겨 다닌다. 붉은연합 완장처럼 보였다", source: seen }
    - id: ask
      label: 그게 무엇이냐고 조용히 묻는다
      check: persuade
      outcomes:
        success:
          - set_flag: b_sl_haesol_seen
          - set_flag: b_sl_haesol_known
          - relation: { who: quiet, axis: trust, delta: 2 }
          - belief: { fact: "도해솔이 털어놓았다. 붉은연합 약탈조의 징집병이었고 여름에 담을 넘어 달아났다. 강 건너 마을 이야기는 지어낸 것이다. 붙잡히면 광장에서 본보기가 된다", source: report }
        partial:
          - set_flag: b_sl_haesol_seen
          - belief: { fact: "도해솔은 \"죽은 사람한테서 벗긴 거야. 천이 좋아서\"라고 했다. 눈을 마주치지 않았다", source: report }
        miss:
          - set_flag: b_sl_haesol_seen
          - relation: { who: quiet, axis: trust, delta: -1 }
          - belief: { fact: "도해솔은 아무것도 아니라며 웃고는 그날 내내 곁에 오지 않았다", source: seen }
    - id: report
      label: 표승민에게 알린다
      effects:
        - set_flag: b_sl_haesol_seen
        - set_flag: b_sl_haesol_reported
        - relation: { who: quiet, axis: trust, delta: -3 }
        - relation: { who: commander, axis: trust, delta: 1 }
        - belief: { fact: "도해솔의 붉은 천을 표승민에게 알렸다. 표승민은 그녀의 이름을 수첩에 적고, 당분간 정찰에서 고가도로 쪽에는 보내지 말라고 했다", source: seen }
        - deed: { summary: 분대원이 숨긴 붉은연합 완장을 연락 간부에게 알렸다, tags: [diligence, betrayal], severity: 1, privacy: semi_private }

- id: b_sl_haesol_envoy
  title: 쪽문 밖의 붉은 완장
  tags: [b_squad_leader]
  when:
    zones: [b_base]
    segments: [evening, night]
    day_gte: 4
    flags_all: [b_sl_haesol_seen]
    flags_none: [b_sl_envoy_done]
  cast:
    quiet: { ids: [b_haesol] }
  setup: "해가 진 뒤 북쪽 쪽문. 철망 너머 어둠 속에 붉은 완장을 찬 사내가 서서 경비병과 낮게 말을 주고받는다. 정찰대 배낭을 내려놓던 {quiet}의 얼굴이 하얘진다. 사내의 손전등 빛이 이쪽으로 천천히 돌아온다."
  ai_direction: 붉은 완장의 사내는 대표를 만나러 오는 붉은연합의 사자다. 그가 도해솔을 아는지는 정해지지 않았다. 도해솔은 얼굴을 들키면 끌려간다고 믿는다. 그녀를 숨기면 정찰대 일이 아니라 단지 정치에 끼어드는 셈이 되고, 사자를 막아서면 대표의 손님을 건드리는 것이다.
  choices:
    - id: hide
      label: 몸으로 가리고 그녀를 102동 쪽으로 보낸다
      check: stealth
      outcomes:
        success:
          - set_flag: b_sl_envoy_done
          - relation: { who: quiet, axis: trust, delta: 2 }
          - belief: { fact: "도해솔을 102동 쪽으로 빼냈다. 사자의 손전등은 빈 마당만 비추고 지나갔다", source: seen }
          - deed: { summary: 붉은연합 사자의 눈에서 분대원을 숨겼다, tags: [loyalty, mercy], severity: 1, privacy: private }
        partial:
          - set_flag: b_sl_envoy_done
          - relation: { who: quiet, axis: trust, delta: 1 }
          - belief: { fact: "도해솔을 빼내긴 했지만 사자의 손전등이 그녀의 등을 한 번 스쳤다. 사자가 경비병에게 무언가 물었다", source: seen }
        miss:
          - set_flag: b_sl_envoy_done
          - set_flag: b_sl_haesol_exposed
          - belief: { fact: "사자의 손전등이 도해솔의 얼굴에 멈췄다. 사자는 아무 말 없이 한참 보다가 쪽문 밖으로 돌아섰다", source: seen }
    - id: confront
      label: 쪽문으로 가서 이 시간에 누구냐고 막아선다
      check: intimidate
      outcomes:
        success:
          - set_flag: b_sl_envoy_done
          - clock: { id: b_waver, delta: -1 }
          - belief: { fact: "쪽문의 사자를 막아섰다. 사자는 웃으며 물러갔고, 경비병은 대표님 손님이라고 중얼거렸다. 도해솔은 그 사이 사라졌다", source: seen }
          - deed: { summary: 대표를 만나러 온 붉은연합 사자를 쪽문에서 막아섰다, tags: [loyalty, disobedience], severity: 2, privacy: semi_private }
        partial:
          - set_flag: b_sl_envoy_done
          - belief: { fact: "사자를 막아섰지만 배동철이 와서 들여보냈다. 사자는 지나가며 도해솔이 있던 자리를 흘끗 봤다", source: seen }
        miss:
          - set_flag: b_sl_envoy_done
          - set_flag: b_sl_haesol_exposed
          - belief: { fact: "사자를 막아서다 소란이 났다. 사람들이 손전등을 들고 몰려왔고 도해솔의 얼굴이 불빛 한가운데 있었다", source: seen }
    - id: leave
      label: 정찰대 일이 아니라며 내버려 둔다
      effects:
        - set_flag: b_sl_envoy_done
        - relation: { who: quiet, axis: trust, delta: -2 }
        - belief: { fact: "쪽문의 붉은 완장을 못 본 척했다. 도해솔은 그 밤 102동 지하에서 나오지 않았다", source: seen }

# ── 우경태: 동쪽 초소의 밤 ───────────────────────────────

- id: b_sl_gyeongtae_freeze
  title: 총을 내린 손
  fright: 2
  tags: [b_squad_leader]
  when:
    zones: [old_town, hospital_ruins, riverside, water_plant, south_fields]
    segments: [day, evening, night]
    day_gte: 3
    flags_none: [b_sl_freeze_seen]
  cast:
    inf_a: { extra: infected_hungry, label: 맨 앞의 감염체 }
    inf_b: { extra: infected_hungry, label: 비틀거리는 감염체 }
    inf_c: { extra: infected_crawler, label: 담 밑을 기는 감염체 }
    green: { ids: [b_gyeongtae] }
  setup: "무너진 담 너머에서 감염체 서넛이 비틀거리며 나온다. 수신호를 맞추자던 {green:이/가} 맨 앞에 서 있다. 총구가 아래로 처진다. 숨소리만 거칠고 발은 움직이지 않는다. 감염체와의 거리가 줄어든다."
  ai_direction: 우경태는 지난겨울 동쪽 초소에서 총을 버리고 달아났다 (비밀). 지금 그 밤처럼 얼어붙었다. 분대장이 어떻게 하느냐로 그가 산다. 곁에 다른 분대원이 있으면 그들도 그가 얼어붙은 것을 본다.
  choices:
    - id: cover
      label: 앞으로 나서 분대를 엄호 대열로 돌린다
      check: tactics
      outcomes:
        success:
          - set_flag: b_sl_freeze_seen
          - relation: { who: green, axis: respect, delta: 1 }
          - merit: 1
          - belief: { fact: "우경태가 감염체 앞에서 얼어붙었다. 분대를 돌려 엄호하는 사이 그는 겨우 뒤로 물러났다. 손이 계속 떨렸다", source: seen }
        partial:
          - set_flag: b_sl_freeze_seen
          - wound: { steps: 1, cause: 얼어붙은 분대원을 엄호하다 감염체에게 밀렸다 }
          - belief: { fact: "우경태가 얼어붙은 사이 감염체에게 밀려 다쳤다. 그는 나중에 고개를 들지 못했다", source: seen }
        miss:
          - set_flag: b_sl_freeze_seen
          - wound: { steps: 1, cause: 대열이 흩어진 채 감염체와 맞붙었다 }
          - relation: { who: green, axis: trust, delta: -1 }
          - belief: { fact: "대열이 흩어졌다. 우경태는 감염체가 코앞에 올 때까지 총을 들지 못했다", source: seen }
    - id: drag
      label: 그의 멱살을 잡고 뒤로 끌어낸다
      check: endure
      outcomes:
        success:
          - set_flag: b_sl_freeze_seen
          - relation: { who: green, axis: trust, delta: 1 }
          - belief: { fact: "얼어붙은 우경태를 끌어내 물러났다. 그는 돌아오는 내내 한 마디도 하지 않았다", source: seen }
        partial:
          - set_flag: b_sl_freeze_seen
          - wound: { steps: 1, cause: 얼어붙은 분대원을 끌어내다 넘어졌다 }
          - belief: { fact: "우경태를 끌어내다 함께 넘어졌다. 그는 미안하다는 말을 하지 못했다", source: seen }
        miss:
          - set_flag: b_sl_freeze_seen
          - wound: { steps: 2, cause: 얼어붙은 분대원을 끌어내다 감염체에게 붙잡혔다 }
          - belief: { fact: "우경태를 끌어내다 감염체에게 붙잡혔다. 구본식이 쇠지렛대로 떼어 냈다", source: seen }
    - id: shout
      label: 이름을 부르며 쏘라고 소리친다
      effects:
        - set_flag: b_sl_freeze_seen
        - relation: { who: green, axis: affection, delta: -1 }
        - zone_noise: 1
        - belief: { fact: "우경태에게 쏘라고 소리쳤다. 그는 그제야 한 발을 쐈다. 총소리가 골목 끝까지 울렸다", source: seen }

- id: b_sl_gyeongtae_confess
  title: 초록 띠
  tags: [b_squad_leader]
  when:
    zones: [b_base]
    segments: [night]
    flags_all: [b_sl_freeze_seen]
    flags_none: [b_sl_gyeongtae_done]
  cast:
    green: { ids: [b_gyeongtae] }
  setup: '102동 계단 밑. {green:이/가} 초록 띠를 완장에서 풀어 손에 감았다 풀었다 한다. 당신을 보고 일어서려다 다시 앉는다. "분대장님. 표 간부님한테 말씀하실 겁니까."'
  ai_direction: 우경태는 얼어붙은 것을 들켰다고 생각한다. 신뢰가 충분하면 동쪽 초소의 밤을 털어놓을 수 있다 (reveal_secret). 표승민이 알면 그는 정찰대에서 빠지고, 연합의 자랑이던 사람이 연합의 망신이 된다.
  choices:
    - id: no_blame
      label: 말하지 않겠다고, 다음엔 옆에 서겠다고 한다
      effects:
        - set_flag: b_sl_gyeongtae_done
        - relation: { who: green, axis: trust, delta: 2 }
        - belief: { fact: "우경태에게 표승민에게 말하지 않겠다고 했다. 그는 초록 띠를 다시 완장에 맸다", source: seen }
    - id: report
      label: 분대를 위해 표승민에게 알려야 한다고 한다
      effects:
        - set_flag: b_sl_gyeongtae_done
        - relation: { who: green, axis: trust, delta: -3 }
        - relation: { who: commander, axis: respect, delta: 1 }
        - belief: { fact: "우경태가 싸움 앞에서 얼어붙었다고 표승민에게 알렸다. 표승민은 놀라지 않았다. 다음 날부터 우경태는 정문 경비조로 돌았다", source: seen }
        - deed: { summary: 싸움 앞에서 얼어붙은 분대원을 연락 간부에게 알렸다, tags: [diligence, betrayal], severity: 1, privacy: semi_private }
    - id: rear
      label: 당분간 분대 뒤를 맡기겠다고만 한다
      effects:
        - set_flag: b_sl_gyeongtae_done
        - relation: { who: green, axis: respect, delta: -1 }
        - relation: { who: green, axis: affection, delta: 1 }
        - belief: { fact: "우경태를 분대 뒤로 돌렸다. 그는 고개를 끄덕였지만 초록 띠를 다시 매지 않았다", source: seen }

# ── 구본식: 철물점 지하 ───────────────────────────────

- id: b_sl_bonsik_cellar
  title: 철물점 지하
  fright_tags: [enclosed]
  tags: [b_squad_leader]
  when:
    zones: [old_town]
    segments: [morning, day]
    day_gte: 4
    flags_none: [b_sl_cellar_done]
  cast:
    old: { ids: [b_bonsik], trust_gte: 2 }
  setup: '구시가 상가 끝, 간판이 떨어진 철물점 앞. {old:이/가} 주위를 두 번 돌아보더니 셔터 밑으로 기어 들어가 손짓한다. 계산대 뒤 바닥에 쇠 뚜껑이 있다. "대장. 이거 보여 주는 건 대장이 처음이야."'
  ai_direction: 구본식은 옛 철물점 지하에 연료통과 공구, 통조림을 숨겨 두었다. 관리사무소 장부에 없는 것이다. 단지가 무너지는 날 손녀를 데리고 숨어들 곳이라고 털어놓는다. 장부에 올리면 단지 살림은 조금 나아지고 그는 마지막 피난처를 잃는다. 맹석규에게 들키면 회의에서 말이 나온다.
  choices:
    - id: ledger
      label: 관리사무소 장부에 올려야 한다고 한다
      effects:
        - set_flag: b_sl_cellar_done
        - relation: { who: old, axis: trust, delta: -2 }
        - faction_resource: { faction: own, resource: fuel, delta: 5 }
        - faction_resource: { faction: own, resource: food, delta: 5 }
        - belief: { fact: "구본식의 철물점 지하 물자를 관리사무소 장부에 올렸다. 맹석규는 숫자를 적고 한숨을 쉬었다. 구본식은 그날 손녀를 보러 가지 않았다", source: seen }
        - deed: { summary: 분대원이 숨긴 물자를 관리사무소 장부에 올렸다, tags: [honesty, diligence], severity: 1, privacy: semi_private }
    - id: keep
      label: 정찰대만 아는 곳으로 두자고 한다
      effects:
        - set_flag: b_sl_cellar_done
        - set_flag: b_sl_cellar_secret
        - relation: { who: old, axis: trust, delta: 2 }
        - belief: { fact: "구시가 옛 철물점 지하에 구본식이 숨긴 연료와 공구, 통조림이 있다. 정찰대만 아는 곳으로 두기로 했다", source: seen }
        - deed: { summary: 장부에 없는 물자를 분대만의 비밀로 덮었다, tags: [loyalty, deceit], severity: 1, privacy: private }
    - id: share
      label: 지하 교실 아이들 몫만 조금 덜어 가자고 한다
      effects:
        - set_flag: b_sl_cellar_done
        - set_flag: b_sl_cellar_secret
        - give_item: { item: canned_food, quantity: 2 }
        - relation: { who: old, axis: trust, delta: 1 }
        - belief: { fact: "구본식의 철물점 지하에서 통조림 두 개를 덜어 지하 교실 아이들 몫으로 가져가기로 했다. 나머지는 그대로 두었다", source: seen }
