# 붉은연합 약탈조장 스토리렛 (초안). 형식은 a_grunt.yaml 머리말 참고
# 갈래:
# - 앞줄: c_sl_front_row (마경수가 공세 앞줄에 조원 하나를 내라고 한다)
# - 귀: c_sl_changsik_evening → c_sl_changsik_choice (표창식이 규율반에 말을 옮긴다)
# - 탈영: c_sl_seokjin_plan (고석진이 빠져나갈 길을 묻는다)
# - 동생: c_sl_muyeol_window (권무열이 수용소 창문을 본다)
# tags: c_squad_leader = 사조에 묶인 이야기

- id: c_sl_first_roll
  title: 드럼통 불가의 점호
  tags: [c_squad_leader]
  when:
    zones: [c_warehouse]
    segments: [dawn, morning]
    flags_none: [c_sl_rolled]
  cast:
    big: { ids: [c_muyeol] }
    old: { ids: [c_changsik] }
  setup: "조장이 되고 처음 부르는 점호. {big:은/는} 대답 대신 턱을 든다. {old:은/는} \"예, 예\" 하고 털모자를 벗는다. 지휘소 창문의 장갑 낀 손이 아직 거기 있다. 첫마디를 다들 기다린다."
  ai_direction: 조원들은 새 조장이 위를 보는 사람인지 아래를 보는 사람인지 재고 있다. 마경수는 창문에서 지켜본다. 무엇을 말하든 조원 넷과 위쪽이 함께 듣는다.
  choices:
    - id: hard
      label: 할당량과 군율부터 못 박는다
      effects:
        - set_flag: c_sl_rolled
        - relation: { who: commander, axis: respect, delta: 1 }
        - relation: { who: big, axis: affection, delta: -1 }
        - belief: { fact: 첫 점호에서 군율부터 못 박았다. 지휘소 창문의 손이 사라졌다, source: seen }
    - id: ours
      label: 사조는 사조 사람을 버리지 않는다고 말한다
      effects:
        - set_flag: c_sl_rolled
        - relation: { who: big, axis: trust, delta: 1 }
        - relation: { who: old, axis: respect, delta: -1 }
        - deed: { summary: 첫 점호에서 조원을 버리지 않겠다고 말했다, tags: [loyalty], severity: 1, privacy: semi_private }
    - id: short
      label: 이름만 부르고 일을 나눈다
      effects:
        - set_flag: c_sl_rolled

- id: c_sl_front_row
  title: 앞줄에 설 사람
  tags: [c_squad_leader]
  when:
    zones: [c_warehouse, c_base]
    segments: [morning, day]
    day_gte: 3
    flags_none: [c_sl_front_decided]
  cast:
    boss: { commander: true }
    young: { ids: [c_areum] }
  setup: "{boss:이/가} 장갑을 벗지 않은 손으로 명단을 내민다. 조마다 한 사람씩, 동쪽 공세 맨 앞줄이다. \"사조는 누굴 낼 건가. 오늘 저녁까지 이름을 적어.\" 명단 아래에서 {young:이/가} 숨을 멈추는 소리가 들린다."
  ai_direction: 마경수는 조장이 누구를 내는지로 조장을 잰다. 신입을 내면 편하지만 조원들은 기억한다. 스스로 서겠다면 마경수는 웃지만 말리지 않는다. 맞서면 판정이 걸린다.
  choices:
    - id: send_young
      label: 진아름의 이름을 적는다
      effects:
        - set_flag: c_sl_front_decided
        - set_flag: c_sl_areum_front
        - relation: { who: young, axis: trust, delta: -3 }
        - relation: { who: commander, axis: respect, delta: 1 }
        - deed: { summary: 공세 앞줄에 징집된 신입의 이름을 적었다, tags: [cruelty], severity: 2, privacy: semi_private }
    - id: self
      label: 자기 이름을 적는다
      effects:
        - set_flag: c_sl_front_decided
        - set_flag: c_sl_self_front
        - relation: { who: young, axis: affection, delta: 2 }
        - merit: 1
        - deed: { summary: 조원 대신 자기 이름을 공세 앞줄에 적었다, tags: [bravery, loyalty], severity: 2, privacy: public }
    - id: argue
      label: 사조는 길잡이로 쓰는 게 낫다고 맞선다
      check: tactics
      outcomes:
        success:
          - set_flag: c_sl_front_decided
          - relation: { who: commander, axis: respect, delta: 1 }
          - belief: { fact: "마경수가 사조를 공세 길잡이로 쓰기로 했다. 앞줄은 다른 조가 낸다", source: seen }
        partial:
          - set_flag: c_sl_front_decided
          - relation: { who: commander, axis: trust, delta: -1 }
          - belief: { fact: "앞줄은 면했지만 마경수가 사조를 두고 무언가 적었다", source: seen }
        miss:
          - relation: { who: commander, axis: trust, delta: -2 }
          - belief: { fact: "맞섰다가 마경수의 눈 밖에 났다. 이름은 저녁까지 적어야 한다", source: seen }

- id: c_sl_changsik_evening
  title: 규율반 천막의 그림자
  tags: [c_squad_leader]
  when:
    segments: [evening]
    day_gte: 2
    flags_none: [c_sl_changsik_seen]
  cast:
    old: { ids: [c_changsik] }
  setup: "저녁 배식 뒤, 규율반 천막 옆 그늘에서 회색 털모자가 보인다. {old:이/가} 천막 안쪽 누군가에게 고개를 숙이고 있다. 손가락이 허벅지를 장부 넘기듯 두드린다."
  ai_direction: 표창식은 사조의 말을 규율반에 옮긴다. 담 안에 남는 값이다. 지금은 천막 안 사람과 이야기하는 것까지만 보인다. 무슨 말을 했는지는 모른다.
  choices:
    - id: confront
      label: 천막에서 나오는 그를 기다린다
      effects:
        - set_flag: c_sl_changsik_seen
        - set_flag: c_sl_changsik_known
        - relation: { who: old, axis: trust, delta: -1 }
        - belief: { fact: "표창식이 저녁마다 규율반 천막에 간다. 마주치자 담배 심부름이었다고 둘러댔다", source: seen }
    - id: watch
      label: 못 본 척 지나가고 기억해 둔다
      effects:
        - set_flag: c_sl_changsik_seen
        - set_flag: c_sl_changsik_known
        - belief: { fact: "표창식이 규율반 천막 안 누군가에게 고개를 숙이고 무언가 말하는 것을 봤다", source: seen }
    - id: nothing
      label: 늙은이 볼일이라 여기고 넘긴다
      effects:
        - set_flag: c_sl_changsik_seen

- id: c_sl_changsik_choice
  title: 담이 듣는다
  tags: [c_squad_leader]
  when:
    segments: [night]
    flags_all: [c_sl_changsik_known]
    flags_none: [c_sl_changsik_done]
  cast:
    old: { ids: [c_changsik] }
  setup: "막사 뒤, {old:이/가} 혼자 담배를 말고 있다. 당신을 보고도 일어서지 않는다. \"조장님도 아시는 거지요. 저는 담 밖에서 한 겨울도 못 납니다.\""
  ai_direction: 표창식은 들킨 걸 안다. 빌지 않고 사정을 말한다. 그를 규율반에 되치면 그는 끝이다. 놔두면 사조의 말은 계속 새지만, 무엇을 옮길지 조장이 정해 줄 수도 있다 (거꾸로 쓰기).
  choices:
    - id: turn
      label: 이제부터 무엇을 옮길지는 내가 정한다고 한다
      check: intimidate
      outcomes:
        success:
          - set_flag: c_sl_changsik_done
          - set_flag: c_sl_changsik_turned
          - relation: { who: old, axis: respect, delta: 2 }
          - belief: { fact: "표창식이 앞으로 규율반에 옮길 말은 조장이 정해 주기로 했다", source: seen }
        partial:
          - set_flag: c_sl_changsik_done
          - relation: { who: old, axis: trust, delta: -1 }
          - belief: { fact: "표창식은 고개를 끄덕였지만 정말 그럴지는 모르겠다", source: seen }
        miss:
          - relation: { who: old, axis: affection, delta: -2 }
    - id: expose
      label: 조원들 앞에 끌어낸다
      effects:
        - set_flag: c_sl_changsik_done
        - relation: { who: old, axis: trust, delta: -3 }
        - deed: { summary: 규율반에 말을 옮기던 조원을 사조 앞에 끌어냈다, tags: [loyalty, cruelty], severity: 2, privacy: semi_private }
        - npc_depart: { who: old }
        - belief: { fact: "표창식은 다음 날 아침 담 밖으로 쫓겨났다", source: seen }
    - id: spare
      label: 아무것도 못 들은 걸로 한다
      effects:
        - set_flag: c_sl_changsik_done
        - relation: { who: old, axis: affection, delta: 1 }

- id: c_sl_seokjin_plan
  title: 빠져나갈 길
  tags: [c_squad_leader]
  when:
    segments: [evening, night]
    day_gte: 3
    flags_none: [c_sl_seokjin_done]
  cast:
    thin: { ids: [c_seokjin] }
  setup: "경비 교대 직전, {thin:이/가} 당신 옆에 바짝 붙어 선다. 눈은 담 너머를 본다. \"조장님. 새벽 다섯 시 교대 때 남쪽 담이 비는 거, 아세요. 그냥… 아시냐고요.\""
  ai_direction: 고석진은 탈영을 생각한다. 조장을 떠보는 중이다. 조원이 탈영하면 조장도 본보기가 될 수 있다 (군율). 보고하면 공적이 쌓이지만 고석진은 끝난다. 눈감아 주면 고석진은 빠져나갈 수도, 잡힐 수도 있다.
  choices:
    - id: report
      label: 마경수에게 알린다
      effects:
        - set_flag: c_sl_seokjin_done
        - merit: 2
        - relation: { who: thin, axis: trust, delta: -3 }
        - deed: { summary: 탈영을 떠본 조원을 간부에게 알렸다, tags: [diligence, betrayal], severity: 2, privacy: semi_private }
        - npc_capture: { who: thin, by: faction_c, zone: c_warehouse }
    - id: blind
      label: 모른다고만 대답한다
      effects:
        - set_flag: c_sl_seokjin_done
        - relation: { who: thin, axis: trust, delta: 2 }
        - deed: { summary: 조원의 탈영 계획을 알고도 눈감았다, tags: [disobedience, mercy], severity: 2, privacy: private }
        - npc_depart: { who: thin }
        - belief: { fact: "고석진이 새벽 교대 때 남쪽 담으로 사라졌다. 사조 점호에 한 자리가 빈다", source: seen }
    - id: talk_down
      label: 지금 나가면 죽는다고 붙잡는다
      check: persuade
      outcomes:
        success:
          - set_flag: c_sl_seokjin_done
          - relation: { who: thin, axis: trust, delta: 1 }
          - belief: { fact: "고석진이 겨울까지는 버텨 보기로 했다", source: seen }
        partial:
          - relation: { who: thin, axis: affection, delta: -1 }
        miss:
          - set_flag: c_sl_seokjin_done
          - npc_depart: { who: thin }
          - belief: { fact: "말렸지만 고석진은 그날 새벽 사라졌다", source: seen }

- id: c_sl_muyeol_window
  title: 수용소 창문
  tags: [c_squad_leader]
  when:
    zones: [c_warehouse]
    segments: [evening, night]
    day_gte: 4
    flags_none: [c_sl_muyeol_done]
  cast:
    big: { ids: [c_muyeol], trust_gte: 1 }
  setup: "수용소 담 옆, {big:이/가} 안쪽 창문을 올려다보고 있다. 당신이 다가오자 주먹을 쥐었다 편다. \"조장. 저 안에 배식 한 번 더 넣는 거, 조장이면 할 수 있지.\""
  ai_direction: 권무열의 동생이 저 안에 있다 (비밀). 지금은 배식 이야기만 한다. 들어주면 마경수의 눈에 걸릴 수 있다. 사정을 캐물으면 판정으로 동생 이야기를 털어놓는다.
  choices:
    - id: help
      label: 배급 하나를 몰래 넣어 준다
      effects:
        - set_flag: c_sl_muyeol_done
        - take_item: { item: dry_ration }
        - relation: { who: big, axis: trust, delta: 2 }
        - deed: { summary: 수용소 포로에게 몰래 먹을 것을 넣었다, tags: [mercy, disobedience], severity: 2, privacy: private }
    - id: ask
      label: 누구 때문이냐고 묻는다
      check: sense_danger
      outcomes:
        success:
          - set_flag: c_sl_muyeol_done
          - relation: { who: big, axis: trust, delta: 1 }
          - belief: { fact: "권무열의 친동생이 수용소에 갇혀 있다. 붕괴 때 다른 무리로 흩어졌다고 한다", source: report }
        partial:
          - belief: { fact: "권무열은 수용소 안에 아는 사람이 있다고만 했다", source: report }
        miss:
          - relation: { who: big, axis: affection, delta: -1 }
    - id: refuse
      label: 군율이라고 잘라 말한다
      effects:
        - set_flag: c_sl_muyeol_done
        - relation: { who: big, axis: affection, delta: -2 }
        - relation: { who: commander, axis: respect, delta: 1 }
