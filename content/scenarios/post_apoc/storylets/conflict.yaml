# 무리 안의 갈등 (12-134): 사기·창고가 가라앉으면 수군거림(world_mood)이 실제로 터진다. 탈영, 창고 도둑, 주먹다짐, 반란 모의
# - tags: [world]. 우리 땅(own_territory)에서만, 무리를 가정하지 않는다 (배역은 faction: own)
# - 탈영은 무리의 사람 수(faction_population)를 실제로 줄인다. 창고는 faction_resource
# - 반란 모의: 간부가 아니면 끌어들이는 쪽에 선다(가담하면 이어지는 밤), 간부면 막는 쪽에 선다

- id: cf_deserters
  title: 비어 있는 자리
  tags: [world]
  repeatable: true
  cooldown_days: 8
  when:
    zones: [a_base, b_base, c_base, d_clinic, e_market, yeoul_isle]
    indoor: "any"
    own_territory: true
    own_morale_lte: -2
    segments: [dawn, morning]
  setup: 아침 점호에 넷이 비었다. 침상은 개켜져 있고, 물통과 담요가 같이 사라졌다. 남쪽 쪽문 빗장이 안에서 풀려 있다.
  ai_direction: 떠난 사람들은 남쪽으로 갔다 (불가에서 떠나자던 말이 진심이었다). 아직 멀리 못 갔을 수 있다. 남은 사람들은 서로의 얼굴을 살핀다. 누가 다음인지.
  choices:
    - id: chase
      label: 발자국을 따라 쫓아간다
      check: survival
      outcomes:
        success:
          - faction_population: { faction: own, delta: -1 }
          - deed: { summary: 밤사이 떠난 사람들을 쫓아가 셋을 데려왔다, tags: [loyalty], severity: 1, privacy: public }
        partial:
          - faction_population: { faction: own, delta: -3 }
          - belief: { fact: 떠난 넷 가운데 하나만 데려왔다. 나머지는 돌아오지 않겠다고 했다, source: seen }
        miss:
          - faction_population: { faction: own, delta: -4 }
          - belief: { fact: 떠난 사람들의 발자국은 강변에서 끊겼다, source: seen }
    - id: let_go
      label: 떠날 사람은 떠나게 둔다
      effects:
        - faction_population: { faction: own, delta: -4 }
        - belief: { fact: 밤사이 넷이 무리를 떠났다. 쫓지 않았다, source: seen }
    - id: rally
      label: 남은 사람들을 마당에 모아 말한다
      check: leadership
      outcomes:
        success:
          - faction_population: { faction: own, delta: -4 }
          - faction_morale: { faction: own, delta: 1 }
          - deed: { summary: 사람이 떠난 아침 남은 사람들을 모아 다잡았다, tags: [loyalty], severity: 1, privacy: public }
        partial:
          - faction_population: { faction: own, delta: -4 }
        miss:
          - faction_population: { faction: own, delta: -5 }
          - belief: { fact: 마당에서 말을 하는 동안 또 하나가 짐을 쌌다, source: seen }

- id: cf_store_theft
  title: 부서진 자물쇠
  tags: [world]
  repeatable: true
  cooldown_days: 10
  when:
    zones: [a_base, b_base, c_base, d_clinic, e_market, yeoul_isle]
    indoor: "any"
    own_territory: true
    own_morale_lte: -1
    segments: [morning, day]
  cast:
    suspect: { faction: own }
  setup: 창고 자물쇠가 쇠지레로 비틀려 있다. 식량 자루 몇 개가 비었다. 창고지기가 소리를 지르고, 사람들이 몰려든다. 바닥에 흙 묻은 발자국이 숙소 쪽으로 나 있다. 그 끝에 {suspect}의 숙소가 있다.
  ai_direction: "{suspect:이/가} 정말 훔쳤는지는 판정으로 드러난다. 굶는 가족이 있을 수도, 누명일 수도 있다. 사람들은 범인을 원한다. 아무도 숫자를 말하지 않는다 (얼마나 없어졌는지 지어내지 않는다)."
  choices:
    - id: track
      label: 발자국을 끝까지 따라가 확인한다
      check: sense_danger
      outcomes:
        success:
          - relation: { who: suspect, axis: trust, delta: -2 }
          - deed: { summary: "창고를 턴 {suspect:을/를} 찾아내 식량을 되찾았다", tags: [diligence], severity: 2, privacy: public }
        partial:
          - faction_resource: { faction: own, resource: food, delta: -5 }
          - belief: { fact: "{suspect}의 숙소에서 식량 자루 반을 찾았다. 나머지는 이미 어디론가 갔다", source: seen }
        miss:
          - faction_resource: { faction: own, resource: food, delta: -10 }
          - faction_morale: { faction: own, delta: -1 }
          - belief: { fact: 창고 도둑을 찾지 못했다. 사람들이 서로를 의심하기 시작했다, source: seen }
    - id: cover
      label: "{suspect}에게 몰래 가서 돌려놓으라고 귀띔한다"
      check: persuade
      outcomes:
        success:
          - relation: { who: suspect, axis: trust, delta: 2 }
          - belief: { fact: "{suspect:이/가} 밤사이 식량 자루를 창고 앞에 도로 갖다 놓았다. 아무도 누군지 모른다", source: seen }
        partial:
          - relation: { who: suspect, axis: trust, delta: 1 }
          - faction_resource: { faction: own, resource: food, delta: -5 }
        miss:
          - faction_resource: { faction: own, resource: food, delta: -10 }
          - belief: { fact: "{suspect:은/는} 무슨 소리냐며 문을 닫았다", source: seen }
    - id: stay_out
      label: 끼어들지 않는다
      effects:
        - faction_resource: { faction: own, resource: food, delta: -10 }
        - belief: { fact: 창고 자물쇠가 부서졌다. 범인은 나오지 않았다, source: seen }

- id: cf_brawl
  title: 배식 줄의 주먹
  tags: [world]
  repeatable: true
  cooldown_days: 6
  when:
    zones: [a_base, b_base, c_base, d_clinic, e_market, yeoul_isle]
    indoor: "any"
    own_territory: true
    own_morale_lte: -1
    segments: [morning, evening]
  cast:
    hitter: { faction: own }
    hit: { faction: own }
  setup: 배식 줄에서 {hitter:이/가} {hit:을/를} 밀친다. "한 국자 더 받았잖아." 그릇이 바닥에 엎어지고, 순식간에 둘이 뒤엉킨다. 줄 선 사람들은 말리지 않고 구경한다.
  ai_direction: 국자 하나가 아니라 쌓인 것이 터졌다. 둘 다 굶주렸고 지쳤다. 말리면 누구 편을 들었는지 다들 기억한다.
  choices:
    - id: separate
      label: 둘 사이에 끼어들어 뜯어말린다
      check: fight
      outcomes:
        success:
          - relation: { who: hitter, axis: respect, delta: 1 }
          - relation: { who: hit, axis: respect, delta: 1 }
          - deed: { summary: 배식 줄의 주먹다짐을 뜯어말렸다, tags: [loyalty], severity: 1, privacy: public }
        partial:
          - relation: { who: hitter, axis: affection, delta: -1 }
          - belief: { fact: "{hitter:과/와} {hit:을/를} 떼어 놓았지만 팔꿈치에 한 대 맞았다", source: seen }
        miss:
          - faction_morale: { faction: own, delta: -1 }
          - belief: { fact: 말리다가 판이 더 커졌다. 배식이 한동안 멈췄다, source: seen }
    - id: side
      label: "{hit}의 편을 든다"
      effects:
        - relation: { who: hit, axis: trust, delta: 1 }
        - relation: { who: hitter, axis: affection, delta: -2 }
    - id: watch
      label: 구경꾼들 틈에 선다
      effects:
        - faction_morale: { faction: own, delta: -1 }
        - belief: { fact: "배식 줄에서 {hitter:과/와} {hit:이/가} 주먹다짐을 했다. 아무도 말리지 않았다", source: seen }

- id: cf_mutiny_whisper
  title: 창고 열쇠 이야기
  tags: [world]
  repeatable: true
  cooldown_days: 15
  when:
    zones: [a_base, b_base, c_base, d_clinic, e_market, yeoul_isle]
    indoor: false
    own_territory: true
    own_morale_lte: -2
    ranks: [grunt, staff, squad_leader]
    flags_none: [cf_mutiny_joined]
    segments: [evening, night]
  cast:
    plotter: { faction: own }
  setup: '{plotter:이/가} 숙소 뒤로 당신을 끌고 간다. "윗사람들 창고에는 아직 통조림이 쌓였대. 우리만 굶는 거야. 며칠 뒤 밤에 몇이서 창고를 열 거야. 너도 끼어."'
  ai_direction: "{plotter:은/는} 진심으로 분노해 있다. 지도부 창고가 정말 넉넉한지는 모른다 (소문일 수 있다). 가담하면 며칠 뒤 그 밤이 온다. 알리면 {plotter:은/는} 무거운 벌을 받는다."
  choices:
    - id: join
      label: 끼겠다고 한다
      effects:
        - set_flag: cf_mutiny_joined
        - relation: { who: plotter, axis: trust, delta: 2 }
        - belief: { fact: "{plotter:과/와} 몇이 며칠 뒤 밤에 지도부 창고를 열기로 했다. 끼겠다고 했다", source: seen }
    - id: report
      label: 지도부에 알린다
      effects:
        - merit: 1
        - relation: { who: plotter, axis: trust, delta: -3 }
        - deed: { summary: "{plotter}의 창고 털기 모의를 지도부에 알렸다", tags: [diligence], severity: 2, privacy: semi_private }
    - id: refuse
      label: 듣지 않은 걸로 하겠다며 돌아선다
      effects:
        - relation: { who: plotter, axis: trust, delta: -1 }
        - belief: { fact: "{plotter:이/가} 지도부 창고를 털자고 했다. 거절했다", source: seen }

- id: cf_mutiny_night
  title: 창고 앞의 밤
  tags: [world]
  urgent: true
  # 모의는 다시 열릴 수 있어 이 밤도 반복된다 (한 번뿐이면 두 번째로 끼었을 때 플래그가 남아 모의가 다시 열리지 않는다).
  # 약속한 밤이라 다른 이야기보다 먼저 오게 무게를 크게
  repeatable: true
  weight: 10
  when:
    zones: [a_base, b_base, c_base, d_clinic, e_market, yeoul_isle]
    indoor: false
    own_territory: true
    flags_all: [cf_mutiny_joined]
    segments: [night]
  setup: 약속한 밤이다. 창고 뒤 그늘에 다섯이 모였다. 하나가 쇠지레를 들고, 하나는 초소 쪽을 본다. 초소 불빛이 평소보다 밝은 것 같다.
  ai_direction: 지도부가 눈치챘는지는 판정으로 드러난다. 들키면 지도부의 벌을 받는다 (공적이 깎이고 무리 안에서 이름이 남는다). 성공하면 통조림을 나눠 들고 흩어진다. 지도부 창고가 정말 넉넉했는지는 열어 봐야 안다.
  choices:
    - id: go
      label: 쇠지레를 받아 든다
      check: stealth
      outcomes:
        success:
          - clear_flag: cf_mutiny_joined
          - give_item: { item: canned_food, quantity: 3 }
          - faction_resource: { faction: own, resource: food, delta: -15 }
          - faction_morale: { faction: own, delta: -1 }
          - deed: { summary: 몇이서 밤에 지도부 창고를 털었다, tags: [theft], severity: 2, privacy: private }
        partial:
          - clear_flag: cf_mutiny_joined
          - give_item: { item: canned_food, quantity: 1 }
          - faction_resource: { faction: own, resource: food, delta: -5 }
          - belief: { fact: 창고 문을 열자마자 초소에서 소리가 났다. 통조림 하나만 쥐고 흩어졌다, source: seen }
        miss:
          - clear_flag: cf_mutiny_joined
          - merit: -2
          - deed: { summary: 지도부 창고를 털다 붙잡혔다, tags: [theft], severity: 3, privacy: public }
    - id: back_out
      label: 마지막에 빠진다
      effects:
        - clear_flag: cf_mutiny_joined
        - belief: { fact: 창고 앞의 밤에 마지막 순간 빠졌다. 다른 넷이 어떻게 됐는지는 아침에 알게 된다, source: seen }

- id: cf_mutiny_council
  title: 아래에서 올라오는 말
  tags: [world]
  repeatable: true
  cooldown_days: 15
  when:
    own_territory: true
    own_morale_lte: -2
    ranks: [officer]
    indoor: "any"
    segments: [day, evening]
  cast:
    informer: { faction: own }
  setup: '{informer:이/가} 회의가 끝난 뒤 남아 목소리를 낮춘다. "아래에서 창고를 털자는 말이 돌아요. 지도부만 배부르다고. 며칠 안에 일이 날 겁니다."'
  ai_direction: 아래 사람들의 분노는 반쯤은 사실이다 (간부의 배급이 더 낫다). 주동자를 잡으면 겁은 주지만 원망이 남는다. 달래면 창고가 준다.
  choices:
    - id: appease
      label: 창고를 조금 풀어 배급을 늘린다
      effects:
        - faction_resource: { faction: own, resource: food, delta: -10 }
        - faction_morale: { faction: own, delta: 1 }
        - belief: { fact: 아래의 불만을 듣고 창고를 조금 풀어 배급을 늘렸다, source: seen }
    - id: crack_down
      label: 주동자를 찾아 본보기로 내쫓는다
      check: intimidate
      outcomes:
        success:
          - faction_population: { faction: own, delta: -1 }
          - deed: { summary: 창고 털기를 모의한 주동자를 내쫓았다, tags: [diligence], severity: 2, privacy: public }
        partial:
          - faction_population: { faction: own, delta: -1 }
          - faction_morale: { faction: own, delta: -1 }
        miss:
          - faction_population: { faction: own, delta: -3 }
          - faction_morale: { faction: own, delta: -1 }
          - belief: { fact: 주동자를 내쫓자 그 친구 둘이 함께 떠났다, source: seen }
    - id: wait
      label: 더 들어 보자고만 한다
      effects:
        - relation: { who: informer, axis: trust, delta: 1 }
