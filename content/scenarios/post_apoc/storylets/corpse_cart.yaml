# 전장의 시체 거두는 사람들 (docs/cannibal-plan.md 4). 이름 없는 수레꾼은 extras/ranch.yaml(corpse_carter)
# 사상자가 난 교전이 있었던 구역(when.battle_days_lte, 교전 기록)에 하루 이틀 안에 수레가 온다. 겉으로는 "공동묘지에 묻어 준다".
# 수레는 발전소 회처리장 목장(storylets/ranch.yaml)으로 간다. 목장이 끝나면(rn_closed) 수레도 오지 않는다.
# 주인공도 가담할 수 있다 (사용자 결정 2026-11-26): 시신을 실어 주고 몫을 받는다
#
# 이야기: cc_cart (누구나, 되풀이) · cc_comrade (무리에 든 사람, 되풀이: 우리 완장을 찬 시신)
# 지킬 선: 시신을 다루는 일은 결과와 정황으로만. 노골적인 글은 belief의 mature 칸에만 (렌즈, 공통 규칙 21)

- id: cc_cart
  title: 싸움터의 덮개 수레
  tags: [world, cannibal]
  repeatable: true
  cooldown_days: 10
  when:
    indoor: false
    segments: [dawn, morning]
    battle_days_lte: 2
    flags_none: [rn_closed]
  cast:
    carter: { extra: corpse_carter, label: 시체 수레꾼, adult: true }
  setup: 싸움이 지나간 자리에 아직 탄내가 남았다. 덮개를 씌운 손수레 하나가 쓰러진 사람들 사이를 오간다. {carter:이/가} 고무장갑 낀 손으로 시신의 발목을 잡아 수레에 올리고, 짧게 손을 모은 뒤 덮개를 덮는다. 당신을 보자 고개를 숙인다. "묻어 드리러 왔습니다. 아무도 안 묻어 주잖아요."
  ai_direction: 수레꾼은 공동묘지에 묻어 준다고 하지만, 수레는 발전소 회처리장 목장으로 간다. 머릿수만큼 고기와 탄약을 받는다. 수레에 실린 것은 이 구역 교전에서 죽은 사람들이다 (어느 무리 사람인지는 장면의 정황대로). 따라가면 발전소 진입로로 오른다. 덮개를 들추려 하면 손으로 누르고 냄새가 난다고 한다. 수레꾼과 맞서 죽이고 살리는 일은 판정과 전투가 정한다. 지킬 선 — 시신을 다루는 일은 결과와 정황으로만 그린다. 해체·도축은 그리지 않는다. 성적 착취에 주인공이 가담하는 길은 내밀지 않는다.
  choices:
    - id: follow
      label: 수레가 떠난 뒤 바퀴 자국을 멀찍이 따라간다
      check: stealth
      outcomes:
        success:
          - set_flag: rn_lead
          - learn_place: { place: ash_pens, zone: power_plant }
          - belief: { fact: "시체 수레는 공동묘지로 가지 않았다. 발전소 진입로를 올라 서북쪽 끝 회처리장 컨테이너 창고 앞에 섰다. 고무 앞치마를 두른 늙은 남자가 덮개를 들추고 머릿수를 셌다", source: seen }
        partial:
          - set_flag: rn_lead
          - belief: { fact: "시체 수레는 묘지 쪽이 아니라 발전소 굴뚝 쪽으로 갔다. 진입로에서 수레꾼이 뒤를 돌아봐 더 따라가지 못했다", source: seen }
        miss:
          - belief: { fact: "시체 수레를 따라가다 놓쳤다. 공동묘지 쪽은 아니었다. 수레꾼은 나를 한 번 돌아보고 걸음을 서둘렀다", source: seen }
    - id: help
      label: 시신을 함께 실어 주고 수레꾼에게 몫을 묻는다
      effects:
        - set_flag: rn_lead
        - give_item: { item: ranch_meat }
        - body: { track: nerves, delta: 1 }
        - deed: { summary: 싸움터의 시신을 시체 수레에 실어 주고 고기 몫을 받았다, tags: [cruelty], severity: 1, privacy: private }
        - belief:
            fact: "수레꾼과 시신을 실어 주었다. 그는 공동묘지 이야기는 그만두고 소금에 절인 고기 한 덩이를 내밀었다. 발전소 회처리장에 가면 머릿수만큼 쳐 준다고 했다"
            mature: "시신을 수레에 실어 주고 고기 한 덩이를 받았다. 이 수레에 실린 사람들도 소금에 절여져 같은 고기가 될 것이다. 발전소 회처리장에 가면 머릿수만큼 쳐 준다고 했다"
            source: seen
    - id: lift
      label: 수레 덮개를 들춰 보겠다며 손을 뻗는다
      check: intimidate
      outcomes:
        success:
          - set_flag: rn_lead
          - learn_place: { place: ash_pens, zone: power_plant }
          - belief: { fact: "수레꾼은 덮개를 누르던 손을 놓고 털어놓았다: 공동묘지가 아니라 발전소 회처리장 목장으로 간다. 머릿수만큼 고기와 탄약을 받는다. 그는 수레를 두고 달아났다", source: report }
        partial:
          - belief: { fact: "덮개 밑에는 손발이 묶이지 않은 시신들뿐이었다. 수레꾼은 '묻어 드리는 거라니까요'를 되풀이하며 수레를 끌고 갔다. 덮개 밑에 소금 자루가 있었다", source: seen }
        miss:
          - wound: { steps: 1, cause: 시체 수레꾼의 갈고리에 팔을 긁혔다, kind: cut }
          - belief: { fact: "수레꾼이 갈고리를 휘둘렀다. 덮개는 들추지 못했다. 수레는 발전소 쪽으로 사라졌다", source: seen }
    - id: let_go
      label: 고개를 숙여 주고 수레를 보낸다
      effects:
        - belief: { fact: "싸움터에 시체 수레꾼이 와서 시신을 거둬 갔다. 공동묘지에 묻어 준다고 했다", source: seen }

- id: cc_comrade
  title: 덮개 밑의 우리 완장
  tags: [world, cannibal]
  repeatable: true
  cooldown_days: 10
  when:
    indoor: false
    in_faction: true
    segments: [dawn, morning, day]
    battle_days_lte: 2
    flags_none: [rn_closed]
  cast:
    carter: { extra: corpse_carter, label: 시체 수레꾼, adult: true }
  setup: 싸움이 지나간 자리의 끝에서 덮개 수레가 출발하려 한다. 덮개 밖으로 팔 하나가 늘어져 흔들린다. 소매에 우리 무리의 완장이 감겨 있다. {carter:이/가} 그 팔을 덮개 안으로 밀어 넣는다.
  ai_direction: 수레에는 이 구역 교전에서 죽은 우리 무리 사람이 실려 있다 (이름 없는 대원으로 둔다. 이름 있는 사람의 유해는 코드의 유해 규칙이 맡는다). 수레꾼은 공동묘지에 묻어 준다지만 수레는 발전소 목장으로 간다. 되찾아 묻으면 무리 사람들이 그 일을 기억한다. 내버려 두면 그 팔이 오래 눈에 남는다. 지킬 선 — 시신을 다루는 일은 결과와 정황으로만 그린다. 해체·도축은 그리지 않는다. 성적 착취에 주인공이 가담하는 길은 내밀지 않는다.
  choices:
    - id: reclaim
      label: 수레 앞을 막아서고, 우리 사람은 우리가 묻는다며 내려놓으라고 한다
      check: intimidate
      outcomes:
        success:
          - faction_morale: { faction: own, delta: 1 }
          - deed: { summary: 싸움터에서 시체 수레에 실린 우리 무리 사람을 되찾아 묻었다, tags: [loyalty], severity: 2, privacy: semi_private }
          - belief: { fact: "시체 수레에서 우리 무리 사람을 내려 묻었다. 수레꾼은 군말 없이 다른 시신들을 싣고 발전소 쪽으로 갔다", source: seen }
        partial:
          - deed: { summary: 시체 수레에 실린 우리 무리 사람을 되찾았다, tags: [loyalty], severity: 1, privacy: private }
          - delay: 120
          - belief: { fact: "수레꾼은 한참 실랑이한 끝에 우리 사람만 내려놓았다. 혼자 땅을 파느라 두 시간이 걸렸다", source: seen }
        miss:
          - wound: { steps: 1, cause: 시체 수레꾼과 실랑이하다 갈고리에 긁혔다, kind: cut }
          - body: { track: nerves, delta: 1 }
          - belief: { fact: "수레꾼이 갈고리를 들었다. 실랑이 끝에 수레는 우리 무리 사람을 실은 채 발전소 쪽으로 사라졌다", source: seen }
    - id: let_go
      label: 묻어 준다니 됐다며 수레를 보낸다
      effects:
        - body: { track: nerves, delta: 1 }
        - belief: { fact: "우리 무리 완장을 찬 시신이 시체 수레에 실려 갔다. 공동묘지에 묻어 준다고 했다. 덮개 밖으로 늘어진 팔이 눈에 남았다", source: seen }
