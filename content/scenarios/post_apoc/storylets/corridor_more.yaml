# 길목 공통 이야기 더 (corridor.yaml의 8편에 12편을 더한다, 사용자 결정: 장소 종류로 나눠 20편 안팎)
# - 주인 없는 땅(zone_owner [none])의 그 종류 자리(place_kinds)에서만 열린다. 특정 구역 id로 묶지 않는다
# - 같은 종류라도 구역마다 자리가 다르다 (street: 철길 둑·다리 위·골목·버스 줄·고가 위, field: 물가·묘지·다리 밑·텃밭, ruin: 신호소·매표소·사무실·창고).
#   글은 그 종류의 어느 자리에서 읽어도 말이 되게 쓰고, 지형 이름은 쓰지 않는다 ({zone})
# - 다른 무리의 사람(순찰·정찰·약탈조·무장한 무리)은 나오지 않는다. 혼자인 떠돌이·짐승·감염체 하나, 흔적·날씨·지형만
# - 결과는 길목에 맞게 작게: 물건 하나, 소리, 시간, 몸 상태 한 단계, 믿음 한 줄

- id: cr_fog_caller
  title: 안개 속에서 부르는 소리
  tags: [world]
  repeatable: true
  cooldown_days: 8
  when:
    zone_owner: [none]
    indoor: false
    place_kinds: [street]
    segments: [dawn, morning, evening]
    weather: [fog]
  cast:
    caller: { extra: road_wanderer, label: 안개 속에서 부르는 사람 }
  setup: "{zone}에 안개가 짙게 내려앉아 몇 걸음 앞도 흐리다. 어디선가 사람 목소리가 들린다. \"거기 누구 있소? 길이 어느 쪽이오?\" 목소리는 가까워졌다 멀어졌다 한다. 같은 자리를 빙빙 도는 발소리가 섞여 있다."
  variants:
    - "{zone}의 안개 속에서 쇠붙이를 두드리는 소리가 일정하게 난다. 그러다 멈추고, 쉰 목소리가 이어진다. \"아무도 없소? 물 쪽이 어디요?\" 목소리 주인은 당신이 선 데서 멀지 않다."
    - "{zone}에 안개가 껴서 길 가장자리조차 보이지 않는다. 누가 헛기침을 하고, 조심스레 휘파람을 분다. 대답을 기다리는 듯 한참 조용하다가 다시 분다."
  ai_direction: 안개 속에서 길을 잃은 떠돌이 하나다. 해칠 생각은 없고, 혼자이며, 같은 자리를 맴돌고 있다 (함정이 아니다. 다만 주인공은 처음에 모른다). 소리 내어 대답하면 그 소리가 안개 속으로 퍼진다는 것(감염체가 들을 수 있다)을 판정 전에 말한다. 길을 일러 주면 그 사람은 고마워하고, 듣는 쪽 사정도 몇 마디 묻는다. 길 소식은 주인공이 아는 것과 소문으로만 말한다.
  choices:
    - id: guide
      label: 낮은 목소리로 대답하고 소리 나는 쪽으로 길을 일러 준다
      check: survival
      outcomes:
        success:
          - relation: { who: caller, axis: trust, delta: 2 }
          - deed: { summary: "{zone}의 안개 속에서 길 잃은 떠돌이에게 길을 일러 주었다", tags: [mercy], severity: 1, privacy: semi_private }
          - belief: { fact: "{zone}의 안개 속에서 길을 잃은 떠돌이를 불러 길을 일러 주었다. 혼자 맴돌던 사람이었다", source: seen }
        partial:
          - relation: { who: caller, axis: trust, delta: 1 }
          - delay: 60
          - belief: { fact: "{zone}의 안개 속에서 길 잃은 떠돌이를 찾아 한참을 헤맸다. 겨우 만나 길을 일러 주었다", source: seen }
        miss:
          - zone_noise: 1
          - belief: { fact: "{zone}의 안개 속에서 길 잃은 사람에게 소리쳐 대답하다 서로 엇갈렸다. 내 목소리만 안개 속에 퍼졌다", source: seen }
    - id: listen
      label: 대답하지 않고 숨을 죽인 채 목소리를 가늠한다
      check: sense_danger
      outcomes:
        success:
          - belief: { fact: "{zone}의 안개 속 목소리를 오래 들었다. 혼자 길을 잃은 사람이었고, 둘레에 다른 기척은 없었다", source: seen }
        partial:
          - belief: { fact: "{zone}의 안개 속에서 누가 길을 묻고 있었다. 몇 명인지는 끝내 알 수 없었다", source: seen }
        miss:
          - body: { track: nerves, delta: 1 }
          - belief: { fact: "{zone}의 안개 속에서 들린 목소리가 사방에서 울리는 것 같았다. 안개가 걷힐 때까지 마음이 놓이지 않았다", source: seen }
    - id: move_off
      label: 목소리를 등지고 조용히 제 길을 간다
      effects:
        - belief: { fact: "{zone}의 안개 속에서 누가 길을 묻는 소리를 듣고도 대답하지 않고 지나왔다", source: seen }

- id: cr_child_stall
  title: 길가의 작은 좌판
  tags: [world]
  repeatable: true
  cooldown_days: 9
  when:
    zone_owner: [none]
    indoor: false
    place_kinds: [street]
    segments: [morning, day]
  cast:
    kid: { extra: drifter_child, label: 좌판 앞에 앉은 아이 }
  setup: "{zone}의 길가에 보자기 하나가 펼쳐져 있다. 병뚜껑, 실패, 녹슨 숟가락, 매듭지은 끈 같은 것이 줄 맞춰 놓였다. 그 뒤에 {kid:이/가} 무릎을 세우고 앉아 당신을 올려다본다. \"바꿔요. 먹을 거면 다 돼요.\""
  variants:
    - "{zone}의 길 한쪽, 넘어진 잔해 그늘에 {kid:이/가} 앉아 있다. 앞에 놓인 깡통 뚜껑 위에 잡동사니가 몇 개 올려져 있다. 당신을 보자 그것들을 손바닥으로 한 번 쓸어 정리한다. \"구경은 공짜예요.\""
    - "{zone}의 길에서 {kid:이/가} 당신 앞을 막아서듯 보자기를 펼친다. 손이 빠르다. \"테이프 있어요. 진짜 끈끈한 거.\" 아이의 눈이 당신 짐을 훑는다."
  ai_direction: 혼자 다니며 주운 것을 바꿔 사는 떠돌이 아이다. 근처에 엄마가 있다고 말하지만 사실인지는 확정하지 않는다. 좌판에서 쓸 만한 것은 효과에 적힌 것뿐이다. 아이는 빼앗기는 데 익숙해 손을 빨리 거둔다. 겁을 주면 보자기를 둘둘 말아 달아난다. 아이가 전하는 이 근처 이야기는 들은 것이라 틀릴 수 있다.
  choices:
    - id: trade
      label: 마른 식량 하나를 내고 테이프를 받는다
      effects:
        - take_item: { item: dry_ration }
        - give_item: { item: duct_tape }
        - relation: { who: kid, axis: trust, delta: 1 }
        - belief: { fact: "{zone}의 길가에서 혼자 좌판을 편 아이와 마른 식량을 테이프로 바꿨다", source: seen }
    - id: ask_where
      label: 이 물건들을 어디서 주웠는지 슬쩍 묻는다
      check: insight
      outcomes:
        success:
          - relation: { who: kid, axis: affection, delta: 1 }
          - belief: { fact: "{zone}에서 좌판을 편 아이가 물건을 어디서 줍는지 털어놓았다. 아이 말로는 이 근처 무너진 건물들이었다. 아이는 혼자인 것 같았다", source: report }
        partial:
          - belief: { fact: "{zone}에서 좌판을 편 아이에게 물건 난 곳을 물었다. 이리저리 말을 돌렸다", source: rumor }
        miss:
          - relation: { who: kid, axis: trust, delta: -1 }
          - belief: { fact: "{zone}에서 좌판을 편 아이에게 이것저것 묻자 아이가 보자기를 말아 쥐고 경계했다", source: seen }
    - id: give
      label: 바꿀 것 없이 통조림 하나를 보자기 위에 놓고 간다
      effects:
        - take_item: { item: canned_food }
        - relation: { who: kid, axis: trust, delta: 2 }
        - deed: { summary: "{zone}의 길가에서 혼자인 아이에게 통조림을 그냥 주었다", tags: [mercy], severity: 1, privacy: semi_private }
        - belief: { fact: "{zone}의 길가에서 좌판을 편 아이에게 통조림을 두고 왔다. 아이는 고맙다는 말 대신 오래 쳐다봤다", source: seen }
    - id: pass
      label: 고개를 젓고 지나간다
      effects:
        - belief: { fact: "{zone}의 길가에서 떠돌이 아이가 잡동사니 좌판을 펴 놓고 있었다", source: seen }

- id: cr_crow_carcass
  title: 까마귀가 내려앉은 자리
  tags: [world]
  repeatable: true
  cooldown_days: 7
  when:
    zone_owner: [none]
    indoor: false
    place_kinds: [street]
    segments: [dawn, morning, day]
  setup: "{zone}의 길 위에 까마귀 여럿이 내려앉아 무언가를 쪼고 있다. 다가가자 몇 마리가 날아올라 낮게 맴돈다. 짐승 한 마리가 쓰러져 있다. 노루인지 큰 개인지 알아보기 어렵다. 옆구리에 이빨 자국이 깊게 패였고, 둘레에 마른 피가 넓게 번졌다."
  variants:
    - "{zone}의 길에 고약한 냄새가 걸려 있다. 길섶 쪽으로 까마귀가 몰려 있고, 그 아래 짐승 사체가 반쯤 뜯긴 채 누웠다. 다리 하나가 이상한 쪽으로 꺾였고, 목덜미에 물린 자리가 검게 굳었다."
    - "{zone}의 길 한복판에서 까마귀 한 마리가 당신을 보고도 비키지 않는다. 그 발밑에 짐승 사체가 있다. 아직 굳지 않았다. 쓰러진 지 오래되지 않았다."
  ai_direction: 무언가에 물려 죽은 짐승이다. 물은 것이 들개인지 감염체인지는 판정 전에 확정하지 않는다 (판정으로 알아보게 한다). 감염체에게 물린 고기를 먹으면 병이 날 수 있다는 것은 판정 전에 말한다. 까마귀가 한꺼번에 날아오르면 그 소리가 멀리 퍼진다. 쓸 만한 것은 효과에 적힌 것뿐이다.
  choices:
    - id: examine
      label: 막대로 사체를 뒤집어 물린 자리를 살핀다
      check: infected_lore
      outcomes:
        success:
          - belief: { fact: "{zone}의 길에서 물려 죽은 짐승을 살폈다. 이빨 자국으로 보아 무엇이 이 길에 다니는지 짐작이 갔다", source: seen }
        partial:
          - belief: { fact: "{zone}의 길에서 물려 죽은 짐승을 봤다. 들개 짓인지 감염체 짓인지 가리지 못했다", source: seen }
        miss:
          - zone_noise: 1
          - body: { track: nerves, delta: 1 }
          - belief: { fact: "{zone}에서 짐승 사체를 뒤집다 까마귀 떼가 한꺼번에 날아올랐다. 울음소리가 길 멀리까지 번졌다", source: seen }
    - id: butcher
      label: 덜 상한 넓적다리 살을 칼로 발라낸다
      check: hunt
      outcomes:
        success:
          - give_item: { item: raw_meat }
          - belief: { fact: "{zone}의 길에 쓰러진 짐승에게서 덜 상한 살을 발라냈다", source: seen }
        partial:
          - give_item: { item: raw_meat }
          - body: { track: disease, delta: 1, chance: 0.3 }
          - belief: { fact: "{zone}의 짐승 사체에서 살을 발라냈다. 냄새가 영 개운치 않았다", source: seen }
        miss:
          - zone_noise: 1
          - belief: { fact: "{zone}의 짐승 사체는 이미 상해 먹을 데가 없었다. 칼을 대는 사이 까마귀가 시끄럽게 울어 댔다", source: seen }
    - id: leave
      label: 까마귀를 건드리지 않고 길섶으로 비켜 지나간다
      effects:
        - belief: { fact: "{zone}의 길 위에 무언가에 물려 죽은 짐승이 있었다. 까마귀가 꼬여 있었다", source: seen }

- id: cr_drum_fire
  title: 드럼통 불가의 노인
  tags: [world]
  repeatable: true
  cooldown_days: 6
  when:
    zone_owner: [none]
    indoor: false
    place_kinds: [street]
    segments: [evening, night, dawn]
    weather: [cold_snap, snow]
  cast:
    elder: { extra: drifter_elder, label: 드럼통 불에 손을 쬐는 노인 }
  setup: "{zone}의 바람 그늘에 구멍 뚫린 드럼통 하나가 놓였고, 그 안에서 불이 낮게 탄다. {elder:이/가} 장갑 낀 손을 불 위에 펴 들고 서 있다. 당신을 보더니 한 걸음 옆으로 비켜선다. \"쬐고 가요. 나무는 내 거니까 아껴 쓰고.\""
  variants:
    - "{zone}에 살을 에는 바람이 분다. 저만치 드럼통에서 불빛이 깜박인다. {elder:이/가} 그 곁에 쪼그려 앉아 부러진 의자 다리를 하나씩 집어넣고 있다. 불이 작다. 노인이 당신 쪽을 보지 않고 말한다. \"땔감 있으면 같이 쓰지.\""
    - "{zone}의 길가 드럼통에서 연기가 비스듬히 오른다. {elder:이/가} 불가에 서서 두 손을 겨드랑이에 끼우고 발을 구른다. 얼음 낀 수염 사이로 김이 나온다. 당신이 다가가자 고개만 까딱한다."
  ai_direction: 혼자 다니는 늙은 떠돌이가 추위를 피하려 드럼통에 불을 피웠다. 땔감은 거의 다 떨어졌다. 불을 나누는 것에 인색하지 않지만 빼앗으려 들면 막대기를 쥔다 (이야기는 사람을 죽이지 않는다). 노인은 이 근방 길과 날씨에 밝고, 들은 이야기도 몇 가지 안다 (주인공의 믿음에 있는 것과 소문으로만 말한다).
  choices:
    - id: feed_fire
      label: 지닌 땔감을 드럼통에 넣어 불을 키운다
      when: { has_items: [firewood] }
      effects:
        - light_fire: { item: firewood }
        - body: { track: cold, delta: -1 }
        - relation: { who: elder, axis: affection, delta: 2 }
        - belief: { fact: "{zone}의 드럼통 불가에서 늙은 떠돌이와 땔감을 나눠 불을 쬐었다", source: seen }
    - id: talk
      label: 손을 쬐며 노인에게 요즘 이 길 사정을 묻는다
      check: insight
      outcomes:
        success:
          - body: { track: cold, delta: -1 }
          - relation: { who: elder, axis: trust, delta: 1 }
          - belief: { fact: "{zone}의 드럼통 불가에서 늙은 떠돌이에게 이 근방 길 이야기를 들었다. 겪은 것과 들은 것을 가려 말하는 사람이었다", source: report }
        partial:
          - body: { track: cold, delta: -1 }
          - belief: { fact: "{zone}의 불가에서 만난 늙은 떠돌이가 이런저런 길 소문을 늘어놓았다. 얼마나 맞는지는 모르겠다", source: rumor }
        miss:
          - belief: { fact: "{zone}의 불가에서 노인에게 이것저것 묻자 노인이 입을 닫았다. 불만 잠깐 쬐고 일어섰다", source: seen }
    - id: warm_quietly
      label: 말없이 불가에 끼어 서서 언 손을 녹인다
      effects:
        - body: { track: cold, delta: -1 }
        - delay: 30
        - belief: { fact: "{zone}의 길가 드럼통 불에 늙은 떠돌이와 나란히 서서 손을 녹였다", source: seen }
    - id: pass_by
      label: 불빛을 지나쳐 서둘러 간다
      effects:
        - body: { track: cold, delta: 1, chance: 0.5 }
        - belief: { fact: "{zone}의 길가에서 늙은 떠돌이가 드럼통에 불을 피우고 있었다. 들르지 않고 지나왔다", source: seen }

- id: cr_rising_water
  title: 불어나는 흙탕물
  fright_tags: [water]
  tags: [world]
  repeatable: true
  cooldown_days: 6
  when:
    zone_owner: [none]
    indoor: false
    place_kinds: [field]
    segments: [morning, day, evening]
    weather: [rain]
  setup: "{zone}에 비가 퍼붓는다. 낮은 자리로 흙탕물이 몰려들어 발목에서 정강이까지 금세 차오른다. 떠밀려 온 나뭇가지와 비닐이 발에 감긴다. 몇 걸음 앞, 물살에 걸린 잔가지 사이에 비닐로 꽁꽁 싼 꾸러미 하나가 들썩인다."
  variants:
    - "{zone}의 땅이 빗물을 다 받지 못해 도랑이 넘친다. 누런 물이 소리를 내며 낮은 쪽으로 흐르고, 발 디딜 데가 점점 줄어든다. 건너편 높은 자리까지는 멀지 않지만 그 사이가 이미 물길이 됐다."
    - "{zone}에서 빗소리가 다른 소리를 다 덮는다. 고였던 물웅덩이가 서로 이어져 흙탕물 줄기가 됐다. 물살 가운데에 무언가 걸려 있다. 비닐에 싼 꾸러미다."
  ai_direction: 큰비에 낮은 자리로 물이 몰려 잠깐 물길이 생겼다. 깊지는 않지만 물살이 세고 바닥이 미끄럽다. 물에 들어가면 옷이 젖고, 미끄러지면 떠밀려 부딪힐 수 있다는 것을 판정 전에 말한다. 꾸러미 안에 든 것은 효과에 적힌 것뿐이다. 높은 데서 비가 잦아들기를 기다릴 수도 있다.
  choices:
    - id: grab
      label: 물살에 들어가 꾸러미를 건져 낸다
      check: athletics
      outcomes:
        success:
          - give_item: { item: dry_ration }
          - soak: true
          - belief: { fact: "{zone}에서 불어난 흙탕물에 들어가 떠내려 온 꾸러미를 건졌다. 비닐 안에 마른 식량이 들어 있었다", source: seen }
        partial:
          - give_item: { item: dry_ration }
          - soak: true
          - body: { track: cold, delta: 1 }
          - belief: { fact: "{zone}의 흙탕물에서 꾸러미를 건졌지만 허리까지 젖어 몸이 떨렸다", source: seen }
        miss:
          - soak: true
          - wound: { steps: 1, cause: 불어난 흙탕물에 미끄러져 떠밀리다 돌에 부딪혔다, kind: blunt }
          - belief: { fact: "{zone}에서 흙탕물에 들어갔다가 미끄러져 떠밀렸다. 꾸러미는 물살에 떠내려갔다", source: seen }
    - id: cross
      label: 물이 더 차기 전에 건너편 높은 데로 건너간다
      check: athletics
      outcomes:
        success:
          - belief: { fact: "{zone}에서 물이 불어나기 전에 높은 자리로 건너갔다", source: seen }
        partial:
          - soak: true
          - belief: { fact: "{zone}의 흙탕물을 건너다 무릎까지 빠졌다. 옷이 흠뻑 젖었다", source: seen }
        miss:
          - soak: true
          - wound: { steps: 1, cause: 흙탕물을 건너다 미끄러져 넘어졌다, kind: blunt }
          - belief: { fact: "{zone}의 흙탕물을 건너다 미끄러져 넘어졌다", source: seen }
    - id: wait_high
      label: 가까운 높은 자리에 올라 비가 잦아들기를 기다린다
      effects:
        - delay: 120
        - body: { track: cold, delta: 1, chance: 0.5 }
        - belief: { fact: "{zone}에 큰비로 물이 불어 한참을 높은 데서 기다렸다. 낮은 자리는 비가 오면 물길이 된다", source: seen }

- id: cr_wild_forage
  title: 길섶의 푸성귀
  tags: [world]
  repeatable: true
  cooldown_days: 7
  when:
    zone_owner: [none]
    indoor: false
    place_kinds: [field]
    segments: [morning, day]
    seasons: [spring, summer, autumn]
  setup: "{zone:은/는} 사람 발길이 뜸해 풀이 제멋대로 자랐다. 그늘진 흙에 먹을 만한 잎이 무리 지어 났고, 썩은 나무 둥치에 버섯이 몇 송이 돋았다. 비슷하게 생긴 것들이 섞여 있다. 하나는 먹을 것이고, 하나는 배를 뒤집어 놓을 것이다."
  variants:
    - "{zone}의 축축한 땅에 연한 잎이 올라왔다. 누가 먼저 뜯어 간 자리가 군데군데 보이지만 아직 남은 것이 많다. 그 사이에 잎맥이 조금 다른 풀이 섞였다."
    - "{zone:을/를} 지나다 발밑에서 풋내가 훅 올라온다. 밟힌 풀 사이로 먹을 수 있는 잎이 보인다. 그 옆 그늘에는 갓이 넓은 버섯이 몇 송이 섰다."
  ai_direction: 주인 없는 땅이라 들풀과 버섯이 그대로 남았다. 먹을 것과 닮은 독초가 섞여 있다는 것을 판정 전에 말한다 (잘못 고르면 배앓이가 난다). 거둔 양은 효과에 적힌 것뿐이다. 이 일로 다른 사람이 나타나지 않는다.
  choices:
    - id: forage
      label: 하나하나 잎맥과 냄새를 가려 가며 뜯는다
      check: survival
      outcomes:
        success:
          - give_item: { item: wild_greens, quantity: 2 }
          - give_item: { item: mushroom }
          - belief: { fact: "{zone}에서 먹을 수 있는 들풀과 버섯을 가려 뜯었다. 사람 손이 덜 탄 자리다", source: seen }
        partial:
          - give_item: { item: wild_greens }
          - belief: { fact: "{zone}에서 들풀을 조금 뜯었다. 버섯은 헷갈려서 두고 왔다", source: seen }
        miss:
          - give_item: { item: wild_greens }
          - body: { track: disease, delta: 1, chance: 0.5 }
          - belief: { fact: "{zone}에서 뜯은 잎을 맛보다 쓴맛에 뱉었다. 속이 뒤틀리기 시작했다", source: seen }
    - id: quick
      label: 눈에 익은 잎만 한 줌 뜯고 바로 일어선다
      effects:
        - give_item: { item: wild_greens }
        - belief: { fact: "{zone}의 길섶에서 눈에 익은 들풀을 한 줌 뜯었다", source: seen }
    - id: leave
      label: 잘 모르는 풀은 손대지 않는다
      effects:
        - belief: { fact: "{zone}에 들풀과 버섯이 자라 있었다. 먹을 것과 독초가 섞여 있어 손대지 않았다", source: seen }

- id: cr_snared_dog
  title: 올무에 걸린 개
  fright_tags: [dog]
  tags: [world]
  repeatable: true
  cooldown_days: 12
  weight: 0.7
  when:
    zone_owner: [none]
    indoor: false
    place_kinds: [field]
    segments: [morning, day, evening]
    animal_companion: false
  cast:
    dog: { extra: road_dog, label: 올무에 걸린 개 }
  setup: "{zone}의 풀숲에서 낑낑대는 소리가 난다. 개 한 마리가 뒷다리에 철사 올무가 감긴 채 엎드려 있다. 몸부림칠수록 철사가 더 조여 털 사이로 피가 비친다. 당신을 보자 이빨을 드러내고 으르렁거리지만, 꼬리는 땅에 붙어 있다."
  variants:
    - "{zone}에서 무언가 풀을 짓이기며 버둥거린다. 다가가 보니 개 한 마리가 나무 밑동에 매인 철사 올무에 걸렸다. 지쳤는지 이제는 짖지도 않고 숨만 몰아쉰다. 당신과 눈이 마주치자 귀를 납작 눕힌다."
    - "{zone}의 덤불 아래에서 쇠줄 끌리는 소리가 난다. 철사 올무에 앞발이 걸린 개다. 누가 짐승을 잡으려고 놓은 것이다. 개는 당신을 노려보다가, 다시 철사를 물어뜯는다."
  ai_direction: 누가 짐승을 잡으려고 놓은 올무에 떠돌이 개가 걸렸다. 올무 주인은 지금 여기 없다 (나타나지 않는다). 개는 겁에 질려 손을 대면 물 수 있다는 것을 판정 전에 말한다. 풀어 주고 먹을 것을 주면 따라붙을 수 있다. 쫓거나 그대로 두어도 이야기는 개를 죽이지 않는다.
  choices:
    - id: calm_free
      label: 낮은 목소리로 달래며 다가가 철사를 푼다
      check: taming
      outcomes:
        success:
          - companion_join: { who: dog, kind: animal }
          - deed: { summary: "{zone}에서 올무에 걸린 개를 풀어 주었다", tags: [mercy], severity: 1, privacy: private }
          - belief: { fact: "{zone}에서 올무에 걸린 개를 달래 풀어 주었다. 개가 곁을 떠나지 않았다", source: seen }
        partial:
          - threat_passes: true
          - deed: { summary: "{zone}에서 올무에 걸린 개를 풀어 주었다", tags: [mercy], severity: 1, privacy: private }
          - belief: { fact: "{zone}에서 올무에 걸린 개를 풀어 주었다. 개는 절뚝이며 덤불 속으로 달아났다", source: seen }
        miss:
          - wound: { steps: 1, cause: 올무에 걸린 개를 풀어 주려다 손을 물렸다, kind: bite }
          - belief: { fact: "{zone}에서 올무에 걸린 개를 풀어 주려다 손을 물렸다", source: seen }
    - id: cut_and_back
      label: 막대로 올무 매듭을 끊어 주고 얼른 물러선다
      check: improvise
      outcomes:
        success:
          - threat_passes: true
          - deed: { summary: "{zone}에서 올무에 걸린 개를 풀어 주었다", tags: [mercy], severity: 1, privacy: private }
          - belief: { fact: "{zone}에서 막대로 올무를 끊어 개를 풀어 주었다. 개는 한 번 돌아보고 사라졌다", source: seen }
        partial:
          - threat_passes: true
          - delay: 30
          - belief: { fact: "{zone}에서 한참 씨름한 끝에 올무를 끊었다. 개는 절뚝이며 달아났다", source: seen }
        miss:
          - belief: { fact: "{zone}에서 올무를 끊으려 했지만 철사가 질겨 끊지 못했다. 개는 계속 낑낑댔다", source: seen }
    - id: leave
      label: 남의 올무다. 그대로 두고 간다
      effects:
        - belief: { fact: "{zone}의 풀숲에 누가 놓은 올무가 있다. 떠돌이 개 한 마리가 걸려 있었다", source: seen }

- id: cr_dug_grave
  title: 파헤쳐진 흙무덤
  tags: [world]
  repeatable: true
  cooldown_days: 9
  when:
    zone_owner: [none]
    indoor: false
    place_kinds: [field]
    segments: [evening, night]
  setup: "{zone}의 땅 한쪽에 흙무덤 하나가 파헤쳐져 있다. 머리맡에 꽂은 나무 막대에는 칼로 새긴 글자가 있었지만 다 닳아 읽을 수 없다. 흙이 사방으로 흩어졌고, 그 아래로 천에 싼 것이 드러났다. 어둠 속에서 흙구덩이 안이 유난히 검다."
  variants:
    - "{zone:을/를} 지나다 발에 무언가 걸린다. 얕게 묻은 무덤의 흙이 무너져 내렸고, 둘레에 발자국과 긁힌 자국이 어지럽다. 천 자락이 흙 밖으로 비죽 나와 바람에 펄럭인다."
    - "{zone}의 어스름 속에 돌 몇 개가 동그랗게 놓인 자리가 있다. 누가 사람을 묻은 자리다. 가운데 흙이 움푹 파였다. 무언가 판 것이다."
  ai_direction: 떠돌이 누군가가 길에서 죽은 사람을 얕게 묻은 자리다. 판 것은 짐승이고, 묻힌 사람은 되살아나지 않는다 (판정 전에는 확정하지 않는다. 판정으로 가늠하게 한다). 묻힌 사람이 누구인지는 지어내지 않는다. 무덤을 뒤지면 쓸 만한 것은 효과에 적힌 것뿐이다. 다시 덮어 주면 시간이 든다.
  choices:
    - id: rebury
      label: 흙을 다시 덮고 돌을 얹어 준다
      effects:
        - delay: 60
        - deed: { summary: "{zone}에서 파헤쳐진 무덤을 다시 덮어 주었다", tags: [mercy], severity: 1, privacy: private }
        - belief: { fact: "{zone}에서 짐승이 파헤친 무덤을 다시 덮고 돌을 얹었다. 누구의 무덤인지는 모른다", source: seen }
    - id: read_marks
      label: 긁힌 자국을 들여다보며 무엇이 팠는지 가늠한다
      check: infected_lore
      outcomes:
        success:
          - belief: { fact: "{zone}의 무덤을 판 것은 짐승이었다. 발톱 자국이 밖에서 안으로 나 있었다", source: seen }
        partial:
          - body: { track: nerves, delta: 1 }
          - belief: { fact: "{zone}의 파헤쳐진 무덤을 살폈다. 무엇이 팠는지는 어두워서 다 알아보지 못했다", source: seen }
        miss:
          - body: { track: nerves, delta: 1 }
          - belief: { fact: "{zone}의 파헤쳐진 무덤을 들여다보다 뒷걸음질쳤다. 흙 속에서 무언가 기어 나온 것만 같았다", source: rumor }
    - id: search
      label: 천 자락을 들추고 묻힌 이의 소지품을 뒤진다
      check: scavenge
      outcomes:
        success:
          - give_item: { item: faded_photo }
          - deed: { summary: "{zone}에서 파헤쳐진 무덤을 뒤졌다", tags: [selfishness], severity: 1, privacy: private }
          - belief: { fact: "{zone}의 파헤쳐진 무덤에서 빛바랜 사진 한 장을 꺼냈다", source: seen }
        partial:
          - body: { track: nerves, delta: 1 }
          - deed: { summary: "{zone}에서 파헤쳐진 무덤을 뒤졌다", tags: [selfishness], severity: 1, privacy: private }
          - belief: { fact: "{zone}의 무덤을 뒤졌지만 남은 것이 없었다. 냄새가 오래 따라왔다", source: seen }
        miss:
          - body: { track: disease, delta: 1, chance: 0.5 }
          - belief: { fact: "{zone}의 무덤을 뒤지다 썩은 천에 손을 댔다. 손을 몇 번이나 문질러 닦았다", source: seen }
    - id: pass
      label: 눈을 돌리고 걸음을 서두른다
      effects:
        - belief: { fact: "{zone}에 짐승이 파헤친 무덤이 있었다", source: seen }

- id: cr_dead_engine
  title: 공터에 버려진 기계
  tags: [world]
  repeatable: true
  cooldown_days: 8
  when:
    zone_owner: [none]
    indoor: false
    place_kinds: [yard]
    segments: [morning, day, evening]
  setup: "{zone}의 공터 한쪽에 엔진 달린 기계 하나가 주저앉아 있다. 누가 끌고 오다 버린 것이다. 바퀴는 빠졌고 덮개는 녹이 슬어 들떴다. 연료통 마개 둘레에 기름 얼룩이 아직 번들거린다. 흔들면 안에서 출렁이는 소리가 날지도 모른다."
  variants:
    - "{zone}의 공터 가장자리에 녹슨 발전기 하나가 엎어져 있다. 끌린 자국이 공터 밖으로 이어지다 끊겼다. 누가 무거워서 버리고 간 모양이다. 엔진 덮개 나사가 몇 개 풀려 있다."
    - "{zone}의 공터에 바퀴 빠진 기계가 잡초에 반쯤 묻혔다. 비에 씻긴 쇠 몸통에 누가 분필로 가위표를 그어 놓았다. 다 털었다는 뜻인지, 건드리지 말라는 뜻인지 알 수 없다."
  ai_direction: 주인 없는 공터에 버려진 기계다. 연료가 조금 남았을 수 있고, 쓸 만한 쇠붙이가 붙어 있다. 녹슨 쇠를 비틀고 두드리면 쇳소리가 멀리 퍼지고(감염체가 들을 수 있다), 녹슨 날에 손을 벨 수 있다는 것을 판정 전에 말한다. 얻는 것은 효과에 적힌 것뿐이다.
  choices:
    - id: drain
      label: 연료통 마개를 비틀어 남은 기름을 병에 받는다
      check: mechanics
      outcomes:
        success:
          - give_item: { item: fuel_bottle }
          - belief: { fact: "{zone}의 공터에 버려진 기계에서 남은 연료를 받아 냈다", source: seen }
        partial:
          - give_item: { item: fuel_bottle }
          - zone_noise: 1
          - belief: { fact: "{zone}의 버려진 기계에서 연료를 받아 냈다. 마개를 비틀다 쇳소리가 크게 났다", source: seen }
        miss:
          - wound: { steps: 1, cause: 녹슨 기계 덮개를 비틀다 손을 베였다, kind: cut }
          - belief: { fact: "{zone}의 버려진 기계는 연료통이 말라 있었다. 덮개를 비틀다 손만 베였다", source: seen }
    - id: strip
      label: 떼어 갈 만한 쇠붙이와 부품을 뜯어낸다
      check: scavenge
      outcomes:
        success:
          - give_item: { item: scrap_metal }
          - give_item: { item: wire_roll }
          - belief: { fact: "{zone}의 버려진 기계에서 쇠붙이와 전선을 뜯어냈다", source: seen }
        partial:
          - give_item: { item: scrap_metal }
          - zone_noise: 1
          - belief: { fact: "{zone}의 버려진 기계에서 쇠붙이를 떼어 냈다. 두드리는 소리가 공터에 울렸다", source: seen }
        miss:
          - zone_noise: 1
          - belief: { fact: "{zone}의 버려진 기계를 뜯다 쓸 만한 것도 못 건지고 쇳소리만 냈다", source: seen }
    - id: leave
      label: 시끄러워질 일은 하지 않는다. 지나간다
      effects:
        - belief: { fact: "{zone}의 공터에 누가 버린 엔진 달린 기계가 있다. 연료가 남았는지는 모른다", source: seen }

- id: cr_scratching_door
  title: 문 너머의 긁는 소리
  fright: 1
  fright_tags: [infected, enclosed]
  tags: [world]
  repeatable: true
  cooldown_days: 8
  when:
    zone_owner: [none]
    indoor: true
    place_kinds: [ruin]
    segments: [evening, night]
  cast:
    biter: { extra: infected_fresh, label: 문 너머의 감염체 }
  setup: "{zone}의 무너진 건물 안, 안쪽 문 하나가 의자로 괴어 닫혀 있다. 그 너머에서 손톱으로 나무를 긁는 소리가 난다. 멈췄다가, 다시 긁는다. 문틈 아래로 퀴퀴한 냄새가 새어 나온다. 누가 무언가를 저 안에 가둬 두고 떠났다."
  variants:
    - "{zone}의 건물 안이 어둡다. 구석 쪽 문에 판자 두 장이 엇갈려 못 박혀 있고, 판자 위에 숯으로 \"열지 마\"라고 적혔다. 당신의 발소리에 문 너머에서 무언가가 쿵 부딪힌다."
    - "{zone}의 건물 안쪽에서 쇠사슬이 철컥거린다. 손잡이에 감은 사슬이 문을 겨우 붙들고 있다. 문이 한 뼘쯤 열렸다 닫혔다 하고, 그 틈으로 잿빛 손가락이 비죽 나왔다 들어간다."
  ai_direction: 누가 감염체가 된 사람을 방에 가두고 떠났다. 감염체는 하나이고 막 변해 아직 힘이 세다. 문을 열면 곧장 덤벼든다. 맞붙으면 배역을 target·opponent로 두고 위험(할퀴거나 물리면 감염)을 판정 전에 선언한다. 문은 오래 버티지 못한다. 갇힌 사람이 누구였는지는 지어내지 않는다.
  choices:
    - id: open_and_end
      label: 의자를 걷어차고 문이 열리는 순간 내리친다
      check: fight
      outcomes:
        success:
          - put_down: { who: biter }
          - deed: { summary: "{zone}의 건물에 갇혀 있던 감염체를 처리했다", tags: [bravery], severity: 1, privacy: private }
          - belief: { fact: "{zone}의 무너진 건물 안에 누가 가둬 둔 감염체가 있었다. 문을 열자마자 처리했다", source: seen }
        partial:
          - put_down: { who: biter }
          - body: { track: nerves, delta: 1 }
          - belief: { fact: "{zone}의 건물에 갇혀 있던 감염체를 처리했다. 문짝째 덮쳐 와 하마터면 깔릴 뻔했다", source: seen }
        miss:
          - zone_noise: 1
          - wound: { steps: 1, cause: 문을 밀치고 나온 감염체에 떠밀려 넘어졌다, kind: blunt }
          - belief: { fact: "{zone}의 건물에서 문을 열자 감염체가 덮쳐 왔다. 넘어진 채 한참을 뒹굴었다", source: seen }
    - id: shore_up
      label: 무너진 가구를 끌어와 문을 더 단단히 막는다
      check: carpentry
      outcomes:
        success:
          - threat_passes: true
          - belief: { fact: "{zone}의 무너진 건물 안에 감염체가 갇힌 방이 있다. 문을 더 단단히 막아 두었다", source: seen }
        partial:
          - threat_passes: true
          - delay: 30
          - belief: { fact: "{zone}의 건물 안 감염체가 갇힌 문을 겨우 다시 막았다. 오래 버틸지는 모르겠다", source: seen }
        miss:
          - zone_noise: 1
          - belief: { fact: "{zone}의 건물에서 가구를 끌다 소리가 크게 났다. 문 너머의 것이 더 사납게 부딪혀 왔다", source: seen }
    - id: back_out
      label: 발소리를 죽이고 건물 밖으로 물러난다
      check: stealth
      outcomes:
        success:
          - threat_passes: true
          - belief: { fact: "{zone}의 무너진 건물 안에 감염체가 갇힌 방이 있다. 소리 없이 물러 나왔다", source: seen }
        partial:
          - threat_passes: true
          - body: { track: nerves, delta: 1 }
          - belief: { fact: "{zone}의 건물에서 물러 나오는 내내 문 긁는 소리가 등 뒤를 따라왔다", source: seen }
        miss:
          - belief: { fact: "{zone}의 건물에서 물러나다 무언가를 걷어찼다. 문 너머의 것이 문짝을 들이받기 시작했다", source: seen }

- id: cr_roof_leak
  title: 새는 지붕 아래
  tags: [world]
  repeatable: true
  cooldown_days: 6
  when:
    zone_owner: [none]
    indoor: true
    place_kinds: [ruin]
    segments: [morning, day, evening, night]
    weather: [rain]
  setup: "{zone}의 무너진 건물 안으로 빗소리가 가득 찬다. 천장 틈 몇 군데로 빗물이 줄줄 새어 바닥에 웅덩이를 만든다. 마른 자리는 벽 쪽 한 뼘뿐이다. 빗소리가 커서 바깥 소리도, 안의 소리도 묻힌다."
  variants:
    - "{zone}의 건물 안에서 빗물이 똑똑 떨어지는 소리가 사방에서 난다. 누가 받쳐 둔 찌그러진 냄비 하나에 빗물이 반쯤 찼다. 젖은 벽에서 곰팡내가 올라온다."
    - "{zone}에 비가 그칠 기미가 없다. 건물 안 깨진 창으로 비가 들이치고, 바닥의 먼지가 진흙이 되어 간다. 지붕이 남은 안쪽 구석만 아직 말라 있다."
  ai_direction: 비를 피해 들어온 빈 건물이다. 아무도 없다. 빗물을 받아 둘 수 있지만 녹슨 지붕을 타고 온 물이라 끓여야 한다. 빗소리가 소리를 덮어 뒤지기 좋지만, 젖어 삭은 선반과 천장은 무너질 수 있다는 것을 판정 전에 말한다. 얻는 것은 효과에 적힌 것뿐이다.
  choices:
    - id: catch_rain
      label: 빈 병을 빗물 떨어지는 자리에 받쳐 채운다
      effects:
        - take_item: { item: empty_bottle }
        - give_item: { item: dirty_water }
        - delay: 30
        - belief: { fact: "{zone}의 무너진 건물에서 새는 빗물을 병에 받았다. 녹물 맛이 나서 끓여야 한다", source: seen }
    - id: rest
      label: 마른 구석에 등을 붙이고 비가 잦아들기를 기다린다
      effects:
        - delay: 120
        - body: { track: fatigue, delta: -1 }
        - belief: { fact: "{zone}의 무너진 건물 안 마른 구석에서 비가 잦아들기를 기다리며 쉬었다", source: seen }
    - id: search_under_rain
      label: 빗소리에 기대어 건물 안쪽을 뒤진다
      check: scavenge
      outcomes:
        success:
          - give_item: { item: cloth }
          - give_item: { item: canned_food }
          - belief: { fact: "{zone}의 건물 안쪽을 빗소리에 묻어 뒤졌다. 천과 통조림 하나가 나왔다", source: seen }
        partial:
          - give_item: { item: cloth }
          - belief: { fact: "{zone}의 건물 안쪽을 뒤졌다. 젖지 않은 천 쪼가리만 건졌다", source: seen }
        miss:
          - wound: { steps: 1, cause: 젖어 삭은 선반이 무너져 내려 깔렸다, kind: blunt }
          - belief: { fact: "{zone}의 건물 안쪽을 뒤지다 삭은 선반이 무너져 내렸다", source: seen }

- id: cr_road_cairn
  title: 길 어귀의 돌탑
  tags: [world]
  repeatable: true
  cooldown_days: 10
  weight: 0.8
  when:
    zone_owner: [none]
    indoor: false
    place_kinds: [road]
    segments: [morning, day, evening]
  setup: "{zone:으로/로} 드는 길 어귀에 무릎 높이의 돌탑이 서 있다. 돌 틈마다 작은 것들이 끼워졌다. 머리핀, 단추, 녹슨 열쇠, 접은 종이, 담배 한 개비. 오가는 사람들이 이 길을 무사히 지나게 해 달라고 하나씩 얹고 간 것이다. 맨 위의 돌은 아직 흙이 묻어 있다."
  variants:
    - "{zone}의 길 어귀, 길섶에 납작한 돌을 포개 쌓은 탑이 몇 개 서 있다. 하나는 무너져 돌이 흩어졌다. 남은 탑 꼭대기에 누가 담배 한 개비를 올려놓았다. 비에 젖지 않게 깡통 뚜껑을 덮어서."
    - "{zone:으로/로} 이어지는 길가에 돌무더기가 있고, 꽂힌 막대에 색 바랜 천 조각이 여럿 묶여 바람에 날린다. 돌 사이에 누군가의 이름을 쓴 쪽지가 끼워져 있다."
  ai_direction: 이 길을 오가는 떠돌이와 피난민이 무사히 건너기를 빌며 쌓은 돌탑이다. 누가 쌓았는지, 쪽지에 적힌 이름이 누구인지는 지어내지 않는다. 돌탑에서 담배를 가져가도 벌은 없다. 다만 주인공 마음이 어떨지는 주인공의 몫이다. 돌탑을 무너뜨리면 다음에 지나는 사람이 본다.
  choices:
    - id: add_stone
      label: 돌 하나를 주워 탑 위에 조심스레 얹는다
      effects:
        - body: { track: nerves, delta: -1 }
        - belief: { fact: "{zone:으로/로} 드는 길 어귀의 돌탑에 돌 하나를 얹고 지나왔다", source: seen }
    - id: offer
      label: 담배 한 개비를 돌 틈에 끼워 두고 간다
      effects:
        - take_item: { item: cigarettes }
        - body: { track: nerves, delta: -1 }
        - deed: { summary: "{zone}의 길 어귀 돌탑에 담배를 얹고 갔다", tags: [mercy], severity: 1, privacy: private }
        - belief: { fact: "{zone}의 길 어귀 돌탑에 담배 한 개비를 끼워 두었다. 누가 가져가 피우든 그것도 괜찮다", source: seen }
    - id: take
      label: 꼭대기의 담배를 집어 주머니에 넣는다
      effects:
        - give_item: { item: cigarettes }
        - deed: { summary: "{zone}의 길 어귀 돌탑에서 남이 얹어 둔 담배를 가져갔다", tags: [selfishness], severity: 1, privacy: private }
        - belief: { fact: "{zone}의 길 어귀 돌탑에서 담배 한 개비를 가져왔다", source: seen }
    - id: pass
      label: 흘끗 보고 지나간다
      effects:
        - belief: { fact: "{zone:으로/로} 드는 길 어귀에 오가는 사람들이 쌓은 돌탑이 있다", source: seen }
