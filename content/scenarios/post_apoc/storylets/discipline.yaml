# 규율 회의 (12-257, 공통 규칙 3): 우리 무리 사람이 본 무거운 짓(시나리오 offense: 도둑질·잔혹·배신, 무게 2 이상)이 있으면
# 사흘 안에 꼭 열린다. 무리마다 문화(culture.punishment)에 맞는 벌. 받아들이면 벌을 받고, 변명은 설득 판정, 대들면 처음엔 경고,
# 거듭 대들면 내보낸다 (PT15 졸병: 간부가 본 앞에서 도둑질·폭행을 했는데 사흘 동안 아무 일도 없었다)

- id: disc_a_council
  title: 형제단의 규율 회의
  tags: [world]
  essential: true
  wakes: false
  repeatable: true
  cooldown_days: 0
  when:
    indoor: true
    factions: [faction_a]
    zone_owner: [own]
    own_offense: true
    # 상관이 불러 간다: 어느 장소에서든 열리고 글의 장소로 옮긴다 (12-260)
    summons: true
    # 불려 가는 자리 (이동 기획: 부르는 이야기만 주인공을 옮긴다. 장소 하나로 정해 둔다, PT22·PT23 섬)
    zones: [a_base]
    places: [staff_room]
  cast:
    boss: { commander: true }
  setup: "{boss:이/가} 당신을 부른다. \"본 사람이 있다. 형제단에서 그런 짓은 그냥 넘어가지 않아.\" 교무실 문이 닫히고, 다른 간부 하나가 팔짱을 낀 채 벽에 기대 선다."
  ai_direction: 청솔형제단은 배급을 줄이고 보초를 더 세운다. 무거우면 회의에 올리고, 원칙을 어긴 사람은 내보낸다. {boss:은/는} 화를 내기보다 실망한 얼굴이다. 무엇을 했는지는 상태의 행적대로만 말한다.
  choices:
    - id: accept
      label: 잘못을 인정하고 벌을 받는다
      effects:
        - return_stolen: true
        - body: { track: hunger, delta: 1 }
        - merit: -1
        - relation: { who: boss, axis: trust, delta: 1, kind: verdict_accepted }
    - id: excuse
      label: 사정을 설명한다
      check: persuade
      outcomes:
        success:
          - relation: { who: boss, axis: respect, delta: 1 }
        partial:
          - body: { track: hunger, delta: 1 }
        miss:
          - capture_player: { by: own, days: 1 }
          - merit: -1
          - relation: { who: boss, axis: trust, delta: -1 }
    - id: defy
      label: 대든다
      when: { flags_none: [disc_a_warned] }
      effects:
        - set_flag: disc_a_warned
        - merit: -2
        - relation: { who: boss, axis: trust, delta: -2 }
    - id: defy_again
      label: 또 대든다
      when: { flags_all: [disc_a_warned] }
      effects:
        - expel: true

- id: disc_b_council
