      label: 고개를 숙이고 본보기가 된다
      effects:
        - return_stolen: true
        - capture_player: { by: own, days: 1 }
        - merit: -1
        - relation: { who: boss, axis: respect, delta: 1, kind: verdict_accepted }
    - id: excuse
      label: 사정을 설명한다
      check: persuade
      outcomes:
        success:
          - merit: -1
        partial:
          - body: { track: hunger, delta: 1 }
          - merit: -1
        miss:
          - capture_player: { by: own, days: 2 }
          - merit: -2
          - relation: { who: boss, axis: trust, delta: -1 }
    - id: defy
      label: 대든다
      when: { flags_none: [disc_c_warned] }
      effects:
        - set_flag: disc_c_warned
        - capture_player: { by: own, days: 2 }
        - merit: -3
        - relation: { who: boss, axis: trust, delta: -2 }
    - id: defy_again
      label: 또 대든다
      when: { flags_all: [disc_c_warned] }
      effects:
        - expel: true

