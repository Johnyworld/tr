    zones: [b_base]
    places: [yard]
  cast:
    boss: { commander: true }
  setup: "놀이터 벤치에 동대표들이 모여 있다. {boss:이/가} 손짓해 당신을 앉힌다. \"말로 하자. 다들 들었으니까.\" 빨래를 널던 사람들이 손을 멈추고 이쪽을 본다."
  ai_direction: 버들마을은 회의에서 말로 따진다. 당번을 늘리거나 몫을 줄이고, 정말 심하면 단지에서 내보낸다. 이웃들의 눈이 무겁다. 무엇을 했는지는 상태의 행적대로만 말한다.
  choices:
    - id: accept
      label: 이웃들 앞에서 사과하고 몫이 줄어드는 것을 받아들인다
      effects:
        - return_stolen: true
        - body: { track: hunger, delta: 1 }
        - relation: { who: boss, axis: trust, delta: 1, kind: verdict_accepted }
    - id: excuse
      label: 사정을 설명한다
      check: persuade
      outcomes:
        success:
          - relation: { who: boss, axis: affection, delta: 1 }
        partial:
          - merit: -1
        miss:
          - body: { track: hunger, delta: 1 }
          - merit: -1
          - relation: { who: boss, axis: trust, delta: -1 }
    - id: defy
      label: 대든다
      when: { flags_none: [disc_b_warned] }
      effects:
        - set_flag: disc_b_warned
        - merit: -2
        - relation: { who: boss, axis: trust, delta: -2 }
    - id: defy_again
      label: 또 대든다
      when: { flags_all: [disc_b_warned] }
      effects:
        - expel: true

