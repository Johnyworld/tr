# 명절과 작은 즐거움 (12-132): 계절마다 우리 땅에서 열리는 날. 사기를 조금 올리고 마음을 가라앉히는 쉼표
# - tags: [world]. 무리를 가정하지 않는다 (우리 땅 own_territory: true에서만, 사기는 faction_morale own)
# - 계절 이야기는 한 해(80일)에 한 번쯤 (repeatable + cooldown_days 60). 모닥불 내기는 엿새에 한 번쯤
# - 떠돌이는 우리 땅이 없어 열리지 않는다

- id: fs_harvest
  title: 추수 잔치
  tags: [world]
  repeatable: true
  cooldown_days: 60
  when:
    indoor: false
    own_territory: true
    seasons: [autumn]
    segments: [evening]
  setup: 거두어들인 것을 창고에 넣은 날 저녁. 마당 한가운데 큰 솥이 걸리고, 누군가 감자를 통째로 불씨에 묻는다. 오늘만은 배급 그릇을 두 번 내밀어도 아무도 뭐라 하지 않는다.
  ai_direction: 일 년에 한 번 배를 채우는 밤이다. 무리 사람들이 장면에 있으면 평소와 다른 얼굴(웃음, 술주정, 오래된 노래)을 보여 준다. 다음 겨울 걱정은 내일로 미룬다.
  choices:
    - id: join
      label: 솥 앞에 끼어 앉아 함께 먹고 떠든다
      effects:
        - faction_morale: { faction: own, delta: 1 }
        - body: { track: hunger, delta: -2 }
        - body: { track: nerves, delta: -1 }
        - belief: { fact: 추수 잔치 날 무리 사람들과 한솥밥을 먹었다. 오랜만에 다들 웃었다, source: seen }
    - id: serve
      label: 국자를 잡고 사람들에게 퍼 준다
      effects:
        - faction_morale: { faction: own, delta: 1 }
        - merit: 1
        - belief: { fact: 추수 잔치 날 솥 앞에서 국을 퍼 주었다. 사람들이 이름을 불러 주었다, source: seen }
    - id: guard
      label: 다들 마음 놓은 밤이다. 담 위에서 망을 본다
      effects:
        - belief: { fact: 추수 잔치 날 밤 혼자 담 위에서 망을 봤다. 마당의 노랫소리가 늦게까지 들렸다, source: seen }

- id: fs_first_snow
  title: 첫눈
  tags: [world]
  repeatable: true
  cooldown_days: 60
  when:
    indoor: false
    own_territory: true
    seasons: [winter]
    weather: [snow]
    segments: [morning, day]
    # 첫눈은 한 번만 (바깥의 첫눈 lt_first_snow와 함께, PT20 분대장)
    flags_none: [lt_first_snow_done]
  setup: 밤새 내린 눈이 담 안을 하얗게 덮었다. 아이들이 맨손으로 눈을 뭉쳐 던지고, 어른 몇은 지붕의 눈을 쓸다 말고 그걸 내려다본다. 소리가 다 눈에 묻혀 거점이 이상하게 조용하다.
  ai_direction: 첫눈은 겨울의 시작이자 땔감 걱정의 시작이다. 그래도 오늘 아침만은 아이들의 웃음이 이긴다. 눈 위에 발자국이 남는다는 것(감염체·약탈자의 흔적)을 아는 사람은 그 생각을 한다.
  choices:
    - id: play
      label: 아이들 틈에 끼어 눈을 던진다
      effects:
        - set_flag: lt_first_snow_done
        - faction_morale: { faction: own, delta: 1 }
        - body: { track: nerves, delta: -1 }
        - soak: true
        - belief: { fact: 첫눈 오는 아침에 거점 아이들과 눈싸움을 했다. 옷이 다 젖었다, source: seen }
    - id: tracks
      label: 담 밖 눈 위의 발자국부터 살핀다
      check: survival
      effects:
        - set_flag: lt_first_snow_done
      outcomes:
        success:
          - belief: { fact: "첫눈 위에 담 밖을 맴돈 발자국이 있었다. 사람 둘, 맨발 하나. 맨발은 감염체다", source: seen }
        partial:
          - belief: { fact: 첫눈 위 담 밖에 무언가 오간 자국이 있다. 무엇인지는 모르겠다, source: seen }
        miss:
          - belief: { fact: 눈이 다시 내려 발자국이 다 덮였다, source: seen }
    - id: wood
      label: 창고의 땔감부터 세어 본다
      effects:
        - set_flag: lt_first_snow_done
        - belief: { fact: 첫눈 날 창고의 땔감을 세어 봤다. 이번 겨울이 길게 느껴졌다, source: seen }

- id: fs_sowing
  title: 씨뿌리는 날
  tags: [world]
  repeatable: true
  cooldown_days: 60
  when:
    indoor: false
    own_territory: true
    seasons: [spring]
    segments: [morning, day]
  setup: 겨우내 아껴 둔 씨앗 봉투가 처음으로 열린다. 텃밭에 줄을 띄우고, 다들 손바닥에 씨앗 몇 알씩 받아 든다. 한 알이라도 흘리면 누가 반드시 주워 든다.
  ai_direction: 씨앗은 무리의 내일이다. 씨앗을 아끼는 사람, 씨앗으로 점을 치는 사람, 붕괴 전에 농사를 지었다는 사람이 저마다 한마디씩 한다.
  choices:
    - id: sow
      label: 줄을 따라 씨앗을 넣는다
      effects:
        - faction_morale: { faction: own, delta: 1 }
        - belief: { fact: 씨뿌리는 날 텃밭에 씨앗을 넣었다. 가을에 무엇이 날지 다들 내기를 했다, source: seen }
    - id: wish
      label: 남몰래 씨앗 한 알을 따로 묻으며 소원을 빈다
      effects:
        - body: { track: nerves, delta: -1 }
        - belief: { fact: 씨뿌리는 날 남몰래 씨앗 한 알을 따로 묻고 소원을 빌었다, source: seen }

- id: fs_collapse_day
  title: 이름을 부르는 밤
  tags: [world]
  repeatable: true
  cooldown_days: 60
  when:
    indoor: false
    own_territory: true
    seasons: [summer]
    segments: [evening]
  setup: 여름 끝 무렵, 붕괴가 시작된 철이다. 해가 지자 누가 먼저랄 것 없이 마당에 초를 내놓는다. 한 사람씩 일어나 붕괴 뒤로 잃은 사람의 이름을 부른다. 대답은 없고, 다음 사람이 일어난다.
  ai_direction: 무리마다 이 밤을 부르는 이름이 다르지만 하는 일은 같다. 이름을 부르는 사람의 목소리, 끝내 일어나지 못하는 사람을 그린다. 주인공이 잃은 사람(지난 일, 가족, 유해와 무덤)이 있으면 그 이름이 떠오른다.
  choices:
    - id: call
      label: 일어나 이름을 부른다
      effects:
        - faction_morale: { faction: own, delta: 1 }
        - body: { track: nerves, delta: -1 }
        - belief: { fact: "이름을 부르는 밤, 사람들 앞에서 잃은 사람의 이름을 불렀다", source: seen }
    - id: listen
      label: 초 앞에 앉아 남들이 부르는 이름을 듣는다
      effects:
        - body: { track: nerves, delta: -1 }
        - belief: { fact: "이름을 부르는 밤, 남들이 부르는 이름을 끝까지 들었다. 아는 이름도 있었다", source: seen }

- id: fs_card_game
  title: 모닥불 내기
  tags: [world]
  repeatable: true
  cooldown_days: 6
  when:
    indoor: false
    own_territory: true
    segments: [evening, night]
    has_items: [cigarettes]
  setup: 모닥불 곁에 낡은 화투 한 벌이 펼쳐져 있다. 판돈은 담배 한 갑. 끼겠냐고 누가 턱짓을 한다.
  ai_direction: 판에 낀 사람들의 버릇(패를 보면 귀를 만지는 사람, 지면 일어나 버리는 사람)을 그린다. 판정은 속이기(허세)로, 결과의 담배는 시스템이 옮긴다.
  choices:
    - id: play
      label: 담배 한 갑을 걸고 판에 낀다
      check: deceive
      outcomes:
        success:
          - give_item: { item: cigarettes, quantity: 2 }
          - belief: { fact: 모닥불 화투판에서 허세로 담배 두 갑을 땄다, source: seen }
        partial:
          - belief: { fact: 모닥불 화투판에서 본전만 찾고 일어났다, source: seen }
        miss:
          - take_item: { item: cigarettes }
          - belief: { fact: 모닥불 화투판에서 담배 한 갑을 잃었다, source: seen }
    - id: watch
      label: 옆에서 구경만 한다
      effects:
        - body: { track: nerves, delta: -1 }
        - belief: { fact: 모닥불 화투판을 구경하며 저녁을 보냈다, source: seen }
