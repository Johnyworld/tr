# 외국인 생존자들의 이야기 (12-140). 인물은 npcs/foreigners.yaml
# - 저마다 그곳에 있을 때만 (zones), 한 판에 한 번 (반복하지 않는다)
# - 고향 소식, 제대로 불리는 이름, 이 도시에 남은 까닭이 이야기의 씨앗이다

- id: fr_daniel_name
  title: 공책에 적는 이름
  tags: [world]
  when:
    zones: [a_base]
    segments: [evening, night]
    day_gte: 2
  cast:
    daniel: { ids: [fr_daniel] }
  setup: '막사 앞 모닥불. {daniel:이/가} 꼬깃꼬깃한 공책 한 장을 내민다. "니 글씨 좋제? 여기 내 딸 이름 좀 적어 도. 영어로, 또박또박. 내가 쓰면 공장 장부 같아 보여서."'
  ai_direction: 다니엘은 라고스의 딸에게 보낼 편지를 몇 달째 쓰고 있다. 부칠 곳은 없다. 무전기로 바깥에 닿을 날을 위해 모아 둔다. 딸 이름은 아데바요 오코로. 경상도 사투리로 농담을 하다가도 딸 이야기에서는 목소리가 낮아진다.
  choices:
    - id: write
      label: 받아 들고 또박또박 적어 준다
      effects:
        - relation: { who: daniel, axis: affection, delta: 2 }
        - belief: { fact: "다니엘 오코로의 딸 이름은 아데바요다. 부칠 곳 없는 편지를 몇 달째 쓰고 있다", source: report }
    - id: radio
      label: 무전기로 바깥에 닿을 방법을 같이 찾아보자고 한다
      check: persuade
      outcomes:
        success:
          - relation: { who: daniel, axis: trust, delta: 2 }
          - belief: { fact: "다니엘과 바깥으로 닿는 무전 주파수를 같이 찾아보기로 했다. 그는 휴게소의 큰 안테나 이야기를 했다", source: report }
        partial:
          - relation: { who: daniel, axis: affection, delta: 1 }
        miss:
          - belief: { fact: "다니엘은 웃으며 됐다고 했다. 희망은 하루에 한 숟갈만 먹는 거라고", source: report }
    - id: decline
      label: 피곤하다며 막사로 들어간다
      effects: []

- id: fr_emily_broadcast
  title: 종탑의 영어 방송
  tags: [world]
  when:
    # 지붕 아래·바깥 (12-244, 공통 규칙 15)
    indoor: true
    zones: [cathedral]
    segments: [night]
  cast:
    emily: { ids: [fr_emily] }
  setup: '성당 종탑. {emily:이/가} 라디오를 무릎에 올려놓고 손짓한다. 잡음 사이로 영어 목소리가 숫자를 읽는다. "...evacuation point, south harbor. Repeat..." 그녀가 속삭인다. "또 같은 말이에요. 매일 밤 똑같아요. 똑같은 숨소리까지."'
  ai_direction: 이 영어 방송은 붕괴 첫해에 녹음된 자동 방송이다 (에밀리는 모른다). 똑같은 숨소리라는 말은 녹음이라는 단서다. 남쪽 항구 집결지 이야기는 붉은연합 교관 토머스가 들은 "남쪽 집결지 폐쇄"와 어긋난다. 한국어 무전의 숫자 읽는 여자 방송과는 다른 주파수다. 확정하지 않는다.
  choices:
    - id: listen
      label: 끝까지 같이 듣고 숫자를 받아 적는다
      check: sense_danger
      outcomes:
        success:
          - relation: { who: emily, axis: trust, delta: 1 }
          - belief: { fact: "성당 종탑에서 영어 방송을 들었다. 남쪽 항구가 구조 지점이라고 되풀이한다. 매번 같은 곳에서 같은 숨소리가 섞인다. 녹음일지도 모른다", source: seen }
        partial:
          - belief: { fact: 성당 종탑에서 남쪽 항구가 구조 지점이라는 영어 방송을 들었다, source: seen }
        miss:
          - belief: { fact: 영어 방송은 잡음에 묻혀 거의 들리지 않았다, source: seen }
    - id: doubt
      label: 그 방송을 믿지 말라고 조심스럽게 말한다
      effects:
        - relation: { who: emily, axis: affection, delta: -1 }
        - belief: { fact: "에밀리에게 영어 방송을 너무 믿지 말라고 했다. 그녀는 대답 대신 라디오를 껐다", source: seen }

- id: fr_thomas_range
  title: 사격장의 교관
  tags: [world]
  when:
    has_items_any: [old_rifle, shotgun, sawn_shotgun, pistol]
    zones: [c_base]
    segments: [morning, day]
  cast:
    thomas: { ids: [fr_thomas] }
  setup: '붉은연합 사격장. {thomas:이/가} 신병들 사이를 걷다가 당신 앞에 선다. 총을 가져가 노리쇠를 당겨 보고 혀를 찬다. "이 총, 누가 손질했어? 다시. 내가 보는 앞에서."'
  ai_direction: 토머스는 붉은연합 사격 교관이다. 원칙은 엄하지만 신병을 함부로 대하지 않는다. 목의 군번줄 두 개 중 하나는 다른 사람 것이다 (묻지 않으면 말하지 않는다). 잘 따라 하면 사격을 조금 가르쳐 준다 (코드가 정한다).
  choices:
    - id: drill
      label: 시키는 대로 분해하고 다시 맞춘다
      check: shoot
      outcomes:
        success:
          - train: { skill: shoot, max: 2 }
          - relation: { who: thomas, axis: respect, delta: 2 }
          - belief: { fact: "토머스 리드에게 사격을 배웠다. 숨을 내쉬면서 당기라고 했다", source: seen }
        partial:
          - relation: { who: thomas, axis: respect, delta: 1 }
          - belief: { fact: 토머스는 손질은 됐다면서 쏘는 건 아직 멀었다고 했다, source: seen }
        miss:
          - belief: { fact: 토머스는 아무 말 없이 총을 다시 분해해 보였다. 한 번 더 보라는 뜻이었다, source: seen }
    - id: dogtags
      label: 목에 건 군번줄 두 개에 대해 묻는다
      effects:
        - relation: { who: thomas, axis: trust, delta: -1 }
        - belief: { fact: "토머스의 군번줄 이야기를 꺼내자 그는 오늘 훈련은 끝이라고 했다", source: seen }

- id: fr_bater_truck
  title: 기름이 남은 화물차
  tags: [world]
  when:
    zones: [rest_stop, e_market]
    segments: [day, evening]
  cast:
    bater: { ids: [fr_baterdene] }
  setup: '{bater:이/가} 짐 묶는 끈을 조이다 말고 고개를 든다. "너, 운전할 줄 아나? 휴게소 뒤에 화물차 있다. 기름 반 통이면 국도 끝까지 간다. 국도 끝 다음은… 아무도 모른다."'
  ai_direction: 바트에르덴은 도시를 빠져나갈 화물차와 열쇠를 숨겨 두었다. 같이 갈 사람을 떠보는 중이다. 기름(연료)을 모아 오면 길을 연다는 말은 진심이다. 도시 밖이 어떤지는 아무도 모른다 (휴게소 칠판의 이름들은 돌아오지 않았다).
  choices:
    - id: interested
      label: 국도 끝 이야기를 더 묻는다
      effects:
        - relation: { who: bater, axis: trust, delta: 1 }
        - belief: { fact: "바트에르덴이 고속도로 휴게소 뒤의 화물차 이야기를 했다. 기름 반 통이면 국도 끝까지 간다고 한다", source: report }
    - id: fuel
      label: 기름병 하나를 건네며 같이 모아 보자고 한다
      when: { has_items: [fuel_bottle] }
      effects:
        - take_item: { item: fuel_bottle }
        - relation: { who: bater, axis: trust, delta: 2 }
        - relation: { who: bater, axis: affection, delta: 1 }
        - set_flag: fr_truck_partner
        - belief: { fact: "바트에르덴과 화물차 기름을 같이 모으기로 했다. 그는 처음으로 활짝 웃었다", source: seen }
    - id: stay
      label: 여기서 버티겠다고 한다
      effects:
        - belief: { fact: "바트에르덴은 그래, 다들 그렇게 말한다며 끈을 마저 조였다", source: seen }

- id: fr_nur_missing
  title: 그물 창고의 기도
  tags: [world]
  when:
    zones: [yeoul_isle]
    segments: [evening, night]
  cast:
    nur: { ids: [fr_nurhayati] }
  setup: '구석진 자리에서 {nur:이/가} 기도를 마치고 일어선다. 당신을 보고 놀라 머릿수건을 고쳐 쓴다. 잠시 망설이다 아주 작게 묻는다. "혹시… 저처럼 공장에서 온 사람 둘, 본 적 있으십니까? 처음에 같이 배를 탔는데요."'
  ai_direction: 누르하야티와 함께 섬에 닿은 공장 동료 둘은 "쓸모 있는 사람"으로 따로 데려가졌다. 그녀는 둘이 따로 데려가진 뒤 돌아오지 않았다는 것만 안다. 어디로 가서 무엇을 하는지는 이 이야기에서 드러나지 않는다. 묻다가 밥을 굶은 적이 있어 몹시 조심스럽다. 섬 사람들이 들으면 곤란해진다.
  choices:
    - id: promise
      label: 알아봐 주겠다고 약속한다
      effects:
        - relation: { who: nur, axis: trust, delta: 2 }
        - belief: { fact: "누르하야티와 함께 섬에 온 공장 동료 둘이 '쓸모 있는 사람'으로 따로 데려가진 뒤 돌아오지 않았다", source: report }
    - id: warn
      label: 그런 건 묻지 않는 게 좋겠다고 한다
      effects:
        - relation: { who: nur, axis: affection, delta: -1 }
        - belief: { fact: "누르하야티에게 사라진 사람들 이야기는 묻지 말라고 했다. 그녀는 고개를 숙이고 제 일로 돌아갔다", source: seen }
