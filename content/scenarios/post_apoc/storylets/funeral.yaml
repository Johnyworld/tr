# 장례와 추모 (12-163): 사흘 안에 우리 무리의 이름 있는 사람이 죽었을 때 (when.funeral). {deceased:은/는} 그 사람.
# 배역 bereaved는 그 사람과 가까웠던 사람 (관계가 있거나 호감이 legacy.close_affection 이상)
# 시신을 거두는 일은 take_action.bury로 (이야기 효과로 하지 않는다). 이야기는 산 사람들의 몫이다

- id: fn_rites
  title: 마지막 인사
  tags: [world]
  repeatable: true
  cooldown_days: 4
  when:
    funeral: true
    own_territory: true
    segments: [morning, day, evening]
  setup: "거점 마당에 사람들이 모였다. {deceased}의 이름이 적힌 나무판 앞에 누군가 촛농을 떨어뜨린다. 누가 먼저 입을 열지 다들 눈치만 본다."
  variants:
    - "{deceased}의 자리였던 침상에 담요가 개어져 있다. 저녁 배식 전에 다들 그 앞에 잠깐씩 멈춰 선다. 누군가 한마디 해야 할 것 같다."
  ai_direction: "{deceased:이/가} 어떻게 죽었는지는 상태와 소문에 있는 만큼만. 주인공이 그 사람을 잘 몰랐다면 그 어색함도 그대로. 장례의 말은 플레이어가 고른 결로 짧게."
  choices:
    - id: speak
      label: 앞에 나서서 그 사람 이야기를 한다
      check: persuade
      outcomes:
        success:
          - faction_morale: { faction: own, delta: 1 }
          - deed: { summary: "{deceased}의 장례에서 앞에 나서 그 사람 이야기를 했다", tags: [loyalty], severity: 1, privacy: public }
          - body: { track: nerves, delta: -1 }
        partial:
          - body: { track: nerves, delta: -1 }
        miss:
          - body: { track: nerves, delta: 1 }
    - id: stand
      label: 말없이 뒷줄에 서 있다
      effects:
        - body: { track: nerves, delta: -1, chance: 0.5 }
    - id: work
      label: 할 일이 있다며 빠진다
      effects:
        - deed: { summary: "{deceased}의 장례에 빠졌다", tags: [selfishness], severity: 1, privacy: public }

- id: fn_bereaved
  title: 남은 사람
  tags: [world]
  repeatable: true
  cooldown_days: 4
  when:
    funeral: true
    segments: [evening, night]
  cast:
    kin: { bereaved: true, here: true }
  setup: "{kin:이/가} 혼자 앉아 {deceased}의 물건을 하나씩 만지작거린다. 칼집, 낡은 장갑, 반쯤 남은 담뱃갑. 당신을 보고도 손을 멈추지 않는다."
  ai_direction: "{kin:은/는} {deceased:과/와} 가까웠다. 화를 내거나 무너지거나 아무렇지 않은 척한다 (성격대로). 위로의 말이 맞을 수도, 틀릴 수도 있다. 판정이 아니라 플레이어가 고른 태도대로."
  choices:
    - id: sit
      label: 옆에 앉아 아무 말 없이 있어 준다
      effects:
        - relation: { who: kin, axis: affection, delta: 2 }
        - relation: { who: kin, axis: trust, delta: 1 }
    - id: words
      label: 그 사람은 좋은 사람이었다고 말한다
      check: persuade
      outcomes:
        success:
          - relation: { who: kin, axis: affection, delta: 2 }
        partial:
          - relation: { who: kin, axis: affection, delta: 1 }
        miss:
          - relation: { who: kin, axis: affection, delta: -1 }
    - id: drink
      label: 술병을 꺼내 한 잔 따라 준다
      when: { has_items: [soju] }
      effects:
        - take_item: { item: soju }
        - relation: { who: kin, axis: affection, delta: 2 }
        - relation: { who: kin, axis: trust, delta: 2 }
    - id: leave
      label: 혼자 있게 둔다
      effects: []

- id: fn_empty_seat
  title: 빈자리
  tags: [world]
  repeatable: true
  cooldown_days: 4
  when:
    funeral: true
    own_territory: true
    segments: [morning, evening]
  setup: "배식 줄에서 누군가 습관처럼 그릇 하나를 더 꺼냈다가 도로 내려놓는다. {deceased}의 몫이었다. 줄이 잠깐 조용해진다."
  ai_direction: "누구도 크게 슬퍼하지 않는 척한다. 그게 여기 사람들이 버티는 방식이다. 다만 그 빈 그릇 하나를 다들 의식한다."
  choices:
    - id: share
      label: 그 몫을 아이들 그릇에 덜어 주자고 한다
      effects:
        - faction_morale: { faction: own, delta: 1 }
        - deed: { summary: "{deceased}의 몫을 아이들에게 나누자고 했다", tags: [mercy], severity: 1, privacy: public }
    - id: quiet
      label: 아무 말 없이 줄을 선다
      effects:
        - body: { track: nerves, delta: 1, chance: 0.3 }
