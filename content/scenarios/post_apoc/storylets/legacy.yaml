# 계승의 흔적 (12-130): 이전 주인공의 유해·무덤이 있는 구역에서만 열린다 (when.predecessor_here)
# - 누구의 유해·무덤인지는 GM 상태의 "묻히지 않은 유해"·"이 구역의 무덤" 줄에 있다. 새 주인공이 모르는 사람이면 호칭으로 부른다
# - 유해를 뒤지는 것은 transfer_item, 묻는 것은 take_action.bury로 (이야기 효과로 하지 않는다)

- id: lg_familiar_pack
  title: 낯익은 배낭
  tags: [world]
  repeatable: true
  cooldown_days: 7
  when:
    indoor: false
    predecessor_here: remains
    segments: [morning, day, evening]
  setup: 무너진 담 아래에 누군가 쓰러져 있다. 며칠은 된 것 같다. 등에 멘 배낭의 끈이 낡았지만 단단히 매여 있다.
  ai_direction: 상태의 "묻히지 않은 유해" 줄의 그 사람이다 (이전 주인공). 새 주인공은 이 사람의 기억이 없다. 이름을 알면 알아보고, 모르면 낯선 사람이다. 플레이어는 누구인지 알 수 있으니 그 거리감을 살린다. 어떻게 죽었는지는 몸에 남은 흔적(상처, 마른 몸)으로만 비춘다.
  choices:
    - id: search
      label: 배낭과 주머니를 살핀다
      effects:
        - belief: { fact: "{zone}에서 쓰러져 있는 사람의 짐을 살폈다", source: seen }
    - id: bury
      label: 그냥 두고 갈 수는 없다. 묻어 준다
      effects:
        - belief: { fact: "{zone}에 쓰러져 있던 사람을 묻어 주기로 했다", source: seen }
    - id: leave
      label: 눈을 돌리고 지나간다
      effects: []

- id: lg_flowers
  title: 무덤 위의 들꽃
  tags: [world]
  repeatable: true
  cooldown_days: 10
  when:
    indoor: false
    predecessor_here: grave
    segments: [morning, day]
  setup: 돌무더기로 덮은 무덤 하나. 그 위에 아직 시들지 않은 들꽃 한 줌이 놓여 있다. 누군가 다녀간 지 얼마 안 됐다.
  ai_direction: 상태의 "이 구역의 무덤" 줄의 그 사람이다 (이전 주인공). 꽃을 둔 사람은 그를 기억하는 누군가다. 그 사람과 관계가 좋았던 인물이 이 근처에 있다면 그 인물일 수 있다 (장면에 들이려면 npc_presence). 아니면 이름 모를 사람의 흔적으로 남긴다.
  choices:
    - id: wait
      label: 꽃을 둔 사람이 돌아올지 근처에서 기다려 본다
      effects:
        - belief: { fact: "{zone}의 무덤에 누군가 들꽃을 두고 갔다", source: seen }
    - id: read
      label: 묘비를 읽고 잠시 서 있다가 간다
      effects:
        - belief: { fact: "{zone}에 무덤이 있다. 누군가 아직 그 사람을 기억한다", source: seen }

- id: lg_grave_robbed
  title: 파헤쳐진 무덤
  tags: [world]
  repeatable: true
  cooldown_days: 14
  when:
    indoor: false
    predecessor_here: grave
    segments: [evening, night]
    own_territory: false
  setup: 무덤의 돌이 옆으로 밀려나 있다. 흙이 반쯤 파헤쳐졌고, 삽 자국이 아직 새것이다. 묻힌 짐을 노린 것이다.
  ai_direction: 상태의 "이 구역의 무덤" 줄의 그 사람이다 (이전 주인공). 판 사람은 아직 멀리 가지 않았을 수 있다. 쫓으려면 판정으로, 마주치면 spawn_extra로. 묻힌 짐은 이미 사라졌다고 서술한다 (되찾을 수 있는 것은 판 사람의 짐뿐이다).
  choices:
    - id: refill
      label: 흙을 다시 덮고 돌을 올린다
      effects:
        - belief: { fact: "{zone}의 무덤이 파헤쳐져 있었다. 다시 덮어 두었다", source: seen }
    - id: track
      label: 삽 자국과 발자국을 따라가 본다
      check: survival
      outcomes:
        success:
          - belief: { fact: "{zone}의 무덤을 판 자들의 발자국이 가까운 폐허로 이어졌다", source: seen }
        partial:
          - belief: { fact: "{zone}의 무덤을 판 자들은 둘 이상이다. 발자국이 중간에 끊겼다", source: seen }
        miss:
          - belief: { fact: "{zone}의 무덤을 판 자들의 흔적을 놓쳤다", source: seen }

# 그를 기억하는 사람 (12-158): 죽은 앞 주인공과 가까웠던 사람(관계가 있거나 호감이 legacy.close_affection 이상)이 배역 mourner.
# {departed:은/는} 그 사람이 기억하는 앞 주인공을 새 주인공이 부르는 말이다 (이름을 모르면 호칭)

- id: lg_empty_cup
  title: 빈 잔
  tags: [world]
  repeatable: true
  cooldown_days: 12
  when:
    indoor: "any"
    segments: [evening, night]
  cast:
    friend: { mourner: true, here: true }
  setup: "{friend:이/가} 잔 둘을 놓고 하나에만 술을 따른다. 빈 잔은 맞은편 자리에 그대로 둔다."
  ai_direction: "{friend:은/는} {departed:을/를} 기억한다. 빈 잔은 {departed}의 몫이다. 새 주인공은 {departed}의 기억이 없다 (이름을 알면 소문으로 들은 만큼만 안다). 플레이어는 누구인지 알 수 있으니 그 거리감을 살린다. {friend:이/가} 꺼내는 이야기는 연대기의 행적과 이 인물이 아는 것 안에서만."
  choices:
    - id: sit
      label: 맞은편에 앉아 이야기를 듣는다
      effects:
        - relation: { who: friend, axis: affection, delta: 1 }
        - belief: { fact: "{friend:은/는} 아직 {departed:을/를} 잊지 못했다", source: report }
    - id: drink
      label: 빈 잔에 같이 술을 따른다
      effects:
        - relation: { who: friend, axis: trust, delta: 1 }
        - belief: { fact: "{friend:과/와} {departed}의 몫으로 한 잔을 따랐다", source: seen }
    - id: leave
      label: 방해하지 않고 자리를 비켜 준다
      effects: []

- id: lg_keepsake
  title: 맡겨 둔 것
  tags: [world]
  when:
    indoor: "any"
    segments: [morning, day, evening]
  cast:
    friend: { mourner: true, here: true }
  setup: "{friend:이/가} 품에서 접힌 천 뭉치를 꺼낸다. \"{departed:이/가} 나한테 맡겨 둔 거야. 이제 누가 가져야 할지 모르겠어.\""
  ai_direction: "천 안에는 빛바랜 사진 한 장이 있다 (사진 속 얼굴은 {departed}의 붕괴 전 모습이거나 그가 찾던 사람이다. 정하지 말고 흐릿하게). {friend:은/는} 새 주인공이 이것을 가질 만한 사람인지 본다. 값나가는 물건이 아니라 마음의 물건이다."
  choices:
    - id: take
      label: 받아 들고 잘 간직하겠다고 한다
      effects:
        - give_item: { item: faded_photo }
        - relation: { who: friend, axis: trust, delta: 1 }
        - belief: { fact: "{friend:이/가} {departed}의 사진을 내게 건넸다", source: seen }
    - id: refuse
      label: 그건 당신이 가져야 한다고 돌려준다
      effects:
        - relation: { who: friend, axis: affection, delta: 1 }
        - belief: { fact: "{friend:은/는} {departed}의 사진을 품고 다닌다", source: seen }

- id: lg_old_story
  title: 그 사람 이야기
  tags: [world]
  repeatable: true
  cooldown_days: 15
  when:
    indoor: "any"
    segments: [day, evening]
  cast:
    friend: { mourner: true, here: true }
  setup: "{friend:이/가} 일하던 손을 멈추고 문득 웃는다. \"{departed}도 꼭 그렇게 했는데.\""
  ai_direction: "새 주인공의 몸짓이나 말버릇 하나가 {friend}에게 {departed:을/를} 떠올리게 했다. {friend:은/는} {departed}의 이야기 하나를 꺼낸다 (연대기의 행적이나 이 인물이 함께 겪은 일. 없는 일은 지어내지 않는다). 듣고 나면 새 주인공에게 {departed:은/는} 소문이 아니라 사람이 된다."
  choices:
    - id: ask
      label: 그 사람은 어떤 사람이었는지 묻는다
      effects:
        - relation: { who: friend, axis: affection, delta: 1 }
        - belief: { fact: "{friend}에게서 {departed}의 이야기를 들었다", source: report }
    - id: brush
      label: 나는 그 사람이 아니라고 선을 긋는다
      effects:
        - relation: { who: friend, axis: affection, delta: -1 }
