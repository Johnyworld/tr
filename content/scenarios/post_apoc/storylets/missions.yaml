# 임무의 결과 (플레이 테스트 11): 판정만으로는 알 수 없는 결과(탈영병을 데려왔나, 부상자를 수습했나)를 실제로 마주치는 이야기.
# when.mission: 그 임무를 수행 중이고 임무 장소에 있을 때만 열린다. 결과 조건(goal)은 효과 mission_goal로 채운다.
# 임무가 날마다 다시 나오므로 repeatable, 그 자리에서 놓치지 않게 urgent, 다른 이야기보다 먼저 열리게 weight를 높인다

- id: ms_deserter_found
  title: 발자국 끝의 사람
  urgent: true
  repeatable: true
  weight: 20
  when:
    mission: [c_deserter_hunt]
  cast:
    runner: { extra: c_raider, label: 담을 넘은 조원, enter: true }
  setup: "발자국이 무너진 상가 뒤에서 끊긴다. 셔터 틈으로 숨소리가 새어 나온다. 안쪽 어둠에서 {runner:이/가} 쇠막대를 쥐고 웅크린 채 당신의 완장을 본다. \"…데리러 온 거냐.\""
  ai_direction: "{runner:은/는} 이틀을 굶었고 지쳐 있다. 돌아가면 광장에서 본보기가 된다는 것을 안다. 그래도 겨울 밖에서 혼자 죽기는 싫어한다. 살아서 데려오라는 것이 규율반의 명령이다. 붙잡는 판정은 {runner:을/를} opponent로 둔다."
  choices:
    - id: talk_back
      label: 돌아가자고 설득한다
      check: persuade
      outcomes:
        success:
          - mission_goal: true
          - companion_join: { who: runner, kind: purpose, until: { hours: 12 } }
          - belief: { fact: "담을 넘은 {runner:을/를} 설득해 살아서 데려가게 됐다", source: seen }
        partial:
          - mission_goal: true
          - companion_join: { who: runner, kind: purpose, until: { hours: 12 } }
          - relation: { who: runner, axis: trust, delta: -1 }
          - belief: { fact: "{runner:은/는} 따라오기로 했지만 걸음마다 뒤를 돌아본다", source: seen }
        miss:
          - npc_depart: { who: runner }
          - belief: { fact: "{runner:은/는} 말이 끝나기 전에 셔터 밑으로 빠져 달아났다", source: seen }
    - id: grab
      label: 덮쳐서 붙잡는다
      check: fight
      outcomes:
        success:
          - mission_goal: true
          - companion_join: { who: runner, kind: purpose, until: { hours: 12 } }
          - relation: { who: runner, axis: trust, delta: -2 }
          - belief: { fact: "담을 넘은 {runner:을/를} 덮쳐 붙잡았다. 손을 묶어 데려간다", source: seen }
        partial:
          - mission_goal: true
          - companion_join: { who: runner, kind: purpose, until: { hours: 12 } }
          - wound: { steps: 1, cause: 붙잡히지 않으려는 탈영병의 쇠막대 }
          - relation: { who: runner, axis: trust, delta: -2 }
        miss:
          - npc_depart: { who: runner }
          - wound: { steps: 1, cause: 붙잡히지 않으려는 탈영병의 쇠막대 }
          - belief: { fact: "{runner:은/는} 쇠막대를 휘두르고 달아났다", source: seen }
    - id: let_go
      label: 못 본 척 등을 돌린다
      effects:
        - npc_depart: { who: runner }
        - deed: { summary: 뒤쫓던 탈영병을 찾아 놓고 놓아주었다, tags: [mercy, betrayal], severity: 2, privacy: private }
        - belief: { fact: "{runner:을/를} 찾았지만 놓아주었다. 아무도 보지 못했다", source: seen }

- id: ms_riverside_wounded
  title: 기계 밑의 신음
  urgent: true
  repeatable: true
  weight: 20
  when:
    mission: [d_riverside_wounded]
  cast:
    hurt: { extra: refugee, label: 다리를 다친 사람, enter: true }
  setup: "녹슨 프레스 기계 밑에서 신음이 들린다. 피 묻은 천으로 허벅지를 감은 {hurt:이/가} 기어 나오려다 멈춘다. 어느 무리 완장인지는 피와 흙에 가려 보이지 않는다."
  ai_direction: "어젯밤 교전에서 남겨진 사람이다. 피를 꽤 흘렸다. 응급처치를 하고 데려가면 산다. 공장 안쪽 어딘가에 아직 다른 무리가 남아 있을지 모른다."
  choices:
    - id: treat
      label: 그 자리에서 지혈하고 부축해 데려간다
      check: first_aid
      outcomes:
        success:
          - mission_goal: true
          - companion_join: { who: hurt, kind: purpose, until: { hours: 12 } }
          - relation: { who: hurt, axis: trust, delta: 2 }
          - belief: { fact: "강변 공장에서 다친 {hurt:을/를} 지혈해 데려가게 됐다", source: seen }
        partial:
          - mission_goal: true
          - companion_join: { who: hurt, kind: purpose, until: { hours: 12 } }
          - belief: { fact: "{hurt}의 피는 겨우 멎었다. 오래 걷지는 못한다", source: seen }
        miss:
          - npc_depart: { who: hurt }
          - belief: { fact: "{hurt:을/를} 살리지 못했다. 피가 멎지 않았다", source: seen }
    - id: leave
      label: 총소리가 날까 봐 물러난다
      effects:
        - npc_depart: { who: hurt }
        - belief: { fact: "강변 공장에 다친 사람을 두고 물러났다", source: seen }

- id: ms_house_call_willow
  title: 앓아누운 사람
  urgent: true
  repeatable: true
  weight: 20
  when:
    mission: [d_willow_house_call]
  cast:
    sick: { extra: b_villager, label: 앓아누운 버들마을 사람, enter: true }
  setup: "버들마을 단지 안쪽 방, 젖은 수건을 이마에 얹은 {sick:이/가} 눈을 뜬다. 곁의 식구가 당신 가방부터 본다. \"약… 가져오셨어요?\""
  ai_direction: "{sick:은/는} 사흘째 열이 내리지 않는다. 버들마을은 약값을 깎아 달라고 할 것이다. 도상필이 정한 값은 정해져 있다."
  choices:
    - id: examine
      label: 열과 숨을 살피고 처치한다
      check: first_aid
      outcomes:
        success:
          - mission_goal: true
          - relation: { who: sick, axis: trust, delta: 2 }
          - belief: { fact: "버들마을 {sick:을/를} 진찰하고 처치했다. 고비는 넘겼다", source: seen }
        partial:
          - mission_goal: true
          - belief: { fact: "버들마을 {sick:을/를} 처치했지만 열이 다 내리지는 않았다", source: seen }
        miss:
          - belief: { fact: "버들마을 {sick}의 병을 짚어 내지 못했다", source: seen }

- id: ms_house_call_pine
  title: 의무실의 환자
  urgent: true
  repeatable: true
  weight: 20
  when:
    mission: [do_pine_ward]
  cast:
    sick: { extra: a_field_hand, label: 의무실에 누운 청솔 사람, enter: true }
  setup: "청솔형제단 의무실, 야전 침대에 누운 {sick:이/가} 기침을 참느라 이를 악문다. 붕대를 감던 손이 멈추고 모두 당신을 본다."
  ai_direction: "{sick:은/는} 기침이 깊어졌다. 청솔 쪽은 약을 바라지만, 값이 정해지기 전에는 약을 두고 오지 않는 것이 하얀매의 방침이다."
  choices:
    - id: examine
      label: 환자를 살피고 처치한다
      check: first_aid
      outcomes:
        success:
          - mission_goal: true
          - relation: { who: sick, axis: trust, delta: 2 }
          - belief: { fact: "청솔 의무실에서 {sick:을/를} 진찰하고 처치했다", source: seen }
        partial:
          - mission_goal: true
          - belief: { fact: "청솔 의무실에서 {sick:을/를} 처치했지만 기침은 그대로다", source: seen }
        miss:
          - belief: { fact: "청솔 의무실의 {sick}에게 손쓸 길을 찾지 못했다", source: seen }
