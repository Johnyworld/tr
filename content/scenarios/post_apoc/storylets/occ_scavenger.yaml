        - belief: { fact: "죽은 수색꾼을 돌로 덮었다. 배낭도 같이 묻었다. 같은 일을 하는 사람에게 해 줄 수 있는 것", source: seen }

- id: occ_sc_letter_delivered
  title: 쪽지의 주인
  tags: [occ_scavenger]
  when:
    zones: [b_base]
    segments: [morning, day, evening]
    flags_all: [occ_sc_letter_carried]
    flags_none: [occ_sc_letter_done]
  cast:
    brother: { extra: b_guard, label: 쪽지 겉글씨의 주인 }
  setup: >-
    버들마을 정문 경비실. 이름을 대자 {brother:이/가} 총을 벽에 기대 놓고 나온다. 당신이 내민 비닐 쪽지의 겉글씨를 보고 손을 멈춘다.
    한참을 들여다보다 묻는다. "어디서요?"
  ai_direction: >-
    이 경비병은 동생이 수색을 나갔다가 돌아오지 않은 것을 안다. 죽은 것은 몰랐다. 울지 않는다. 고맙다는 말 대신 경비조 사람들에게 이 수색꾼이 무엇을 가져왔는지 말한다.
    배낭의 물건을 돌려달라고 하지는 않는다. 동생이 어디서 어떻게 죽었는지 들으면, 그 계단을 다른 수색꾼들에게 알린다.
  choices:
    - id: tell_truth
      label: 어디서 어떻게 찾았는지 그대로 말한다
      effects:
        - set_flag: occ_sc_letter_done
        - standing: 1
        - relation: { who: brother, axis: trust, delta: 2 }
        - relation: { who: brother, axis: respect, delta: 1 }
        - deed: { summary: 폐허에서 죽은 수색꾼의 쪽지를 버들마을의 형에게 전했다, tags: [mercy, honesty], severity: 1, privacy: public }
        - belief: { fact: "버들마을 경비병에게 동생의 쪽지를 전했다. 그는 경비조 사람들에게 내 얼굴을 보여 주며 이 사람이 데려왔다고 했다. 쪽지만 데려왔는데", source: seen }
    - id: soften
      label: 편하게 갔을 거라고 말을 고른다
      effects:
        - set_flag: occ_sc_letter_done
        - relation: { who: brother, axis: affection, delta: 2 }
        - belief: { fact: "버들마을 경비병에게 동생이 편히 갔다고 말했다. 그는 그 말을 믿고 싶어 했다", source: seen }
