# 나루상단 사람들(more_trader.yaml)과 무리 없는 사람들(wanderers.yaml)의 이야기 둘째 묶음
# 첫째 묶음(people_trader_isle.yaml pt_*, people_wanderers.yaml pw_*)과 겹치지 않게, 그 뒤를 잇거나 다른 비밀을 건드린다
# 사진 속 얼굴(모준기) / 물때 위의 키(감태식·변상철, pt_cargo_of_debt 뒤) / 통조림 자루(선지오)
# 문 위의 사내(반석구 → 박만수, pw_closed_gate 뒤) / 덫에 걸린 붉은 완장(금보라·차동팔) / 지도통의 원본(나창주)
# 진실은 인물의 비밀과 belief로만. 숫자는 박지 않는다

- id: pw2_photo
  title: 사진 속 얼굴
  tags: [world]
  when:
    zones: [e_market, riverside, water_plant]
    segments: [evening]
    day_gte: 4
    flags_none: [pw2_photo_done]
  cast:
    porter: { ids: [pe_junki] }
    sister: { ids: [py_eunbyeol], enter: false }
  setup: "피난민 천막 사이, 마른 짐꾼 {porter:이/가} 비닐에 싼 사진을 꺼내 모닥불 쪽으로 기울인다. 사진 속 여자는 왼쪽 눈썹에 점이 있다. \"이 분, 혹시 보신 적 있어요? 섬에서 뭍으로 내보냈대요. 늙어서 일을 못 한다고. 그럼 어딘가에 계시겠죠.\" 그는 대답을 기다리지 않고 다음 천막을 본다. 걸음이 급하다."
  ai_direction: 모준기의 어머니는 지난겨울 여울섬에서 "뭍으로 내보내졌다". 섬에서 내보낸 사람은 아무도 뭍에 닿지 않았다 (모준기도, 피난민들도 모른다. 섬의 진실은 말하지 않는다). 그가 급한 이유는 빚이다. 어머니를 데려가 살 방 값 때문에 전당포 감순덕에게 자기 몸을 담보로 빚을 졌고, 기한이 지나면 "섬 일손"으로 거래선에 오른다. 빚 이야기는 캐물어야 나온다. 피난민들은 친절하지만 아무도 그 얼굴을 본 적이 없다.
  choices:
    - id: search_tents
      label: 천막을 같이 돌며 사람들에게 물어 준다
      check: persuade
      outcomes:
        success:
          - set_flag: pw2_photo_done
          - set_flag: pw2_no_landing
          - relation: { who: porter, axis: trust, delta: 2 }
          - belief: { fact: "피난민 천막을 다 돌았다. 섬 배가 사람을 뭍에 내려놓는 것을 본 사람은 아무도 없었다. 강 하구에서 오래 산 노인이 '그 배는 짐만 내리고 간다'고 했다", source: report }
        partial:
          - set_flag: pw2_photo_done
          - relation: { who: porter, axis: trust, delta: 1 }
          - belief: { fact: "한 노파가 사진 속 사람을 봤다고 했다가, 눈썹의 점을 묻자 말끝을 흐렸다. 모준기는 그 노파 손에 마른 빵을 쥐여 주고 고맙다고 여러 번 말했다", source: seen }
        miss:
          - set_flag: pw2_photo_done
          - relation: { who: porter, axis: affection, delta: 1 }
          - belief: { fact: "모준기와 천막을 돌았지만 아무도 사진 속 얼굴을 몰랐다. 그는 '내일 강변 쪽을 돌아 보면 돼요'라고 했다", source: seen }
    - id: why_hurry
      label: 왜 그렇게 서두르느냐고 묻는다
      check: persuade
      outcomes:
        success:
          - set_flag: pw2_photo_done
          - set_flag: pw2_junki_debt_known
          - reveal_tie: { who: porter, other: sister }
          - relation: { who: porter, axis: trust, delta: 2 }
          - belief: { fact: "모준기가 털어놓았다. 어머니를 모실 방 값 때문에 전당포 감순덕에게 몸을 담보로 빚을 졌다. 기한을 넘기면 '섬 일손'으로 거래선에 오른다. 섬에는 누이 모은별이 산다. '거기 가면 누이는 만나겠죠'라며 웃었다", source: report }
        partial:
          - set_flag: pw2_photo_done
          - set_flag: pw2_junki_debt_known
          - belief: { fact: "모준기는 갚을 날이 다가온다고만 했다. 전당포 쪽을 지날 때 사진을 품에 넣고 걸음을 빨리했다", source: seen }
        miss:
          - set_flag: pw2_photo_done
          - relation: { who: porter, axis: trust, delta: -1 }
          - belief: { fact: "모준기는 공손하게 웃으며 '찾는 사람이 있으면 다들 서두르죠'라고만 했다", source: seen }
    - id: hard_truth
      label: 섬에서 내보낸 사람이 뭍에 왔다는 말은 들어 본 적 없다고 말한다
      effects:
        - set_flag: pw2_photo_done
        - set_flag: pw2_junki_doubt
        - relation: { who: porter, axis: trust, delta: -1 }
        - belief: { fact: "섬에서 내보낸 사람이 뭍에 닿았다는 말은 못 들었다고 하자, 모준기는 '누이가 거짓말을 할 리 없어요'라며 사진을 품에 넣었다. 손이 떨렸다", source: seen }

- id: pw2_turn_boat
  title: 물때 위의 키
  tags: [world]
  when:
    zones: [water_plant, e_market]
    segments: [night]
    day_gte: 7
    factions: [faction_e, none]
    flags_all: [pt_cargo_done]
    flags_none: [pt_debtors_freed, pw2_turn_done]
  cast:
    guard: { ids: [pe_taesik] }
    boatman: { ids: [pe_sangcheol] }
    mother: { ids: [pe_sundeok], enter: false }
  setup: "강 하구 나루, 거래선이 물때를 기다린다. 뱃전 아래 자루 사이에 사람 둘이 무릎을 세우고 앉았다. 손이 앞으로 모여 있다. {boatman:은/는} 키 옆에서 하늘만 본다. {guard:이/가} 엽총을 메고 당신 옆으로 와 낮게 말한다. \"바다 한가운데서 돌린다. 영감은 내가 맡을 테니까 넌 저 둘 손만 풀어. 그다음은… 그다음에 생각해.\""
  ai_direction: 감태식은 배 위에서 거래선을 되돌리려 한다. 손이 묶인 빚쟁이는 그의 동네 형이었고, 그 뒤로 엽총 개머리판에 이름을 새긴다. 변상철은 이 배가 끊기면 딸 나래와 이어진 마지막 줄이 끊긴다고 믿는다. 그는 딸을 첫 거래 값으로 섬에 넘겼다 (깊이 믿게 되어야 털어놓는다). 배를 돌리면 섬은 탄약 값을 다시 잴 것이고, 전당포 감순덕은 아들이 한 일을 알게 된다. 감태식은 어머니를 미워하지 않는다. 위험은 판정 전에 선언한다. 바다 위 싸움으로 키우지 않는다.
  choices:
    - id: take_helm
      label: 감태식과 함께 키를 빼앗는다
      check: intimidate
      outcomes:
        success:
          - set_flag: pw2_turn_done
          - set_flag: pw2_boat_turned
          - relation: { who: guard, axis: trust, delta: 3 }
          - relation: { who: boatman, axis: trust, delta: -2 }
          - relation: { who: mother, axis: trust, delta: -2 }
          - faction_relation: { from: faction_y, to: faction_e, delta: -1 }
          - deed: { summary: 섬 거래선의 키를 빼앗아 묶인 빚쟁이들을 뭍으로 되돌렸다, tags: [mercy, disobedience], severity: 2, privacy: semi_private }
          - belief: { fact: "거래선은 섬에 닿지 않고 나루로 돌아왔다. 풀려난 둘은 고맙다는 말도 없이 어둠으로 뛰었다. 변상철은 내리지 않고 배 위에 앉아 섬 쪽을 봤다", source: seen }
        partial:
          - set_flag: pw2_turn_done
          - set_flag: pw2_boat_turned
          - relation: { who: guard, axis: trust, delta: 2 }
          - relation: { who: boatman, axis: trust, delta: -3 }
          - relation: { who: mother, axis: trust, delta: -3 }
          - faction_relation: { from: faction_y, to: faction_e, delta: -1 }
          - deed: { summary: 섬 거래선을 돌려세웠다가 상단 사람들에게 얼굴이 알려졌다, tags: [mercy, disobedience], severity: 2, privacy: public }
          - belief: { fact: "배는 돌렸지만 뱃사공과 몸싸움 끝에 나루 사람들이 다 깼다. 아침이면 전당포에서도 안다", source: seen }
        miss:
          - set_flag: pw2_turn_done
          - relation: { who: guard, axis: trust, delta: 1 }
          - relation: { who: boatman, axis: trust, delta: -2 }
          - belief: { fact: "변상철이 키를 놓지 않았다. 배는 물때에 맞춰 섬으로 갔다. 감태식은 돌아오는 내내 개머리판에 칼끝을 대고 있었다", source: seen }
    - id: talk_boatman
      label: 키를 잡은 변상철에게 섬의 딸 이야기를 묻는다
      check: persuade
      outcomes:
        success:
          - set_flag: pw2_turn_done
          - set_flag: pw2_boat_turned
          - set_flag: pw2_boatman_spoke
          - relation: { who: boatman, axis: trust, delta: 2 }
          - relation: { who: guard, axis: respect, delta: 2 }
          - faction_relation: { from: faction_y, to: faction_e, delta: -1 }
          - belief: { fact: "변상철이 털어놓았다. 첫 거래 때 탄약 값을 맞추려고 딸 나래를 섬에 넘겼다. 그 뒤로 실어 가는 '일손'은 딸 몫의 답례라고 여겼다. 그는 말을 마치고 스스로 키를 돌렸다", source: report }
        partial:
          - set_flag: pw2_turn_done
          - relation: { who: boatman, axis: trust, delta: 1 }
          - belief: { fact: "변상철은 '섬에 딸이 있다. 이 배가 끊기면 그 애 소식도 끊긴다'고만 했다. 배는 그대로 섬으로 갔다", source: report }
        miss:
          - set_flag: pw2_turn_done
          - relation: { who: boatman, axis: trust, delta: -1 }
          - relation: { who: guard, axis: affection, delta: -1 }
          - belief: { fact: "변상철은 '배에 실은 건 묻지 않는 거다'라고 한 뒤로 입을 열지 않았다. 감태식이 혀를 찼다", source: seen }
    - id: warn_mother
      label: 나루를 빠져나가 전당포에 알린다
      effects:
        - set_flag: pw2_turn_done
        - set_flag: pw2_taesik_betrayed
        - merit: 1
        - relation: { who: guard, axis: trust, delta: -3 }
        - relation: { who: mother, axis: trust, delta: 2 }
        - deed: { summary: 거래선을 돌리려던 호위대장을 그 어머니에게 일러바쳤다, tags: [betrayal], severity: 2, privacy: semi_private }
        - belief: { fact: "감순덕은 웃는 얼굴로 들었다. 거래선은 호위조를 바꿔 떠났다. 감태식은 그 밤부터 내 앞에서 총을 내려놓지 않는다", source: seen }
    - id: look_away
      label: 아무 말 없이 뱃전에 기대 물만 본다
      effects:
        - set_flag: pw2_turn_done
        - relation: { who: guard, axis: affection, delta: -2 }
        - belief: { fact: "거래선은 묶인 사람 둘을 싣고 섬으로 갔다. 섬 부두에서 하얀 장갑이 그들의 이를 먼저 봤다. 돌아오는 배에 탄약 상자가 실렸다", source: seen }

- id: pw2_pump_cans
  title: 통조림 자루
  tags: [world]
  when:
    zones: [water_plant, e_market]
    segments: [evening, night]
    day_gte: 4
    flags_none: [pw2_cans_done]
  cast:
    apprentice: { ids: [pe_jio] }
    old: { ids: [e_deoksu], enter: false }
  setup: "장터 뒤 골목, 기름때 묻은 {apprentice:이/가} 금니 박힌 상인의 심부름꾼에게서 묵직한 자루를 받는다. 통조림이 서로 부딪히는 소리. 그는 무언가 짧게 말하고, 자루를 작업복 안에 감추다 당신과 눈이 마주친다. \"…영감님 약값이야. 그게 다야.\""
  ai_direction: 선지오는 나루상단 우두머리 탁봉수에게서 매달 통조림을 받고 정수장 펌프 상태를 몰래 일러바친다. 펌프 소리가 이상하다는 것도 벌써 말했다. 탁봉수는 그걸로 물값을 올릴 때를 잰다. 펌프지기 염덕수는 베어링이 닳아 간다는 것을 혼자 안고 있고, 지오가 한 일은 모른다. 지오가 가장 두려운 것은 영감님이 아는 것이다. 몰아세우면 울지 않고 화를 낸다.
  choices:
    - id: ask_quiet
      label: 탁봉수한테 뭘 일러 주는 거냐고 조용히 묻는다
      check: persuade
      outcomes:
        success:
          - set_flag: pw2_cans_done
          - set_flag: pw2_jio_confessed
          - relation: { who: apprentice, axis: trust, delta: 2 }
          - belief: { fact: "선지오가 털어놓았다. 탁봉수에게 통조림을 받고 펌프 상태를 일러 준다. 펌프 소리가 이상하다는 것도 말했다. 상단이 곧 물값을 올릴 것이다", source: report }
        partial:
          - set_flag: pw2_cans_done
          - relation: { who: apprentice, axis: trust, delta: -1 }
          - belief: { fact: "선지오는 탁봉수가 펌프를 걱정해서 묻는 거라고 했다. 자기가 들어도 거짓말 같은지 말끝이 작아졌다", source: seen }
        miss:
          - set_flag: pw2_cans_done
          - relation: { who: apprentice, axis: trust, delta: -2 }
          - belief: { fact: "선지오가 '너도 뭐 받아먹는 거 있잖아'라고 쏘아붙이고 자루를 끌어안은 채 가 버렸다", source: seen }
    - id: tell_old
      label: 정수장으로 가서 염덕수에게 본 것을 말한다
      effects:
        - set_flag: pw2_cans_done
        - set_flag: pw2_jio_exposed
        - relation: { who: apprentice, axis: trust, delta: -3 }
        - relation: { who: old, axis: trust, delta: 1 }
        - deed: { summary: 펌프 견습이 상단 우두머리에게 정수장 일을 일러바친다고 펌프지기에게 알렸다, tags: [honesty], severity: 1, privacy: semi_private }
        - belief: { fact: "염덕수는 끝까지 듣고 렌치를 내려놓았다. '그 애 약값 얘기는 맞을 거다'라고만 했다. 그날 밤 펌프 앞에 선지오가 오지 않았다", source: seen }
    - id: turn_it
      label: 펌프가 멀쩡하다고 거짓으로 일러 주라고 한다
      check: deceive
      outcomes:
        success:
          - set_flag: pw2_cans_done
          - set_flag: pw2_jio_double
          - relation: { who: apprentice, axis: trust, delta: 2 }
          - deed: { summary: 펌프 견습에게 상단 우두머리를 속이는 법을 가르쳤다, tags: [deceit], severity: 1, privacy: private }
          - belief: { fact: "선지오가 다음 달부터 탁봉수에게 '펌프는 괜찮다'고 말하기로 했다. 통조림은 계속 받는다. '영감님은 모르는 거야, 알았지'", source: report }
        partial:
          - set_flag: pw2_cans_done
          - set_flag: pw2_jio_double
          - relation: { who: apprentice, axis: trust, delta: 1 }
          - belief: { fact: "선지오는 해 보겠다고 했다. 다만 이미 한 말을 되돌릴 수는 없다고 했다", source: report }
        miss:
          - set_flag: pw2_cans_done
          - relation: { who: apprentice, axis: trust, delta: -1 }
          - belief: { fact: "선지오는 '그 사람은 거짓말 냄새를 맡아'라며 고개를 저었다", source: seen }
    - id: leave_it
      label: 못 본 걸로 하고 지나간다
      effects:
        - set_flag: pw2_cans_done
        - relation: { who: apprentice, axis: affection, delta: 1 }
        - belief: { fact: "펌프 견습 선지오가 장터 뒤 골목에서 상단 우두머리의 심부름꾼에게 통조림 자루를 받았다", source: seen }

- id: pw2_gate_man
  title: 문 위의 사내
  tags: [world]
  when:
    zones: [old_town, riverside]
    segments: [evening, night]
    day_gte: 5
    flags_all: [pw_seokgu_told]
    flags_none: [pw2_gate_done]
  cast:
    drifter: { ids: [lone_seokgu] }
    veteran: { ids: [a_mansu] }
  setup: "무너진 담 그늘. {drifter:이/가} 냄비 끈을 손에 감은 채 웅크리고 있다. 길 저쪽으로 청솔 순찰조가 지나간다. 맨 끝에 다리를 저는 수염 난 {veteran}. 반석구가 숨을 들이켠다. \"저 사람이야. 목소리 들으면 알아.\" 그의 다른 손이 칼자루 위에 있다."
  ai_direction: 반석구는 붕괴 첫겨울 청솔 거점 문 밖에 남겨져 아내와 딸을 잃었다. 문 위에서 "더는 안 된다"고 외친 사람이 박만수다. 박만수는 자기 판단으로 피란민을 문 밖에 두었고, 그 뒤로 지휘를 거절해 왔다. 그는 변명하지 않는다. 반석구는 찾으면 무엇을 할지 자기도 모른다. AI는 누구도 죽이지 않는다. 칼은 판정과 결과로만 움직인다. 순찰조 다른 대원들은 이 일을 모른다.
  choices:
    - id: bring_together
      label: 박만수를 불러 세워 둘이 마주 보게 한다
      check: persuade
      outcomes:
        success:
          - set_flag: pw2_gate_done
          - set_flag: pw2_gate_spoken
          - reveal_tie: { who: drifter, other: veteran }
          - relation: { who: drifter, axis: trust, delta: 2 }
          - relation: { who: veteran, axis: respect, delta: 1 }
          - belief: { fact: "박만수가 반석구 앞에서 말했다. '내가 닫았다. 안에 애들이 있었다. 그날 이후로 아무것도 맡지 않았다.' 반석구는 칼을 놓고, 대답 없이 돌아섰다", source: seen }
        partial:
          - set_flag: pw2_gate_done
          - set_flag: pw2_gate_spoken
          - reveal_tie: { who: drifter, other: veteran }
          - relation: { who: veteran, axis: trust, delta: -1 }
          - belief: { fact: "박만수는 반석구를 한참 보고 '그래, 나다'라고만 하고 순찰조를 따라갔다. 반석구는 그 자리에 오래 앉아 있었다", source: seen }
        miss:
          - set_flag: pw2_gate_done
          - relation: { who: drifter, axis: trust, delta: -1 }
          - relation: { who: veteran, axis: trust, delta: -1 }
          - belief: { fact: "부르는 소리에 순찰조가 총을 겨눴다. 반석구는 어둠으로 사라졌고, 박만수는 끝까지 뒤를 보지 않았다", source: seen }
    - id: hold_back
      label: 반석구의 칼 쥔 손을 누르며 오늘은 아니라고 한다
      effects:
        - set_flag: pw2_gate_done
        - relation: { who: drifter, axis: affection, delta: 1 }
        - relation: { who: drifter, axis: trust, delta: -1 }
        - belief: { fact: "반석구는 손을 빼지 않았다. 순찰조가 다 지나간 뒤에야 '이름은 알았으니까'라고 했다", source: seen }
    - id: warn_patrol
      label: 순찰조에 칼 든 사내가 따라붙었다고 알린다
      effects:
        - set_flag: pw2_gate_done
        - set_flag: pw2_seokgu_sold
        - relation: { who: drifter, axis: trust, delta: -3 }
        - relation: { who: veteran, axis: trust, delta: 1 }
        - deed: { summary: 모닥불을 나눈 떠돌이를 청솔 순찰조에 일러바쳤다, tags: [betrayal], severity: 1, privacy: semi_private }
        - belief: { fact: "순찰조가 담 그늘을 뒤졌을 때 반석구는 없었다. 찌그러진 냄비 하나만 남아 있었다", source: seen }

- id: pw2_snared
  title: 덫에 걸린 붉은 완장
  tags: [world]
  when:
    zones: [riverside]
    segments: [dawn, morning]
    day_gte: 4
    flags_none: [pw2_snare_done]
  cast:
    trapper: { ids: [lone_bora] }
    raider: { ids: [c_dongpal] }
  setup: "강변 수풀, 철사 올가미에 발목이 걸린 {raider:이/가} 엎어져 있다. 붉은 완장, 털모자, 앞니 빠진 웃음. \"어이, 거기. 이거 좀… 담배 줄게.\" 그때 수풀 뒤에서 머리를 짧게 깎은 {trapper:이/가} 칼을 들고 나온다. 둘이 서로를 알아본다. 넉살 좋던 사내의 웃음이 멎는다."
  ai_direction: 차동팔은 붉은연합 규율반의 밀고자다. 금보라의 탈영 계획을 쪽지로 일러바친 것도 그였고, 대가로 공세 명단에서 빠지기로 했다. 금보라는 누가 자기를 팔았는지 모른다 (같은 약탈 삼조였던 동팔을 의심하지 않았다). 동팔은 몰리면 털어놓는다. 금보라는 "그다음은 내 일"이라고 말하지만, 이 장면에서 누구도 죽지 않는다. AI는 캐릭터를 죽일 수 없다.
  choices:
    - id: press
      label: 동팔을 몰아세워 금보라가 잡혀 간 밤을 묻는다
      check: intimidate
      outcomes:
        success:
          - set_flag: pw2_snare_done
          - set_flag: pw2_bora_knows
          - reveal_tie: { who: trapper, other: raider }
          - relation: { who: trapper, axis: trust, delta: 2 }
          - relation: { who: raider, axis: trust, delta: -3 }
          - belief: { fact: "차동팔이 실토했다. 금보라의 탈영 계획을 규율반 쪽지 상자에 넣은 것은 자기다. 공세 명단에서 빠지는 값이었다. 금보라는 칼을 내리고 그의 완장만 뜯어 갔다", source: seen }
        partial:
          - set_flag: pw2_snare_done
          - relation: { who: raider, axis: trust, delta: -1 }
          - belief: { fact: "차동팔은 '규율반 상자엔 누구나 쪽지를 넣는다'고만 했다. 금보라가 그 말을 오래 곱씹었다", source: seen }
        miss:
          - set_flag: pw2_snare_done
          - set_flag: pw2_bora_exposed
          - relation: { who: trapper, axis: trust, delta: -1 }
          - belief: { fact: "차동팔이 올가미를 끊고 달아났다. 이제 붉은연합은 금보라가 강변 어디에 덫을 놓는지 안다", source: seen }
    - id: free_him
      label: 금보라를 말리고 올가미를 풀어 준다
      effects:
        - set_flag: pw2_snare_done
        - set_flag: pw2_dongpal_owes
        - relation: { who: raider, axis: trust, delta: 2 }
        - relation: { who: trapper, axis: trust, delta: -2 }
        - belief: { fact: "차동팔이 '빚 하나 졌다'며 사탕 껍질을 쥐여 주고 절뚝이며 갔다. 금보라는 '붉은 것들은 은혜를 쪽지로 갚아'라고 했다", source: seen }
    - id: take_kit
      label: 동팔의 짐을 털고 그대로 둔다
      effects:
        - set_flag: pw2_snare_done
        - give_item: { item: cigarettes, from: raider }
        - relation: { who: raider, axis: trust, delta: -2 }
        - relation: { who: trapper, axis: respect, delta: 1 }
        - deed: { summary: 덫에 걸린 붉은연합 조원의 짐을 털었다, tags: [theft], severity: 1, privacy: semi_private }
        - belief: { fact: "금보라는 사내를 올가미째 두고 수풀로 돌아갔다. 해가 다 뜰 무렵 붉은연합 약탈조가 그를 찾으러 강변에 왔다", source: seen }

- id: pw2_map_original
  title: 지도통의 원본
  tags: [world]
  when:
    zones: [old_town, riverside, e_market, b_base, hospital_ruins]
    segments: [evening, night]
    day_gte: 5
    flags_none: [pw2_map_done]
  cast:
    cartographer: { ids: [lone_changju] }
    boss: { ids: [e_bongsu], enter: false }
  setup: "묵는 곳 등불 아래, {cartographer:이/가} 지도 한 장을 펴 놓고 연필을 쥔 채 움직이지 않는다. 청솔 동쪽 초소 둘레가 꼼꼼하다. 망루, 철조망 끊긴 자리, 배수로. 그는 지도 모서리를 등불에 대었다가, 타기 전에 거둔다. \"…원본은 안 태웁니다. 그게 제 규칙이라서요.\""
  ai_direction: 나창주는 나루상단 우두머리 탁봉수의 부탁으로 청솔 동쪽 초소의 지도를 그려 주었다. 그 사본은 초소 경비 교대 시간이 적힌 쪽지와 한 봉투에 들어가 붉은연합으로 갔다. 그는 나중에야 알았고, 자기 지도로 사람이 죽을까 봐 두렵다. 원본은 지도통에 있다. 값을 넉넉히 치르거나 그 두려움을 함께 들어 주는 사람에게만 털어놓는다. 원본이 청솔에 가면 초소는 경비를 바꿀 수 있다. 붉은연합의 공세가 정확히 언제인지는 그도 모른다.
  choices:
    - id: ask
      label: 그 지도를 누가 사 갔느냐고 묻는다
      check: persuade
      outcomes:
        success:
          - set_flag: pw2_map_done
          - set_flag: pw2_map_known
          - relation: { who: cartographer, axis: trust, delta: 2 }
          - belief: { fact: "나창주가 털어놓았다. 탁봉수의 부탁으로 청솔 동쪽 초소 지도를 그렸고, 그 사본이 경비 교대 시간 쪽지와 함께 붉은연합으로 갔다. 원본은 아직 그의 지도통에 있다", source: report }
        partial:
          - set_flag: pw2_map_done
          - belief: { fact: "나창주는 '누가 무엇을 샀는지는 값을 받아야 말한다'고 했다. 다만 이 지도는 팔지 말았어야 했다고 중얼거렸다", source: report }
        miss:
          - set_flag: pw2_map_done
          - relation: { who: cartographer, axis: trust, delta: -1 }
          - belief: { fact: "나창주는 지도를 둘둘 말아 지도통에 넣고 등불을 껐다", source: seen }
    - id: buy_original
      label: 값을 치르고 원본을 청솔에 가져가겠다고 한다
      effects:
        - set_flag: pw2_map_done
        - set_flag: pw2_map_to_pine
        - take_item: { item: trade_token }
        - clock: { id: c_east_offensive, delta: -1 }
        - faction_relation: { from: faction_a, to: faction_e, delta: -1, mutual: false }
        - relation: { who: cartographer, axis: trust, delta: 1 }
        - deed: { summary: 붉은연합에 넘어간 초소 지도의 원본을 사서 청솔에 알렸다, tags: [honesty], severity: 1, privacy: private }
        - belief: { fact: "나창주에게서 청솔 동쪽 초소 지도의 원본을 사 청솔에 알렸다. 초소는 경비 교대를 바꿀 것이다. 청솔은 그 지도가 나루상단 손을 거쳤다는 것도 알았다", source: seen }
    - id: burn_together
      label: 원본을 같이 태우자고 한다
      effects:
        - set_flag: pw2_map_done
        - relation: { who: cartographer, axis: affection, delta: 2 }
        - belief: { fact: "나창주는 끝내 원본을 태우지 못했다. 대신 지도통 맨 밑에 넣고 '이건 다시는 안 꺼냅니다'라고 했다. 그 밤 그는 처음으로 값을 받지 않고 소식 하나를 주었다: 붉은 사람들이 요즘 철길 밑을 자주 지난다", source: report }
