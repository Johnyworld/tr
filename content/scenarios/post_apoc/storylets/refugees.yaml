# 피난민 (12-133): 우리 거점 문 앞에 피난민이 온다. 받아들이면 무리의 사람 수(faction_population)가 늘어
# 입(하루 소모)과 손(구역 산출)이 함께 는다. 계산은 전쟁 틱이 한다
# - 간부(회의에 드는 계급)는 직접 정한다. 다른 계급은 지도부의 결정 앞에서 목소리를 내거나 몰래 돕는다
# - 받아들이면 플래그 rf_taken_in: 며칠 뒤 그 가운데 다른 무리의 귀가 섞여 있었다는 이야기가 열린다
# - 떠돌이는 거점이 없어 열리지 않는다 (own_territory)

- id: rf_gate_council
  title: 문 앞의 일곱
  tags: [world]
  repeatable: true
  cooldown_days: 20
  when:
    own_territory: true
    ranks: [officer]
    day_gte: 4
    segments: [morning, day]
  setup: 정문 초소에서 사람을 보냈다. 문 앞에 피난민 일곱이 와 있다. 노인 둘, 아이 셋, 젊은 남녀 하나씩. 짐은 거의 없고 신발이 다 해졌다. 지도부가 결정을 기다린다. 다들 창고 장부를 한 번씩 본다.
  ai_direction: 받아들이면 무리의 입이 늘고(창고가 빨리 준다) 일손도 는다(텃밭·수색). 노인과 아이는 일손이 못 된다. 그 가운데 물린 사람이 섞였는지는 살펴봐야 안다. 지도부 사람들의 의견이 갈린다 (원칙대로 받아야 한다는 사람, 창고부터 보라는 사람).
  choices:
    - id: take_all
      label: 모두 받아들인다. 대신 들이기 전에 몸을 살핀다
      check: first_aid
      outcomes:
        success:
          - faction_population: { faction: own, delta: 7 }
          - set_flag: rf_taken_in
          - belief: { fact: 문 앞의 피난민 일곱을 모두 받아들였다. 들이기 전에 몸을 살폈고 물린 사람은 없었다, source: seen }
        partial:
          - faction_population: { faction: own, delta: 7 }
          - set_flag: rf_taken_in
          - belief: { fact: 피난민 일곱을 받아들였다. 노인 하나가 밤새 기침을 했다, source: seen }
        miss:
          - faction_population: { faction: own, delta: 6 }
          - set_flag: rf_taken_in
          - infested: 1
          - faction_morale: { faction: own, delta: -1 }
          - belief: { fact: 받아들인 피난민 가운데 물린 자국을 감춘 사람이 있었다. 사흘 만에 변해 담 안이 뒤집혔다, source: seen }
    - id: take_workers
      label: 일할 수 있는 둘만 들이고 나머지에게는 먹을 것을 쥐여 보낸다
      effects:
        - faction_population: { faction: own, delta: 2 }
        - faction_resource: { faction: own, resource: food, delta: -5 }
        - set_flag: rf_taken_in
        - belief: { fact: 피난민 가운데 젊은 둘만 받아들였다. 노인과 아이들은 먹을 것을 받아 들고 돌아섰다, source: seen }
    - id: turn_away
      label: 창고가 버티지 못한다. 돌려보낸다
      effects:
        - faction_morale: { faction: own, delta: -1 }
        - belief: { fact: 문 앞의 피난민 일곱을 돌려보냈다. 담 위에서 지켜보던 사람들이 말이 없었다, source: seen }

- id: rf_gate_witness
  title: 문 앞의 사람들
  tags: [world]
  repeatable: true
  cooldown_days: 20
  when:
    own_territory: true
    # 여울섬은 정문이 없다 (플레이 테스트 11)
    zones: [a_base, b_base, c_base, d_clinic, e_market]
    ranks: [grunt, staff, squad_leader]
    day_gte: 4
    segments: [morning, day, evening]
  setup: 정문 앞에 피난민 대여섯이 주저앉아 있다. 지도부는 아직 결정을 내리지 않았다. 문틈으로 아이 하나가 이쪽을 본다. 초소의 누군가 {scarce}도 모자란데 어쩌자는 거냐고 중얼거린다.
  ai_direction: 받아들이면 무리의 입과 손이 함께 는다 (계산은 시스템). 주인공은 결정할 자리가 아니지만, 지도부에 말을 넣거나 몰래 도울 수 있다. 몰래 돕다 걸리면 곤란해질 수 있다는 분위기를 비춘다.
  choices:
    - id: speak
      label: 지도부에 받아 주자고 말을 넣는다
      check: persuade
      outcomes:
        success:
          - faction_population: { faction: own, delta: 5 }
          - set_flag: rf_taken_in
          - merit: 1
          - belief: { fact: 지도부에 말을 넣어 문 앞의 피난민 다섯을 받아들이게 했다, source: seen }
        partial:
          - faction_population: { faction: own, delta: 2 }
          - set_flag: rf_taken_in
          - belief: { fact: 지도부는 피난민 가운데 둘만 받아들였다. 나머지는 돌려보냈다, source: seen }
        miss:
          - belief: { fact: 피난민을 받자는 말은 먹히지 않았다. 그들은 해 질 녘 돌아섰다, source: seen }
    - id: feed
      label: 문틈으로 아이에게 몰래 건빵을 건넨다
      when: { has_items: [dry_ration] }
      effects:
        - take_item: { item: dry_ration }
        - body: { track: nerves, delta: -1 }
        - belief: { fact: 문틈으로 피난민 아이에게 건빵을 건넸다. 아이는 고맙다는 말 대신 고개를 숙였다, source: seen }
    - id: watch
      label: 지켜보기만 한다
      effects:
        - belief: { fact: 문 앞의 피난민들이 결정을 기다리는 것을 지켜봤다, source: seen }

- id: rf_ears_among
  title: 새 얼굴 가운데 귀
  tags: [world]
  # 피난민을 다시 받으면 다시 열린다 (한 번뿐이면 두 번째 받아들인 뒤 플래그만 남는다)
  repeatable: true
  cooldown_days: 10
  weight: 3
  when:
    own_territory: true
    zones: [a_base, b_base, c_base, d_clinic, e_market, yeoul_isle]
    flags_all: [rf_taken_in]
    segments: [evening, night]
  setup: 받아들인 피난민 가운데 한 사람이 밤마다 담 쪽 창고 근처를 서성인다. 오늘은 초소 교대 시각을 손가락으로 세는 것 같았다.
  ai_direction: 그 사람은 다른 무리(가까운 적대 무리)가 들여보낸 귀다. 굶주린 피난민인 것도 사실이다. 붙잡으면 포로가 될 수 있고(handle_prisoner bind는 GM이 장면에 들인 뒤), 놓치면 창고가 털린다. 확정하기 전까지는 의심일 뿐이라는 것을 살린다.
  choices:
    - id: watch_close
      label: 몰래 뒤를 밟는다
      check: sense_danger
      outcomes:
        success:
          - clear_flag: rf_taken_in
          - merit: 1
          - belief: { fact: 받아들인 피난민 하나가 담 밖으로 초소 교대 시각을 흘리는 것을 잡았다. 다른 무리의 귀였다, source: seen }
        partial:
          - clear_flag: rf_taken_in
          - belief: { fact: 받아들인 피난민 하나가 밤에 담 밖 누군가와 손짓을 주고받았다. 다가가자 사라졌다, source: seen }
        miss:
          - clear_flag: rf_taken_in
          - faction_resource: { faction: own, resource: food, delta: -10 }
          - belief: { fact: 의심하던 피난민 하나가 밤사이 사라졌다. 창고 자물쇠가 부서져 있었다, source: seen }
    - id: let_be
      label: 굶주린 사람의 서성임일 뿐이다. 넘어간다
      effects:
        - clear_flag: rf_taken_in
        - belief: { fact: 밤마다 창고 근처를 서성이는 새 얼굴을 보고도 넘어갔다, source: seen }
