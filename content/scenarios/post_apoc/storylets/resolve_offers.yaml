# 다짐을 건네는 이야기 (12-164): 플레이 중 생기는 다짐. 받으면 주인공의 큰 줄기가 된다.
# 12-199: 다짐이 없을 때만 열린다 (품은 다짐을 덮어쓰지 않는다). 다짐을 이루거나 꺾인 뒤에 새 줄기를 건넨다

- id: rv_bury_comrade
  title: 거두지 못한 몸
  tags: [world]
  repeatable: true
  cooldown_days: 4
  when:
    funeral: true
    segments: [morning, day, evening]
  setup: "{deceased}의 몸은 아직 그가 쓰러진 곳에 있다고 한다. 거기까지 갈 사람은 없다는 말이 오간다."
  ai_direction: "가는 길이 위험하다는 것을 다들 안다. 누구도 가라고 하지 않는다. 다짐은 주인공이 스스로 하는 것이다."
  choices:
    - id: vow
      label: 내가 가서 묻어 주겠다고 한다
      effects:
        - resolve: { kind: bury, target: deceased, text: "{deceased}의 몸을 거두어 묻는다" }
    - id: no
      label: 산 사람이 먼저라고 말한다
      effects: []

- id: rv_rescue
  title: 돌아오지 않은 이름
  tags: [world]
  repeatable: true
  cooldown_days: 10
  when:
    own_people_captive: true
    own_territory: true
  cast:
    held: { faction: own, captive_anywhere: true, enter: false }
  setup: "{held}의 자리는 오늘도 비어 있다. 다들 그가 어디 붙잡혀 있는지 짐작만 한다."
  ai_direction: "위에서는 몸값이나 교환을 기다리자는 말이 나온다. 직접 빼 오는 것은 무모한 일이다. 받든 안 받든 주인공의 몫이다."
  choices:
    - id: vow
      label: 내 손으로 빼 오겠다고 다짐한다
      effects:
        - resolve: { kind: rescue, target: held, text: "붙잡힌 {held:을/를} 빼 온다" }
    - id: wait
      label: 위의 결정을 기다린다
      effects: []

- id: rv_cure
  title: 열이 오르는 사람
  tags: [world]
  repeatable: true
  cooldown_days: 8
  cast:
    sick: { companion: {}, condition: { track: infection, at_least: chill }, enter: false }
  setup: "{sick}의 이마가 뜨겁다. 물린 자리를 소매로 가리고 아무것도 아니라고 한다. 아무것도 아닌 게 아니라는 걸 둘 다 안다."
  ai_direction: "혈청 말고는 길이 없다는 것을 주인공은 들어서 안다. 혈청이 어디 있는지는 모른다. 시간은 많지 않다."
  choices:
    - id: vow
      label: 혈청을 구해 오겠다고 약속한다
      effects:
        - resolve: { kind: cure, target: sick, text: "{sick}에게 혈청을 구해 준다" }
    - id: silent
      label: 아무 말도 하지 못한다
      effects:
        - body: { track: nerves, delta: 1 }

- id: rv_island
  title: 남쪽의 목소리
  tags: [world]
  repeatable: false
  when:
    has_items: [radio]
    segments: [night]
  setup: "잡음 사이로 여자 목소리가 같은 말을 되풀이한다. \"…남쪽 섬… 받아 준다… 쓸모 있는 사람은…\" 그리고 끊긴다."
  ai_direction: "섬이 정말 낙원인지 주인공은 모른다. 다만 이 도시를 벗어날 길이 있다는 것만으로 무언가 달라진다."
  choices:
    - id: vow
      label: 언젠가 그 섬에 가 보겠다고 마음먹는다
      effects:
        - resolve: { kind: journey, target: yeoul_isle, text: "남쪽 섬, 여울섬에 가 본다" }
    - id: off
      label: 헛된 꿈이라며 끈다
      effects: []

- id: rv_heart
  title: 남은 시간
  tags: [world]
  repeatable: true
  cooldown_days: 12
  when:
    segments: [evening, night]
  cast:
    dear: { romance: suitor, here: true }
  setup: "{dear:이/가} 무심한 척 곁에 앉아 먹을 것을 조금 덜어 건넨다. 눈이 마주치자 먼저 고개를 돌린다."
  ai_direction: "{dear}의 마음은 코드가 정한 그대로다. 이 세상에 내일이 있는지 모른다는 것이 두 사람 다 걸린다."
  choices:
    - id: vow
      label: 이 사람 곁에 있겠다고 마음먹는다
      effects:
        - resolve: { kind: heart, target: dear, text: "{dear:과/와} 함께한다" }
        - relation: { who: dear, axis: affection, delta: 1 }
    - id: away
      label: 지금은 그럴 때가 아니라고 마음을 접는다
      effects: []

- id: rv_atone
  title: 등 뒤의 수군거림
  tags: [world]
  repeatable: true
  cooldown_days: 10
  when:
    own_territory: true
    own_distrust_gte: 2
  setup: "당신이 다가가면 사람들 사이에 한 칸씩 틈이 벌어진다. 수군거림이 등 뒤에서 멎었다가 다시 시작된다."
  ai_direction: "무리 사람들이 주인공을 믿지 않는다 (그럴 만한 일이 있었다). 씻는 데는 오래 걸린다. 말이 아니라 행동으로만."
  choices:
    - id: vow
      label: 다시 믿게 만들겠다고 다짐한다
      effects:
        - resolve: { kind: atone, n: 3, text: 무리 사람들이 다시 나를 믿게 만든다 }
    - id: shrug
      label: 믿든 말든 상관없다
      effects: []
