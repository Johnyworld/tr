  setup: "{dear:이/가} 잠들지 못하고 천장을 본다. \"요즘 무서워. 뭘 가지면 잃을 것도 생기잖아.\" 무엇을 말하는지 둘 다 안다."
  ai_direction: "{dear:은/는} 다가오는 것이 두렵다 (이 세상에서 사람을 잃어 본 적이 있다). 주인공이 마음을 털어놓으면 romance 도구로 이어 간다. 결과는 코드가 정한다. 대신 대답해 주지 않는다."
  choices:
