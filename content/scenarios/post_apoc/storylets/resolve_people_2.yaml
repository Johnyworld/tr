          - belief: { fact: "늙은 떠돌이가 {target:이/가} 쓰러진 쪽을 지나왔다. 길에 감염체가 얼마나 도는지 들었다", source: report }
        partial:
          - belief: { fact: "늙은 떠돌이가 {target:이/가} 쓰러진 쪽을 지나왔다고 했다. 자세한 건 기억하지 못했다", source: rumor }
