  ai_direction: "노인이 본 것만 말한다. 유해가 정말 그 자리에 있는지는 상태의 '묻히지 않은 유해'대로이고, 노인의 말은 소문이다. 가는 길의 위험은 그 구역의 위험대로. 지어낸 장소를 덧붙이지 않는다."
  choices:
