# 다짐에 다가가는 이야기: 사람, 둘째 묶음 (12-165). 주인공의 다짐이 그 갈래일 때만 열린다 (when.resolve).
# resolve_people.yaml에 더해 갈래마다 넷이 되게 채운다. 단계마다 다른 이야기: 처음(0) → 가운데(1) → 끝 무렵(2 이상).
# 이뤘는지는 코드가 상태로 정한다. 이야기는 알아내고, 찾아내고, 마음을 쌓고, 채비하는 길만 연다

# ── 찾기 (find) ──────────────────────────────────────────────

- id: rp2_find_porter
  title: 길을 많이 다닌 사람
  tags: [world]
  repeatable: true
  cooldown_days: 4
  when:
    resolve: { kinds: [find], stage: 0 }
    segments: [morning, day, evening]
  cast:
    porter: { extra: e_porter, label: 등짐을 진 상단 짐꾼 }
  setup: "{porter:이/가} 등짐을 내려놓고 물을 마신다. 상단 짐을 지고 이 도시의 구역을 다 돌아다닌 사람이다. 얼굴 하나 이름 하나를 기억하는 게 밥벌이라고 웃는다."
  ai_direction: "짐꾼은 {target:을/를} 직접 알지 못할 수도 있다. 판정 결과만큼만 기억해 낸다. 어디서 봤는지 지어내지 않는다 (믿음으로 남는 것이 전부다). 대가를 바라는 눈치다."
  choices:
    - id: describe
      label: 생김새와 버릇을 하나하나 말해 준다
      check: persuade
      outcomes:
        success:
          - resolve_step: { text: "{target}의 소식을 들었다" }
          - belief: { fact: "상단 짐꾼이 {target:과/와} 닮은 사람을 본 적이 있다고 했다. 살아서 걸어 다니더라고", source: rumor }
        partial:
          - belief: { fact: "상단 짐꾼이 {target:과/와} 비슷한 사람을 본 것 같다고 했다. 확실하지 않다", source: rumor }
        miss: []
    - id: pay
      label: 담배 한 갑을 쥐여 주고 다음에 보면 알려 달라고 한다
      effects:
        - take_item: { item: cigarettes }
        - relation: { who: porter, axis: trust, delta: 1 }
        - resolve_step: { text: "{target:을/를} 찾아 줄 눈을 하나 늘렸다" }

- id: rp2_find_crossed
  title: 엇갈린 걸음
  tags: [world]
  repeatable: true
  cooldown_days: 4
  when:
    resolve: { kinds: [find], stage_gte: 2 }
  cast:
    sought: { resolve_target: true, enter: false }
  setup: "한발 늦었다. {sought:이/가} 어제까지 이 근처에서 잤다는 말을 듣는다. 꺼진 모닥불 자리에 아직 재가 남아 있다."
  ai_direction: "{sought:은/는} 이 장면에 없다. 만남은 그 사람이 있는 곳에 주인공이 닿을 때 코드가 정한다. 흔적을 따라 어디로 갔는지는 판정 결과만큼만 (locate가 진짜 상태에서 채운다). 엇갈린 허탈함을 그린다."
  choices:
    - id: track
      label: 발자국과 흔적을 따라가 본다
      check: survival
      outcomes:
        success:
          - resolve_step: { text: "{sought:이/가} 간 곳을 안다" }
          - locate: { who: sought, source: seen }
        partial:
          - resolve_step: { text: "{sought:이/가} 지나간 흔적을 찾았다" }
          - body: { track: fatigue, delta: 1 }
        miss:
          - body: { track: fatigue, delta: 1 }
          - belief: { fact: "{sought}의 흔적을 쫓다 놓쳤다. 그래도 가까이 있다", source: seen }
    - id: wait
      label: 돌아올지 모르니 하룻밤 기다려 본다
      effects:
        - delay: 240
        - body: { track: nerves, delta: 1, chance: 0.5 }
        - belief: { fact: "{sought:이/가} 머물던 자리에서 밤새 기다렸지만 오지 않았다", source: seen }

# ── 구해 내기 (rescue) ───────────────────────────────────────

- id: rp2_rescue_escapee
  title: 빠져나온 사람
  tags: [world]
  repeatable: true
  cooldown_days: 4
  when:
    resolve: { kinds: [rescue], stage_gte: 1, stage_lte: 2 }
  cast:
    held: { resolve_target: true, enter: false, captive_anywhere: true }
    runner: { extra: refugee, label: 갇혔다 도망쳐 나온 사람 }
  setup: "{runner}의 손목에 아직 묶였던 자국이 남아 있다. {held:이/가} 갇힌 곳에서 혼자 빠져나왔다고 한다. 다시 그 얘기를 하고 싶지 않은 얼굴이다."
  ai_direction: "도망친 사람은 겁에 질려 있다. 아는 것은 자기가 빠져나온 길과 그 안의 하루뿐이다. {held}의 지금 몸 상태는 모른다 (지어내지 않는다). 빼내는 것은 잠입(infiltrate의 free)이나 교섭·포로 교환으로 한다."
  choices:
    - id: ask
      label: 어떻게 빠져나왔는지 조심스레 묻는다
      check: insight
      outcomes:
        success:
          - resolve_step: { text: "{held:이/가} 갇힌 곳에서 빠져나올 길을 안다" }
          - locate: { who: held, source: report }
          - belief: { fact: "{held:이/가} 갇힌 곳에서 도망쳐 나온 사람이 있다. 보초가 바뀌는 새벽에 뒤쪽이 빈다고 했다", source: report }
        partial:
          - resolve_step: { text: "{held:이/가} 갇힌 곳의 안쪽 사정을 들었다" }
        miss:
          - relation: { who: runner, axis: trust, delta: -1 }
    - id: feed
      label: 말린 식량을 나눠 주고 아무것도 묻지 않는다
      effects:
        - take_item: { item: dry_ration }
        - relation: { who: runner, axis: affection, delta: 2 }

- id: rp2_rescue_guard
  title: 졸음을 참는 보초
  tags: [world]
  repeatable: true
  cooldown_days: 5
  when:
    resolve: { kinds: [rescue], stage: 1 }
    segments: [evening, night]
  cast:
    held: { resolve_target: true, enter: false, captive_anywhere: true }
  setup: "{held:이/가} 갇힌 쪽에서 교대하고 내려온 보초가 불 옆에 주저앉는다. 말할 사람이 고팠던 얼굴이다. 술병이 반쯤 비었다."
  ai_direction: "보초는 상대를 의심하지 않는다 (아직은). 포로가 몇이고 언제 먹이는지, 교대가 언제인지를 판정 결과만큼만 흘린다. 들키면 소문이 갇힌 곳까지 간다."
  choices:
    - id: chat
      label: 같은 처지인 척 술잔을 받는다
      check: deceive
      outcomes:
        success:
          - resolve_step: { text: "{held:이/가} 갇힌 곳의 교대 시간을 안다" }
          - locate: { who: held, source: report }
        partial:
          - resolve_step: { text: "{held:이/가} 아직 살아 있다는 말을 들었다" }
        miss:
          - zone_noise: 1
          - belief: { fact: "보초에게 너무 많이 물었다. 그가 이쪽 얼굴을 기억할지 모른다", source: seen }
    - id: leave
      label: 괜히 엮이지 않고 자리를 뜬다
      effects: []

- id: rp2_rescue_word
  title: 기다리라는 말
  tags: [world]
  repeatable: false
  when:
    resolve: { kinds: [rescue], stage_gte: 2 }
  cast:
    held: { resolve_target: true, enter: false, captive_anywhere: true }
    porter: { extra: e_porter, label: 갇힌 곳에 짐을 대는 짐꾼 }
  setup: "{porter:이/가} 갇힌 곳에 끼니 짐을 대는 사람이라고 한다. 짐 사이에 쪽지 하나쯤은 끼워 넣을 수 있다고, 값만 맞으면."
  ai_direction: "쪽지가 {held}에게 닿았는지 주인공은 바로 알 수 없다. 이 장면은 구하러 간다는 것을 알리는 길. 풀려나는 것은 잠입·교섭·포로 교환으로만 (코드가 정한다)."
  choices:
    - id: note
      label: 통조림을 내밀고 쪽지를 맡긴다
      effects:
        - take_item: { item: canned_food }
        - relation: { who: held, axis: trust, delta: 1 }
        - resolve_step: { text: "{held}에게 기다리라는 말을 보냈다" }
    - id: no
      label: 짐꾼을 믿을 수 없다. 그만둔다
      effects:
        - belief: { fact: "{held}에게 말을 보낼 길이 있다. 갇힌 곳에 끼니를 대는 상단 짐꾼이다", source: report }

# ── 살려 내기 (cure) ─────────────────────────────────────────

- id: rp2_cure_clinic
  title: 진료소의 뒷문
  tags: [world]
  repeatable: true
  cooldown_days: 4
  when:
    resolve: { kinds: [cure], stage: 1 }
  cast:
    orderly: { extra: d_orderly, label: 진료소 뒷문에서 담배를 피우는 간호조무사 }
  setup: "{orderly:이/가} 벽에 기대 담배를 피운다. 하얀매 진료소에서 일한다고 한다. 진료소 앞문 줄은 아침부터 끝이 없다고 투덜댄다. 혈청 얘기를 꺼내자 그가 주위를 한 번 둘러본다."
  ai_direction: "하얀매는 혈청을 아무에게나 쓰지 않는다. 조무사는 줄을 세우는 사람이지 혈청을 주는 사람이 아니다. 누구에게 말을 넣어야 하는지까지만 안다. 혈청을 건네지 않는다."
  choices:
    - id: plead
      label: "{target}의 사정을 털어놓고 매달린다"
      check: persuade
      outcomes:
        success:
          - resolve_step: { text: "혈청을 두고 말을 넣을 사람을 안다" }
          - relation: { who: orderly, axis: trust, delta: 1 }
          - belief: { fact: "하얀매 진료소에서 혈청을 누구에게 쓸지는 위쪽 의사 한 사람이 정한다고 한다", source: report }
        partial:
          - relation: { who: orderly, axis: affection, delta: 1 }
        miss:
          - belief: { fact: "하얀매 진료소는 혈청 얘기를 꺼내면 입을 닫는다", source: seen }
    - id: smoke
      label: 담배를 한 개비 내밀며 말을 튼다
      effects:
        - take_item: { item: cigarettes }
        - relation: { who: orderly, axis: trust, delta: 1 }

- id: rp2_cure_price
  title: 목숨값
  tags: [world]
  repeatable: true
  cooldown_days: 5
  when:
    resolve: { kinds: [cure], stage_gte: 2 }
  cast:
    broker: { extra: e_escort, label: 말수 적은 상단 호위 }
  setup: "{broker:이/가} 낮게 말한다. 혈청 한 대를 구할 길이 있기는 하다고. 다만 값을 들으면 다들 돌아선다고."
  ai_direction: "값은 정하지 않는다. 혈청을 실제로 사고파는 것은 거래(barter)로, 값은 코드가 정한다. 이 장면은 누가 쥐고 있는지 아는 순간. 사기일 수도 있다는 낌새를 남긴다."
  choices:
    - id: who
      label: 누가 쥐고 있는지부터 캐묻는다
      check: insight
      outcomes:
        success:
          - resolve_step: { text: "혈청을 쥔 사람을 안다" }
          - belief: { fact: "나루상단 사람 하나가 혈청을 따로 쥐고 있다. 상단 장부에 올리지 않은 물건이라고 한다", source: report }
        partial:
          - resolve_step: { text: "혈청을 살 길이 있다는 것을 안다" }
        miss:
          - belief: { fact: "혈청을 판다는 말을 들었다. 사기일지도 모른다", source: rumor }
    - id: threaten
      label: 멱살을 잡고 다 말하라고 한다
      check: intimidate
      outcomes:
        success:
          - resolve_step: { text: "혈청을 쥔 사람을 안다" }
          - relation: { who: broker, axis: trust, delta: -2 }
        partial:
          - relation: { who: broker, axis: trust, delta: -2 }
          - deed: { summary: 혈청을 캐내려고 상단 호위의 멱살을 잡았다, tags: [cruelty], severity: 1, privacy: semi_private }
        miss:
          - wound: { steps: 1, cause: 상단 호위가 되받아쳤다 }
          - relation: { who: broker, axis: trust, delta: -3 }

# ── 지키기 (protect) ─────────────────────────────────────────

- id: rp2_protect_threat
  title: 그 사람을 노리는 말
  tags: [world]
  repeatable: true
  cooldown_days: 5
  when:
    resolve: { kinds: [protect], stage_lte: 1 }
    segments: [evening, night]
  cast:
    ward: { resolve_target: true, enter: false }
  setup: "벽 너머로 목소리 둘이 지나간다. {ward}의 이름이 나온다. 다음에 험한 일이 생기면 누구를 앞에 세울지 이야기하는 중이다."
  ai_direction: "말하는 사람들은 {ward:을/를} 미워하는 것이 아니다. 그저 누군가 앞에 서야 하고, 그게 {ward}일 뿐이다. 누구인지는 판정 결과만큼만 들린다. 위험을 미리 아는 것까지가 이 장면이다."
  choices:
    - id: listen
      label: 숨을 죽이고 끝까지 듣는다
      check: sense_danger
      outcomes:
        success:
          - resolve_step: { text: "{ward:을/를} 노리는 위험을 미리 안다" }
          - belief: { fact: "다음 험한 일에 {ward:을/를} 앞에 세우자는 말이 오갔다. 누가 그랬는지 목소리를 안다", source: seen }
        partial:
          - resolve_step: { text: "{ward:을/를} 노리는 말이 돈다는 것을 안다" }
        miss:
          - belief: { fact: "누군가 {ward}의 이름을 말했다. 끝까지 듣지 못했다", source: rumor }
    - id: step_in
      label: 문을 열고 들어가 그 이야기는 그만하라고 한다
      check: intimidate
      outcomes:
        success:
          - resolve_step: { text: "{ward:을/를} 앞에 세우자는 말을 막았다" }
        partial:
          - belief: { fact: "{ward:을/를} 감싸고 나섰다는 것을 사람들이 안다", source: seen }
        miss:
          - belief: { fact: "{ward:을/를} 감싸다 오히려 눈 밖에 났다", source: seen }

- id: rp2_protect_teach
  title: 혼자서도 버티는 법
  tags: [world]
  repeatable: true
  cooldown_days: 6
  when:
    resolve: { kinds: [protect], stage_gte: 2 }
    segments: [morning, day, evening]
  cast:
    ward: { resolve_target: true, here: true }
  setup: "언제까지 곁에 붙어 있을 수는 없다. {ward:은/는} 붕대를 거꾸로 감고 있다. 그걸 보는 순간 생각이 든다. 내가 없을 때 이 사람은 어떻게 버티지."
  ai_direction: "{ward:은/는} 배우는 것을 귀찮아하거나 자존심 상해할 수 있다 (성격대로). 지키는 것은 결국 그 사람이 살아남는 날로 코드가 정한다. 가르침이 몸에 붙는지는 판정대로."
  choices:
    - id: teach
      label: 피 멈추는 법부터 손에 쥐여 가르친다
      check: first_aid
      outcomes:
        success:
          - resolve_step: { text: "{ward}에게 혼자서 버티는 법을 가르쳤다" }
          - relation: { who: ward, axis: respect, delta: 1 }
        partial:
          - relation: { who: ward, axis: trust, delta: 1 }
        miss:
          - relation: { who: ward, axis: respect, delta: -1 }
    - id: bandage
      label: 붕대 한 묶음을 그 사람 짐에 넣어 둔다
      effects:
        - take_item: { item: bandage }
        - relation: { who: ward, axis: affection, delta: 1 }
        - resolve_step: { text: "{ward}의 짐에 붕대를 챙겨 넣었다" }

# ── 은혜 갚기 (repay) ────────────────────────────────────────

- id: rp2_repay_need
  title: 그 사람에게 없는 것
  tags: [world]
  repeatable: true
  cooldown_days: 4
  when:
    resolve: { kinds: [repay], stage: 0 }
  cast:
    savior: { resolve_target: true, enter: false }
  setup: "{savior}의 이야기가 나온다. 요즘 형편이 어렵다고, 무언가 걱정이 있는 눈치라고. 정작 본인은 누구에게도 말하지 않는다고."
  ai_direction: "{savior}의 걱정은 그 인물의 사정(프로필의 바람·두려움) 안에서 하나다. 새로 지어내지 않는다. 판정 결과만큼만 알게 된다. 갚을 길은 나중에 약속(promise)으로 맺는다."
  choices:
    - id: ask_around
      label: 주변 사람들에게 넌지시 묻고 다닌다
      check: insight
      outcomes:
        success:
          - resolve_step: { text: "{savior}에게 무엇이 필요한지 안다" }
          - belief: { fact: "{savior}에게 요즘 큰 걱정이 있다. 무엇인지 대략 안다", source: report }
        partial:
          - resolve_step: { text: "{savior}의 형편이 어렵다는 것을 안다" }
        miss:
          - belief: { fact: "{savior}의 사정을 캐묻고 다닌다는 말이 돌았다", source: rumor }
    - id: let_be
      label: 남의 사정을 캐는 건 도리가 아니다
      effects: []

- id: rp2_repay_hands
  title: 거드는 손
  tags: [world]
  repeatable: true
  cooldown_days: 5
  when:
    resolve: { kinds: [repay], stage: 1 }
    segments: [morning, day]
  cast:
    savior: { resolve_target: true, here: true }
  setup: "{savior:이/가} 혼자서 무거운 것을 옮기고 있다. 무너진 담의 돌인지, 물통인지. 허리를 펴다 당신을 보고 손사래를 친다. 괜찮다고."
  ai_direction: "{savior:은/는} 도움받는 것을 불편해한다. 은혜는 약속을 지켜야 갚는 것이다 (코드가 정한다). 이 장면은 곁에서 손을 보태는 하루."
  choices:
    - id: help
      label: 말없이 반대쪽을 붙든다
      check: athletics
      outcomes:
        success:
          - resolve_step: { text: "{savior}의 짐을 함께 졌다" }
          - relation: { who: savior, axis: trust, delta: 1 }
        partial:
          - relation: { who: savior, axis: affection, delta: 1 }
          - body: { track: fatigue, delta: 1 }
        miss:
