      label: 말없이 손을 보태 같이 고친다
      check: improvise
      outcomes:
        success:
          - relation: { who: dear, axis: respect, delta: 1 }
          - resolve_step: { text: "{dear:과/와} 함께 무언가를 고쳤다" }
        partial:
          - relation: { who: dear, axis: affection, delta: 1 }
        miss: []

