        - deed: { summary: 같은 동네 사람과 먹을 것을 나눴다, tags: [mercy], severity: 1, privacy: semi_private }
        - resolve_step: { text: "{target}의 옛 이웃을 만났다" }

- id: rs2_home_threshold
  title: 길목
  tags: [world]
  repeatable: true
  cooldown_days: 5
  when:
    resolve: { kinds: [homecoming], stage_gte: 2 }
    segments: [dawn, morning]
  setup: "높은 데 올라 {target} 쪽을 내려다본다. 낯익은 지붕선이 무너진 채로 남아 있다. 저 아래 어디쯤이 집이다. 가는 길에 무엇이 있을지는 여기서 다 보이지 않는다."
  variants:
    - "{target}까지 이어진 길이 안개 속에서 끊겼다 이어진다. 저 너머다. 발이 먼저 앞으로 나간다."
  ai_direction: "닿는 것은 코드가 정한다 ({target}에 들어서면). 이 장면은 들어갈 길을 고르는 순간. 집이 어떻게 됐는지, 길에 누가 있는지 지어내지 않는다. 판정 결과만큼만 보인다."
  choices:
    - id: scout
      label: 몸을 낮추고 들어갈 길을 살핀다
      check: sense_danger
      outcomes:
        success:
          - resolve_step: { text: "{target:으로/로} 들어갈 길목을 정했다" }
          - belief: { fact: "{target:으로/로} 가는 길목을 내려다봤다. 어디로 몸을 숨기며 들어갈지 봐 두었다", source: seen }
        partial:
          - belief: { fact: "{target:으로/로} 가는 길이 멀리서 보였다. 가까이는 잘 보이지 않았다", source: seen }
          - body: { track: fatigue, delta: 1 }
        miss:
          - zone_noise: 1
          - body: { track: nerves, delta: 1 }
    - id: remember
      label: 그때 다니던 지름길을 떠올린다
      check: history
      outcomes:
        success:
          - resolve_step: { text: "{target:으로/로} 가는 옛 지름길이 떠올랐다" }
        partial:
          - body: { track: nerves, delta: 1 }
        miss: []
