          - belief: { fact: "{target}에 살던 사람에게 옛 동네로 들어가는 길이 아직 다 막히진 않았다고 들었다", source: report }
        partial:
          - belief: { fact: "{target}에 살던 사람을 만났다. 동네는 많이 변했다고 한다", source: rumor }
