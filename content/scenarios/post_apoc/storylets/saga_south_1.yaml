# 큰 이야기 「남쪽의 배」: 예고편·시작 사건·1막 「R 도장」 (docs/saga-plan.md 11-3·11-4·12·13, sagas/south_ship.yaml)
# 시작 사건 셋은 자리가 맞는 하나가 열린다 (꼭 열리는 이야기). 무엇을 골라도 1막으로, 모른 척이면 기한 절반(rush)
# 1막 출발점: sb_daon_kept · sb_daon_jailed · sb_hunter_side · sb_daon_gone → 끝: sb_daon_stayed · sb_daon_handed · sb_daon_lost
# 섬에서는 열지 않는다 (뭍으로 나올 때까지 미룬다)

# ── 예고편 ─────────────────────────────
- id: sb0_flares
  title: 남쪽 하늘의 붉은 별
  tags: [saga]
  when:
    saga: { id: south_ship, acts: [open] }
    indoor: false
    segments: [night]
    zones_none: [yeoul_isle]
    flags_none: [sb_teaser]
  setup: 밤하늘 남쪽 끝에 붉은 불빛 하나가 솟아 천천히 떨어진다. 별이 아니다. 잠시 뒤 또 하나. 바다 쪽이다. 소리는 들리지 않는다.
  ai_direction: 조명탄이다. 주인공이 군대를 겪은 사람이면 알아본다. 무엇을 위한 것인지는 말하지 않는다. 곁에 사람이 있으면 "남쪽은 끝난 동네야" 같은 말을 흘린다. 짧게 지나가는 장면이다.
  choices:
    - id: watch
      label: 불빛이 사라질 때까지 남쪽 하늘을 본다
      effects:
        - set_flag: sb_teaser
        - belief: { fact: "밤에 남쪽 바다 쪽 하늘로 붉은 조명탄 두 발이 올랐다", source: seen }
    - id: turn_in
      label: 별일 아니라고 여기고 돌아선다
      effects:
        - set_flag: sb_teaser

# ── 시작 사건 ─────────────────────────────
- id: sb0_drain
  title: 배수로의 사람
  tags: [saga]
  party_story: false
  essential: true
  wakes: false
  when:
    saga: { id: south_ship, acts: [open] }
    in_faction: true
    own_territory: true
    # 안에 있어도 연다: 바깥에서만 열면 거점 안에서 지내는 날 이틀씩 늦었다 (PT42 세 판)
    indoor: "any"
    segments: [dawn, morning, day, evening]
    zones_none: [yeoul_isle]
  cast:
    daon: { ids: [sb_daon], afar: true }
  setup: 배수로 쪽에서 인기척이 난다. 거점 둘레 배수로 아래, 젖은 콘크리트에 누가 웅크려 있다. {daon:이/가} 고개를 든다. 젖은 군용 점퍼, 맨발, 오른 팔뚝을 소매로 꽉 감싸 쥐었다. "소리 지르지 마요. 금방 갈게요."
  ai_direction: 계다온이다. 이름은 묻기 전에는 말하지 않는다. 남쪽에서 밤새 걸어 올라왔다. 소매가 밀려 올라가면 팔뚝 안쪽에 지워지지 않는 잉크로 찍힌 "R 0412"가 보인다. 뭐냐고 물으면 "도장이요"라고만 한다. 계다온은 무리에 알려지는 것을 가장 무서워한다. 쫓는 사람이 있다는 것은 숨기지 않는다 ("정장 입은 아저씨가 와요. 착하게 굴어요. 그게 더 무서워"). 우리 무리에 알리는 것은 무리 사람으로서 자연스러운 길이고, 숨기는 것은 무리 몰래라 대가가 있을 수 있다.
  choices:
    - id: hide
      label: 먹을 것을 쥐여 주고 숨길 곳을 찾아 준다
      effects:
        - set_flag: sb_daon_kept
        - companion_join:
            who: daon
            kind: purpose
            until: { flag: sb_end_blocked }
        - relation: { who: daon, axis: trust, delta: 2 }
        - saga_advance: { id: south_ship, to: act_stamp }
        - saga_note: { text: "배수로에서 만난 여자를 무리 몰래 데리고 있다. 사냥꾼이 그를 쫓는다" }
    - id: report
      label: 무리에 알린다
      effects:
        - set_flag: sb_daon_jailed
        - npc_capture: { who: daon, by: own }
        - merit: 1
        - relation: { who: daon, axis: trust, delta: -2 }
        - saga_advance: { id: south_ship, to: act_stamp }
        - saga_note: { text: "무리가 도장 찍힌 여자를 가뒀다. 간부들이 어떻게 할지 정할 것이다. 우리 거점에서" }
    - id: ignore
      label: 못 본 척 지나간다
      effects:
        - set_flag: sb_daon_gone
        - saga_advance: { id: south_ship, to: act_stamp, rush: true }
        - saga_note: { text: "배수로의 여자는 밤사이 사라졌다. 남쪽 옛 항구에서 올라왔다는 말이 있었다 → 가람항 북부두", zone: south_port }

- id: sb0_wanted
  title: 팔뚝의 도장을 찾습니다
  tags: [saga]
  essential: true
  wakes: false
  when:
    saga: { id: south_ship, acts: [open] }
    indoor: "any"
    segments: [morning, day, evening]
    zone_owner: [other, none]
    zones_none: [yeoul_isle]
  cast:
    hunter: { ids: [sb_myeongcheol], afar: true }
  setup: 낡은 경찰 외투를 반듯하게 입은 사내가 모자를 벗고 다가온다. {hunter:은/는} 손바닥만 한 종이를 펴 보인다. 손으로 그린 팔뚝 그림, 안쪽에 "R"과 숫자. "실례지만, 이런 도장이 찍힌 젊은 여자를 보셨습니까. 사례는 하겠습니다. 탄으로."
  ai_direction: "함명철이다. 정중하고 말씨를 바꾸지 않는다. 사람 사냥이라는 것을 숨기지 않지만 \"돌아가야 할 사람을 데려가는 일\"이라고 말한다. 왜냐고 캐물으면 \"남쪽 집결지\"라는 말까지는 하고, 딸 이야기에서는 사진이 든 가슴 주머니를 손으로 덮고 말을 돌린다. 갈고리 단 빚쟁이를 잡는 상단 사람들과는 결이 다르다: 거칠지 않고, 협박하지 않는다."
  choices:
    - id: help
      label: 찾으면 알려 주겠다고 한다
      effects:
        - set_flag: sb_hunter_side
        - relation: { who: hunter, axis: trust, delta: 2 }
        - give_item: { item: pistol_rounds, quantity: 3 }
        - saga_advance: { id: south_ship, to: act_stamp }
        - saga_note: { text: "사냥꾼이 도장 찍힌 여자를 찾는 일을 맡겼다. 남쪽 옛 항구 쪽에서 올라왔다고 한다 → 가람항 북부두", zone: south_port }
    - id: press
      label: 그 도장이 무엇이고 왜 쫓는지 캐묻는다
      check: insight
      outcomes:
        success:
          - set_flag: sb_daon_gone
          - set_flag: sb_hunter_daughter_hint
          - belief: { fact: "함명철은 남쪽 가람항 집결지에서 도망친 R을 데려가는 일을 한다. 딸 이야기가 나오자 가슴 주머니의 사진을 손으로 덮었다", source: seen }
          - saga_advance: { id: south_ship, to: act_stamp }
          - saga_note: { text: "사냥꾼은 집결지에서 도망친 R을 쫓는다. 그 여자는 남쪽 옛 항구 쪽에서 올라왔다고 한다 → 가람항 북부두", zone: south_port }
        partial:
          - set_flag: sb_daon_gone
          - relation: { who: hunter, axis: trust, delta: -1 }
          - belief: { fact: "함명철은 '남쪽 집결지'에서 왔다고만 했다. 더 물으니 모자를 쓰고 자리를 떴다", source: seen }
          - saga_advance: { id: south_ship, to: act_stamp }
          - saga_note: { text: "도장 찍힌 여자는 남쪽 옛 항구 쪽에서 올라왔다고 한다 → 가람항 북부두", zone: south_port }
        miss:
          - set_flag: sb_daon_gone
          - relation: { who: hunter, axis: trust, delta: -1 }
          - saga_advance: { id: south_ship, to: act_stamp }
          - saga_note: { text: "정장 입은 사냥꾼이 도장 찍힌 여자를 찾는다. 남쪽 옛 항구 쪽이라고 했다 → 가람항 북부두", zone: south_port }
    - id: ignore
      label: 모른다고 하고 지나간다
      effects:
        - set_flag: sb_daon_gone
        - saga_advance: { id: south_ship, to: act_stamp, rush: true }
        - saga_note: { text: "사냥꾼이 도장 찍힌 여자를 찾는다. 남쪽 옛 항구 쪽이라고 했다 → 가람항 북부두", zone: south_port }

- id: sb0_campfire
  title: 모닥불로 온 사람
  tags: [saga]
  essential: true
  when:
    saga: { id: south_ship, acts: [open] }
    indoor: false
    segments: [evening, night]
    zone_owner: [none, other]
    zones_none: [yeoul_isle]
  cast:
    daon: { ids: [sb_daon], afar: true }
  setup: 어둠 속에서 자갈 밟는 소리. {daon:이/가} 두 손을 펴 보이며 불빛 안으로 들어온다. "먹을 거 있으면 조금만. 갚을게요." 그 뒤로 멀리, 손전등 불빛 하나가 이쪽으로 흔들리며 다가온다.
  ai_direction: 계다온이다. 손전등은 함명철이다 (아직 멀다). 계다온은 소매로 팔뚝을 감싼 채 불을 등지고 앉는다. 쫓기고 있다는 것을 숨기지 않는다. 선택을 서두르게 하지 않되, 불빛은 천천히 가까워진다.
  choices:
    - id: hide
      label: 불을 덮고 같이 어둠 속에 숨는다
      effects:
        - set_flag: sb_daon_kept
        - companion_join:
            who: daon
            kind: purpose
            until: { flag: sb_end_blocked }
        - relation: { who: daon, axis: trust, delta: 2 }
        - saga_advance: { id: south_ship, to: act_stamp }
        - saga_note: { text: "모닥불로 온 여자와 함께 있다. 손전등을 든 사냥꾼이 그를 쫓는다" }
    - id: hand_over
      label: 불빛 쪽으로 손을 흔들어 부른다
      effects:
        - set_flag: sb_hunter_side
        - set_flag: sb_daon_handed
        - npc_depart: { who: daon }
        - deed: { summary: "쫓기던 여자를 사냥꾼에게 넘겼다", tags: [betrayal], severity: 1, privacy: private }
        - saga_advance: { id: south_ship, to: act_blood }
        - saga_note: { text: "사냥꾼은 여자를 남쪽 집결지로 데려갔다. 집결지가 무엇을 하는 곳인지 아직 모른다" }
    - id: send_away
      label: 먹을 것만 쥐여 주고 가라고 한다
      effects:
        - set_flag: sb_daon_gone
        - give_item: { item: dry_ration, from: daon, quantity: 1 }
        - saga_advance: { id: south_ship, to: act_stamp, rush: true }
        - saga_note: { text: "모닥불의 여자는 남쪽 옛 항구 쪽으로 사라졌다 → 가람항 북부두", zone: south_port }

# ── 1막 「R 도장」 ─────────────────────────────
- id: sb1_needle_mark
  title: 피 뽑힌 자리
  tags: [saga]
  when:
    indoor: "any"
    saga: { id: south_ship, acts: [act_stamp] }
    flags_all: [sb_daon_kept]
    flags_none: [sb1_heard]
    segments: [evening, night]
  cast:
    daon: { ids: [sb_daon] }
  setup: 불 곁에서 {daon:이/가} 처음으로 소매를 걷는다. 팔뚝 안쪽에 "R 0412", 그 아래 바늘 자국이 점점이 겹쳐 있다. "주마다. 세다 말았어요."
  ai_direction: 계다온이 막사 이야기를 한다. 손가락 피 한 방울로 줄을 나눈 것, 오른쪽 줄은 철조망 안 막사, 주마다 군의관이 피를 뽑는 것, 배가 오는 밤 조명탄, 배에는 R만 탄다는 것. 동생 이야기는 믿는 사람에게만 (관계가 충분하면 "솔이가 한 달 먼저 탔어"). 군의관 이름은 모른다고 한다 ("흰머리, 숫자로 말하는 사람").
  choices:
    - id: listen
      label: 끝까지 듣는다
      check: persuade
      outcomes:
        success:
          - set_flag: sb1_heard
          - set_flag: ow_south_truth
          - relation: { who: daon, axis: trust, delta: 1 }
          - belief: { fact: "계다온이 말했다: 남쪽 가람항 집결지는 피 한 방울로 R을 가려 철조망 안 막사에 두고 주마다 피를 뽑는다. 배가 오는 밤 조명탄이 오르고, 배에는 R만 탄다. 남동생 계솔이 한 달 먼저 배에 탔다", source: report }
          - saga_note: { text: "{daon:은/는} 남쪽 집결지에서 피를 뽑혔다고 했다. 동생이 먼저 배에 탔다. 사냥꾼이 쫓고 있다" }
        partial:
          - set_flag: sb1_heard
          - set_flag: ow_south_truth
          - belief: { fact: "계다온이 말했다: 남쪽 집결지는 R을 가려 막사에 두고 피를 뽑는다. 배에는 R만 탄다", source: report }
          - saga_note: { text: "{daon:은/는} 남쪽 집결지에서 피를 뽑혔다고 했다. 사냥꾼이 쫓고 있다" }
        miss:
          - set_flag: sb1_heard
          - belief: { fact: "계다온은 막사와 바늘 이야기를 하다 입을 닫았다. '나중에요.'", source: seen }
    - id: leave_it
      label: 소매를 내려 주고 묻지 않는다
      effects:
        - set_flag: sb1_heard
        - relation: { who: daon, axis: affection, delta: 1 }

- id: sb1_found_out
  title: 숨긴 것이 들킨다
  tags: [saga]
  when:
    indoor: "any"
    saga: { id: south_ship, acts: [act_stamp], spine: true }
    flags_all: [sb_daon_kept]
    flags_none: [sb1_found]
    in_faction: true
    own_territory: true
  cast:
    daon: { ids: [sb_daon] }
    mate: { faction: own, known: true, here: true }
  setup: "{mate:이/가} 낯선 발자국과 숨겨 둔 먹을 것을 손가락으로 가리킨다. \"누구야. 우리 사람 아니지?\""
  ai_direction: 무리 사람이 계다온의 흔적을 찾았다. 둘러대려면 판정, 털어놓으면 무리의 판단에 맡기는 것이다 (우두머리가 받아 줄 수도). 숨긴 일이 들키면 무리의 규율대로 대가가 있다 (시스템의 규율 장치). 계다온은 들키는 순간 도망칠 준비를 한다.
  choices:
    - id: bluff
      label: 지나가던 떠돌이 흔적이라고 둘러댄다
      check: deceive
      outcomes:
        success:
          - set_flag: sb1_found
          - saga_note: { text: "무리 사람의 눈을 한 번 넘겼다. 사냥꾼이 아직 쫓는다" }
        partial:
          - set_flag: sb1_found
          - relation: { who: mate, axis: trust, delta: -1 }
          - saga_note: { text: "무리 사람이 의심한다. {daon:을/를} 오래 숨기기는 어렵다" }
        miss:
          - set_flag: sb1_found
          - relation: { who: mate, axis: trust, delta: -2 }
          - deed: { summary: "무리 몰래 낯선 사람을 숨겼다", tags: [disobedience], severity: 1, privacy: semi_private }
          - saga_note: { text: "숨긴 것이 무리에 들켰다. {daon:을/를} 어떻게 할지 무리가 정할 것이다" }
    - id: confess
      label: 털어놓고 {daon:을/를} 받아 달라고 청한다
      check: persuade
      outcomes:
        success:
          - set_flag: sb1_found
          - set_flag: sb_daon_stayed
          - npc_depart: { who: daon, to_faction: own }
          - relation: { who: mate, axis: respect, delta: 1 }
          - saga_advance: { id: south_ship, to: act_blood }
          - saga_note: { text: "무리가 {daon:을/를} 받아 주었다. {daon:이/가} 말한 집결지와 혈청이 무엇인지 맞춰 볼 때다" }
        partial:
          - set_flag: sb1_found
          - relation: { who: mate, axis: trust, delta: -1 }
          - saga_note: { text: "무리가 {daon:을/를} 지켜보기로 했다. 사냥꾼이 오면 넘기자는 사람도 있다" }
        miss:
          - set_flag: sb1_found
          - set_flag: sb_daon_jailed
          - companion_leave: { who: daon }
          - npc_capture: { who: daon, by: own }
          - saga_note: { text: "무리가 {daon:을/를} 가뒀다. 간부들이 사냥꾼에게 넘길지 정할 것이다. 우리 거점에서" }
    - id: move_out
      label: "{daon:을/를} 거점 밖 다른 곳으로 옮긴다"
      effects:
        - set_flag: sb1_found
        - saga_note: { text: "{daon:을/를} 거점 밖으로 옮겼다. 사냥꾼이 아직 쫓는다" }

- id: sb1_jailed
  title: 갇힌 R
  tags: [saga]
  when:
    indoor: "any"
    saga: { id: south_ship, acts: [act_stamp], spine: true }
    flags_all: [sb_daon_jailed]
    in_faction: true
    own_territory: true
  cast:
    daon: { ids: [sb_daon], captive_anywhere: true, enter: false }
    boss: { commander: true, comes: true }
  setup: "{boss:이/가} 가둔 여자 이야기를 꺼낸다. \"남쪽에서 온 사냥꾼이 탄을 주겠다고 했다더군. 너는 어떻게 보나.\""
  ai_direction: 간부들은 엇갈린다. 탄은 아쉽고, 사람을 파는 것은 꺼림칙하다. 주인공의 말이 무게를 갖는다. 밤에 몰래 풀어 주는 길도 있다 (들키면 무리의 규율대로). 갇힌 계다온은 이 장면에 없다.
  choices:
    - id: let_them
      label: 무리가 정할 일이라고 한다
      effects:
        - set_flag: sb_daon_handed
        - npc_depart: { who: daon }
        - saga_advance: { id: south_ship, to: act_blood }
        - saga_note: { text: "무리가 {daon:을/를} 사냥꾼에게 넘겼다. 사냥꾼은 탄을 내놓고 남쪽으로 갔다" }
    - id: argue
      label: 사람을 탄과 바꾸지 말자고 말한다
      check: persuade
      outcomes:
        success:
          - set_flag: sb_daon_stayed
          - npc_release: { who: daon }
          - npc_depart: { who: daon, to_faction: own }
          - relation: { who: boss, axis: respect, delta: 1 }
          - saga_advance: { id: south_ship, to: act_blood }
          - saga_note: { text: "무리가 {daon:을/를} 받아 주었다. {daon:이/가} 말한 집결지와 혈청이 무엇인지 맞춰 볼 때다" }
        partial:
          - relation: { who: boss, axis: trust, delta: -1 }
          - saga_note: { text: "간부들이 아직 정하지 못했다. 사냥꾼이 다시 오면 넘길 것이다" }
        miss:
          - set_flag: sb_daon_handed
          - npc_depart: { who: daon }
          - relation: { who: boss, axis: trust, delta: -1 }
          - saga_advance: { id: south_ship, to: act_blood }
          - saga_note: { text: "무리가 {daon:을/를} 사냥꾼에게 넘겼다. 사냥꾼은 남쪽으로 갔다" }
    - id: free_her
      label: 밤에 몰래 풀어 주겠다고 마음먹는다 (말하지 않는다)
      check: stealth
      outcomes:
        success:
          - set_flag: sb_daon_kept
          - npc_release: { who: daon }
          - companion_join:
              who: daon
              kind: purpose
              until: { flag: sb_end_blocked }
          - relation: { who: daon, axis: trust, delta: 3 }
          - saga_note: { text: "밤에 {daon:을/를} 빼냈다. 무리도 사냥꾼도 그를 찾는다" }
        partial:
          - set_flag: sb_daon_kept
          - npc_release: { who: daon }
          - companion_join:
              who: daon
              kind: purpose
              until: { flag: sb_end_blocked }
          - deed: { summary: "무리가 가둔 사람을 몰래 풀어 주었다", tags: [disobedience, mercy], severity: 2, privacy: semi_private }
          - saga_note: { text: "{daon:을/를} 빼냈지만 누군가 보았다. 무리도 사냥꾼도 그를 찾는다" }
        miss:
          - deed: { summary: "무리가 가둔 사람을 풀어 주려다 들켰다", tags: [disobedience], severity: 2, privacy: public }
          - saga_note: { text: "풀어 주려다 들켰다. {daon:은/는} 아직 갇혀 있다" }

- id: sb1_with_hunter
  title: 사냥꾼의 동행
  tags: [saga]
  when:
    indoor: "any"
    saga: { id: south_ship, acts: [act_stamp], spine: true }
    flags_all: [sb_hunter_side]
    flags_none: [sb_daon_handed]
    zones: [south_port, south_fields, e_market]
  cast:
    hunter: { ids: [sb_myeongcheol], afar: true }
    daon: { ids: [sb_daon], afar: true, enter: false }
  setup: "{hunter:이/가} 진흙에 찍힌 맨발 자국 앞에 쭈그려 앉는다. \"여깁니다.\" 일어서다 말고 가슴 주머니의 사진을 꺼내 한참 본다. 컨테이너 사이에서 숨죽인 기척이 난다."
  ai_direction: 함명철과 흔적을 쫓아 계다온이 숨은 곳에 닿았다. 함명철은 끝까지 정중하다. 사진을 물으면 처음에는 피한다. 관계가 충분하면 딸 이야기를 한다. 계다온을 찾으면 넘길지, 마지막에 등을 돌릴지는 주인공의 몫이다.
  choices:
    - id: finish
      label: 끝까지 돕는다
      effects:
        - set_flag: sb_daon_handed
        - npc_depart: { who: daon }
        - give_item: { item: pistol_rounds, from: hunter, quantity: 4 }
        - relation: { who: hunter, axis: trust, delta: 1 }
        - deed: { summary: "도망친 R을 사냥꾼과 함께 잡아 넘겼다", tags: [cruelty], severity: 1, privacy: semi_private }
        - saga_advance: { id: south_ship, to: act_blood }
        - saga_note: { text: "{daon:은/는} 남쪽 집결지로 끌려갔다. 사냥꾼이 사례를 남겼다. 집결지가 무엇을 하는 곳인지 아직 모른다" }
    - id: ask_photo
      label: 사진 속 사람이 누구냐고 묻는다
      check: insight
      outcomes:
        success:
          - set_flag: sb_hunter_secret
          - relation: { who: hunter, axis: affection, delta: 1 }
          - belief: { fact: "함명철의 딸 함지수는 R이라 남쪽 집결지에 맡겨졌다. 함명철은 도망친 R을 데려가는 값으로 딸의 소식을 받는다", source: report }
          - saga_note: { text: "사냥꾼은 딸 소식을 받으려고 R을 쫓는다. {daon:은/는} 컨테이너 사이에 숨어 있다" }
        partial:
          - belief: { fact: "함명철의 사진 속에는 짙은 눈썹의 앳된 여자가 있었다. '딸입니다.' 그 말뿐이었다", source: seen }
        miss:
          - relation: { who: hunter, axis: trust, delta: -1 }
    - id: turn
      label: "{daon} 쪽으로 돌아선다"
      effects:
        - set_flag: sb_daon_kept
        - companion_join:
            who: daon
            kind: purpose
            until: { flag: sb_end_blocked }
        - relation: { who: hunter, axis: trust, delta: -3 }
        - relation: { who: daon, axis: trust, delta: 2 }
        - saga_note: { text: "사냥꾼에게 등을 돌리고 {daon} 편에 섰다. 사냥꾼이 다시 올 것이다" }

- id: sb1_knock
  title: 문 두드리는 사냥꾼
  tags: [saga]
  when:
    indoor: "any"
    saga: { id: south_ship, acts: [act_stamp], spine: true }
    flags_any: [sb_daon_kept, sb_daon_jailed]
    flags_none: [sb_hunter_once, sb_daon_handed, sb_daon_stayed]
  cast:
    hunter: { ids: [sb_myeongcheol], afar: true }
  setup: "{hunter:이/가} 모자를 벗어 든 채 서 있다. \"그 여자가 여기 있는 줄 압니다. 값은 넉넉히 치르겠습니다. 저도 이 일이 좋아서 하는 게 아닙니다.\""
  ai_direction: 함명철이 찾아왔다. 정중하게 값을 부른다. 넘기면 사례를 주고 떠난다. 속이려면 판정. 내쫓으면 "사흘 뒤 다시 오겠습니다"라며 물러난다 (위협하면 싸움이 될 수 있지만 그는 총을 마지막에 꺼낸다). 계다온이 곁에 있으면 숨을 죽인다.
  choices:
    - id: hand
      label: 도장 찍힌 여자를 넘긴다
      effects:
        - set_flag: sb_daon_handed
        - give_item: { item: pistol_rounds, from: hunter, quantity: 4 }
        - deed: { summary: "숨겨 주던 사람을 사냥꾼에게 넘겼다", tags: [betrayal], severity: 2, privacy: semi_private }
        - saga_note: { text: "도장 찍힌 여자를 넘겼다. 사냥꾼은 남쪽으로 데려간다고 했다" }
    - id: fool
      label: 그런 사람은 이미 떠났다고 속인다
      check: deceive
      outcomes:
        success:
          - set_flag: sb_hunter_once
          - saga_note: { text: "사냥꾼을 속여 보냈다. 사흘 뒤 다시 올 것이다" }
        partial:
          - set_flag: sb_hunter_once
          - relation: { who: hunter, axis: trust, delta: -1 }
          - saga_note: { text: "사냥꾼은 믿지 않는 눈치로 물러났다. 사흘 뒤 다시 온다고 했다" }
        miss:
          - set_flag: sb_hunter_once
          - relation: { who: hunter, axis: trust, delta: -2 }
          - saga_note: { text: "사냥꾼은 다 안다는 얼굴이었다. 사흘 뒤 다시 온다고 했다" }
    - id: drive_off
      label: 돌아가라고 문을 막아선다
      check: intimidate
      outcomes:
        success:
          - set_flag: sb_hunter_once
          - relation: { who: hunter, axis: respect, delta: 1 }
          - saga_note: { text: "사냥꾼을 돌려보냈다. 사흘 뒤 다시 오겠다고 했다" }
        partial:
          - set_flag: sb_hunter_once
          - relation: { who: hunter, axis: trust, delta: -1 }
          - saga_note: { text: "사냥꾼이 물러났다. 사흘 뒤 사람을 더 데려올지도 모른다" }
        miss:
          - set_flag: sb_hunter_once
          - relation: { who: hunter, axis: trust, delta: -2 }
          - wound: { steps: 1, cause: "사냥꾼과 몸싸움" }
          - saga_note: { text: "몸싸움 끝에 사냥꾼이 물러났다. 사흘 뒤 다시 온다" }

- id: sb1_knock_handed
  title: 사냥꾼의 사례
  tags: [saga]
  essential: true
  when:
    indoor: "any"
    saga: { id: south_ship, acts: [act_stamp] }
    flags_all: [sb_daon_handed]
  cast:
    daon: { ids: [sb_daon], afar: true }
  setup: "{daon:은/는} 묶인 손을 내려다본 채 한 번도 고개를 들지 않는다. 사냥꾼이 그를 앞세워 남쪽 길로 걸어간다."
  ai_direction: 넘긴 뒤의 짧은 장면이다. 계다온은 원망하지 않는다. 그게 더 무겁다. 남쪽 길 끝에 조명탄 자국 같은 그을음이 남아 있다.
  choices:
    - id: watch_go
      label: 둘이 사라질 때까지 본다
      effects:
        - npc_depart: { who: daon }
        - body: { track: nerves, delta: 1 }
        - saga_advance: { id: south_ship, to: act_blood }
    - id: turn_back
      label: 돌아서서 걸음을 옮긴다
      effects:
        - npc_depart: { who: daon }
        - saga_advance: { id: south_ship, to: act_blood }

- id: sb1_knock_again
  title: 다시 온 사냥꾼
  tags: [saga]
  when:
    indoor: "any"
    saga: { id: south_ship, acts: [act_stamp], spine: true }
    flags_all: [sb_hunter_once]
    flags_none: [sb_daon_handed, sb_daon_stayed]
    after_storylet: { id: sb1_knock, hours: 48 }
  cast:
    hunter: { ids: [sb_myeongcheol], afar: true }
  setup: "{hunter:이/가} 약속한 대로 다시 왔다. 이번에는 모자를 벗지 않는다. \"마지막으로 여쭙겠습니다.\""
  ai_direction: 두 번째 방문이다. 함명철은 지쳐 있다. 또 물리치면 그는 이 여자를 포기하고 다른 R을 쫓으러 간다 (계다온은 남는다). 딸 이야기를 알면 그 말로 흔들 수 있다.
  choices:
    - id: hold
      label: 이번에도 돌려보낸다
      check: persuade
      outcomes:
        success:
          - set_flag: sb_daon_stayed
          - relation: { who: hunter, axis: respect, delta: 1 }
          - saga_advance: { id: south_ship, to: act_blood }
          - saga_note: { text: "사냥꾼이 도장 찍힌 여자를 포기했다. 도장 찍힌 여자가 말한 집결지와 혈청이 무엇인지 맞춰 볼 때다" }
        partial:
          - set_flag: sb_daon_stayed
          - relation: { who: hunter, axis: trust, delta: -2 }
          - saga_advance: { id: south_ship, to: act_blood }
          - saga_note: { text: "사냥꾼이 이를 악물고 물러났다. 도장 찍힌 여자는 남았다. 집결지와 혈청이 무엇인지 맞춰 볼 때다" }
        miss:
          - set_flag: sb_daon_stayed
          - wound: { steps: 1, cause: "사냥꾼과 몸싸움" }
          - saga_advance: { id: south_ship, to: act_blood }
          - saga_note: { text: "몸싸움 끝에 사냥꾼이 물러났다. 도장 찍힌 여자는 남았다" }
    - id: give_up
      label: 도장 찍힌 여자를 넘긴다
      effects:
        - set_flag: sb_daon_handed
        - give_item: { item: pistol_rounds, from: hunter, quantity: 4 }
        - deed: { summary: "숨겨 주던 사람을 사냥꾼에게 넘겼다", tags: [betrayal], severity: 2, privacy: semi_private }
        - saga_note: { text: "도장 찍힌 여자를 넘겼다. 사냥꾼은 남쪽으로 데려간다고 했다" }

- id: sb1_trail
  title: 남쪽으로 난 발자국
  tags: [saga]
  when:
    saga: { id: south_ship, acts: [act_stamp], spine: true }
    flags_all: [sb_daon_gone]
    flags_none: [sb_daon_kept, sb_daon_handed, sb_daon_lost]
    zones: [south_port]
    indoor: false
  setup: 컨테이너 사이 진흙에 맨발 자국이 이어지다 해안길 쪽으로 꺾인다. 바리케이드 너머 멀리, 철조망을 따라 불빛이 늘어서 있다. 발자국은 냉동 창고 쪽과 바다 쪽으로 갈린다.
  ai_direction: 처음 보는 남쪽의 철조망 불빛이다. 저 너머가 계다온이 말한 (또는 사냥꾼이 말한) 집결지다. 군대는 보이지 않는다. 냉동 창고 쪽을 고르면 계다온과 다시 만날 수 있다 (발자국을 끝까지 쫓았다). 바다 쪽 발자국은 물가에서 끊긴다.
  choices:
    - id: cold_store
      label: 냉동 창고 쪽 발자국을 쫓는다
      check: survival
      outcomes:
        success:
          - set_flag: sb_daon_found
          - belief: { fact: "가람항 북부두 냉동 창고 안에 누가 숨어 지낸 흔적이 있었다. 남쪽 해안길 끝 너머로 철조망 불빛이 늘어서 있다", source: seen }
          - saga_note: { text: "도장 찍힌 여자는 북부두 냉동 창고에 숨어 있다. 저녁이나 밤에 → 가람항 북부두", zone: south_port }
        partial:
          - set_flag: sb_daon_found
          - saga_note: { text: "발자국이 냉동 창고 앞에서 흐려졌다. 저녁이나 밤에 다시 와 볼 만하다 → 가람항 북부두", zone: south_port }
        miss:
          - set_flag: sb_daon_lost
          - saga_advance: { id: south_ship, to: act_blood }
          - saga_note: { text: "발자국을 놓쳤다. 남쪽 철조망 불빛만 남았다. 저 너머가 무엇인지 맞춰 볼 때다" }
    - id: sea
      label: 바다 쪽 발자국을 따라간다
      effects:
        - set_flag: sb_daon_lost
        - belief: { fact: "가람항 북부두에서 맨발 자국이 바닷물 앞에서 끊겼다. 남쪽 해안길 끝 너머로 철조망 불빛이 늘어서 있다", source: seen }
        - saga_advance: { id: south_ship, to: act_blood }
        - saga_note: { text: "발자국이 바다 앞에서 끊겼다. 남쪽 철조망 불빛만 남았다. 저 너머가 무엇인지 맞춰 볼 때다" }

- id: sb1_cold_store
  title: 냉동 창고의 숨소리
  tags: [saga]
  when:
    indoor: "any"
    saga: { id: south_ship, acts: [act_stamp] }
    flags_all: [sb_daon_found]
    flags_none: [sb_daon_kept, sb_daon_lost, sb_daon_handed]
    zones: [south_port]
    segments: [evening, night]
  cast:
    daon: { ids: [sb_daon], afar: true }
  setup: 냉동 창고의 두꺼운 문을 밀자 어둠 속에서 숨을 멈추는 기척. {daon:이/가} 쇠막대를 쥐고 구석에 웅크려 있다. "가까이 오지 마요."
  ai_direction: 계다온이다. 사냥꾼이 보낸 사람인지부터 의심한다. 먹을 것을 건네거나 사냥꾼과 상관없다는 것을 보이면 쇠막대를 내린다.
  choices:
    - id: take_in
      label: 먹을 것을 내밀고 같이 가자고 한다
      effects:
        - set_flag: sb_daon_kept
        - companion_join:
            who: daon
            kind: purpose
            until: { flag: sb_end_blocked }
        - relation: { who: daon, axis: trust, delta: 2 }
        - saga_note: { text: "냉동 창고의 {daon:과/와} 함께 있다. 사냥꾼이 그를 쫓는다" }
    - id: leave_her
      label: 문을 닫고 돌아선다
      effects:
        - set_flag: sb_daon_lost
        - saga_advance: { id: south_ship, to: act_blood }
        - saga_note: { text: "{daon:을/를} 냉동 창고에 두고 왔다. 남쪽 철조망 불빛이 무엇인지 맞춰 볼 때다" }

# ── 계승자 (1막) ─────────────────────────────
- id: sbh_stamp
  title: 앞사람이 쫓던 일
  tags: [saga]
  essential: true
  when:
    indoor: "any"
    saga: { id: south_ship, acts: [act_stamp], successor: true }
  cast:
    hunter: { ids: [sb_myeongcheol], afar: true }
  setup: "{hunter:이/가} 모자를 벗고 다가온다. \"이 동네에 저와 얽혔던 분이 있었습니다. 도장 찍힌 여자 일로요. 그분은 이제 없더군요. 이제 그 일이 누구 손에 남았는지 궁금해서요.\""
  ai_direction: 계승자에게 큰 이야기를 다시 잇는 장면이다. 함명철은 앞 주인공과 얽혔던 일을 정중하게 말한다 (팔뚝에 R 도장이 찍힌 여자, 남쪽 집결지). 새 주인공은 이 일을 모른다. 함명철 편에 설지, 여자를 찾아 나설지는 자유다.
  choices:
    - id: hear
      label: 그 일을 듣는다
