- id: sb3_ledger
  title: 길판수의 장부
  tags: [saga]
  when:
    saga: { id: south_ship, acts: [act_offer] }
    zones: [e_market, rest_stop]
    indoor: "any"
    flags_none: [sb3_ledger]
  cast:
    broker: { ids: [rs_pansu], afar: true }
    marked: { saga_marked: true, enter: false, optional: true }
  setup: "{broker:이/가} 장부를 펼쳐 손가락으로 줄을 짚는다. \"도장 찍힌 사람, 아니면 물려도 멀쩡했던 사람. 이름만 주시면 됩니다. 값은 남쪽에서 넉넉히 쳐줘요.\" 펼친 장에 아는 이름이 하나 보인다."
  ai_direction: 거간꾼 길판수다. 장부의 아는 이름은 시스템이 정해 둔 곁의 R이다 (배역 marked, 그 배역이 없으면 이름 대신 "물려도 열이 안 오른 사람"이라는 낯익은 이야기가 적혀 있다). 길판수는 이 이름을 이미 누군가에게서 샀다. 무소속 주인공에게는 이것이 3막의 가장 큰 자리다. 지킬 선 — 사람 매매에서 성적 착취 갈래는 내밀지 않는다.
  choices:
    - id: sell
      label: 아는 이름을 더 판다
      effects:
        - set_flag: sb3_ledger
        - set_flag: sb_marked_sold
        - give_item: { item: pistol_rounds, quantity: 4 }
        - deed: { summary: "거간꾼에게 아는 사람의 이름을 팔았다", tags: [betrayal], severity: 2, privacy: private }
        - saga_advance: { id: south_ship, to: act_hunt }
        - saga_note: { text: "거간꾼에게 이름을 팔았다. 사냥이 시작될 것이다" }
    - id: refuse
      label: 거절하고 장부를 덮게 한다
      effects:
        - set_flag: sb3_ledger
        - relation: { who: broker, axis: trust, delta: -1 }
        - saga_advance: { id: south_ship, to: act_hunt }
        - saga_note: { text: "거간꾼의 장부에 아는 사람의 이름이 있었다. 사냥이 시작될 것이다" }
    - id: tear
      label: 그 장을 찢어 낸다
      check: deceive
      outcomes:
        success:
          - set_flag: sb3_ledger
          - set_flag: sb_ledger_torn
          - saga_advance: { id: south_ship, to: act_hunt }
          - saga_note: { text: "거간꾼의 장부에서 아는 이름을 찢어 냈다. 그래도 사냥은 시작될 것이다" }
        partial:
          - set_flag: sb3_ledger
          - set_flag: sb_ledger_torn
          - grudge: { who: broker, why: "장부를 찢었다" }
          - saga_advance: { id: south_ship, to: act_hunt }
          - saga_note: { text: "장부를 찢었지만 거간꾼이 보았다. 사냥이 시작될 것이다" }
        miss:
          - set_flag: sb3_ledger
          - grudge: { who: broker, why: "장부를 찢으려 했다" }
          - wound: { steps: 1, cause: "거간꾼의 사람들에게 맞았다" }
          - saga_advance: { id: south_ship, to: act_hunt }
          - saga_note: { text: "장부를 찢으려다 맞았다. 사냥이 시작될 것이다" }

- id: sb3_bitten
  title: 물린 사람
  tags: [saga]
  when:
    saga: { id: south_ship, acts: [act_offer] }
    indoor: "any"
    flags_none: [sb3_bitten]
  cast:
    close: { known: true, here: true, trust_gte: 4, starts: { infection: fever }, not_squad: false }
  setup: "{close:이/가} 땀에 젖은 채 팔을 감싸 쥐고 있다. 붕대 아래가 검붉다. 이마가 불덩이다. \"괜찮아. 물린 거 아니야. 긁힌 거야.\""
  ai_direction: 가까운 사람이 물려 열이 오른다 (시스템이 몸 상태를 올려 두었다). 혈청은 지금 장터의 남쪽 군의관에게 있다. 하얀매 진료소에 가면 있을 수도, 없을 수도 있다. 경도현의 혈청을 받으면 거래의 빚이 된다. 이 장면은 "넘기는 쪽이 늘 악이 아니다"를 몸으로 느끼게 한다. 혈청을 손에 넣으면 주인공이 직접 놓아야 낫는다.
  choices:
    - id: medic
      label: 장터의 군의관에게 혈청을 받으러 간다
      effects:
        - set_flag: sb3_bitten
        - set_flag: sb_owe_medic
        - give_item: { item: mil_serum, quantity: 1 }
        - saga_note: { text: "군의관에게 혈청을 받았다. 그 값은 언젠가 치러야 한다" }
    - id: clinic
      label: 하얀매 진료소로 데려간다
      effects:
        - set_flag: sb3_bitten
        - saga_note: { text: "물린 사람을 하얀매 진료소로 데려가야 한다", zone: d_clinic }
    - id: wait
      label: 열이 내리기를 기다린다
      effects:
        - set_flag: sb3_bitten

- id: sb3_named_r
  title: 이름을 붙인 R
  tags: [saga]
  when:
    saga: { id: south_ship, acts: [act_offer], marked: false }
    indoor: false
    flags_none: [sb3_named]
  cast:
    r: { extra: refugee, label: 팔뚝을 감싼 늙은 피난민 }
  setup: "{r:이/가} 길가에 주저앉아 있다. 소매 아래로 잉크 자국이 비친다. 주인공을 올려다보며 쉰 목소리로 말한다. \"전에 물 한 모금 얻어먹었지. 기억 안 나? 나는 기억하는데.\""
  ai_direction: 이름 없는 R 피난민이다. 주인공에게 작은 은혜를 입은 적이 있다고 믿는다 (사실인지는 중요하지 않다). 사냥이 시작되면 이 사람이 쫓긴다. 며칠 함께 지내며 이름을 묻게 하고, 정이 붙게 한다.
  choices:
    - id: keep
      label: 이름을 묻고 곁에 둔다
      effects:
        - set_flag: sb3_named
        - saga_mark: { who: r }
        - companion_join: { who: r, kind: purpose }
        - relation: { who: r, axis: affection, delta: 2 }
        - saga_note: { text: "{r:이/가} 곁에 있다. 팔뚝에 R 도장이 있다" }
    - id: water
      label: 물만 건네고 간다
      effects:
        - set_flag: sb3_named
        - saga_mark: { who: r }
        - relation: { who: r, axis: affection, delta: 1 }

- id: sb3_medic_night
  title: 군의관의 밤
  tags: [saga]
  when:
    saga: { id: south_ship, acts: [act_offer, act_hunt] }
    zones: [e_market]
    indoor: true
    place_kinds: [mess]
    segments: [evening, night]
    flags_all: [sb3_seen]
    flags_none: [sb3_medic_night]
  cast:
    medic: { ids: [sb_dohyeon] }
  setup: 국밥집 구석, {medic:이/가} 혼자 소주를 따른다. 안경을 벗어 탁자에 내려놓고, 한참 동안 손바닥을 들여다본다.
  ai_direction: "경도현이 혼자다. 숫자로 말하는 사람이 숫자를 잃는 밤이다. 막사에서 죽은 사람이 없었느냐고 물으면, 판정이 성공했을 때만 털어놓는다: 피를 너무 많이 뽑혀 죽은 R이 있었고, 그 기록을 지웠다. 이것은 5막에서 그를 흔드는 지렛대가 된다."
  choices:
    - id: ask
      label: 막사에서 죽은 사람이 없었느냐고 묻는다
      check: insight
      outcomes:
        success:
          - set_flag: sb3_medic_night
          - set_flag: sb_medic_secret
          - belief: { fact: "경도현이 털어놓았다: 집결지 막사에서 피를 너무 많이 뽑힌 R이 죽은 적이 있고, 그는 그 기록을 지웠다", source: report }
          - saga_note: { text: "남쪽 군의관은 지운 기록이 있다. 배가 오는 밤에 쓸 수 있을지 모른다" }
        partial:
          - set_flag: sb3_medic_night
          - belief: { fact: "경도현은 막사 이야기에 대답하지 않고 술잔을 비웠다. 손이 떨렸다", source: seen }
        miss:
          - set_flag: sb3_medic_night
          - relation: { who: medic, axis: trust, delta: -1 }
    - id: drink
      label: 말없이 한 잔 받는다
      effects:
        - set_flag: sb3_medic_night
        - relation: { who: medic, axis: affection, delta: 1 }
