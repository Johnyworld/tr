  setup: 사흘째 밤, 같은 시각. 덮개 트럭이 불을 끄고 주차장에 들어선다. {driver:이/가} 짐칸 자물쇠를 풀고, {broker:이/가} 손전등을 든다. 녹슨 화물차 그늘에서 당신까지는 스무 걸음이다.
  ai_direction: 짐칸에는 붉은연합 수용소에서 실려 온 사람들이 손이 묶인 채 앉아 있다. 운전수 둘과 길판수가 있고, 길판수는 권총을 지녔다. 트럭을 멈추면 짐칸 사람들은 제각기 흩어져 제 길로 간다(이름 없는 사람들). 붉은연합은 누가 트럭을 멈췄는지 찾으려 든다. 죽이고 살리는 일은 이야기가 아니라 판정이 정한다. 주인공이 값을 치르고 사람을 데려가는 길은 없다. 지킬 선 — 성폭력 행위는 그리지 않는다. 사실(장부의 칸)·정황·결과로만 다룬다. 몸을 묘사하지 않는다. 피해자를 탓하지 않는다. 성적 착취(성노예로 사고팔기·쓰기)에 주인공이 가담하는 길은 내밀지 않는다. 착취의 성격은 믿음·행적의 글이 보여 주는 만큼만 말한다.
  choices:
    - id: tires
      label: 길판수의 트럭 바퀴에 칼을 꽂고 짐칸 자물쇠가 풀린 틈에 사람들을 흩어 보낸다
      check: stealth
      outcomes:
        success:
          - set_flag: tr_convoy_done
          - set_flag: tr_convoy_stopped
          - relation: { who: broker, axis: trust, delta: -3 }
          - deed: { summary: 휴게소 주차장에서 거간꾼의 트럭을 멈추고 실려 가던 사람들을 풀어 보냈다, tags: [mercy, bravery], severity: 3, privacy: private }
          - belief:
              fact: "길판수의 트럭 바퀴를 찢고 짐칸 사람들을 풀어 보냈다. 여섯이 고가도로 쪽과 강변 쪽으로 흩어졌다. 길판수는 다음 트럭을 받을 수 없다"
              mature: "길판수의 트럭 바퀴를 찢고 팔려 가던 여섯을 풀어 보냈다. 그중 둘은 '여관 몫'으로 따로 묶여 있던 여자들이었다. 길판수는 다음 트럭을 받을 수 없다"
              source: seen
        partial:
          - set_flag: tr_convoy_done
          - set_flag: tr_convoy_stopped
          - zone_noise: 1
          - grudge: { who: broker, why: 내 트럭을 멈추고 머릿수를 날렸다 }
          - deed: { summary: 휴게소 주차장에서 거간꾼의 트럭을 멈췄다, tags: [mercy, bravery], severity: 3, privacy: semi_private }
          - belief: { fact: "바퀴를 찢었지만 길판수가 나를 보았다. 짐칸 사람 몇은 흩어졌고 몇은 붉은연합 트럭에 도로 실렸다", source: seen }
        miss:
