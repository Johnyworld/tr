- id: tr_proof_traders
  title: 자릿세 장부 옆의 쪽지
  tags: [world, trafficking]
  when:
    zones: [e_market]
    indoor: true
    place_kinds: [store]  # 장소 종류 (12-300), 전에는 places: [pawnshop]
    segments: [morning, day, evening]
    flags_all: [tr_proof]
    flags_none: [tr_proof_given]
  cast:
    boss: { ids: [e_bongsu], enter: false }
  setup: 장터 장부석. 상단 표찰과 빚 장부가 쌓인 탁자 위로 등잔이 흔들린다. 품 안의 종이가 바스락거린다. 휴게소 주차장의 거래가 적힌 종이다. 장터 안 어딘가에 상단 우두머리가 있다.
  ai_direction: 탁봉수는 누구에게나 판다. 다만 상단 땅 휴게소 주차장에서 붉은연합이 사람을 팔고 탄약을 받아 왔다는 것은 다르다. 상단의 장사가 거기 묶여 있다는 말이 다른 무리에 돌면 장터에 아무도 오지 않는다. 쪽지를 보면 그는 붉은연합 쪽으로 기울던 셈을 다시 한다. 붉은연합 사람이 넘기면 그것은 무리를 판 일이 된다. 지킬 선 — 성폭력 행위는 그리지 않는다. 사실(장부의 칸)·정황·결과로만 다룬다. 몸을 묘사하지 않는다. 피해자를 탓하지 않는다. 성적 착취(성노예로 사고팔기·쓰기)에 주인공이 가담하는 길은 내밀지 않는다 (증거를 팔지도 않는다). 착취의 성격은 믿음·행적의 글이 보여 주는 만큼만 말한다.
  choices:
    - id: hand
      label: 탁봉수를 찾아가 쪽지를 탁자에 펼친다
      meets: boss
      when: { factions: [faction_a, faction_b, faction_d, faction_e, faction_y, none] }
      effects:
        - set_flag: tr_proof_given
        - faction_relation: { from: faction_e, to: faction_c, delta: -2, mutual: false }
        - clock: { id: e_side, delta: -3 }
        - relation: { who: boss, axis: trust, delta: 1 }
        - deed: { summary: 붉은연합이 휴게소에서 사람을 팔아 온 증거를 나루상단에 넘겼다, tags: [honesty, bravery], severity: 2, privacy: semi_private }
        - belief:
            fact: "탁봉수가 쪽지를 오래 보았다. '우리 땅에서 사람 장사를 했다고.' 그는 휴게소 주차장을 닫고 붉은연합 짐에 값을 다시 매기라고 했다"
            mature: "탁봉수가 쪽지를 오래 보았다. '우리 땅에서 사람을, 여자를 팔았다고.' 그는 휴게소 주차장을 닫고 붉은연합 짐에 값을 다시 매기라고 했다"
            source: seen
    - id: hand_red
      label: 완장을 풀어 주머니에 넣고 탁봉수에게 쪽지를 넘긴다
      meets: boss
      when: { factions: [faction_c] }
      effects:
        - set_flag: tr_proof_given
        - set_flag: c_marked
        - faction_relation: { from: faction_e, to: faction_c, delta: -2, mutual: false }
        - clock: { id: e_side, delta: -3 }
        - relation: { who: boss, axis: trust, delta: 2 }
        - deed: { summary: 무리의 '야간 전출' 증거를 나루상단에 넘겼다, tags: [honesty, betrayal], severity: 3, privacy: private }
        - belief: { fact: "탁봉수는 붉은 완장 자국을 보고 웃지 않았다. '자기 무리를 판 사람은 장부에 안 적어. 오늘 일도 안 적고.' 주차장은 닫힌다", source: seen }
    - id: keep
      label: 아직은 넘기지 않고 품에 둔다
      effects:
        - belief: { fact: "장부석까지 와서 쪽지를 꺼내지 않았다. 나루상단이 이것으로 무엇을 셈할지 모른다", source: seen }

