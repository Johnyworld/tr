          - set_flag: tr_convoy_stopped
          - zone_noise: 2
          - faction_relation: { from: faction_c, to: faction_e, delta: -1, mutual: false }
          - deed: { summary: 휴게소 주차장에서 붉은연합 트럭을 덮쳐 실려 가던 사람들을 풀어 주었다, tags: [mercy, bravery], severity: 3, privacy: semi_private }
          - belief:
              fact: "운전수들이 트럭을 버리고 달아났다. 짐칸 여섯을 풀어 주었다. 붉은연합은 나루상단 땅에서 트럭을 잃었다고 상단을 의심할 것이다"
              mature: "운전수들이 트럭을 버리고 달아났다. 팔려 가던 여섯을 풀어 주었다. 붉은연합은 나루상단 땅에서 트럭을 잃었다고 상단을 의심할 것이다"
              source: seen
