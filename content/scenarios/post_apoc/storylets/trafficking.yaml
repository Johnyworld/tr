          - wound: { steps: 1, cause: 길판수의 권총 개머리에 맞았다, kind: blunt }
          - belief: { fact: "바퀴에 칼을 꽂기 전에 길판수의 손전등이 먼저 왔다. 트럭은 짐칸을 그대로 싣고 고속도로로 나갔다", source: seen }
    - id: charge
      label: 화물차 그늘에서 뛰쳐나가 운전수들을 몰아내고 짐칸을 연다
      check: intimidate
      outcomes:
        success:
