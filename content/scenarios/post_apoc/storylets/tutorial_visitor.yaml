# 튜토리얼: 방문자의 이야기 (기획서 12.4.1). 태그 tutorial_visitor라 방문자 시나리오에서만 열린다 (청솔형제단에 든 뒤에도)
# 1. 청솔형제단 정문: 몸 수색과 물음 → 받아 준다 (또는 오늘은 안 된다)
# 2. 형제단의 첫날: 공용 숙소, 규칙, 일주일의 적응 기간. 가족 이름은 아무도 모른다 → 버들마을에 물어보라는 말 (어느 길로 들어왔든)
# 3. 버들마을 사람의 소식 (첫날 뒤): 가족의 이름을 안다. 버들마을에 산다고 알려 준다 (tv_family_known)
# 4. 버들마을에서 수소문 (단서가 없으면): 이름을 대고 묻거나 둘러본다 (tv_family_where)
# 5. 재회: 단서를 얻고 버들마을에 있으면 가족이 앞에 나타난다 → 클리어 (가족이 장면에 들어오면 코드가 판정한다)

- id: tv_gate
  title: 청솔형제단의 정문
  urgent: true
  tags: [tutorial_visitor]
  when:
    factions: [none]
    zones: [a_base]
    flags_none: [tv_gate_met]
  cast:
    guard: { ids: [a_taeho] }
  setup: "철판을 덧댄 정문 앞. 망루에서 \"멈춰!\" 소리가 떨어지고, 문틈으로 총구 둘이 나온다. 쪽문이 열리고 귀가 반쯤 없는 사내, {guard:이/가} 나온다. \"무기 내려놓고 두 손 머리 위로. 물린 데 있나 봐야겠다.\""
  ai_direction: >-
    청솔형제단은 떠돌이를 함부로 쏘지 않는다. {guard:은/는} 무기를 맡기게 하고 옷을 걷어 물린 자국이 있는지 본 뒤, 어디서 왔는지,
    왜 왔는지, 무엇을 할 줄 아는지 묻는다. 거짓말은 눈치챈다. 형제단에 해가 될 것 같으면(위협하거나, 붉은연합 쪽 냄새가 나면) 받지 않는다.
    받아 주면 무기는 돌려주고, 대표 최선희의 허락으로 형제단 식구가 된다. 이 장면에서 처음으로 판정이 무엇인지 플레이어에게 짧게 알려 준다.
  choices:
    - id: honest
      label: 가족을 찾아 왔다고 솔직히 말한다
      check: persuade
      outcomes:
        success:
          - set_flag: tv_gate_met
          - join_faction: { faction: faction_a }
          - relation: { who: guard, axis: trust, delta: 1 }
          - set_flag: tv_accepted
          - belief: { fact: "청솔형제단이 나를 받아 주었다. 강태호가 몸을 뒤지고 몇 가지를 물은 뒤, 대표의 허락을 받아 왔다", source: seen }
        partial:
          - set_flag: tv_gate_met
          - join_faction: { faction: faction_a }
          - set_flag: tv_accepted
          - belief: { fact: "청솔형제단이 나를 받아 주었지만, 강태호는 당분간 지켜보겠다고 했다", source: seen }
        miss:
          - set_flag: tv_gate_met
          - set_flag: tv_gate_refused
          - relation: { who: guard, axis: trust, delta: -1 }
          - belief: { fact: "청솔형제단 정문에서 오늘은 안 된다는 말을 들었다. 하룻밤 담 밖에서 지켜보겠다고 했다", source: report }
    - id: show_skill
      label: 할 줄 아는 일을 보여 주겠다고 한다
      check: survival
      outcomes:
        success:
          - set_flag: tv_gate_met
          - join_faction: { faction: faction_a }
          - relation: { who: guard, axis: respect, delta: 1 }
          - set_flag: tv_accepted
          - belief: { fact: "담 밖에서 2년을 버틴 솜씨를 보여 주자 강태호가 고개를 끄덕였다. 청솔형제단이 나를 받아 주었다", source: seen }
        partial:
          - set_flag: tv_gate_met
          - join_faction: { faction: faction_a }
          - set_flag: tv_accepted
          - belief: { fact: "청솔형제단이 나를 받아 주었다. 쓸모는 두고 보겠다고 했다", source: seen }
        miss:
          - set_flag: tv_gate_met
          - set_flag: tv_gate_refused
          - belief: { fact: "청솔형제단 정문에서 오늘은 안 된다는 말을 들었다. 손이 떨려 보였던 모양이다", source: report }
    - id: back_off
      label: 아직은 믿을 수 없다며 물러난다
      effects:
        - set_flag: tv_gate_met
        - set_flag: tv_gate_refused
        - belief: { fact: "청솔형제단 정문까지 갔다가 물러났다. 다시 오면 받아 줄지도 모른다", source: seen }

# 정문에서 돌아섰거나 거절당했으면, 하루 지나 다시 찾아갈 수 있다
- id: tv_gate_again
  title: 다시 정문 앞에서
  tags: [tutorial_visitor]
  cooldown_days: 1
  repeatable: true
  when:
    factions: [none]
    zones: [a_base]
    flags_all: [tv_gate_refused]
  cast:
    guard: { ids: [a_taeho] }
  setup: "다시 정문 앞. 망루의 초병이 당신을 알아본다. 쪽문이 열리고 {guard:이/가} 팔짱을 낀 채 나온다. \"또 왔군. 이번엔 무슨 얘길 들고 왔지.\""
  ai_direction: "{guard:은/는} 한 번 본 얼굴이라 덜 날카롭다. 다시 묻고, 이번에도 해가 될 것 같지 않으면 받아 준다."
  choices:
    - id: ask_again
      label: 받아 달라고 다시 부탁한다
      check: persuade
      outcomes:
        success:
          - clear_flag: tv_gate_refused
          - join_faction: { faction: faction_a }
          - set_flag: tv_accepted
          - belief: { fact: "두 번째로 찾아간 날, 청솔형제단이 나를 받아 주었다", source: seen }
        partial:
          - clear_flag: tv_gate_refused
          - join_faction: { faction: faction_a }
          - set_flag: tv_accepted
          - belief: { fact: "청솔형제단이 마지못해 나를 받아 주었다. 일주일 동안 지켜보겠다고 했다", source: seen }
        miss:
          - belief: { fact: "청솔형제단은 이번에도 문을 열지 않았다", source: seen }
    - id: leave
      label: 오늘은 그냥 돌아선다
      effects: []

# 받아들여진 뒤: 생활 안내 (공용 숙소, 규칙, 일주일)
- id: tv_settle
  title: 형제단의 첫날
  urgent: true
  tags: [tutorial_visitor]
  when:
    factions: [faction_a]
    zones: [a_base]
    flags_none: [tv_settled]
  cast:
    host: { ids: [a_bokja] }
  setup: "{host:이/가} 국자를 허리에 꽂은 채 앞장선다. 복도를 따라 칠판이 그대로 남은 교실들이 이어진다. \"여기가 공용 숙소야. 책상 붙여서 침대 만들었어. 밥은 하루 한 번, 식당에서. 줄 서.\""
  ai_direction: >-
    정복자 할머니가 거점을 안내한다: 교실을 고친 공용 숙소(빈 자리 하나를 내준다), 식당과 배급(하루 한 번), 물탱크, 남쪽 담(자주 무너진다).
    생활 규칙 세 가지: 거점 안에서 총을 함부로 쏘지 않는다, 배급은 하루 한 번, 남의 몫에 손대는 것이 가장 무거운 잘못이다.
    그리고 대표의 말을 전한다: 일주일은 적응 삼아 자유롭게 돌아다니며 지내라, 그 뒤에 할 일을 정하자.
    가족의 이름을 물으면 할머니는 모른다. 거점 사람들도 모른다. 다만 "버들마을 사람들이 장에 자주 오니 그쪽에 물어봐라"라고 한다.
    이 장면에서 ?상태, ?지도 같은 정보 보기를 플레이어에게 한 번 알려 준다.
  choices:
    - id: thank
      label: 고맙다고 하고 자리를 잡는다
      effects:
        - set_flag: tv_settled
        - relation: { who: host, axis: affection, delta: 1 }
        - belief: { fact: "청솔형제단 거점의 규칙: 거점 안에서 총을 함부로 쏘지 않는다, 배급은 하루 한 번 식당에서, 남의 몫에 손대지 않는다", source: report }
        - belief: { fact: "대표는 일주일 동안 적응 삼아 자유롭게 지내라고 했다. 그 뒤에 할 일을 정한다", source: report }
    - id: ask_family
      label: 가족의 이름을 대며 본 적 있는지 묻는다
      effects:
        - set_flag: tv_settled
        - belief: { fact: "청솔형제단 거점에는 가족의 이름을 아는 사람이 없다. 정복자 할머니는 버들마을 사람들에게 물어보라고 했다", source: report }
        - belief: { fact: "청솔형제단 거점의 규칙: 거점 안에서 총을 함부로 쏘지 않는다, 배급은 하루 한 번 식당에서, 남의 몫에 손대지 않는다", source: report }
        - belief: { fact: "대표는 일주일 동안 적응 삼아 자유롭게 지내라고 했다. 그 뒤에 할 일을 정한다", source: report }

# 버들마을 사람: 가족의 이름을 안다
- id: tv_family_news
  title: 그 이름을 아는 사람
  urgent: true
  tags: [tutorial_visitor]
  when:
    zones: [a_base, old_town, e_market]
    flags_all: [bg_family_lost, tv_settled]
    flags_none: [tv_family_known, tv_family_where]
  cast:
    villager: { faction: faction_b }
    kin: { background: family, enter: false }
  setup: "{villager:이/가} 가족을 찾는 사람이 있다는 말을 들었다며 다가온다. \"찾는 사람이 {kin}, 맞죠? 그 사람 우리 마을에 사는데.\""
  ai_direction: >-
    {villager:은/는} 버들마을 사람이다. 가족은 모두 살아서 버들마을(청솔형제단 거점 서쪽의 옛 아파트 단지)에 산다.
    {villager:은/는} 가족의 얼굴과 사는 동을 안다. 데려다 달라고 하면 길을 알려 주거나 함께 가겠다고 한다. 가족은 이 장면에 나오지 않는다:
    만나는 것은 주인공이 버들마을에 들어간 뒤 재회 이야기에서다.
  choices:
    - id: ask_way
      label: 버들마을로 가는 길을 묻는다
      effects:
        - set_flag: tv_family_known
        - relation: { who: villager, axis: affection, delta: 1 }
        - belief: { fact: "가족이 살아 있다. 버들마을(청솔형제단 거점 서쪽의 옛 아파트 단지)에 산다고 버들마을 사람에게 들었다", source: report }
    - id: doubt
      label: 정말인지 몇 번이고 되묻는다
      effects:
        - set_flag: tv_family_known
        - belief: { fact: "버들마을 사람이 가족의 이름과 생김새를 맞혔다. 가족이 버들마을에 산다", source: report }

# 단서 없이 버들마을에 들어왔으면: 가족을 수소문한다 (하루에 한 번까지)
- id: tv_family_search
  title: 단지 안에서 가족을 찾는다
  tags: [tutorial_visitor]
  repeatable: true
  cooldown_days: 1
  when:
    zones: [b_base]
    flags_all: [bg_family_lost]
    flags_none: [tv_family_known, tv_family_where]
  cast:
    resident: { faction: faction_b }
  setup: "아파트 동들 사이 마당에서 빨래를 걷던 {resident:이/가} 낯선 얼굴을 보고 손을 멈춘다. 단지 안 사람들은 서로를 다 안다. 당신은 여기서 처음 보는 사람이다."
  ai_direction: >-
    가족은 이 단지에 산다. 버들마을 사람들은 가족을 안다. 이름을 대고 물으면 대개 알려 주고, 경계하면 말을 아낀다.
    가족은 이 장면에 나오지 않는다: 어느 동에 사는지까지만 알게 되고, 만나는 것은 다음 재회 이야기에서다.
  choices:
    - id: ask
      label: 가족의 이름을 대며 아는지 묻는다
      check: persuade
      outcomes:
        success:
          - set_flag: tv_family_where
          - relation: { who: resident, axis: affection, delta: 1 }
          - belief: { fact: "가족이 버들마을에 산다. 단지 사람이 사는 동을 알려 주었다", source: report }
        partial:
          - set_flag: tv_family_where
          - belief: { fact: "가족이 버들마을에 산다고 한다. 단지 사람은 경계하며 동만 손으로 가리켰다", source: report }
        miss:
          - relation: { who: resident, axis: trust, delta: -1 }
          - belief: { fact: "버들마을 사람은 낯선 사람에게 단지 사람 일을 말해 주지 않았다. 다른 날 다시 물어볼 수 있다", source: seen }
    - id: look
      label: 말없이 단지를 둘러보며 얼굴들을 살핀다
      check: sense_danger
      outcomes:
        success:
          - set_flag: tv_family_where
          - belief: { fact: "버들마을 단지 안에서 가족의 물건을 알아보았다. 가족이 이 단지에 산다", source: seen }
        partial:
          - set_flag: tv_family_where
          - belief: { fact: "버들마을 단지 어느 동 앞에서 낯익은 것을 보았다. 가족이 여기 있는 것 같다", source: seen }
        miss:
          - belief: { fact: "버들마을 단지를 둘러보았지만 가족의 흔적을 찾지 못했다", source: seen }
    - id: later
      label: 오늘은 그냥 둔다
      effects: []

# 재회: 단서를 얻고 버들마을에 있으면 가족이 나타난다. 가족이 장면에 들어오면 클리어 목표가 찬다
- id: tv_reunion
  title: 다시 만난 사람들
  urgent: true
  tags: [tutorial_visitor]
  when:
    zones: [b_base]
    flags_all: [bg_family_lost]
    flags_any: [tv_family_known, tv_family_where]
    flags_none: [tv_reunited]
  cast:
    kin: { background: family, enter: true }
  setup: "알려 준 동의 계단 앞. 3층 창문에서 누군가 빨래를 털다가 손을 멈춘다. 창틀을 붙잡은 손이 떨린다. {kin:이/가} 당신의 이름을 부른다."
  ai_direction: >-
    2년 만의 재회다. 이 장면이 튜토리얼의 엔딩이다 (시스템이 클리어를 알린다). 가족이 먼저 알아본다.
    서두르지 말고, 알아보는 순간과 계단을 뛰어 내려오는 소리, 이름을 부르는 목소리부터 쓴다. 나머지 가족도 곧 나타난다.
  choices:
    - id: run
      label: 계단을 뛰어 올라간다
      effects:
        - set_flag: tv_reunited
        - relation: { who: kin, axis: affection, delta: 1 }
    - id: call
      label: 그 자리에 서서 이름을 부른다
      effects:
        - set_flag: tv_reunited
        - relation: { who: kin, axis: affection, delta: 1 }
