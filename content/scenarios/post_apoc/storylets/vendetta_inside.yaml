# 같은 지붕 아래의 원수 (12-135): 복수를 다짐한 사람이 주인공과 같은 무리라 같은 거점에 산다
# - 배역 { vendetta: true, faction: own }, 우리 땅(own_territory)에서만. 다른 무리의 복수자는 vendetta.yaml
# - 같은 담 안이라 칼부림은 쉽지 않다: 노려보는 눈(경고) → 보초 교대 때 등 뒤(결판) / 지도부 앞의 고발(벌)
# - 원한이 풀리면(settle_vendetta) 더는 열리지 않는다

- id: vdi_glare
  title: 배식 줄의 눈
  tags: [world]
  repeatable: true
  cooldown_days: 6
  when:
    own_territory: true
    segments: [morning, evening]
  cast:
    avenger: { vendetta: true, faction: own }
  setup: 배식 줄 건너편에서 {avenger:이/가} 숟가락을 든 채 이쪽을 본다. 눈을 돌리지 않는다. 옆 사람이 팔꿈치로 찌른다. "저 사람, 요즘 너만 보던데."
  ai_direction: "{avenger:은/는} 주인공이 죽인 {victim}의 가족이나 친구다 (카드의 원한 줄). 같은 무리라 대놓고 덤비지 못한다. 대신 지켜본다. 무리 사람들은 둘 사이에 무언가 있다는 걸 눈치채기 시작한다."
  choices:
    - id: meet_eyes
      label: 마주 보며 눈을 돌리지 않는다
      check: intimidate
      outcomes:
        success:
          - belief: { fact: "배식 줄에서 {avenger:과/와} 눈싸움을 했다. 그쪽이 먼저 눈을 돌렸다. 끝난 건 아니다", source: seen }
        partial:
          - belief: { fact: "{avenger:과/와} 눈이 마주쳤다. 둘 다 돌리지 않았다", source: seen }
        miss:
          - body: { track: nerves, delta: 1 }
          - belief: { fact: "{avenger}의 눈을 끝내 마주 보지 못했다. 밥이 넘어가지 않았다", source: seen }
    - id: approach
      label: 식판을 들고 가서 그 앞에 앉는다
      check: persuade
      outcomes:
        success:
          - relation: { who: avenger, axis: respect, delta: 1 }
          - belief: { fact: "{avenger} 앞에 앉아 {victim} 이야기를 꺼냈다. 그 사람은 아무 말도 하지 않았지만 자리를 뜨지도 않았다", source: seen }
        partial:
          - belief: { fact: "{avenger} 앞에 앉자 그 사람은 식판을 들고 일어났다", source: seen }
        miss:
          - relation: { who: avenger, axis: affection, delta: -1 }
          - belief: { fact: "{avenger:은/는} 그 이름을 네 입에 올리지 말라며 식판을 엎었다", source: seen }
    - id: avoid
      label: 줄을 바꿔 선다
      effects:
        - belief: { fact: "{avenger:이/가} 요즘 나를 지켜본다. 줄을 바꿔 섰다", source: seen }

- id: vdi_watch_change
  title: 교대 시각의 발소리
  tags: [world]
  repeatable: true
  cooldown_days: 8
  weight: 2
  when:
    own_territory: true
    segments: [night]
  cast:
    avenger: { vendetta: true, faction: own }
  setup: 새벽 보초 교대. 담 위 초소에는 둘뿐이다. 오늘 교대해 올라온 사람이 {avenger}이다. 발소리가 등 뒤에서 멈춘다. 담 아래로는 한 길이 넘는다.
  ai_direction: "{avenger:은/는} 오늘 밤 결판을 내려고 교대를 바꿔 들었다 (사고로 보이게, 담 아래로). 무리 안이라 들키면 그쪽도 끝이다. 주인공이 먼저 알아채는지는 판정. 밀거나 다치게 하는 것은 코드가 정한다."
  choices:
    - id: turn
      label: 돌아서서 마주한다
      check: sense_danger
      outcomes:
        success:
          - belief: { fact: "보초 교대 때 {avenger:이/가} 등 뒤에 섰다. 먼저 돌아서자 그 사람은 손을 거뒀다. 둘만 아는 일이 됐다", source: seen }
        partial:
          - wound: { steps: 1, cause: 초소에서 밀쳐져 담에 부딪혔다 }
          - belief: { fact: "{avenger}에게 밀쳐져 담에 부딪혔다. 떨어지지는 않았다", source: seen }
        miss:
          - wound: { steps: 2, cause: 초소 담 아래로 떨어졌다 }
          - belief: { fact: "보초 교대 때 담 아래로 떨어졌다. 누가 밀었는지는 나만 안다", source: seen }
    - id: talk_it_out
      label: 돌아보지 않고 그날 일을 말한다
      check: persuade
      outcomes:
        success:
          - settle_vendetta: { who: avenger }
          - relation: { who: avenger, axis: trust, delta: 1 }
          - belief: { fact: "초소에서 {avenger}에게 {victim:을/를} 죽인 그날 일을 말했다. 동이 틀 때까지 둘 다 아무 말 없이 서 있었다. 그 사람은 내려가며 이제 됐다고 했다", source: seen }
        partial:
          - belief: { fact: "{avenger:은/는} 말을 끝까지 듣고 아무 짓도 하지 않았다. 다만 용서한다는 말도 없었다", source: seen }
        miss:
          - wound: { steps: 1, cause: 초소에서 밀쳐져 담에 부딪혔다 }
    - id: take_it
      label: 등을 맡긴 채 서 있는다. 갚을 거면 갚으라고
      check: endure
      outcomes:
        success:
          - settle_vendetta: { who: avenger }
          - relation: { who: avenger, axis: respect, delta: 2 }
          - belief: { fact: "초소에서 {avenger}에게 등을 맡겼다. 그 사람은 끝내 밀지 않았다. 이걸로 끝이라고 했다", source: seen }
        partial:
          - wound: { steps: 1, cause: 복수하러 온 사람의 주먹 }
          - settle_vendetta: { who: avenger }
          - belief: { fact: "{avenger:은/는} 주먹 한 번으로 끝냈다. 이걸로 끝이라고 했다", source: seen }
        miss:
          - wound: { steps: 2, cause: 초소 담 아래로 떨어졌다 }
          - settle_vendetta: { who: avenger }
          - belief: { fact: "{avenger:은/는} 나를 담 아래로 밀었다. 그리고 다시는 나를 보지 않았다", source: seen }

- id: vdi_accused
  title: 지도부 앞에서
  tags: [world]
  repeatable: true
  cooldown_days: 15
  when:
    own_territory: true
    segments: [morning, day]
  cast:
    avenger: { vendetta: true, faction: own }
  setup: 지도부가 당신을 부른다. 방 한구석에 {avenger:이/가} 서 있다. 간부 하나가 묻는다. "{victim}이 어떻게 죽었는지, 네 입으로 말해 봐."
  ai_direction: "{avenger:이/가} 지도부에 일렀다. 칼 대신 무리의 규율로 갚으려는 것이다. 지도부는 진실보다 무리의 질서를 본다: 인정하면 벌을 주고 끝내려 하고, 부인하면 증거와 목격자를 따진다. 벌의 크기는 코드가 정한다 (공적)."
  choices:
    - id: confess
      label: 있는 그대로 인정한다
      effects:
        - merit: -2
        - settle_vendetta: { who: avenger }
        - belief: { fact: "지도부 앞에서 {victim:을/를} 죽인 일을 인정했다. 벌을 받았다. {avenger:은/는} 그걸로 됐다며 방을 나갔다", source: seen }
    - id: deny
      label: 그런 일 없다고 잡아뗀다
      check: deceive
      outcomes:
        success:
          - relation: { who: avenger, axis: trust, delta: -2 }
          - belief: { fact: "지도부 앞에서 잡아뗐다. 증거가 없어 넘어갔다. {avenger}의 눈이 더 차가워졌다", source: seen }
        partial:
          - merit: -1
          - belief: { fact: "지도부는 반쯤 믿었다. 근신을 받았다. {avenger:은/는} 만족하지 않았다", source: seen }
        miss:
          - merit: -3
          - belief: { fact: "거짓말이 들통났다. 지도부의 벌이 더 무거워졌다", source: seen }
    - id: explain
      label: 그날 왜 그럴 수밖에 없었는지 설명한다
      check: persuade
      outcomes:
        success:
          - settle_vendetta: { who: avenger }
          - belief: { fact: "지도부 앞에서 그날 일을 설명했다. 지도부는 벌하지 않았다. {avenger}도 끝까지 듣고 고개를 숙였다", source: seen }
        partial:
          - merit: -1
          - settle_vendetta: { who: avenger }
        miss:
          - merit: -2
          - belief: { fact: "설명은 변명으로 들렸다. 벌을 받았고 {avenger}의 원한도 그대로다", source: seen }
