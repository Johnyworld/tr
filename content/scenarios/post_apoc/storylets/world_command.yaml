# 지휘 (기획서 9.11): 무리 방침과 분대의 이야기
# - council: 회의에 앉는 간부라면 어느 무리에서나. 회의에서 방침이 정해진다 (faction_policy)
# - command: 분대를 맡은 사람이라면 어느 무리에서나
# - world + own_policy: 그 방침을 겪는 무리 사람 누구나 (배급을 줄이면 식당이 수군거리고, 밀어붙이면 출정을 배웅한다)

# ── 회의 ─────────────────────────────────────────

- id: cm_council_winter_ration
  title: 겨울 장부
  tags: [council]
  when:
    segments: [morning, day]
    day_gte: 3
    own_food_days_lte: 25
    own_policy: { ration: [normal, extra] }
  cast:
    chair: { commander: true }
  setup: "회의 탁자에 장부가 펼쳐져 있다. 창고를 맡은 사람이 줄 하나를 손가락으로 짚는다. 이대로 나누면 겨울을 다 못 넘긴다는 줄이다. {chair:이/가} 장부에서 눈을 떼지 않고 묻는다. \"줄일까요. 버틸까요.\""
  ai_direction: 창고가 비어 간다는 것은 코드가 정한 사실이다. 정확히 며칠 치인지는 말하지 않는다 (숫자를 지어내지 않는다). 배급을 줄이면 창고는 오래가지만 사람들의 얼굴이 굳는다. 줄이지 않으면 겨울 끝에 한꺼번에 굶는다. 상관은 참모의 말을 듣고 그대로 정한다.
  choices:
    - id: cut
      label: 지금 줄이자고 한다
      effects:
        - faction_policy: { faction: own, topic: ration, option: cut }
        - relation: { who: chair, axis: trust, delta: 1 }
        - deed: { summary: 회의에서 배급을 줄이자고 했다, tags: [diligence], severity: 1, privacy: semi_private }
        - belief: { fact: 회의에서 배급을 줄이기로 했다. 내가 먼저 꺼낸 말이다, source: seen }
    - id: hold
      label: 아직은 그대로 두자고 한다
      check: persuade
      outcomes:
        success:
          - relation: { who: chair, axis: respect, delta: 1 }
          - belief: { fact: 배급은 그대로 두기로 했다. 대신 다음 회의에서 창고를 다시 보기로 했다, source: seen }
        partial:
          - faction_policy: { faction: own, topic: ration, option: cut }
          - belief: { fact: 그대로 두자고 했지만 회의는 결국 배급을 줄이기로 했다, source: seen }
        miss:
          - faction_policy: { faction: own, topic: ration, option: cut }
          - relation: { who: chair, axis: trust, delta: -1 }
          - belief: { fact: 배급을 지키자는 말은 먹히지 않았다. 상관은 내가 숫자를 모른다고 여기는 눈치다, source: seen }
    - id: front_first
      label: 싸우는 사람 몫만 지키고 나머지를 줄이자고 한다
      check: tactics
      outcomes:
        success:
          - faction_policy: { faction: own, topic: ration, option: cut }
          - faction_morale: { faction: own, delta: 1 }
          - belief: { fact: 배급을 줄이되 초소와 전투조 몫은 지키기로 했다. 전투원들은 회의 결정을 반겼다, source: seen }
        partial:
          - faction_policy: { faction: own, topic: ration, option: cut }
          - belief: { fact: 전투조 몫만 지키자는 안은 반쯤 받아들여졌다. 비전투원들 사이에서 말이 나올 것이다, source: seen }
        miss:
          - relation: { who: chair, axis: respect, delta: -1 }

- id: cm_council_push
  title: 칠판 위의 화살표
  tags: [council]
  when:
    segments: [morning, day]
    day_gte: 5
    own_policy: { stance: [normal, defend] }
  cast:
    chair: { commander: true }
    hawk: { faction: own, ranks: [officer], known: true }
  setup: "{hawk:이/가} 칠판에 분필로 굵은 화살표를 긋는다. 화살표 끝은 적의 땅이다. \"지키기만 하면 겨울에 우리가 먼저 마릅니다. 지금 칩시다.\" {chair:은/는} 팔짱을 끼고 당신 쪽을 본다."
  ai_direction: "{hawk}의 말에는 근거가 있다. 먼저 치면 빼앗을 것이 생기지만, 집을 지킬 사람이 준다. 판단은 코드가 전쟁 틱에서 계산한다. 회의 장면에서는 숫자 없이 사람들의 표정과 말로만 다룬다."
  choices:
    - id: back
      label: 밀어붙이자는 쪽에 선다
      effects:
        - faction_policy: { faction: own, topic: stance, option: attack }
        - relation: { who: hawk, axis: trust, delta: 2 }
        - belief: { fact: 회의에서 밀어붙이기로 했다. 내가 거들었다, source: seen }
    - id: hold_line
      label: 지금은 지킬 때라고 맞선다
      check: tactics
      outcomes:
        success:
          - faction_policy: { faction: own, topic: stance, option: defend }
          - relation: { who: chair, axis: respect, delta: 1 }
          - relation: { who: hawk, axis: trust, delta: -1 }
          - belief: { fact: 회의는 집을 지키기로 했다. 밀어붙이자던 간부는 내 쪽을 보지 않았다, source: seen }
        partial:
          - relation: { who: hawk, axis: trust, delta: -1 }
          - belief: { fact: 밀어붙이자는 안은 미뤄졌다. 결론은 다음 회의로 넘어갔다, source: seen }
        miss:
          - faction_policy: { faction: own, topic: stance, option: attack }
          - relation: { who: hawk, axis: respect, delta: -1 }
          - belief: { fact: 맞섰지만 회의는 밀어붙이기로 했다, source: seen }
    - id: silent
      label: 말을 아끼고 상관에게 맡긴다
      effects:
        - relation: { who: chair, axis: respect, delta: -1 }

# ── 분대 ─────────────────────────────────────────

- id: cm_squad_volunteer
  title: 먼저 손을 든 사람
  tags: [command]
  when:
    segments: [morning, day, evening]
    day_gte: 2
  cast:
    eager: { faction: own, ranks: [grunt], known: true }
  setup: "{eager:이/가} 당신을 따로 붙잡는다. \"분대장님, 다음에 밖으로 나가는 일 있으면 저 보내 주세요. 창고만 지키다가는 미칠 것 같습니다.\" 눈이 지나치게 반짝인다."
  ai_direction: 진심이다. 다만 무언가를 증명하고 싶어 서두르는 사람이다. 보내면 일을 해낼 수도, 무리하다 다칠 수도 있다 (보내는 것은 squad_order다. 이 이야기는 그 사람을 대하는 태도만 정한다).
  choices:
    - id: promise
      label: 다음엔 꼭 보내겠다고 약속한다
      effects:
        - relation: { who: eager, axis: affection, delta: 1 }
        - set_flag: cm_volunteer_promised
        - belief: { fact: "{eager}에게 다음에 밖으로 나가는 일을 맡기겠다고 약속했다", source: seen }
    - id: why
      label: 왜 그렇게 나가고 싶은지 묻는다
      check: sense_danger
      outcomes:
        success:
          - relation: { who: eager, axis: trust, delta: 1 }
          - belief: { fact: "{eager}는 지난 일로 동료들 앞에서 체면을 잃었다고 여긴다. 그걸 만회하려 한다", source: seen }
        partial:
          - belief: { fact: "{eager}는 그냥 답답하다고만 했다", source: report }
        miss:
          - relation: { who: eager, axis: affection, delta: -1 }
    - id: refuse
      label: 분대장이 정한다고 잘라 말한다
      effects:
        - relation: { who: eager, axis: respect, delta: 1 }
        - relation: { who: eager, axis: affection, delta: -1 }

- id: cm_squad_bad_report
  title: 맞지 않는 보고
  tags: [command]
  when:
    segments: [evening, night]
    day_gte: 3
  cast:
    teller: { faction: own, ranks: [grunt], known: true }
  setup: "{teller:이/가} 오늘 다녀온 길을 보고한다. 말은 매끄러운데, 장화에 묻은 흙 색이 그가 말한 길의 흙이 아니다."
  ai_direction: "{teller}는 맡은 길 대신 더 안전한 길로 돌아왔다. 겁이 나서였다. 큰일은 아니지만, 다음에 그 길에 무엇이 있었는지 아무도 모른다. 캐릭터가 알아챈 것은 흙 색뿐이다."
  choices:
    - id: press
      label: 장화를 가리키며 어느 길로 왔는지 다시 묻는다
      check: intimidate
      outcomes:
        success:
          - relation: { who: teller, axis: respect, delta: 1 }
          - belief: { fact: "{teller}는 맡은 길이 무서워 돌아왔다고 털어놓았다. 그 길은 아직 아무도 보지 않았다", source: seen }
        partial:
          - relation: { who: teller, axis: trust, delta: -1 }
          - belief: { fact: "{teller}는 끝까지 그 길로 갔다고 우겼다. 거짓말 같다", source: seen }
        miss:
          - relation: { who: teller, axis: affection, delta: -2 }
    - id: quiet
      label: 둘만 있을 때 겁나면 말하라고 한다
      effects:
        - relation: { who: teller, axis: trust, delta: 1 }
        - relation: { who: teller, axis: affection, delta: 1 }
        - belief: { fact: "{teller}가 오늘 맡은 길로 가지 않은 것 같다. 둘만 있을 때 겁나면 말하라고 했다", source: seen }
    - id: report_up
      label: 간부에게 그대로 알린다
      effects:
        - merit: 1
        - relation: { who: teller, axis: trust, delta: -2 }
        - deed: { summary: 거짓 보고를 한 분대원을 윗선에 알렸다, tags: [diligence, betrayal], severity: 1, privacy: semi_private }

# ── 방침을 겪는 사람들 ───────────────────────────

- id: cm_cut_grumble
  title: 반 국자
  tags: [world]
  when:
    segments: [day, evening]
    own_policy: { ration: [cut] }
  cast:
    grumbler: { faction: own, ranks: [grunt, staff] }
  setup: "배식 줄에서 국자가 반만 차서 올라온다. {grumbler:이/가} 식판을 내려다보다가 들으라는 듯 말한다. \"윗사람들 장부에는 우리 배가 안 적히나 보지.\" 줄이 조용해진다."
  ai_direction: 배급이 줄어든 것은 회의가 정한 방침이다 (코드가 정한 사실). 불만은 진짜고, 누가 듣고 있는지 모른다. 맞장구치면 동료들 사이에서는 편해지지만 윗선의 귀에 들어갈 수 있다.
  choices:
    - id: join
      label: 맞장구를 친다
      effects:
        - relation: { who: grumbler, axis: affection, delta: 1 }
        - deed: { summary: 배식 줄에서 지도부의 배급 방침을 대놓고 비웃었다, tags: [disobedience], severity: 1, privacy: public }
    - id: defend
      label: 겨울을 넘기려면 어쩔 수 없다고 말한다
      check: persuade
      outcomes:
        success:
          - relation: { who: grumbler, axis: respect, delta: 1 }
          - faction_morale: { faction: own, delta: 1 }
        partial:
          - relation: { who: grumbler, axis: affection, delta: -1 }
        miss:
          - relation: { who: grumbler, axis: affection, delta: -2 }
          - belief: { fact: "배식 줄에서 지도부 편을 들었다가 비웃음을 샀다", source: seen }
    - id: share
      label: 내 식판에서 한 숟가락 덜어 준다
      effects:
        - body: { track: hunger, delta: 1 }
        - relation: { who: grumbler, axis: affection, delta: 2 }
        - deed: { summary: 배급이 줄어든 날 자기 몫을 덜어 동료에게 주었다, tags: [mercy], severity: 1, privacy: public }

- id: cm_extra_table
  title: 김이 오르는 솥
  tags: [world]
  when:
    segments: [evening]
    own_policy: { ration: [extra] }
  cast:
    cook: { faction: own, ranks: [grunt, staff] }
  setup: "오랜만에 솥에서 김이 오른다. 배급이 늘었다는 말이 돌자 식당에 사람이 몰린다. {cook:이/가} 국자를 들고 웃는다. \"오늘은 두 번 받아도 뭐라 안 해.\" 구석에서는 누군가 창고가 금방 바닥날 거라고 중얼거린다."
  ai_direction: 배급을 늘린 것은 회의가 정한 방침이다. 사람들은 반기지만 창고가 빨리 빈다는 걱정도 있다. 창고 숫자는 말하지 않는다.
  choices:
    - id: seconds
      label: 한 그릇 더 받는다
      effects:
        - body: { track: hunger, delta: -1 }
    - id: save
      label: 마른 비상식량 하나를 몰래 챙겨 둔다
      effects:
        - give_item: { item: dry_ration }
        - deed: { summary: 배급이 넉넉한 날 몫을 따로 챙겨 숨겼다, tags: [selfishness], severity: 1, privacy: private }
    - id: worry
      label: 중얼거리던 사람 옆에 앉아 말을 건다
      effects:
        - belief: { fact: "배급이 늘어난 뒤로 창고가 금방 빌 거라고 걱정하는 사람들이 있다", source: report }

- id: cm_attack_sendoff
  title: 출정 배웅
  tags: [world]
  when:
    segments: [dawn, morning]
    own_policy: { stance: [attack] }
  cast:
    leaving: { faction: own, ranks: [grunt, squad_leader], known: true }
  setup: "새벽 정문 앞. 밀어붙이기로 정해진 뒤 첫 출정이다. 탄띠를 두른 사람들이 줄을 선다. 그 줄에 {leaving:이/가} 있다. 눈이 마주치자 {leaving:은/는} 어색하게 웃는다."
  ai_direction: 무리가 공세를 늘리기로 한 것은 코드가 정한 방침이다. 누가 돌아올지는 아무도 모른다 (전쟁 틱이 정한다). 이 장면은 배웅의 감정만 다룬다.
  choices:
    - id: give
      label: 담배 한 개비를 쥐여 준다
      effects:
        - take_item: { item: cigarettes }
        - relation: { who: leaving, axis: affection, delta: 2 }
    - id: words
      label: 꼭 돌아오라고만 한다
      effects:
        - relation: { who: leaving, axis: trust, delta: 1 }
    - id: nod
      label: 고개만 끄덕인다
      effects:
        - belief: { fact: "{leaving}이(가) 공세에 나갔다", source: seen }
