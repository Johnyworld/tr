# 함께 다니는 사람들 (기획서 7.9)
# - 목적 동행: 어디까지, 언제까지 함께 가기로 한 사람. 목적을 이루면 갈림길 (계속 갈지는 관계와 플레이어가 정한다)
# - 연고: 떠돌이의 가족·오랜 짝. 오래 함께 가지만 잠시 떨어지기도 한다 (companion_part)
# - 임무 짝: 2인 1조 임무 동안 붙는 동료
# 배역 companion: 지금 곁에 있는 동행 중에서 고른다 (이름 없는 인물도)

# ── 목적 동행 ───────────────────────────────────

- id: wc_elder_to_clinic
  title: 진료소까지만
  tags: [world]
  when:
    zones: [old_town, hospital_ruins]
    segments: [morning, day]
    day_gte: 2
    flags_none: [wc_elder_met]
  cast:
    elder: { extra: drifter_elder, label: 늙은 떠돌이, keep: clinic_elder }
  setup: "무너진 버스 정류장 의자에 노인 하나가 앉아 있다. 당신을 보더니 우산을 짚고 일어선다. \"하얀매 진료소까지만 같이 가 주겠소. 혼자서는 그 골목을 못 지나가오. 약값은 내 몫이고, 길동무 값은 이걸로 치르리다.\" 노인이 주머니에서 쪽지 한 장을 내민다."
  ai_direction: 노인은 진료소에 가서 오래 먹던 약을 받으려 한다. 쪽지에는 붕괴 전 지도에 없던 샛길이 적혀 있다 (진짜다). 함께 가면 진료소에 닿을 때까지 동행이 되고, 닿으면 갈림길이 온다. 노인은 고마움을 쉽게 말로 하지 않는다.
  choices:
    - id: escort
      label: 진료소까지 함께 간다
      effects:
        - set_flag: wc_elder_met
        - companion_join: { who: elder, kind: purpose, until: { zone: d_clinic } }
        - belief: { fact: "늙은 떠돌이를 하얀매 진료소까지 데려다주기로 했다. 노인이 구시가 뒤편 샛길을 적은 쪽지를 주었다", source: seen }
    - id: directions
      label: 길만 일러 주고 제 갈 길을 간다
      effects:
        - set_flag: wc_elder_met
        - relation: { who: elder, axis: affection, delta: -1 }
    - id: refuse
      label: 못 본 척 지나간다
      effects:
        - set_flag: wc_elder_met

- id: wc_salvage_partner
  title: 반씩 나누는 조건
  tags: [world]
  when:
    zones: [old_town, riverside, hospital_ruins]
    segments: [morning, day]
    day_gte: 3
    flags_none: [wc_partner_met]
  cast:
    partner: { extra: drifter_young, label: 눈이 빠른 떠돌이, keep: salvage_partner }
  setup: "{partner:이/가} 무너진 담 위에 쪼그려 앉아 당신을 내려다본다. \"혼자 털기엔 저 건물 너무 넓지 않아? 하루만 같이 다니자. 찾은 건 반씩. 나는 눈이 빠르고, 너는 힘이 좋아 보이네.\""
  ai_direction: 진짜 하루만 같이 다닐 생각이다. 눈이 빠른 건 사실이지만, 좋은 물건을 보면 먼저 챙기려는 버릇이 있다. 하루가 지나면 갈림길이 오고, 그때 더 함께 갈지는 그동안의 관계가 정한다.
  choices:
    - id: team
      label: 하루만 같이 다닌다
      effects:
        - set_flag: wc_partner_met
        - companion_join: { who: partner, kind: purpose, until: { hours: 24 } }
        - belief: { fact: "눈이 빠른 떠돌이와 하루만 같이 다니며 찾은 것을 반씩 나누기로 했다", source: seen }
    - id: refuse
      label: 혼자가 편하다고 한다
      effects:
        - set_flag: wc_partner_met

- id: wc_partner_pocket
  title: 먼저 챙긴 손
  tags: [world]
  when:
    segments: [day, evening]
  cast:
    partner: { companion: { kinds: [purpose], templates: [drifter_young] } }
  setup: "같이 뒤지던 방에서 {partner:이/가} 서랍을 닫는 소리가 조금 빠르다. 돌아선 그의 점퍼 주머니가 아까보다 불룩하다. 눈이 마주치자 {partner:은/는} 먼저 웃는다."
  ai_direction: 서랍에서 통조림 하나를 먼저 챙겼다. 반씩 나누자던 약속을 어긴 건 맞지만, 들키면 반으로 나누겠다고 넉살을 부린다. 몰아붙이면 화를 낸다.
  choices:
    - id: call_out
      label: 주머니를 가리키며 반은 내 몫이라고 한다
      check: intimidate
      outcomes:
        success:
          - give_item: { item: canned_food }
          - relation: { who: partner, axis: respect, delta: 1 }
        partial:
          - relation: { who: partner, axis: affection, delta: -1 }
          - belief: { fact: "같이 다니는 떠돌이가 찾은 걸 먼저 챙겼다. 따지자 넉살 좋게 웃어넘겼다", source: seen }
        miss:
          - relation: { who: partner, axis: trust, delta: -2 }
    - id: let_slide
      label: 못 본 척한다
      effects:
        - relation: { who: partner, axis: affection, delta: 1 }
        - belief: { fact: "같이 다니는 떠돌이가 찾은 걸 먼저 챙기는 것을 보고도 넘어갔다", source: seen }
    - id: split_now
      label: 여기서 갈라서자고 한다
      effects:
        - companion_leave: { who: partner }

# ── 연고 ─────────────────────────────────────────

- id: wc_kin_errand
  title: 하루만 다녀올게
  tags: [world]
  when:
    segments: [morning, day]
    day_gte: 2
  cast:
    kin: { companion: { kinds: [kin], templates: [kin_sibling, kin_partner] } }
  setup: "{kin:이/가} 배낭 끈을 고쳐 매며 말을 꺼낸다. \"장터에 옛날에 알던 사람이 있대. 약이든 먹을 거든 얻을 수 있을지 몰라. 하루만 다녀올게. 너는 여기서 숨 좀 돌리고.\""
  ai_direction: 진짜 볼일이다. 혼자 다녀오면 하루쯤 걸리고, 무엇을 얻어 올지는 정해지지 않았다 (돌아와서 지어내지 않는다). 함께 가자고 하면 반가워하지만, 둘 다 길에 나서는 건 더 위험하다고 생각한다.
  choices:
    - id: let_go
      label: 다녀오라고 한다
      effects:
        - companion_part: { who: kin, hours: 20 }
        - relation: { who: kin, axis: trust, delta: 1 }
        - belief: { fact: "{kin}이(가) 장터의 아는 사람을 만나러 하루 다녀오기로 했다", source: seen }
    - id: together
      label: 같이 가자고 한다
      effects:
        - relation: { who: kin, axis: affection, delta: 1 }
    - id: forbid
      label: 혼자는 안 된다고 붙잡는다
      effects:
        - relation: { who: kin, axis: affection, delta: -1 }
        - relation: { who: kin, axis: respect, delta: -1 }

- id: wc_kin_slow
  title: 나를 두고 가라
  tags: [world]
  when:
    segments: [evening, night]
    day_gte: 3
    own_territory: false
  cast:
    kin: { companion: { kinds: [kin], templates: [kin_elder, kin_young] } }
  setup: "{kin:이/가} 걸음을 멈추고 숨을 고른다. 오늘 하루 몇 번째인지 모른다. \"여기 어디 안전한 데 나를 두고 가. 볼일 보고 다시 데리러 와. 같이 다니다 둘 다 잡힐라.\""
  ai_direction: 진심이다. 짐이 되는 것이 싫다. 남겨 두면 이 구역에서 기다리고, 다시 오면 합류한다. 남겨 둔 동안 무슨 일이 생길지는 이야기와 세계가 정한다 (지어내지 않는다).
  choices:
    - id: leave_safe
      label: 안전한 곳을 찾아 기다리게 한다
      effects:
        - companion_part: { who: kin }
        - belief: { fact: "{kin}을(를) {zone}의 안전한 곳에 두고 나중에 데리러 오기로 했다", source: seen }
    - id: carry
      label: 업어서라도 같이 간다
      effects:
        - body: { track: hunger, delta: 1 }
        - relation: { who: kin, axis: affection, delta: 2 }
    - id: rest_here
      label: 오늘은 여기서 같이 쉰다
      effects:
        - relation: { who: kin, axis: trust, delta: 1 }

- id: wc_kin_question
  title: 언제 끝나?
  tags: [world]
  when:
    segments: [night]
  cast:
    kin: { companion: { kinds: [kin], templates: [kin_young] } }
  setup: "담요를 나눠 덮은 {kin:이/가} 천장을 보며 묻는다. \"이거 언제 끝나? 겨울 지나면 끝나? 끝나면 우리 집에 갈 수 있어?\""
  ai_direction: 아이는 대답을 오래 기억한다. 거짓말을 해도, 사실대로 말해도 그 대답대로 아이가 버틴다.
  choices:
    - id: truth
      label: 아무도 모른다고 사실대로 말한다
      effects:
        - relation: { who: kin, axis: trust, delta: 1 }
    - id: promise
      label: 겨울 지나면 끝난다고 약속한다
      effects:
        - relation: { who: kin, axis: affection, delta: 1 }
        - set_flag: wc_kin_promised
    - id: story
      label: 붕괴 전 이야기를 들려주며 재운다
      effects:
        - relation: { who: kin, axis: affection, delta: 1 }

# ── 임무 짝 ──────────────────────────────────────

- id: wc_buddy_fear
  title: 짝의 손
  tags: [world]
  when:
    segments: [day, evening, night]
  cast:
    buddy: { companion: { kinds: [buddy] } }
  setup: "엄폐물 뒤에서 숨을 고르는 동안 {buddy:이/가} 낮게 묻는다. \"너는 무서울 때 어떻게 해? 나는 손이 안 멈춰.\" 그의 손끝이 총열 위에서 떨린다."
  ai_direction: 짝은 겁이 많지만 도망칠 사람은 아니다. 어떻게 대답하느냐에 따라 오늘 임무에서 서로를 얼마나 믿을지가 정해진다.
  choices:
    - id: share
      label: 나도 그렇다고 털어놓는다
      effects:
        - relation: { who: buddy, axis: trust, delta: 1 }
        - relation: { who: buddy, axis: affection, delta: 1 }
    - id: steady
      label: 숨 쉬는 법을 알려 준다
      check: endure
      outcomes:
        success:
          - relation: { who: buddy, axis: respect, delta: 2 }
        partial:
          - relation: { who: buddy, axis: respect, delta: 1 }
        miss:
          - belief: { fact: "짝을 다독이려다 내 손도 떨리는 것을 들켰다", source: seen }
    - id: hush
      label: 조용히 하라고 한다
      effects:
        - relation: { who: buddy, axis: affection, delta: -1 }
