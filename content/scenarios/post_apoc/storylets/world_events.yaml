# 도시의 일 (월드 스토리렛, 초안). 어느 시나리오로 시작해도 열리도록 무리를 가정하지 않는다
# - tags: [world]. 역할의 storylet_tags에 world가 있어야 열린다
# - 장소 조건은 own_territory(우리 땅인지)나 누구의 땅도 아니던 폐허 구역(old_town, riverside, hospital_ruins)으로만 건다
# - 공적(merit)과 특정 무리의 클락은 쓰지 않는다. 우리 무리 사기(faction_morale own)는 우리 땅에서 열리는 것에만 쓴다
# 이어지는 이야기 (플래그):
#   아이: w_lost_child → w_child_mother
#   개: w_stray_dog → w_dog_warns
#   무전: w_radio_static → w_radio_again

# ── 날씨와 계절 ───────────────────────────────────

- id: w_cold_snap_stranger
  title: 한파의 정류장
  tags: [world]
  repeatable: true
  cooldown_days: 6
  when:
    weather: [cold_snap]
    segments: [evening, night]
    own_territory: true
  cast:
    stranger: { extra: refugee, label: 정류장에 웅크린 사람, enter: false }
  setup: 한파가 내려앉은 밤. 정문 밖 버스 정류장 유리벽 뒤에 누군가 웅크려 있다. 보초는 모르는 사람을 들이지 말라는 지시를 받았다. 입김이 하얗게 얼어붙는다.
  ai_direction: 정류장의 사람({stranger})은 떠도는 사람이다 (이미 인물로 만들어 두었다. 들이거나 다가가면 npc_presence로 장면에 들인다). 해칠 생각도 힘도 없다. 이 밤을 밖에서 넘기면 살지 못할 수 있다. 들이려면 누군가 책임을 져야 한다.
  choices:
    - id: give_blanket
      label: 담요를 가져다 덮어 준다
      effects:
        - take_item: { item: blanket, quantity: 1 }
        - deed: { summary: 한파의 밤 정문 밖 노인에게 담요를 내주었다, tags: [mercy], severity: 1, privacy: semi_private }
        - belief: { fact: 정문 밖 노인에게 담요를 덮어 주었다. 노인은 고맙다는 말 대신 담요 끝을 꼭 쥐었다, source: seen }
    - id: vouch
      label: 보초에게 하룻밤만 들이자고 말한다
      check: persuade
      outcomes:
        success:
          - deed: { summary: 한파의 밤 떠돌이 노인을 정문 안에 들이자고 나섰다, tags: [mercy], severity: 1, privacy: public }
          - belief: { fact: 노인을 정문 안 처마 밑에서 하룻밤 재우기로 했다. 책임은 내가 진다, source: seen }
        partial:
          - belief: { fact: 보초는 정문 안쪽 드럼통 불가까지만 허락했다. 날이 밝으면 내보낸다, source: seen }
        miss:
          - belief: { fact: 보초는 끝내 문을 열지 않았다. 정류장 쪽은 아침까지 조용했다, source: seen }
    - id: look_away
      label: 지시는 지시다. 지나친다
      effects: []

- id: w_first_snow_tracks
  title: 눈 위의 맨발
  tags: [world]
  when:
    weather: [snow]
    segments: [dawn, morning]
  setup: 밤새 내린 눈 위로 발자국 한 줄이 {zone} 가장자리를 따라 이어진다. 사람 발 모양이다. 그런데 맨발이다.
  ai_direction: 무리에서 떨어진 감염체 하나의 발자국이다. 따라가면 가까운 지하 주차장 입구에서 끊긴다. 처음에는 확정하지 말고 이상함만 보인다.
  choices:
    - id: read_tracks
      label: 쪼그려 앉아 발자국을 살핀다
      check: infected_lore
      outcomes:
        success:
          - belief: { fact: 맨발 발자국은 감염체의 것이다. 보폭이 일정하지 않고 끌린 자국이 있다. 무리에서 떨어진 하나가 가까운 지하 주차장으로 들어갔다, source: seen }
        partial:
          - belief: { fact: 맨발 발자국은 가까운 지하 주차장 입구에서 끊겼다. 사람이라기엔 걸음이 이상했다, source: seen }
        miss:
          - belief: { fact: 발자국을 들여다보는 사이 눈이 다시 내려 자국이 흐려졌다, source: seen }
    - id: warn
      label: 주변 사람들에게 눈 위의 발자국을 알린다
      effects:
        - deed: { summary: 눈 위에 난 수상한 맨발 발자국을 사람들에게 알렸다, tags: [diligence], severity: 1, privacy: public }
        - belief: { fact: 눈 위에 맨발 발자국이 있었다고 알렸다. 다들 그 뒤로 바닥을 보며 걸었다, source: seen }
    - id: ignore
      label: 신경 쓰지 않는다
      effects: []

- id: w_fog_wave
  title: 안개 속의 발소리
  urgent: true
  tags: [world]
  when:
    weather: [fog]
    own_territory: false
    segments: [day, evening, night]
  setup: 안개 속, 멀지 않은 곳에서 발 끄는 소리가 겹겹이 들린다. 열은 넘는다. 수십일 수도 있다. 물결이다. 어느 쪽에서 오는지 가늠이 안 된다.
  ai_direction: 물결은 가까운 큰길을 따라 지나간다. 가만히 있으면 비켜 가고, 소리를 내면 끝자락이 방향을 튼다. 실제 조우와 피해는 판정과 이후 행동으로만 정한다.
  choices:
    - id: freeze
      label: 그 자리에 엎드려 숨을 죽인다
      check: stealth
      outcomes:
        success:
          - belief: { fact: 숨을 죽이고 기다리자 물결이 큰길을 따라 지나갔다. 백은 넘어 보였다, source: seen }
        partial:
          - belief: { fact: 물결은 지나갔지만 끝자락 몇이 한참을 주위에서 맴돌았다, source: seen }
        miss:
          - belief: { fact: 자갈을 밟았다. 물결 끝자락 몇이 방향을 틀어 이쪽으로 온다, source: seen }
    - id: climb
      label: 가까운 건물 2층으로 올라가 피한다
      check: sense_danger
      outcomes:
        success:
          - belief: { fact: 무너지지 않은 계단을 찾아 2층으로 올라갔다. 물결이 발밑으로 지나갔다, source: seen }
        partial:
          - belief: { fact: 2층으로 올라갔지만 계단 아래에 하나가 멈춰 섰다. 고개를 들고 냄새를 맡는다, source: seen }
        miss:
          - belief: { fact: 올라간 계단이 중간에서 끊겨 있었다. 내려오는 소리가 컸다, source: seen }
    - id: run
      label: 왔던 길로 뛴다
      effects:
        - belief: { fact: 안개 속을 뛰었다. 등 뒤의 발소리가 빨라졌다, source: seen }

- id: w_rain_leak
  title: 새는 지붕
  tags: [world]
  repeatable: true
  cooldown_days: 5
  when:
    weather: [rain]
    own_territory: true
    segments: [evening, night]
  setup: 빗소리가 굵어지더니 숙소 천장 한가운데서 물이 떨어진다. 하나, 둘, 이내 줄줄. 바닥에 깔아 둔 담요와 침낭이 젖어 든다. 다들 짐을 끌어안고 벽에 붙는다.
  ai_direction: 지붕 판 하나가 바람에 들렸다. 빗속에 올라가면 미끄럽고, 망치 소리는 담 밖까지 간다. 오늘 밤 젖은 채로 자면 내일 아픈 사람이 나온다.
  choices:
    - id: fix
      label: 빗속에 지붕으로 올라가 판을 다시 박는다
      check: carpentry
      outcomes:
        success:
          - faction_morale: { faction: own, delta: 1 }
          - deed: { summary: 빗속에 지붕에 올라가 새는 곳을 막았다, tags: [diligence], severity: 1, privacy: public }
        partial:
          - belief: { fact: 지붕은 반쯤 막았다. 밤새 양동이 두 개가 번갈아 찼다, source: seen }
        miss:
          - belief: { fact: 젖은 지붕에서 미끄러질 뻔했다. 판은 결국 아침까지 들린 채였다, source: seen }
    - id: buckets
      label: 양동이를 받쳐 두고 젖은 것들을 옮긴다
      effects:
        - belief: { fact: 젖은 담요를 한쪽으로 옮기고 양동이를 받쳤다. 밤새 물 떨어지는 소리가 났다, source: seen }
    - id: sleep
      label: 마른 구석을 찾아 그냥 잔다
      effects: []

# ── 감염체 ─────────────────────────────────────────

- id: w_wave_night_wall
  title: 담장 너머의 물결
  urgent: true
  tags: [world]
  repeatable: true
  cooldown_days: 5
  when:
    own_territory: true
    segments: [night]
  setup: 담장 너머로 물결이 지나간다. 철판에 어깨가 스치는 소리, 수십 개의 발 끄는 소리. 담 안의 모두가 숨을 죽였는데, 어디선가 아이 하나가 울기 시작한다.
  ai_direction: 물결은 그냥 지나가는 중이다. 울음이 길어지면 끝자락이 담장에 붙어 철판을 두드린다. 담이 무너지지는 않는다. 아이 엄마는 어쩔 줄 몰라 한다.
  choices:
    - id: hush
      label: 아이에게 가서 달랜다
      check: persuade
      outcomes:
        success:
          - faction_morale: { faction: own, delta: 1 }
          - belief: { fact: 아이를 달래 울음을 그치게 했다. 물결은 담을 따라 그냥 지나갔다, source: seen }
        partial:
          - belief: { fact: 울음은 잦아들었지만 담장 한쪽 철판이 몇 번 두드려졌다, source: seen }
        miss:
          - faction_morale: { faction: own, delta: -1 }
          - belief: { fact: 울음은 그치지 않았다. 담장 한쪽이 한참 두드려졌다. 다들 날이 샐 때까지 깨어 있었다, source: seen }
    - id: man_wall
      label: 칼을 쥐고 소리 나는 담장 쪽으로 간다
      effects:
        - deed: { summary: 물결이 지나가는 밤 담장으로 나가 지켰다, tags: [bravery], severity: 1, privacy: public }
        - belief: { fact: 담장 앞에서 철판 너머의 숨소리를 들었다. 다행히 아무것도 넘어오지 않았다, source: seen }
    - id: stay_still
      label: 제자리에서 숨을 죽인다
      effects: []

# ── 사람들 ─────────────────────────────────────────

- id: w_refugees_gate
  title: 정문 앞의 셋
  tags: [world]
  repeatable: true
  cooldown_days: 6
  when:
    own_territory: true
    segments: [morning, day]
    day_gte: 2
  cast:
    mother: { extra: refugee, label: 아이를 데린 여자 }
  setup: '정문 앞에 낯선 셋이 서 있다. 여자 하나, 다리를 저는 남자 하나, 열 살쯤 된 아이 하나. 여자가 말한다. "일할게요. 뭐든. 아이만이라도 들여보내 줘요." 보초가 당신을 본다. 요즘 {scarce:이/가} 모자란 건 다들 안다.'
  ai_direction: 진짜 피난민이다. 말을 거는 여자는 {mother}로 이미 인물로 만들었다 (남자와 아이는 서술로만). 받아들일지는 위에서 정한다. 당신은 말을 거들거나, 먹을 것을 주거나, 등을 돌릴 수 있다. 남자의 다리는 감염체에게 다친 게 아니다.
  choices:
    - id: share_food
      label: 가진 건빵을 아이 손에 쥐여 준다
      effects:
        - take_item: { item: dry_ration, quantity: 1 }
        - deed: { summary: 정문 앞 피난민 아이에게 먹을 것을 나눠 줬다, tags: [mercy], severity: 1, privacy: public }
    - id: speak_up
      label: 들여보내자고 말을 거든다
      check: persuade
      outcomes:
        success:
          - deed: { summary: 정문 앞 피난민을 들이자고 위에 말했다, tags: [mercy], severity: 1, privacy: public }
          - belief: { fact: 피난민 셋 중 여자와 아이를 들이기로 했다. 다리를 저는 남자는 하룻밤만 묵고 떠난다, source: seen }
        partial:
          - belief: { fact: 피난민들은 정문 밖 창고에서 하룻밤만 묵게 됐다. 그 뒤는 아무도 모른다, source: seen }
        miss:
          - belief: { fact: 피난민들은 돌려보내졌다. 아이가 몇 번이나 뒤를 돌아보았다, source: seen }
    - id: turn_away
      label: 받아 줄 여유가 없다고 돌려보낸다
      effects:
        - deed: { summary: 정문 앞 피난민을 돌려보내는 데 앞장섰다, tags: [selfishness], severity: 1, privacy: public }
        - belief: { fact: 피난민들을 돌려보냈다. 여자는 아무 말 없이 아이 손을 잡고 돌아섰다, source: seen }

- id: w_river_rumor
  title: 강가의 소문
  tags: [world]
  when:
    zones: [riverside, water_plant, e_market]
    segments: [morning, day]
  setup: 강가에서 물통을 채우던 사람들이 목소리를 낮춘다. 하류 다리 밑에 밤마다 불을 끈 배 한 척이 와서 선다고. 누구 배인지는 아무도 모른다고.
  ai_direction: 소문의 진위는 정해져 있지 않다. 셋 건너 들은 말이다. 확정하지 않는다. 묻는 사람이 너무 캐면 다들 입을 닫는다.
  choices:
    - id: ask_more
      label: 물통 하나를 들어 주며 더 묻는다
      check: persuade
      outcomes:
        success:
          - belief: { fact: 하류 다리 밑의 배는 강 건너에서 온다는 말이 있다. 배에서 내린 사람들이 소금과 약을 바꿔 간다고 한다, source: rumor }
        partial:
          - belief: { fact: 하류 다리 밑에 밤마다 불 끈 배가 선다는 소문이 있다, source: rumor }
        miss: []
    - id: listen
      label: 물을 뜨는 척하며 듣기만 한다
      effects:
        - belief: { fact: 하류 다리 밑에 밤마다 불 끈 배가 선다는 소문이 있다, source: rumor }
    - id: leave
      label: 물만 뜨고 자리를 뜬다
      effects: []

- id: w_lost_child
  title: 뒤집힌 버스의 아이
  tags: [world]
  when:
    zone_owner: [none]
    segments: [day, evening]
    flags_none: [w_child_found]
  setup: 뒤집힌 버스 안에서 무언가 움직인다. 들여다보니 아이다. 일곱 살쯤. 무릎을 끌어안고 소리 없이 운다. 운동화 한 짝이 없다.
  ai_direction: 아이는 어제 엄마와 물을 길으러 나왔다가 물결에 흩어졌다. 엄마는 살아서 가까운 거점에 있다. 아이는 겁에 질려 말을 잘 못 하고, 큰 소리를 내면 운다. 해가 지면 이 근처는 위험하다.
  choices:
    - id: take_along
      label: 아이를 업고 사람 있는 곳으로 데려간다
      effects:
        - set_flag: w_child_found
        - deed: { summary: 폐허의 뒤집힌 버스에서 길 잃은 아이를 데려왔다, tags: [mercy], severity: 1, privacy: public }
        - belief: { fact: 뒤집힌 버스에서 아이를 찾아 데려왔다. 엄마와 물을 길으러 나왔다가 흩어졌다고 한다, source: report }
    - id: calm_ask
      label: 쪼그려 앉아 이름과 엄마를 묻는다
      check: persuade
      outcomes:
        success:
          - set_flag: w_child_found
          - deed: { summary: 길 잃은 아이를 달래 엄마에게 가는 길을 찾아 주었다, tags: [mercy], severity: 1, privacy: semi_private }
          - belief: { fact: 아이는 엄마와 물을 길으러 나왔다가 물결에 흩어졌다고 했다. 엄마가 있는 곳까지 데려다주었다, source: report }
        partial:
          - belief: { fact: 아이는 이름만 겨우 말하고 다시 울었다, source: seen }
        miss:
          - belief: { fact: 아이가 버스 밖으로 뛰쳐나가 골목으로 사라졌다, source: seen }
    - id: leave_food
      label: 먹을 것을 두고 간다
      effects:
        - take_item: { item: dry_ration, quantity: 1 }
        - deed: { summary: 길 잃은 아이에게 먹을 것만 두고 떠났다, tags: [mercy], severity: 1, privacy: private }

- id: w_child_mother
  title: 운동화 한 짝
  tags: [world]
  when:
    segments: [morning, day]
    flags_all: [w_child_found]
  setup: '낯선 여자가 당신을 찾아왔다. 손에 작은 운동화 한 짝을 들고 있다. "버스에서 우리 애 찾아 준 분 맞죠."'
  ai_direction: 아이 엄마다. 아이는 무사하다. 가진 게 많지 않지만 빚지고는 못 산다는 사람이다. 받지 않으면 대신 자기가 들은 소식을 하나 알려 준다.
  choices:
    - id: accept
      label: 내미는 것을 받는다
      effects:
        - give_item: { item: canned_food }
        - belief: { fact: 아이 엄마가 통조림 하나를 내밀었다. 거절해도 두고 갈 기세였다, source: seen }
    - id: decline
      label: 됐다며 손을 젓는다
      effects:
        - belief: { fact: "아이 엄마가 대신 일러 주었다: 구시가 남쪽 약국 지하는 벌써 털렸고 지금은 감염체 소굴이라고", source: report }

- id: w_sick_traveler
  title: 기침하는 나그네
  tags: [world]
  when:
    own_territory: false
    segments: [day, evening]
    day_gte: 2
  setup: '무너진 담 그늘에 배낭을 멘 남자가 기대앉아 있다. 얼굴이 붉고 기침이 깊다. "물... 한 모금만." 소매 끝에 마른 피가 묻어 있다.'
  ai_direction: 남자는 감염이 아니라 폐렴에 가까운 병이다. 소매의 피는 남의 것이다. 물리지 않았지만 그걸 증명할 방법은 없다. 가까이 가면 병이 옮을 수도 있다는 불안을 준다.
  choices:
    - id: check_bite
      label: 거리를 두고 물린 자국이 있는지 살핀다
      check: infected_lore
      outcomes:
        success:
          - belief: { fact: 기침하는 나그네에게 물린 자국은 없었다. 열과 기침은 감염이 아니라 그냥 병이다, source: seen }
        partial:
          - belief: { fact: 나그네에게서 물린 자국은 찾지 못했지만 확신은 없다, source: seen }
        miss:
          - belief: { fact: 다가가자 나그네가 몸을 웅크렸다. 아무것도 확인하지 못했다, source: seen }
    - id: give_medicine
      label: 해열제를 나눠 준다
      effects:
        - take_item: { item: fever_reducer, quantity: 1 }
        - deed: { summary: 길에서 앓는 나그네에게 해열제를 나눠 줬다, tags: [mercy], severity: 1, privacy: private }
        - belief: { fact: 나그네에게 해열제를 주었다. 그는 강 하류 쪽으로 간다고 했다, source: report }
    - id: keep_away
      label: 입을 가리고 지나간다
      effects: []

- id: w_body_letter
  title: 승합차의 편지
  tags: [world]
  when:
    zone_owner: [none]
    segments: [morning, day]
  setup: '길가에 선 승합차 운전석에 남자가 엎드려 죽어 있다. 오래되지 않았다. 가슴 주머니에 접힌 편지가 삐죽 나와 있고, 겉봉에 "소희에게"라고 적혀 있다.'
  ai_direction: 남자는 추위와 허기로 죽었다. 물리지 않았다. 편지는 딸에게 쓴 것이다. 강 건너 남쪽 섬에 사람들이 모여 산다는 말을 들었고 그리 가서 기다리겠다는 내용이다. 사실인지는 아무도 모른다. 바지 주머니에 담배 몇 개비가 있다.
  choices:
    - id: read
      label: 편지를 꺼내 읽는다
      effects:
        - belief: { fact: 죽은 남자의 편지에는 강 건너 남쪽 섬에 사람들이 모여 산다는 말을 들었다고 적혀 있었다. 딸 소희에게 그리 가서 기다리겠다고 했다, source: seen }
    - id: search
      label: 주머니를 뒤진다
      effects:
        - give_item: { item: cigarettes }
        - deed: { summary: 길가에서 죽은 사람의 주머니를 뒤져 담배를 챙겼다, tags: [theft], severity: 1, privacy: private }
    - id: close_door
      label: 편지를 손에 쥐여 주고 차 문을 닫아 준다
      effects:
        - deed: { summary: 길가의 죽은 사람에게 편지를 쥐여 주고 차 문을 닫아 주었다, tags: [mercy], severity: 1, privacy: private }

# ── 폐허 ───────────────────────────────────────────

- id: w_ruin_stash
  title: 새것인 천장 판
  tags: [world]
  repeatable: true
  cooldown_days: 5
  when:
    zone_owner: [none]
    segments: [morning, day]
  setup: "{zone}의 무너진 편의점 창고. 천장 석고판 하나가 다른 것보다 새것이다. 누군가 손댄 자리다."
  ai_direction: 천장 위에 누군가 숨겨 둔 꾸러미가 있다. 숨긴 사람은 돌아오지 않았다. 석고판을 뜯으면 먼지와 소리가 난다. 근처 지하에 감염체가 있다.
  choices:
    - id: open
      label: 선반을 딛고 올라가 석고판을 뜯는다
      check: scavenge
      outcomes:
        success:
          - give_item: { item: canned_food }
          - give_item: { item: blanket }
          - belief: { fact: 편의점 천장 위에서 통조림과 담요를 찾았다. 비닐에 돌아온다고 적혀 있었다, source: seen }
        partial:
          - give_item: { item: canned_food }
          - belief: { fact: 석고판을 뜯다 소리가 크게 났다. 통조림 하나만 챙겨 서둘러 나왔다, source: seen }
        miss:
          - belief: { fact: 석고판이 통째로 무너졌다. 위에는 쥐 둥지뿐이었고 아래층에서 무언가 움직였다, source: seen }
    - id: mark
      label: 자리만 봐 두고 나중에 온다
      effects:
        - belief: { fact: "{zone}의 무너진 편의점 창고에 누가 손댄 천장 판이 있다", source: seen }
    - id: leave
      label: 남의 것이다. 손대지 않는다
      effects: []

- id: w_stray_dog
  title: 따라오는 누렁이
  tags: [world]
  when:
    own_territory: false
    segments: [morning, day, evening]
    flags_none: [w_dog_fed]
  setup: 갈비뼈가 드러난 누렁이 한 마리가 스무 걸음 뒤에서 따라온다. 멈추면 멈추고, 걸으면 걷는다. 짖지는 않는다.
  ai_direction: 사람 손에 길러졌던 개다. 짖지 않도록 배웠다. 먹을 것을 주면 거리를 두고 따라붙어, 이후 장면에도 가끔 나타난다. 감염체 냄새를 사람보다 먼저 맡는다.
  choices:
    - id: feed
      label: 건빵을 조금 떼어 던져 준다
      effects:
        - take_item: { item: dry_ration, quantity: 1 }
        - set_flag: w_dog_fed
        - belief: { fact: 짖지 않는 누렁이에게 건빵을 줬다. 개는 그 뒤로 거리를 두고 계속 따라온다, source: seen }
    - id: shoo
      label: 돌을 던져 쫓는다
      effects:
        - belief: { fact: 돌을 던지자 누렁이는 폐허 사이로 사라졌다. 짖지는 않았다, source: seen }
    - id: ignore
      label: 신경 쓰지 않고 걷는다
      effects: []

- id: w_dog_warns
  title: 그르렁거리는 개
  urgent: true
  tags: [world]
  when:
    own_territory: false
    segments: [evening, night]
    flags_all: [w_dog_fed]
  setup: 앞서가던 누렁이가 골목 입구에서 멈춰 선다. 털이 곤두서고, 목 안쪽에서 낮게 그르렁거린다. 골목은 조용하다. 너무 조용하다.
  ai_direction: 골목 안 쓰러진 냉장고 뒤에 감염체 둘이 웅크려 있다. 개는 그걸 맡았다. 실제 조우는 플레이어의 행동과 판정으로 정한다.
  choices:
    - id: detour
      label: 개를 믿고 다른 길로 돌아간다
      effects:
        - set_flag: w_dog_trusted
        - belief: { fact: 누렁이가 멈춘 골목을 피해 돌아갔다. 등 뒤 골목에서 무언가 넘어지는 소리가 났다, source: seen }
    - id: peek
      label: 몸을 낮추고 골목 안을 살핀다
      check: sense_danger
      outcomes:
        success:
          - set_flag: w_dog_trusted
          - belief: { fact: 골목 안 쓰러진 냉장고 뒤에 감염체 둘이 웅크려 있었다. 개가 먼저 알았다, source: seen }
        partial:
          - belief: { fact: 골목 안에 무언가 있다. 숨소리 같은 것이 들렸다, source: seen }
        miss:
          - belief: { fact: 아무것도 보이지 않았다. 누렁이가 뒷걸음질 친다, source: seen }

# ── 무전 ───────────────────────────────────────────

- id: w_radio_static
  title: 잡음 속의 숫자
  tags: [world]
  when:
    has_items: [radio]
    segments: [night]
    flags_none: [w_heard_broadcast]
  setup: 무전기 잡음 사이로 사람 목소리가 섞인다. 여자 목소리. 숫자를 천천히 읽는다. 셋, 일곱, 둘. 그리고 날씨. "내일 남쪽은 맑음." 다시 잡음.
  ai_direction: 방송의 출처는 정해져 있지 않다. 밤마다 같은 시각에 되풀이된다. 가람시 무리들이 쓰는 주파수가 아니다. 확정하지 않는다.
  choices:
    - id: listen
      label: 귀를 대고 끝까지 듣는다
      check: sense_danger
      outcomes:
        success:
          - set_flag: w_heard_broadcast
          - belief: { fact: 밤마다 무리들이 쓰지 않는 주파수에서 여자가 숫자와 날씨를 읽는다. 끝에 남쪽 섬과 보름이라는 말이 섞였다, source: seen }
        partial:
          - set_flag: w_heard_broadcast
          - belief: { fact: 무전기에서 낯선 여자가 숫자와 날씨를 읽는 방송을 들었다, source: seen }
        miss:
          - belief: { fact: 잡음이 너무 심해 몇 마디밖에 듣지 못했다. 배터리만 닳았다, source: seen }
    - id: switch_off
      label: 배터리를 아끼려 끈다
      effects: []

- id: w_radio_again
  title: 끊긴 방송
  tags: [world]
  when:
    has_items: [radio]
    segments: [night]
    day_gte: 6
    flags_all: [w_heard_broadcast]
  setup: '같은 주파수, 같은 여자 목소리. 이번에는 숫자 대신 말을 한다. "...듣는 사람 있으면, 하류 다리. 보름날 밤." 그리고 처음으로 방송이 중간에 뚝 끊긴다.'
  ai_direction: 방송이 왜 끊겼는지는 정해져 있지 않다. 강가의 소문(하류 다리 밑의 배)과 이어질 수 있지만 확정하지 않는다. 다음 날부터 그 주파수에는 잡음만 남는다.
  choices:
    - id: note
      label: 날짜와 장소를 적어 둔다
      effects:
        - belief: { fact: 무전 방송의 여자가 하류 다리와 보름날 밤을 말했다. 방송은 처음으로 중간에 끊겼다, source: seen }
    - id: tell
      label: 믿을 만한 사람에게 이야기한다
      effects:
        - belief: { fact: 무전 방송 이야기를 하자 듣던 사람은 반쯤 웃다가 조용해졌다. 다들 남쪽 섬 이야기는 한 번쯤 들어 봤다고 한다, source: report }
    - id: forget
      label: 헛것이라 여기고 무전기를 끈다
      effects: []
