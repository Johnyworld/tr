  ai_direction: 붉은연합의 노역조는 할당량에 묶여 있다. 할당량을 못 채우면 배급이 깎인다. 떠돌이가 거들면 감독이 떠돌이까지 노역조로 셈하려 들 수도 있다.
  choices:
    - id: help
      label: 흙을 같이 퍼 담는다
      check: stealth
      outcomes:
