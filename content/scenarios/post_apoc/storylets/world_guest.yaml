      label: 남의 마을 당번까지는 못 선다고 한다
      effects: []

- id: gu_c_ledger_check
  title: 붉은연합의 출입 장부
  tags: [world]
  repeatable: true
  cooldown_days: 5
  when:
    # 장소 종류 (12-300)
    place_kinds: [gate]
    factions: [none]
    owners: [faction_c]
    indoor: "any"
    segments: [morning, day, evening]
  cast:
    clerk: { extra: c_discipline, label: 규율반원 }
  setup: "{clerk:이/가} 장부를 펼치고 연필 끝을 핥는다. \"이름. 출신. 들고 온 것. 머물 시간. 할 일.\" 하나라도 빠지면 다시 처음부터다. 뒤에서 노역조가 고개를 숙인 채 지나간다."
  ai_direction: 붉은연합에서는 손님도 장부에 오른다. 규율반은 모든 것을 적는다. 거짓을 적으면 나중에 맞춰 본다. 할 일이 없는 사람은 노역조로 데려가고 싶어 한다.
  choices:
    - id: honest
      label: 묻는 대로 다 대답한다
      effects:
        - relation: { who: clerk, axis: trust, delta: 1 }
        - delay: 60
    - id: vague
      label: 이름과 머물 시간만 둘러댄다
      check: deceive
      outcomes:
        success:
          - delay: 30
        partial:
          - delay: 90
          - relation: { who: clerk, axis: trust, delta: -1 }
        miss:
          - relation: { who: clerk, axis: trust, delta: -2 }
          - delay: 120
          - belief: { fact: "붉은연합 규율반원이 내 대답을 장부에 적고 밑줄을 그었다. 나를 지켜보라는 표시다", source: seen }
    - id: bribe
      label: 담배 한 갑을 장부 사이에 끼운다
      effects:
        - take_item: { item: cigarettes }
        - relation: { who: clerk, axis: affection, delta: 1 }

- id: gu_c_labor_line
  title: 노역조의 줄
