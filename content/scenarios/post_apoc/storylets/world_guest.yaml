          - relation: { who: laborer, axis: trust, delta: 2 }
          - deed: { summary: 붉은연합 노역조의 쏟은 흙을 몰래 같이 퍼 담았다, tags: [mercy], severity: 1, privacy: private }
        partial:
          - relation: { who: laborer, axis: trust, delta: 1 }
          - delay: 120
          - body: { track: fatigue, delta: 1 }
        miss:
          - delay: 240
          - body: { track: fatigue, delta: 1 }
          - belief: { fact: "붉은연합 노역조를 거들다 감독에게 붙들려 반나절 흙을 날랐다. 떠돌이도 거든 순간 노역조로 셈한다", source: seen }
    - id: away
      label: 눈을 돌린다
      effects: []

- id: gu_d_waiting_room
  title: 하얀매의 대기 줄
  tags: [world]
  repeatable: true
  cooldown_days: 5
  when:
    factions: [none]
    owners: [faction_d]
    indoor: false
    segments: [morning, day]
  cast:
    orderly: { extra: d_orderly, label: 간호조무사 }
  setup: "진료소 앞 대기 줄이 길다. 다친 사람, 열이 나는 아이, 기침하는 노인. 각 무리의 사람이 섞여 있다. {orderly:이/가} 번호표를 나눠 주며 묻는다. \"어디가 아파요? 아니면 줄 정리 좀 도와줄래요? 오늘 사람이 모자라요.\""
  ai_direction: 하얀매의 진료소는 중립이라 여러 무리 사람이 섞인다. 대기 줄에서는 각 무리의 소식이 오간다. 줄 정리를 도우면 하얀매 사람들이 고마워한다. 규칙에는 예외가 없다 (번호표 순서).
  choices:
    - id: help
      label: 줄을 정리하고 물을 나른다
      effects:
        - relation: { who: orderly, axis: affection, delta: 1 }
        - deed: { summary: 하얀매 진료소의 대기 줄 정리를 도왔다, tags: [diligence], severity: 1, privacy: public }
        - delay: 120
    - id: listen
      label: 줄에 선 사람들 이야기를 듣는다
      effects:
        - overhear: { faction: other, source: rumor }
    - id: skip
      label: 급하다며 앞으로 끼어든다
      check: deceive
      outcomes:
        success:
          - relation: { who: orderly, axis: trust, delta: -1 }
        partial:
          - relation: { who: orderly, axis: trust, delta: -1 }
          - delay: 60
        miss:
          - relation: { who: orderly, axis: trust, delta: -2 }
          - deed: { summary: 하얀매 진료소 대기 줄에 끼어들다 들켰다, tags: [selfishness], severity: 1, privacy: public }

