# 남의 땅의 손님 (떠돌이·무소속). 다른 무리의 거점과 땅에 머무는 무소속 주인공에게 되풀이해 열린다
# 남의 땅에서는 우리 무리 이야기(쉬는 시간, 배급, 분대)가 열리지 않아 이야기가 비었다
# 손님은 셈이 먼저다: 일손을 팔고, 눈치를 보고, 규칙을 배우고, 가끔은 그 무리에 들어오라는 말을 듣는다
# 앞쪽은 어느 무리 땅에서나, 뒤쪽은 그 땅 주인(owners)에 맞춘 것

# ── 어느 무리 땅에서나 ──

- id: gu_day_labor
  title: 하루 품삯
  tags: [world]
  repeatable: true
  cooldown_days: 3
  when:
    factions: [none]
    zone_owner: [other]
    indoor: false
    segments: [morning, day]
  cast:
    boss: { faction: zone_owner, here: true }
  setup: "{boss:이/가} 무너진 담 앞에서 손짓한다. \"떠돌이지? 오늘 하루 짐 나르고 흙 퍼 주면 밥은 먹여 주지. 손 놀리는 만큼만.\""
  variants:
    - "아침부터 이 땅 사람들이 바쁘다. {boss:이/가} 당신을 위아래로 훑어본다. \"일할 거면 저기 줄에 서. 해 질 때까지야.\""
    - "{boss:이/가} 수레를 가리킨다. \"바퀴가 빠졌어. 고치든 밀든 하루 거들면 한 끼, 잘하면 두 끼.\""
  ai_direction: 무리는 떠돌이를 하루 일꾼으로 쓰고 밥으로 셈한다. 일을 잘하면 이 땅 사람들의 눈이 조금 부드러워진다. 떠돌이는 무리 사람보다 일을 더 받고 덜 받는다는 것을 다들 안다.
  choices:
    - id: work
      label: 소매를 걷고 하루 일한다
      check: endure
      outcomes:
        success:
          - give_item: { item: dry_ration, quantity: 2 }
          - relation: { who: boss, axis: respect, delta: 1 }
          - body: { track: fatigue, delta: 1 }
          - delay: 240
        partial:
          - give_item: { item: dry_ration }
          - body: { track: fatigue, delta: 1 }
          - delay: 240
        miss:
          - body: { track: fatigue, delta: 1 }
          - relation: { who: boss, axis: respect, delta: -1 }
          - delay: 180
    - id: haggle
      label: 끼니 말고 탄약으로 달라고 흥정한다
      check: persuade
      outcomes:
        success:
          - give_item: { item: pistol_rounds }
          - delay: 240
        partial:
          - give_item: { item: dry_ration }
          - delay: 240
        miss:
          - relation: { who: boss, axis: affection, delta: -1 }
    - id: pass
      label: 오늘은 됐다고 한다
      effects: []

- id: gu_stranger_eyes
  title: 낯선 얼굴
  tags: [world]
  repeatable: true
  cooldown_days: 4
  when:
    indoor: false
    factions: [none]
    zone_owner: [other]
    segments: [day, evening]
  cast:
    sentry: { faction: zone_owner, here: true }
  setup: "어딜 가든 시선이 따라붙는다. 우물가에서도, 담 그늘에서도. 결국 {sentry:이/가} 앞을 막아선다. \"너, 어제도 있었지. 여기서 뭐 하는 거야? 볼일이 끝났으면 해 지기 전에 나가.\""
  variants:
    - "{sentry:이/가} 총끝으로 당신 배낭을 가리킨다. \"열어 봐. 떠돌이는 다 보는 게 규칙이야.\""
  ai_direction: 떠돌이는 어느 무리에서나 의심받는다. 이 사람은 규칙대로 할 뿐 악의는 없다. 볼일을 분명히 대거나 이 땅 사람 누군가의 이름을 대면 풀린다. 버티면 판정이다.
  choices:
    - id: explain
      label: 볼일을 차분히 설명한다
      check: persuade
      outcomes:
        success:
          - relation: { who: sentry, axis: trust, delta: 1 }
        partial:
          - delay: 60
        miss:
          - relation: { who: sentry, axis: trust, delta: -1 }
          - delay: 60
    - id: open_pack
      label: 순순히 배낭을 열어 보인다
      effects:
        - relation: { who: sentry, axis: trust, delta: 1 }
        - delay: 30
    - id: stare
      label: 떠돌이도 사람이라고 맞받는다
      check: intimidate
      outcomes:
        success:
          - relation: { who: sentry, axis: respect, delta: 1 }
        partial:
          - relation: { who: sentry, axis: trust, delta: -1 }
        miss:
          - relation: { who: sentry, axis: trust, delta: -2 }
          - wound: { steps: 1, cause: 남의 땅 보초와 시비가 붙어 개머리판에 맞았다 }

- id: gu_join_us
  title: 여기서 살 생각 없나
  tags: [world]
  repeatable: true
  cooldown_days: 8
  when:
    factions: [none]
    zone_owner: [other]
    indoor: "any"
    segments: [day, evening]
    day_gte: 3
  cast:
    recruiter: { faction: zone_owner, here: true, ranks: [squad_leader, officer, resident, leader] }
  setup: "{recruiter:이/가} 당신이 일하는 걸 한참 지켜보다가 다가온다. \"떠돌기엔 손이 아깝네. 겨울엔 혼자 못 버텨. 우리 쪽에 들어오면 배급표 하나는 내가 만들어 주지.\""
  ai_direction: 진심으로 하는 제안이다. 무리에 들어오는 길은 이 이야기가 아니라 그 무리의 정식 절차(사람을 만나고, 일을 맡고, 받아들여지는 것)로 이어진다. 이 장면은 그 문이 열려 있다는 것을 알리는 데까지다. 거절해도 무례로 여기지 않는다.
  choices:
    - id: interested
      label: 어떻게 하면 되느냐고 묻는다
      effects:
        - relation: { who: recruiter, axis: trust, delta: 1 }
        - belief: { fact: "{recruiter:이/가} 무리에 들어올 생각이 있으면 배급표를 만들어 주겠다고 했다. 받아들여지려면 그 무리의 일을 맡아 쓸모를 보여야 한다", source: report }
    - id: think
      label: 생각해 보겠다고 한다
      effects:
        - relation: { who: recruiter, axis: affection, delta: 1 }
    - id: free
      label: 아무 데도 매이지 않겠다고 한다
      effects:
        - relation: { who: recruiter, axis: respect, delta: 1 }

- id: gu_cheap_room
  title: 남의 지붕 아래
  tags: [world]
  repeatable: true
  cooldown_days: 4
  when:
    factions: [none]
    zone_owner: [other]
    indoor: false
    segments: [evening]
    activities_none: [sleep, combat]
  cast:
    host: { faction: zone_owner, here: true }
  setup: "해가 진다. 떠돌이에게 밤의 담 밖은 위험하다. {host:이/가} 창고 문을 반쯤 열어 준다. \"오늘 밤만이야. 짚 위에서 자고, 새벽에 나가. 대신 뭐 하나 내놔.\""
  variants:
    - "{host:이/가} 담 안 처마 밑을 턱으로 가리킨다. \"비는 피하겠지. 공짜는 아니고.\""
  ai_direction: 무리의 땅에서 떠돌이가 밤을 나는 값이다. 머무는 동안 이 땅 사람들의 밤 이야기가 들린다. 밤새 물건을 지켜야 한다는 것도 떠돌이는 안다.
  choices:
    - id: pay
      label: 통조림 하나를 내고 지붕 아래서 잔다
      effects:
        - take_item: { item: canned_food }
        - body: { track: fatigue, delta: -1 }
        - body: { track: cold, delta: -1 }
        - relation: { who: host, axis: affection, delta: 1 }
    - id: cig
      label: 담배 한 갑으로 셈한다
      effects:
        - take_item: { item: cigarettes }
        - body: { track: fatigue, delta: -1 }
        - overhear: { faction: zone_owner, source: rumor }
    - id: no
      label: 담 밖에서 알아서 자겠다고 한다
      effects: []

- id: gu_rule_broken
  title: 몰랐던 규칙
  tags: [world]
  repeatable: true
  cooldown_days: 6
  when:
    factions: [none]
    zone_owner: [other]
    indoor: "any"
    segments: [morning, day, evening]
  cast:
    local: { faction: zone_owner, here: true }
  setup: "{local:이/가} 얼굴을 붉히며 다가온다. \"거기서 뭐 하는 거야! 그건 여기서 하면 안 되는 거야. 떠돌이라 몰랐다고 하면 다야?\" 주위 사람들이 일손을 멈추고 본다."
  ai_direction: "무리마다 규칙이 다르다 (그 무리의 문화 규칙에서 하나를 고른다. 줄을 서는 법, 물을 길어 가는 양, 무기를 들고 다녀도 되는 곳, 인사하는 법). 주인공은 몰랐다. 사과하고 배우면 이 땅 사람들이 조금 누그러진다."
  choices:
    - id: sorry
      label: 몰랐다고 사과하고 규칙을 묻는다
      effects:
        - relation: { who: local, axis: affection, delta: 1 }
        - belief: { fact: "이 무리의 땅에서 모르고 규칙을 어겼다. {local:이/가} 무엇이 안 되는지 일러 주었다", source: report }
    - id: talk_out
      label: 떠돌이에게도 알려 줘야 하는 것 아니냐고 따진다
      check: persuade
      outcomes:
        success:
          - relation: { who: local, axis: respect, delta: 1 }
        partial:
          - relation: { who: local, axis: affection, delta: -1 }
        miss:
          - relation: { who: local, axis: trust, delta: -1 }
          - deed: { summary: 남의 땅에서 규칙을 어기고 큰소리쳤다, tags: [disobedience], severity: 1, privacy: public }

- id: gu_market_corner
  title: 담 그늘의 맞바꾸기
  tags: [world]
  repeatable: true
  cooldown_days: 3
  when:
    indoor: false
    factions: [none]
    zone_owner: [other]
    segments: [day, evening]
  cast:
    swapper: { faction: zone_owner, here: true }
  setup: "{swapper:이/가} 담 그늘에서 손짓한다. 주머니에서 무언가를 반쯤 꺼내 보인다. \"떠돌이면 바깥 물건 있지? 우리 쪽은 배급표로만 사고팔아서 답답하거든. 조용히 맞바꾸자.\""
  ai_direction: 무리 안의 작은 뒷거래다. 들키면 이 사람이 곤란하지 떠돌이는 대개 쫓겨나는 걸로 끝난다. 이 사람은 무리 안에서 귀한 것을 바깥 것과 바꾸고 싶어 한다.
  choices:
    - id: smokes
      label: 담배 한 갑을 내고 붕대와 바꾼다
      effects:
        - take_item: { item: cigarettes }
        - give_item: { item: bandage, quantity: 2 }
        - relation: { who: swapper, axis: trust, delta: 1 }
    - id: rounds
      label: 통조림을 내고 탄약과 바꾼다
      effects:
        - take_item: { item: canned_food }
        - give_item: { item: pistol_rounds }
    - id: news
      label: 물건 대신 바깥 소식으로 셈하자고 한다
      check: persuade
      outcomes:
        success:
          - give_item: { item: dry_ration }
          - overhear: { faction: zone_owner, source: rumor }
        partial:
          - overhear: { faction: zone_owner, source: rumor }
        miss:
          - relation: { who: swapper, axis: affection, delta: -1 }

- id: gu_child_follows
  title: 떠돌이 구경
  tags: [world]
  repeatable: true
  cooldown_days: 6
  when:
    factions: [none]
    zone_owner: [other]
    indoor: false
    segments: [day]
  setup: "이 땅 아이 둘이 아까부터 멀찍이 따라온다. 돌아보면 담 뒤로 숨고, 걸으면 또 따라온다. 결국 하나가 용기를 내 묻는다. \"아저씨는 어디서 왔어요? 바깥엔 진짜 아무도 없어요?\""
  ai_direction: 무리 안에서 자란 아이들에게 떠돌이는 신기한 구경거리다. 어른이 보면 아이들을 불러들인다. 아이들은 떠돌이의 바깥 이야기를 다음 날 다른 아이들에게 부풀려 옮긴다. 호칭은 주인공의 성별과 나이에 맞게 바꾼다.
  choices:
    - id: story
      label: 바깥 이야기를 하나 들려준다
      effects:
        - body: { track: nerves, delta: -1 }
    - id: gift
      label: 주머니의 작은 것을 하나 쥐여 준다
      when: { has_items_any: [dry_ration, apple, egg] }
      effects:
        - deed: { summary: 남의 땅 아이들에게 먹을 것을 나눠 주었다, tags: [mercy], severity: 1, privacy: public }
    - id: shoo
      label: 가라고 손을 젓는다
      effects: []

- id: gu_patrol_hand
  # 다른 무리의 바깥 무리를 그리는가 (이야기 묶음): 아니다 (땅 주인의 경보·무리 안의 일·무리 없는 사람)
  party_story: false
  title: 순찰에 한 사람
  tags: [world]
  repeatable: true
  cooldown_days: 5
  when:
    factions: [none]
    zone_owner: [other]
    indoor: "any"
    segments: [dawn, morning, day]
    day_gte: 2
  cast:
    leader: { faction: zone_owner, here: true }
  setup: "{leader:이/가} 탄띠를 매며 말한다. \"순찰 나가는데 한 명이 앓아누웠어. 떠돌이면 바깥 길은 잘 알지? 따라와서 눈만 빌려줘. 돌아오면 탄약 몇 발.\""
  ai_direction: 무리 땅 둘레를 도는 짧은 순찰이다. 대개 별일 없다. 떠돌이의 눈은 무리 사람과 다른 것을 본다 (발자국, 흔적, 길). 잘하면 이 무리 사람들이 주인공을 기억한다.
  choices:
    - id: go
      label: 따라나선다
      check: sense_danger
      outcomes:
        success:
          - give_item: { item: pistol_rounds, quantity: 2 }
          - relation: { who: leader, axis: respect, delta: 2 }
          - deed: { summary: 남의 무리 순찰에 따라가 흔적을 먼저 찾았다, tags: [diligence], severity: 1, privacy: semi_private }
          - delay: 180
        partial:
          - give_item: { item: pistol_rounds }
          - delay: 180
        miss:
          - relation: { who: leader, axis: trust, delta: -1 }
          - body: { track: fatigue, delta: 1 }
          - delay: 180
    - id: no
      label: 남의 땅 일에 끼지 않는다
      effects: []

# ── 땅 주인에 맞춘 것 ──

- id: gu_a_shared_table
  title: 청솔의 식당 줄
  tags: [world]
  repeatable: true
  cooldown_days: 5
  when:
    # 장소 종류 (12-300)
    place_kinds: [mess]
    factions: [none]
    owners: [faction_a]
    indoor: true
    segments: [evening]
  cast:
    brother: { faction: faction_a, here: true }
  setup: "청솔형제단 식당 줄 맨 끝에 서자 {brother:이/가} 돌아본다. 지도부 사람도 같은 줄에 서 있다. \"손님이야? 여기선 다 같이 줄 서. 대신 국은 같은 국자로 퍼.\" 주위에서 웃음이 난다."
  ai_direction: 청솔형제단은 '버리지 않는다'를 자랑으로 삼는다. 손님에게도 한 그릇은 준다. 대신 형제단 사람들은 손님이 뭘 하는 사람인지 궁금해하고, 저녁 내내 질문을 한다.
  choices:
    - id: eat
      label: 줄을 서서 한 그릇 받는다
      effects:
        - body: { track: hunger, delta: -1 }
        - relation: { who: brother, axis: affection, delta: 1 }
    - id: help_dishes
      label: 먹고 나서 설거지를 거든다
      effects:
        - body: { track: hunger, delta: -1 }
        - relation: { who: brother, axis: respect, delta: 1 }
        - deed: { summary: 청솔형제단 식당에서 얻어먹고 설거지를 거들었다, tags: [diligence], severity: 1, privacy: public }

- id: gu_a_wall_mend
  title: 청솔의 담장 보수
  tags: [world]
  repeatable: true
  cooldown_days: 6
  when:
    # 장소 종류 (12-300)
    place_kinds: [gate]
    factions: [none]
    owners: [faction_a]
    indoor: false
    segments: [morning, day]
  cast:
    crew: { extra: a_wall_crew, label: 담장 보수조 }
  setup: "{crew:이/가} 무너진 담 앞에서 벽돌을 나른다. 하나가 허리를 짚고 주저앉는다. \"거기 손님. 잠깐만 들어 줘. 저 쪽 모서리만 올리면 오늘 밤은 버틴다.\""
  ai_direction: 청솔형제단의 담은 날마다 어딘가 무너지고 날마다 고친다. 보수조는 고되고 손이 모자란다. 거들면 형제단은 그 일을 잊지 않는다.
  choices:
    - id: lift
      label: 벽돌을 같이 쌓는다
      check: carpentry
      outcomes:
        success:
          - relation: { who: crew, axis: respect, delta: 2 }
          - give_item: { item: dry_ration }
        partial:
          - relation: { who: crew, axis: affection, delta: 1 }
          - body: { track: fatigue, delta: 1 }
        miss:
          - wound: { steps: 1, cause: 담 보수를 거들다 벽돌에 손을 찧었다 }
    - id: pass
      label: 지나간다
      effects: []

- id: gu_b_village_gossip
  title: 버들마을 우물가
  tags: [world]
  repeatable: true
  cooldown_days: 4
  when:
    # 장소 종류 (12-300)
    place_kinds: [yard]
    factions: [none]
    owners: [faction_b]
    indoor: false
    segments: [morning, day]
  cast:
    auntie: { extra: b_villager, label: 우물가 이웃 }
  setup: "버들마을 우물가는 늘 시끄럽다. {auntie:이/가} 물동이를 내려놓고 당신을 붙잡는다. \"처음 보는 얼굴이네. 어디서 왔어? 밥은 먹었고? 혹시 오다가 정씨네 막내 못 봤어? 키가 이만한데.\""
  ai_direction: 버들마을은 말이 많고 정이 많다. 우물가 수다에 끼면 마을 사정이 다 들린다 (누가 누구와 다퉜는지, 회의에서 뭐가 정해졌는지, 경비 당번이 누구인지). 찾는 막내는 이 이야기에서 찾을 필요가 없다 (그냥 걱정이다).
  choices:
    - id: chat
      label: 물동이를 들어 주며 수다에 낀다
      effects:
        - relation: { who: auntie, axis: affection, delta: 1 }
        - overhear: { faction: faction_b, source: rumor }
    - id: news
      label: 오는 길에 본 것을 들려준다
      effects:
        - relation: { who: auntie, axis: trust, delta: 1 }
        - body: { track: nerves, delta: -1 }

- id: gu_b_duty_swap
