  ai_direction: 버들마을 경비는 돌아가며 서는 당번이다. 떠돌이에게 당번을 맡기는 건 규칙 위반에 가깝지만 사정이 급하다. 밤은 대개 조용하다.
  choices:
    - id: stand
      label: 대신 서 준다
      check: sense_danger
      outcomes:
        success:
          - give_item: { item: potato, quantity: 3 }
          - relation: { who: guard, axis: trust, delta: 2 }
          - deed: { summary: 버들마을 이웃의 밤 당번을 대신 서 주었다, tags: [mercy], severity: 1, privacy: semi_private }
        partial:
          - give_item: { item: potato, quantity: 2 }
          - body: { track: fatigue, delta: 1 }
        miss:
          - body: { track: fatigue, delta: 1 }
          - body: { track: cold, delta: 1 }
