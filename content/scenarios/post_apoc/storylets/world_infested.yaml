# 감염체가 몰려든 구역 (12-112): 구역의 감염체 압력이 높을 때 열리고, 소탕하면 압력이 내려간다
# 압력은 총소리·교전의 시체로 오르고 날이 가며 기준값으로 돌아간다 (scenario.infestation)

- id: wi_infested_streets
  title: 몰려든 것들
  cast:
    inf_a: { extra: infected_hungry, label: 길모퉁이의 감염체 }
    inf_b: { extra: infected_crawler, label: 차 밑의 감염체 }
  fright: 1
  tags: [world, infested]
  repeatable: true
  cooldown_days: 4  # 12-138: 자동 플레이에서 너무 자주 되풀이돼 늘렸다
  weight: 1
  when:
    # 글에 맞춘 자리 (12-262, content:check story_lint)
    indoor: false
    zone_infested_gte: 3
    zone_owner: [none, other]
  setup: "{zone:이/가} 며칠 사이 달라졌다. 길마다 새 발자국이 겹치고, 뜯긴 시체가 치워지지 않은 채 널려 있다. 길모퉁이에 하나, 뒤집힌 차 밑에서 또 하나가 고개를 든다. 더 안쪽에서도 발 끄는 소리가 이어진다."
  # 되풀이될 때 차례로 쓰는 다른 상황 문장 (12-139)
  variants:
    - "{zone}에 들어서자 파리 떼가 먼저 맞는다. 담벼락마다 검게 마른 핏자국, 길가에 흩어진 뼈. 버스 정류장 의자 밑에서 하나, 그 너머 골목 끝에서 또 하나가 몸을 일으킨다."
    - "{zone}의 공기가 달라졌다. 바람이 멎은 골목마다 단내가 고였다. 쓰레기 더미가 꿈틀하더니 그 밑에서 하나가 기어 나오고, 길모퉁이의 하나가 이쪽으로 고개를 돌린다."
  ai_direction: 이 구역에 감염체가 몰려들었다 (총소리나 싸움의 시체가 불렀다). 눈앞의 둘은 장면의 감염체 배역이고 안쪽에 더 있다. 하나씩 끌어내 처리하면 구역이 조금 조용해진다. 맞붙으면 배역을 target·opponent로 두고 위험을 먼저 선언한다. 총을 쏘면 더 모인다.
  choices:
    - id: sweep
      label: 하나씩 끌어내 조용히 처리한다
      check: fight
      outcomes:
        success:
          - infested: -1
          - merit: 1
          - deed: { summary: "감염체가 몰려든 {zone}에서 하나씩 끌어내 처리했다", tags: [bravery], severity: 1, privacy: semi_private }
          - belief: { fact: "{zone}에 몰려든 감염체를 몇 처리했다. 한동안은 조금 조용할 것이다", source: seen }
        partial:
          - infested: -1
          - body: { track: nerves, delta: 1 }
          - belief: { fact: "{zone}의 감염체를 몇 처리했지만 끝이 없었다", source: seen }
        miss:
          - zone_noise: 1
          - belief: { fact: "{zone}에서 감염체를 끌어내다 소란이 났다. 안쪽 것들까지 깼다", source: seen }
    - id: lure
      label: 소리를 내는 덫을 놓아 다른 쪽으로 끌어낸다
      check: improvise
      outcomes:
        success:
          - infested: -1
          - belief: { fact: "{zone}의 감염체 떼를 덫 소리로 다른 쪽으로 끌어냈다", source: seen }
        partial:
          - belief: { fact: "덫 소리에 몇이 끌려갔지만 대부분은 남았다", source: seen }
        miss:
          - zone_noise: 1
          - belief: { fact: "덫이 엉뚱한 때 울려 감염체들이 이쪽을 돌아봤다", source: seen }
    - id: avoid
      label: 건드리지 않고 빠져나간다
      effects:
        - belief: { fact: "{zone}에 감염체가 몰려 있다. 당분간 피해 다니는 게 낫다", source: seen }

- id: wi_infested_wall
  title: 담 밖에 모이는 것들
  fright: 1
  tags: [world, infested]
  repeatable: true
  cooldown_days: 3
  weight: 1
  when:
    # 장소 종류 (12-300)
    place_kinds: [watch, gate]
    zone_infested_gte: 2
    zone_owner: [own]
    segments: [evening]
    indoor: false
  setup: "해가 지자 담 밖이 술렁인다. 망루의 손전등이 비출 때마다 그림자가 늘어 있다. 담 밑을 긁는 소리가 밤새 이어질 것 같다."
  ai_direction: 우리 땅 둘레에 감염체가 모여들었다 (근처의 총소리나 싸움 뒤의 시체 때문이다). 담을 넘지는 못했다. 담을 손보거나, 밤에 나가 쓸어 내거나, 그냥 버틸 수 있다. 밖에 나가 맞붙으면 감염체를 spawn_extra로 들이고 위험을 먼저 선언한다.
  choices:
    - id: shore_up
      label: 판자와 철사로 담 밑을 보강한다
      check: carpentry
      outcomes:
        success:
          - fortify: 1
          - merit: 1
          - belief: { fact: 감염체가 모인 밤에 담 밑을 보강했다, source: seen }
        partial:
          - belief: { fact: 담 밑을 손봤지만 한쪽은 여전히 약하다, source: seen }
        miss:
          - faction_morale: { faction: own, delta: -1 }
          - belief: { fact: 담을 손보다 판자가 무너져 사람들이 놀랐다, source: seen }
    - id: clear_out
      label: 몇 사람과 밤에 나가 담 밖을 쓸어 낸다
      check: fight
      outcomes:
        success:
          - infested: -1
          - merit: 1
          - deed: { summary: 담 밖에 모인 감염체를 밤에 나가 쓸어 냈다, tags: [bravery], severity: 1, privacy: public }
        partial:
          - infested: -1
          - body: { track: nerves, delta: 1 }
        miss:
          - faction_morale: { faction: own, delta: -1 }
          - belief: { fact: 담 밖을 쓸러 나갔다가 쫓겨 들어왔다, source: seen }
    - id: wait_out
      label: 불을 줄이고 밤을 버틴다
      effects:
        - belief: { fact: 감염체가 담 밖에 모인 밤을 숨죽여 버텼다, source: seen }
