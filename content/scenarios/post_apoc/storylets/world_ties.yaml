# 인물 사이의 관계 이야기 (기획서 7.10). 정해진 관계든 판마다 생긴 관계든 배역 tie로 고른다
# - tie.cross: 무리가 다른 상대만 (적대 무리에 갈라진 가족)

- id: wt_letter_across
  title: 저쪽에 있는 사람
  tags: [world]
  when:
    segments: [evening, night]
    day_gte: 3
  cast:
    asker: { faction: own, known: true, trust_gte: 2 }
    kin: { tie: { of: asker, kinds: [sibling, parent, child, spouse], cross: true }, enter: false }
  setup: "{asker:이/가} 주위를 살피고 접힌 쪽지를 내민다. \"이거… 저쪽 무리에 있는 {kin}에게 전해 줄 수 있어? 내 가족이야. 아무한테도 말하지 마.\""
  ai_direction: 쪽지에는 안부뿐이다. 하지만 적대 무리에 가족이 있다는 것이 알려지면 이 사람은 의심받는다. 전해 주려면 그쪽 땅에 들어가야 한다. 거절해도 이 사람은 원망하지 않지만, 윗선에 알리면 끝이다.
  choices:
    - id: carry
      label: 받아 든다
      effects:
        - reveal_tie: { who: asker, other: kin }
        - relation: { who: asker, axis: trust, delta: 2 }
        - set_flag: wt_letter_carried
        - belief: { fact: "{asker}의 가족 {kin}이(가) 다른 무리에 있다. 안부 쪽지를 전해 주기로 했다", source: seen }
    - id: refuse
      label: 그럴 수 없다고 돌려준다
      effects:
        - reveal_tie: { who: asker, other: kin }
        - relation: { who: asker, axis: affection, delta: -1 }
    - id: report
      label: 상관에게 알린다
      effects:
        - reveal_tie: { who: asker, other: kin }
        - merit: 1
        - relation: { who: asker, axis: trust, delta: -3 }
        - deed: { summary: 적대 무리에 가족이 있는 동료를 상관에게 알렸다, tags: [betrayal, diligence], severity: 2, privacy: semi_private }

- id: wt_face_across
  title: 닮은 얼굴
  tags: [world]
  when:
    segments: [morning, day, evening]
    zone_owner: [none, other]
    day_gte: 4
  cast:
    known: { known: true, faction: own }
    stranger: { tie: { of: known, kinds: [sibling, parent, child], cross: true } }
  setup: "{stranger:은/는} 다른 무리 사람이다. 그런데 웃을 때 눈가가 {known:과/와} 똑같다. 그쪽도 당신의 완장을 보고 멈칫한다."
  ai_direction: 두 사람은 가족이다 (주인공은 아직 모른다. 닮았다는 것만 보인다). 이 사람은 저쪽 무리에서 가족 소식을 듣고 싶어 한다. 캐물으면 판정으로 털어놓는다.
  choices:
    - id: ask
      label: 혹시 아는 사람이 있냐고 묻는다
      check: persuade
      outcomes:
        success:
          - reveal_tie: { who: stranger, other: known }
          - relation: { who: stranger, axis: trust, delta: 1 }
        partial:
          - belief: { fact: "{stranger}은(는) 당신 무리에 아는 사람이 있는 눈치다. 이름은 말하지 않았다", source: seen }
        miss:
          - relation: { who: stranger, axis: trust, delta: -1 }
    - id: pass
      label: 모른 척 지나간다
      effects: []
