  setup: "{climber:이/가} 섬 서쪽 절벽 아래서 밧줄을 어깨에 감는다. \"바닷새가 알을 깠어. 올라갈 사람? 아래서 줄만 잡아 줘도 돼.\" 절벽 중턱에 하얀 새똥 자국과 둥지가 줄지어 있다."
  ai_direction: 설다빈은 겁이 없고 손이 빠르다. 절벽 알 따기는 젊은 경비조의 놀이 반 일 반이다. 떨어지면 크게 다친다. 다빈은 위에서 섬을 내려다보는 걸 좋아한다 (저장고 뒤쪽이 보인다고 지나가듯 말할 수도 있다).
