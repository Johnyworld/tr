  ai_direction: 한수자는 늘 웃는다. 섬 사람들은 의장을 진심으로 사랑한다. 이 장면은 섬의 겉이 가장 아름다운 순간이다. 의장은 새 식구의 이름을 기억하고 부른다. 잔치 이야기에 들뜬 사람들 사이로, 노인 몇은 박수를 치지 않는다.
