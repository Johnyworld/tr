  setup: "섬 남쪽 갯벌을 막아 만든 소금밭에 하얀 결정이 피었다. {salter:이/가} 고무래로 소금을 긁어모으며 땀을 닦는다. \"오늘 같은 볕은 겨울 오기 전 마지막이야. 거들면 한 줌 줄게.\""
  ai_direction: 소금은 섬의 큰 재산이다 (생선을 절이고, 뭍과 거래한다). 일은 지루하고 볕이 따갑다. 일꾼은 말이 없지만 일 잘하는 사람을 오래 기억한다.
  choices:
    - id: rake
      label: 고무래를 받아 함께 긁는다
