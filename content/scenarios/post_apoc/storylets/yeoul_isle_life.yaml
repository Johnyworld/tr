- id: yl_notice_board
  title: 의회의 공고
  tags: [world]
  when:
    zones: [yeoul_isle]
    factions: [faction_y]
    segments: [morning]
    # 플레이 테스트 12: 부두에서 상자를 맞추는 중에 "식당 문에 새 종이가 붙었다". 보초·일하는 중에는 열지 않는다
    activities_none: [guard_duty, work]
    day_gte: 2
    flags_none: [yl_notice_done]
  setup: "식당 문에 새 종이가 붙었다. 단정한 글씨다. '섬 식구 여러분께. 겨울을 앞두고 모든 식구의 쓸모를 다시 살핍니다. 아픈 데가 있으면 숨기지 말고 진료소에 알려 주세요. 의회는 여러분 모두를 아낍니다.' 사람들이 읽고 고개를 끄덕이며 지나간다."
  ai_direction: 공고는 진심처럼 읽힌다. 대부분의 섬 사람은 이것을 돌봄으로 받아들인다. 몇몇 노인은 공고 앞에서 오래 서 있지 않는다. 아픈 데를 숨기는 것이 오히려 나은지, 알리는 것이 나은지 섬 사람마다 생각이 다르다 (아무도 소리 내 말하지 않는다).
  choices:
    - id: read
      label: 끝까지 읽고 지나간다
      effects:
        - set_flag: yl_notice_done
        - belief: { fact: "의회가 겨울을 앞두고 섬 식구 모두의 쓸모를 다시 살핀다고 공고했다. 아픈 데가 있으면 진료소에 알리라고 한다", source: seen }
    - id: watch_old
      label: 공고를 피해 걷는 노인들을 지켜본다
      check: insight
      outcomes:
        success:
          - set_flag: yl_notice_done
          - set_flag: y_looking
          - belief: { fact: "의회의 공고 앞을 노인들은 고개를 숙이고 지나간다. 다리를 저는 노인 하나는 공고를 본 뒤로 지팡이를 숨기고 다닌다", source: seen }
        partial:
          - set_flag: yl_notice_done
          - belief: { fact: "의회의 공고를 읽는 섬 사람들의 얼굴이 다 밝지만은 않았다", source: seen }
        miss:
          - set_flag: yl_notice_done

- id: yl_quarantine_new
  title: 검역 막사의 새 얼굴
  tags: [world]
  when:
    zones: [yeoul_isle]
    factions: [faction_y]
    segments: [day, evening]
    # 플레이 테스트 12: 갯골 바위틈을 뒤지는 중에 "당신이 지나가자". 보초·뒤지는 중에는 열지 않는다
    activities_none: [guard_duty, search]
    day_gte: 3
    flags_none: [yl_quarantine_done]
  cast:
    newcomer: { extra: refugee, label: 검역 막사의 새 사람 }
  setup: "검역 막사 철망 너머에 뭍에서 온 사람 하나가 앉아 있다. 사흘째 저렇게 바다만 본다. 당신이 지나가자 {newcomer:이/가} 철망을 붙잡는다. \"여기… 정말 다들 배불리 먹어요? 우리 애들도 데려올 수 있어요?\""
  ai_direction: 검역 막사는 뭍에서 들어온 사람이 쓸모를 심사받기 전 머무는 곳이다. 이 사람은 자식들을 뭍에 두고 혼자 건너왔다. 심사에 붙을지는 모른다. 섬 규칙상 바깥 사람의 가족을 데려오는 일은 의회가 정한다 (거의 허락하지 않는다).
  choices:
    - id: comfort
      label: 쓸모를 보여 주면 된다고, 심사 요령을 일러 준다
      effects:
        - set_flag: yl_quarantine_done
        - relation: { who: newcomer, axis: trust, delta: 2 }
        - deed: { summary: 검역 막사의 뭍 사람에게 심사 요령을 일러 주었다, tags: [mercy], severity: 1, privacy: semi_private }
    - id: truth
      label: 가족을 데려오는 건 의회가 거의 허락하지 않는다고 말해 준다
      effects:
        - set_flag: yl_quarantine_done
        - relation: { who: newcomer, axis: trust, delta: 1 }
        - body: { track: nerves, delta: 1 }
        - belief: { fact: "검역 막사의 뭍 사람은 자식들을 뭍에 두고 혼자 건너왔다. 가족을 데려오는 건 거의 허락되지 않는다고 하자 철망을 놓고 주저앉았다", source: seen }
    - id: pass
      label: 바깥 사람과 말을 섞지 않는다는 규칙을 떠올리고 지나간다
      effects:
        - set_flag: yl_quarantine_done
        - merit: 1

- id: yl_haesol_questions
  title: 해솔의 질문
  tags: [world]
  when:
    zones: [yeoul_isle]
    factions: [faction_y]
    segments: [day, evening]
    day_gte: 2
    flags_none: [yl_haesol_q_done]
  cast:
    girl: { ids: [y_haesol] }
  setup: "그물 바늘을 손가락에 끼운 {girl:이/가} 당신 옆에 털썩 앉는다. \"뭍은 어때요? 진짜 감염체가 골목마다 있어요? 학교 같은 건 아직 있어요? 버스는요?\" 질문이 끝이 없다. \"난 섬에서 태어나서 한 번도 못 나가 봤어요.\""
  ai_direction: 윤해솔은 호기심이 많고 말이 많다. 뭍을 무서워하면서도 동경한다. 어른들은 해솔에게 뭍 이야기를 하지 말라고 한다. 해솔의 어머니 윤미옥은 의회에서 창고를 맡는다. 해솔은 섬의 진실을 전혀 모른다.
  choices:
    - id: tell
      label: 뭍의 이야기를 있는 그대로 들려준다
      effects:
        - set_flag: yl_haesol_q_done
        - relation: { who: girl, axis: affection, delta: 2 }
        - relation: { who: girl, axis: trust, delta: 1 }
    - id: soft
      label: 무서운 얘기는 빼고 좋은 기억만 들려준다
      effects:
        - set_flag: yl_haesol_q_done
        - relation: { who: girl, axis: affection, delta: 2 }
    - id: ask_her
      label: 섬에서 사라진 사람을 본 적 있느냐고 되묻는다
      check: persuade
      outcomes:
        success:
          - set_flag: yl_haesol_q_done
          - set_flag: y_looking
          - belief: { fact: "윤해솔이 말했다. 뭍으로 내보내진 친구 할머니가 떠나던 밤, 배 소리는 못 들었는데 저장고 쪽에서 문 닫는 소리가 났다고. 엄마한테 말했더니 다시는 그 얘기를 하지 말랬다", source: report }
        partial:
          - set_flag: yl_haesol_q_done
          - belief: { fact: "윤해솔은 내보내진 사람들 얘기를 하려다 '엄마가 그런 얘기 하지 말랬어요' 하고 입을 다물었다", source: report }
        miss:
          - set_flag: yl_haesol_q_done
          - relation: { who: girl, axis: affection, delta: -1 }

- id: yl_doctor_round
  title: 진료소의 검진
  tags: [world]
  when:
    zones: [yeoul_isle]
    factions: [faction_y]
    segments: [morning, day]
    # 플레이 테스트 12: 망루·검역 막사 보초 중에 "청진기를 당신 가슴에 댄다". 보초를 서는 동안에는 열지 않는다
    activities_none: [guard_duty]
    day_gte: 4
    flags_none: [yl_doctor_done]
  cast:
    doctor: { ids: [py_cheolho] }
  setup: "{doctor:이/가} 뿔테 안경을 고쳐 쓰고 청진기를 당신 가슴에 댄다. 조끼 주머니의 약병들이 딸그락거린다. \"숨 크게. 좋아요. 다친 데는? 뭍에서 생긴 흉터는 다 적어야 해요. 의회에서 받아 가니까.\""
  ai_direction: 빈철호는 오래된 의사이고 섬 사람을 정성껏 돌본다. 그의 기록은 의회가 쓸모를 재는 데 쓴다 (그도 그걸 안다). 그는 그 사실을 불편해하지만 말하지 않는다. 숨기는 상처가 있으면 그는 알아챈다.
  choices:
    - id: honest
      label: 아픈 데를 숨김없이 말한다
      effects:
        - set_flag: yl_doctor_done
        - relation: { who: doctor, axis: trust, delta: 1 }
        - belief: { fact: "섬 의사 빈철호가 검진 기록을 의회에 올린다고 했다. 다친 데를 숨김없이 말했다", source: seen }
    - id: hide
      label: 다친 데는 없다고 한다
      check: deceive
      outcomes:
        success:
          - set_flag: yl_doctor_done
          - belief: { fact: "섬 의사 빈철호는 내가 말한 대로 적었다. 펜을 놓으며 '쓸모 기록은 짧을수록 좋아요'라고 작게 말했다", source: seen }
        partial:
          - set_flag: yl_doctor_done
          - relation: { who: doctor, axis: trust, delta: -1 }
        miss:
          - set_flag: yl_doctor_done
          - set_flag: y_suspected
          - belief: { fact: "섬 의사 빈철호가 숨긴 상처를 짚어 냈다. 기록 옆에 무언가를 덧적었다", source: seen }
    - id: ask
      label: 기록을 의회가 어디에 쓰느냐고 묻는다
      check: insight
      outcomes:
        success:
          - set_flag: yl_doctor_done
          - set_flag: y_looking
          - belief: { fact: "빈철호는 한참 말이 없다가 '겨울 전에 기록이 짧은 사람이 오래 남아요'라고만 했다. 손이 떨렸다", source: report }
        partial:
          - set_flag: yl_doctor_done
          - belief: { fact: "빈철호는 '돌보려고 쓰는 거지요'라고 했다. 눈을 마주치지 않았다", source: report }
        miss:
          - set_flag: yl_doctor_done

