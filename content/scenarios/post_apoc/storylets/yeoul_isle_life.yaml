# 여울섬의 나날 (기획서 9.12). 섬은 외딴곳이라 도시 공통 이야기가 빠진다: 여기 이야기는 모두 zones에 yeoul_isle을 직접 적는다
# 섬 식구(faction_y)라면 어느 시나리오에서 왔든 열린다 (새 식구 시나리오, 입도 심사를 통과한 사람)
# 겉(넉넉함, 바다 일, 다정한 이웃)이 대부분이고 속은 틈으로만 비친다 (빈자리, 지켜보는 눈, 쓸모를 묻는 말)
# 진실(내보낸 사람들, 잔치의 고기)은 이 묶음에서 드러나지 않는다. 그것은 y_islander 줄기와 lore(secret:y_feast_seen)의 몫이다

# ── 되풀이되는 섬의 일 ──

- id: yl_net_haul
  title: 새벽 그물
  tags: [world]
  repeatable: true
  cooldown_days: 3
  when:
    zones: [yeoul_isle]
    factions: [faction_y]
    segments: [dawn, morning]
    activities_none: [sleep, combat]
  cast:
    netter: { faction: own, here: true }
  setup: "물이 빠지기 시작한다. {netter:이/가} 갯바위 쪽 그물 말뚝을 가리킨다. \"손 비었으면 같이 당기자. 오늘은 무거울 것 같아.\" 줄이 손바닥에 감기고, 차가운 물이 무릎까지 차오른다."
  variants:
    - "안개가 낮게 깔린 새벽, 부두 끝에서 누가 손짓한다. {netter:이/가} 장화를 고쳐 신으며 말한다. \"그물 걷을 사람 하나 모자라.\""
    - "밤새 친 그물이 물살에 늘어져 있다. {netter:이/가} 소매를 걷는다. \"셋에 당겨. 하나, 둘…\""
  ai_direction: 섬의 바다 일은 고되지만 넉넉하다. 그물이 차면 다들 웃는다. 손이 서툴면 잔소리를 듣지만 쫓겨나지는 않는다. 그물 걷는 동안 오가는 말은 물때, 날씨, 저녁 국 이야기다.
  choices:
    - id: haul
      label: 줄을 잡고 같이 당긴다
      check: athletics
      outcomes:
        success:
          - give_item: { item: raw_fish, quantity: 2 }
          - relation: { who: netter, axis: respect, delta: 1 }
          - deed: { summary: 섬의 새벽 그물을 함께 걷었다, tags: [diligence], severity: 1, privacy: public }
        partial:
          - give_item: { item: raw_fish, quantity: 1 }
          - soak: true
        miss:
          - soak: true
          - body: { track: cold, delta: 1 }
          - relation: { who: netter, axis: affection, delta: 1 }
    - id: mend
      label: 찢어진 그물코를 대신 깁는다
      check: improvise
      outcomes:
        success:
          - relation: { who: netter, axis: trust, delta: 1 }
          - standing: 1
        partial:
          - relation: { who: netter, axis: affection, delta: 1 }
        miss:
          - delay: 60
    - id: pass
      label: 오늘은 다른 일이 있다고 한다
      effects: []

- id: yl_soup_line
  title: 식당의 저녁 줄
  tags: [world]
  repeatable: true
  cooldown_days: 3
  when:
    zones: [yeoul_isle]
    factions: [faction_y]
    segments: [evening]
  cast:
    neighbor: { faction: own, here: true }
  setup: "식당 앞에 줄이 길다. 솥에서 김이 오르고, 아이들이 그릇을 두드린다. 앞에 선 {neighbor:이/가} 돌아보며 웃는다. \"오늘도 고생했어. 국 넉넉하대. 두 그릇 받아도 아무도 뭐라 안 해.\""
  variants:
    - "저녁 종이 울린다. 식당 긴 탁자마다 사람이 꽉 찬다. {neighbor:이/가} 옆자리를 손바닥으로 툭툭 친다. \"여기 앉아.\""
    - "비 오는 저녁, 식당 안은 김과 사람 냄새로 따뜻하다. {neighbor:이/가} 당신 그릇에 자기 몫의 감자 하나를 옮겨 준다. \"난 배불러.\""
  ai_direction: 섬의 저녁은 정말로 따뜻하다. 뭍에서 온 사람은 이 넉넉함에 처음엔 어리둥절하다. 오가는 이야기는 오늘 일, 아이들, 날씨, 겨울 잔치에 누가 불릴지 하는 들뜬 추측. 내보내진 사람 이야기가 나오면 다들 잠깐 조용해졌다가 화제를 돌린다.
  choices:
    - id: sit
      label: 옆에 앉아 오늘 일을 이야기한다
      effects:
        - body: { track: hunger, delta: -1 }
        - relation: { who: neighbor, axis: affection, delta: 1 }
        - body: { track: nerves, delta: -1 }
    - id: ask_feast
      label: 겨울 잔치에는 누가 불리느냐고 묻는다
      effects:
        - body: { track: hunger, delta: -1 }
        - belief: { fact: "섬 사람들은 겨울 잔치에 불리는 것을 큰 영광으로 여긴다. 누가 불릴지는 의회가 정하고, 다들 은근히 기다린다", source: report }
    - id: eat_alone
      label: 그릇을 들고 바닷가로 나가 혼자 먹는다
      effects:
        - body: { track: hunger, delta: -1 }

- id: yl_shore_watch_night
  title: 해안 경비의 밤
  tags: [world]
  repeatable: true
  cooldown_days: 4
  when:
    zones: [yeoul_isle]
    factions: [faction_y]
    segments: [night]
    activities: [guard_duty, wait, rest, brief]
  cast:
    partner: { faction: own, here: true }
  setup: "등대 불빛이 바다를 한 바퀴씩 쓴다. 같이 선 {partner:이/가} 손난로 대신 입김을 손에 불며 묻는다. \"저기, 물 위에 뭐 떠 있지 않아?\" 검은 물결 사이로 무언가가 잠깐 반짝인다."
  variants:
    - "자정이 넘은 부두. {partner:이/가} 쌍안경을 건넨다. \"뭍 쪽에 불이 하나 켜졌다 꺼졌어. 세 번째야.\""
    - "파도 소리만 들리는 밤이다. {partner:이/가} 꾸벅 졸다가 고개를 든다. \"방금 노 젓는 소리 났지?\""
  ai_direction: 대개는 아무것도 아니다 (떠내려온 나무, 바다새, 물안개). 가끔은 정말 뭍에서 다가오는 배다 (밀항선, 거래선, 피난민). 무엇이었는지는 판정 결과로 가린다. 섬 경비는 바깥 사람을 들이지 않는 것이 일이다.
  choices:
    - id: look
      label: 등대 불빛이 다시 돌 때를 기다려 살핀다
      check: sense_danger
      outcomes:
        success:
          - merit: 1
          - relation: { who: partner, axis: respect, delta: 1 }
          - belief: { fact: "해안 경비 밤에 뭍 쪽에서 다가오던 작은 배를 먼저 봤다. 섬 경비의 신호를 보자 배는 돌아갔다", source: seen }
        partial:
          - belief: { fact: "해안 경비 밤, 물 위에 무언가 떠 있었다. 떠내려온 나무였는지 배였는지 끝내 알 수 없었다", source: seen }
        miss:
          - body: { track: cold, delta: 1 }
    - id: talk
      label: 별것 아니라며 같이 이야기나 한다
      effects:
        - relation: { who: partner, axis: affection, delta: 1 }
        - body: { track: nerves, delta: -1 }
    - id: shout
      label: 종을 쳐서 다른 경비를 부른다
      effects:
        - relation: { who: partner, axis: trust, delta: -1 }
        - belief: { fact: "해안 경비 밤에 종을 쳤지만 떠내려온 나무였다. 경비조장이 다음엔 확인하고 치라고 했다", source: seen }

- id: yl_tide_flats
  title: 썰물의 갯벌
  tags: [world]
  repeatable: true
  cooldown_days: 4
  when:
    zones: [yeoul_isle]
    factions: [faction_y]
    segments: [morning, day]
    # 플레이 테스트 12: 망루·검역 막사 보초 중에 "거기 파 봐". 보초를 서는 동안에는 열지 않는다
    activities_none: [guard_duty]
  cast:
    kid: { extra: y_villager, label: 갯벌의 섬 사람 }
  setup: "물이 멀리 빠졌다. 갯벌 위로 섬 사람들이 호미와 바구니를 들고 흩어진다. {kid:이/가} 진흙 묻은 손으로 구멍 하나를 가리킨다. \"거기 파 봐. 큰 놈 있다.\""
  variants:
    - "썰물에 드러난 바위마다 굴이 붙었다. {kid:이/가} 칼끝으로 하나를 따서 내민다. \"먹어 봐. 이게 섬 맛이야.\""
  ai_direction: 갯벌 일은 섬에서 가장 한가롭고 즐거운 일이다. 물이 들어오는 때를 놓치면 위험하다는 것을 섬 사람은 다 안다. 바위 쪽 깊은 갯골은 아무도 가지 않는다 (이유는 묻지 않는다).
  choices:
    - id: dig
      label: 바구니를 받아 조개를 캔다
      check: scavenge
      outcomes:
        success:
          - give_item: { item: raw_fish, quantity: 2 }
          - relation: { who: kid, axis: affection, delta: 1 }
        partial:
          - give_item: { item: raw_fish, quantity: 1 }
        miss:
          - soak: true
          - delay: 60
    - id: far_rocks
      label: 아무도 가지 않는 바위 쪽 갯골을 묻는다
      effects:
        - belief: { fact: "섬 사람들은 갯벌 끝 바위 쪽 깊은 갯골에는 가지 않는다. 물살이 세서라고만 한다", source: report }
    - id: rest
      label: 갯바위에 앉아 햇볕을 쬔다
      effects:
        - body: { track: nerves, delta: -1 }

- id: yl_kitchen_help
  title: 부엌의 손
  tags: [world]
  repeatable: true
  cooldown_days: 5
  when:
    zones: [yeoul_isle]
    factions: [faction_y]
    segments: [morning, day]
    # 플레이 테스트 12: 망루·검역 막사 보초 중에 "손 놀면 감자 좀 깎아 줘요". 보초를 서는 동안에는 열지 않는다
    activities_none: [guard_duty]
  cast:
    cook: { ids: [py_narae] }
  setup: "식당 뒤 부엌에서 {cook:이/가} 김 속에서 소리친다. \"거기! 손 놀면 감자 좀 깎아 줘요. 오늘 백 그릇은 나가야 돼.\" 큰 솥 셋이 한꺼번에 끓고 있다."
  variants:
    - "{cook:이/가} 부엌문을 발로 밀어 열고 생선 상자를 내민다. \"비늘 칠 줄 알아요? 몰라도 돼요, 가르쳐 줄게.\""
  ai_direction: 변나래는 바쁘고 다정하고 말이 빠르다. 부엌은 섬의 자랑이다. 그는 의회 저장고에서 내려오는 고기를 받기만 하고 묻지 않는다 (무엇인지 모른다). 일을 도우면 섬 사람들 사정을 수다로 듣는다.
  choices:
    - id: peel
      label: 칼을 받아 일을 돕는다
      check: improvise
      outcomes:
        success:
          - relation: { who: cook, axis: affection, delta: 1 }
          - relation: { who: cook, axis: trust, delta: 1 }
          - standing: 1
          - body: { track: hunger, delta: -1 }
        partial:
          - relation: { who: cook, axis: affection, delta: 1 }
          - body: { track: hunger, delta: -1 }
        miss:
          - wound: { steps: 1, cause: 부엌칼에 손을 베었다 }
          - relation: { who: cook, axis: affection, delta: 1 }
    - id: gossip
      label: 일손을 거들며 요즘 섬 소식을 묻는다
      effects:
        - relation: { who: cook, axis: affection, delta: 1 }
        - belief: { fact: "부엌의 변나래가 수다로 섬 사정을 들려주었다. 누가 아프고, 누가 겨울 잔치에 불릴 것 같은지 섬 사람들은 다 안다", source: rumor }
    - id: decline
      label: 경비조 일이 있다며 사양한다
      effects: []

- id: yl_watcher_eyes
  title: 의회의 눈
  tags: [world]
  repeatable: true
  cooldown_days: 6
  when:
    zones: [yeoul_isle]
    factions: [faction_y]
    segments: [day, evening]
    day_gte: 3
  cast:
    eye: { extra: y_watcher, label: 늘 근처에 있는 사람 }
  setup: "오늘만 세 번째다. {eye:이/가} 그물 창고 앞에, 식당 창가에, 이번엔 부두 기둥 옆에 서 있다. 눈이 마주치자 다정하게 손을 든다. \"수고가 많네요. 요즘 잠은 잘 자요?\""
  variants:
    - "{eye:이/가} 당신이 하던 일 옆에 쪼그려 앉는다. \"뭍에 있을 때는 뭐 했어요? 그냥 궁금해서요.\" 손에 쥔 몽당연필이 무릎 위에서 멈춰 있다."
  ai_direction: 의회는 새 식구와 수상한 사람을 살핀다. 이 사람은 적의가 없다. 다정하게 묻고, 들은 대로 전한다. 대답이 섬을 의심하는 쪽이면 의회에 그대로 간다. 지켜본다는 사실을 들키는 것을 이 사람은 별로 개의치 않는다.
  choices:
    - id: cheerful
      label: 섬에 와서 잠도 잘 자고 배도 부르다고 웃는다
      check: deceive
      outcomes:
        success:
          - relation: { who: eye, axis: trust, delta: 1 }
          - clear_flag: y_suspected
        partial:
          - relation: { who: eye, axis: trust, delta: 1 }
        miss:
          - set_flag: y_suspected
          - belief: { fact: "늘 근처에 있는 섬 사람에게 웃어 보였지만, 그는 몽당연필로 무언가를 적었다", source: seen }
    - id: ask_back
      label: 왜 자꾸 따라다니느냐고 묻는다
      check: insight
      outcomes:
        success:
          - belief: { fact: "늘 근처에 있던 섬 사람은 '의회 어르신들이 새 식구 적응을 걱정하셔서요'라고 했다. 새 식구를 살피는 일을 맡은 사람이다", source: report }
        partial:
          - set_flag: y_suspected
          - belief: { fact: "따라다니는 이유를 묻자 섬 사람은 웃기만 했다. 다음 날 다른 얼굴이 같은 자리에 서 있었다", source: seen }
        miss:
          - set_flag: y_suspected
          - relation: { who: eye, axis: trust, delta: -1 }
    - id: ignore
      label: 못 본 척 일을 계속한다
      effects: []

- id: yl_driftwood
  title: 떠밀려온 것들
  tags: [world]
  repeatable: true
  cooldown_days: 5
  when:
    zones: [yeoul_isle]
    factions: [faction_y]
    segments: [dawn, morning]
  setup: "밤새 바람이 불었다. 섬 북쪽 자갈밭에 뭍에서 떠밀려 온 것들이 줄지어 걸렸다. 부서진 의자, 물 먹은 상자, 비닐에 싸인 무언가."
  variants:
    - "폭풍 다음 날 아침, 해안선을 따라 쓰레기 띠가 생겼다. 그 사이에서 녹슨 철제 상자 하나가 반쯤 모래에 묻혀 있다."
  ai_direction: 뭍에서 떠밀려 온 것들은 무너진 도시의 조각이다 (사진, 장난감, 신발 한 짝). 쓸 만한 것은 경비조가 의회 창고에 올리는 것이 규칙이지만, 작은 것은 다들 눈감는다. 무엇이 나오는지는 판정 결과대로.
  choices:
    - id: comb
      label: 자갈밭을 훑으며 쓸 만한 것을 줍는다
      check: scavenge
      outcomes:
        success:
          - give_item: { item: planks, quantity: 2 }
          - give_item: { item: duct_tape }
        partial:
          - give_item: { item: planks }
        miss:
          - soak: true
    - id: box
      label: 비닐에 싸인 꾸러미를 연다
      check: scavenge
      outcomes:
        success:
          - give_item: { item: canned_food }
          - give_item: { item: faded_photo }
        partial:
          - give_item: { item: faded_photo }
          - belief: { fact: "섬 북쪽 자갈밭에 떠밀려 온 꾸러미에는 젖은 가족사진 몇 장뿐이었다. 뭍의 누군가가 품고 있던 것이다", source: seen }
        miss:
          - wound: { steps: 1, cause: 꾸러미 속 깨진 유리에 손을 베었다 }
    - id: report
      label: 손대지 않고 경비조장에게 알린다
      effects:
        - merit: 1
        - deed: { summary: 떠밀려 온 물건을 손대지 않고 의회 창고에 올렸다, tags: [loyalty], severity: 1, privacy: public }

- id: yl_lighthouse_wind
  title: 등대 아래
  tags: [world]
  repeatable: true
  cooldown_days: 5
  when:
    zones: [yeoul_isle]
    factions: [faction_y]
    segments: [evening, night]
    activities_none: [sleep, combat]
  setup: "옛 등대 아래 바위에 앉으면 섬 전체가 내려다보인다. 식당 굴뚝 연기, 부두의 등불, 의회 저장고의 검은 지붕. 그 너머 바다 건너, 뭍은 불빛 하나 없이 캄캄하다."
  variants:
    - "바람이 세다. 등대 철문이 덜컹거린다. 바다 건너 뭍 어딘가에서 불길 같은 붉은 점이 하나 깜빡이다 사라진다."
  ai_direction: 혼자 있는 시간. 섬은 아름답고, 뭍은 멀다. 두고 온 것(사람, 무리, 옛 삶)을 떠올리는 장면으로 쓴다. 의회 저장고 지붕은 밤에도 굴뚝에서 가는 연기가 오른다 (이유는 모른다).
  choices:
    - id: breathe
      label: 바람을 맞으며 한참 앉아 있는다
      effects:
        - body: { track: nerves, delta: -1 }
        - body: { track: fear, delta: -1 }
    - id: mainland
      label: 뭍의 불빛을 세며 두고 온 것을 떠올린다
      effects:
        - body: { track: nerves, delta: -1 }
        - belief: { fact: "등대 아래에서 보면 뭍은 밤마다 거의 캄캄하다. 가끔 붉은 불빛이 깜빡인다", source: seen }
    - id: smoke
      label: 밤에도 연기가 오르는 저장고 굴뚝을 눈여겨본다
      effects:
        - set_flag: y_looking
        - belief: { fact: "의회 저장고 굴뚝에서는 밤에도 가는 연기가 오른다. 저장고에 불을 땔 일이 무엇인지 모르겠다", source: seen }

- id: yl_neighbor_roof
  title: 이웃의 지붕
  tags: [world]
  repeatable: true
  cooldown_days: 6
  when:
    zones: [yeoul_isle]
    factions: [faction_y]
    segments: [morning, day]
  cast:
    neighbor: { extra: y_villager, label: 지붕이 샌다는 이웃 }
  setup: "{neighbor:이/가} 양동이를 들고 찾아온다. \"어젯밤 비에 방이 다 젖었어. 손재주 있다며? 겨울 오기 전에 좀 봐 주면 내가 말린 생선 줄게.\""
  ai_direction: 섬 사람끼리 서로 손을 빌려주는 것은 흔하다. 일을 잘해 주면 그 소문이 의회 귀에도 들어간다 (섬에서는 그게 쓸모다). 이웃은 진심으로 고마워한다.
  choices:
    - id: fix
      label: 판자와 망치를 들고 올라간다
      check: carpentry
      outcomes:
        success:
          - give_item: { item: dried_fish, quantity: 2 }
          - relation: { who: neighbor, axis: affection, delta: 2 }
          - standing: 1
          - deed: { summary: 섬 이웃의 새는 지붕을 고쳐 주었다, tags: [diligence], severity: 1, privacy: public }
        partial:
          - give_item: { item: dried_fish }
          - relation: { who: neighbor, axis: affection, delta: 1 }
        miss:
          - wound: { steps: 1, cause: 젖은 지붕에서 미끄러졌다 }
          - relation: { who: neighbor, axis: affection, delta: 1 }
    - id: later
