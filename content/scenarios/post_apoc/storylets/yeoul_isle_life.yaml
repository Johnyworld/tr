  ai_direction: 진강호는 밤배를 띄우는 일을 맡지만 배가 어디에 닿는지는 모른다 (모른다고 믿고 싶어 한다). 요즘 그 물음이 그를 괴롭힌다. 그는 섬을 지키는 사람이라 의회를 의심하는 말을 소리 내 하지 않는다. 대답에 따라 그가 주인공을 믿는 정도가 달라진다.
  choices:
