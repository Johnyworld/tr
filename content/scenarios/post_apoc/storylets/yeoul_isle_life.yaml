  ai_direction: 감염체는 바다를 못 건넌다는 것이 섬의 믿음이다. 이것은 오래 물에 잠겨 거의 움직이지 못하지만 아직 살아 있다. 섬 사람들이 보면 큰 소동이 난다. 의회는 이 일을 조용히 덮고 싶어 한다.
