  ai_direction: 단호성은 말이 없다. 섬 사람들은 그가 저장고 일을 한다는 것만 안다. 그는 주인공에게 아무것도 말하지 않는다. 묻는 말에는 짧게, 화제를 돌린다. 비밀은 이 자리에서 드러나지 않는다 (불안한 느낌만 남긴다).
  choices:
