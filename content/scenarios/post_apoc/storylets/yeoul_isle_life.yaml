- id: yl_trade_boat
  title: 거래선이 들어온 날
  tags: [world]
  repeatable: true
  cooldown_days: 7
  when:
    zones: [yeoul_isle]
    factions: [faction_y]
    segments: [morning, day]
    day_gte: 2
  cast:
    porter: { extra: e_porter, label: 뭍에서 온 짐꾼 }
  setup: "뭍에서 거래선이 들어왔다. 나루상단 짐꾼들이 상자를 부두에 내린다. 섬 경비는 짐꾼들이 부두 밖으로 한 발짝도 나가지 못하게 선다. {porter:이/가} 담배를 물고 당신에게 눈짓한다. \"섬 양반, 뭍 소식 궁금하지 않소?\""
  ai_direction: 섬의 규칙은 바깥 사람과 말을 섞지 않는 것이다. 짐꾼은 뭍의 전황과 소문을 조금 안다. 짐꾼들은 섬 안을 본 적이 없고, 섬이 무엇을 내주는지(탄약)만 안다. 말을 오래 섞으면 누군가 본다.
  choices:
    - id: news
      label: 기둥 그늘에서 몇 마디 나눈다
      check: stealth
      outcomes:
        success:
          - overhear: { faction: other, source: rumor }
          - relation: { who: porter, axis: trust, delta: 1 }
        partial:
          - overhear: { faction: other, source: rumor }
          - set_flag: y_suspected
        miss:
          - set_flag: y_suspected
          - belief: { fact: "부두에서 뭍의 짐꾼과 말을 섞다가 경비조장에게 불려 갔다. 섬은 바깥 사람과 말을 섞지 않는다", source: seen }
    - id: trade
      label: 말린 생선을 내밀고 담배와 바꾼다
      effects:
        - take_item: { item: dried_fish }
        - give_item: { item: cigarettes }
    - id: rule
      label: 규칙대로 고개를 돌린다
      effects:
        - merit: 1

- id: yl_storm
  title: 바다가 뒤집히는 날
  tags: [world]
  repeatable: true
  cooldown_days: 10
  when:
    zones: [yeoul_isle]
    factions: [faction_y]
    weather: [rain, snow, cold_snap]
  cast:
    chief: { ids: [y_gangho] }
  setup: "하늘이 낮게 내려앉았다. 파도가 방파제를 넘는다. {chief:이/가} 빗속에서 소리친다. \"배 묶어! 그물 걷어! 창고 문 닫아!\" 부두에 매어 둔 배 한 척이 줄을 끊고 흔들린다."
  ai_direction: 폭풍은 섬의 진짜 적이다. 섬 사람들은 이럴 때 손발이 잘 맞는다. 배를 잃으면 섬 전체가 아까워한다. 진강호는 이런 날 가장 믿음직하다.
  choices:
    - id: rope
      label: 줄을 끊고 흔들리는 배에 뛰어든다
      check: athletics
      outcomes:
        success:
          - merit: 2
          - relation: { who: chief, axis: respect, delta: 2 }
          - soak: true
          - deed: { summary: 폭풍 속에 줄 끊긴 섬의 배를 붙잡았다, tags: [bravery], severity: 2, privacy: public }
        partial:
          - merit: 1
          - soak: true
          - wound: { steps: 1, cause: 폭풍 속 배를 붙잡다 뱃전에 부딪혔다 }
        miss:
          - soak: true
          - body: { track: cold, delta: 2 }
          - wound: { steps: 1, cause: 폭풍에 휩쓸려 방파제에 부딪혔다 }
    - id: nets
      label: 그물과 통발을 창고로 나른다
      effects:
        - merit: 1
        - soak: true
        - relation: { who: chief, axis: trust, delta: 1 }
    - id: shelter
      label: 아이들과 노인들을 식당으로 데려간다
      effects:
        - soak: true
        - deed: { summary: 폭풍 날 섬의 아이와 노인들을 식당으로 대피시켰다, tags: [mercy], severity: 1, privacy: public }

- id: yl_island_song
  title: 섬의 노래
  tags: [world]
  repeatable: true
  cooldown_days: 7
  when:
    zones: [yeoul_isle]
    factions: [faction_y]
    segments: [evening, night]
  cast:
    singer: { faction: own, here: true }
  setup: "저녁을 먹고 난 식당에 누가 기타 줄을 고른다. {singer:이/가} 첫 소절을 부르자 다들 따라 부른다. 바다가 우리를 지킨다는 노래다. 마지막 소절에서 다 같이 탁자를 두드린다. \"쓸모 있는 손은 굶지 않네.\""
  ai_direction: 섬의 노래는 섬을 지키는 마음이다. 다들 진심으로 부른다. 가사의 마지막 소절은 섬의 규칙을 노래로 만든 것이다. 노래가 끝나면 누군가 뭍에서 온 사람에게 뭍의 노래를 한 곡 청한다.
  choices:
    - id: sing
      label: 따라 부르고, 뭍의 노래도 한 곡 부른다
      effects:
        - relation: { who: singer, axis: affection, delta: 1 }
        - body: { track: nerves, delta: -1 }
    - id: listen
      label: 구석에서 듣기만 한다
      effects:
        - body: { track: nerves, delta: -1 }
    - id: lyric
      label: 마지막 소절의 뜻을 묻는다
      effects:
        - belief: { fact: "섬의 노래 마지막 소절은 '쓸모 있는 손은 굶지 않네'다. 섬 사람들은 그 소절에서 다 같이 탁자를 두드린다", source: seen }

- id: yl_salt_pans
