    - id: reassure
      label: 뭍은 넓으니 어딘가 잘 살고 있을 거라고 한다
      effects:
        - set_flag: yl_gangho_q_done
        - relation: { who: chief, axis: affection, delta: 1 }
    - id: push
      label: 배가 어디 닿는지 직접 따라가 본 적 있느냐고 되묻는다
      check: persuade
      outcomes:
        success:
          - set_flag: yl_gangho_q_done
          - set_flag: y_looking
          - relation: { who: chief, axis: trust, delta: 1 }
          - belief: { fact: "진강호는 밤배를 부두에서 띄우기만 하고, 노는 저장고지기 단호성이 젓는다고 했다. 배가 돌아오는 데 반 시간도 안 걸린다는 말을 하고는 스스로 놀란 얼굴이었다", source: report }
        partial:
